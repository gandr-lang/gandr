#:tombi toml-version = "v1.0.0"

# `status-level = "pass"` keeps every test's elapsed time on the local run, and
# the CI profile's JUnit report carries per-test durations, so timing outliers
# stay visible without a separate instrumentation pass.
[profile.default]
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate"
slow-timeout = { period = "30s", terminate-after = 4 }

# Start the hosted heavy tail first; the ci profile inherits these overrides.
# Priorities change scheduling only, never cases, domains or timeouts. The
# tables are the reviewed output of `mise run ci:timing`, which proposes each
# test's level from the enforcing lane's recent merge-queue durations.
[[profile.default.overrides]]
filter = "test(=corpus::every_width_composes_the_corpus_alike) or test(=parse::tests::arbitrary_source_parses_by_form_as_whole) or test(=session::corpus_tokens_cover_the_highlighted_bytes)"
priority = 100

[[profile.default.overrides]]
filter = "test(=cli::every_width_prints_the_serial_run) or test(=corpus::every_source_submits_as_the_walk_composes_it) or test(=forms::every_corpus_edit_script_submits_as_the_walk_composes_it) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds) or test(=parse::tests::form_split_parses_as_the_whole_source) or test(=session::every_corpus_report_is_published_where_the_walk_renders_it)"
priority = 90

[[profile.default.overrides]]
filter = "test(=acceptance::corpus_molds_to_zero_obligations) or test(=acceptance::corpus_parses_totally) or test(=acceptance::minimization_prefers_clean_readings) or test(=corpus::a_run_lowers_each_source_once) or test(=corpus::every_corpus_source_is_registered) or test(=corpus::focusing_is_total_on_the_model_corpus) or test(=corpus::focusing_is_total_on_the_pathological_corpus) or test(=corpus::l_machine_matches_the_outcome_snapshots_on_the_model_corpus) or test(=corpus::l_machine_matches_the_outcome_snapshots_on_the_pathological_corpus) or test(=corpus::the_fixture_root_settles_every_fixture) or test(=corpus::the_two_roots_exercise_every_row) or test(=forms::a_large_module_edit_script_submits_as_the_walk_composes_it) or test(=forms::every_generated_edit_submits_as_the_walk_composes_it) or test(=highlight::corpus_roles_match_the_golden) or test(=highlight::spans_partition_the_tile_bytes) or test(=incremental::incremental_equals_from_scratch) or test(=kernel_export::kernel_corpus_partition::corpus_partition_matches_the_manifest) or test(=parse::tests::a_parked_unit_joins_as_the_unit_it_parked) or test(=parse::tests::an_equal_identity_molds_an_equal_unit) or test(=parse::tests::corpus_parses_totally) or test(=tests::a_small_module_measures_every_edit_class)"
priority = 80

[[profile.default.overrides]]
filter = "test(=parse::tests::hostile_edits_reuse_only_equal_units)"
priority = 70

# The editor's typing scenario types every corpus source through the language
# server with specifications enforced: 118 s alone at `7922f2b`, longer under
# parallel load, against a default kill limit of 120 s; on a hosted runner it
# passes 300 s. Every profile inherits this override, so its limit is the
# enforcing profile's own (60 s × 10): the local gate stops losing the test to
# load, the hosted lanes keep the limit they had, and the rule stated below —
# at least twice the slowest enforcing test — holds everywhere until the
# specification cost falls. The plain run is unaffected: a limit is a ceiling,
# never a wait.
[[profile.default.overrides]]
filter = "test(=editor::scenarios::typing_each_corpus_source_keeps_every_answer_faithful)"
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# Nextest stores reports by profile, independently of Cargo's target directory.
# Separate names prevent the enforcing pass from overwriting the plain report.
# Enforced specifications cost the slowest tests up to three minutes on a
# hosted runner, and runner load stretches that further. The kill limit stays
# at least twice the slowest enforcing test; once the specification cost
# falls, this profile inherits the ci limit.
[profile.ci-enforcing]
inherits = "ci"
slow-timeout = { period = "60s", terminate-after = 10 }

# The instrumented enforcing run is a report, never a gate, and instrumentation
# multiplies the specification cost: the editor's whole-corpus scenarios ran
# 65–549 s and the typing scenario past its 600 s limit on the first hosted
# measurement (run 38410734551), five tests holding a 4560-test run for a
# quarter of an hour. They stay in every enforcing lane; coverage leaves them
# out, because each sweep drives the language server over the corpus through
# the same paths the per-feature tests execute, and a line is covered when
# either run reached it. Widen this filter the day a sweep is the only test
# reaching a line that matters.
[profile.coverage]
inherits = "ci-enforcing"
default-filter = "not test(editor::scenarios::)"
