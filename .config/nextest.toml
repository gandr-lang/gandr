#:tombi toml-version = "v1.0.0"

# Every test finishes within 30 s under every profile a gate runs — `default`
# locally, `ci` and `ci-enforcing` on each pull request and merge-queue entry —
# plain and with specifications enforced. A test over the bound is split,
# sampled or made cheaper; no profile a gate runs raises the limit for one.
# `status-level = "pass"` keeps every test's elapsed time on the local run, and
# the CI profile's JUnit report carries per-test durations, so timing outliers
# stay visible without a separate instrumentation pass.
[profile.default]
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate"
slow-timeout = { period = "30s", terminate-after = 1 }

[profile.ci]
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 1 }

[profile.ci.junit]
path = "junit.xml"

# Nextest stores reports by profile, independently of Cargo's target directory.
# Separate names prevent the enforcing pass from overwriting the plain report.
[profile.ci-enforcing]
inherits = "ci"

# The sweeps whole. A sweep drives the whole corpus through one feature and
# sits in a `sweeps` module, which is all this filter names: a new sweep joins
# by where it is written. Under every other profile a sweep visits its stated
# sample, so it never leaves the pull-request lanes; under this one it visits
# every source (`gandr-workflow-sweep` reads the profile's name) and prints
# what it counts — the hover coverage by node kind, the read-back census by
# class — as a report, held to no ceiling (#467). The nightly workflow runs
# it plain and enforced (`mise run ci:sweeps`), where the limit is the
# nightly budget, not the 30 s bound. The slowest whole sweep, the typing,
# measured 756 s enforced on four hosted cores (the table verdicts, 371 s
# plain); twenty minutes holds it with the margin a slow runner needs, and
# each lane's whole run, 14 and 7 minutes, sits inside its 60.
[profile.sweeps]
default-filter = "test(/(^|::)sweeps::/)"
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

# The instrumented enforcing run is a report, never a gate, and instrumentation
# multiplies the specification cost several times over, so its limit is its
# own: ten minutes, which the first hosted measurement's slowest test needed.
# The sweeps run their samples here, as in every pull-request lane.
[profile.coverage]
inherits = "ci-enforcing"
slow-timeout = { period = "60s", terminate-after = 10 }
