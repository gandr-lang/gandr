#:tombi toml-version = "v1.0.0"

# Every test finishes within 30 s, plain and with specifications enforced. A
# test over the budget is split, sampled or made cheaper; no profile a gate
# runs raises the budget for one. Locally (`default`) and in CI (`ci` and
# `ci-enforcing`, on each pull request and merge-queue entry) a test past the
# budget is marked slow and runs on, so a loaded host lengthens a gate and
# never fails it (#3912), and a slow test never dequeues a pull request:
# `mise run ci:slow-file` files it for triage (#3752). Only a test past
# 5 minutes, a hang, is killed and fails the run.
# `status-level = "pass"` keeps every test's elapsed time on the local run, and
# the CI profile's JUnit report carries per-test durations, so timing outliers
# stay visible without a separate instrumentation pass.
[profile.default]
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate"
slow-timeout = { period = "30s", terminate-after = 10 }

# Measured priorities (`mise run ci:timing`, crates/workflow-test-timing): the
# export gate's shards, 22.7–24.1 s each over queue runs 40316553727 to
# 40323490056, start first. They are now split in eight (#2547); the next
# window re-reads the level.
[[profile.default.overrides]]
filter = "test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_0) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_1) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_2) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_3) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_4) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_5) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_6) or test(=kernel_export::kernel_export_gate::the_kernel_export_exit_gate_holds_in_shard_7)"
priority = 70

[profile.ci]
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.ci.junit]
path = "junit.xml"

# Nextest stores reports by profile, independently of Cargo's target directory.
# Separate names prevent the enforcing pass from overwriting the plain report.
[profile.ci-enforcing]
inherits = "ci"

# The sweeps whole. A sweep drives the whole corpus through one feature and
# sits in a `sweeps` module, which is all this filter names: a new sweep joins
# by where it is written. Under every other profile but `nightly` a sweep
# visits its stated sample, so it never leaves the pull-request lanes; under
# this one it visits every source (`gandr-workflow-sweep` reads the profile's
# name) and prints what it counts — the hover coverage by node kind, the
# read-back census by class — as a report, held to no ceiling (#467). This
# profile is the local whole run and the records' rewrite (`mise run
# ci:recovery`); its limit is a slow local machine's.
[profile.sweeps]
default-filter = "test(/(^|::)sweeps::/)"
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 20 }

# The nightly run (`mise run ci:sweeps-nightly`), held to fifteen minutes
# summed over the whole workflow, twenty at the most, the sweeps job to its
# 504 s share, its 458 s in nightly 40667395217 scaled by 900/818 (#3013).
# A sweep too costly to visit the whole corpus inside its
# share rotates (`gandr-workflow-sweep`'s rotation), each over the nights it
# states beside its sample, sized from the nightly's timings: the sweeps share
# one count, seven, and a sweep whose night would pass half the share's test
# wall takes its own, so the typing cuts every source into sixty-eight parts,
# the hovers at every position rotate over seventeen and the token drops over
# thirteen. The six cheapest sweeps visit the corpus whole.
# nextest does not inherit a default filter, so the profile states it again.
# The limit is the slowest sweep's share of the budget, so a sweep that
# outgrows it fails as a timeout rather than passing slowly: a sweep's night
# is sized to at most 170 s.
[profile.nightly]
inherits = "sweeps"
default-filter = "test(/(^|::)sweeps::/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# The instrumented enforcing run is a report, never a gate, and instrumentation
# multiplies the specification cost several times over, so its limit is its
# own: ten minutes, which the first hosted measurement's slowest test needed.
# The sweeps run their samples here, as in every pull-request lane.
[profile.coverage]
inherits = "ci-enforcing"
slow-timeout = { period = "60s", terminate-after = 10 }

# A witnessed mutation run (`mise run mutants:witnessed`). A witness the
# default profile ends at five minutes fails, and a failed witness reads its
# mutant caught, so on a loaded machine a slow witness would catch what it
# misses. Nothing is ended here: cargo-mutants' own `--timeout` bounds each
# mutant and reads an overrun as a timeout. The sweeps run their samples.
[profile.mutants]
slow-timeout = { period = "60s" }
