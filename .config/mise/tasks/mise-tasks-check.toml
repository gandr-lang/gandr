# `.config/landing/rebase-cases.bash` builds a bare origin and scratch clones
# for each case. A `landing` that holds `main` stays. A `landing` with no
# commit past `main` fast-forwards to it. A fix on `main` moves the later
# landings onto `main`, with the merge kept, each new commit signed by a
# scratch key and each old commit noted with its new hash. A landing that
# conflicts with the fix exits 3, and `landing` stays as it was. A fetch that
# the remote refuses exits 1 before the rebase, and `landing` stays (#5627).
