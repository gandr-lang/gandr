# The checks a change selects (#4911): `.config/gate-scope/cases.json` holds
# `select.jq` over the table, a workflow-only change selecting no Rust check, a
# crate's source the whole wall and an unmapped path every check, and for the
# landing's gate (#5458) a crate's source keeping the light checks and
# `check:landing` and a corpus or extension source keeping the light checks
# alone. It holds
# `packages.jq` (#5014), #5007's diff scoping its one package, a `Cargo.lock`
# change the whole workspace and a change growing by its dependents, and
# `passed.jq` (#5076), a gated tree accepted, a changed tree refused, a
# reworded commit accepted, a gate that skipped a selected check refused,
# and a head stacked on the top refused for the gate before the stack (#5091).
# It holds `times.jq` (#5215), a gate's log giving each task's time, each
# suite's tests and the slowest tests, a test or a task two lines name
# counted once, and `budget.jq`, a gate on main past its budget filed, one
# at its budget within it, and a gate with no budget never past it.
# `.config/gate-scope/carry-cases.bash` builds scratch repositories (#5153): a
# restack onto a top that touches other files carries the gate to the new
# tree, a restack that changes the branch's patch carries none, and a head on
# the gated tree keeps its own record.
# `.config/gate-scope/select-cases.bash` builds scratch repositories (#5220):
# a working change and a commit of 4000 paths, a list longer than one
# argument holds, each select every check.
# Then `unmapped.jq` reads the live tasks: a check that builds or runs the
# toolchain outside every group of the table, or a group or the `landing`
# list naming no check, fails it. So does a check that builds `GATE_SCOPE`
# under `--cfg anodized_panic` without the workspace feature unification.
["check:gate-scope"]
description = "The table scoping `mise run check` maps a change to its checks, and every check that builds the toolchain sits in one of its groups"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
.config/cases/run.bash gate-scope .config/gate-scope/cases.json --programs .config/gate-scope --mode c --raw unmapped.jq
.config/gate-scope/carry-cases.bash
.config/gate-scope/select-cases.bash
findings=$(mise tasks ls --json \
  | jq '{tasks: [.[] | select(.name | startswith("check:")) | {name, run, depends, env}]}' \
  | jq -r -L .config/gate-scope -f .config/gate-scope/unmapped.jq)
if [[ -n $findings ]]; then
  printf '%s\n' "$findings" >&2
  exit 1
fi
echo "gate-scope check OK: $(jq length .config/gate-scope/cases.json) cases read as recorded; every check that builds the toolchain sits in a group of the table"
'''

