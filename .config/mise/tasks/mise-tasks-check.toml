# The account of what a change takes out of the tree (#6817). The owner's
# order of 2026-11-11: no deletion lands without the architect's sign-off.
# The dead-weight collectors landed 27 pull requests that took items, ledger
# rows and README lines out, and no body gave an account a reader could
# check. With a body and a base, the task reads the change from the base to
# HEAD (`.config/deletes/check.bash`). It computes the act of each item and
# test that leaves (`.config/deletes/acts.bash`, #7058): one whose body
# stands at an item that the head adds is moved or renamed, and needs no row
# and no sign-off. It refuses each other thing that leaves with no row in the
# body's `## Deletes`, a `moved` or `renamed` row of an item whose body
# stands nowhere in the head, a `deleted`, `merged` or `narrowed` row of an
# item that it reads as moved, a `deleted` row with no reasoning, an item
# that the crate's README names, an item of a crate with no consumer, a
# `deleted`, `merged` or `narrowed` row with no sign-off of the architect at
# a head that the change keeps, a test whose text changes with no row in
# `## Preserved and changed`, and a `refactor` with no `## Preserved and
# changed`. `pr:open` runs it before the push. The merge queue runs it with
# `--rows-only` for each entry of the group (`.config/deletes/queue.bash`
# over `.config/queue/entries.bash`, #6839), since a green group lands every
# entry below it. Each entry's body is read once
# (`.config/queue/bodies.bash`, #6883) and serves the ledger's check too.
# Each side's records come from a cache keyed by each input that they read
# (`.config/deletes/records.bash`, #6823), and each miss builds in a run of
# its own (#6861). With no body, as in the gate, it runs the cases of
# `deletes.jq` (`.config/deletes/cases.json`), of the record run's settings
# (`.config/deletes/policy-cases.bash`), of the cache of records
# (`.config/deletes/records-cases.bash`), of the reading of each changed
# test (`.config/deletes/tests-cases.bash`), of the act of each item that
# leaves (`.config/deletes/acts-cases.bash`), of the patches that moved
# since a sign-off (`.config/deletes/moved-cases.bash`) and of the queue's
# walk, its bodies and its commit rules (`.config/queue/cases.bash`).
["check:deletes"]
description = "A body accounts for each item, test, ledger row and file its change takes out, with the architect's sign-off for each item whose body stands nowhere in the head; with no body, the rule's cases"
tools.jq = "1.8.1"
usage = '''
arg "[body]" help="the pull request body; with none, the task runs the rule's cases"
arg "[base]" help="the commit the change runs from to HEAD"
flag "--title <title>" help="the pull request title: a refactor carries ## Preserved and changed"
flag "--rows-only" help="read the rows, the sign-offs and the consumers alone, as the merge queue does"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -z ${usage_body:-} ]]; then
  .config/cases/run.bash deletes .config/deletes/cases.json --program .config/deletes/deletes.jq --mode r -L .config/bodies
  .config/deletes/policy-cases.bash
  .config/deletes/records-cases.bash
  .config/deletes/tests-cases.bash
  .config/deletes/acts-cases.bash
  .config/deletes/moved-cases.bash
  .config/queue/cases.bash
  echo "deletes check OK: $(jq length .config/deletes/cases.json) cases read as recorded"
  exit 0
fi
flags=()
if [[ ${usage_rows_only:-false} == true ]]; then flags+=(--rows-only); fi
if [[ -n ${usage_title:-} ]]; then flags+=(--title "$usage_title"); fi
.config/deletes/check.bash "${flags[@]}" "$usage_body" "${usage_base:?check:deletes takes the base with the body}"
'''

# The bench harness's readings (#3930). A run past the host's bound is recorded
# `past bound` and never retried larger, and Catt runs only at n = 2 and 3
# (#3855): a run misread as a time, or an example past n = 3 let through,
# would send a seat to rerun larger on a host it could exhaust. `bound.jq`
# decides a run past either bound. `row.jq` writes Catt's finished run's row,
# `stress.jq` what `bench:stress` prints for gandr's bounded check, and
# `dimension.jq` names an example's built-ins past n = 3. Each case in
# `.config/bench/cases.json` holds a recorded run or an example's text, and
# the row, the outcome or the built-ins it must give. Each case in
# `.config/bench/timed.json` runs a command under `timed.py`, the timer
# `bench:stress` reads its wall time and peak resident set from on Linux and
# macOS alike (#4191), and holds the status and the least peak it must give.
# The scaling account (#6879): `curve.jq` and `run.jq` read the wide host's
# measure, and `account.jq` writes the account's body, its moved rows and a
# fall. Each case in `.config/bench/scaling.json` holds a recorded measure or
# an account, and what it must give: a fall only for an idle row, a held row
# never compared, and a full body moving its oldest rows.
# `.config/bench/scaling-cases.bash` runs the pass over a stand-in measure: a
# measure that reads its stdin as ssh does still gives each hotpath width, and
# a failed measure pages once for its head.
["check:bench"]
description = "The bench harness writes each recorded run's row or outcome, past bound where a bound was met, and names each recorded example's built-ins past n = 3, the stress timer reports each recorded command's status and peak, the scaling account reads each recorded measure and writes each recorded account, and its pass measures each width and pages a failed measure once"
