# The queue on `landing` runs the blocking set alone (#5439).
# `.config/landing/jobs.jq` refuses six faults. The first is a job that runs
# in a merge group on `landing` outside the blocking set, the brake (#5442)
# and the run's setup.
# The second is a check in that set that `check:landing` does not name. The
# third is a task of `check:landing` that no job of that set runs. The fourth
# is Clippy on a pull request on `landing`. The fifth is a build state that
# the nightly restores and that no job saves on a push to main whose queue
# run, the merge group into `landing`, holds none (#6790). The sixth is a
# job that can run on a push to `landing` outside the report lanes (#6993).
# Each case in `.config/landing/cases.json` gives its refusals. Then the jobs
# of `.github/workflows/landing-checks.yml`, anchors expanded, give none against the
# tasks that `check:landing` depends on, the states that
# `.github/workflows/nightly-sweeps.yml` restores and the branches of its `on.push`.
["check:landing-queue"]
description = "A merge group on landing runs only the run's setup, the brake and the tasks of check:landing, a pull request on landing runs no Clippy, and a push to landing runs the report lanes alone"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
.config/cases/run.bash landing .config/landing/cases.json --program .config/landing/jobs.jq --mode c
landing=$(mise tasks ls --json | jq -c '[.[] | select(.name == "check:landing") | .depends[]]')
states=$(yq -o=json 'explode(.) | [.jobs[].env.CI_BUILD_STATE | select(. != null)] | unique' .github/workflows/nightly-sweeps.yml | jq -c .)
pushes=$(yq -o=json '.on.push.branches // []' .github/workflows/landing-checks.yml | jq -c .)
refusals=$(yq -o=json 'explode(.) | .jobs' .github/workflows/landing-checks.yml | jq -c --argjson landing "$landing" --argjson states "$states" --argjson pushes "$pushes" '{jobs: ., landing: $landing, states: $states, pushes: $pushes}' | jq -r -f .config/landing/jobs.jq | jq -r '.[] | ".github/workflows/landing-checks.yml: \(.)"')
if [[ -n "$refusals" ]]; then
  printf '%s\n' "$refusals" >&2
  exit 1
fi
echo "landing queue check OK: $(jq length .config/landing/cases.json) cases read as recorded; a merge group on landing runs the setup, the brake and the $(jq length <<< "$landing") tasks of check:landing alone"
'''

# The landing rebase (#5441, `.config/landing/rebase.bash`) and its trigger
# (#6683, `.config/landing/fixes.bash`). `.config/landing/rebase-cases.bash`
# builds a bare origin and scratch clones for each case. A `landing` that
# holds `main` stays. One patch under two hashes on `main` and `landing` is
# no fix, so the trigger reads none and `landing` stays. A true fix on `main`
# goes on the newest head of `landing` that `integration` took, and only the
# commits above it move, with the merge kept, each new commit signed by a
# scratch key and each old commit noted with its new hash. A landing that
# conflicts with the fix exits 3, and `landing` stays as it was. A commit
# that `main` holds under another hash is not replayed (#5932). A fetch that
# the remote refuses exits 1 before the rebase, and `landing` stays (#5627).
# A branch of the merge queue's groups on `landing` holds the rebase until
# the branch goes, and past the wait the push names the group (#6553).
["check:landing-rebase"]
description = "The landing rebase keeps a landing that holds main, reads no fix in a copy, puts a true fix on the head that integration took and moves only the commits above it, signed and noted, stops on a conflict, stops before the rebase on a refused fetch, and waits while the merge queue builds a group on landing"
run = ".config/landing/rebase-cases.bash"

# The integration cycle's decisions (#5440, `ci:cycle`). `.config/
# integration/cycle.jq` decides a step: the verdict, the take and the start
# of the suite. A cancelled run gives no verdict, and nothing moves while a
# run goes on. A hollow failure that opens its head gives no verdict either
# (#6887), and `hollow.jq` names the failure whose jobs the step reads next.
# `known-red.jq` writes the known-red list: one row for a test
# that fails in two lanes, no row for a flaky pass, and an issue of its own
# for each failed test of the soundness suite. `brake.jq` decides the brake
# (#5442): verdicts after the newest pass count, a cancelled run does not,
# a lag at a limit lets the landings go on, and a `main` that holds
# `landing` lags by nothing. `runner.jq` decides the runner of the suite
# (#5526): an online runner with the label `integration` takes it, busy or
# not, and an offline runner, a runner without the label or a list the step
# cannot read gives the hosted runner. The head watcher of `landing`
# (#6587, `watch.bash`) reads three programs: `search.jq` halves the first
# parents between a green head and a red head until one commit stays,
# `owner.jq` writes the defect, the lane and the `FIX` page of a red check,
# and `gap.jq` reads how long `main` stands behind `landing` and pages past
# 45 minutes once for each head of `main`. Each case in
# `.config/integration/cases.json` names its program, its input and the
# compact JSON that the program gives. `.config/integration/token-cases.bash`
# runs `watch_token` over a stubbed gh (#6644): with no `GH_TOKEN`, the
# watcher's gate takes the token gh gives, a token already set stays, and a
# failed read leaves none. `.config/integration/reload-cases.bash` (#6653):
# each reading runs the checkout's `watch.bash`, and the service's checkout
# stands after a sweep of a lane's checkout and takes the new head.
# `.config/integration/gap-cases.bash` (#6675, #6944): the state holds a
# reading's gap before its gate runs, and a new gap and page each interval
# while it runs. `.config/integration/repaired-cases.bash`
# (#6679): a red check that a newer head of landing holds green runs no
# search, and a red there or an unmoved head runs it.
# `.config/integration/environment-cases.bash` (#6739, #6750):
# `check:gate-scope` on a green head reads no red check as the watcher's gate
# and as a lane's gate run it. `.config/integration/each-red-cases.bash`
# (#6750): the watcher's reading of a head with two red tests in two packages
# gives one line for each test, and a lane's scope keeps fail-fast.
# `.config/integration/fill-cases.bash` (#6861): the watcher fills the
# records cache of `check:deletes` over each package that the move to a green
# head touches, one at a time and in the background, and a newer green head
# stops the fill.
["check:integration"]
description = "The integration cycle's step, its read of a hollow failure, known-red list, brake and runner, and the head watcher's search, owner and gap, give each recorded case its output"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
.config/cases/run.bash integration .config/integration/cases.json --programs .config/integration --mode c
.config/integration/token-cases.bash
.config/integration/reload-cases.bash
.config/integration/gap-cases.bash
.config/integration/repaired-cases.bash
.config/integration/environment-cases.bash
.config/integration/each-red-cases.bash
.config/integration/fill-cases.bash
echo "integration check OK: $(jq length .config/integration/cases.json) cases read as recorded"
'''

# The commit rules over a branch's own commits (`.config/commits/lint.bash`,
# #2640), which `pr:open` and the pre-push tier run before a pull request
# exists. Each case in `.config/commits/cases.json` commits its commits on a
# fresh scratch repository as the agent identity, each with or without the
# trailers and with or without a change, and states whether the range is
# refused under its flag: a trailer-less copy of a merged commit is refused
# (the regression: #2613 carried one), an empty commit under `--empty`, and
# a closing keyword anywhere but its own `Closes #n` line (#2980), since
# GitHub closes the issue it names when the commit reaches main. A commit
# with a header and its trailers and no body is refused, and one with a body
# passes (#6628). A case with `push` runs the push tier
# (`.config/commits/push.bash`) instead, as
# if the commits were pushed to that ref: a branch's trailer-less commit is
# refused, and a notes ref, which shares no history with the trunk, passes
# (#5651). A `held` case gives the trunk a copy of each commit under another
# hash, as a rebase of `landing` gives them: the push tier passes them, and
# a commit whose patch the trunk lacks is still refused (#5932).
["check:commits"]
description = "The commit rules over a range refuse a trailer-less commit and, asked, an empty one; the push tier reads a branch and passes a notes ref"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
export COMMITLINT_CONFIG="$root/commitlint.config.mjs"
COMMITLINT_BIN=$(mise which commitlint)
export COMMITLINT_BIN
export GIT_AUTHOR_NAME=agent-shade GIT_AUTHOR_EMAIL=agent-shade@users.noreply.github.com
export GIT_COMMITTER_NAME=agent-shade GIT_COMMITTER_EMAIL=agent-shade@users.noreply.github.com
trailers=$'Assisted-by: LLM\nCo-authored-by: silvanshade <silvanshade@users.noreply.github.com>'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  repo="$scratch/$(jq -r '.name | @base64' <<< "$case" | tr -dc 'A-Za-z0-9' | cut -c1-24)"
  git init --quiet --initial-branch=main "$repo"
  git -C "$repo" config commit.gpgsign false
  git -C "$repo" commit --quiet --allow-empty -m 'chore(repo): the base' -m "$trailers"
  base=$(git -C "$repo" rev-parse HEAD)
  while IFS= read -r commit; do
    args=(--quiet --allow-empty -m "$(jq -r .message <<< "$commit")")
    if [[ $(jq -r .trailers <<< "$commit") == true ]]; then args+=(-m "$trailers"); fi
    if [[ $(jq -r .change <<< "$commit") == true ]]; then
      date +%s%N >> "$repo/file"
      git -C "$repo" add file
    fi
    git -C "$repo" commit --no-verify "${args[@]}"
  done < <(jq -c '.commits[]' <<< "$case")
  want=$(jq -r .exit <<< "$case")
  got=0
  push=$(jq -r '.push // empty' <<< "$case")
  if [[ -n $push ]]; then
    git -C "$repo" update-ref refs/remotes/origin/landing "$base"
    if [[ $(jq -r '.held // false' <<< "$case") == true ]]; then
      git -C "$repo" checkout --quiet -b held "$base"
      git -C "$repo" cherry-pick -x "$base..main" > /dev/null
      git -C "$repo" update-ref refs/remotes/origin/landing "$(git -C "$repo" rev-parse HEAD)"
      git -C "$repo" checkout --quiet main
    fi
    head=$(git -C "$repo" rev-parse HEAD)
    if [[ $push == refs/notes/* ]]; then
      git -C "$repo" notes --ref "$push" add -m 'moved' "$head"
      head=$(git -C "$repo" rev-parse "$push")
    fi
    out=$(cd "$repo" && GANDR_TRUNK=landing PRE_COMMIT_REMOTE_BRANCH="$push" PRE_COMMIT_TO_REF="$head" \
      "$root/.config/commits/push.bash" 2>&1) || got=$?
  else
    out=$(cd "$repo" && "$root/.config/commits/lint.bash" "$base" HEAD $(jq -r .flag <<< "$case") 2>&1) || got=$?
  fi
  if [[ $got != "$want" ]]; then
    printf 'commits case FAILED: %s\n  exit %s, wanted %s\n%s\n' "$name" "$got" "$want" "$out" >&2
    failed=1
  fi
done < <(jq -c '.[]' "$root/.config/commits/cases.json")
(( failed == 0 )) || exit 1
echo "commits check OK: $(jq length "$root/.config/commits/cases.json") cases read as recorded"
'''

