python .config/bench/timed.py --cases .config/bench/timed.json
echo "bench check OK: $(jq length .config/bench/cases.json) cases read as recorded, $(jq length .config/bench/scaling.json) scaling cases read as recorded, and $(jq length .config/bench/timed.json) commands timed as recorded"
