#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The wall. Every `check:*` task is one gate; `gate:all` fans out to all of
# them, and `check` to the share a landing runs before it opens.
# A gate enters this file when a weed appears that it would have caught, with
# the reason beside it, and never pre-emptively. A `check:*` task is a gate
# every contributor runs locally, idempotent and cheap relative to what it
# guards; reports and uploads (coverage, mutants, benches) live under `ci:` and
# are never globbed into `check`. A gate whose rule is a jq program held to
# recorded cases runs them through `.config/cases/run.bash` (#3039), never a
# loop of its own.

# The gate graph holds its lane's lock and one of the host's gate slots for
# its whole run, so at most `GANDR_GATE_SLOTS` (default 2) gates share a host,
# one per lane (`.config/mise/gate.bash`, #3057, #4911). A lane's second gate,
# or a third gate, waits, naming the holders, or with `--no-wait` refuses at
# once. A change that selects no check of the table's groups (Rust, corpus,
# extension) runs only light checks and takes no lock and no slot: it never
# waits behind a gate that builds the workspace.
#
# It is the landing's gate (#5458): `pr:open` runs it on a head that no gate
# passed on, and `pr:land` runs it again when a rebase changes the head's
# tree. Six lanes ran the full suite before each pull request opened, more
# load than the hosts carry, and the merge group runs every check on each
# group. So it runs the light checks, which take seconds, and of the heavy
# checks only Clippy and the compiler policy (`check:landing`). It runs no
# test, no sweep and no specification obligation. `gate:all` runs every check
# over the whole workspace.
#
# It runs those checks that the change selects
# (`.config/gate-scope/select.jq`, #4911): the paths the branch changes against
# its fork from `origin/$trunk` (`.config/pr-stack/trunk.bash`), mapped by
# `.config/gate-scope/table.json`. A
# workflow-only change runs no Rust check. The Rust checks it selects run over
# the packages the change touches and every package that depends on one
# (`.config/gate-scope/packages.jq`, #5014), passed as `GATE_SCOPE`; a change
# to the workspace's own configuration runs them over the whole workspace.
#
# A gate that passes records the tree of the work it read and the checks it
# ran (`.config/gate-scope/passed.bash`, #5076), and `pr:open` and `pr:land`
# gate a head whose tree no gate passed on. The tree is read before the
# checks run and again after them: when the work changed in between, nothing
# is recorded. The record also holds the gate's time (#5215): its wall time,
# each task's time and each suite's slowest tests, read from its standard
# error, which the gate keeps in `target/gate/<gate>.log`. The gate never
# blocks on its time.
#
# It first reads the claim of the unit its branch works
# (`.config/claims/taken.bash`, #5146): a branch `<lane>-<n>-…` whose issue #n
# holds no claim of that lane is refused before any check runs, and the
# refusal names `claim:take <n>`. A branch that works no unit reads nothing,
# and a failed read of the issue leaves the gate to run and says so.
[check]
description = "The landing's gate: the light checks, and Clippy with the compiler policy over the packages the change reaches, in one of the host's gate slots"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
usage = '''
flag "--no-wait" help="refuse at once, naming the holders, when the lane's lock or every gate slot on the host is held"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/mise/gate.bash
if [[ ${usage_no_wait:-false} == true ]]; then export GATE_NO_WAIT=1; fi
.config/claims/taken.bash
tree=$(.config/gate-scope/passed.bash tree)
selected=$(.config/gate-scope/select.bash --landing)
heavy=$(jq -r --arg selected "$selected" '[.groups[][]] as $heavy | [$selected | split("\n")[] | select(IN($heavy[]))] | length' .config/gate-scope/table.json)
if (( heavy > 0 )); then
  hold_gate_slot "mise run check"
  gate_bound
  echo "check: gate slot $gate_slot of $gate_slots in the lane $gate_lane, $gate_jobs build jobs" >&2
else
  echo "check: the change selects no Clippy or compiler policy check, so it takes no gate slot" >&2
fi
mapfile -t checks <<< "$selected"
echo "check: the landing's gate runs ${#checks[@]} of $(mise tasks ls --json | jq '[.[] | select(.name | startswith("check:"))] | length') checks (.config/gate-scope/table.json); the merge group and \`mise run gate:all\` run every one" >&2
GATE_SCOPE=$(.config/gate-scope/scope.bash)
export GATE_SCOPE
tasks=()
for check in "${checks[@]}"; do tasks+=("$check" :::); done
mkdir -p target/gate
SECONDS=0
{ MISE_TASK_TIMINGS=1 mise run --output prefix "${tasks[@]:0:${#tasks[@]}-1}" 2>&1 1>&3 3>&- | tee target/gate/check.log >&2; } 3>&1
.config/gate-scope/passed.bash record check "$tree" target/gate/check.log "$SECONDS" "${checks[@]}"
{% endraw %}'''

# The whole wall (#5014): every `check:*` task over the whole workspace, in
# one of the host's gate slots. It takes about half an hour, and the merge
# group runs it before every landing, so a change runs it only when no
# package set can scope it. It reads the claim of its branch's unit as
# `check` does. Its name keeps it out of the `check:*` glob, so it never runs
# itself. On main's tree its time is held to a budget (#5215): it runs
# `report:gate-time`, which files the gate past its budget, and a report that
# fails leaves the pass recorded.
["gate:all"]
description = "Every check over the whole workspace, about half an hour; the merge group runs it before every landing"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
usage = '''
flag "--no-wait" help="refuse at once, naming the holders, when the lane's lock or every gate slot on the host is held"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/mise/gate.bash
if [[ ${usage_no_wait:-false} == true ]]; then export GATE_NO_WAIT=1; fi
.config/claims/taken.bash
hold_gate_slot "mise run gate:all"
gate_bound
echo "gate:all: gate slot $gate_slot of $gate_slots in the lane $gate_lane, $NEXTEST_TEST_THREADS test threads and $gate_jobs build jobs" >&2
unset GATE_SCOPE
tree=$(.config/gate-scope/passed.bash tree)
mapfile -t checks < <(mise tasks ls --json | jq -r '.[] | .name | select(startswith("check:"))')
mkdir -p target/gate
SECONDS=0
{ MISE_TASK_TIMINGS=1 mise run --output prefix 'check:*' 2>&1 1>&3 3>&- | tee target/gate/gate-all.log >&2; } 3>&1
.config/gate-scope/passed.bash record gate:all "$tree" target/gate/gate-all.log "$SECONDS" "${checks[@]}"
if [[ $tree == "$(git rev-parse 'origin/main^{tree}' 2> /dev/null)" ]]; then
  REPORT_FILE=1 mise run report:gate-time || echo "gate:all: the report of main's gate time failed; the pass stays recorded" >&2
fi
{% endraw %}'''

# The local gate's time against its budget (#5215). The gate on main runs
# every check over the whole workspace, so its time compares from one run to
# the next. The task reads the newest record of `gate:all` on the tree of
# `origin/main` that holds a time, and `.config/gate-scope/budget.jq` holds
# it to its budget in `.config/gate-scope/budget.json`. Past the budget it
# files one issue through the `gate-time` template, or rewrites the one of its
# title, reopened when closed (`.config/issues/keep.bash`), with the new
# observation: the time, the slowest tasks and the slowest tests.
# Within the budget it writes nothing. Without REPORT_FILE set it prints the
# observation and writes nothing. `gate:all` on main's tree runs it with
# REPORT_FILE set, and a report that fails never fails the gate.
["report:gate-time"]
description = "Main's gate time against its budget, filed on one issue when past it"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/issues/keep.bash"
here=$root/.config/gate-scope
records=$(git rev-parse --path-format=absolute --git-common-dir)/gandr-gate
tree=$(git rev-parse 'origin/main^{tree}')
title="the local gate past its budget"
shopt -s nullglob
files=("$records/$tree"/*.json)
record=null
if (( ${#files[@]} > 0 )); then
  record=$(jq -s -c 'map(select(.gate == "gate:all" and .time != null and .carried == null)) | sort_by(.at) | last' "${files[@]}")
fi
if [[ $record == null ]]; then
  echo "report:gate-time: no gate:all on main's tree $tree recorded a time; run \`mise run gate:all\` on main" >&2
  exit 0
fi
verdict=$(jq -n -c --argjson record "$record" --slurpfile budget "$here/budget.json" '{record: $record, budget: $budget[0]}' | jq -c -f "$here/budget.jq")
if [[ $(jq -r .over <<< "$verdict") != true ]]; then
  jq -r '"report:gate-time: the gate on main took \(.fields.seconds) s, within its budget of \(.fields.budget) s"' <<< "$verdict"
  exit 0
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
jq -r .observation <<< "$verdict" > "$scratch/observation.md"
if [[ -z ${REPORT_FILE:-} ]]; then
  cat "$scratch/observation.md"
  echo "report:gate-time: main's gate is past its budget; REPORT_FILE unset, nothing written" >&2
  exit 0
fi
fields=$(jq -c .fields <<< "$verdict")
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
jq -R -s -r -L "$root/.config/issues" --argjson fields "$fields" --rawfile observation "$scratch/observation.md" \
  'include "template"; render($fields; $observation)' "$root/.config/issues/templates/gate-time.md" > "$scratch/body.md"
mise run --quiet body:check --title "$title" "$scratch/body.md" >&2
issue_keep "$repo" "$title" "$(issue_found "$repo" "$title")" 1 "$scratch/body.md" \
  mise run --quiet issue:file "$title" "$scratch/observation.md" kind:performance area:workflow --template gate-time --fields "$fields"
{% endraw %}'''

# Every corpus source and crate fixture stays in the gandr formatter's
# layout (#492): one process over the fixture subtrees of `corpus/`, the
# library `library/std` and every `.gandr` file under `crates/`, beside
# rustfmt. The formatter keeps each token as written, so the explicit-form
# sources keep their spelling.
["check:fmt"]
description = "rustfmt and the gandr formatter, unchanged"
depends = ["check:corpus-format"]
run = ".config/mise/scope cargo fmt --all --check"

# The gandr formatter's check over the corpus and the crate fixtures. A test
# reads a fixture with `include_str!`, so the fixture is a source the gate
# holds to the layout as it holds the corpus. A source whose layout its test
# reads, as a formatter's input, sits under a directory named `unformatted`,
# which the check leaves out. The file list is one argument vector, read from
# the index, so an untracked scratch file is not checked. CI runs it in the
# plain lane, whose state holds the driver, rather than in the format gate's
# treefmt pass, which would build the driver from nothing on every run.
["check:corpus-format"]
description = "Every corpus source and crate fixture in the gandr formatter's layout"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mapfile -t fixtures < <(git ls-files -- 'crates/*.gandr' ':(exclude)crates/*/unformatted/*')
exec .config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- fmt --check corpus/classifier corpus/fragment corpus/model corpus/pathological corpus/pending corpus/surface library/std "${fixtures[@]}"
'''

# The standard library's documentation site, written as `gandr doc` writes a
# package's (#4906, #4909): a source that cannot be read or judged, or a file
# that cannot be written, fails the gate. CI runs it in the plain lane, whose
# state holds the driver.
["check:gandr-doc"]
description = "The standard library's site, written by `gandr doc`"
run = ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- doc library/std --out target/gandr-doc/std"

["check:clippy"]
description = "The clippy half of the lint wall"
run = ".config/mise/gated .config/mise/scope cargo clippy {{ env.GATE_SCOPE | default(value='--workspace') }} --all-targets --locked"

# Runtime sentinels exist only with enforcement enabled. Lint them under the
# same profile, flags and target directory as the cached enforcing test build.
# The features unify over the whole workspace, as `check:tests-enforcing` does:
# a `GATE_SCOPE` that keeps no member using `anodized` otherwise builds
# `quenchant-anodized` without its feature under the cfg, and its build stops.
["check:clippy-enforcing"]
description = "The clippy wall with specification enforcement"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
run = ".config/mise/gated .config/mise/scope cargo clippy {{ env.GATE_SCOPE | default(value='--workspace') }} --all-targets --locked --profile test --config 'resolver.feature-unification=\"workspace\"' -- --deny warnings"

# CI's plain Clippy pass lints only the targets that carry plain-only code,
# `cfg(not(anodized_panic))`, as the plain test lane runs only their tests
# (`check:tests-plain-only`): the enforcing pass lints the rest (#2070). The
# list is checked first: every file under `crates/` that names
# `not(anodized_panic)` sits in a listed target's directory, or the task
# fails naming it. A new such target joins this list and the plain-only test
# filters.
["check:clippy-plain-only"]
description = "The plain clippy wall over the targets that carry plain-only code"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
# <package>:<test target>:<the target's directory>, one per target.
targets=(gandr-surface-parser:tests:crates/surface-parser/tests/)
unlisted=0
while IFS= read -r file; do
  listed=false
  for target in "${targets[@]}"; do
    if [[ $file == "${target##*:}"* ]]; then listed=true; fi
  done
  if [[ $listed == false ]]; then
    echo "$file carries cfg(not(anodized_panic)) code in no target check:clippy-plain-only lints: list its target there and in the plain-only test filters" >&2
    unlisted=1
  fi
done < <(git grep -l 'not(anodized_panic)' -- crates)
(( unlisted == 0 ))
for target in "${targets[@]}"; do
  package=${target%%:*}
  test=${target#*:}
  .config/mise/gated .config/mise/scope cargo clippy --locked --package "$package" --test "${test%%:*}" -- --deny warnings
done
{% endraw %}'''

# The compiler-plugin half of the lint wall, from the pinned Git policy
# source: specification presence, adequacy grammar, nominal signature
# boundaries, transparent layout, recursion and ownership cycles. The opt-in
# `option_signature` and `primitive_arithmetic` lints are selected by
# `cfg_attr` on a crate root; no crate here selects them yet. The absence
# predicate recognizes `Maybe` by a diagnostic item the shape crate registers
# only under `quenchant_compiler_policy`, which must reach every crate in the
# graph, hence the encoded rustflags rather than Dylint's own cfg. Incremental
# compilation is off because the driver reads whole-crate HIR. A toolchain bump
# invalidates the driver: `rm -rf ~/.dylint_drivers target/dylint` before the
# wall runs again.
["check:dylint"]
description = "quenchant's policy library over the workspace"
env.CARGO_INCREMENTAL = "0"
# The plugin links through dylint-link, which renames the artifact with the
# toolchain suffix Dylint loads by; Cargo's linker variable is per target.
env.CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "dylint-link"
env.CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER = "dylint-link"
# The plugin builds separately, without this workspace's facade feature.
# Its lints read clauses in either mode; the plugin's own specifications are
# checked by quenchant's gates. Keep this task plain, including when Cargo's
# encoded flags take precedence. `spec_clause_traversal` follows clause calls
# into other crates' bodies, which metadata carries for every function only
# under `-Zalways-encode-mir`; `-Zinline-mir=no` keeps standard-library calls
# as calls in the optimized test profile.
env.RUSTFLAGS = "{{ env.RUSTFLAGS | default(value='') | regex_replace(pattern='(^|\\\\s)--cfg(?:=|\\\\s+)anodized_(panic|print)\\\\b', rep='') | trim }}"
env.CARGO_ENCODED_RUSTFLAGS = "{% if env.CARGO_ENCODED_RUSTFLAGS is defined %}{% set flags = env.CARGO_ENCODED_RUSTFLAGS %}{% else %}{% set flags = env.RUSTFLAGS | default(value='') | trim | regex_replace(pattern='\\\\s+', rep='\u001f') %}{% endif %}{% set flags = flags | regex_replace(pattern='(^|\u001f)--cfg(?:=|\u001f)anodized_(panic|print)\\\\b', rep='') | trim_start(pat='\u001f') %}{{ flags }}{% if flags %}\u001f{% endif %}--cfg=quenchant_compiler_policy\u001f-Zalways-encode-mir\u001f-Zinline-mir=no"
# The executable-specification lints are `allow` by default in the library and
# denied here for the whole workspace: an unqualified attribute on every
# nontrivial item, an adequacy section with witnesses, `Maybe` for absence,
# typed errors at the boundary, and no clause that walks state accumulated on
# the receiver or behind a `&mut` parameter except through a function whose
# rustdoc states its `# Clause cost` (the `theory-spec-combinators` crate
# docs). A crate the backfill has not reached yet carries the matching `allow`
# on its root under `cfg_attr(dylint_lib = "quenchant_dylints", …)`; that line
# leaves with the crate's own backfill, and this flag stays. The module
# documentation shape (`rustdoc_shape`) is denied the same way: a crate whose
# documentation predates it allows each refusing lint on its root, its count
# in the comment beside the allow. `doc_history_prose` is a report, forced to
# `warn` so the workspace's denied warnings never make it a refusal.
# `pool_only_threads` keeps work on the one pool (`gandr-core-fork`'s `Fork`):
# a site that owns its thread states why in an `expect` at the site, and
# `report:threads` lists those reasons in the nightly.
env.DYLINT_RUSTFLAGS = "-D spec_attribute_present -D spec_attribute_unqualified -D adequacy_present -D maybe_shape -D erased_error_signature -D spec_clause_traversal -D rustdoc_shape -D pool_only_threads --force-warn doc_history_prose"
# Every policy run also records what each specification names, one file per
# compilation unit, for `evidence:obligations`. Recording always keeps one
# configuration, so the lint state and the records never disagree; it adds no
# measurable time to a full run of the wall. The directory sits beside the
# rustdoc JSON the obligations report joins it with.
# The `answer_totality` group (deny by default) reads the tables below: the
# printer's and the hover's unknown answers, each built only under an
# `expect` that says why; the printer's presenters, which name every former;
# and the printer's productions, which equal the grammar's rules but for the
# `unproduced` ones, each with the reason no printer writes it.
# `embedded_source` (deny by default) refuses a test source of two or more
# lines that reaches `SourceText` as a Rust literal: the source is a `.gandr`
# file read with `include_str!`, so the format gate reads it (#491). It lists
# every inline source that reaches the type, one line or more, under
# `target/embedded-sources` for the migration's codemod.
env.DYLINT_TOML = '''
[quenchant-dylints]
evidence_directory = "{{ config_root }}/target/evidence/records"
dishonest_constructors = [
  "gandr_surface_pretty::former::Former::Unreadable",
  "gandr_surface_pretty::former::Unspelled",
  "gandr_surface_pretty::walk::Kind::Unknown",
]
dishonest_spellings = [{ text = "?", crates = ["gandr_surface_pretty", "gandr_surface_lsp"] }]
presenters = [
  { enum = "gandr_surface_pretty::former::Former", functions = ["gandr_surface_pretty::walk::Walk::visit", "gandr_surface_pretty::walk::Walk::form"] },
]

[quenchant-dylints.productions]
marker = "gandr_surface_pretty::walk::Production"
argument = 0
rule_constructor = "RuleName"
rule_sources = [
  "crates/surface-grammar/src/surface.rs",
  "crates/surface-grammar/src/surface/term.rs",
  "crates/surface-grammar/src/surface/type_shell.rs",
  "crates/surface-grammar/src/surface/circuit.rs",
]
unproduced = [
  { rule = "acquire_expression", reason = "reserved: the lowering refuses it (`FragmentBoundary::Reserved`), so no core term carries it" },
  { rule = "as_pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "attribute_block", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "attributed_module_member", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "binary_expression.add.concat", reason = "the prelude has no `++` primitive, so the lowering refuses it (`Lower::operator`) and no core term carries it" },
  { rule = "binary_expression.pipe", reason = "sugar the lowering elaborates away: `a |> f` lowers to a bind of every output of `a` and an application of `f` to them, which the printer writes as that bind" },
  { rule = "bind_expression", reason = "the lowering names no former for this term (`former_of` is `Unadmitted`), so no core term carries it: a theory's rule term reads it as an abstraction" },
  { rule = "circuit_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "codata_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "command_substitution", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "data_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "def_value", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "derived_rule_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "double_quoted_string", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "drop_expression", reason = "sugar the lowering elaborates away: `drop(c)` lowers to the end action `close(c)` plans, which the printer writes as `close_expression`" },
  { rule = "dup_expression", reason = "reserved: the lowering refuses it (`FragmentBoundary::Reserved`), so no core term carries it" },
  { rule = "environment_assignment", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "extern_block", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "f_type.result", reason = "a definition's result row: core keeps the returner with its row, which the walk writes as `f_type.row`, and the whole-definition printer leaves the returner's tile out of that spelling at the result, `-> [E] B`" },
  { rule = "f_type.result.labelled", reason = "a definition's labelled result row: core keeps the returner with its row, which the walk writes as `f_type.row.labelled`, and the whole-definition printer leaves the returner's tile out of that spelling at the result, `-> [a : E] B`" },
  { rule = "file_descriptor", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "flow_declaration", reason = "a module item: the printer presents one core term or type, and a flow lowers to a functor in the module's environment, never to a core node" },

  { rule = "glob_expression", reason = "the lowering names no former for this term (`former_of` is `Unadmitted`), so no core term carries it" },
  { rule = "hole.pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "host_escape", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "if_expression", reason = "the lowering names no former for this term (`former_of` is `Unadmitted`), so no core term carries it" },
  { rule = "import_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "index_expression", reason = "sugar the lowering elaborates away: a view method's body `self.#[e]` answers the place's index `e`, the term the printer writes, and the lowering refuses an index anywhere else (`OutOfFragment`)" },
  { rule = "inner_attribute_block", reason = "a module item: the printer presents one core term or type, and an attribute block decorates a declaration in the module's environment, never a core node" },
  { rule = "inner_attribute_member", reason = "a module item: the printer presents one core term or type, and an attribute block decorates a declaration in the module's environment, never a core node" },
  { rule = "instantiation.direction.descent", reason = "a recursive call's claim: the lowering consumes it into the recursion check, and core's call keeps no claim" },
  { rule = "instantiation.direction.productivity", reason = "a recursive call's claim: the lowering consumes it into the recursion check, and core's call keeps no claim" },
  { rule = "instantiation.explicit", reason = "a supply by name, which the lowering applies as the implicit argument it names, or a named-stage claim it consumes into the recursion check; core's call keeps neither the label nor the claim" },
  { rule = "instantiation.tail", reason = "a recursive call's claim: the lowering consumes it into the recursion check, and core's call keeps no claim" },
  { rule = "list_operator", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "list_pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "literal_pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "moded_type", reason = "a deduced receiver's mode: the lowering erases the mode variable from the telescope and reads `self`'s type plain, and refuses a moded type anywhere else (`StrayReceiverMode`), so no core type carries it" },
  { rule = "module_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "module_definition_member", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "module_include_member", reason = "a module item: the printer presents one core term or type, and an include lowers to the module's environment, never to a core node" },
  { rule = "module_law_member", reason = "a module item: the printer presents one core term or type, and a law's admission lowers to the module's environment, never to a core node" },
  { rule = "module_type_member", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "nested_module_member", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "offers_declaration", reason = "a module item: the printer presents one core term or type, and a site's offer lowers to the module's report, never to a core node" },
  { rule = "or_pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "pack_model_expression", reason = "sugar the lowering elaborates away: a pack lowers to the record of the module's members, which the printer writes as `telescope_expression`" },
  { rule = "pipeline.pipe", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "pipeline.pipe_both", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "pub_declaration", reason = "a module item's mark: the printer presents one core term or type, and a `pub` mark lowers to the export of the declaration after it, never to a core node" },
  { rule = "rec_block", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "record_selection_expression", reason = "sugar the lowering elaborates away: a sub-record lowers to each field's projection bound in turn and the record of them returned, which the printer writes as `bind_statement`, `projection_expression` and `telescope_expression`" },
  { rule = "redirection_operator", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "release_expression", reason = "reserved: the lowering refuses it (`FragmentBoundary::Reserved`), so no core term carries it" },
  { rule = "representable_universe_type", reason = "a sort member's classifier: a `theory` block lowers to its presentation, never to a core type, and the lowering refuses `Type+` anywhere else (`OutOfFragment`)" },
  { rule = "rest_pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "shell_block", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "shell_word", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "single_quoted_string", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "statement_block", reason = "the block a host writes after its tile: the printer writes the braces and statements inside the host's own production, as `block`, `lambda_expression` and `access_expression` name it, so no node is the shared block alone" },
  { rule = "subshell", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "theory_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
  { rule = "tuple_pattern", reason = "a pattern: core keeps none; a case keeps an arm's constructor or summand and its binders, written as `constructor_pattern`, `labelled_sum_pattern`, `telescope_pattern` and `identifier.pattern`" },
  { rule = "type_application.juxtaposed", reason = "the printer writes a type application in its call form, `type_application`, until #5328 moves the printer to juxtaposition" },
  { rule = "union_type", reason = "the lowering names no former for this type (`former_of` is `Unadmitted`), so no core type carries it" },
  { rule = "variable_expansion", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "variable_name", reason = "shell syntax: the lowering names no former for it (`former_of` is `Unadmitted`), so no core node carries it" },
  { rule = "view_expression", reason = "sugar the lowering elaborates away: `s.f(…) as w { … }` lowers to the access of the place the method answers, which the printer writes as `access_expression`" },
  { rule = "wildcard", reason = "the lowering reads `_` as an unnamed binder, and the printer names every binder it opens" },
  { rule = "world_declaration", reason = "a module item: the printer presents one core term or type, and a declaration lowers to the module's environment, never to a core node" },
]

[quenchant-dylints.embedded_source]
types = ["gandr_surface_syntax::SourceText", "gandr_surface_render_remote::SourceText"]
extension = "gandr"
directory = "{{ config_root }}/target/embedded-sources"
'''
# Building the policy library or its driver links rustc's own crates, which
# rustc-dev and llvm-tools supply. The CI image leaves both out (its
# Dockerfile says why), so the task adds them; where they are installed the
# add is a no-op. A driver missing for the toolchain is built against the
# pinned rust-clippy (`.github/docker/rust-clippy.bash`, #3531), whose
# repository is kept under the cache directory; a cached driver, as the CI
# image bakes, is used as it is.
# Cargo can count a library built from another quenchant revision as fresh,
# and then each crate's lint results too; `ci.yml` keys its policy caches on
# the revision for this reason. So the task stamps `target/dylint` with the
# revision it builds. A run whose pinned revision differs from the stamp
# starts from an empty `target/dylint`.
run = '''
rustup component add rustc-dev llvm-tools
toolchain=$(rustup show active-toolchain | awk '{print $1}')
revision=$(mise run --quiet workflow:revision)
if [ "$(cat target/dylint/quenchant-revision 2> /dev/null)" != "$revision" ]; then
  rm -rf target/dylint
  mkdir -p target/dylint
  printf '%s\n' "$revision" > target/dylint/quenchant-revision
fi
set -- .config/mise/scope cargo dylint --lib quenchant_dylints --no-deps -- --workspace --all-targets
if [ ! -x "${DYLINT_DRIVER_PATH:-$HOME/.dylint_drivers}/$toolchain/dylint-driver" ]; then
  channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
  set -- .github/docker/rust-clippy.bash "${XDG_CACHE_HOME:-$HOME/.cache}/gandr/rust-clippy.git" "$channel" "$@"
fi
.config/mise/gated "$@"
'''

# External workflow consumers use one full revision in Dylint metadata for
# both the compiler plugin and this executable. Cargo's installation record
# tracks that revision; --locked uses the source repository's lockfile.
# A workspace-local install root prevents another consumer's install from
# replacing the executable between the dependency task and either gate.
["workflow:install"]
description = "Install the gate binary at the Dylint metadata revision"
run = '''
.config/mise/scope cargo install --git https://github.com/gandr-lang/quenchant --rev "$(mise run --quiet workflow:revision)" --locked --bin quenchant-gates --root target/workflow-tools quenchant-gates
'''

# The one quenchant revision the Dylint metadata pins, read without a
# toolchain. CI keys the policy caches on it, so a restored library is always
# this revision's policy.
["workflow:revision"]
description = "Print the quenchant revision the Dylint metadata pins"
tools.yq = "4.54.1"
run = '''
yq -e -p toml -o yaml '[.workspace.metadata.dylint.libraries[] | select(.git == "https://github.com/gandr-lang/quenchant" and .pattern == "crates/quenchant-dylints")] | select(length == 1) | .[0].rev | select(test("^[0-9a-f]{40}$"))' Cargo.toml
'''

["check:anodized"]
description = "Report the resolved specification state of the consumer workspace"
depends = ["workflow:install"]
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
run = "quenchant-gates anodized --manifest-path Cargo.toml"

# The facade selects enforcement from the annotated crate's cfg, so it is
# set for the whole graph. The enforcing tasks build into their own target
# directory: the wall runs its tasks in parallel, and a shared directory would
# rebuild artifacts under a sibling task's flags.
["check:anodized-enforcing"]
description = "Require specification enforcement in the enforcing configuration"
depends = ["workflow:install"]
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = "quenchant-gates anodized --manifest-path Cargo.toml --require-enforcing"

# The blocking set of the queue on `landing` (#5439) is Clippy's two passes
# and the compiler policy with its specification gates. The queue runs these
# tasks over the workspace in two jobs of `ci.yml`: `check Clippy wall` and
# `check quenchant compiler policy`. The gate runs them over the change's
# packages before `pr:open`. `check:landing-queue` holds the two jobs to this
# list. Thus the two sets stay one. The integration cycle runs the tests, the
# sweeps and the other gates (#5438).
["check:landing"]
description = "The checks a merge group on landing runs: Clippy and the compiler policy"
depends = ["check:clippy-plain-only", "check:clippy-enforcing", "check:dylint", "check:anodized", "check:anodized-enforcing"]
run = "echo 'landing check OK: Clippy and the compiler policy hold'"

# CI separates compilation from execution so failed tests retain built state.
# The plain build still covers every workspace target before test execution.
["build:tests"]
description = "Compile every plain workspace target without running tests"
run = ".config/mise/scope cargo build --locked --workspace --all-targets --profile test"

# The plain baseline: every workspace test without enforcement, which CI's
# daily `cargo-test-plain-baseline` lane times so that the enforcing lane can
# report what each test's specifications cost it. It is a report, so its
# name keeps it out of the `check:*` glob: the gate runs one full test pass,
# the enforcing one, as CI does (#5216).
["ci:plain-baseline"]
description = "Every workspace test without specification enforcement, the baseline CI times daily"
run = ".config/mise/gated .config/mise/scope cargo nextest run --workspace --locked --profile {{ env.NEXTEST_PROFILE | default(value='default') }}"

# The enforcing run is the one full test pass, in CI and in the gate, so the
# plain lane and the gate's plain build compile and run only what that run
# cannot: the tests gated `cfg(not(anodized_panic))`. A new such test joins
# both filters below and `check:clippy-plain-only`'s list, which fails on a
# plain-only file outside it.
["build:tests-plain-only"]
description = "Compile the plain-only test targets without running them"
run = ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --no-run"

["check:tests-plain-only"]
description = "The tests that exist only without specification enforcement"
run = ".config/mise/gated .config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --profile {{ env.NEXTEST_PROFILE | default(value='default') }} -E 'test(=acceptance::corpus_files_cold_parse_within_p99_latency_budget)'"

# Flags and target directory match the enforcing test gate. A merge-group
# shard names its packages in `CI_SHARD_ARGS`; workspace feature unification
# resolves every shard's features as the whole workspace's, so each shard
# builds exactly the workspace build's units and the shards' target
# directories overlay into one state. Without it a shard rebuilds shared
# dependencies under its own features (#702). The resolver setting is
# command-line config, not the environment: a test that runs `cargo tree`
# inherits the environment and would answer for the whole workspace.
["build:tests-enforcing"]
description = "Compile enforcing test targets without running them"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
run = ".config/mise/scope cargo nextest run {{ env.CI_SHARD_ARGS | default(value='--workspace') }} --locked --config 'resolver.feature-unification=\"workspace\"' --no-run"

# The test twin under enforcement; the suite's runtime sentinels refuse a
# target-only or stale macro build. A loaded host lengthens the run and never
# fails it: the profile kills only a hang past 5 minutes (#3912).
["check:tests-enforcing"]
description = "Unit and integration tests over every target, specifications enforced"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
run = ".config/mise/gated .config/mise/scope cargo nextest run {% if env.CI_SHARD_ARGS is defined %}{{ env.CI_SHARD_ARGS }}{% else %}{{ env.GATE_SCOPE | default(value='--workspace') }}{% endif %} --locked --config 'resolver.feature-unification=\"workspace\"' --profile {{ env.NEXTEST_PROFILE | default(value='default') }}"

# The enforcing configuration admits the cfg-gated runtime sentinels, so their
# witnesses enter the inventory. With `CI_WITNESS_LISTINGS` naming a directory
# of listings (`ci:witness-listing`), the gate reads those and lists nothing
# itself. With `CI_SHARD_ARGS` it resolves the shard's own members, the
# packages those cargo flags select: a member's witnesses name its own tests,
# so each enforcing shard resolves its members against its own listing.
# A listing holds the tests this host builds, so a witness whose test's own
# `#[cfg(…)]` builds it on another host is absent from it (#4441). Each
# `unresolved-witness` line is read against that `cfg` (`.config/witnesses/
# resolve.jq`): a test a gate host in `.config/witnesses/hosts.json` builds
# is left to that host to run, and one no gate host builds is refused.
["check:witnesses"]
description = "Resolve adequacy witnesses in the consumer test inventory, a witness this host builds no test for left to the gate host whose cfg builds it"
depends = ["workflow:install"]
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
listings=()
if [[ -n ${CI_WITNESS_LISTINGS:-} ]]; then
  for listing in "$CI_WITNESS_LISTINGS"/*.json; do
    [[ -e $listing ]] && listings+=(--inventory "$listing")
  done
  if [[ -z ${listings[*]:-} ]]; then
    echo "check:witnesses: no listing under $CI_WITNESS_LISTINGS" >&2
    exit 1
  fi
fi
scope=()
for argument in ${CI_SHARD_ARGS:-}; do
  [[ $argument == --workspace ]] || scope+=("$argument")
done
witnesses=.config/witnesses
summary=$(mktemp)
trap 'rm -f "$summary"' EXIT
status=0
report=$(quenchant-gates witnesses --manifest-path Cargo.toml "${listings[@]}" "${scope[@]}" 2> "$summary") || status=$?
if (( status != 1 )); then
  [[ -z $report ]] || printf '%s\n' "$report"
  cat "$summary" >&2
  exit "$status"
fi
read=$(jq -n --arg report "$report" --argjson tests "$("$witnesses/tests.bash")" \
  --argjson here "$(rustc --print cfg | jq -R -s . | jq -c -L "$witnesses" -f "$witnesses/atoms.jq")" \
  --slurpfile hosts "$witnesses/hosts.json" \
  '{lines: ($report | split("\n")), tests: $tests, here: $here, hosts: $hosts[0]}' \
  | jq -c -L "$witnesses" -f "$witnesses/resolve.jq")
jq -r '.resolved[]' <<< "$read"
if [[ $(jq '.refused | length' <<< "$read") != 0 ]]; then
  jq -r '.refused[]' <<< "$read"
  cat "$summary" >&2
  exit 1
fi
echo "adequacy witness resolution (G0): every witness resolves here or is left to the gate host whose cfg builds it"
'''

# The witness resolution's cases (#4441): each case in
# `.config/witnesses/cases.json` holds a report, the gated tests and the host
# atoms `resolve.jq` reads, and the lines it must leave to a gate host or
# refuse; one holds `rustc --print cfg`'s text and the atoms `atoms.jq` keeps.
["check:witness-cases"]
description = "A witness this host builds no test for is left to the gate host whose cfg builds it, or refused when none does, as recorded"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
.config/cases/run.bash witnesses .config/witnesses/cases.json --programs .config/witnesses --mode c
echo "witness cases OK: $(jq length .config/witnesses/cases.json) cases read as recorded"
'''

# Re-verification obligations (quenchant-gates obligations): a change owes a
# re-check by every specification that names a changed item, through an
# executable clause (the records `check:dylint` writes) or through an
# intra-doc link in a prose clause (rustdoc's JSON, resolved). One hop out: a
# specification whose own text is unchanged stops the cascade. CI runs these
# on a pull request; the merge queue still runs every test.
#
# Rustdoc builds in its own target directory so its JSON flags never rebuild
# `check:doc`'s HTML; default features match the policy pass's items.
["evidence:rustdoc"]
description = "Rustdoc JSON with every intra-doc link resolved, for the obligations report"
env.RUSTDOCFLAGS = "-Z unstable-options --output-format json"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/evidence"
run = ".config/mise/scope cargo doc --workspace --locked --no-deps --document-private-items"

# The revision a change starts from, which every measurement of it reads
# (#2067): where HEAD left the trunk, `origin/$trunk`
# (`.config/pr-stack/trunk.bash`, #5443), or, past it, the newest head of
# another open pull request HEAD carries. A pull request retargeted onto the
# trunk while the ones below it are still queued carries their commits, and
# the merge base with the trunk reads them as its own change until they merge;
# the queue lands by merge commit, so a merged one leaves the merge base past
# it. The branch's own pull request is never its base: its pushed head trails
# HEAD by the commits not yet pushed. The open pull requests are read through
# `gh` (`GH_TOKEN` in CI); without them the merge base stands.
["evidence:base"]
description = "Print the revision the checked-out change is measured against"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source .config/pr-stack/trunk.bash
base=$(git merge-base "origin/$trunk" HEAD)
own=${GITHUB_HEAD_REF:-$(git branch --show-current)}
head=$(git rev-parse HEAD)
heads=$(gh api --paginate "repos/{owner}/{repo}/pulls?state=open&per_page=100" --jq '.[] | [.number, .head.ref, .head.sha] | @tsv' 2> /dev/null) \
  || { echo "the open pull requests are unreadable; measuring from the merge base with origin/$trunk" >&2; heads=; }
carried=
while IFS=$'\t' read -r number ref sha; do
  [[ -n $sha && $ref != "$own" && $sha != "$head" ]] || continue
  if git merge-base --is-ancestor "$base" "$sha" 2> /dev/null && git merge-base --is-ancestor "$sha" HEAD 2> /dev/null; then
    base=$sha
    carried=$number
  fi
done <<< "$heads"
if [[ -n $carried ]]; then echo "measuring from #$carried's head, which HEAD carries past origin/$trunk" >&2; fi
printf '%s\n' "$base"
'''

# Lists the changed items against the base, the obligations they raise and the
# witnesses to rerun, and writes the pull-request comment (the witnesses) and
# the witness selection beside the records. The base defaults to
# `evidence:base`, so neither work landed on main since nor a carried pull
# request's commits are read as this change.
# `--body` reads a pull-request body's ticked boxes and writes the body back
# with its `## Re-verification` section, one line per prose obligation; a tick
# holds while the clause and the items it names are unchanged. `--previous`
# reads the ticks from a file it leaves alone. `--require-acknowledged` exits 2
# while any prose obligation is unticked.
#
# A defect owes one more line: its observation in the running program
# (#3758). When the body works a `kind:defect` issue, the task writes a
# `### Observed` block after the section (`.config/claims/observed.jq`). The
# box is ticked when the change adds a transcript under a crate's
# `tests/debug-traces/` that a `debug:` task wrote, stopped at a breakpoint,
# in a test the body names. A change whose diff touches no Rust has no test
# for lldb to stop in, so there the box is ticked when the change adds a
# `.config` case whose name cites an issue the body closes (#3784). A Rust
# file whose diff changes only comments counts as no Rust (#5498). No hand
# ticks it. `--require-acknowledged` exits 2 while it is open.
# `--observed-only` reads this block alone and builds no Rust evidence:
# `pr:open` runs no specification obligation (#5458), but the observation is
# the author's to give before the pull request opens.
#
# A performance fix owes one more line: whether a lint could have refused the
# pattern it fixes (#1370). The body names the issues it works
# (`.config/claims/targets.jq`); when one of them, or the pull request named
# by `--pr`, carries `kind:performance` or `fix:performance`, the section
# gains a `lint assessment` box whose verdict reads `could: yes — <lint>,
# <reference>` or `could: no — <one sentence>`, open until ticked in one of
# those shapes. The labels are read through `gh` whenever a body is given.
#
# A pull request whose hotpath check is red owes a verdict (#1468): with
# `--pr`, the head's completed `hotpath / <benchmark>` checks become the
# report `--hotpath` reads, one delta per benchmark, regressed when the check
# failed. A failed check's before and after are the first `a → b` span of its
# first site over threshold, the check's own numbers. A passing check moved
# nothing past its policy, so both read `within its policy`, and an
# `accepted` naming it is refused. The section then gains a `### Hotpath` box
# whose verdict reads `hotpath: fixed — <benchmark> <before> → <after>` or
# `hotpath: accepted — <benchmark> exercises <feature>; <n> allocations per
# <use>; <one sentence>`, open until ticked in one of those shapes. The check
# posts after the benchmark upload, so a CI run may predate it; a rerun of
# the pull request's obligations lane reads it again.
["evidence:obligations"]
description = "List the specifications a change obliges to re-verify"
tools.jq = "1.8.1"
usage = '''
arg "[base]" help="the revision the change is measured against; defaults to evidence:base"
flag "--previous <file>" help="a pull-request body whose acknowledgements carry over, left unchanged"
flag "--body <file>" help="a pull-request body whose acknowledgements carry over, rewritten with its re-verification section"
flag "--pr <number>" help="the pull request whose own labels join its targets' for the lint assessment, and whose head's hotpath checks owe a verdict when red"
flag "--require-acknowledged" help="exit 2 while any prose obligation is unticked"
flag "--observed-only" help="build no Rust evidence and list no specification obligation: read only a defect's observation"
'''
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
base=${usage_base:-$(mise run --quiet evidence:base)}
# The specification obligations come from the Rust evidence: the Dylint
# records and the rustdoc JSON. A change the gate's selection gives no Rust
# check (`.config/gate-scope/select.bash`) changes no Rust item, so it owes no
# specification obligation and builds neither. `--observed-only` builds
# neither.
rust=false
if [[ ${usage_observed_only:-false} != true ]]; then
  selected=$(.config/gate-scope/select.bash)
  if [[ $'\n'$selected$'\n' == *$'\n'check:dylint$'\n'* ]]; then rust=true; fi
  if [[ $rust == true ]]; then
    mise run check:dylint ::: evidence:rustdoc ::: workflow:install
  else
    echo "evidence: the change touches no Rust path (.config/gate-scope/select.bash), so it owes no specification obligation; no Rust evidence is built" >&2
  fi
fi
extra=()
if [[ -n ${usage_previous:-} ]]; then extra+=(--previous "$usage_previous"); fi
if [[ -n ${usage_body:-} ]]; then extra+=(--body "$usage_body"); fi
if [[ ${usage_require_acknowledged:-false} == true ]]; then extra+=(--require-acknowledged); fi
text=${usage_body:-${usage_previous:-}}
if [[ -n $text ]]; then
  numbers=$(jq -Rrs -L .config/claims 'include "targets"; targets(working) | unique[]' "$text")
  if [[ -n ${usage_pr:-} ]]; then numbers+=$'\n'$usage_pr; fi
  labels=()
  for number in $numbers; do
    labels+=("$(gh api "repos/{owner}/{repo}/issues/$number" --jq '[.labels[].name] | join(",")')")
  done
  extra+=(--labels "$(IFS=,; printf '%s' "${labels[*]}")")
fi
if [[ -n ${usage_pr:-} ]]; then
  mkdir -p target/evidence
  # A CI run names the head it checks (#5078); a seat's run reads it.
  head=${CI_PR_HEAD:-$(gh api "repos/{owner}/{repo}/pulls/$usage_pr" --jq .head.sha)}
  gh api --paginate "repos/{owner}/{repo}/commits/$head/check-runs?per_page=100" \
    --jq '.check_runs[] | select((.name | startswith("hotpath / ")) and .status == "completed" and (.conclusion == "failure" or .conclusion == "success")) | {name, conclusion, summary: (.output.summary // "")}' \
    | jq -s -f .config/hotpath/report.jq > target/evidence/hotpath.json
  extra+=(--hotpath target/evidence/hotpath.json)
fi
status=0
if [[ $rust == true ]]; then
  # The policy state is restored from main's cache and saved again, so a
  # target removed or renamed since leaves its records and rustdoc JSON
  # behind, and the report reads every file in both directories (#2479). A
  # record is kept while a workspace target's root source, `/` and `.`
  # written as `_`, names it; a rustdoc file while a target's crate name does.
  metadata=$(cargo metadata --no-deps --format-version 1 --locked)
  declare -A written=()
  while IFS= read -r kept; do written[$kept]=1; done < <(jq -r '
    (.workspace_root + "/") as $root
    | .packages[].targets[]
    | "records/" + (.src_path | ltrimstr($root) | gsub("[/.]"; "_")),
      "doc/" + (.name | gsub("-"; "_"))' <<< "$metadata")
  for left in target/evidence/records/*.jsonl target/evidence/doc/*.json; do
    [[ -e $left ]] || continue
    file=${left#target/evidence/}
    directory=${file%%/*}
    name=${file#*/}
    [[ -n ${written[$directory/${name%%.*}]:-} ]] || rm -- "$left"
  done
  quenchant-gates obligations --manifest-path Cargo.toml --base "$base" \
    --records target/evidence/records --rustdoc target/evidence/doc "${extra[@]}" \
    --comment target/evidence/comment.md --selection target/evidence/selection || status=$?
fi
if [[ -n $text ]]; then
  defect=false
  for set in "${labels[@]}"; do
    if [[ ,$set, == *,kind:defect,* ]]; then defect=true; fi
  done
  # The block is `observed.bash`'s, whose inputs reach jq through files, so a
  # transcript of any size passes (#3871).
  block=$(.config/claims/observed.bash "$base" "$text" "$defect")
  if [[ -n ${usage_body:-} ]]; then
    block="$block" awk -f .config/claims/observed.awk "$usage_body" > "$usage_body.observed"
    mv -- "$usage_body.observed" "$usage_body"
  fi
  if [[ $block == *'- [ ] observed'* ]]; then
    printf '%s\n' "$block" >&2
    if [[ ${usage_require_acknowledged:-false} == true && $status == 0 ]]; then status=2; fi
  fi
fi
exit "$status"
'''

# The recorded case of the re-verification lane (#2636), the witness the
# features ledger's `re-verification` row names. `.config/obligations/` holds
# a crate before and after one change: `edited.rs` changes `limit`'s body, and
# `bump`'s prose clause names `limit`. The task builds the crate in a scratch
# Git repository, its manifest carrying this workspace's Dylint libraries, so
# the pinned policy library records it, and commits `base.rs`. With
# `edited.rs` in its place, it writes the crate's records and rustdoc JSON as
# `check:dylint` and `evidence:rustdoc` do, then runs `quenchant-gates
# obligations` with `--require-acknowledged` three times:
#   - over a body with no section, it exits 2 with `bump`'s clause open;
#   - over that body with the clause's `still holds` box ticked, it exits 0
#     with the clause held;
#   - with `base.rs` back, it obliges nothing.
# The builds keep their target under `target/obligations`, so a cached run
# compiles nothing but the one-line change.
["check:obligations"]
description = "The re-verification lane obliges the recorded change, holds it once ticked and obliges nothing without it"
depends = ["check:dylint", "workflow:install"]
tools.jq = "1.8.1"
env.PATH = "{{ config_root }}/target/workflow-tools/bin:{{ env.PATH }}"
env.CARGO_INCREMENTAL = "0"
env.CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "dylint-link"
env.CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER = "dylint-link"
run = '''
#!/usr/bin/env bash
set -euo pipefail
case_dir=.config/obligations
target={{ config_root }}/target/obligations
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
repository=$scratch/repository
mkdir -p "$repository/src" "$target/records"
libraries=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '
  .metadata.dylint.libraries[]
  | "[[workspace.metadata.dylint.libraries]]\ngit = \(.git | tojson)\nrev = \(.rev | tojson)\npattern = \(.pattern | tojson)\n"')
printf '[package]\nname = "obligations-case"\nversion = "0.0.0"\nedition = "2024"\npublish = false\n\n[workspace]\n\n%s' \
  "$libraries" > "$repository/Cargo.toml"
cp rust-toolchain.toml "$repository/"
cp "$case_dir/base.rs" "$repository/src/lib.rs"
printf '/target\n/Cargo.lock\n' > "$repository/.gitignore"
fixture_git() {
  GIT_AUTHOR_NAME=case GIT_AUTHOR_EMAIL=case@example.invalid GIT_COMMITTER_NAME=case GIT_COMMITTER_EMAIL=case@example.invalid \
    git -C "$repository" -c commit.gpgsign=false -c core.hooksPath=/dev/null "$@"
}
fixture_git init --quiet
fixture_git add --all
fixture_git commit --quiet --message base
cp "$case_dir/edited.rs" "$repository/src/lib.rs"
# Cargo reads a scratch crate's build as fresh across scratch directories, and
# a fresh build runs no lint pass and writes no records: the case crate alone
# is cleaned first, in both target directories, and the policy library and
# the dependencies stay built.
rm -f "$target/records"/*.jsonl
for built in "$target"/dylint/dylint/target/*/ "$target/rustdoc"; do
  [[ -d $built ]] || continue
  cargo clean --manifest-path "$repository/Cargo.toml" --target-dir "$built" --package obligations-case --quiet
done
DYLINT_TOML=$(printf '[quenchant-dylints]\nevidence_directory = "%s"\n' "$target/records") \
  CARGO_TARGET_DIR="$target/dylint" \
  CARGO_ENCODED_RUSTFLAGS=$'--cfg=quenchant_compiler_policy\x1f-Zalways-encode-mir\x1f-Zinline-mir=no' \
  cargo dylint --manifest-path "$repository/Cargo.toml" --lib quenchant_dylints --no-deps -- --lib --quiet
RUSTDOCFLAGS="-Z unstable-options --output-format json" CARGO_TARGET_DIR="$target/rustdoc" \
  cargo doc --manifest-path "$repository/Cargo.toml" --no-deps --document-private-items --offline --quiet
printf '## What\n\nThe recorded change.\n' > "$scratch/body.md"
obligations() {
  quenchant-gates obligations --manifest-path "$repository/Cargo.toml" --base HEAD \
    --records "$target/records" --rustdoc "$target/rustdoc/doc" \
    --comment "$scratch/comment.md" --selection "$scratch/selection" --require-acknowledged "$@"
}
failed=0
expect() {
  local name=$1 want_status=$2 want_line=$3 status=0 report
  shift 3
  report=$(obligations "$@" 2>&1) || status=$?
  if [[ $status != "$want_status" ]] || ! grep -qxF -- "$want_line" <<< "$report"; then
    printf 'obligations case FAILED: %s\n  wanted exit %s and the line: %s\n  gave exit %s:\n%s\n' \
      "$name" "$want_status" "$want_line" "$status" "$report" >&2
    failed=1
  fi
}
expect 'the change obliges the clause naming the changed item' 2 \
  'prose: obligations_case::bump `ensures` names obligations_case::limit [open]' --body "$scratch/body.md"
awk '{ sub(/- \[ \] still holds/, "- [x] still holds") } 1' "$scratch/body.md" > "$scratch/ticked.md"
expect 'a ticked box holds the clause' 0 \
  'prose: obligations_case::bump `ensures` names obligations_case::limit [still holds]' --previous "$scratch/ticked.md"
cp "$case_dir/base.rs" "$repository/src/lib.rs"
expect 'without the change nothing is obliged' 0 \
  'obligations against HEAD: 0 changed items, 0 obligations, 0 witnesses to rerun'
(( failed == 0 )) || exit 1
echo "obligations check OK: the recorded change obliges bump's clause, a tick holds it, and without the change nothing is owed"
'''

# The obligated witnesses, under the enforcing gate's flags and target
# directory so a restored enforcing build serves them. The selection names
# each witness's package, so Cargo builds only those packages' tests, with
# dependency features resolved as for the whole workspace: a narrower
# selection would change the features of shared dependencies and rebuild
# every crate above them. Only this task unifies so: elsewhere `-p` keeps
# its own features, which `cargo tree -p` and the shipped build rely on.
# The selection is `-p` per package, then `-E` and one filterset whose
# alternatives join with ` | `. A change obligating thousands of witnesses
# makes that one argument longer than the kernel accepts (Linux refuses an
# argument over 128 KiB), so the alternatives run in batches of at most
# 64 KiB of filterset, each under every selected package. A failing batch
# fails the task once the rest have run; with more than one batch, each
# batch's JUnit report is kept beside the others as `junit-<n>.xml`.
["evidence:witnesses"]
description = "Rerun the obligated witnesses with specifications enforced"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
env.CARGO_RESOLVER_FEATURE_UNIFICATION = "workspace"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
mapfile -t selection < target/evidence/selection
if (( ${#selection[@]} == 0 )); then
  echo 'no obligated witness to rerun'
  exit 0
fi
profile=${NEXTEST_PROFILE:-default}
packages=("${selection[@]:0:${#selection[@]}-2}")
filterset=${selection[-1]}
mapfile -t alternatives <<< "${filterset// | /$'\n'}"
limit=65536
batches=()
batch=''
for alternative in "${alternatives[@]}"; do
  if [[ -n $batch ]] && (( ${#batch} + 3 + ${#alternative} > limit )); then
    batches+=("$batch")
    batch=''
  fi
  batch=${batch:+$batch | }$alternative
done
batches+=("$batch")
status=0
for index in "${!batches[@]}"; do
  .config/mise/scope cargo nextest run --locked --profile "$profile" "${packages[@]}" -E "${batches[index]}" || status=1
  report=target/nextest/$profile/junit.xml
  if (( ${#batches[@]} > 1 )) && [[ -f $report ]]; then
    mv "$report" "target/nextest/$profile/junit-$((index + 1)).xml"
  fi
done
exit "$status"
{% endraw %}'''

# `RUSTDOCFLAGS="-D warnings"` makes every rustdoc lint fatal, so a broken
# intra-doc link — the vocabulary tables are rustdoc the types link into — is a
# gate failure, not a warning. The clippy wall's `missing_docs_in_private_items`
# supplies the missing-docs half; this gate supplies the rustdoc-lint half.
["check:doc"]
description = "Private-item rustdoc with every rustdoc lint denied"
env.RUSTDOCFLAGS = "-D warnings"
run = ".config/mise/gated .config/mise/scope cargo doc {{ env.GATE_SCOPE | default(value='--workspace') }} --all-features --locked --no-deps --document-private-items"

# Nextest runs no documentation example, so a stale example compiled nowhere
# until this gate (#707).
["check:doctests"]
description = "Every documentation example compiles and runs"
run = ".config/mise/scope cargo test --doc {{ env.GATE_SCOPE | default(value='--workspace') }} --locked"

["check:typos"]
description = "Spelling"
run = "typos"

# Documentation shape. `README.md` is a crate's only document: an overview
# linking into the crate's rustdoc, where mechanism, decisions and
# specification detail live. The first command refuses tracked markdown
# outside the allowlist, matched by Git's glob pathspec so `*` stays within
# one directory, which sizelint's patterns cannot express. The ledger's
# README, its generated syntax ledger and its bootstrap census (#2896) are on
# it, a library's README (its module map, `library/std/README.md`), the pull
# request template, which GitHub reads as markdown, and the filers' issue
# templates (#3112), which `issue:file` posts as markdown. A literate sketch
# host, `corpus/sketch/*/*.gandr.md` (#4723), is a program in markdown, not
# documentation. The unit issue template is a form,
# `.github/ISSUE_TEMPLATE/unit.yml` (#3113). The
# second holds every tracked markdown file to its budget in `sizelint.toml`;
# treefmt's sizelint pass leaves markdown to this gate. The syntax ledger is
# exempt: it is generated, one row per grammar rule, and
# `check:syntax-ledger` owns its bytes.
["check:markdown"]
description = "Tracked markdown on the README allowlist and within its budgets"
run = [
  '''
outside=$(git ls-files -- '*.md' \
  ':(exclude,glob)README.md' \
  ':(exclude,glob)CHANGELOG.md' \
  ':(exclude,glob)crates/README.md' \
  ':(exclude,glob)crates/*/README.md' \
  ':(exclude,glob)contrib/*/README.md' \
  ':(exclude,glob)library/*/README.md' \
  ':(exclude,glob)ledger/README.md' \
  ':(exclude,glob)ledger/syntax.md' \
  ':(exclude,glob)ledger/census.md' \
  ':(exclude,glob).config/issues/templates/*.md' \
  ':(exclude,glob)corpus/sketch/*/*.gandr.md' \
  ':(exclude,glob).github/pull_request_template.md')
if [ -n "$outside" ]; then
  printf '%s\n' "$outside" >&2
  echo 'markdown check FAILED: tracked markdown outside the README allowlist; move its prose into rustdoc' >&2
  exit 1
fi
echo 'markdown check OK: every tracked markdown file is on the README allowlist'
''',
  "git ls-files -z -- '*.md' ':(exclude,glob)ledger/syntax.md' | xargs -0 sizelint check",
]

# The root README is the project's vision statement, curated by the owner
# (#3260): every section is the owner's approved rendering, and the vault's
# pages point here for the whole picture. Its bytes are pinned by
# `.config/readme.sha256`; a change to `README.md` is an owner act and lands
# with the pin re-written in the same commit (`sha256sum README.md >
# .config/readme.sha256`), never by a seat on its own.
["check:readme-pin"]
description = "The root README matches the owner's pin"
run = '''
if ! sha256sum --check --quiet .config/readme.sha256; then
  echo 'readme pin FAILED: README.md differs from .config/readme.sha256; the root README changes only with the owner, who re-writes the pin in the same commit' >&2
  exit 1
fi
echo 'readme pin OK: README.md is the owner-approved synopsis'
'''

# The syntax ledger is generated from the grammar, the attribute registry and
# the committed rules' exemplars, which each rule's admission is read off
# (`gandr-surface-dispatcher`'s `ledger` module): `ledger:syntax` regenerates
# it into a temporary directory under each case's environment in
# `.config/ledger/syntax-cases.json`, a toolchain selection no host carries
# among them, and `.config/ledger/syntax-cases.bash` compares it with the
# committed `ledger/syntax.md` and `ledger/syntax.json` byte for byte. A
# difference is printed and fails the gate; `mise run ledger:syntax` rewrites
# both files with the worktree's own build (#4500).
["check:syntax-ledger"]
description = "The committed syntax ledger is the one the worktree's grammar generates"
tools.jq = "1.8.1"
run = ".config/ledger/syntax-cases.bash"

# One exemplar per committed rule of the syntax ledger and per attribute
# (`corpus/ledger/{syntax,attributes}`), verified by the driver: the files
# and the rules match by name, each exemplar parses with no obligation and
# holds a tile of its rule, and each attribute exemplar lowers with its
# attribute filed. Every features exemplar states only `checks`, `runs` or
# `normalizes`. Every refusal name no form qualifies, and the reserved and
# unadmitted boundaries, have an exemplar (`corpus/ledger/diagnostics`)
# holding a declaration refused with it, or a row of the owed table with its
# reason or issue. Every finding is printed, `<file>: <fault>`.
["check:syntax-exemplars"]
description = "One verified exemplar per committed rule and attribute of the syntax ledger, every features exemplar exhibiting, and every refusal name an exemplar or an owed row"
run = ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- ledger exemplars corpus/ledger"

# Every exemplar under `corpus/ledger` (syntax, attributes, features and
# diagnostics), settled as an author runs them. `ledger/` is a fixture root, so
# each declaration states what the checker makes of it: `checks`, `runs` or
# `normalizes` where it holds, `refuses` where the checker does not reach the
# form yet or where a diagnostics exemplar shows the refusal.
# `check:syntax-exemplars` refuses `owes` and `refuses` in a features exemplar,
# which exhibits what holds.
["check:exemplars"]
description = "Every exemplar settles under `gandr test`"
run = ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- test corpus/ledger"

# The site's two paragraphs the owner set down (#3993): the fat object and
# one site serving two uses stand verbatim in the wreath's rustdoc and in the
# `gandr-theory-sites` README. Each paragraph is read from
# `crates/theory-sites/src/wreath.rs`, its `//!` lines joined, and the README
# must carry it as one paragraph.
["check:sites"]
description = "The theory-sites README carries the wreath rustdoc's fat-object and one-site paragraphs verbatim"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source=crates/theory-sites/src/wreath.rs
readme=crates/theory-sites/README.md
failed=0
for opening in 'The level-two unit is a fat object.' 'One site serves two uses.'; do
  paragraph=$(awk -v opening="$opening" '
    /^\/\/!/ { line = substr($0, 5); if (index(line, opening) == 1) keep = 1; if (keep && line == "") exit; if (keep) text = text (text == "" ? "" : " ") line }
    END { print text }' "$source")
  if [[ -z $paragraph ]]; then
    echo "$source: no paragraph opens with \`$opening\`" >&2
    failed=1
  elif ! grep -qxF -- "$paragraph" "$readme"; then
    echo "$readme: lacks the paragraph \`$opening …\` as $source states it" >&2
    failed=1
  fi
done
if (( failed )); then
  echo 'sites check FAILED' >&2
  exit 1
fi
echo 'sites check OK: the README carries the fat-object and one-site paragraphs as the wreath states them'
'''

# The features ledger (`ledger/features.sql`, `ledger/README.md`): the dump
# round-trips and keeps its constraints, every path a row names exists, every
# language feature names an exemplar, and every implemented row without a
# witness rests on an open issue, its state read through `gh`
# (`.config/ledger/check.bash` states each rule). First the cases of
# `.config/ledger/cases.json` run the check over a stub `gh` (#4018): a failed
# read stops it with the call and its error, never a verdict on a row.
["check:ledger"]
description = "The features ledger round-trips, keeps its constraints, names paths that exist, an exemplar for every language feature and a witness or an open gap for every implemented one"
run = [".config/ledger/cases.bash", ".config/ledger/check.bash"]

# A refusal in the tree points at what resolves it (#2529). Every
# `TrackingIssue` constant (`crates/core-term/src/failure.rs`), the issue an
# unimplemented refusal names on every face, and every declined row of the
# features ledger names an issue that is open, or closed as not planned (a
# decision); never a completed issue or a pull request. The placeholder
# `UNFILED` (#1207) is gone: an unimplemented refusal names its own issue or
# does not compile. `.config/tracking/tracking.jq` reads them; each case in
# `.config/tracking/cases.json` holds an input and the lines it prints, or
# none. The states are read once through `gh`, after the cases, and every
# finding is printed before the gate fails.
["check:tracking"]
description = "Every tracking issue a refusal names, and every declined ledger row's decision, is open or closed as not planned"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
.config/cases/run.bash tracking .config/tracking/cases.json --program .config/tracking/tracking.jq
sed -nE 's/^ *pub const ([A-Z_]+): Self = Self\(([0-9]+)\);$/\1 \2/p' crates/core-term/src/failure.rs \
  | jq -R '[inputs | split(" ") | {name: .[0], number: (.[1] | tonumber)}]' -n > "$tmp/constants.json"
{ cat ledger/features.sql; printf '%s\n' "SELECT id, coalesce(issue, '') AS issue FROM feature WHERE status = 'declined' ORDER BY id;"; } \
  | sqlite3 -json | jq '[.[] | {id, refs: [.issue | scan("(?:^|\\s)#([0-9]+)") | .[0] | tonumber]}]' > "$tmp/rows.json"
jq -r -n --slurpfile c "$tmp/constants.json" --slurpfile r "$tmp/rows.json" \
  '"{ repository(owner: \"gandr-lang\", name: \"gandr\") { " + ([$c[0][].number, $r[0][].refs[]] | unique
    | map("n\(.): issueOrPullRequest(number: \(.)) { ... on Issue { state stateReason } ... on PullRequest { state } }")
    | join(" ")) + " } }"' > "$tmp/query.graphql"
gh api graphql -F query=@"$tmp/query.graphql" --jq '.data.repository | with_entries(.key |= ltrimstr("n")
    | .value |= if . == null then null
      elif has("stateReason") then {kind: "issue", state, reason: .stateReason}
      else {kind: "pull", state} end)' > "$tmp/states.json" \
  || { echo 'tracking: the states of the issues named could not be read through gh' >&2; exit 1; }
findings=$(jq -n --slurpfile c "$tmp/constants.json" --slurpfile r "$tmp/rows.json" --slurpfile s "$tmp/states.json" \
  '{constants: $c[0], rows: $r[0], states: $s[0]}' | jq -r -f .config/tracking/tracking.jq)
if [[ -n $findings ]]; then
  echo "$findings" >&2
  echo 'tracking check FAILED' >&2
  exit 1
fi
echo "tracking check OK: $(jq length .config/tracking/cases.json) cases; $(jq length "$tmp/constants.json") tracking issues and $(jq length "$tmp/rows.json") declined rows each open or decided"
'''

# The corpus's two roots, run through the driver as an author runs them: the
# strict root under `check`, every declaration checking and owing nothing, the
# library among it, at its package root (#628: it is built and
# tested by the corpus's gates); the fixture root under `test`, every fixture
# settled and every pending source still pending; and both roots in the
# sugared form, every source but those declaring `form(explicit)` written as
# the formatter's sugared form writes it. A red root exits nonzero and fails
# the gate.
["check:corpus"]
description = "The strict root under `gandr check --recheck`, so the kernel checks every declaration whatever verdicts the host keeps, the fixture root under `gandr test`, and both in the sugared form"
run = [
  ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- check --recheck crates/surface-corpus/strict library/std",
  ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- test corpus/classifier corpus/fragment corpus/model corpus/pathological corpus/pending corpus/surface",
  ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- fmt --check --form=sugared corpus/classifier corpus/fragment corpus/model corpus/pathological corpus/pending corpus/surface crates/surface-corpus/strict library/std",
]

# Merge residue never lands: a conflict marker, or what a merge driver writes
# as a comment, its resolution trailer or the `// refused_by:` line it puts
# atop each side of a block it could not resolve (#1560), read at a line's
# start and, whole as `// refused_by: <name> · collision:`, anywhere on a
# line, where a formatter that reflows the block joins it (#3217); nor a file
# named as residue, a driver's `.orig` backup or a `.rej` hunk, or the
# `_BACKUP_`, `_BASE_`, `_LOCAL_` and `_REMOTE_` copies `git mergetool`
# writes, which hold clean text no marker scan sees (#1642), or `wt:warm`'s
# clone probe, `.wt-warm-probe`, a tool's leftover (#3222). The line
# patterns live in
# `.config/merge-residue/patterns` and the path patterns in `names` beside
# it, one extended regular expression per line; each case in `cases.json`
# holds a `line` or a `path` and whether the patterns read it as residue;
# the line scan skips that file, whose cases are residue by design. Git
# writes conflict markers as EXACTLY seven marker characters followed by
# end-of-line or whitespace plus a label (`<<<<<<< HEAD`, bare `=======`).
# Anchoring on `([[:space:]]|$)` keeps real markers matched while rejecting
# longer decorative runs -- setext underlines and `====` delimiter rules are
# not conflicts. The trailer patterns bracket a character so the patterns
# file does not match itself. The `:/` pathspec scopes the line scan to
# tracked files under the repository root whatever directory the hook runs
# from; the name scan lists them from the root.
["check:merge-residue"]
description = "Detect conflict markers and merge-driver residue in tracked files"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
patterns="$root/.config/merge-residue/patterns"
names="$root/.config/merge-residue/names"
cases="$root/.config/merge-residue/cases.json"
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  want=$(jq -r .residue <<< "$case")
  if jq -e 'has("path")' <<< "$case" > /dev/null; then
    kind=path
    text=$(jq -r .path <<< "$case")
    against=$names
  else
    kind=line
    text=$(jq -r .line <<< "$case")
    against=$patterns
  fi
  got=false
  if grep -qE -f "$against" <<< "$text"; then got=true; fi
  if [[ "$got" != "$want" ]]; then
    printf 'merge residue case FAILED: %s\n  %s: %s\n  read as residue: %s, recorded: %s\n' "$name" "$kind" "$text" "$got" "$want" >&2
    failed=1
  fi
done < <(jq -c '.[]' "$cases")
(( failed == 0 )) || exit 1
if git grep -nIE -f "$patterns" -- ':/' ':(top,exclude).config/merge-residue/cases.json'; then
  echo 'merge residue check FAILED: conflict markers or merge-driver residue found' >&2
  exit 1
fi
if git -C "$root" ls-files | grep -E -f "$names"; then
  echo 'merge residue check FAILED: tracked files named as merge residue' >&2
  exit 1
fi
echo "merge residue check OK: $(jq length "$cases") cases read as recorded; no conflict markers, merge-driver residue or residue file names in tracked files"
'''

# A workflow never hashes a tarball through `hashFiles`: the expression
# engine reads the whole archive within a 120 s budget, and a build state
# large enough to exceed it fails a lane whose tests all passed (#1173). A
# step that writes or restores a tarball raises a flag in `GITHUB_ENV` and
# the conditions read the flag.
["check:workflow-hashing"]
description = "No hashFiles over a tarball in a workflow or composite action"
run = """
if git grep -nIE -e 'hashFiles[(][^)]*[.]tar' -- ':/.github'; then
  echo 'workflow hashing check FAILED: hashFiles over a tarball; raise a flag where the tarball is written' >&2
  exit 1
fi
echo 'workflow hashing check OK: no hashFiles over a tarball'
"""

# A landing with no enforcing shard report writes a skip result (#5496).
# `.config/spec-cost/landed-cases.bash` invokes its runner.
# The test checks the result.
["check:spec-cost-landed"]
description = "A landed report with no enforcing shard writes a skip result"
run = ".config/spec-cost/landed-cases.bash"

# CI pulls its image only when `find-image` calls the tag published, and a
# pull reads the tag's index and then its platform's manifest by digest. So
# `.github/actions/find-image/lookup.sh` calls a tag published only when the
# registry serves its index and every manifest the index lists (#5128);
# `cases.bash` holds its cases over a `docker` stub.
["check:find-image"]
description = "The CI image lookup reads a tag as published only when every manifest it lists is served"
tools.jq = "1.8.1"
run = ".github/actions/find-image/cases.bash"

# The crate map (#2290, `.config/crate-map/map.jq`): `ledger/crates.dot` and
# the category graph in `ledger/README.md` § Map (#3890) are what `cargo
# metadata` and `ledger/concerns.sql` give now, no crate lies outside the
# layering's categories of `crates/README.md`, and no edge points to a
# category listed after its own. Each
# case in `.config/crate-map/cases.json` holds the program's arguments, an
# input and the raw output it must give.
#
# The concerns ledger is its own re-dump and keeps its keys. Every concern has
# a site, and every site names a module its crate has. A sharing mechanism has
# a site unless it is banned, and has none if it is. Where a concern names its
# interface trait, every implementation of that trait outside a test is
# a site of the concern.
["check:crate-map"]
description = "The crate map is the manifests' and the concerns', and keeps the layering"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fresh=$(mktemp -d)
trap 'rm -rf "$fresh"' EXIT
failed=0
.config/cases/run.bash 'crate map' .config/crate-map/cases.json --program .config/crate-map/map.jq || failed=1
db="$fresh/concerns.db"
sqlite3 -bail "$db" < ledger/concerns.sql
sqlite3 "$db" .dump > "$fresh/concerns.sql"
if ! cmp -s "$fresh/concerns.sql" ledger/concerns.sql; then
  diff -u ledger/concerns.sql "$fresh/concerns.sql" >&2 || true
  echo 'ledger/concerns.sql is not its own re-dump; normalize it with `mise run ledger:concerns`' >&2
  failed=1
fi
concerns() { sqlite3 -separator '|' "$db" "$1"; }
while IFS='|' read -r finding; do
  echo "$finding" >&2
  failed=1
done < <(concerns "
  SELECT 'site of ' || concern || ' in ' || crate || ': no concern ' || concern FROM site WHERE concern NOT IN (SELECT id FROM concern)
  UNION ALL SELECT 'site in ' || crate || '::' || module || ': no mechanism ' || mechanism FROM site WHERE mechanism IS NOT NULL AND mechanism NOT IN (SELECT mechanism FROM descent)
  UNION ALL SELECT id || ': a concern with no site' FROM concern WHERE id NOT IN (SELECT concern FROM site)
  UNION ALL SELECT mechanism || ': a ' || status || ' mechanism with no site' FROM descent WHERE status <> 'banned' AND mechanism NOT IN (SELECT mechanism FROM site WHERE mechanism IS NOT NULL)
  UNION ALL SELECT mechanism || ': a banned mechanism with a site' FROM descent WHERE status = 'banned' AND mechanism IN (SELECT mechanism FROM site WHERE mechanism IS NOT NULL);")
while IFS='|' read -r concern crate module; do
  path=crates/$crate/src/${module//:://}
  if [[ -z $module ]]; then [[ -f crates/$crate/src/lib.rs ]]; else [[ -f $path.rs || -f $path/mod.rs ]]; fi \
    || { echo "$concern: a site in $crate::$module, a module $crate does not have" >&2; failed=1; }
done < <(concerns 'SELECT concern, crate, module FROM site ORDER BY concern, crate, module;')
while IFS='|' read -r concern interface; do
  trait=${interface##*::}
  while IFS=: read -r file _; do
    crate=${file#crates/}
    crate=${crate%%/*}
    module=${file#crates/"$crate"/src/}
    module=${module%.rs}
    module=${module%/mod}
    [[ $module == lib || $module == main ]] && module=
    module=${module//\//::}
    named=$(concerns "SELECT count(*) FROM site WHERE concern = '$concern' AND crate = '$crate' AND module = '$module' AND role IN ('defines', 'implements');")
    if (( named == 0 )); then
      echo "$concern: $file implements $interface, and no site names $crate::$module" >&2
      failed=1
    fi
  done < <(git grep -lE "impl(<[^>]*>)?[[:space:]]+([A-Za-z_]+::)*$trait[[:space:]]+for" -- 'crates/*/src/**.rs' ':(exclude,glob)crates/*/src/**/tests.rs' ':(exclude,glob)crates/*/src/**/tests/**' ':(exclude,glob)crates/*/src/tests.rs' ':(exclude,glob)crates/*/src/tests/**')
done < <(concerns 'SELECT id, interface FROM concern WHERE interface IS NOT NULL ORDER BY id;')
cargo metadata --locked --no-deps --format-version 1 > "$fresh/metadata.json"
sites=$(sqlite3 -json "$db" 'SELECT DISTINCT concern, crate FROM site ORDER BY concern, crate;')
map() { jq "$1" --arg form "$2" --rawfile readme crates/README.md --rawfile page ledger/README.md --argjson concerns "${sites:-[]}" -f .config/crate-map/map.jq "$fresh/metadata.json"; }
findings=$(map -r findings)
if [[ -n "$findings" ]]; then
  printf '%s\n' "$findings" >&2
  failed=1
fi
map -r dot > "$fresh/crates.dot"
map -j readme > "$fresh/README.md"
diff -u ledger/crates.dot "$fresh/crates.dot" >&2 || failed=2
diff -u ledger/README.md "$fresh/README.md" >&2 || failed=2
if (( failed == 2 )); then echo 'the crate map is stale; run `mise run ledger:crate-map`' >&2; fi
if (( failed )); then
  echo 'crate map check FAILED' >&2
  exit 1
fi
echo "crate map check OK: $(jq '.packages | length' "$fresh/metadata.json") crates, every edge down the layering, $(concerns 'SELECT count(*) FROM concern;') concerns on $(concerns 'SELECT count(*) FROM site;') sites, the map current"
'''

# The crate leads (#3155, `.config/crate-lead/lead.jq`): each source the table
# of `crates/README.md` § Storage and distribution names opens, before its
# first heading, with a lead naming the row's layer, each wall the row names
# and the section's paper key, so the storage picture is read where an agent
# reads first. Each case in `.config/crate-lead/cases.json` holds an input and
# what the program gives for it.
["check:crate-lead"]
description = "Each crate the storage picture places opens with a lead naming its layer, its wall and its paper"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
failed=0
.config/cases/run.bash 'crate lead' .config/crate-lead/cases.json --program .config/crate-lead/lead.jq || failed=1
input=$(jq -n --rawfile readme crates/README.md '{readme: $readme, sources: {}}')
mapfile -t paths < <(jq -r --arg form paths -f .config/crate-lead/lead.jq <<< "$input")
for path in "${paths[@]}"; do
  if [[ -f $path ]]; then
    input=$(jq --arg path "$path" --rawfile text "$path" '.sources[$path] = $text' <<< "$input")
  fi
done
findings=$(jq -r --arg form findings -f .config/crate-lead/lead.jq <<< "$input")
if [[ -n $findings ]]; then
  printf '%s\n' "$findings" >&2
  failed=1
fi
if (( failed )); then
  echo 'crate lead check FAILED' >&2
  exit 1
fi
echo "crate lead check OK: ${#paths[@]} crates of the storage picture each open with a lead naming its layer, its wall and its paper"
{% endraw %}'''

# The bootstrap census's programs (#2896): each case in
# `.config/census/cases.json` names its program, `surface.jq` or `census.jq`,
# and holds its arguments, an input and the output it must give, raw where
# that is text and compact where it is JSON, or `fails` where the program must
# refuse. The census itself moves with the tree and is never held here:
# `census.yml` reports it stale (`report:bootstrap-census`).
["check:census"]
description = "The bootstrap census's programs give each recorded case its output"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if ! .config/cases/run.bash census .config/census/cases.json --programs .config/census --mode j; then
  echo 'census check FAILED' >&2
  exit 1
fi
echo "census check OK: $(jq length .config/census/cases.json) cases give their recorded output"
'''

# The purposes ledger (`ledger/purposes.sql`): the dump builds with every
# constraint holding and is its own re-dump, and every concern tag is a key of
# `ledger/concerns.sql`, once in its row, that a site of the concern there
# covers: a site covers its module, the modules below it and their items, and
# a site at the empty module its whole crate. A crate with a row is held to
# its entries as `purposes:items` reads them: every public item has a row,
# every row names an entry, a crate row lands with a row for every module, and
# a module row with the crate row. A crate with no row is not read: it waits
# for its first pass. Each case in `.config/purposes/cases.json` holds the
# entry program's arguments, an input, and the output it must give or that it
# fails; each in `.config/purposes/coverage.json` the tags and sites the
# coverage program reads and the findings it gives. Every finding is printed
# before the gate fails.
["check:purposes"]
description = "Every public item of a crate the purposes ledger rows has its row, and every row names an item"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
fresh=$(mktemp -d)
trap 'rm -rf "$fresh"' EXIT
failed=0
.config/cases/run.bash 'purposes entry' .config/purposes/cases.json --program .config/purposes/items.jq || failed=1
.config/cases/run.bash 'purposes coverage' .config/purposes/coverage.json --program .config/purposes/coverage.jq || failed=1
db="$fresh/purposes.db"
sqlite3 -bail "$db" < ledger/purposes.sql
sqlite3 "$db" .dump > "$fresh/purposes.sql"
if ! cmp -s "$fresh/purposes.sql" ledger/purposes.sql; then
  diff -u ledger/purposes.sql "$fresh/purposes.sql" >&2 || true
  echo 'ledger/purposes.sql is not its own re-dump; normalize it with `mise run ledger:purposes`' >&2
  failed=1
fi
sqlite3 -bail "$db" < ledger/concerns.sql
mapfile -t rowed < <(sqlite3 "$db" 'SELECT DISTINCT crate FROM purpose ORDER BY crate;')
touch "$fresh/entries.tsv"
if (( ${#rowed[@]} )); then mise run --quiet purposes:items "${rowed[@]}" > "$fresh/entries.tsv"; fi
sqlite3 -bail -tabs "$db" 'CREATE TABLE entry(crate TEXT, path TEXT, kind TEXT, location TEXT);' ".import $fresh/entries.tsv entry"
findings=$(sqlite3 -bail "$db" <<'SQL'
WITH named(crate, path, kind, shown) AS (
  SELECT crate, path, kind, crate || CASE path WHEN '' THEN '' ELSE '::' || path END FROM purpose
),
listed(crate, path, kind, location, shown) AS (
  SELECT crate, path, kind, location, crate || CASE path WHEN '' THEN '' ELSE '::' || path END FROM entry
),
tags(crate, path, kind, shown, tag) AS (
  SELECT n.crate, n.path, n.kind, n.shown, t.value
  FROM purpose p JOIN named n USING (crate, path, kind), json_each('["' || replace(p.concerns, ' ', '","') || '"]') t
  WHERE p.concerns IS NOT NULL
)
SELECT crate || ': rows for no crate with a library under crates/; correct the crate or delete its rows'
FROM (SELECT DISTINCT crate FROM purpose WHERE crate NOT IN (SELECT crate FROM entry))
UNION ALL
SELECT l.shown || ' (' || l.kind || ', ' || l.location || '): a public item with no row; add'
  || ' INSERT INTO purpose VALUES(' || quote(l.crate) || ',' || quote(l.path) || ',' || quote(l.kind)
  || ',''<purpose>'',<concerns>,''<naming>'',''<doc>'',<finding>);'
  || ' to ledger/purposes.sql, each column as its schema there states, then run `mise run ledger:purposes`'
FROM listed l
WHERE l.kind NOT IN ('crate', 'module')
  AND NOT EXISTS (SELECT 1 FROM purpose p WHERE (p.crate, p.path, p.kind) = (l.crate, l.path, l.kind))
UNION ALL
SELECT n.shown || ' (' || n.kind || '): a row naming no entry of `mise run purposes:list ' || n.crate || '`; correct its path or kind, or delete it'
FROM named n
WHERE n.crate IN (SELECT crate FROM entry)
  AND NOT EXISTS (SELECT 1 FROM entry e WHERE (e.crate, e.path, e.kind) = (n.crate, n.path, n.kind))
UNION ALL
SELECT l.shown || ' (module, ' || l.location || '): no row, and its crate has the crate row; the crate row lands with a row for every module'
FROM listed l
WHERE l.kind = 'module'
  AND EXISTS (SELECT 1 FROM purpose c WHERE c.crate = l.crate AND c.kind = 'crate')
  AND NOT EXISTS (SELECT 1 FROM purpose p WHERE (p.crate, p.path, p.kind) = (l.crate, l.path, l.kind))
UNION ALL
SELECT n.shown || ' (module): a module row, and its crate has no crate row; module rows land with the crate row'
FROM named n
WHERE n.kind = 'module' AND NOT EXISTS (SELECT 1 FROM purpose c WHERE c.crate = n.crate AND c.kind = 'crate')
UNION ALL
SELECT shown || ' (' || kind || '): concern ' || tag || ' is no key of ledger/concerns.sql'
FROM tags WHERE tag NOT IN (SELECT id FROM concern)
UNION ALL
SELECT shown || ' (' || kind || '): concern ' || tag || ' is tagged more than once'
FROM tags GROUP BY crate, path, kind, tag HAVING count(*) > 1;
SQL
)
if [[ -n $findings ]]; then
  printf '%s\n' "$findings" >&2
  failed=1
fi
tags=$(sqlite3 -bail -json "$db" <<'SQL'
SELECT p.crate, p.path, p.kind, t.value AS tag
FROM purpose p, json_each('["' || replace(p.concerns, ' ', '","') || '"]') t
WHERE p.concerns IS NOT NULL AND t.value IN (SELECT id FROM concern)
ORDER BY p.crate, p.path, p.kind, t.key;
SQL
)
sites=$(sqlite3 -bail -json "$db" 'SELECT concern, crate, module FROM site ORDER BY concern, crate, module;')
uncovered=$(jq -n --argjson tags "${tags:-[]}" --argjson sites "${sites:-[]}" '{tags: $tags, sites: $sites}' | jq -r -f .config/purposes/coverage.jq)
if [[ -n $uncovered ]]; then
  printf '%s\n' "$uncovered" >&2
  failed=1
fi
if (( failed )); then
  echo 'purposes check FAILED' >&2
  exit 1
fi
echo "purposes check OK: $(sqlite3 "$db" 'SELECT count(*) FROM purpose;') rows, crates rowed: ${#rowed[@]}; every public item of a rowed crate has its row, every row names an entry, every concern tag is a key a site of its concern covers"
{% endraw %}'''

# The references ledger (`ledger/references.sql`) is what `ledger:references`
# writes from the crates' documentation, and the documentation keeps its
# shape: a key line names a library citation key, or `vault:` and a vault
# page's `mint:` uuid, with its role; a key has one role at a site; and a
# crate's README lists under `## References` exactly the keys its modules
# cite. When `$XDG_CONFIG_HOME/gandr/references` names the library's BibTeX
# file (`library <path>`) and the vault's checkout (`vault <path>`), each key
# must be a citation key there or a page's `mint:`; without it, a key is read
# for its shape alone. A site whose source has changed since its last reading
# is reported stale, never refused. The citation window refuses a work the
# crates or the corpus cite that appeared before the cutoff year
# `.config/references/window.toml` states, at a site no entry there covers;
# a work whose year neither its key nor a `work` row of the ledger states; and
# an entry covering no such work (`window.sql`). A site the citation
# refresh records in the ledger's `fidelity` table is held to its record
# (`fidelity.sql`, #4533): a historical site names its follow-up, a site
# citing one work its traced works, and a narrower newest work its anchor or
# the statement that none exists; the site no longer cites the work the
# refresh replaced, and a crate site cites each work by a key line stating
# what the site takes, never `lineage`, `background` or a bare locator. Each
# case in `.config/references/cases.json` holds sources and the lines
# `cites.awk` prints for them, each case in `.config/references/window.json`
# the citations, the years and the policy, and the window's findings, and
# each case in `.config/references/fidelity.json` the citations, the corpus
# sources and the `fidelity` rows, and the refresh's findings. Each case in
# `.config/references/watch.json` holds the paper watch's recorded OpenAlex
# works, its state and the vault ledger's `paper` rows, and the delta
# `watch.jq` reads from them (#2544). Every finding is printed before the
# gate fails.
["check:references"]
description = "The references ledger is the crates' citations, each key line keyed and given its role, each README listing its crate's keys, every work older than the citation window allowed where it is cited, and every site the citation refresh records held to its record"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/references/ledger.bash
root=$PWD
fresh=$(mktemp -d)
trap 'rm -rf "$fresh"' EXIT
failed=0
while IFS= read -r case; do
  dir=$(mktemp -d "$fresh/case.XXXXXX")
  mapfile -t paths < <(jq -r '.files | keys_unsorted[]' <<< "$case")
  for path in "${paths[@]}"; do
    mkdir -p "$dir/$(dirname "$path")"
    jq -j --arg path "$path" '.files[$path]' <<< "$case" > "$dir/$path"
  done
  got=$(cd "$dir" && LC_ALL=C awk -f "$root/.config/references/cites.awk" "${paths[@]}")
  if [[ "$got" != "$(jq -r '.output | join("\n")' <<< "$case")" ]]; then
    printf 'references citation case FAILED: %s\n  gave:\n%s\n' "$(jq -r .name <<< "$case")" "$got" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/references/cases.json)
while IFS= read -r case; do
  dir=$(mktemp -d "$fresh/window.XXXXXX")
  jq -r '.cite[]' <<< "$case" > "$dir/cites.tsv"
  jq -r '.policy' <<< "$case" > "$dir/window.toml"
  sqlite3 -bail "$dir/case.db" < ledger/references.sql
  sqlite3 -bail -tabs "$dir/case.db" 'DELETE FROM reference;' 'DELETE FROM work;' \
    "$(jq -r '.work[] | "INSERT INTO work VALUES('"'"'\(.[0])'"'"', \(.[1]), \(if .[2] then "'"'"'\(.[2])'"'"'" else "NULL" end));"' <<< "$case")" \
    'CREATE TABLE cite(kind TEXT, key TEXT, crate TEXT, module TEXT, role TEXT, location TEXT);' \
    ".import $dir/cites.tsv cite"
  got=$(references_window "$dir/case.db" "$dir/window.toml")
  if [[ "$got" != "$(jq -r '.output | join("\n")' <<< "$case")" ]]; then
    printf 'references window case FAILED: %s\n  gave:\n%s\n' "$(jq -r .name <<< "$case")" "$got" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/references/window.json)
while IFS= read -r case; do
  dir=$(mktemp -d "$fresh/fidelity.XXXXXX")
  jq -r '.cite[]' <<< "$case" > "$dir/cites.tsv"
  jq -r '.corpus[]' <<< "$case" > "$dir/corpus"
  jq -c '.fidelity' <<< "$case" > "$dir/fidelity.json"
  sqlite3 -bail "$dir/case.db" < ledger/references.sql
  sqlite3 -bail -tabs "$dir/case.db" 'DELETE FROM reference;' 'DELETE FROM work;' 'DELETE FROM fidelity;' \
    "INSERT INTO fidelity SELECT value ->> 'crate', value ->> 'module', value ->> 'old', value ->> 'verdict', value ->> 'follow_up',
       value ->> 'followed', value ->> 'scope', value ->> 'anchor', value ->> 'unanchored' FROM json_each(readfile('$dir/fidelity.json'));" \
    'CREATE TABLE cite(kind TEXT, key TEXT, crate TEXT, module TEXT, role TEXT, location TEXT);' \
    ".import $dir/cites.tsv cite" \
    'CREATE TABLE corpus(path TEXT PRIMARY KEY);' \
    ".import $dir/corpus corpus"
  got=$(references_fidelity "$dir/case.db")
  if [[ "$got" != "$(jq -r '.output | join("\n")' <<< "$case")" ]]; then
    printf 'references fidelity case FAILED: %s\n  gave:\n%s\n' "$(jq -r .name <<< "$case")" "$got" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/references/fidelity.json)
while IFS= read -r case; do
  got=$(jq -c -L .config/references 'include "watch"; .input | delta' <<< "$case")
  if [[ "$got" != "$(jq -c '.output' <<< "$case")" ]]; then
    printf 'references watch case FAILED: %s\n  gave:\n%s\n' "$(jq -r .name <<< "$case")" "$got" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/references/watch.json)
db=$fresh/references.db
references_load "$db"
references_fresh "$db"
sqlite3 "$fresh/fresh.db" .dump > "$fresh/references.sql"
if ! cmp -s "$fresh/references.sql" ledger/references.sql; then
  diff -u ledger/references.sql "$fresh/references.sql" >&2 || true
  echo 'ledger/references.sql is not the citations the documentation makes; write it with `mise run ledger:references`' >&2
  failed=1
fi
config=${XDG_CONFIG_HOME:-$HOME/.config}/gandr/references
resolved='for their shape alone: no library and no vault are configured'
unresolved=
if [[ -f $config ]]; then
  library=$(awk '$1 == "library" { sub(/^library[[:space:]]+/, ""); print }' "$config")
  vault=$(awk '$1 == "vault" { sub(/^vault[[:space:]]+/, ""); print }' "$config")
  if [[ -f $library && -d $vault ]]; then
    {
      LC_ALL=C awk 'match($0, /^@[A-Za-z]+\{[^,]+,/) { open = index($0, "{"); print substr($0, open + 1, RLENGTH - open - 1) }' "$library"
      git -C "$vault" grep -hoE 'mint: [0-9a-f-]{36}' -- '*.md' | awk '{ print "vault:" $2 }'
    } > "$fresh/known"
    sqlite3 -bail -tabs "$db" 'CREATE TABLE known(key TEXT);' ".import $fresh/known known"
    resolved='against the library and the vault $XDG_CONFIG_HOME/gandr/references names'
    unresolved="UNION ALL
SELECT min(location) || ': \`' || key || '\` is no citation key of the library and no vault page''s \`mint:\`; cite the source by its library key, or the page by \`vault:\` and its \`mint:\`'
FROM cite WHERE kind IN ('cite', 'mirror') AND key NOT IN (SELECT key FROM known) GROUP BY key"
  else
    echo "$config names no library file and vault checkout that exist: write \`library <BibTeX file>\` and \`vault <checkout>\`, one a line" >&2
    failed=1
  fi
fi
findings=$(sqlite3 -bail "$db" "
WITH cited(crate, key, location) AS (SELECT crate, key, min(location) FROM cite WHERE kind = 'cite' GROUP BY crate, key),
listed(crate, key, location) AS (SELECT crate, key, min(location) FROM cite WHERE kind = 'mirror' GROUP BY crate, key)
SELECT location || ': ' || key FROM cite WHERE kind = 'refused'
UNION ALL
SELECT min(location) || ': \`' || key || '\` is cited as ' || group_concat(DISTINCT role) || ' at one site; give it one role there'
FROM cite WHERE kind = 'cite' GROUP BY key, crate, module HAVING count(DISTINCT role) > 1
UNION ALL
SELECT 'crates/' || c.crate || '/README.md: \`## References\` lacks \`' || c.key || '\`, which ' || c.location || ' cites; add - \`' || c.key || '\` — <role>: <authors, title, venue, date, identifier, and what the crate takes from it>'
FROM cited c WHERE NOT EXISTS (SELECT 1 FROM listed l WHERE (l.crate, l.key) = (c.crate, c.key))
UNION ALL
SELECT l.location || ': \`## References\` lists \`' || l.key || '\`, which no module of ' || l.crate || ' cites; cite it in the \`# References\` of the module it decides something for, or delete the entry'
FROM listed l WHERE NOT EXISTS (SELECT 1 FROM cited c WHERE (c.crate, c.key) = (l.crate, l.key))
$unresolved;")
if [[ -n $findings ]]; then
  printf '%s\n' "$findings" >&2
  failed=1
fi
if ! window=$(references_window "$db" .config/references/window.toml); then
  failed=1
elif [[ -n $window ]]; then
  printf '%s\n' "$window" >&2
  failed=1
fi
fidelity=$(references_fidelity "$db")
if [[ -n $fidelity ]]; then
  printf '%s\n' "$fidelity" >&2
  failed=1
fi
sqlite3 -bail "$db" "
SELECT s.shown || ': \`' || r.key || '\` was read on ' || r.read_date || ' at ' || substr(r.read_commit, 1, 12) || ', and ' || s.path || ' has changed since; read it again against the change, then run \`mise run refs:read ' || s.shown || ' ' || r.key || '\`'
FROM reference r JOIN source s USING (crate, module)
WHERE r.read_blob <> s.blob
ORDER BY s.shown, r.key;"
if (( failed )); then
  echo 'references check FAILED' >&2
  exit 1
fi
echo "references check OK: $(sqlite3 "$db" "
SELECT count(*) || ' rows, ' || count(DISTINCT key) || ' sources at ' || count(DISTINCT crate || ' ' || module) || ' sites in ' || count(DISTINCT crate) || ' crates; '
  || count(*) FILTER (WHERE key NOT GLOB 'doi:*' AND key NOT GLOB 'arXiv:*') || ' by key, the rest by locator; '
  || count(*) FILTER (WHERE read_blob IS NOT NULL) || ' read, '
  || (SELECT count(*) FROM reference r JOIN source s USING (crate, module) WHERE r.read_blob <> s.blob) || ' of them stale'
FROM reference;"); keys read $resolved; $(sqlite3 "$db" "SELECT 'the citation window opens in ' || (SELECT cutoff FROM window) || ', ' || count(*) || ' allowlist entries holding what it refuses' FROM allow;"); $(sqlite3 "$db" "SELECT count(DISTINCT crate || ' ' || module) || ' sites the citation refresh records' FROM fidelity;")"
{% endraw %}'''

# The stacking rule's readings (#1264): `open.jq` reads the open pull
# requests and why each is held, a draft or the owner's `hold:owner` (#3253),
# `rests.jq` the hold a landing rests on, `chain.jq` a pull request's
# stack from the open pull requests, `top.jq` the top a new one stacks on,
# `state.jq` a member's readiness (#2783), `dirty.jq` whether `pr:watch`'s
# `DIRTY` reading is a conflict (#2854), `heal.jq` whether its heal restacks
# or waits on a queued member (#3615), `superseded.jq` whether a cancelled
# check's run was superseded on its head (#2829), `prefix.jq` what a landing
# queues (#1988), `bottom.jq` whether a stack's bottom stands off the trunk
# and `carried.jq` which carried pull requests a landing waits on (#4168),
# `sweep.jq` which worktrees `wt:sweep` removes, `warm.jq` which copied
# build units `wt:warm` removes because they read the primary's sources
# (#5137), `moved.jq`
# whether `pr:open` restacks onto a top that moved while it measured (#3849),
# `awaited.jq` the event `pr:await` wakes a seat on (#4164), and
# `triggers.jq` whether the landing watcher reads on the events that change
# what lands, never a schedule (#2984). Each case in
# `.config/pr-stack/cases.json` names its program, its arguments and input,
# and the output it must give; `prefix.jq`'s and `state.jq`'s output is its
# raw line, the others' compact JSON. `triggers.jq` also reads
# `.github/workflows/landing.yml`'s own `on`, refusing what it refuses.
# `.config/pr-stack/own-commits.bash` restacks a scratch repository's stack
# whose lower branch landed squashed, once per case in
# `.config/pr-stack/restacks.json`: only the upper's own commit is replayed,
# and with no landed head the conflict names its file (#3078).
# `.config/pr-stack/fetched-base.bash` stacks an upper on a lower in a
# scratch repository, once per case in `.config/pr-stack/fetched.json`: a
# lower merged on the origin since the last fetch measures the upper from the
# lower's head, not the stale trunk (#3148, `measured_from`), and so does a
# lower that restacked after `pr:open` recorded the upper on it (#4064).
# `.config/pr-stack/behind-top.bash` stacks an upper on a lower in a scratch
# repository, once per case in `.config/pr-stack/behind.json`: a lower that
# lacks the trunk change the upper builds on arms `pr:await` while it is
# bound for the trunk, queued, behind with its checks pending or passed, or
# conflicting within its seat's claim window; it is stacked past once it has
# conflicted past the window, and refused naming the change while it is held
# or failed (#4124, #4164, `bound.jq`); a conflict with the lower's own
# change is refused at once (#3654, `stack_on_top`). A branch stacked once,
# over a lower restacked since, replays its own commit alone (#3877,
# `stack_base`). `.config/pr-stack/past.bash` cuts a red member out of a
# scratch repository's stack, once per case in `.config/pr-stack/past.json`:
# the members above it replay their own commits onto the member below it, or
# onto the trunk past a red bottom, and the server stack is unstacked,
# retargeted and linked without it; a member building on its change stops
# the cut with nothing moved (#4642, `restack_past`).
# `.config/pr-stack/heal.bash` runs `pr:watch`'s heal under `set -u`, once
# per case in `.config/pr-stack/heal.json`: a restack that cuts no member and
# one past a red member each report `pr-restacked` and return (#4766).
# `.config/pr-stack/cut.bash` runs `stall:watch`'s cut of a red bottom
# (`cut_bottom`) over a scratch repository, once per case in
# `.config/pr-stack/cut.json`: the members above replay onto the trunk, the
# red one is retargeted onto the new top and linked there, and the stale runs
# are cancelled; a member above changing the red one's path refuses the cut
# with nothing moved (#5073). `red.jq` reads which check makes a bottom red,
# and `stale.jq` which runs a cut made stale.
# `.config/pr-stack/replays.bash` lands a scratch repository's lower branch,
# once per case in `.config/pr-stack/replays.json`, and reads the commits of
# the upper a rebase onto main would replay empty: a lower rewritten before
# it landed leaves its earlier head there, and the landing watcher tells the
# seat rather than have GitHub replay it (#4463, `upstream_replays`).
# `.config/pr-stack/queue.bash` runs `queue_stack` over the stacks in
# `.config/pr-stack/queue.json`, `gh` recorded: one open pull request in no
# server stack above another queued on its own takes no link and waits for
# it, never asking the stack merge, while open members it links are merged
# up to the top (#4843).
# `.config/pr-stack/await.bash` runs `pr:await` once per case in
# `.config/pr-stack/await.json` over a stubbed `gh`: a read that fails is a
# failed read, and the wait runs on to its deadline, while a read that
# succeeds ends it on its event (#4803).
# `.config/pr-stack/sweep-subjects.bash` reads a scratch repository's
# branches as `wt:sweep` reads them: a commit whose subject repeats one the
# trunk held before the fork keeps its branch, and a subject the trunk gains
# after the fork deletes it (#5118, `own_commits`).
["check:pr-stack"]
description = "The stacking rule's readings give each recorded case its output, the landing watcher reads on events, a restack replays only a stack's own commits, a red member is cut out of its stack, a heal reports its restack, a change is measured from a fetched trunk, a top behind the trunk arms pr:await, is stacked past or is refused, the commits a rebase would replay empty are read, a member above a queued one is merged only once linked, pr:await outlasts a failed read, and the sweep judges a subject from the fork"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
.config/cases/run.bash pr-stack .config/pr-stack/cases.json --programs .config/pr-stack --mode c --raw prefix.jq --raw state.jq || failed=1
triggers=$(yq -o=json '.on' .github/workflows/landing.yml | jq -c -f .config/pr-stack/triggers.jq | jq -r '.[] | ".github/workflows/landing.yml: \(.)"')
if [[ -n "$triggers" ]]; then
  printf '%s\n' "$triggers" >&2
  failed=1
fi
.config/pr-stack/own-commits.bash || failed=1
.config/pr-stack/past.bash || failed=1
.config/pr-stack/heal.bash || failed=1
.config/pr-stack/cut.bash || failed=1
.config/pr-stack/fetched-base.bash || failed=1
.config/pr-stack/behind-top.bash || failed=1
.config/pr-stack/replays.bash || failed=1
.config/pr-stack/queue.bash || failed=1
.config/pr-stack/await.bash || failed=1
.config/pr-stack/sweep-subjects.bash || failed=1
(( failed == 0 )) || exit 1
echo "pr-stack check OK: $(jq length .config/pr-stack/cases.json) cases read as recorded; the landing watcher reads on events; a restack replays only its own commits; a red member is cut out of its stack; a heal reports its restack; a change is measured from a fetched trunk; a top behind the trunk arms pr:await, is stacked past or is refused; a rebase's empty replays are read; a member above a queued one merges only once linked; pr:await outlasts a failed read; the sweep judges a subject from the fork"
'''

# Every `gh` call site has a measured price, and each identity's hour of
# calls stays within its ceiling (#5061). `.config/gh/sites.awk` lists the
# calls in the workflow's shell, tasks and workflows. `.config/gh/budget.jq`
# reads them against `.config/gh/calls.toml`, and `.config/gh/cases.json`
# holds its cases. A new call site, a changed one or a price over a ceiling
# fails here, before it spends the shared limit.
["check:gh-budget"]
description = "Every gh call site has a measured price in .config/gh/calls.toml, and each identity's hour of calls stays within its ceiling"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
.config/cases/run.bash gh-budget .config/gh/cases.json --program .config/gh/budget.jq || failed=1
sites=$(git ls-files -z -- '.config/*.sh' '.config/*.bash' '.config/*.toml' '.github/*.yml' '.github/*.yaml' \
  | xargs -0 awk -f .config/gh/sites.awk \
  | jq -R -s -c 'split("\n") | map(select(. != "") | split("\t") | {file: .[0], scope: .[1], verb: .[2]})')
table=$(yq -p toml -o json -I 0 .config/gh/calls.toml)
findings=$(jq -n -c --argjson sites "$sites" --argjson table "$table" '{$sites, $table}' | jq -r -L .config/gh -f .config/gh/budget.jq)
if [[ -n $findings ]]; then
  printf '%s\n' "$findings" >&2
  failed=1
fi
(( failed == 0 )) || exit 1
echo "gh-budget check OK: $(jq length <<< "$sites") calls in $(jq '[.[] | [.file, .scope]] | unique | length' <<< "$sites") sites priced, each identity within its ceiling"
'''

