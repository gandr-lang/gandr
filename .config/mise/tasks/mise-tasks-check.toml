'''

# The commit rules over a branch's own commits (`.config/commits/lint.bash`,
# #2640), which `pr:open` and the pre-push tier run before a pull request
# exists. Each case in `.config/commits/cases.json` commits its commits on a
# fresh scratch repository as the agent identity, each with or without the
# trailers and with or without a change, and states whether the range is
# refused under its flag: a trailer-less copy of a merged commit is refused
# (the regression: #2613 carried one), an empty commit under `--empty`, and
# a closing keyword anywhere but its own `Closes #n` line (#2980), since
# GitHub closes the issue it names when the commit reaches main. A case
# with `push` runs the push tier (`.config/commits/push.bash`) instead, as
# if the commits were pushed to that ref: a branch's trailer-less commit is
# refused, and a notes ref, which shares no history with the trunk, passes
# (#5651).
["check:commits"]
description = "The commit rules over a range refuse a trailer-less commit and, asked, an empty one; the push tier reads a branch and passes a notes ref"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
export COMMITLINT_CONFIG="$root/commitlint.config.mjs"
COMMITLINT_BIN=$(mise which commitlint)
export COMMITLINT_BIN
export GIT_AUTHOR_NAME=agent-shade GIT_AUTHOR_EMAIL=agent-shade@users.noreply.github.com
export GIT_COMMITTER_NAME=agent-shade GIT_COMMITTER_EMAIL=agent-shade@users.noreply.github.com
trailers=$'Assisted-by: LLM\nCo-authored-by: silvanshade <silvanshade@users.noreply.github.com>'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  repo="$scratch/$(jq -r '.name | @base64' <<< "$case" | tr -dc 'A-Za-z0-9' | cut -c1-24)"
  git init --quiet --initial-branch=main "$repo"
  git -C "$repo" config commit.gpgsign false
  git -C "$repo" commit --quiet --allow-empty -m 'chore(repo): the base' -m "$trailers"
  base=$(git -C "$repo" rev-parse HEAD)
  while IFS= read -r commit; do
    args=(--quiet --allow-empty -m "$(jq -r .message <<< "$commit")")
    if [[ $(jq -r .trailers <<< "$commit") == true ]]; then args+=(-m "$trailers"); fi
    if [[ $(jq -r .change <<< "$commit") == true ]]; then
      date +%s%N >> "$repo/file"
      git -C "$repo" add file
    fi
    git -C "$repo" commit --no-verify "${args[@]}"
  done < <(jq -c '.commits[]' <<< "$case")
  want=$(jq -r .exit <<< "$case")
  got=0
  push=$(jq -r '.push // empty' <<< "$case")
  if [[ -n $push ]]; then
    git -C "$repo" update-ref refs/remotes/origin/landing "$base"
    head=$(git -C "$repo" rev-parse HEAD)
    if [[ $push == refs/notes/* ]]; then
      git -C "$repo" notes --ref "$push" add -m 'moved' "$head"
      head=$(git -C "$repo" rev-parse "$push")
    fi
    out=$(cd "$repo" && GANDR_TRUNK=landing PRE_COMMIT_REMOTE_BRANCH="$push" PRE_COMMIT_TO_REF="$head" \
      "$root/.config/commits/push.bash" 2>&1) || got=$?
  else
    out=$(cd "$repo" && "$root/.config/commits/lint.bash" "$base" HEAD $(jq -r .flag <<< "$case") 2>&1) || got=$?
  fi
  if [[ $got != "$want" ]]; then
    printf 'commits case FAILED: %s\n  exit %s, wanted %s\n%s\n' "$name" "$got" "$want" "$out" >&2
    failed=1
  fi
done < <(jq -c '.[]' "$root/.config/commits/cases.json")
(( failed == 0 )) || exit 1
echo "commits check OK: $(jq length "$root/.config/commits/cases.json") cases read as recorded"
'''

# The claim lifecycle (`.config/claims/decide.jq`, #1270) picks the claims
# that come off. Each case in `.config/claims/cases.json` holds an input and
# the removals it must give: a merge's `Advances` and closing targets, the
# closed and epic sweep, a label 4 hours old however fresh the issue (#3915),
# read on a merge's run too, and an open pull
# request that keeps a claim. Each case in `.config/claims/opening.json`
# holds a branch, a body, the issues it works, the tree's lines naming what
# it supersedes, the concerns ledger and the sources the change adds, and the
# lines `pr:open` prints for them, or none (`opening.jq`): the body must work
# the branch's issue (#2462), answer the sources (#2499) and the reading axes
# (#2522) its issues request, and name the concerns it touches (#2523); each
# in `.config/claims/signed.json` the issues a body works and the lines
# `pr:open` refuses them with until each is sectioned and carries
# `shape:signed`, or none (`signed.jq`, #3134). Each
# case in `.config/claims/unit.json` holds an issue body and the lines
# `unit:check` prints for it, or none (`unit.jq`, #2532); each in
# `.config/claims/next.json` a lane's areas, the open issues, the picks read
# again before the claim, and the claim `claim:next` takes from them, or none,
# or the claim the lane holds (`next.jq`, #2533, #3736, #3915, #4660), a case
# naming a lane reading its row of `.config/issues/lanes.toml` as the table
# writes it (#4056); each in `.config/claims/claimed.json` a lane, a body and
# the labels the write reads, and the body `claim:next` writes before its
# claim, whether the lane keeps the claim after it, or the body a lapse leaves
# (`claimed.jq`, #4660, #5531); each in `.config/claims/taken.json` a
# branch or a lane, an issue, and the unit the branch works, the gate's
# verdict on its claim, or what `claim:take` writes (`taken.jq`, #5146); each in
# `.config/claims/ledger.json`
# a body, the ledger rows a change touches and the lines `ledger:patched`
# prints for them, or none (`ledger.jq`, #2525); each in
# `.config/claims/reserved.json` the syntax ledger's reserved rows, their
# status at the head and the issues they cite, and the lines
# `ledger:reserved` prints for them, or none (`reserved.jq`, #2528). Each
# case in `.config/claims/patched.json` runs `ledger:patched` itself on a
# scratch repository whose head adds `padding` rows of about 500 bytes to
# this checkout's features table, under a body naming none, and holds its
# exit and the count of lines it prints: a table past the argument limit is
# read, not refused by the shell (#2671). Each case in
# `.config/claims/board.json` runs `refactor:file` itself the same way, a stub
# `gh` answering with a board past the argument limit, and holds the decision
# its dry run prints (#3771). Each case in `.config/claims/filed-once.json`
# runs `issue:file` or `refactor:file` from two clones over one stub GitHub,
# and holds the issues the board ends with (`filed-once.bash`, #5149). Each
# case in
# `.config/claims/shown.json` holds an issue body, the vault's pages and the
# tree's filenames, and the lines `unit:check` reads for the vault pages the
# body names (`shown.jq`, #2793); each in `.config/claims/annotated.json` a
# body and the body `pr:open` writes back with each page's mint beside its
# filename (`annotated.jq`). Each case in `.config/claims/deps.json` holds an
# issue, the issues GitHub has it blocked by and its sub-issues, and the
# dependencies `unit:check` sets or notes for them (`deps.jq`, #2902); each
# in `.config/claims/chain.json` a rung's body and the body `epic:order
# --chain` writes back (`chain.jq`); each in `.config/claims/report.json`
# the open issues, their dependencies and the last report, and the report
# `report:deps` writes (`report.jq`); each in `.config/claims/reads.json` the
# open issues and the one pass's map, and the issues `report:deps` reads with
# what GitHub records for each (`reads.jq`, #3192); each in
# `.config/claims/filing.json` a
# merged pull request, the refactor issues, and what `refactor:file` files
# for them (`filing.jq`, #2885); each in `.config/claims/obligations.json`
# the merged pull requests of a period with their units, and the report
# `report:obligations` writes (`obligations.jq`, #2886); each in
# `.config/claims/period.json` a period and the days and month before it
# reads, or its refusal (`period.jq`, #3576); each in
# `.config/claims/terms.json` a unit's title and body, term map rows, and the
# findings `unit:check` prints for its vocabulary (`terms.jq`, #3158); each in
# `.config/claims/absorbing.json` a body, its issues and the vault's
# absorption statuses, and the line `pr:open` and `pr:land` refuse a design
# page left unanswered in its `## Vault` with (`absorbing.jq`, #3161); each
# in `.config/claims/design.json` the vault's absorption statuses, its unit
# tables and the open issues, and the lines `report:design` prints for the
# design pages and the open units that no open issue names (`design.jq`,
# #3401); each
# in `.config/claims/swept.json` a night's recovery causes, the open recovery
# collectors, and the rows `ci:recovery-file` marks and the collectors it
# closes (`swept.jq`, #3326, #3732); each in `.config/claims/landed.json` a
# merged body, the issues it advances, and the rows the merge ticks and the
# collectors it closes (`landed.jq`, #3732); each in
# `.config/claims/slow.json` one run's test times, the open slow-test
# collectors, and the collectors `ci:slow-file` opens, marks and closes
# (`slow.jq`, #3752); each in
# `.config/claims/observed.json` a body, whether it works a defect and the
# transcripts the change adds, and the `### Observed` block
# `evidence:obligations` writes for them (`observed.jq`, #3758); each in
# `.config/claims/splice.json` a body, a block of several lines, and the body
# the splice writes with it (`observed.awk`, #3784); each in
# `.config/claims/hand-off.json` a transcript's size, and the block
# `observed.bash` prints for a change adding it (#3871); each in
# `.config/claims/comments.json` a Rust diff, and the files of it that change
# only comments (`comments.jq`, #5498). The
# term map itself, `.config/references/terms.toml`, is read whole: every row
# carries a name, a match that compiles, an owner and a reason, and every
# owner that is a tree path exists.
["check:claims"]
description = "The claim lifecycle gives each recorded case its removals, pr:open each body its refusal, unit:check each issue its findings and dependencies, claim:next each board its claim, ledger:patched each landing its refusals, ledger:reserved each lowered reserved rule its refusal, report:deps each board its report, refactor:file each merged verdict its filing and report:obligations each period its report, and pr:hold each held comment its table"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
cases() {
  .config/cases/run.bash "$1" ".config/claims/$3" --program ".config/claims/$2" -L .config/issues "${@:4}" || failed=1
}
cases claims decide.jq cases.json
cases opening opening.jq opening.json
cases signed signed.jq signed.json
cases unit unit.jq unit.json
cases next next.jq next.json
cases claimed claimed.jq claimed.json --mode c
cases taken taken.jq taken.json --mode c
cases ledger ledger.jq ledger.json
cases reserved reserved.jq reserved.json
cases shown shown.jq shown.json
cases annotated annotated.jq annotated.json
cases deps deps.jq deps.json
cases chain chain.jq chain.json
cases report report.jq report.json
cases filing filing.jq filing.json --mode c
cases obligations obligations.jq obligations.json
cases period period.jq period.json --mode c
cases terms terms.jq terms.json
cases absorbing absorbing.jq absorbing.json
cases design design.jq design.json
cases reads reads.jq reads.json --mode c
cases swept swept.jq swept.json --mode c
cases landed landed.jq landed.json --mode c
cases slow slow.jq slow.json --mode c
cases observed observed.jq observed.json
cases comments comments.jq comments.json --mode c
# A `next.json` case that names a lane reads that lane's row of
# `.config/issues/lanes.toml`, its areas in the table's order (#4056).
lanes=$(yq -p toml -o json -I 0 '.lane' .config/issues/lanes.toml)
strays=$(jq -r --argjson lanes "$lanes" '.[] | select(.input.lane != null)
  | ($lanes[.input.lane] // null | if . == null then null else map("area:" + .) end) as $row
  | select($row != .input.areas)
  | "  \(.name): lane `\(.input.lane)` reads \(.input.areas | join(", ")); the table holds \($row // [] | if length == 0 then "no such row" else join(", ") end)"' .config/claims/next.json)
if [[ -n $strays ]]; then
  echo "claims check FAILED: a claim:next case reads a lane .config/issues/lanes.toml does not hold as written:" >&2
  echo "$strays" >&2
  failed=1
fi
(( failed == 0 )) || exit 1
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
# `evidence:obligations` splices the `### Observed` block into a body
# (`observed.awk`): for each case in `.config/claims/splice.json` a body and a
# block of several lines, and the body the splice writes, under every awk
# (#3784).
while IFS= read -r case; do
  jq -j .body <<< "$case" > "$scratch/observed.md"
  wanted=$(jq -j .output <<< "$case")
  got=$(block=$(jq -j .block <<< "$case") awk -f .config/claims/observed.awk "$scratch/observed.md" 2>&1) || failed=1
  if [[ $got != "${wanted%$'\n'}" ]]; then
    printf 'splice case FAILED: %s\n  got:\n%s\n' "$(jq -r .name <<< "$case")" "$got" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/splice.json)
(( failed == 0 )) || exit 1
printf '## Ledger\n\nNone.\n' > "$scratch/body.md"
line=$(printf 'a padded row of the argument-limit case, %.0s' {1..11})
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  repo="$scratch/repo-$(jq -r .padding <<< "$case")"
  git init --quiet --initial-branch=main "$repo"
  git -C "$repo" config commit.gpgsign false
  mkdir -p "$repo/ledger"
  cp ledger/features.sql "$repo/ledger/features.sql"
  git -C "$repo" add ledger && git -C "$repo" commit --quiet --no-verify -m base
  for (( i = 0; i < $(jq .padding <<< "$case"); i++ )); do
    printf "INSERT INTO feature VALUES('padding-%05d','padding','A padded row',NULL,'planned','ordinary',NULL,'%s',NULL,NULL,NULL,'#2671',NULL);\n" "$i" "$line"
  done >> "$repo/ledger/features.sql"
  git -C "$repo" add ledger && git -C "$repo" commit --quiet --no-verify --allow-empty -m head
  got=0
  out=$(GIT_DIR="$repo/.git" GIT_WORK_TREE="$repo" mise run --quiet ledger:patched "$scratch/body.md" HEAD~1 2> "$scratch/err") || got=$?
  lines=$(grep -c . <<< "$out" || true)
  if [[ $got != $(jq .exit <<< "$case") || $lines != $(jq .lines <<< "$case") ]]; then
    printf 'patched case FAILED: %s\n  exit %s and %s lines, wanted exit %s and %s lines\n%s\n%s\n' "$name" "$got" "$lines" \
      "$(jq .exit <<< "$case")" "$(jq .lines <<< "$case")" "$(printf '%s\n' "$out" | awk 'NR <= 3')" "$(cat "$scratch/err")" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/patched.json)
(( failed == 0 )) || exit 1
# `refactor:file` reads a board past the argument limit (#3771): for each case
# in `.config/claims/board.json` a stub `gh` answers with a merged pull
# request whose verdict is `no` and the case's count of refactor issues, 250
# bytes of body each, and the dry run prints the case's decision. The pinned
# `gh` is disabled for the run, so the stub answers.
mkdir -p "$scratch/gh"
# Each case's stub answers differently: no reading is kept between them.
export GH_BUDGET_TTL=0
printf '%s\n' '#!/usr/bin/env bash' 'case $1 in' \
  'repo) echo gandr-lang/gandr ;;' 'api) cat "$STUB_GH/pr.json" ;;' 'issue) cat "$STUB_GH/issues.json" ;;' \
  '*) echo "stub gh: $*" >&2; exit 1 ;;' 'esac' > "$scratch/gh/gh"
chmod +x "$scratch/gh/gh"
jq -n '{state: "MERGED", body: "## Refactoring\n\nno\n", headRefName: "triage-7-board",
  closingIssuesReferences: {nodes: [{number: 7, parent: null, labels: {nodes: [{name: "area:workflow"}]}}]}}' > "$scratch/gh/pr.json"
while IFS= read -r case; do
  jq -n --argjson count "$(jq .issues <<< "$case")" \
    '[range($count) | {number: (. + 1), state: "CLOSED", body: ("a refactor body of the argument-limit case, " * 6)}]' > "$scratch/gh/issues.json"
  decision=$(PATH="$scratch/gh:$PATH" STUB_GH="$scratch/gh" MISE_DISABLE_TOOLS="${MISE_DISABLE_TOOLS:+$MISE_DISABLE_TOOLS,}github:cli/cli" \
    mise run --quiet refactor:file 7 --dry-run 2> "$scratch/err") || true
  if [[ $(jq -r '.act // empty' <<< "$decision" 2> /dev/null) != $(jq -r .act <<< "$case") ]]; then
    printf 'board case FAILED: %s\n  gave: %s\n%s\n' "$(jq -r .name <<< "$case")" "$decision" "$(cat "$scratch/err")" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/board.json)
(( failed == 0 )) || exit 1
# A filing ends with one open issue against one GitHub (#5149): each case in
# `.config/claims/filed-once.json` runs `issue:file --epic` over an epic at or
# below GitHub's 100 sub-issues, or two `refactor:file` runs at once from two
# clones, over the stub `filed-once-gh.bash` (`filed-once.bash`).
.config/claims/filed-once.bash || exit 1
# `pick-cases.bash` reads the pick `claim:next` takes from `next.jq`'s
# answer (#5178): a held line before the pick leaves it, and held lines
# alone give none.
.config/claims/pick-cases.bash || exit 1
# `input-cases.bash` builds the input `claim:next` gives `next.jq` (#5292):
# each reading, longer than one argument can be, reaches jq whole.
.config/claims/input-cases.bash || exit 1
# `observed.bash` hands a transcript of any size to jq (#3871): for each case
# in `.config/claims/hand-off.json` a scratch repository adds a transcript of
# the case's size, stopped in a test the body names, and the script prints the
# case's block.
root=$PWD
printf 'Closes #7.\n\nThe test `t` witnesses.\n' > "$scratch/hand-off.md"
while IFS= read -r case; do
  bytes=$(jq .bytes <<< "$case")
  repo="$scratch/hand-off-$bytes"
  git init --quiet --initial-branch=main "$repo"
  git -C "$repo" config commit.gpgsign false
  git -C "$repo" commit --quiet --no-verify --allow-empty -m base
  mkdir -p "$repo/crates/p/tests/debug-traces"
  {
    printf 'test: t\ncommand: mise run debug:test p t\n* thread #1, stop reason = breakpoint 1.1\n  * frame #0: 0x0 p`f at a.rs:1:1\n'
    jq -rn --argjson bytes "$bytes" '"x" * $bytes'
  } > "$repo/crates/p/tests/debug-traces/t.txt"
  git -C "$repo" add crates && git -C "$repo" commit --quiet --no-verify -m head
  got=$(cd "$repo" && "$root/.config/claims/observed.bash" HEAD~1 "$scratch/hand-off.md" true 2> "$scratch/err") || true
  wanted=$(jq -j .output <<< "$case")
  if [[ $got != "${wanted%$'\n'}" ]]; then
    printf 'hand-off case FAILED: %s\n  got:\n%s\n%s\n' "$(jq -r .name <<< "$case")" "$got" "$(cat "$scratch/err")" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/hand-off.json)
(( failed == 0 )) || exit 1
# Both readers of a defect's case read every case file kind (#4863): for each
# case in `.config/claims/case-files.json` a scratch repository adds the case's
# file, `observed.bash` prints the case's block and `regressions.bash` the
# case's paths. A case's `rust` edits one Rust file in the same change, its
# `base` text at the base and its `head` text at HEAD (#5498).
printf 'Closes #7.\n' > "$scratch/case-files.md"
index=0
while IFS= read -r case; do
  index=$(( index + 1 ))
  repo="$scratch/case-files-$index"
  file=$(jq -r .file <<< "$case")
  rust=$(jq -r '.rust.path // empty' <<< "$case")
  git init --quiet --initial-branch=main "$repo"
  git -C "$repo" config commit.gpgsign false
  if [[ -n $rust ]]; then
    mkdir -p "$repo/$(dirname "$rust")"
    jq -j .rust.base <<< "$case" > "$repo/$rust"
  fi
  git -C "$repo" add -A && git -C "$repo" commit --quiet --no-verify --allow-empty -m base
  mkdir -p "$repo/$(dirname "$file")"
  jq -j .text <<< "$case" > "$repo/$file"
  [[ -z $rust ]] || jq -j .rust.head <<< "$case" > "$repo/$rust"
  git -C "$repo" add -A && git -C "$repo" commit --quiet --no-verify -m head
  observed=$(cd "$repo" && "$root/.config/claims/observed.bash" HEAD~1 "$scratch/case-files.md" true 2> "$scratch/err") || true
  paths=$(cd "$repo" && "$root/.config/claims/regressions.bash" HEAD~1 2>> "$scratch/err" | jq -c '[.[].path]') || true
  if [[ $observed != "$(jq -r .observed <<< "$case")" || $paths != "$(jq -c .regressions <<< "$case")" ]]; then
    printf 'case-files case FAILED: %s\n  observed:\n%s\n  regressions: %s\n%s\n' "$(jq -r .name <<< "$case")" "$observed" "$paths" "$(cat "$scratch/err")" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/case-files.json)
# The ceilings a change adds (#5039): for each case in
# `.config/claims/ceilings.json` a scratch repository commits the case's
# `base` text, then its `head` text, at its `file`, and `ceilings.bash` lists
# the case's `output`.
index=0
while IFS= read -r case; do
  index=$(( index + 1 ))
  repo="$scratch/ceilings-$index"
  file=$(jq -r .file <<< "$case")
  git init --quiet --initial-branch=main "$repo"
  git -C "$repo" config commit.gpgsign false
  mkdir -p "$repo/$(dirname "$file")"
  jq -j .base <<< "$case" > "$repo/$file"
  git -C "$repo" add -A && git -C "$repo" commit --quiet --no-verify -m base
  jq -j .head <<< "$case" > "$repo/$file"
  git -C "$repo" add -A && git -C "$repo" commit --quiet --no-verify -m head
  got=$(cd "$repo" && "$root/.config/claims/ceilings.bash" HEAD~1 2> "$scratch/err" | jq -c .) || true
  if [[ $got != "$(jq -c .output <<< "$case")" ]]; then
    printf 'ceilings case FAILED: %s\n  got: %s\n  wanted: %s\n%s\n' "$(jq -r .name <<< "$case")" "$got" "$(jq -c .output <<< "$case")" "$(cat "$scratch/err")" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/ceilings.json)
# `epic:deps` over a stubbed `gh` (#4903): a dependency GitHub refuses is
# named and the run goes on.
.config/claims/epic-deps.bash || failed=1
# `pr:hold` renders each held comment through a stubbed GitHub. The cases hold
# the lead sentence and the Markdown table.
.config/claims/hold.bash || failed=1
(( failed == 0 )) || exit 1
terms=$(yq -o json '.term' .config/references/terms.toml)
map=$(jq -r '.[] | (.name // "?") as $name
  | if (.name | type) != "string" or (.match | type) != "string" or (.owns | type) != "array" or (.owns | length) == 0 or (.reason | type) != "string"
    then "terms.toml: row `\($name)` lacks a name, a match, an owner or a reason"
    else .match as $match | (try ("" | test($match) | empty) catch "terms.toml: row `\($name)`: its match does not compile")
    end' <<< "$terms")
while IFS= read -r owner; do
  [[ -e $owner ]] || map=$(printf '%s\n%s' "$map" "terms.toml: the owner \`$owner\` is no path in the tree")
done < <(jq -r '.[].owns[]? | sub("\\s*§.*$"; "") | select(contains("/"))' <<< "$terms")
if [[ -n ${map//[[:space:]]/} ]]; then
  printf 'claims check FAILED: the term map is malformed:\n%s\n' "$map" >&2
  exit 1
fi
echo "claims check OK: $(jq length .config/claims/cases.json) cases gave their removals, $(jq length .config/claims/opening.json) bodies their refusals, $(jq length .config/claims/signed.json) worked issues their sign-off, $(jq length .config/claims/unit.json) issues their findings, $(jq length .config/claims/next.json) boards their claims, $(jq length .config/claims/claimed.json) bodies their claim marker, $(jq length .config/claims/ledger.json) landings their ledger refusals, $(jq length .config/claims/reserved.json) reserved rules their refusals, $(jq length .config/claims/shown.json) issues their vault pages, $(jq length .config/claims/annotated.json) bodies their vault keys, $(jq length .config/claims/patched.json) tables their reading, $(jq length .config/claims/deps.json) issues their dependencies, $(jq length .config/claims/chain.json) rungs their \`## After\`, $(jq length .config/claims/report.json) boards their dependency report, $(jq length .config/claims/filing.json) merged verdicts their filing, $(jq length .config/claims/obligations.json) periods their obligations report, $(jq length .config/claims/period.json) periods their days, $(jq length .config/claims/terms.json) units their vocabulary, $(jq length .config/claims/swept.json) nights their recovery rows, $(jq length .config/claims/hand-off.json) transcripts their observed block, and the term map's $(jq length <<< "$terms") rows read whole"
'''

# The debugger tasks read an enum's variant and pick their lldb as recorded
# (#3778). Each case in `.config/debug/variants.json` holds the variant names
# lldb gives an enum, the tag each reads, whether the names are Xcode's
# truncated ones, and the variant or raw tag `variants.py` picks. Each case in
# `.config/debug/extents.json` holds a process's memory regions, an extent a
# formatter reads, and whether `extents.py` finds it in readable memory
# (#3823). Each case in `.config/debug/depths.json` holds a nested value, a
# depth limit, and the summary `depths.py` prints with each aggregate below
# the limit elided (#3809). Each case in `.config/debug/strings.json` holds a
# string's bytes and the one line `strings.py` quotes them on (#3783). Each
# case in `.config/debug/launch.json` holds a system, whether an lldb is
# installed, and how `.config/debug/lldb.bash` launches it under
# `launch.py`'s stubs: on macOS it refuses with the install line when
# Homebrew's `lldb` is absent and runs it unbounded when present (#3863); on
# Linux it runs its `lldb` bounded to 8 GiB by a scope's `MemoryMax` or by
# `ulimit -v` (#3823).
["check:debug"]
description = "The lldb formatters pick each recorded enum's variant or raw tag, read each recorded extent only inside memory, cut each recorded summary at its depth and quote each recorded string on one line, and lldb.bash launches each recorded system's lldb as recorded"
tools.jq = "1.8.1"
tools.python = "3.15.2"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python .config/debug/variants.py .config/debug/variants.json
python .config/debug/extents.py .config/debug/extents.json
python .config/debug/depths.py .config/debug/depths.json
python .config/debug/strings.py .config/debug/strings.json
python .config/debug/launch.py .config/debug/launch.json
echo "debug check OK: $(jq length .config/debug/variants.json) enums their variant, $(jq length .config/debug/extents.json) extents their reading, $(jq length .config/debug/depths.json) summaries their depth, $(jq length .config/debug/strings.json) strings their line, and $(jq length .config/debug/launch.json) launches their bound"
'''

# Every `Where` of a body's `## Refactoring` names something the workspace
# carries (#2884). With a body, the task reads the tracked files and the
# rustdoc JSON `evidence:rustdoc` wrote under `target/evidence/doc/`, and
# prints one refusal per `Where` neither holds, exiting 1 on any. A body whose
# every `Where` is a tracked path, or that has none, needs no rustdoc: the JSON
# is built only when a `Where` stays unresolved without it, so a change with
# no Rust path builds no Rust (`evidence:obligations`). Without a body, as in
# the gate, it runs the cases of `.config/claims/refactoring.json` through
# `.config/claims/refactoring.jq`, each a body, the paths, names and tracked
# files, and the lines it prints.
["check:refactoring"]
description = "Every Where of a body's Refactoring table names an item of the workspace's rustdoc or a tracked path; without a body, the recorded cases"
tools.jq = "1.8.1"
usage = '''
arg "[body]" help="the pull request body file; without it, the recorded cases run"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
claims=.config/claims
if [[ -z "${usage_body:-}" ]]; then
  .config/cases/run.bash refactoring "$claims/refactoring.json" --program "$claims/refactoring.jq"
  echo "refactoring check OK: $(jq length "$claims/refactoring.json") bodies their resolutions"
  exit 0
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
git ls-files | jq -R . | jq -s . > "$scratch/tree.json"
# The findings against the workspace `$scratch/workspace.json` names.
findings() {
  jq -n --rawfile body "$usage_body" --slurpfile workspace "$scratch/workspace.json" --slurpfile tree "$scratch/tree.json" \
    '{body: $body, paths: $workspace[0].paths, names: $workspace[0].names, tree: $tree[0]}' \
    | jq -r -L "$claims" -f "$claims/refactoring.jq"
}
docs=(target/evidence/doc/*.json)
if [[ ! -f "${docs[0]}" ]]; then
  echo '{"paths": [], "names": []}' > "$scratch/workspace.json"
  [[ -n $(findings) ]] || exit 0
  mise run evidence:rustdoc
  docs=(target/evidence/doc/*.json)
fi
for doc in "${docs[@]}"; do
  jq -c '[.paths[] | select(.crate_id == 0) | .path] as $own
    | ($own[0][0] // empty) as $crate
    | {paths: [$own[] | join("::")], names: [.index[] | select(.crate_id == 0) | .name | values | "\($crate)#\(.)"]}' "$doc"
done | jq -s '{paths: (map(.paths[]) | unique), names: (map(.names[]) | unique)}' > "$scratch/workspace.json"
found=$(findings)
if [[ -n "$found" ]]; then
  echo "$found" >&2
  exit 1
fi
{% endraw %}'''

# The issue automations' decisions. An epic closes itself when every issue
# it is blocked by and every sub-issue it holds is closed, never with none
# (#3398, #4972): `.config/epics/close.jq` decides what an epic the closed
# issue blocked or sat under gets, and which open sub-issues it links as
# blocked-by issues, each case in `.config/epics/cases.json` an epic, the
# issues it is blocked by, its sub-issues and the decision it must give;
# `link.jq` decides each open epic's members by body
# reference for `epics:link`, each case in `.config/epics/link.json` the
# issues and the members. An issue is filed with a `kind:`
# and an `area:` label (#2538): `.config/triage/triage.jq` decides whether
# `needs:triage` is added, removed or kept, each case in
# `.config/triage/cases.json` an issue's labels and that decision. An issue
# carries exactly one `kind:`, `area:`, `priority:` and `effort:` (#2902):
# `.config/issues/labels.jq` gives the defaults `issue:file` and
# `issue:labels` add and the problems they refuse, each case in
# `.config/issues/cases.json` an issue's labels, the defaults table and those
# lines; the table read is `.config/issues/defaults.toml` itself. A filer
# files a unit (#3112): `.config/issues/template.jq` fills a filer's
# template, each case in `.config/issues/templates.json` a template, its
# fields and the body or the refusal, and every template under
# `.config/issues/templates/`, its fields filled, renders a body `unit:check`
# passes. Every issue is a unit or flagged (#3113): `.config/issues/form.jq`
# makes a body the unit form wrote a unit's body, each case in
# `.config/issues/form.json` a body and the body and labels it gives;
# `unsectioned.jq` decides the label and the one comment, each case in
# `.config/issues/unsectioned.json` an issue, its findings and comments and
# that decision; and `concerns.jq`'s sqlite-free reading of
# `ledger/concerns.sql` is held to sqlite's.
["check:issues"]
description = "The issue automations give each recorded case its decision"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
cases() {
  .config/cases/run.bash "$1" "$3" --program "$2" || failed=1
}
cases epics .config/epics/close.jq .config/epics/cases.json
.config/cases/run.bash links .config/epics/link.json --program .config/epics/link.jq --mode c || failed=1
cases triage .config/triage/triage.jq .config/triage/cases.json
labelled=$(mktemp)
trap 'rm -f "$labelled"' EXIT
jq -c --argjson defaults "$(yq -p toml -o json -I0 '.' .config/issues/defaults.toml)" 'map(.input.defaults = $defaults)' .config/issues/cases.json > "$labelled"
cases labels .config/issues/filed.jq "$labelled"
cases templates .config/issues/rendered.jq .config/issues/templates.json
.config/cases/run.bash form .config/issues/form.json --program .config/issues/form.jq --mode c || failed=1
.config/cases/run.bash unsectioned .config/issues/unsectioned.json --program .config/issues/unsectioned.jq --mode c || failed=1
concerns=$(sqlite3 -json :memory: '.read ledger/concerns.sql' 'SELECT id, issue FROM concern ORDER BY id;' | jq -c .)
read_concerns=$(jq -R -s -c -f .config/issues/concerns.jq ledger/concerns.sql | jq -c 'sort_by(.id)')
if [[ $read_concerns != "$concerns" ]]; then
  printf 'issues concerns.jq reads %s from ledger/concerns.sql, sqlite %s\n' "$read_concerns" "$concerns" >&2
  failed=1
fi
templates=0
for template in .config/issues/templates/*.md; do
  templates=$((templates + 1))
  findings=$(jq -R -s -r -L .config/issues 'include "template";
      . as $t | render(placeholders | map(. as $f | {key: $f, value: (if $t | test("\\| \\{\\{\($f)\\}\\} \\|") then "no — a field" else "1" end)}) | from_entries; "## Observation\n\nx\n")' "$template" \
    | jq -R -s -r -L .config/claims --argjson concerns "$concerns" -f .config/claims/unit.jq)
  if [[ -n $findings ]]; then
    printf 'issues template %s renders a body unit:check refuses:\n%s\n' "$template" "$findings" >&2
    failed=1
  fi
done
(( failed == 0 )) || exit 1
echo "issues check OK: $(jq length .config/epics/cases.json) epics gave their decisions, $(jq length .config/epics/link.json) boards their epics' members, $(jq length .config/triage/cases.json) label sets theirs, $(jq length .config/issues/cases.json) label sets their defaults and refusals, $(jq length .config/issues/templates.json) renderings theirs, $templates filer templates render units, $(jq length .config/issues/form.json) form bodies and $(jq length .config/issues/unsectioned.json) issues give theirs, and the concerns read as sqlite reads them"
'''

# The witnessed mutation run's readings (#1456): `items.jq` reads each
# function's witnesses from rustdoc JSON, and `groups.jq` places each mutant
# in its function and builds the group's regex and filterset. Each case in
# `.config/mutants/cases.json` names its program, its input and the compact
# JSON it must give.
["check:mutants"]
description = "The witnessed mutation run's readings give each recorded case its output"
tools.jq = "1.8.1"
