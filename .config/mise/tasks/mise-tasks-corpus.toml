#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The corpus manifest: a sha256 line per file, `hash  path-under-the-root`,
# sorted by path, over the roots named. Two manifests of one tree taken under
# different roots diff to zero when every file kept its hash and its path
# under its root: the same hashes, the same relative paths, the same count.
# The roots are space-separated; the output file is written whole.
#
# A `ledger` directory is pruned from every root: the ledger exemplars are a
# manifest root of their own (`corpus/ledger`), so they must not be counted
# again under the corpus root that now contains them. No fixture subtree is
# named `ledger`, so the prune matches only the exemplar root.
["corpus:manifest"]
description = "A sha256 manifest of the corpus roots, one line per file, sorted by path"
usage = '''
arg "[roots]" help="the corpus roots, space-separated, walked recursively"
arg "[out]" help="the file the manifest is written to"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
out={{ usage.out }}
mkdir -p "$(dirname "$out")"
for root in {{ usage.roots }}; do
  (cd "$root" && find . -name ledger -prune -o -type f -print | LC_ALL=C sort | sed 's|^\./||' | while IFS= read -r rel; do
    printf '%s  %s\n' "$(sha256sum "$rel" | cut -d' ' -f1)" "$rel"
  done)
done | LC_ALL=C sort -k2 > "$out"
echo "corpus manifest: $(wc -l < "$out") files to $out"
'''

# The page-28 stress, as far as the library writes it: `library/math` checked
# whole, every verdict rechecked and each declaration measured, under the
# platform's `time`. The cylinder composites' rows stand beside the artifact
# sizes Catt reports for the same constructions at dimension 2 (Benjamin,
# Markakis, Offord, Sarti and Vicary, "Naturality for Higher-Dimensional Path
# Types", arXiv:2501.11620, Example 1.4 and § 6). A row's bytes are its
# segment in the kernel artifact, its shared size the subterm-table entries
# the segment adds, and its unshared size its roots' expanded work. The
# check's wall time and peak resident set follow, with the load average they
# were taken under. The check runs over scratch configuration, cache and data
# directories, so it reads no verdict and commits nothing to the user's store.
["bench:stress"]
description = "Check library/math measured and timed, its cylinder composites beside Catt's artifact sizes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
.config/mise/scope cargo build --release --locked --quiet --package gandr-lang --bin gandr
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
case "$(uname -s)" in
  Darwin) timing=-l ;;
  *) timing=-v ;;
esac
status=0
XDG_CONFIG_HOME="$scratch/config" XDG_CACHE_HOME="$scratch/cache" XDG_DATA_HOME="$scratch/data" \
  /usr/bin/time "$timing" target/release/gandr check --recheck --measure library/math \
  > "$scratch/check" 2> "$scratch/time" || status=$?
if [ "$status" -ne 0 ]; then
  printf 'bench:stress: the check exits %s\n' "$status" >&2
  awk '!/^measure: /' "$scratch/check" "$scratch/time" >&2
  exit "$status"
fi
awk '
function catt(declaration, construction, size) {
  name[++count] = declaration; builtin[declaration] = construction; bytes[declaration] = size
}
BEGIN {
  catt("cylinderComposite2", "cylcomp(2,1,2)", 818)
  catt("cylinderStack2", "cylstack(2)", 830)
  catt("coneComposite2", "conecomp(2,1,2)", 501)
}
/^measure: / {
  split($0, part, ": ")
  if (part[3] in bytes) {
    split(part[4], size, ", ")
    sub(/ bytes$/, "", size[1]); sub(/ shared$/, "", size[2]); sub(/ unshared$/, "", size[3])
    row[part[3]] = size[1] "\t" size[2] "\t" size[3]
  }
}
END {
  print "| declaration | Catt built-in | Catt bytes | gandr bytes | shared | unshared |"
  print "| --- | --- | --: | --: | --: | --: |"
  for (i = 1; i <= count; i++) {
    if (!(name[i] in row)) { missing = missing " " name[i]; continue }
    split(row[name[i]], size, "\t")
    printf "| `%s` | `%s` | %s | %s | %s | %s |\n", name[i], builtin[name[i]], bytes[name[i]], size[1], size[2], size[3]
  }
  if (missing != "") { printf "bench:stress: no row for%s\n", missing > "/dev/stderr"; exit 1 }
}' "$scratch/check"
awk '
/ real / { wall = $1 " s" }
/maximum resident set size/ { peak = $1 }
/Elapsed \(wall clock\) time/ { wall = $NF }
/Maximum resident set size \(kbytes\)/ { peak = $NF * 1024 }
END { printf "\nwall %s, peak resident set %s bytes\n", wall, peak }
' "$scratch/time"
uptime | awk -F 'load averages?: ' '{ printf "load %s\n", $2 }'
'''

# Catt's wall time on one example, the oracle the rows at dimension 3 are read
# against (#3833). Catt is the repository `thibautbenjamin/catt` at the
# revision below, built once into the user's cache with an opam root of its
# own. Its `catt.opam` asks for OCaml 4.14, and dune 3.24 drops the `coq`
# extension its `dune-project` declares, so the switch pins dune 3.23.1 before
# Catt's dependencies are solved; `-p catt` builds the command without the
# Rocq plugin. Nothing of it lands in
# the tree or in the user's own opam root. An example path that names no file
# from the working directory is read in that checkout, so `examples/…` names
# Catt's own examples. `--catt` names another program to run in its place.
#
# The run carries the host's memory bound (`.config/mise/bounded`) and a
# wall-clock limit, 1800 s unless `--limit` names another. The task prints one
# Markdown row, the example and its wall time; a run past either bound prints
# `past bound` in its place and is never retried larger (#3855). Catt prints no
# term's size, so the row has none: page 28's sizes stand in `bench:stress`.
# Catt runs only at n = 2 and 3, so an example naming a cylinder or cone
# built-in past n = 3 is refused before Catt runs. `.config/bench/row.jq` and
# `.config/bench/dimension.jq` decide both, held to `check:bench`'s cases.
["bench:catt"]
description = "Catt's wall time on one example, under the host's memory bound and a wall-clock limit"
usage = '''
arg "<example>" help="the .catt file Catt runs"
flag "--limit <seconds>" help="the wall-clock limit" default="1800"
flag "--catt <program>" help="the program run in place of the pinned Catt"
'''
tools.jq = "1.8.1"
tools.opam = "2.6.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
example=${usage_example:?}
limit=${usage_limit:?}
bench=.config/bench
revision=3af8b816de62b6452e4382c70a8eaf9e3c153175
catt=${usage_catt:-}
checkout=
if [[ -z $catt ]]; then
  cache=${XDG_CACHE_HOME:-$HOME/.cache}/gandr/catt/$revision
  checkout=$cache/catt
  catt=$checkout/_build/default/bin/catt.exe
  build() {
    export OPAMROOT=$cache/opam OPAMYES=1 OPAMCOLOR=never
    { [[ -d $OPAMROOT ]] || opam init --bare --disable-sandboxing --no-setup; } \
      && { opam switch list --short | awk '$0 == "catt" { found = 1 } END { exit !found }' \
        || opam switch create catt ocaml-base-compiler.4.14.2; } \
      && { [[ -d $cache/catt ]] || git clone --quiet https://github.com/thibautbenjamin/catt "$cache/catt"; } \
      && git -C "$cache/catt" checkout --quiet "$revision" \
      && opam pin add --switch=catt --no-action dune 3.23.1 \
      && opam install --switch=catt --deps-only "$cache/catt/catt.opam" \
      && (cd "$cache/catt" && opam exec --switch=catt -- dune build -p catt @install)
  }
  if [[ ! -x $catt ]]; then
    mkdir -p "$cache"
    echo "bench:catt: building Catt at ${revision:0:12} into $cache, once" >&2
    if ! build > "$cache/build.log" 2>&1; then
      echo "bench:catt: the build fails; its log is $cache/build.log" >&2
      exit 1
    fi
  fi
fi
if [[ ! -f $example && -n $checkout && -f $checkout/$example ]]; then
  example=$checkout/$example
fi
if [[ ! -f $example ]]; then
  echo "bench:catt: no example at $example" >&2
  exit 2
fi
past=$(jq -R -s -c -f "$bench/dimension.jq" "$example")
if [[ $past != '[]' ]]; then
  echo "bench:catt: $example names $(jq -r 'join(", ")' <<< "$past") past n = 3; Catt runs only at n = 2 and 3 (#3855)" >&2
  exit 2
fi
# The bound refuses here, before the run is timed, where no bound takes.
.config/mise/bounded bench:catt true
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
status=0
start=$(date +%s%N)
.config/mise/bounded bench:catt timeout "$limit" "$catt" "$example" > "$scratch/out" 2> "$scratch/err" || status=$?
end=$(date +%s%N)
out_of_memory=false
if [[ $(< "$scratch/err") == *Out_of_memory* ]]; then
  out_of_memory=true
fi
if ! row=$(jq -n \
  --arg example "${example##*/}" --argjson status "$status" --argjson out_of_memory "$out_of_memory" \
  --argjson seconds "$(awk -v start="$start" -v end="$end" 'BEGIN { printf "%.6f", (end - start) / 1e9 }')" \
  '{example: $example, status: $status, seconds: $seconds, out_of_memory: $out_of_memory}' \
  | jq -r -f "$bench/row.jq" 2> "$scratch/refusal"); then
  awk '{ sub(/^jq: error \(at [^)]*\): /, "bench:catt: "); print }' "$scratch/refusal" >&2
  cat "$scratch/out" "$scratch/err" >&2
  exit 1
fi
printf '| example | wall |\n| --- | --: |\n%s\n' "$row"
{% endraw %}'''
