}
root=$(git rev-parse --show-toplevel)
source "$root/.config/pr-stack/stack.bash"
# The watch marks its worktree while it runs, so no seat's `wt:sweep` removes
# the tree its merge steps run in (#3798); the mark goes with the watch.
watch_mark=$(git rev-parse --path-format=absolute --git-dir)/gandr-watch-$$
: > "$watch_mark"
# One watch a pull request on a host (#4268): a second `pr:watch` on the same
# number, a seat's beside the coordinator's or a loop's beside the first, is
# refused while the first runs, so no pull request is polled twice from here.
watch_lock=${XDG_STATE_HOME:-$HOME/.local/state}/gandr/watch/$number.watch
mkdir -p "$(dirname "$watch_lock")"
if [[ -f $watch_lock ]] && kill -0 "$(< "$watch_lock")" 2> /dev/null; then
  echo "pr:watch: #$number is already watched on this host by pid $(< "$watch_lock"); one watch a pull request" >&2
  rm -f "$watch_mark"
  exit 2
fi
echo $$ > "$watch_lock"
members_file=
trap 'drop_scratch; rm -f "$watch_mark" "$watch_lock" "$members_file"' EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
trap 'exit 129' HUP
heals=0
required=$(required_contexts)
