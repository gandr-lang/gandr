#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# Run the workflow, not a shell approximation of it.
# The clone runs committed HEAD, so commit changes before this gate. A linked
# worktree's .git file points outside act's copied workspace;
# a disposable full clone preserves history and keeps generated install pins
# and container paths out of the developer checkout. The clone is removed on
# either success or failure. .actrc supplies the vendored native runner image.
# act does not exercise GitHub's merge queue, permission/allowlist enforcement,
# cross-run artifact delivery or branch-scoped promotion into main's caches.
# act cannot execute macOS runners. That lane is retained for hosted CI;
# the local gate runs every Linux check in the same workflow. Forward flags
# to act for runner-image selection without changing the committed workflow.
# Each invocation gives a disposable workflow copy a unique name, isolating
# containers across repositories and worktrees. The checkout stays unchanged.
# act runs with --reuse, so it never removes a job's container itself: act
# allows that removal a fixed minute (pkg/runner/job_executor.go), and under
# a dozen compiling jobs a removal past it fails the job's cleanup and stops
# every later stage of the run, the joins and the gate jobs among them.
# reap_jobs passes act's output through and removes each job's container,
# its anonymous volumes and act's two named volumes as the job reports its
# end, at no deadline, so disk frees as each job ends. The exit/signal trap
# removes what is left: step containers, and anything a reap could not.
# Startup reaps abandoned runs by workflow-process liveness, never age, and
# leaves act-toolcache untouched.
# Offline action mode reuses cached actions without fetching; cache misses
# still download the pinned action.
# act resets Git indexes even offline, so each invocation snapshots the shared
# action cache. A green run atomically publishes only new entries; a bounded
# directory lock serializes publication, never the gates themselves.
# Two host-wide slots bound concurrent gates across repositories and worktrees:
# the host lock `act` (`.config/mise/host-lock.bash`, #3105), which a dead
# holder releases with its last process.
# A local run is scoped to the jobs a change touches (#2541): the task
# refuses, before anything starts, without a `-j <job>` among its arguments,
# and when the committed branch changes nothing under `.github/` or
# `.config/mise/tasks/` against its fork from the trunk, `origin/$trunk`
# (`.config/pr-stack/trunk.bash`, #5443). The owner runs
# `act` directly for anything else.
["ci:act"]
description = "Run the committed CI workflow's named jobs locally, after a workflow or task change"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
job=false
for argument in "$@"; do
  case "$argument" in
    -j | --job | -j?* | --job=*) job=true ;;
  esac
done
if [[ "$job" != true ]]; then
  echo 'ci:act: name the jobs the change touches with `-j <job>`; the whole workflow runs in hosted CI' >&2
  exit 2
fi
source .config/pr-stack/trunk.bash
if [[ -z $(git diff --name-only "origin/$trunk...HEAD" -- .github .config/mise/tasks) ]]; then
  echo "ci:act: the committed branch changes nothing under .github/ or .config/mise/tasks/ against origin/$trunk; act runs only after a workflow or task change" >&2
  exit 2
fi
remove_run() {
  local run_id=$1 kind ids resource status=0
  for kind in container network volume; do
    case "$kind" in
      container) ids=$(docker ps -aq --filter "name=^/act-CI-tmp-${run_id}-") ;;
      network) ids=$(docker network ls -q --filter "name=^act-CI-tmp-${run_id}-") ;;
      volume) ids=$(docker volume ls -q --filter "name=^act-CI-tmp-${run_id}-") ;;
    esac || { status=1; continue; }
    while IFS= read -r resource; do
      [[ -n "$resource" ]] || continue
      if [[ "$kind" == container ]]; then
        docker container rm -f -v "$resource" || status=1
      else
        docker "$kind" rm -f "$resource" || status=1
      fi
    done <<< "$ids"
  done
  return "$status"
}

# A job's container name is act's own (createContainerName in
# pkg/runner/run_context.go): `act-` and the job's run-qualified name, the
# prefix of its end line, with every other character than a letter or digit
# a dash and `--` folded once, cut to 63 characters less trailing dashes,
# then a dash and the SHA-256 of the whole folded name. The reader also
# marks act's action-cache race (below) in the file its argument names.
reap_jobs() {
  local line job name hash
  while IFS= read -r line; do
    printf '%s\n' "$line"
    if [[ "$line" == *"] remove $scratch/actions/"*"/.gitignore: no such file or directory" ]]; then
      printf '%s\n' "$line" >> "$1"
    fi
    [[ "$line" =~ ^\[(.+)\]\ 🏁\ \ Job\ (succeeded|failed)$ ]] || continue
    job=${BASH_REMATCH[1]}
    job=${job%"${job##*[! ]}"}
    name=$(LC_ALL=C.UTF-8 sed -e 's/[^a-zA-Z0-9]/-/g' -e 's/--/-/g' <<< "act-$job")
    hash=$(printf '%s' "$name" | sha256sum)
    name=${name:0:63}
    while [[ "$name" == *- ]]; do name=${name%-}; done
    name+="-${hash%% *}"
    {
      docker container rm -f -v "$name" > /dev/null &&
        docker volume rm -f "$name" "$name-env" > /dev/null ||
        printf 'ci:act: %s stays for the final cleanup\n' "$name" >&2
    } &
  done
  wait
}

# Snapshot names before probing processes; a new run cannot lose resources
# absent from the snapshot. A process-query error must not imply an orphan.
{% raw %}
names=$(docker ps -a --filter name=act-CI-tmp- --format '{{.Names}}')
names+=$'\n'$(docker network ls --filter name=act-CI-tmp- --format '{{.Name}}')
names+=$'\n'$(docker volume ls --filter name=act-CI-tmp- --format '{{.Name}}')
{% endraw %}
seen=' '
while IFS= read -r name; do
  [[ "$name" =~ ^act-CI-tmp-([[:alnum:]]+)- ]] || continue
  run_id=${BASH_REMATCH[1]}
  [[ "$seen" != *" $run_id "* ]] || continue
  seen+="$run_id "
  if pgrep -f "[t]mp[.]${run_id}/ci[.]yml" >/dev/null; then
    continue
  else
    status=$?
    [[ "$status" == 1 ]] || exit "$status"
  fi
  remove_run "$run_id"
done <<< "$names"

scratch=$(mktemp -d)
run_id=${scratch##*/tmp.}
action_cache="${XDG_CACHE_HOME:-$HOME/.cache}/act"
lockdir="${action_cache}.publish-lock"
publish=
locked=false
act_pid=
reaper_pid=
slotted=false
cleanup() {
  local status=$?
  trap - EXIT INT TERM
  if [[ -n "$act_pid" ]]; then
    kill -TERM "$act_pid" 2>/dev/null || true
    wait "$act_pid" || true
  fi
  if [[ -n "$reaper_pid" ]]; then
    exec 3>&-
    wait "$reaper_pid" || true
  fi
  remove_run "$run_id" || { if [[ "$status" == 0 ]]; then status=1; fi; }
  if [[ "$locked" == true ]]; then rmdir "$lockdir" || status=1; fi
  if [[ -n "$publish" ]]; then rm -rf "$publish" || status=1; fi
  rm -rf "$scratch" || status=1
  if [[ "$slotted" == true ]]; then
    printf '%s Released act slot %s (pid %s)\n' "$(date -u +%FT%TZ)" "$host_slot" "$$"
  fi
  exit "$status"
}
trap cleanup EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
source "{{config_root}}/.config/mise/host-lock.bash"
host_lock act 2 "mise run ci:act -- $*"
slotted=true
printf '%s Acquired act slot %s (pid %s)\n' "$(date -u +%FT%TZ)" "$host_slot" "$$"
mkdir -p "$action_cache" "$scratch/actions"
cp -R "$action_cache/." "$scratch/actions/"
git clone --quiet --local --no-hardlinks -- "{{config_root}}" "$scratch/checkout"
# act names the repository after the clone's origin, a local path here, and
# every checkout step refuses a path for `owner/repo`; the source's own origin
# names it.
git -C "$scratch/checkout" remote set-url origin "$(git -C "{{config_root}}" remote get-url origin)"
cd "$scratch/checkout"
ACT_RUN_ID=${scratch##*/} yq '.name += "-" + strenv(ACT_RUN_ID)' .github/workflows/ci.yml > "$scratch/ci.yml"
# act's shared action cache races (nektos/act#6180, open): two jobs that
# prepare one action in the same instant both see its `.gitignore`, and the
# second removal fails its job with `remove …/.gitignore: no such file or
# directory`. A run that fails with that line runs once more, from a clean
# slate, and the second verdict stands: a real failure fails it again, and a
# run that fails without the line is never retried.
attempt=1
while :; do
  rm -f "$scratch/act-race"
  exec 3> >(reap_jobs "$scratch/act-race")
  reaper_pid=$!
  status=0
  act workflow_dispatch --workflows "$scratch/ci.yml" --action-cache-path "$scratch/actions" --action-offline-mode --rm --reuse "$@" >&3 2>&3 &
  act_pid=$!
  wait "$act_pid" || status=$?
  act_pid=
  exec 3>&-
  wait "$reaper_pid"
  reaper_pid=
  if [[ "$status" == 0 ]]; then break; fi
  if [[ "$attempt" != 1 || ! -s "$scratch/act-race" ]]; then exit "$status"; fi
  printf 'ci:act: act exited %s after its action-cache race (nektos/act#6180); running once more:\n' "$status" >&2
  cat "$scratch/act-race" >&2
  remove_run "$run_id"
  attempt=2
done
publish=$(mktemp -d "${action_cache}.publish.XXXXXXXX")
for entry in "$scratch/actions/"*; do
  [[ -d "$entry" && ! -e "$action_cache/${entry##*/}" ]] || continue
  cp -R "$entry" "$publish/"
done
deadline=$((SECONDS + 30))
until mkdir "$lockdir" 2>/dev/null; do
  if (( SECONDS >= deadline )); then
    printf 'Timed out publishing act action cache: %s\n' "$lockdir" >&2
    exit 1
  fi
  sleep 0.2
done
locked=true
for entry in "$publish/"*; do
  [[ -d "$entry" && ! -e "$action_cache/${entry##*/}" ]] || continue
  mv "$entry" "$action_cache/"
done
'''

# Test priorities come from measured queue runs, never from memory: the tool
# stores each run's JUnit reports under target/test-timing, prints every test
# that has or would have a priority, and generates the overrides a reviewer
# commits to .config/nextest.toml (crates/workflow-test-timing/README.md).
["ci:timing"]
description = "Propose nextest priorities from recent merge-queue test timings"
usage = '''
flag "--runs <runs>" help="how many of the latest successful queue runs to read" default="5"
flag "--offline" help="report on the stored runs without invoking gh"
'''
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-test-timing -- --runs {{usage.runs}}{% if usage.offline %} --offline{% endif %}"

# Specification cost is profiled, never guessed from clause shapes: the tool
# samples the slowest enforcing tests the timing store names under perf and
# ranks the #[spec] checks by the time charged to them (Linux only;
# crates/workflow-spec-cost/README.md). Named tests go to the binary directly.
["ci:spec-cost"]
description = "Rank executable specifications by profiled check time"
usage = '''
flag "--tests <tests>" help="how many of the slowest enforcing tests to profile" default="5"
flag "--runs <runs>" help="how many of the newest stored queue runs name them" default="5"
flag "--frequency <hz>" help="samples per second" default="499"
flag "--top <top>" help="how many checks to list" default="30"
'''
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-spec-cost -- --tests {{usage.tests}} --runs {{usage.runs}} --frequency {{usage.frequency}} --top {{usage.top}}"

# The one-token-drop recovery matrix in full: some forty thousand parses
# against the per-source records under crates/surface-parser/tests/recovery,
# where every other profile visits the sweep's sample. UPDATE_EXPECT=1
# re-records from the full matrix; GANDR_RECOVERY_SOURCE narrows either run to
# the sources it names, one on each line.
["ci:recovery"]
description = "Every corpus source cut short and with each token dropped, against its recovery record"
run = ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --profile sweeps -E 'test(=sweeps::dropped_tokens_recover_no_worse_than_the_record)'"

# The recovery sweep over a pull request's own records (#5864): `landing`'s
# stale records are not the pull request's, and the whole sweep failed every
# pull request for them. `.config/recovery/change.bash` names the sources the
# change touches to `ci:recovery`, or runs it whole for a change to the parser
# or a removed source; `.config/recovery/change-cases.bash` holds its cases.
["ci:recovery-change"]
description = "The recovery sweep over the records a change touches, or every record when it reaches the parser or removes a source"
run = ".config/recovery/change.bash"

# The goldens a corpus source carries beside it — its recovery record, its
# role golden and, for a refusing source, its rendered refusals — rewritten
# for every source. The records are a sweep and run whole under the `sweeps`
# profile: under a pull-request profile the 30 s bound cuts the rewrite short
# and leaves a partial record. The role golden and the rendered refusals read
# every source under any profile. A new or changed source runs this once,
# then the check.
["corpus:goldens"]
description = "Rewrite every corpus source's recovery record, role golden and rendered refusals"
env.UPDATE_EXPECT = "1"
run = [
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --profile sweeps -E 'test(=sweeps::dropped_tokens_recover_no_worse_than_the_record)'",
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-grammar --test tests -E 'test(=highlight::corpus_roles_match_the_golden)'",
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-render-terminal --test tests -E 'test(=corpus::every_refusing_source_renders_as_its_golden)'",
]

# The nightly sweeps with specifications enforced, under the `nightly`
# nextest profile (.config/nextest.toml): every sweep whole, those too costly
# for the nightly budget each over the night's slice of the corpus, by the
# nights it states.
# Every other profile visits each sweep's stated sample; `--profile sweeps`
# visits the whole corpus in every sweep. The run builds into the enforcing
# gate's target directory. The nightly workflow restores it on a hosted
# runner, and a runner of our own keeps it (`.config/nightly/tree.bash`).
# GANDR_SWEEP_NIGHT=<day> replays another night.
["ci:sweeps-nightly"]
description = "Every sweep with specifications enforced, the costliest over the night's slice"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = ".config/mise/enforcing .config/mise/scope cargo nextest run --workspace --locked --profile nightly"

# The night's recovery sweep (a step of `nightly.yml`'s `sweeps`, #1782):
# every literal tile of every syntax exemplar missed and deleted, built into
# the enforcing target directory as `ci:sweeps-nightly` builds. The report
# goes to `recovery.out/report.txt`, which `reports` files from
# (`ci:recovery-file`).
# The causes and the count go to the job summary, so the whole backlog shows
# whether or not it is filed.
["ci:recovery-nightly"]
description = "The recovery sweep over the syntax exemplars, its causes in the job summary"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
env.CARGO_RESOLVER_FEATURE_UNIFICATION = "workspace"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p recovery.out
.config/mise/enforcing mise run ledger:recovery recovery.out/report.txt > recovery.out/causes.txt
{
  echo '## Recovery sweep'
  echo
  grep -e ' mutants swept: ' recovery.out/causes.txt
  echo
  sed -n 's/^cause: /- /p' recovery.out/causes.txt
} >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
'''

# Each crate's tests with every feature it declares on, which no gate builds:
# the gate tests each crate with its default features alone (#1785). A crate
# that declares no feature beyond `default` has nothing to turn on, and its
# gate run already is this one. The crates declaring features, sorted by name,
# rotate one a night, the i-th on the nights whose day number is i modulo
# their count, so a new feature puts its crate on the rotation by being
# declared and lengthens the cycle by a night. A night's cost is its crate's
# build: the restored plain state holds the layers below `gandr-core-term`,
# and the tower above them compiles with the night's features. A third of the
# crates a night took 164 to 213 s on the arm64 runner, about its costliest
# crate's alone, since the crates share that tower; the job's share is 186 s
# (#3288). GANDR_SWEEP_NIGHT=<day> replays another night, as for the sweeps;
# `--all` runs every such crate.
["ci:all-features"]
description = "Each crate's tests with every feature on, over the night's crate of those that declare features"
tools.jq = "1.8.1"
usage = '''
flag "--all" help="every crate that declares a feature, not the night's one"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
night=${GANDR_SWEEP_NIGHT:-$(($(date -u +%s) / 86400))}
mapfile -t crates < <(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[] | select(.features | keys - ["default"] | length > 0) | .name] | sort[]')
# Counted by hand: mise renders the script as a template, where the hash
# after an open brace opens a comment.
nights=0
for _ in "${crates[@]}"; do nights=$((nights + 1)); done
if ((nights == 0)); then echo "no crate declares a feature"; exit 0; fi
packages=()
for index in "${!crates[@]}"; do
  if [[ ${usage_all:-false} == true ]] || ((index == night % nights)); then packages+=(--package "${crates[index]}"); fi
done
echo "night $night, crate $((night % nights + 1)) of $nights: ${packages[*]}"
.config/mise/scope cargo nextest run --locked --profile "${NEXTEST_PROFILE:-default}" --all-features "${packages[@]}"
'''

# The enforcing suite, instrumented into target/coverage so it never shares
# the cached enforcing state, under the `coverage` nextest profile (its own
# limit, each sweep over its sample — .config/nextest.toml says why). The
# plain-only parser test is cfg(not(anodized_panic)), so it is a second
# instrumented run; a line is covered when either run executed it.
# `--no-report` implies `--no-clean`, and `report` reads every workspace
# object in the target directory, so the plain directory is cleaned of the
# workspace's objects first: a restored state otherwise keeps the previous
# revision's test binary beside this one's, and its coverage map, at the old
# line numbers with no hits, merges in as missed lines.
# Each object is exported on its own, then each line keeps its highest count
# across every export (#1368): llvm-cov keeps one record per function across
# the objects it is given, the first it reads, and a binary that links a crate
# without calling one of its `#[inline]` or generic functions carries a zero
# record for it that shadowed the counts of the binary that ran it. Within one
# object the real record replaces the zero one. `report -v` prints the export
# command cargo-llvm-cov builds, so the profile, the objects and the ignored
# paths are cargo-llvm-cov's own; its merged report is discarded.
# llvm-tools supplies llvm-cov; the CI image leaves it out, so the task adds
# it (a no-op where it is installed).
#
# The coverage workflow runs the measure in parts, so no job reaches its
# limit (#4020): the part `hash:<k>/<n>` runs one of nextest's slices of the
# enforcing suite, the part `plain` the plain-only witness alone, and each
# part writes its own coverage.lcov; `ci:coverage-merge` joins them. Without
# a part the task runs both whole, as a local run wants.
["ci:coverage"]
description = "Enforcing line coverage, with the plain-only parser witness merged in, as coverage.lcov"
usage = '''
arg "[part]" help="one part alone: plain, the plain-only parser witness, or a slice of the enforcing suite as nextest's --partition reads it, hash:1/4"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="{{ config_root }}"
rustup component add llvm-tools
export NEXTEST_PROFILE=coverage
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
exports() {
  local target=$1 prefix=$2 line llvm_cov object index=0 count=0
  local -a options=() objects=()
  line=$(CARGO_TARGET_DIR="$target" "$root/.config/mise/scope" cargo llvm-cov report -v --lcov --output-path "$scratch/$prefix.discarded" 2>&1 > /dev/null \
    | grep -F ' export -format=lcov ')
  line=${line#*\`}
  line=${line%\`*}
  # The command is cargo-llvm-cov's: paths and one single-quoted pattern.
  eval "set -- $line"
  llvm_cov=$1
  shift
  while (( $# > 0 )); do
    if [[ $1 == -object ]]; then objects+=("$2"); count=$((count + 1)); shift 2; else options+=("$1"); shift; fi
  done
  if (( count == 0 )); then
    echo "cargo llvm-cov report named no object in $target" >&2
    return 1
  fi
  for object in "${objects[@]}"; do
    "$llvm_cov" "${options[@]}" -object "$object" > "$scratch/$prefix-$index.lcov" &
    index=$((index + 1))
    while (( $(jobs -rp | wc -l) >= $(nproc) )); do wait -n; done
  done
  while (( $(jobs -rp | wc -l) > 0 )); do wait -n; done
  rm -f "$scratch/$prefix.discarded"
  echo "$prefix: $count objects exported"
}
part=${usage_part:-}
if [[ $part != plain ]]; then
  CARGO_TARGET_DIR="$root/target/coverage" "$root/.config/mise/enforcing" \
    "$root/.config/mise/scope" cargo llvm-cov nextest --workspace --locked --no-report ${part:+--partition "$part"}
  exports "$root/target/coverage" enforcing
fi
if [[ -z $part || $part == plain ]]; then
  CARGO_TARGET_DIR="$root/target/coverage-plain" \
    cargo llvm-cov clean --workspace
  CARGO_TARGET_DIR="$root/target/coverage-plain" \
    "$root/.config/mise/scope" cargo llvm-cov nextest --locked --no-report \
    -p gandr-surface-parser --test tests \
    -E 'test(=acceptance::corpus_files_cold_parse_within_p99_latency_budget)'
  exports "$root/target/coverage-plain" plain
fi
awk -f "$root/.config/coverage/merge.awk" "$scratch"/*.lcov > "$root/coverage.lcov"
'''

# The coverage workflow's parts, each a `ci:coverage` coverage.lcov, joined
# as one coverage.lcov: each line keeps its highest count across the parts
# (`.config/coverage/merge.awk`).
["ci:coverage-merge"]
description = "Join the coverage parts' reports as coverage.lcov"
usage = '''
arg "<part>..." help="the parts' LCOV reports, none of them coverage.lcov itself" var=#true
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
read -ra parts <<< "${usage_part:?}"
awk -f "$root/.config/coverage/merge.awk" "${parts[@]}" > "$root/coverage.lcov"
echo "ci:coverage-merge: ${#parts[@]} parts joined as coverage.lcov"
{% endraw %}'''

# Main's coverage upload against the one before it, as Markdown; with
# `--file-issue`, a drop over the threshold or fewer files opens or updates
# one issue (crates/workflow-coverage-guard/README.md). The coverage
# workflow passes codecov.yml's project threshold. Arguments pass through:
# `--repository`, `--sha`, `--threshold`, optionally `--wait`,
# `--file-issue` and `--badge`.
["ci:coverage-guard"]
description = "Main's coverage upload against the one before it, filed when it drops"
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-coverage-guard --"

# The README's coverage badge (#3978): the guard's `--badge` file, the newest
# processed upload as shields.io endpoint JSON, published as `coverage.json`
# on the orphan `badges` branch. Codecov's own badge reads its branch head,
# which an unprocessed upload turns `unknown`. The commit goes through the
# Git data API with GH_TOKEN, so the checkout keeps no credential, and it
# has no parent: the branch holds one commit, replaced when the badge
# changes. GH_REPO names the repository.
["ci:coverage-badge"]
description = "Publish the coverage badge's endpoint JSON on the orphan badges branch"
usage = 'arg "<file>" help="the badge the guard wrote with --badge"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
file=${usage_file:?}
repo=${GH_REPO:?ci:coverage-badge needs GH_REPO}
blob=$(gh api "repos/$repo/git/blobs" -f content="$(base64 -w0 "$file")" -f encoding=base64 --jq .sha)
tree=$(gh api "repos/$repo/git/trees" -f 'tree[][path]=coverage.json' -f 'tree[][mode]=100644' \
  -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
# matching-refs answers an empty list, not an error, when the branch is new.
head=$(gh api "repos/$repo/git/matching-refs/heads/badges" --jq '.[] | select(.ref == "refs/heads/badges") | .object.sha')
if [[ -n $head && $(gh api "repos/$repo/git/commits/$head" --jq .tree.sha) == "$tree" ]]; then
  echo "the badge is unchanged: $(< "$file")"
  exit 0
fi
commit=$(gh api "repos/$repo/git/commits" -f message="chore(ci): publish main's coverage badge" -f tree="$tree" --jq .sha)
if [[ -n $head ]]; then
  gh api -X PATCH "repos/$repo/git/refs/heads/badges" -f sha="$commit" -F force=true > /dev/null
else
  gh api "repos/$repo/git/refs" -f ref=refs/heads/badges -f sha="$commit" > /dev/null
fi
echo "published the badge as $commit: $(< "$file")"
'''

# Each test's enforcing time over its plain time, from a run's enforcing JUnit
# report and a plain baseline's; the enforcing lane reports it on every run
# (crates/workflow-spec-cost/README.md). Flags and target directory match the
# enforcing test build, which already compiled most of the binary. Arguments
# pass through to it: `--plain`, `--enforcing`, `--baseline-commit`,
# `--baseline-age-hours`, and optionally `--threshold`, `--floor`, `--top`.
["ci:spec-cost-ratio"]
description = "Compare each test's enforcing time with a plain baseline's"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = ".config/mise/enforcing .config/mise/scope cargo run --locked --quiet --profile test --package gandr-workflow-spec-cost --bin spec-cost-ratio --"

# Each CI lane's median job time over the newest merge-queue and
# pull-request runs against its budget, as Markdown; `--issue TITLE` keeps
# one issue in step (crates/workflow-lane-budget/README.md). The nightly
# workflow passes the budget table. Arguments pass through: `--budget
# NAME=SECONDS` per lane, optionally `--runs` and `--issue`.
["ci:lane-budget"]
description = "Each CI lane's median job time over recent runs against its budget"
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-lane-budget --"

# An enforcing shard's test listing, written to `CI_WITNESS_LISTING` for the
# shard's own witness gate (`check:witnesses` with `CI_WITNESS_LISTINGS`). The
# flags are the shard's test task's, so the listing builds nothing the shard
# did not.
["ci:witness-listing"]
description = "List an enforcing shard's tests as nextest JSON for the witness gate"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
run = ".config/mise/enforcing .config/mise/scope cargo nextest list {{ env.CI_SHARD_ARGS | default(value='--workspace') }} --locked --config 'resolver.feature-unification=\"workspace\"' --message-format json > \"${CI_WITNESS_LISTING:?}\""

# The build state a test lane hands to the next landing holds what this run's
# builds used: Cargo never deletes a unit a dependency, feature or lockfile
# change superseded, so a state restored and saved on every landing grows
# with every manifest change (crates/workflow-build-state/README.md). Each
# task asks Cargo again for the lane's builds, fresh by now, as JSON messages
# and prunes every other unit. The enforcing build compiled the binary.
["ci:prune-enforcing"]
description = "Prune the enforcing test state to the units this run's builds used"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = [
  ".config/mise/enforcing .config/mise/scope cargo nextest run --workspace --locked --no-run --cargo-message-format json > target/enforcing/units.jsonl",
  "target/enforcing/debug/build-state prune --profile-dir target/enforcing/debug target/enforcing/units.jsonl",
]

# The plain lane's builds: the plain-only tests, the corpus driver, the corpus
# comments suite and the pruning binary itself. A new plain-lane build joins
# this list, or the next landing rebuilds it.
["ci:prune-plain"]
description = "Prune the plain test state to the units this run's builds used"
run = [
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --no-run --cargo-message-format json > target/debug/units-tests.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-lang --message-format json > target/debug/units-corpus.jsonl",
  ".config/mise/scope cargo test --locked --package gandr-surface-corpus --test tests --no-run --message-format json > target/debug/units-comments.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-tests.jsonl target/debug/units-corpus.jsonl target/debug/units-comments.jsonl target/debug/units-tool.jsonl",
]

# The documentation lane's builds, with the arguments `check:doc` gives
# them: the private-item rustdoc with the default features and with every
# feature on, and the pruning binary itself, all in `check:doc`'s own build
# directory, `target/gate-doc`.
["ci:prune-docs"]
description = "Prune the documentation state to the units this run's builds used"
env.RUSTDOCFLAGS = "-D warnings"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/gate-doc"
run = [
  ".config/mise/scope cargo doc --workspace --locked --no-deps --document-private-items --message-format json > target/gate-doc/units-doc-default.jsonl",
  ".config/mise/scope cargo doc --workspace --all-features --locked --no-deps --document-private-items --message-format json > target/gate-doc/units-doc.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/gate-doc/units-tool.jsonl",
  "target/gate-doc/debug/build-state prune --profile-dir target/gate-doc/debug target/gate-doc/units-doc-default.jsonl target/gate-doc/units-doc.jsonl target/gate-doc/units-tool.jsonl",
]

# The examples lane's builds, with the arguments `check:doctests` gives
# them: the libraries the documentation examples link and the pruning
# binary itself. Cargo refuses `--no-run` for documentation examples, so
# `RUSTDOC=true` builds the libraries they link and runs none of them.
["ci:prune-doctests"]
description = "Prune the documentation examples' state to the units this run's builds used"
run = [
  "RUSTDOC=true .config/mise/scope cargo test --doc --workspace --locked --message-format json > target/debug/units-doctests.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-doctests.jsonl target/debug/units-tool.jsonl",
]

# The Clippy lane's two passes, run as the lane runs them, and the pruning
# binary itself. Each pass is its own task with `--units`, so the units the
# prune keeps are the units the lint used. A pass spelled here apart from its
# task drifted from it: it linted the whole plain graph and resolved other
# features, so it pruned the units the plain pass used, and each merge group
# checked 13 of them again (#5930). The two passes read the whole workspace
# whatever `GATE_SCOPE` names: a group on `landing` lints its scope first,
# and the state it hands on stays whole for its tree (#6894). Over a state
# that holds the rest fresh, the two passes take 1 to 2 s on a quiet host.
["ci:prune-clippy"]
description = "Prune the Clippy state to the units this run's passes used"
run = [
  "env -u GATE_SCOPE mise run check:clippy-plain-only --units target/debug/units-clippy.jsonl",
  "env -u GATE_SCOPE mise run check:clippy-enforcing --units target/enforcing/debug/units-clippy.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-clippy.jsonl target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/enforcing/debug target/enforcing/debug/units-clippy.jsonl",
]

# A build script's `rerun-if-changed` inputs are read by mtime, not by
# checksum, so a fresh checkout's dates reran `runtime-emitter`'s build script
# on every restored state, and rebuilt every crate above it (#3206). An
# archived state records the sources it was built from, and an unpacked one
# dates each source unchanged since to before its build
# (`.config/build-state/sources.bash`, its cases held by `check:build-state`).
["ci:sources-record"]
description = "Record the tracked sources a build state was built from, inside its target directory"
usage = 'arg "<target>" help="the profile directory the state archives"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
source .config/build-state/sources.bash
sources_record "$usage_target"
'''

["ci:sources-restamp"]
description = "Date the sources an unpacked build state was built from to before its build"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source .config/build-state/sources.bash
records=()
for dir in target/debug target/enforcing/debug target/gate-doc/debug; do
  if [[ -e $dir/$SOURCES_RECORD ]]; then records+=("$dir/$SOURCES_RECORD"); fi
done
sources_restamp "${records[@]}"
'''

# A ref keeps one cache entry per state: the run that saved one deletes the
# entries of its own ref under the state's key prefix it supersedes. That is
# main's push and schedule, and the integration cycle's dispatch, whose
# entries are each about 5 GB (#6951). Push runs of main
# overlap, so an older landing's run can save after a newer one's; a run
# deletes only the entries created before its own, and whichever run deletes
# last, the newest entry stands. Creation times compare to the second, and a
# tie deletes neither. A run whose own entry is not listed deletes nothing.
# GITHUB_REPOSITORY names the repository and GITHUB_REF the run's ref.
["ci:delete-superseded"]
description = "Delete the run's ref's cache entries under a key prefix created before this run's own"
usage = '''
arg "<prefix>" help="the key prefix the state's entries share"
arg "<key>" help="the key this run saved"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
gh cache list --repo "${GITHUB_REPOSITORY:?}" --ref "${GITHUB_REF:?}" --key "${usage_prefix:?}" --limit 100 --json id,key,createdAt \
  --jq 'def created: .createdAt | sub("\\.[0-9]+"; "") | fromdate;
    (map(select(.key == env.usage_key)) | first | if . == null then null else created end) as $own
    | .[] | select($own != null and created < $own) | .id' |
  xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
{% endraw %}'''

# One hotpath series, run under the profiler and uploaded twice: as
# `<series>`, judged on allocation in every crate (hotpath/<series>-policy.toml),
# and as `<series>-timing`, judged on wall-clock time in the crates the change
# reaches (hotpath/<series>-timing-policy.toml, its `[functions]` table
# given an `ignore` naming every instrumented function of any other
# workspace crate). hotpath's policy has no timing-only ignore, so the closure
# needs a report of its own.
#
# A series with a bytes policy (hotpath/<series>-bytes-policy.toml) runs once
# more with `HOTPATH_ALLOC_METRIC=bytes`, and the task uploads that report as
# `<series>-bytes` (#5125). A function budget of hotpath takes its `alloc`
# only in bytes, and the job counts allocations, so the budgets need this
# report. The report goes to target/hotpath/reports/ and not to
# target/hotpath/runs/, because the band judge reads counts there.
#
# The closure is every workspace crate a changed file sits in and every crate
# that depends on one, however indirectly. A changed lockfile, workspace
# manifest, toolchain pin or `.cargo/` file, or no base to compare with
# (main's push, a dispatch), reaches every crate. A closure that misses the
# series' package skips the timing upload. hotpath names a function by its
# full module path, `<crate>::<module>::<fn>`, with `<impl_type>::` before
# the function where the attribute names one, and an ignore pattern must
# match that whole name. A crate's names are read from its
# `#[cfg_attr(feature = "hotpath", hotpath::measure…)]` attributes, each
# pattern the crate's library name, `*` and the file's module: the file
# names only the innermost module, and `*` stands for any modules around it.
# A series' own `measure_block!` labels belong to its package. CI_BASE_SHA names the
# base. Each upload's report is also written to target/hotpath/reports/, which
# the job keeps as the artifact `hotpath-<commit>`.
#
# A report is a report, never a red run (#2641). Each upload's outcome is
# `.config/hotpath/upload.jq`'s: under act, which holds no OIDC token, it is
# skipped; otherwise a report hotpath Cloud did not take is a warning, the
# report is kept all the same, and its benchmark is named under
# target/hotpath/unsent/ for `ci:hotpath-unsent`, which files it.
#
# Every run's report, the uploads' among them, is kept as
# target/hotpath/runs/<series>-<n>.json, and runs without an upload follow
# until HOTPATH_RUNS (default 1) are kept: the several-run judgement of
# `ci:hotpath-judge` reads them, and the job keeps them as the artifact
# `hotpath-runs-<commit>` for the next push to `landing` (#6993).
["ci:hotpath"]
description = "Run a hotpath series and upload its allocation, timing and bytes reports"
tools.jq = "1.8.1"
usage = '''
arg "<series>" help="the benchmark name"
arg "<package>" help="the package holding the bench"
arg "<bench>" help="the bench target"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
series=${usage_series:?}
package=${usage_package:?}
bench=${usage_bench:?}
root=$(git rev-parse --show-toplevel)
scratch="$root/target/hotpath"
mkdir -p "$scratch/reports" "$scratch/runs" "$scratch/unsent"
rm -f "$scratch/runs/$series"-*.json "$scratch/$series-timing-policy.toml" \
  "$scratch/unsent/$series" "$scratch/unsent/$series-timing" "$scratch/unsent/$series-bytes"
kept=0
keep() {
  kept=$((kept + 1))
  cp "$1" "$scratch/runs/$series-$kept.json"
}
# `send <benchmark> <policy>`: one run of the series, uploaded as <benchmark>.
send() {
  rm -f "$scratch/$1.json"
  HOTPATH_BENCHMARK=$1 HOTPATH_POLICY_PATH=$2 HOTPATH_UPLOAD_RESPONSE_PATH="$scratch/$1.json" \
    HOTPATH_OUTPUT_FORMAT=json HOTPATH_OUTPUT_PATH="$scratch/reports/$1.json" \
    "$root/.config/mise/scope" cargo test --locked --profile test --package "$package" --bench "$bench" --features hotpath
  outcome=$(jq -n --arg act "${ACT:-}" --arg sent "$([[ -s $scratch/$1.json ]] && echo true)" \
    '{act: ($act == "true"), sent: ($sent == "true")}' | jq -r -f "$root/.config/hotpath/upload.jq")
  case $outcome in
    unsent)
      echo "::warning::hotpath: the $1 report was not uploaded; it is kept in the run's hotpath artifact and filed by ci:hotpath-unsent"
      : > "$scratch/unsent/$1"
      ;;
  esac
}
# `upload <benchmark> <policy>`: one run sent and kept as one of the runs.
upload() {
  send "$1" "$2"
  keep "$scratch/reports/$1.json"
}
more() {
  while (( kept < ${HOTPATH_RUNS:-1} )); do
    HOTPATH_UPLOAD=0 HOTPATH_OUTPUT_FORMAT=json HOTPATH_OUTPUT_PATH="$scratch/run.json" \
      "$root/.config/mise/scope" cargo test --locked --profile test --package "$package" --bench "$bench" --features hotpath
    keep "$scratch/run.json"
  done
}
upload "$series" "$root/hotpath/$series-policy.toml"
if [[ -f "$root/hotpath/$series-bytes-policy.toml" ]]; then
  HOTPATH_ALLOC_METRIC=bytes send "$series-bytes" "$root/hotpath/$series-bytes-policy.toml"
fi

base=${CI_BASE_SHA:-}
: > "$scratch/changed"
every=true
if [[ -n "$base" ]] && git fetch --quiet --depth=1 origin "$base" \
  && git diff --no-renames --name-only -z "$base" HEAD > "$scratch/changed"; then
  every=false
fi
cargo metadata --locked --format-version 1 > "$scratch/metadata.json"
# The first line is `in` or `out`, for the series' package; then the
# directory and the library name of each workspace crate outside the
# closure, a tab between them, one per line.
jq -r --rawfile changed "$scratch/changed" --argjson every "$every" --arg package "$package" '
  def grow($crates; $deps):
    . as $reached
    | [$crates[] | select(.id as $id | ($reached | index($id)) != null or any($deps[$id][]; . as $dep | ($reached | index($dep)) != null)) | .id]
    | if length == ($reached | length) then . else grow($crates; $deps) end;
  .workspace_root as $root
  | .workspace_members as $members
  | [.packages[] | select(.id as $id | ($members | index($id)) != null)
      | {id, name, dir: (.manifest_path | ltrimstr($root + "/") | rtrimstr("Cargo.toml")),
         lib: (([.targets[] | select(.kind | index("lib"))] | first | .name) // .name | gsub("-"; "_"))}] as $crates
  | ([.resolve.nodes[] | {key: .id, value: [.deps[].pkg]}] | from_entries) as $deps
  | ($changed | split("\u0000") | map(select(length > 0))) as $files
  | ($every or any($files[]; . == "Cargo.lock" or . == "Cargo.toml" or . == "rust-toolchain.toml" or startswith(".cargo/"))) as $all
  | (if $all then [$crates[].id]
     else [$crates[] | select(.dir as $dir | any($files[]; startswith($dir))) | .id] | grow($crates; $deps) end) as $closure
  | (if any($crates[]; .name == $package and (.id as $id | ($closure | index($id)) != null)) then "in" else "out" end),
    ($crates[] | select(.id as $id | ($closure | index($id)) == null) | "\(.dir)\t\(.lib)")
' "$scratch/metadata.json" > "$scratch/outside"
if [[ $(head -n 1 "$scratch/outside") != in ]]; then
  echo "the change reaches no crate $package depends on: no $series-timing upload"
  more
  exit 0
fi
tail -n +2 "$scratch/outside" | while IFS=$'\t' read -r dir lib; do
  [[ -d "$root/${dir}src" ]] || continue
  find "$root/${dir}src" -name '*.rs' -exec awk -v lib="$lib" '
    FNR == 1 {
      stem = FILENAME; sub(/\.rs$/, "", stem); sub(/\/mod$/, "", stem); sub(/.*\//, "", stem)
      module = stem == "lib" ? lib : lib "::*" stem
      pending = 0
    }
    /hotpath::measure/ {
      pending = 1; owner = module
      if (match($0, /impl_type = "[^"]+"/)) owner = module "::" substr($0, RSTART + 13, RLENGTH - 14)
      next
    }
    pending && match($0, /fn [A-Za-z_][A-Za-z0-9_]*/) { print owner "::" substr($0, RSTART + 3, RLENGTH - 3); pending = 0 }
  ' {} +
done | sort -u > "$scratch/ignored"
# hotpath takes `ignore` in the `[functions]` table alone and refuses it in
# a metric block (#996), so the line goes right under that table's header,
# wherever the formatter places the table.
ignore=
if [[ -s "$scratch/ignored" ]]; then
  ignore="ignore = [$(sed 's/.*/"&"/' "$scratch/ignored" | paste -sd, -)]"
fi
awk -v ignore="$ignore" '
  { print }
  $0 == "[functions]" { found = 1; if (ignore != "") print ignore }
  END { if (!found) { print FILENAME " has no [functions] table to hold the ignore" > "/dev/stderr"; exit 1 } }
' "$root/hotpath/$series-timing-policy.toml" > "$scratch/$series-timing-policy.toml"
upload "$series-timing" "$scratch/$series-timing-policy.toml"
more
{% endraw %}'''

# A commit's hotpath runs judged against its base's, several a side
# (crates/workflow-hotpath-guard/src/judge.rs), on each push to `landing`
# against the commit `landing` stood at before it (#6993; the push's
# `before`, never its first parent: a group brings several merges). The
# judge reads every row, which hotpath Cloud never judges on a push. The
# base's runs are the artifact `hotpath-runs-<base>` its own run kept, never
# measured here; without one nothing is judged, said once. Each series is
# judged as `<series>-push` under its allocation policy and, when
# `ci:hotpath` wrote a timing policy for it, as `<series>-timing-push` under
# that one, its ignore included. Each judgement's check run body is written
# to target/hotpath/judged/, which the job keeps for the poster: the job
# running the change's code holds no token to post a check. Arguments: each
# series' name. GITHUB_REPOSITORY, CI_BASE_SHA, CI_HEAD_SHA and GH_TOKEN
# describe the run.
["ci:hotpath-judge"]
description = "Judge a commit's hotpath runs against its base's, several a side"
usage = '''
arg "<series>..." help="each series by name"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
shopt -s nullglob
base=${CI_BASE_SHA:?the base commit}
head=${CI_HEAD_SHA:?the judged commit}
repo=${GITHUB_REPOSITORY:?}
root=$(git rev-parse --show-toplevel)
scratch="$root/target/hotpath"
dir="$scratch/judged"
rm -rf "$dir"
mkdir -p "$dir/base" "$dir/checks"
eval "series=(${usage_series:?})"
scope=push
run=$(gh api "repos/$repo/actions/artifacts?name=hotpath-runs-$base&per_page=100" \
  --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
if [[ -z $run ]] || ! gh run download "$run" -R "$repo" -n "hotpath-runs-$base" -D "$dir/base"; then
  echo "no run kept hotpath-runs-$base: no $scope judgement"
  exit 0
fi
for name in "${series[@]}"; do
  for benchmark in "$name" "$name-timing"; do
    policy="$root/hotpath/$benchmark-policy.toml"
    if [[ $benchmark == "$name-timing" ]]; then policy="$scratch/$benchmark-policy.toml"; fi
    if [[ ! -f $policy ]]; then
      echo "$benchmark: the change reaches no crate of the series; no $scope judgement"
      continue
    fi
    base_runs=("$dir/base/$name"-[0-9]*.json)
    head_runs=("$scratch/runs/$name"-[0-9]*.json)
    if (( ${#base_runs[@]} == 0 || ${#head_runs[@]} == 0 )); then
      echo "$benchmark: no runs of $name on both sides; no $scope judgement"
      continue
    fi
    runs=()
    for report in "${base_runs[@]}"; do runs+=(--base-run "$report"); done
    for report in "${head_runs[@]}"; do runs+=(--head-run "$report"); done
    "$root/.config/mise/scope" cargo run --locked --quiet --profile test --package gandr-workflow-hotpath-guard --bin hotpath-judge -- \
      --repository "$repo" --head "$head" --base "$base" --benchmark "$benchmark-$scope" \
      --policy "$policy" --output "$dir/checks/$benchmark-$scope.json" "${runs[@]}"
  done
done
{% endraw %}'''

# A commit's concluded `hotpath / <benchmark>` checks, filed on one issue per
# regressed function, `perf: <function>`, labelled kind:performance and the
# function's area: its body indexes the function's regressions, and each
# pull request has one report comment there, edited by its later runs
# (crates/workflow-hotpath-guard/README.md). The hotpath guard workflow runs
# it on each concluded check's completion. Arguments pass through: `--sha`,
# optionally `--repository`, `--pull` and `--file-issue`.
["ci:hotpath-guard"]
description = "A commit's hotpath checks, filed on each regressed function's issue"
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-hotpath-guard --bin hotpath-guard --"

# A landing's hotpath verdicts, read on each push to `landing` from the
# `hotpath / <benchmark>` checks `hotpath-judged` posts on the pushed commit
# (#6993): the push lands a group, and the group's verdict is each of its
# pull requests' row. The numbers come from each landing merge's `(#n)`
# suffix. A merge queue lands a group in one push, so every merge commit
# after the push's base (HOTPATH_PUSH_BEFORE) is read, through the compare
# API: the checkout holds one commit. Only a merge names its pull request: a
# branch commit the merge brings may end its subject with an issue's number,
# as `(#1216)` did, and is never read. A number that names no pull request is
# skipped with a note. Each red check and each report that improves past its
# policy's
# band is a row of the open `Hotpath: the landed deltas` tracking issue, whose
# body the task rewrites in place through `.config/hotpath/landed.jq` (#3596,
# its cases held by `check:hotpath`): its prose kept, its rows collapsed under
# a summary counting the landings, the regressed and the improved. A new
# ledger opens with the sentence that says what it is and a lead for its
# table. A red row links the issues of the functions the pull request
# regressed, each holding the pull request's row (the hotpath guard's index).
# Each push that lands reads the state of every issue the table links, in one
# query, and settles a row: `fixed — <issues>` once they are all closed, and
# `fixed — no issue` for a row that links none (#3348). So the collector
# counts only the rows with work open, and the body is written only when a
# row changes. A commit without a pull request number reads nothing. GH_REPO
# names the repository.
["ci:hotpath-landed"]
description = "Add the landed pull requests' hotpath verdicts to the ledger"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
ledger_title='Hotpath: the landed deltas'
before=${HOTPATH_PUSH_BEFORE:-}
if [[ -n $before && ! $before =~ ^0+$ ]]; then
  landings=$(gh api "repos/$repo/compare/$before...$(git rev-parse HEAD)" \
    --jq '.commits[] | select((.parents | length) > 1) | "\(.sha[0:8]) \(.commit.message | split("\n") | first)"')
elif (( $(git cat-file -p HEAD | grep -c '^parent ') > 1 )); then
  landings="$(git rev-parse --short=8 HEAD) $(git log -1 --format=%s HEAD)"
else
  landings=
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
: > "$scratch/rows"
gh api --paginate "repos/$repo/commits/$(git rev-parse HEAD)/check-runs?per_page=100" \
  --jq '.check_runs[] | select(.name | startswith("hotpath / ")) | {name, conclusion, summary: (.output.summary // "")}' \
  | jq -s . > "$scratch/runs.json"
landed=0
while IFS=' ' read -r commit subject; do
  [[ $subject =~ \(#([0-9]+)\)$ ]] || continue
  pr=${BASH_REMATCH[1]}
  if ! gh pr view "$pr" --repo "$repo" --json number > /dev/null 2>&1; then
    echo "#$pr names no pull request; skipped"
    continue
  fi
  landed=$((landed + 1))
  if [[ $(jq length "$scratch/runs.json") == 0 ]]; then
    echo "#$pr: the push carries no hotpath check"
    continue
  fi
  issues=$(gh issue list --repo "$repo" --state all --label kind:performance --limit 100 \
    --search "\"#$pr\" in:body" --json number,title,body \
    | jq -r --arg row "| #$pr |" '[.[] | select((.title | startswith("perf: ")) and (.body | contains($row))) | "#\(.number)"] | join(" ")')
  while IFS= read -r run; do
    benchmark=$(jq -r '.name | ltrimstr("hotpath / ")' <<< "$run")
    conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
    # The summary's heading reads `` `<benchmark>` · <verdict> ``.
    verdict=$(jq -r '.summary | split("\n") | map(select(startswith("### "))) | (first // "") | sub("^### [^·]*· *"; "")' <<< "$run")
    if [[ $conclusion == failure ]]; then
      row_issue=${issues:-—}
    elif grep -qi improv <<< "$verdict"; then
      row_issue='—'
    else
      continue
    fi
    printf '| %s | #%s | %s | %s | %s |\n' "$commit" "$pr" "$benchmark" "${verdict:-$conclusion}" "$row_issue" >> "$scratch/rows"
  done < <(jq -c '.[]' "$scratch/runs.json")
done <<< "$landings"
if (( landed == 0 )); then
  echo "the push merges no pull request: no hotpath verdict to read"
  exit 0
fi
ledger=$(gh issue list --repo "$repo" --state open --label collector --search "\"$ledger_title\" in:title" --json number,title \
  | jq -r --arg title "$ledger_title" '[.[] | select(.title == $title)] | first | .number // empty')
if [[ -z $ledger && ! -s $scratch/rows ]]; then
  echo "no hotpath regression or improvement past the band in $landed landing(s), and no ledger"
  exit 0
fi
if [[ -z $ledger ]]; then
  echo null > "$scratch/body.json"
else
  gh issue view "$ledger" --repo "$repo" --json body --jq '.body | tojson' > "$scratch/body.json"
fi
# The state of each issue the table's rows and the new ones link (#3348), in
# one query: a row whose linked issues are all closed settles as `fixed`.
linked=$(jq -rn --slurpfile body "$scratch/body.json" --rawfile rows "$scratch/rows" \
  '[(($body[0] // "") | gsub("\r"; "") | split("\n")[]), ($rows | split("\n")[])]
   | map(select(startswith("|")) | split("|")[5] // "" | match("#[0-9]+"; "g").string | ltrimstr("#"))
   | unique | .[]')
states='{}'
if [[ -n $linked ]]; then
  fields=$(for n in $linked; do printf 'i%s: issue(number: %s) { state } ' "$n" "$n"; done)
  if ! states=$(gh api graphql -f query="query { repository(owner: \"${repo%/*}\", name: \"${repo#*/}\") { $fields } }" \
    --jq '.data.repository | with_entries(.key |= "#" + ltrimstr("i") | .value |= .state)'); then
    echo "the states of the linked issues do not read: only the rows that link none settle"
    states='{}'
  fi
fi
jq -n --slurpfile body "$scratch/body.json" --rawfile rows "$scratch/rows" --argjson states "$states" \
  '{body: $body[0], rows: ($rows | split("\n") | map(select(length > 0))), states: $states}' \
  | jq -r -f .config/hotpath/landed.jq > "$scratch/ledger.md"
if [[ -z $ledger ]]; then
  ledger=$(gh issue create --repo "$repo" --title "$ledger_title" --label collector --label area:workflow \
    --label kind:performance --label priority:medium --label effort:unknown \
    --body-file "$scratch/ledger.md" | sed 's|.*/||')
elif [[ $(jq -r 'gsub("\r"; "")' "$scratch/body.json") == "$(< "$scratch/ledger.md")" ]]; then
  echo "ledger #$ledger: no row changes"
  exit 0
else
  gh issue edit "$ledger" --repo "$repo" --body-file "$scratch/ledger.md" > /dev/null
fi
echo "ledger #$ledger"
cat "$scratch/rows"
{% endraw %}'''

# Landing's hotpath reports not uploaded (#2641, #6993): each benchmark
# `ci:hotpath` could not upload on a push to `landing` (HOTPATH_UNSENT,
# space-separated) is a row of one open `kind:ci` issue, `ci: hotpath reports
# not uploaded on landing`, opened by the first and updated by each later
# one; `.config/hotpath/unsent.jq` writes its body. The row links the run,
# whose `hotpath-<commit>` artifact keeps the measurements. GH_REPO names
# the repository; GITHUB_SERVER_URL, GITHUB_RUN_ID and GITHUB_SHA the run.
["ci:hotpath-unsent"]
description = "File landing's hotpath reports not uploaded on one kind:ci issue"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
title='ci: hotpath reports not uploaded on landing'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
gh issue list --repo "$repo" --state open --label kind:ci --search "\"$title\" in:title" --json number,title,body \
  | jq -c --arg title "$title" '[.[] | select(.title == $title)] | first' > "$scratch/issue.json"
: "${HOTPATH_UNSENT:?}"
jq -n --slurpfile issue "$scratch/issue.json" --arg commit "${GITHUB_SHA:?}" \
  --arg url "${GITHUB_SERVER_URL:?}/$repo/actions/runs/${GITHUB_RUN_ID:?}" --rawfile benchmarks <(printf '%s' "$HOTPATH_UNSENT") \
  '{issue: $issue[0], run: {commit: $commit, url: $url, benchmarks: ($benchmarks | split(" ") | map(select(length > 0)))}}' \
  | jq -c -f .config/hotpath/unsent.jq > "$scratch/filed.json"
jq -r .body "$scratch/filed.json" > "$scratch/body.md"
number=$(jq -r '.number // empty' "$scratch/filed.json")
if [[ -z $number ]]; then
  gh issue create --repo "$repo" --title "$title" --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number"
fi
'''

# A landing's surviving mutants, read on each push to `landing` (#6993) from
# each merged pull request's mutants comment, the one the `report the
# mutants of the change` lane of the same push posted (`mutants:changed`,
# #1456). The queue lands a group in one push, so every merge commit after
# the push's base (MUTANTS_PUSH_BEFORE) is read through the compare API, as
# `ci:hotpath-landed` reads them, and a number that names no pull request is
# skipped with a note. Each pull
# request whose report names a survivor gets one issue, `test: #<n> leaves <k>
# mutant(s) alive`. A later landing of the same number updates it in place.
# Its labels are kind:gap, `collector` (#2537), the pull request's `area:`
# labels and the tier of each crate a survivor lives in, so the lane that
# owns the crate picks it up. `.config/mutants/landed.jq` writes its body
# (#3596, its cases held by `check:mutants`): the sentence that says what it
# is, then the report. A commit without a pull request number, or a pull
# request without a report, files nothing. GH_REPO names the repository.
# `--unwitnessed` reads one static list for one crate. It reads one page of
# open collectors. It creates or updates `test: <crate> has <n> unwitnessed
# mutant(s)`. `.config/mutants/unwitnessed.jq` writes that collector body.
["ci:mutants-landed"]
description = "File each landed pull request's surviving mutants on one issue"
tools.jq = "1.8.1"
usage = '''
flag "-p --package <crate>" help="the crate that owns an unwitnessed list"
flag "--unwitnessed <file>" help="a static unwitnessed-mutants list"
flag "--campaign <file>" help="a campaign's surviving-mutants list"
'''
run = '''
{% raw %}#!/usr/bin/env bash
source .config/gh/budget.bash
set -euo pipefail
repo=${GH_REPO:?}
file_unwitnessed() {
  local unwitnessed=$1 crate=$2 area scratch count title key issue url
  local -a labels
  [[ -n $crate ]] || { echo '--unwitnessed needs --package' >&2; return 2; }
  [[ -f $unwitnessed ]] || { printf 'no unwitnessed list at %s\n' "$unwitnessed" >&2; return 2; }
  area=${crate#gandr-}
  area=${area%%-*}
  case "$area" in
    ci | core | distribution | editor | kernel | lsp | program-logic | runtime | storage | surface | theory | ux | workflow) ;;
    *) printf 'no area for crate %s\n' "$crate" >&2; return 2 ;;
  esac
  scratch=$(mktemp -d)
  trap 'rm -rf "$scratch"' EXIT
  jq -R -s --arg crate "$crate" '{crate: $crate, mutants: [split("\n")[] | select(length > 0)]}' "$unwitnessed" > "$scratch/input.json"
  count=$(jq '.mutants | length' "$scratch/input.json")
  if (( count == 0 )); then
    printf '%s names no unwitnessed mutant\n' "$crate"
    return 0
  fi
  jq -r -f .config/mutants/unwitnessed.jq "$scratch/input.json" > "$scratch/body.md"
  title="test: $crate has $count unwitnessed mutant(s)"
  key="test: $crate has "
  issue=$(gh issue list --repo "$repo" --state open --label collector --limit 100 --search "\"${key% }\" in:title" --json number,title \
    | jq -r --arg key "$key" '[.[] | select(.title | startswith($key))] | first | .number // empty')
  labels=(--label kind:gap --label collector --label "area:$area" --label priority:medium --label effort:unknown)
  if [[ -n $issue ]]; then
    gh issue edit "$issue" --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]/#--label/--add-label}" > /dev/null
    printf '%s: updated #%s (%s unwitnessed mutant(s))\n' "$crate" "$issue" "$count"
  else
    url=$(gh issue create --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]}")
    printf '%s: opened %s (%s unwitnessed mutant(s))\n' "$crate" "$url" "$count"
  fi
}
file_campaign() {
  local survivors=$1 crate=$2 area scratch count title key issue url
  local -a labels
  [[ -n $crate ]] || { echo '--campaign needs --package' >&2; return 2; }
  [[ -f $survivors ]] || { printf 'no campaign survivors at %s\n' "$survivors" >&2; return 2; }
  area=${crate#gandr-}
  area=${area%%-*}
  case "$area" in
    ci | core | distribution | editor | kernel | lsp | program-logic | runtime | storage | surface | theory | ux | workflow) ;;
    *) printf 'no area for crate %s\n' "$crate" >&2; return 2 ;;
  esac
  scratch=$(mktemp -d)
  trap 'rm -rf "$scratch"' EXIT
  jq -R -s --arg crate "$crate" '{crate: $crate, mutants: [split("\n")[] | select(length > 0)]}' "$survivors" > "$scratch/input.json"
  count=$(jq '.mutants | length' "$scratch/input.json")
  if (( count == 0 )); then
    printf '%s leaves no mutant alive in the campaign\n' "$crate"
    return 0
  fi
  jq -r -f .config/mutants/campaign.jq "$scratch/input.json" > "$scratch/body.md"
  title="test: $crate leaves $count mutant(s) alive (campaign)"
  key="test: $crate leaves "
  issue=$(gh issue list --repo "$repo" --state open --label collector --limit 100 --search "\"${key% }\" in:title" --json number,title \
    | jq -r --arg title "$title" '[.[] | select(.title == $title)] | first | .number // empty')
  labels=(--label kind:gap --label collector --label "area:$area" --label priority:medium --label effort:unknown)
  if [[ -n $issue ]]; then
    gh issue edit "$issue" --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]/#--label/--add-label}" > /dev/null
    printf '%s: updated #%s (%s survivor(s))\n' "$crate" "$issue" "$count"
  else
    url=$(gh issue create --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]}")
    printf '%s: opened %s (%s survivor(s))\n' "$crate" "$url" "$count"
  fi
}
unwitnessed=${usage_unwitnessed:-}
if [[ -n $unwitnessed ]]; then
  file_unwitnessed "$unwitnessed" "${usage_package:-}"
  exit 0
fi
campaign=${usage_campaign:-}
if [[ -n $campaign ]]; then
  file_campaign "$campaign" "${usage_package:-}"
  exit 0
fi
before=${MUTANTS_PUSH_BEFORE:-}
if [[ -n $before && ! $before =~ ^0+$ ]]; then
  landings=$(gh api "repos/$repo/compare/$before...$(git rev-parse HEAD)" \
    --jq '.commits[] | select((.parents | length) > 1) | .commit.message | split("\n") | first')
elif (( $(git cat-file -p HEAD | grep -c '^parent ') > 1 )); then
  landings=$(git log -1 --format=%s HEAD)
else
  landings=
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
while IFS= read -r subject; do
  [[ $subject =~ \(#([0-9]+)\)$ ]] || continue
  pr=${BASH_REMATCH[1]}
  if ! gh pr view "$pr" --repo "$repo" --json number > /dev/null 2>&1; then
    echo "#$pr names no pull request; skipped"
    continue
  fi
  gh api --paginate --slurp "repos/$repo/issues/$pr/comments?per_page=100" \
    | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- gandr-mutants -->")))] | first | .body // ""' \
    > "$scratch/report.md"
  if [[ ! -s $scratch/report.md ]]; then
    echo "#$pr carries no mutants report"
    continue
  fi
  count=$(sed -n 's/^\([0-9][0-9]*\) survivor(s)\.$/\1/p' "$scratch/report.md" | tail -n 1)
  if [[ -z $count || $count == 0 ]]; then
    echo "#$pr leaves no mutant of its lines alive"
    continue
  fi
  labels=(--label kind:gap --label collector --label priority:medium --label effort:unknown)
  while IFS= read -r label; do labels+=(--label "$label"); done < <({
    gh pr view "$pr" --repo "$repo" --json labels --jq '.labels[].name | select(startswith("area:"))'
    sed -n 's/^| `crates\/\([a-z]*\)-[^`]*` | .*/\1/p' "$scratch/report.md" \
      | grep -Fx -e kernel -e theory -e core -e storage -e runtime -e surface -e workflow | sed 's/^/area:/' || true
  } | sort -u)
  jq -n --argjson pr "$pr" --rawfile report "$scratch/report.md" '{pr: $pr, report: $report}' \
    | jq -r -f .config/mutants/landed.jq > "$scratch/body.md"
  title="test: #$pr leaves $count mutant(s) alive"
  key="test: #$pr leaves "
  issue=$(gh issue list --repo "$repo" --state open --search "\"${key% }\" in:title" --json number,title \
    | jq -r --arg key "$key" '[.[] | select(.title | startswith($key))] | first | .number // empty')
  if [[ -n $issue ]]; then
    gh issue edit "$issue" --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]/#--label/--add-label}" > /dev/null
    echo "#$pr: updated #$issue ($count survivor(s))"
  else
    url=$(gh issue create --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]}")
    echo "#$pr: opened $url ($count survivor(s))"
  fi
done <<< "$landings"
{% endraw %}'''

# The night's recovery sweep, filed by cause (`ledger:recovery`, #1782): one
# issue per first error and mutation kind, never one per mutant or exemplar.
# The report's `cause:` lines name each cause with its count and families. A
# cause is filed as `recovery: <name> marks other bytes than a <kind> tile`,
# kind:defect, area:surface and `collector` (#2537), its body written by
# `.config/claims/recovery.jq` (#3596, its cases held by `check:claims`): the
# sentence that says what it is, the cause's first findings, and its families
# as a checklist collapsed under their count. A cause already filed
# is skipped: an issue in any state whose title opens with `recovery: <name> `
# and names the kind's tile, or names neither kind's and so covers both
# (#1829). A night opens at most
# RECOVERY_LIMIT issues (3 by default), the causes largest first as the report
# ranks them, so a first sweep's long tail is filed over later nights rather
# than in one burst. RECOVERY_REPORT names the report (`target/recovery.txt`
# by default); without RECOVERY_FILE set the task prints what it would file
# and files nothing. GH_REPO names the repository; GITHUB_RUN_URL, when set,
# is linked from each body.
#
# The task keeps the open recovery collectors' rows (#3326,
# `.config/claims/swept.jq`, its cases held by `check:claims`): over a whole
# report, the one ending in its `mutants swept:` line, each family row of a
# collector is ticked once the night's cause of its name and kind no longer
# lists the family, and unticked when it lists it again. A night without the
# cause closes the collector (#3732): the sweep reads every exemplar, so a
# cause it does not report is gone. Its comment names the run and the landing
# whose body `Advances` it, the latest merged.
["ci:recovery-file"]
description = "File each cause of the recovery sweep's report on one issue"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
report=${RECOVERY_REPORT:-target/recovery.txt}
file=${RECOVERY_FILE:-}
limit=${RECOVERY_LIMIT:-3}
opened=0
repo=${GH_REPO:-}
if [[ -n $file && -z $repo ]]; then
  echo "RECOVERY_FILE needs GH_REPO" >&2
  exit 2
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
if [[ -n $repo ]]; then
  gh issue list --repo "$repo" --state all --limit 1000 --search '"recovery:" in:title' --json number,title > "$scratch/filed.json"
fi
pattern='^cause: `([^`]+)` (deleted|missed): ([0-9]+) mutants in ([0-9]+) families: (.*)$'
while IFS= read -r line; do
  [[ $line =~ $pattern ]] || continue
  name=${BASH_REMATCH[1]} kind=${BASH_REMATCH[2]} count=${BASH_REMATCH[3]} family_count=${BASH_REMATCH[4]} families=${BASH_REMATCH[5]}
  title="recovery: $name marks other bytes than a $kind tile"
  if [[ $name == unnamed ]]; then
    first=': first error "'
  else
    first=": first error \`$name\`"
  fi
  if [[ $kind == deleted ]]; then
    how='` deleted: first error'
  else
    how='` written as `'
  fi
  grep -F -e "$first" "$report" | grep -F -e "$how" | head -n 5 > "$scratch/findings" || true
  jq -n --arg name "$name" --arg kind "$kind" --argjson count "$count" --argjson family_count "$family_count" \
    --rawfile families <(printf '%s' "$families") --rawfile findings "$scratch/findings" --arg run "${GITHUB_RUN_URL:-}" \
    '{$name, $kind, $count, $family_count, $families, $findings, run: (if $run == "" then null else $run end)}' \
    | jq -r -f .config/claims/recovery.jq > "$scratch/body.md"
  if [[ -n $repo ]]; then
    filed=$(jq -r --arg key "recovery: $name " --arg tile " $kind tile" \
      '[.[] | select((.title | startswith($key)) and ((.title | contains($tile)) or ((.title | contains(" deleted tile") | not) and (.title | contains(" missed tile") | not))))] | first | .number // empty' \
      "$scratch/filed.json")
    if [[ -n $filed ]]; then
      echo "filed already as #$filed: $title"
      continue
    fi
  fi
  if (( opened >= limit )); then
    echo "deferred to a later night: $title ($count mutants)"
    continue
  fi
  opened=$(( opened + 1 ))
  if [[ -z $file ]]; then
    echo "would file: $title ($count mutants)"
    continue
  fi
  url=$(gh issue create --repo "$repo" --title "$title" --label kind:defect --label area:surface --label collector \
    --label priority:high --label effort:easy --body-file "$scratch/body.md")
  echo "filed $url: $title ($count mutants)"
done < "$report"
if ! grep -q -E '^[0-9]+ mutants swept: ' "$report"; then
  echo "the report ends in no \`mutants swept:\` line, so no collector's rows are read from it" >&2
  exit 0
fi
[[ -n $repo ]] || exit 0
claims=$(git rev-parse --show-toplevel)/.config/claims
jq -R 'capture("^cause: `(?<name>[^`]+)` (?<kind>deleted|missed): [0-9]+ mutants in [0-9]+ families: (?<families>.*)$")
    | .families |= (split(",") | map(gsub("^\\s+|\\s+$"; "")))' "$report" \
  | jq -s . > "$scratch/causes.json"
gh issue list --repo "$repo" --state open --label collector --limit 1000 --search '"recovery:" in:title' --json number,title,body > "$scratch/open.json"
jq -n --slurpfile causes "$scratch/causes.json" --slurpfile issues "$scratch/open.json" '{causes: $causes[0], issues: $issues[0]}' \
  | jq -c -L "$claims" -f "$claims/swept.jq" \
  | while IFS= read -r swept; do
      number=$(jq -r .number <<< "$swept")
      close=$(jq -r .close <<< "$swept")
      if [[ -z $file ]]; then
        echo "would mark #$number's rows$([[ $close == true ]] && echo ', and close it')"
        continue
      fi
      jq -r .body <<< "$swept" > "$scratch/swept.md"
      gh issue edit "$number" --repo "$repo" --body-file "$scratch/swept.md" > /dev/null
      echo "marked #$number's rows"
      if [[ $close == true ]]; then
        landing=$(gh pr list --repo "$repo" --state merged --limit 100 --search "\"#$number\" in:body" --json number,mergedAt,body \
          | jq -r --arg n "$number" '[.[] | select(.body | test("(?i)\\badvances\\s+#\($n)\\b"))] | max_by(.mergedAt) | .number // empty')
        gh issue close "$number" --repo "$repo" --comment "The recovery sweep${GITHUB_RUN_URL:+ ($GITHUB_RUN_URL)} found no mutant of this cause, so every family is marked where it was made; $(if [[ -n $landing ]]; then echo "the landing: #$landing."; else echo "no merged pull request advances it."; fi)" > /dev/null
        echo "closed #$number${landing:+ (the landing: #$landing)}"
      fi
    done
{% endraw %}'''

# A slow test is a report, never a dequeue (#3752): nextest's `ci` profile
# marks a test slow past 30 s and fails it only past 5 minutes, and this task
# files each slow test of one run. The run's `junit-*` artifacts sit under
# SLOW_STORE/SLOW_RUN_ID (`target/test-timing` by default, the store
# `test-timing` reads), and `test-timing --times` reads each test once, in the
# lane it held longest. `.config/claims/slow.jq`, its cases held by
# `check:claims`, decides the rest: one `collector` per test past SLOW_BUDGET
# seconds (30 by default), `test: <binary> <test> ran <t> s in the <lane>
# lane, past its 30 s budget`, kind:defect, area:workflow, priority:high,
# with a row per run; a run under the budget ticks a row, and three ticked
# rows in a row close it. Each slow test's line goes to standard output and,
# when GITHUB_STEP_SUMMARY is set, to the job summary. SLOW_RUN_URL links
# each row to its run; GH_REPO names the repository. SLOW_REASON, when set,
# says in the body what the run did with a test past the budget: the nightly
# ends a sweep at its limit and passes it (#3975). Without SLOW_FILE set
# the task prints what it would file and files nothing.
["ci:slow-file"]
description = "File each test past its 30 s budget on one collector issue"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
store=${SLOW_STORE:-target/test-timing}
budget=${SLOW_BUDGET:-30}
run=${SLOW_RUN_ID:?}
url=${SLOW_RUN_URL:?}
file=${SLOW_FILE:-}
repo=${GH_REPO:-}
if [[ -n $file && -z $repo ]]; then
  echo "SLOW_FILE needs GH_REPO" >&2
  exit 2
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
.config/mise/scope cargo run --locked --quiet --package gandr-workflow-test-timing -- \
  --offline --runs 1 --times --store "$store" > "$scratch/times.tsv"
jq -R 'split("\t") | {lane: .[0], binary: .[1], test: .[2], seconds: (.[3] | tonumber)}' "$scratch/times.tsv" \
  | jq -s . > "$scratch/times.json"
if [[ -n $repo ]]; then
  gh issue list --repo "$repo" --state open --label collector --limit 1000 --search '"s budget" in:title' \
    --json number,title,body > "$scratch/issues.json"
else
  echo '[]' > "$scratch/issues.json"
fi
claims=$(git rev-parse --show-toplevel)/.config/claims
jq -n --argjson budget "$budget" --argjson id "$run" --arg url "$url" --arg reason "${SLOW_REASON:-}" \
  --slurpfile times "$scratch/times.json" --slurpfile issues "$scratch/issues.json" \
  '{budget: $budget, reason: (if $reason == "" then null else $reason end), run: {id: $id, url: $url}, times: $times[0], issues: $issues[0]}' \
  | jq -c -L "$claims" -f "$claims/slow.jq" | jq -c '.[]' > "$scratch/actions"
if [[ ! -s $scratch/actions ]]; then
  echo "no test of run $run ran past its $budget s budget, and no slow-test collector changes"
  exit 0
fi
{
  printf '## Slow tests\n\n'
  jq -r .line "$scratch/actions"
} | if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then tee -a "$GITHUB_STEP_SUMMARY"; else cat; fi
while IFS= read -r action; do
  number=$(jq -r '.number // empty' <<< "$action")
  title=$(jq -r .title <<< "$action")
  if [[ -z $file ]]; then
    echo "would $(if [[ -n $number ]]; then echo "update #$number"; else echo open; fi): $title$([[ $(jq -r .close <<< "$action") == true ]] && echo ', and close it')"
    continue
  fi
  jq -r .body <<< "$action" > "$scratch/body.md"
  if [[ -z $number ]]; then
    created=$(gh issue create --repo "$repo" --title "$title" --label collector --label kind:defect \
      --label area:workflow --label priority:high --label effort:unknown --body-file "$scratch/body.md")
    echo "opened $created: $title"
    continue
  fi
  gh issue edit "$number" --repo "$repo" --title "$title" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number: $title"
  if [[ $(jq -r .close <<< "$action") == true ]]; then
    gh issue close "$number" --repo "$repo" --comment "Three runs in a row timed this test under its $budget s budget, the last $url." > /dev/null
    echo "closed #$number"
  fi
done < "$scratch/actions"
'''

# One step of the integration cycle (#5440, `.github/workflows/integration.yml`).
# Each step reads the state of the cycle from GitHub, so a lost or repeated
# event changes nothing. Every call runs on GH_TOKEN, the token of the
# `gandr-lang` App in the workflow, because the workflow's token has no
# room for the cycle (`.config/gh/calls.toml`). `.config/integration/
# cycle.jq` decides the step from the tips of `landing` and `integration` and
# from the dispatched runs of the suite's file on `integration`. A passing verdict
# fast-forwards `main` to the commit it tested. Until `main`'s ruleset admits
# the App (#5443), GitHub refuses that, and the step says so. A `main` that
# moves to a fix whose patch `landing` lacks (#6683, `.config/landing/
# fixes.bash`) sets the step output `rebase`. The factory runner then puts
# the fix on the newest head of `landing` that `integration` took, and moves
# only the commits above it (#5441, `.config/landing/rebase.bash`). `integration`
# then takes the tip of `landing`. A fast-forward moves the ref. A merge
# through the merges API keeps the fixer's commits, and GitHub signs the
# merge commit of an App. A merge that conflicts goes on the list for the
# fixer. `.config/integration/known-red.jq` writes the list from the
# verdict's JUnit reports and failed jobs into one issue, which stays open.
# A list that already names the verdict's run and the same take stands, and
# the step reads no report again. Each failed test of the soundness suite
# (`.config/integration/soundness.json`) gets an issue of its own,
# `status:unsectioned` for its claiming seat. A new list that is red, or that
# holds a conflict, sets the step output `page` to the list's issue, and the
# workflow pages the fixer. The step also reads the brake (#5442,
# `.config/integration/brake.bash`) from the runs it already read. The list
# holds the section `## The brake` while the brake holds the landings. A
# change of that state sets the step output `brake` to `on` or `off` and the
# output `list` to the list's issue, and the workflow pages every lane and
# the coordinator. Last, the step dispatches the suite's file on `integration`
# with the input `cycle` when the tip needs a verdict. It reads the
# self-hosted runners first with RUNNERS_TOKEN, and
# `.config/integration/runner.jq` gives the input `runner`: `integration`
# while a runner with that label is online, else `hosted` (#5526). The
# workflow runs one step at a time, and the next step starts on a new
# runner, so the dispatched run shows before that step reads the runs.
# Without CYCLE_FILE set the step prints what it would do and writes
# nothing. GH_REPO names the repository.
# Before its decision the step reads the jobs of a failure that could be
# hollow (#6887, `.config/integration/hollow.jq`): one call for each such
# run, three at most. A hollow failure that opens its head gives no verdict,
# so the decision reruns the suite or takes `landing`. The decision's line
# and the list name the run. A failed read leaves the run a verdict.
["ci:cycle"]
description = "Read the integration cycle's verdict, take landing into integration and start the suite there"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
write=${CYCLE_FILE:-}
root=$(git rev-parse --show-toplevel)
here=$root/.config/integration
source "$root/.config/issues/keep.bash"
source "$here/brake.bash"
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
say() {
  printf '%s\n' "$1"
  if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then printf '%s\n\n' "$1" >> "$GITHUB_STEP_SUMMARY"; fi
}
tip() { gh api "repos/$repo/git/ref/heads/$1" --jq .object.sha; }
# A dispatch that GitHub refuses with a server error loses the cycle, so a
# dispatch tries again, four times at most.
dispatch() {
  local wait
  for wait in 0 10 30 60; do
    sleep "$wait"
    if gh workflow run "$@"; then return 0; fi
  done
  return 1
}
merged_main=false
# The file of the cycle's suite at a commit of `integration` (#7099):
# `landing-checks.yml` once the commit holds it, and `ci.yml` before. The
# rename of the workflows reaches `integration` before it reaches `main`, and
# the step runs the copy of `main`, so the step reads the file at the commit.
# One read lists the names of the commit's workflow directory, about 12 KB,
# and no file's content. A failed read stops the step.
suite() {
  local held
  held=$(gh api "repos/$repo/contents/.github/workflows?ref=$1" --jq 'any(.[]; .name == "landing-checks.yml")') || return 1
  if [[ $held == true ]]; then
    echo landing-checks.yml
  else
    echo ci.yml
  fi
}
running() {
  gh run list --repo "$repo" --workflow "$1" --branch integration --event workflow_dispatch --limit 100 \
    --json databaseId,status,conclusion,headSha,url
}
landing=$(tip landing)
integration=$(tip integration)
# The comparison of the tips, with the merges of the queue past
# `integration`, which the read of a stated repair takes below (#7078).
gh api "repos/$repo/compare/$integration...$landing" \
  --jq '{status, merges: [.commits[] | select((.parents | length) == 2) | {sha, subject: (.commit.message | split("\n")[0])}]}' \
  > "$scratch/compare.json"
compare=$(jq -r .status "$scratch/compare.json")
# The repair that the fixer marks on `landing` (#6560, `integration:repair`):
# the tag `integration-repair`, which GitHub answers with 404 while no mark
# stands, and whether `landing` holds its commit. One read on each step, and
# one comparison while a mark stands.
repair=$(gh api "repos/$repo/git/ref/tags/integration-repair" --jq .object.sha 2> /dev/null) || repair=
held_repair=false
if [[ -n $repair ]]; then
  case $(gh api "repos/$repo/compare/$repair...$landing" --jq .status) in
    ahead | identical) held_repair=true ;;
  esac
fi
read_suite=$(suite "$integration")
running "$read_suite" > "$scratch/runs.json"
# Each failure that could be hollow, newest first: its jobs read, the run
# marked, and the next asked for. A read that fails stops the marks, so the
# run stays a verdict.
for _ in 1 2 3; do
  unread=$(jq -r -L "$here" -f "$here/hollow.jq" "$scratch/runs.json")
  [[ $unread != null ]] || break
  failed_jobs=$(gh api --paginate "repos/$repo/actions/runs/$unread/jobs?per_page=100" \
    --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length' | jq -s add) || break
  jq -c --argjson id "$unread" --argjson hollow "$([[ $failed_jobs == 0 ]] && echo true || echo false)" \
    'map(if .databaseId == $id then .hollow = $hollow else . end)' "$scratch/runs.json" > "$scratch/marked.json"
  mv "$scratch/marked.json" "$scratch/runs.json"
done
# The repair that a pull request on `landing` states (#7078, `repair.jq`). The
# step reads it only while no tag stands and the newest verdict fails on the
# tip of `integration`: one GraphQL query for the bodies of the newest 100
# merges of the queue past `integration`. A read that fails finds no repair,
# so `landing` waits as before.
stated=null
if [[ -z $repair ]] && jq -e -L "$here" --arg tip "$integration" \
  'include "verdicts"; (verdicts | first) as $v | $v != null and ($v.conclusion | failed) and $v.headSha == $tip' \
  "$scratch/runs.json" > /dev/null; then
  numbers=$(jq -r '[.merges | reverse | .[0:100][] | .subject | capture("\\(#(?<n>[0-9]+)\\)$").n] | join(" ")' "$scratch/compare.json")
  if [[ -n $numbers ]]; then
    query="query { repository(owner: \"${repo%/*}\", name: \"${repo#*/}\") {"
    for number in $numbers; do query+=" p$number: pullRequest(number: $number) { number body }"; done
    query+=" } }"
    if gh api graphql -f query="$query" --jq '[.data.repository[] | select(. != null)]' > "$scratch/bodies.json" 2> "$scratch/bodies.err"; then
      stated=$(jq -n -c --slurpfile runs "$scratch/runs.json" --slurpfile compare "$scratch/compare.json" --slurpfile bodies "$scratch/bodies.json" \
        '($bodies[0] | map({(.number | tostring): .body}) | add // {}) as $body
         | {runs: $runs[0], merges: [$compare[0].merges | reverse | .[] | (.subject | capture("\\(#(?<n>[0-9]+)\\)$").n) as $n | {sha, number: ($n | tonumber), body: $body[$n]}]}' \
        | jq -c -L "$here" -f "$here/repair.jq") || stated=null
    else
      say "The step reads no body of the merges past integration: $(< "$scratch/bodies.err")"
    fi
  fi
fi
[[ -n $stated ]] || stated=null
decision=$(jq -n -c --arg landing "$landing" --arg integration "$integration" --arg compare "$compare" \
  --arg repair "$repair" --argjson held "$held_repair" --slurpfile stated <(printf '%s\n' "$stated") --slurpfile runs "$scratch/runs.json" \
  '{landing: $landing, integration: $integration, compare: $compare, repair: (if $repair == "" then $stated[0] else {sha: $repair, held: $held} end), runs: $runs[0]}' \
  | jq -c -L "$here" -f "$here/cycle.jq")
verdict=$(jq -c .verdict <<< "$decision")
conclusion=$(jq -r '.conclusion // empty' <<< "$verdict")
brake=$(brake_read "$scratch/runs.json")
say "$(jq -r .line <<< "$brake")"

if [[ $conclusion == success ]]; then
  sha=$(jq -r .sha <<< "$verdict")
  main=$(tip main)
  case $(gh api "repos/$repo/compare/$main...$sha" --jq .status) in
    ahead)
      if [[ -z $write ]]; then
        say "would fast-forward main from ${main:0:12} to ${sha:0:12}"
      elif gh api -X PATCH "repos/$repo/git/refs/heads/main" -f sha="$sha" -F force=false > /dev/null 2> "$scratch/main.err"; then
        say "main fast-forwards from ${main:0:12} to ${sha:0:12}"
        case $(gh api "repos/$repo/compare/$sha...$landing" --jq .status) in
          ahead | identical) ;;
          *)
            # The trigger compares patches, not ancestry alone (#6683): a
            # merge of landing into integration, or a commit that landing
            # holds under another hash, is no fix. The checkout holds no
            # tree, and git fetches the trees and blobs that the patches
            # read: 15 seconds for the heads of 2026-11-11.
            git fetch --quiet --no-tags origin "$sha" "$landing"
            fixed=$("$root/.config/landing/fixes.bash" "$sha" "$landing" | wc -l | tr -d ' ')
            if (( fixed > 0 )); then
              say "landing at ${landing:0:12} lacks $fixed fix(es) of main: the factory runner puts them on landing above the head that integration took"
              if [[ -n ${GITHUB_OUTPUT:-} ]]; then echo "rebase=true" >> "$GITHUB_OUTPUT"; fi
            else
              say "landing at ${landing:0:12} holds each patch of main at ${sha:0:12}: no rebase"
            fi
            ;;
        esac
      else
        say "main stays at ${main:0:12}: GitHub refuses its fast-forward to ${sha:0:12}: $(< "$scratch/main.err")"
      fi
      ;;
    diverged)
      # main holds a commit that integration lacks: a fix pushed to main. The
      # merges API takes main into integration, so the next passing cycle
      # holds main and moves it forward.
      if [[ -z $write ]]; then
        say "main stays at ${main:0:12}: it does not hold the passing ${sha:0:12} as its ancestor; would merge main into integration"
      elif gh api "repos/$repo/merges" -f base=integration -f head="$main" \
        -f commit_message="Merge main at ${main:0:12} into integration" > /dev/null 2> "$scratch/main-merge.err"; then
        merged_main=true
        say "main stays at ${main:0:12}: it does not hold the passing ${sha:0:12} as its ancestor, so main merges into integration"
      else
        say "main stays at ${main:0:12}: it does not merge into integration, and the fixer merges it there by hand: $(< "$scratch/main-merge.err")"
        exit 1
      fi
      ;;
  esac
fi

say "$(jq -r .line <<< "$decision")"
conflict=null
if [[ -n $write ]]; then
  take=$(jq -r .take <<< "$decision")
  # After main merges in, integration holds a commit past landing, so
  # landing merges rather than fast-forwards.
  if [[ $merged_main == true && $take == fast-forward ]]; then take=merge; fi
  case $take in
    fast-forward)
      gh api -X PATCH "repos/$repo/git/refs/heads/integration" -f sha="$landing" -F force=false > /dev/null
      ;;
    merge)
      if ! gh api "repos/$repo/merges" -f base=integration -f head="$landing" \
        -f commit_message="Merge landing at ${landing:0:12} into integration" > /dev/null 2> "$scratch/merge.err"; then
        if [[ $(< "$scratch/merge.err") != *"HTTP 409"* ]]; then
          cat "$scratch/merge.err" >&2
          exit 1
        fi
        conflict=$(jq -n -c --arg sha "$landing" '$sha')
        say "The tip of landing, ${landing:0:12}, does not merge into integration."
      fi
      ;;
  esac
  # A take of a repair drops its mark, so the next red verdict waits again. A
  # repair that a pull request states has no mark to drop (#7078).
  if [[ $conflict == null && -n $repair && $(jq -r '.repaired // false' <<< "$decision") == true ]]; then
    gh api -X DELETE "repos/$repo/git/refs/tags/integration-repair" > /dev/null
    say "The cycle drops the mark of the repair, ${repair:0:12}: integration holds it now."
  fi
fi

# The state that the known-red list's issue owes, for a row (`true`) or for
# none (`false`): `close`, `reopen`, `file` or nothing (`list-state.jq`). It
# reads `found`, the list's issue, from `keep_list`.
list_act() {
  jq -n -c --slurpfile row <(printf '%s\n' "$1") --slurpfile found <(printf '%s\n' "$found") '{row: $row[0], state: $found[0].state?}' \
    | jq -c -f "$here/list-state.jq" | jq -r '.act // empty'
}

# Close or reopen the list's issue `number` of `keep_list` as the act asks;
# `file` and nothing leave it as it is.
set_state() {
  case $1 in
    reopen)
      if [[ -z $write ]]; then say "would reopen the known-red list #$number: it holds a row"; return; fi
      gh issue reopen "$number" --repo "$repo" > /dev/null
      say "The cycle reopens the known-red list #$number: it holds a row."
      ;;
    close)
      if [[ -z $write ]]; then say "would close the known-red list #$number: it holds no row"; return; fi
      gh issue close "$number" --repo "$repo" --reason completed \
        --comment "The list holds no row${id:+: run $id passes}. The cycle reopens it for a row (#6540)." > /dev/null
      say "The cycle closes the known-red list #$number: it holds no row."
      ;;
  esac
}

# The known-red list in step with the verdict, the take and the brake. A
# list that names the verdict's run and holds the same take and the same
# brake stands unread. The list's issue is open while the list holds a row,
# a failed cycle or a take that does not merge, and closed otherwise
# (`list-state.jq`, #6540): an empty list counts as no open defect.
keep_list() {
  local title="integration: the known-red list" found number current id held taken braked braking jobs='[]' known url own heading row act aside set_aside named=true
  found=$(issue_found "$title")
  number=$(jq -r '.number // empty' <<< "$found")
  current=$(jq -r '.body // empty' <<< "$found")
  id=$(jq -r '.id // empty' <<< "$verdict")
  held=$([[ $current == *"## The take"* ]] && echo true || echo false)
  taken=$([[ $conflict != null ]] && echo true || echo false)
  braked=$([[ $current == *"## The brake"* ]] && echo true || echo false)
  braking=$(jq -r .on <<< "$brake")
  aside=$(jq -c '.aside // []' <<< "$decision")
  for set_aside in $(jq -r '.[].id' <<< "$aside"); do
    [[ $current == *"/actions/runs/$set_aside)"* ]] || named=false
  done
  if [[ -n $id && $current == *"/actions/runs/$id)"* && $held == "$taken" && $braked == "$braking" && $named == true ]]; then
    row=$([[ $taken == true || ( -n $conclusion && $conclusion != success ) ]] && echo true || echo false)
    set_state "$(list_act "$row")"
    say "The known-red list #$number stands: it reads run $id."
    return
  fi
  echo '[]' > "$scratch/reports.json"
  if [[ -n $conclusion && $conclusion != success ]]; then
    if gh run download "$id" --repo "$repo" --pattern 'junit-*' --dir "$scratch/junit" 2> "$scratch/download.err"; then
      find "$scratch/junit" -name junit.xml -print0 | while IFS= read -r -d '' report; do
        lane=${report#"$scratch/junit/junit-"}
        yq -p xml -o json -I0 . "$report" | jq -c --arg lane "${lane%%/*}" '{lane: $lane, junit: .}'
      done | jq -s . > "$scratch/reports.json"
    else
      say "Run $id holds no test report: $(< "$scratch/download.err")"
    fi
    jobs=$(gh api --paginate "repos/$repo/actions/runs/$id/jobs?per_page=100" \
      --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' \
      | jq -R -s -c 'split("\n") | map(select(. != ""))')
  fi
  known=$(jq -n -c --slurpfile verdict <(printf '%s\n' "$verdict") --slurpfile conflict <(printf '%s\n' "$conflict") \
    --slurpfile jobs <(printf '%s\n' "$jobs") \
    --argjson brake "$braking" --argjson aside "$aside" --slurpfile reports "$scratch/reports.json" --slurpfile soundness "$here/soundness.json" \
    '{verdict: $verdict[0], conflict: $conflict[0], brake: $brake, aside: $aside, reports: $reports[0], jobs: $jobs[0], soundness: $soundness[0]}' \
    | jq -c -f "$here/known-red.jq")
  jq -r .body <<< "$known" > "$scratch/body.md"
  act=$(list_act "$(jq -c .page <<< "$known")")
  if [[ $current == "$(< "$scratch/body.md")" ]]; then
    set_state "$act"
    say "The known-red list #$number stands."
    return
  fi
  if [[ -z $number && $act != file ]]; then
    say "The known-red list holds no row, and no list issue exists, so the cycle files none."
    return
  fi
  if [[ -z $write ]]; then
    say "would rewrite the known-red list${number:+ #$number}:"
    cat "$scratch/body.md"
    set_state "$act"
    jq -r '.soundness[] | "would file or update: \(.title)"' <<< "$known"
    if [[ $braked != "$braking" ]]; then say "would page every lane: the brake turns $([[ $braking == true ]] && echo on || echo off)"; fi
    return
  fi
  if [[ -z $number ]]; then
    url=$(gh issue create --repo "$repo" --title "$title" --label collector --label kind:defect --label area:ci \
      --label priority:high --label effort:unknown --body-file "$scratch/body.md")
    number=${url##*/}
  else
    [[ $act != reopen ]] || set_state reopen
    gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
    [[ $act != close ]] || set_state close
  fi
  say "The cycle rewrites the known-red list #$number."
  while IFS= read -r own; do
    jq -r .body <<< "$own" > "$scratch/own.md"
    heading=$(jq -r .title <<< "$own")
    issue_keep "$heading" "$(issue_found "$heading")" 1 "$scratch/own.md" \
      gh issue create --repo "$repo" --title "$heading" --body-file "$scratch/own.md" --label kind:defect \
      --label "$(jq -r .area <<< "$own")" --label priority:high --label effort:unknown --label status:unsectioned
  done < <(jq -c '.soundness[]' <<< "$known")
  if [[ -n ${GITHUB_OUTPUT:-} ]]; then
    if [[ $(jq -r .page <<< "$known") == true ]]; then echo "page=$number" >> "$GITHUB_OUTPUT"; fi
    if [[ $braked != "$braking" ]]; then
      printf 'brake=%s\nlist=%s\n' "$([[ $braking == true ]] && echo on || echo off)" "$number" >> "$GITHUB_OUTPUT"
    fi
  fi
}
keep_list

# The repository's self-hosted runners, or null when the step cannot read
# them. RUNNERS_TOKEN is empty when the App holds no `Administration: read`.
runners() {
  if [[ -n ${RUNNERS_TOKEN:-} ]] \
    && GH_TOKEN=$RUNNERS_TOKEN gh api "repos/$repo/actions/runners?per_page=100" --jq .runners 2> "$scratch/runners.err"; then
    return
  fi
  if [[ -s $scratch/runners.err ]]; then printf '%s\n' "$(< "$scratch/runners.err")" >&2; fi
  echo null
}

# A take that does not merge leaves the tip of integration as it stands. The
# suite still tests that tip once, as when landing holds nothing new, so the
# fixer's commits never wait on the hand merge.
start=$(jq -r .dispatch <<< "$decision")
if [[ $conflict != null ]]; then
  start=$(jq -r --arg tip "$(tip integration)" '.verdict == null or .verdict.sha != $tip' <<< "$decision")
  if [[ $start == true ]]; then say "No verdict names the tip of integration, so the suite starts there."; fi
fi
if [[ $start == true ]]; then
  choice=$(runners | jq -c -s '{runners: .[0]}' | jq -c -f "$here/runner.jq")
  say "$(jq -r .line <<< "$choice")"
  runner=$(jq -r .runner <<< "$choice")
  file=$(suite "$(tip integration)")
  if [[ -z $write ]]; then
    say "would dispatch $file on integration with the input cycle on the $runner runner"
    exit 0
  fi
  dispatch "$file" --repo "$repo" --ref integration -f cycle=true -f runner="$runner"
  say "The cycle dispatches $file on integration on the $runner runner."
fi
{% endraw %}'''

# The brake on `landing` (#5442): the check `hold the landings while main
# lags` in a merge group on `landing`. It fails while `main` lags `landing`
# past one of the limits in `.config/integration/brake.json`, so the queue
# holds the landings. The limits are provisional until a day of cycles
# gives their measure. `.config/integration/brake.bash` reads the lag in
# hours from git, and this task reads the runs of the cycle in one call on
# GH_TOKEN, the token of the `gandr-lang` App. A reading that fails fails the
# check, so the brake also holds when it cannot read the lag. GH_REPO names
# the repository.
["ci:brake"]
description = "Fail while main lags landing past the brake's limits"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
root=$(git rev-parse --show-toplevel)
source "$root/.config/integration/brake.bash"
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
gh run list --repo "$repo" --workflow ci.yml --branch integration --event workflow_dispatch --limit 100 \
  --json status,conclusion > "$scratch/runs.json"
brake=$(brake_read "$scratch/runs.json")
line=$(jq -r .line <<< "$brake")
echo "$line"
if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"; fi
[[ $(jq -r .on <<< "$brake") == false ]]
'''

# The landing rebase (#5441, `.config/landing/rebase.bash`), by hand. The
# integration cycle's job on the factory runner runs the script after `main`
# takes a fix whose patch `landing` lacks (#6683), and a failed job pages the
# workflow lane. After a refused push or a lost lease, the lane runs this
# task again. It signs with the seat's key and pushes with the seat's
# credentials. A conflict needs a rebase by hand that resolves it.
["landing:rebase"]
description = "Put each fix of main that landing lacks on the head of landing that integration took, and move only the commits above it, their merges kept, each new commit signed and each old one noted"
run = ".config/landing/rebase.bash"

# The act after a push to `landing` by hand from outside the merge queue
# (#6700, `.config/pr-stack/moved.bash`): a hold or a repair. Each open stack
# that lacks the new tip is restacked onto it, so the next lane to open finds
# a current top. A queued member is waited for, up to `TRUNK_MOVED_WAIT`
# seconds, 600 by default. A restack that stops pages the stack's seats and
# the coordinator. The landing rebase runs the same act after its own push.
["landing:moved"]
description = "Restack each open stack onto the new tip of landing after a push from outside the merge queue, paging the seats of a stack whose restack stops"
tools.jq = "1.8.1"
run = ".config/pr-stack/moved.bash"

# The fixer's mark of a repair that only `landing` carries (#6560): the tag
# `integration-repair` on commit `<commit>` of `landing`. While the verdict
# on the tip of `integration` fails, `ci:cycle` takes the tip of `landing`
# once it holds the commit, tests it, and drops the tag (`cycle.jq`). A
# commit that `origin/landing` does not hold is refused, and a later mark
# replaces an earlier one.
["integration:repair"]
description = "Mark the commit of landing that repairs integration's red verdict, so the cycle takes landing while integration is red"
usage = '''
arg "<commit>" help="the commit of landing that holds the repair"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
git fetch --quiet origin landing
commit=$(git rev-parse --verify "${usage_commit:?}^{commit}")
if ! git merge-base --is-ancestor "$commit" origin/landing; then
  echo "integration:repair: origin/landing does not hold ${commit:0:12}; land the repair first" >&2
  exit 2
fi
git push --quiet --force origin "$commit:refs/tags/integration-repair"
echo "integration:repair: the cycle takes landing once it holds ${commit:0:12}, while the tip of integration is red"
'''

# The cycle's known-red list (#5443, `ci:cycle`), read by a seat. The tests,
# the sweeps and the specification obligations run only in the integration
# cycle. A red that the list names is the fixer's, and it is not the seat's
# own. Thus a seat reads the list before it takes a red test of its worktree
# as its own. The task prints the list's issue and body, or says that the
# cycle has written no list. GH_REPO names the repository when it is set.
["ci:known-red"]
description = "Print the integration cycle's known-red list, whose reds are the fixer's"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source .config/issues/keep.bash
found=$(issue_found "integration: the known-red list")
if [[ $found == null ]]; then
  echo "the integration cycle has written no known-red list yet"
  exit 0
fi
jq -r '"the known-red list #\(.number) (\(.state | ascii_downcase)):\n\n\(.body)"' <<< "$found"
'''

# A worktree is removed when its branch lands, mechanically: nothing else
# removed one but a seat remembering to, and a `pr:watch` that dies with its
# shell never prints `pr-merged`, so landed worktrees and their build
# directories piled up until a disk filled. `pr:open`, `pr:land` and the
# `pre-start` hook run this sweep, and `pr:land` and `pr:watch` remove the
# landed pull request's own worktree, so no seat has to remember.
#
# The decisions are `.config/pr-stack/sweep.jq`'s, its cases held by
# `check:pr-stack`; this task reads the facts and acts. A branch has landed
# when Worktrunk reads it integrated into the default branch (`wt list`: the
# same commit, an ancestor, or its changes already there, which holds a
# branch whose server copy a restack moved) and the head Worktrunk read beside
# that reason is off origin/main's first-parent line: the merge queue lands a
# branch as a merge's second parent, while a branch cut from main and not yet
# committed to sits on that line. Both halves come from the one `wt list`
# snapshot (#2299): judged across two reads, a branch whose first commit fell
# between them read integrated at main's tip and off the line at its commit,
# and its live worktree went. Worktrunk misses a branch the queue landed
# through a rebase that resolved a conflict. The patches changed. Such a
# branch has landed when each commit `git cherry` lists has its subject on
# the trunk, `origin/<trunk>` of `.config/pr-stack/trunk.bash` (#6183): a
# branch merged into `landing` lands there before the integration cycle
# carries it to main. It has also landed when one merged pull request of
# the branch holds each subject the trunk lacks. The sweep reads those pull
# requests for all its branches in one query, and the common git directory
# keeps each answer (`merged_pulls`, #5839). The worktree goes by `wt remove
# -D` (#4227). A fast-forward can carry an equal patch of each commit under
# a new hash (#5030). `git cherry` then lists no `+` line. The branch has
# landed when `git rev-list origin/<trunk>..<head>` counts above zero. That
# worktree goes by `wt remove -D` too.
# A worktree whose head is no longer the judged
# one is kept, and the head is read once more just before `wt remove`. A
# landed branch's worktree goes by `wt remove --foreground`, which deletes the
# branch as merged and refuses a dirty or otherwise unsafe tree; the sweep
# makes no safety check of its own, prints a refusal and keeps that tree. The
# primary worktree, the caller's own and `wip/` branches stay, and so does a
# worktree whose git directory holds the mark of a live `pr:watch`
# (`gandr-watch-<pid>`, #3798): the watch runs its merge steps there once
# the branch lands, and removes the tree itself after them. A
# scratch worktree (`restack`'s and the mutation lanes', named
# `gandr-scratch-<pid>.`) goes once its process is gone, and an unnamed
# detached one under a temporary directory once unchanged for 4 hours. A
# kept worktree no build touched within the 4-hour claim window loses its
# `incremental` directories, the caches its next build writes again, and the
# sweep prints its `target/` size before and after (#4221). A clean worktree
# with no commit, no index change and no build for 24 hours, and no landing,
# is released: `git worktree remove` takes the tree and its build directory,
# and its branch stays, or for a detached head with commits off the trunk the
# branch `attic/<directory>` (#6183). A dirty one stays for its seat. Then
# `git worktree prune`, and Worktrunk's trash (`.git/wt/trash`), whose
# background deletes die with the shell that started them, is emptied.
#
# With `--guard` (`pr:open`, `pre-start`) the task refuses when the free
# space left is under 150 GB, naming the largest build directories.
["wt:sweep"]
description = "Remove this clone's landed worktrees and leaked scratch, and with --guard refuse under 150 GB free"
tools.jq = "1.8.1"
usage = '''
flag "--guard" help="refuse when the free space after the sweep is under 150 GB"
flag "--dry-run" help="print each worktree's decision and act on none"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
floor_gb=150
command -v wt > /dev/null || { echo "wt:sweep needs Worktrunk's wt on PATH" >&2; exit 2; }
here=$(realpath "$(git rev-parse --show-toplevel)")
common=$(git rev-parse --path-format=absolute --git-common-dir)
source .config/pr-stack/trunk.bash
trunk_ref=origin/$trunk
git fetch --quiet origin "$trunk" main || echo "wt:sweep: fetching $trunk and main failed; sweeping against the last fetch" >&2
# Worktrunk reads integration into main, so a branch cut from either line and
# not yet committed to sits on one of their first-parent lines.
declare -A first_parent=()
while IFS= read -r commit; do first_parent[$commit]=1; done < <(git rev-list --first-parent "$trunk_ref" origin/main)
# A branch Worktrunk reads unmerged is judged landed by the subjects the
# trunk gains after its fork (#4227, #5118): the queue's merge carries the
# pull request's title, and its second parent the branch's commits as the
# queue rebased them (`.config/pr-stack/sweep.bash`).
source .config/pr-stack/sweep.bash
# The branches the remote still holds, read once over git, which spends no
# GitHub API budget. A merged pull request's branch is deleted with it, and a
# branch never pushed has no pull request, so only a branch that tracked a
# remote branch now gone is asked about over the API: every seat's sweep on
# a host asking once a kept worktree spent the read budget (2026-11-04).
declare -A on_remote=()
remote_read=true
if heads=$(git ls-remote --heads origin 2> /dev/null); then
  while read -r _ ref; do on_remote[${ref#refs/heads/}]=1; done <<< "$heads"
else
  remote_read=false
  echo "wt:sweep: listing origin's branches failed; no pull request is read this sweep" >&2
fi
# The integration reason and the head it was judged at, from one snapshot; the
# head leads its line, as it is never empty and a tab-separated read
# collapses an empty field in the middle.
declare -A integrated=() judged=()
while IFS=$'\t' read -r tree_path sha reason; do
  key=$(realpath "$tree_path" 2> /dev/null || printf '%s' "$tree_path")
  integrated[$key]=$reason
  judged[$key]=$sha
done < <(wt list --format=json | jq -r '.items[] | select(.worktree != null and .worktree.path != null) | [.worktree.path, .head.sha, (.default_branch.integration.reason // "")] | @tsv')
tmp_roots=()
for root in "${TMPDIR:-/tmp}" /tmp /var/folders; do
  [[ -d "$root" ]] || continue
  tmp_roots+=("${root%/}/" "$(realpath "$root")/")
done
under_tmp() {
  local root
  for root in "${tmp_roots[@]}"; do [[ "$1" == "$root"* ]] && return 0; done
  return 1
}
# One fact line per worktree, then the decisions; the primary is listed
# first by Git. `asked` holds `<branch> <head>` for each branch whose merged
# pull requests the decision needs, read in one pass after the listing.
facts=()
kept=()
pruned=()
asked=()
epoch=$(date +%s)
# The directories live processes work in: a seat's shell stays in its lane's
# tree while it builds in another, so a tree one of them works in is never
# stale (#6183). Without `/proc` no tree reads stale.
cwds=()
proc_read=false
if [[ -d /proc/self ]]; then
  proc_read=true
  for link in /proc/[0-9]*/cwd; do cwds+=("$(readlink "$link" 2> /dev/null || true)"); done
fi
in_use() {
  local dir
  for dir in "${cwds[@]}"; do [[ $dir == "$1" || $dir == "$1"/* ]] && return 0; done
  return 1
}
tree() {
  local merged=false moved=false scratch=null holder=null alive=false young=false watched=null commits=null idle=false ahead=null stale=false dirty=null gitdir key mark
  [[ -n "$path" ]] || return 0
  if [[ "$flag" == prunable ]]; then pruned+=("pruned $path${branch:+ ($branch)}: its directory is gone"); return 0; fi
  if [[ -n "$flag" ]]; then kept+=("kept $path${branch:+ ($branch)}: $flag"); return 0; fi
  key=$(realpath "$path")
  if [[ -n "$branch" && -n "${integrated[$key]:-}" && -z "${first_parent[${judged[$key]:-none}]:-}" ]]; then merged=true; fi
  if [[ -n "${judged[$key]:-}" && "$head" != "${judged[$key]}" ]]; then moved=true; fi
  # A branch Worktrunk reads unmerged. The `+` lines of `git cherry` are
  # read by subject. `ahead` counts commits not on the trunk (#5030).
  # Merged pull requests are asked about when the trunk lacks one subject.
  if [[ -n "$branch" && $merged == false && $primary == false && $branch != wip/* ]]; then
    commits=$(own_commits "$trunk_ref" "$head")
    ahead=$(git rev-list --count "$trunk_ref..$head")
    if jq -e 'any(.[]; .on_trunk | not)' <<< "$commits" > /dev/null \
      && $remote_read && [[ -z ${on_remote[$branch]:-} ]] && git config --get "branch.$branch.remote" > /dev/null; then
      asked+=("$branch" "$head")
    fi
  fi
  gitdir=$(sed -n 's/^gitdir: //p' "$path/.git" 2> /dev/null) || gitdir=
  # A live `pr:watch` marks the worktree it runs in (#3798).
  if [[ -n "$gitdir" ]]; then
    for mark in "$gitdir"/gandr-watch-*; do
      if [[ ${mark##*/gandr-watch-} =~ ^[0-9]+$ ]] && kill -0 "${mark##*/gandr-watch-}" 2> /dev/null; then
        watched=${mark##*/gandr-watch-}
        break
      fi
    done
  fi
  if [[ "$path" =~ /gandr-scratch-([0-9]+)\. ]] || { [[ -z "$branch" ]] && under_tmp "$path"; }; then
    if [[ "$path" =~ /gandr-scratch-([0-9]+)\. ]]; then
      holder=${BASH_REMATCH[1]}
      if kill -0 "$holder" 2> /dev/null; then alive=true; fi
    fi
    if [[ -n "$gitdir" && -n $(find "$gitdir" -maxdepth 1 -name index -mmin -240 2> /dev/null) ]]; then young=true; fi
    scratch=$(jq -nc --argjson holder "$holder" --argjson alive "$alive" --argjson young "$young" '{holder: $holder, alive: $alive, young: $young}')
  fi
  # Idle: the tree holds `incremental` caches and no build wrote one within
  # the claim window.
  if [[ -d "$path/target" && -n $(find "$path/target" -mindepth 2 -maxdepth 3 -type d -name incremental -print -quit 2> /dev/null) \
    && -z $(find "$path/target" -mindepth 3 -maxdepth 4 -path '*/incremental/*' -mmin -240 -print -quit 2> /dev/null) ]]; then
    idle=true
  fi
  # Stale: no commit at the head, no change to the index or `HEAD` in its git
  # directory, and no build under `target/` for 24 hours (#6183). A fresh
  # `wt switch` writes both files, so a tree made and not yet built is not
  # stale. Read only for a tree the sweep may release.
  if [[ $primary == false && $key != "$here" && $watched == null && $scratch == null && -n "$gitdir" ]] && $proc_read && ! in_use "$key" \
    && (($(git -C "$path" log -1 --format=%ct HEAD 2> /dev/null || echo "$epoch") < epoch - 86400)) \
    && [[ -z $(find "$gitdir" -maxdepth 1 \( -name index -o -name HEAD \) -mmin -1440 -print -quit 2> /dev/null) ]] \
    && [[ ! -d "$path/target" || -z $(find "$path/target" -maxdepth 4 -mmin -1440 -print -quit 2> /dev/null) ]]; then
    stale=true
    if [[ -n $(git -C "$path" status --porcelain 2> /dev/null) ]]; then dirty=true; else dirty=false; fi
    if [[ -z "$branch" ]]; then ahead=$(git rev-list --count "$trunk_ref..$head"); fi
  fi
  facts+=("$(jq -nc --arg path "$path" --arg branch "$branch" --argjson primary "$primary" \
    --argjson cwd "$([[ $key == "$here" ]] && echo true || echo false)" \
    --argjson merged "$merged" --argjson moved "$moved" --argjson scratch "$scratch" --argjson watched "$watched" \
    --slurpfile commits <(printf '%s\n' "$commits") --argjson ahead "$ahead" --argjson idle "$idle" --argjson stale "$stale" --argjson dirty "$dirty" \
    '{path: $path, branch: (if $branch == "" then null else $branch end), primary: $primary, cwd: $cwd, merged: $merged, moved: $moved, scratch: $scratch, watched: $watched, commits: $commits[0], ahead: $ahead, pulls: null, idle: $idle, stale: $stale, dirty: $dirty}')")
}
# Delete an idle worktree's `incremental` caches, its `target/` measured
# before and after. A clone shares its blocks with the primary worktree's
# (`wt:warm`), so the apparent size overstates the disk freed, which the
# free space before and after gives once the filesystem commits the delete.
clear_incremental() {
  local tree=$1 label=$2 before after free_before free_after
  local -a caches=()
  mapfile -t caches < <(find "$tree/target" -mindepth 2 -maxdepth 3 -type d -name incremental 2> /dev/null)
  (( ${#caches[@]} > 0 )) || return 0
  before=$(du -sk "$tree/target" | awk '{ print $1 }')
  free_before=$(df -Pk "$tree" | awk 'NR == 2 { print $4 }')
  rm -rf "${caches[@]}"
  after=$(du -sk "$tree/target" | awk '{ print $1 }')
  sync -f "$tree" 2> /dev/null || sync
  free_after=$(df -Pk "$tree" | awk 'NR == 2 { print $4 }')
  printf 'cleared %s: idle for 4 hours; target/ %d GB, %d GB after its incremental caches; %d GB of disk freed\n' \
    "$label" $((before / 1048576)) $((after / 1048576)) $(((free_after - free_before) / 1048576))
}
path= head= branch= flag= primary=true
while IFS= read -r line; do
  case "$line" in
    "worktree "*) path=${line#worktree } ;;
    "HEAD "*) head=${line#HEAD } ;;
    "branch "*) branch=${line#branch refs/heads/} ;;
    locked*) flag="locked" ;;
    prunable*) flag=prunable ;;
    "")
      tree
      if [[ -n "$path" ]]; then primary=false; fi
      path= head= branch= flag=
      ;;
  esac
done < <(git worktree list --porcelain; echo)
# The merged pull requests of every branch asked about, in one reading that
# makes at most one call (#5839). Each answer goes into its branch's facts.
if (( ${#asked[@]} > 0 )); then
  answers=$(merged_pulls "$common/gandr-sweep" "${asked[@]}")
  mapfile -t facts < <(printf '%s\n' "${facts[@]}" | pulls_into_facts "$answers")
fi
removed=0
dry_run=${usage_dry_run:-false}
# A detached worktree's branch reads `-`: a tab field cannot be empty.
while IFS=$'\t' read -r action path branch reason clear attic; do
  if [[ "$branch" == - ]]; then branch=; fi
  if [[ "$attic" == - ]]; then attic=; fi
  label="$path${branch:+ ($branch)}"
  if [[ "$dry_run" == true ]]; then
    printf '%s %s: %s%s\n' "$action" "$label" "$reason" "${attic:+; its head stays as $attic}"
    if [[ "$clear" == true ]]; then printf 'clear %s: idle for 4 hours, its incremental caches\n' "$label"; fi
    continue
  fi
  case "$action" in
    remove | delete)
      judged_head=${judged[$(realpath "$path")]:-}
      delete=()
      if [[ $action == delete ]]; then delete=(--force-delete); fi
      if now=$(git -C "$path" rev-parse HEAD 2> /dev/null) && [[ "$now" != "$judged_head" ]]; then
        kept+=("kept $label: $reason, but its head moved to ${now:0:9} after it was judged at ${judged_head:0:9}")
      elif out=$(wt remove --foreground --yes "${delete[@]}" "$path" 2>&1); then
        echo "removed $label: $reason"
        removed=$((removed + 1))
      else
        kept+=("kept $label: $reason, but wt remove refused: ${out##*$'\n'}")
      fi
      ;;
    release)
      # `git worktree remove` refuses a tree with changes; the branch stays.
      if [[ -n "$attic" ]] && ! git branch "$attic" "$(git -C "$path" rev-parse HEAD)" 2> /dev/null; then
        kept+=("kept $label: $reason, but the branch $attic could not keep its head")
      elif out=$(git worktree remove "$path" 2>&1); then
        echo "released $label: $reason${attic:+; its head stays as $attic}"
        removed=$((removed + 1))
      else
        kept+=("kept $label: $reason, but git worktree remove refused: ${out##*$'\n'}")
      fi
      ;;
    force)
      if git worktree remove --force "$path" 2> /dev/null || { [[ ! -e "$path/.git" ]] && rm -rf "$path"; }; then
        echo "removed $label: $reason"
        removed=$((removed + 1))
        if [[ "$path" =~ ^(.*/gandr-scratch-[0-9]+\.[^/]+)/ ]]; then rmdir "${BASH_REMATCH[1]}" 2> /dev/null || true; fi
      else
        kept+=("kept $label: $reason, but git worktree remove failed")
      fi
      ;;
    *)
      kept+=("kept $label: $reason")
      if [[ "$clear" == true ]]; then clear_incremental "$path" "$label"; fi
      ;;
  esac
done < <(printf '%s\n' "${facts[@]}" | jq -s -f .config/pr-stack/sweep.jq | jq -r '.[] | [.action, .path, (.branch // "-"), .reason, (.clear // false), (.attic // "-")] | @tsv')
if (( ${#kept[@]} > 0 )); then printf '%s\n' "${kept[@]}"; fi
[[ "$dry_run" != true ]] || exit 0
git worktree prune
if (( ${#pruned[@]} > 0 )); then printf '%s\n' "${pruned[@]}"; fi
trash="$common/wt/trash"
if [[ -d "$trash" ]] && [[ -n $(find "$trash" -mindepth 1 -maxdepth 1 -print -quit) ]]; then
  find "$trash" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2> /dev/null || true
  echo "emptied $trash"
fi
free_gb=$(( $(df -Pk "$common" | awk 'NR == 2 { print $4 }') / 1048576 ))
echo "wt:sweep removed $removed worktrees; ${free_gb} GB free"
if [[ "${usage_guard:-false}" == true ]] && (( free_gb < floor_gb )); then
  echo "refused: ${free_gb} GB free is under the ${floor_gb} GB floor; the largest build directories:" >&2
  git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r tree; do
    if [[ -d "$tree/target" ]]; then du -sk "$tree/target"; fi
  done | sort -rn | awk 'NR <= 10 { printf "  %d GB  %s\n", $1 / 1048576, $2 }' >&2
  exit 1
fi
{% endraw %}'''

# Landing is transactional (#2539): no branch outlives its unit unless it is
# named `wip/<name>` and an open issue names its head. `branches:sweep`
# prints, for the repository it runs in, three lists: the remote branches
# no open pull request accounts for, the local ones likewise with the
# worktree holding each, and the `wip/` branches no open issue names. The
# trunk and the merge queue's own branches are never listed. It prints and
# never deletes, and exits 0: the session close-out deletes from its output
# (`wt remove`, `git push --delete`). The landing watcher deletes a landed
# remote head no open pull request uses on its own (#6185,
# `.config/pr-stack/landed-heads.jq`), so this list holds the rest. The
# decisions are `.config/pr-stack/branches.jq`'s, its cases held by
# `check:pr-stack`; the remote is read live (`git ls-remote`), never from
# this clone's stale remote-tracking refs. `--remote` prints the remote's
# two lists alone, the part one host's run answers for every host.
["branches:sweep"]
description = "List the branches no open pull request or wip/ issue accounts for; delete none"
tools.jq = "1.8.1"
usage = '''
flag "--remote" help="list only the remote's branches"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source "$(git rev-parse --show-toplevel)/.config/gh/repo.bash"
repo=$(repo_name)
source .config/pr-stack/trunk.bash
kept=$(printf '%s\n' "${kept_branches[@]}" | jq -R . | jq -cs .)
remote=$(git ls-remote --heads origin | awk '{ sub("^refs/heads/", "", $2); print $2 }' | jq -R . | jq -cs .)
local_branches='[]'
if [[ ${usage_remote:-false} != true ]]; then
  local_branches=$(
    {
      git for-each-ref refs/heads --format='%(refname:short)' | jq -R '{name: ., worktree: null}'
      git worktree list --porcelain | awk '/^worktree / { tree = substr($0, 10) } /^branch refs\/heads\// { print substr($2, 12) "\t" tree }' \
        | jq -R 'split("\t") | {name: .[0], worktree: .[1]}'
    } | jq -cs 'group_by(.name) | map({name: .[0].name, worktree: (map(.worktree | values) | first)})'
  )
fi
# The open issues' bodies hold more than the 131072 bytes that Linux allows
# in one argument, so the pulls and the issues reach jq as files (#5220).
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
gh pr list -R "$repo" --state open --limit 1000 --json headRefName --jq '[.[].headRefName]' > "$scratch/heads"
gh issue list -R "$repo" --state open --limit 5000 --json title,body --jq '[.[] | "\(.title)\n\(.body)"]' > "$scratch/issues"
reading=$(jq -n --slurpfile kept <(printf '%s\n' "$kept") --slurpfile remote <(printf '%s\n' "$remote") \
  --slurpfile local <(printf '%s\n' "$local_branches") --slurpfile heads "$scratch/heads" --slurpfile issues "$scratch/issues" \
  '{kept: $kept[0], remote: $remote[0], local: $local[0], heads: $heads[0], issues: $issues[0]}' \
  | jq -c -f .config/pr-stack/branches.jq)
list() {
  local title=$1 lines=$2
  printf '%s (%s):\n' "$title" "$(grep -c . <<< "$lines" || true)"
  [[ -z $lines ]] || sed 's/^/  /' <<< "$lines"
}
list "$repo: remote branches no open pull request accounts for" "$(jq -r '.remote[]' <<< "$reading")"
if [[ ${usage_remote:-false} != true ]]; then
  list "$repo: local branches no open pull request accounts for" \
    "$(jq -r '.local[] | .name + (if .worktree then "  (worktree " + .worktree + ")" else "" end)' <<< "$reading")"
fi
list "$repo: wip/ branches no open issue names" "$(jq -r '.wip[]' <<< "$reading")"
{% endraw %}'''

# A new worktree starts warm (`.config/wt.toml`'s `post-start`): every
# gitignored artifact of the primary worktree — the build directory, the code
# index, the extension's modules — is copied in by `wt step copy-ignored`,
# only where the filesystem clones: APFS and btrfs share the blocks until one
# side writes, while a full copy of the build directory per worktree fills a
# disk. A filesystem that cannot clone skips the copy, and the worktree's
# first build is cold. Existing files are never overwritten, so the step is
# safe to re-run. The probe that asks whether the filesystem clones is
# written outside both trees (#3222): its source in the clone's git
# directory, on the primary's filesystem, and its copy beside the worktree,
# on the worktree's, so `git add -A` in either never meets it while the copy
# runs. A copied unit that names a source of the primary would read the
# primary's files, and cargo would still judge it fresh (#5137).
# `.config/pr-stack/warm.jq` names each such unit from the dep-info lines
# that name the primary, and the step removes it. Cargo then builds it again
# in this worktree. The removal is safe to re-run, and a run that stops
# half-way leaves a unit cargo builds again. The step first records the
# commit the worktree starts from as its stack base (`record_start`, #5990),
# inside the command `wt` already runs, so no host approves a new one.
["wt:warm"]
description = "Clone the primary worktree's gitignored artifacts into this one, or skip where the filesystem cannot clone, and remove each copied unit that reads the primary's sources"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
primary=$(git worktree list --porcelain | sed -n '1s/^worktree //p')
here=$(git rev-parse --show-toplevel)
[[ "$(realpath "$primary")" != "$(realpath "$here")" ]] || exit 0
source "$here/.config/pr-stack/stack.bash"
record_start
probe=$(mktemp "$(realpath "$(git rev-parse --git-common-dir)")/wt-warm-probe.XXXXXX")
copy=$(mktemp -u "$(dirname "$here")/.wt-warm-probe.$(basename "$here").XXXXXX")
trap 'rm -f "$probe" "$copy"' EXIT
case "$(uname -s)" in
  Darwin) clone=(cp -c) ;;
  *) clone=(cp --reflink=always) ;;
esac
if ! "${clone[@]}" "$probe" "$copy" 2> /dev/null; then
  echo "wt:warm: $here's filesystem cannot clone from $primary; skipping the copy, the first build is cold"
  exit 0
fi
rm -f "$probe" "$copy"
wt step copy-ignored
[[ -d $here/target ]] || exit 0
root=$(realpath "$primary")
pattern="^# (env-dep:[^=]*=|checksum:[^ ]* file_len:[0-9]+ )$(sed 's/[][\.*^$+?(){}|]/\\&/g' <<< "$root")(/|\$)"
named=$(grep -rE --include='*.d' "$pattern" "$here/target") || [[ $? == 1 ]]
listed=$(jq -R -s --arg root "$root" '{root: $root, named: [split("\n")[] | select(. != "")]}' <<< "$named" \
  | jq -f "$here/.config/pr-stack/warm.jq" | jq -r '.[]')
removed=0
if [[ -n $listed ]]; then
  while IFS= read -r unit; do
    rm -rf "$unit"
    removed=$((removed + 1))
  done <<< "$listed"
fi
echo "wt:warm: removed $removed copied units that read $primary's sources"
'''

# A unit issue is the brief, and work starts only on one that carries its
# sections (#2532, `units.md` § units-issue). `unit:check <n>` reads the
# issue's body and prints each section missing, empty or malformed, exiting 1
# on any; the rule is `.config/claims/unit.jq`, reading the sections through
# `sections.jq` as `pr:open` does, its cases held by `check:claims`. The
# vault's dispatch script runs it on the issue a prompt names and refuses to
# launch on a failure. The web files a unit through the form
# `.github/ISSUE_TEMPLATE/unit.yml`, a field per section, and the issues
# workflow (#3113) runs the same reading on every opened or edited issue,
# labelling `status:unsectioned` while it fails.
#
# A `## Sources` row naming a vault page by its filename (#2793) is read
# against the vault checkout `$XDG_CONFIG_HOME/gandr/references` names
# (`.config/references/vault.bash`, the rule `.config/claims/vault.jq`): the
# page's `vault:<mint>` is shown beside its name, and a filename no vault page
# carries is refused, a wrong name being a wrong source. A filename the tree
# carries is the tree's. Without a vault checkout, as in CI, the lines are
# read for their shape alone.
#
# The term map (#3158): a unit whose title or prose meets a row of
# `.config/references/terms.toml` is refused while its `## Sources` names
# none of the vault pages, tree paths or issues that row says own the term
# (`.config/claims/terms.jq`). A row whose role is `not read` names
# it. The two listings find what a seat searches for; the map finds what it
# did not know to search for. An epic or a `collector` is not read.
#
# The motivating sources (#5855): an epic may carry `## Motivating sources`,
# the sources of the frame its units partition. A unit is refused while its
# `## Sources` cites none of the section's keys for an epic the body names as
# its own (`.config/claims/motivating.jq`). A key is cited as the term map
# cites an owner, so a `not read` row cites it too. An epic or a `collector`
# is not read.
#
# The claim of a design page (#6569): a primary `## Sources` row naming a
# vault page whose status is `design` or `partly` states `builds:`,
# `saves: <what>, read by <instrument>` and `decides:` in its third cell
# (`.config/claims/claim.jq`, the calls `.config/claims/claim.bash`). A row
# lacking a part is refused. The rule stops no unit in flight: an issue that
# carried `shape:signed` when the rule landed gets a note for each row, and
# no refusal, while its `## Sources` is as it was then. Without the vault's
# statuses, as in CI, no row is read. An epic or a `collector` is not read.
#
# The identifiers (#7019): a unit is refused while its `## Sources` names
# neither a design page that names one of its identifiers nor a design page
# that such a page links (`.config/claims/identifiers.jq`, the reads
# `.config/claims/identifiers.bash`). The identifiers are the unit's number,
# each number of its `from:` line and of its epic, each ledger row that it
# names in backquotes and each crate that it names. A page names a number or
# a row in a level-two section, and the links of that section count; a crate
# gives its own page alone. The design pages are the vault's pages under
# `docs/programme/` and `plans/`. A `not read` row names a page too. A unit
# in flight gets a note for each page, as for the claim of a design page. A
# host with no vault, as in CI, prints a note and refuses nothing. An epic
# or a `collector` is not read.
#
# The dependencies (#2902): an issue is GitHub-`blocked by` each issue its
# `## After` lists, and an epic by each open sub-issue too; the plan is
# `.config/claims/deps.jq`, the calls `.config/claims/deps.bash`. Each one
# missing is refused, naming `--fix`, which sets it (idempotent) and leaves
# the rest of the check as it was. A dependency set on GitHub that neither
# names is printed as a note, not refused: the section is the record. An
# open epic the body names as its own (`Advances #n`, `Part of #n` or
# `from: #n`, #3398) is `blocked by` the issue in turn, so the epic closes
# only once the issue does; one that is not is refused, `--fix` setting it.
# The unit's parent epic is `blocked by` each issue its `## Embedding owes`
# names (#3964), so an embedding epic closes on its operation set; a unit
# owing operations under no epic is refused.
["unit:check"]
description = "Refuse a unit issue missing a section work needs, or a dependency its ## After names"
usage = '''
arg "<issue>" help="the issue number"
flag "--fix" help="set each GitHub dependency the issue owes before checking"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
issue=${usage_issue:?}
[[ $issue =~ ^[0-9]+$ ]] || { echo "unit:check takes an issue number, not \`$issue\`" >&2; exit 2; }
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$root/.config/references/vault.bash"
source "$claims/claim.bash"
source "$claims/identifiers.bash"
concerns=$(sqlite3 -json :memory: ".read $root/ledger/concerns.sql" 'SELECT id, issue FROM concern ORDER BY id;')
source "$claims/deps.bash"
# gh fills `{owner}` and `{repo}` from the checkout's remote, so the
# repository's name costs no read.
repo='{owner}/{repo}'
# The issue, its dependencies, its parent and its sub-issues in one query
# (#5709). The issues it names are read in a second query, only when one
# must be read.
read=$(deps_issues "$repo" body "$issue")
mine=$(jq -c --arg n "$issue" '.[$n] // empty' <<< "$read")
[[ -n $mine ]] || { echo "unit:check: #$issue is no issue" >&2; exit 2; }
issued=$(jq -c '{number, title, labels, body}' <<< "$mine")
body=$(jq -r .body <<< "$issued")
cutoff=$(jq -R -s -f "$claims/cutoff.jq" "$root/.config/references/window.toml")
findings=$(jq -R -s -r -L "$claims" --argjson concerns "$concerns" --argjson labels "$(jq -c .labels <<< "$issued")" --argjson cutoff "$cutoff" --argjson number "$issue" -f "$claims/unit.jq" <<< "$body")
if ! jq -e '.labels | index("kind:epic") or index("collector")' <<< "$issued" > /dev/null; then
  terms=$(jq -n --slurpfile issued <(printf '%s\n' "$issued") --slurpfile terms <(yq -o json '.term' "$root/.config/references/terms.toml") \
    '{title: $issued[0].title, body: $issued[0].body, terms: $terms[0]}' | jq -r -L "$claims" -f "$claims/terms.jq")
  findings=$(printf '%s\n%s\n' "$findings" "$terms" | awk 'NF')
  claimed=$(claim_check "$body" null)
  if [[ -n $claimed ]] && jq -e '.labels | index("shape:signed")' <<< "$issued" > /dev/null; then
    claimed=$(claim_check "$body" "$(claim_before "$issue" claim.jq)")
  fi
  # The design pages that the unit's identifiers name (#7019).
  above=$(jq -c '.parent // null' <<< "$mine")
  identified=$(identifiers_check "$body" "$issue" "$above" null)
  if awk '!/^note: / && NF { found = 1 } END { exit !found }' <<< "$identified" \
    && jq -e '.labels | index("shape:signed")' <<< "$issued" > /dev/null; then
    identified=$(identifiers_check "$body" "$issue" "$above" "$(claim_before "$issue" identifiers.jq)")
  fi
  noted=$(printf '%s\n%s\n' "$claimed" "$identified" | awk '/^note: /')
  findings=$(printf '%s\n%s\n%s\n' "$findings" "$(awk '!/^note: /' <<< "$claimed")" "$(awk '!/^note: /' <<< "$identified")" | awk 'NF')
fi
subs='[]'
if jq -e '.labels | index("kind:epic")' <<< "$issued" > /dev/null; then
  subs=$(jq -c .sub_issues <<< "$mine")
fi
plan=$(jq -n --argjson issued "$issued" --argjson blocked "$(jq -c .blocked_by <<< "$mine")" --argjson subs "$subs" \
  '$issued + {blocked_by: $blocked, sub_issues: $subs}' | jq -r -L "$claims" -f "$claims/deps.jq")
# Each epic the body names as its own and the issue does not block yet. Each
# operation the unit's `## Embedding owes` names (#3964) blocks the unit's
# epic, so the epic closes on its operation set. The owed issue keeps its own
# parent: only the `blocked by` is set.
mapfile -t named < <(jq -R -s -r -L "$claims" 'include "sections"; epic_refs[]' <<< "$body" \
  | jq -r --argjson mine "$mine" 'select(. != $mine.number and (IN($mine.blocking[].number) | not))' | sort -nu)
owed=$(jq -R -s -r -L "$claims" 'include "sections"; (owes // {numbers: []}).numbers[]' <<< "$body")
parent=$(jq -r '.parent // empty' <<< "$mine")
# Every epic the body names as its own, for its `## Motivating sources`
# (#5855). An epic or a `collector` owes none.
refs=()
if ! jq -e '.labels | index("kind:epic") or index("collector")' <<< "$issued" > /dev/null; then
  mapfile -t refs < <(jq -R -s -r -L "$claims" 'include "sections"; epic_refs[]' <<< "$body" \
    | jq -r --argjson mine "$mine" 'select(. != $mine.number)' | sort -nu)
fi
# The second query: the named epics, with their bodies when the unit owes
# their motivating sources, the parent when the body owes operations, and
# under `--fix` each issue whose REST id a write takes.
wanted=("${named[@]}" "${refs[@]}")
if [[ -n $owed && -n $parent ]]; then wanted+=("$parent"); fi
if [[ ${usage_fix:-false} == true ]]; then
  mapfile -t -O "${#wanted[@]}" wanted < <(awk -F'\t' '$1 == "set" { print $2 }' <<< "$plan")
  if [[ -n $owed && -n $parent ]]; then mapfile -t -O "${#wanted[@]}" wanted <<< "$owed"; fi
fi
fields=-
if (( ${#refs[@]} > 0 )); then fields=body; fi
others='{}'
if (( ${#wanted[@]} > 0 )); then others=$(deps_issues "$repo" "$fields" "${wanted[@]}"); fi
if (( ${#refs[@]} > 0 )); then
  motivating=$(jq -c --rawfile body <(printf '%s' "$body") --slurpfile refs <(printf '%s\n' "${refs[@]}" | jq -s -c .) \
    '{body: $body, epics: [.[] | select((.number | IN($refs[0][])) and (.labels | index("kind:epic") != null)) | {number, body}]}' <<< "$others" \
    | jq -r -L "$claims" -f "$claims/motivating.jq")
  findings=$(printf '%s\n%s\n' "$findings" "$motivating" | awk 'NF')
fi
id_of() { jq -r --arg n "$1" '.[$n].id // empty' <<< "$others"; }
while IFS=$'\t' read -r verb blocker why; do
  case "$verb" in
    set)
      if [[ ${usage_fix:-false} == true ]]; then
        deps_set_block "$repo" "$issue" "$blocker" "$(id_of "$blocker")"
      else
        findings=$(printf '%s\n%s\n' "$findings" "#$blocker is not set as a \`blocked by\` dependency on GitHub, and $why: run \`mise run unit:check --fix $issue\`" | awk 'NF')
      fi
      ;;
    extra) echo "note: #$issue is blocked by #$blocker on GitHub, and its \`## After\` does not list it" ;;
  esac
done <<< "$plan"
for epic in "${named[@]}"; do
  jq -e --arg n "$epic" '.[$n] | . != null and .state == "open" and (.labels | index("kind:epic") != null)' <<< "$others" > /dev/null || continue
  if [[ ${usage_fix:-false} == true ]]; then
    deps_set_block "$repo" "$epic" "$issue" "$(jq -r .id <<< "$mine")"
  else
    findings=$(printf '%s\n%s\n' "$findings" "#$epic, the epic the body names, is not set \`blocked by\` #$issue on GitHub, so it would close with #$issue open: run \`mise run unit:check --fix $issue\`" | awk 'NF')
  fi
done
if [[ -n $owed ]]; then
  if [[ -z $parent ]]; then
    findings=$(printf '%s\n%s\n' "$findings" "#$issue owes operations in \`## Embedding owes\` and sits under no epic: link it under its programme's epic, so the epic closes on its operation set" | awk 'NF')
  else
    epic_blockers=$(jq -c --arg n "$parent" '.[$n].blocked_by // []' <<< "$others")
    for n in $owed; do
      jq -e --argjson n "$n" 'any(.[]; .number == $n)' <<< "$epic_blockers" > /dev/null && continue
      if [[ ${usage_fix:-false} == true ]]; then
        deps_set_block "$repo" "$parent" "$n" "$(id_of "$n")"
      else
        findings=$(printf '%s\n%s\n' "$findings" "#$parent, the epic of #$issue, is not set \`blocked by\` #$n, an operation #$issue owes, so it would close with the operation unbuilt: run \`mise run unit:check --fix $issue\`" | awk 'NF')
      fi
    done
  fi
fi
pages=$(vault_pages)
shown=
if [[ $pages != null ]]; then
  scratch=$(mktemp -d)
  trap 'rm -rf "$scratch"' EXIT
  git -C "$root" ls-files | awk -F/ '{ print $NF }' | sort -u > "$scratch/tree"
  printf '%s\n' "$pages" > "$scratch/pages.json"
  vault=$(jq -n --rawfile body <(printf '%s' "$body") --slurpfile pages "$scratch/pages.json" --rawfile tree "$scratch/tree" '{body: $body, pages: $pages[0], tree: $tree}' \
    | jq -r -L "$claims" -f "$claims/shown.jq")
  refused=$(awk -F'\t' '$1 == "refuse" { print $2 }' <<< "$vault")
  shown=$(awk -F'\t' '$1 == "show" { print "  " $2 }' <<< "$vault")
  findings=$(printf '%s\n%s\n' "$findings" "$refused" | awk 'NF')
fi
if [[ -n ${noted:-} ]]; then printf '%s\n' "$noted" >&2; fi
if [[ -n "$findings" ]]; then
  printf 'unit check FAILED: #%s lacks what a unit issue carries (units.md § units-issue; the form is .github/ISSUE_TEMPLATE/unit.yml):\n' "$issue" >&2
  printf '%s\n' "$findings" | sed 's/^/  - /' >&2
  exit 1
fi
echo "unit check OK: #$issue carries every section a unit needs"
if [[ -n "$shown" ]]; then
  echo "its vault pages, read against the vault \$XDG_CONFIG_HOME/gandr/references names:"
  printf '%s\n' "$shown"
fi
{% endraw %}'''

# The version of the unit frame (#7018): `unit:frame` prints one digest of
# the rows that `units.md` asks of a unit, the nine axes with their questions
# and the concerns (`.config/claims/frame.bash`). A change of a row gives a
# new digest.
["unit:frame"]
description = "Print the digest of the unit frame: the reading axes, their questions and the concerns"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/frame.bash"
unit_frame "$root"
{% endraw %}'''

# The coordinator signs a unit's sections through `unit:sign <n>` (#7018). It
# adds `shape:signed` and writes one comment that holds the frame's digest
# (`unit_frame_marker`), so the sign-off records the frame that the sections
# answer. The task first runs `unit:check`, so a refused unit is not signed.
["unit:sign"]
description = "Sign a unit's sections at the frame now: shape:signed and a comment holding the frame's digest"
usage = '''
arg "<issue>" help="the issue number"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
issue=${usage_issue:?}
[[ $issue =~ ^[0-9]+$ ]] || { echo "unit:sign takes an issue number, not \`$issue\`" >&2; exit 2; }
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/frame.bash"
mise run unit:check "$issue"
frame=$(unit_frame "$root")
gh issue edit "$issue" --add-label shape:signed > /dev/null
gh issue comment "$issue" --body "$(unit_frame_marker "$frame")
The coordinator signs the sections at the unit frame \`$frame\`." > /dev/null
echo "unit:sign: #$issue signed at the frame $frame"
{% endraw %}'''

# A seat claims its own next item, in the order `tracker.md` § tracker-claims
# states, without asking (#2533). `claim:next <lane>` reads the lane's areas
# from the factory's lane table (`.config/claims/lanes.bash`, #3736), refusing a lane the table does not
# name, and reads the open issues
# once, with their bodies, and the sub-issue order of each open epic holding a
# candidate; the pick is `.config/claims/next.jq`, its cases held by
# `check:claims`. The pick is the first candidate in order, sectioned or not
# (#3134): sectioning is the claim's first obligation, so each section the
# pick lacks opens the claim as `sections due: #n — <finding>` (`unit:check`'s
# findings). The seat writes them, runs `## Try first` before `## The shape`
# is final, passes `unit:check`, and pages the coordinator `sections #n:
# <the shape's first line>` for `shape:signed`; it works on meanwhile, and
# `pr:open` refuses the landing until the label stands. A pick whose readings
# still hold the migration's `unstated` placeholder is claimed (#2955), and
# the claim opens with one `restate: `<axis>`: <question>` line per such
# axis. An issue with an open `blocked by` dependency is not picked (#2902):
# each one ranked ahead of the pick is printed on stderr as `blocked: #n by
# #a, #b`. The board's count of open blockers lags a dependency set or
# removed (#4104), so each issue the order passes over as blocked, and the
# pick, is read from GitHub, and the order taken again until every issue it
# rests on is read. An issue an open pull request names, by a working
# keyword in its body or by its number in its branch, is not picked on any
# base (#4650): GitHub links a keyword only into the default branch, so a
# stacked fix leaves its issue looking unworked. A `kind:defect` `collector` in
# the lane's areas holding an open row heads the order (#3326): it is claimed
# as the defect it is, its rows worked by the landing, and prints no section
# due, keeping its own shape. The lane's defects and refactors come next,
# then the oldest defect or refactor of any area, before any planned unit
# (#3736). Another area's performance issues and gaps come last, after the
# lane's planned units: they are another lane's planned work (#3827). Any
# other collector in the lane's areas holding an open row is
# printed first, on stderr, as `collector: #n (k open rows)` (#3111), the
# carving due. With a vault checkout, the design work that no open issue
# holds (#3401, `report:design`) is printed next, on stderr, as one line:
# `design pages: <k> units and <m> pages that no open unit names; mise run
# report:design`. A defect pick opens with `observation due: #n — mise run
# debug:refusal <Refusal> <package> <test>` (#3758), the refusal its title
# names, or `debug:test` when it names none: the observation starts in the
# debugger. It reads the pick from GitHub again and takes the order again with
# that reading, passing over a pick another run claimed meanwhile (#4660).
# It then adds `status:claimed` and writes the lane's claim marker: after any
# other lane's when its read shows the label, else alone, as a marker without
# the label holds no claim (`.config/claims/claimed.jq`, #5531). It reads the
# body once more: when another lane's marker stands first, the earlier claim
# keeps the issue, and the run takes its own marker off and claims its next
# pick. It prints the claim as `#n <title>`; `--dry-run` reads the pick again
# and prints it without claiming.
#
# One claim is in hand at a time (#3915): a lane holding a claimed issue that
# no open pull request names claims nothing, each such issue printed on
# stderr as `held: #n <title>`, and exits 1; the seat lands it or lets it go
# with `claim:release`. A claimed issue is the lane's when its claim marker
# names the lane, else when the lane's branch on origin works it, the newest
# head first, else when it is in the lane's areas (#3951): one `ls-remote`,
# and one commit read per branch working a claim with no marker. An issue the
# lane released, or a merge on its branch advanced, in the last 2 hours heads
# its order, and another lane passes it over for those 2 hours.
# No candidate prints `no claim: <lane>` and exits 1.
["claim:next"]
description = "Claim the next item in a lane's claim order"
usage = '''
arg "<lane>" help="the lane, a key of the factory's lane table"
flag "--dry-run" help="print the pick without claiming it"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
lane=${usage_lane:?}
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/lanes.bash"
table=$(lanes_file)
areas='[]'
[[ ! -r $table ]] || areas=$(yq -p toml -o json ".lane[\"$lane\"] // [] | map(\"area:\" + .)" "$table" | jq -c .)
if [[ $areas == '[]' ]]; then
  echo "claim:next: no lane \`$lane\` with an area in $table ($(lanes_keys | jq -r 'join(", ")'))" >&2
  exit 2
fi
claims=$root/.config/claims
source "$claims/deps.bash"
source "$claims/input.bash"
source "$claims/mark.bash"
source "$root/.config/issues/open.bash"
# REST throughout: the GraphQL limit, shared by every seat's watches, runs out
# within the hour, and a seat must still claim its next item. The open list
# is `open_issues`' (`.config/issues/open.bash`, #5671).
repo=${GH_REPO:-'{owner}/{repo}'}
# The board reaches jq through files, never as arguments: with its bodies it
# is past the argument limit (#2671). Each reading `next.jq` takes is a file
# here (`input.bash`, #5292).
board=$(mktemp -d)
trap 'rm -rf "$board"' EXIT
printf '%s\n' "$areas" > "$board/areas.json"
open_issues "$repo" "$board/open.json"
jq '[.[] | select(.pull_request | not) | del(.pull_request)]' "$board/open.json" > "$board/issues.json"
epics=$(jq -r --argjson areas "$areas" '[.[] | select(.labels | index("kind:epic")) | .number] as $epics
  | [.[] | select(any(.labels[]; IN($areas[])) and .parent != null) | .parent as $p | select($epics | index($p))] | map(.parent) | unique[]' "$board/issues.json")
printf '{}\n' > "$board/order.json"
for epic in $epics; do
  gh api --paginate "repos/$repo/issues/$epic/sub_issues?per_page=100" --jq '[.[].number]' | jq -s 'add // []' > "$board/children.json"
  jq --arg epic "$epic" --slurpfile children "$board/children.json" '. + {($epic): $children[0]}' "$board/order.json" > "$board/next.json"
  mv "$board/next.json" "$board/order.json"
done
concerns=$(sqlite3 -json :memory: ".read $root/ledger/concerns.sql" 'SELECT id, issue FROM concern ORDER BY id;')
yq -p toml -o json '.refusal // {} | keys' "$root/.config/debug/refusals.toml" | jq -c . > "$board/refusals.json"
gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
  --jq '[.[] | {body: (.body // ""), head: .head.ref}]' | jq -s 'add // []' > "$board/prs.json"
# Origin's branches working a claimed issue with no claim marker, each with
# its head commit's time (#3951): `next.jq` places such a claim in the lane
# its newest branch names, and with no branch in no lane (#4504).
lanes_keys > "$board/lanes.json"
unmarked=$(jq -r -L "$claims" 'include "markers";
  .[] | select((.labels | index("status:claimed")) and (.body | claim_lane) == null) | .number' "$board/issues.json" | tr '\n' ' ')
printf '[]\n' > "$board/branches.json"
if [[ -n ${unmarked// /} ]]; then
  git ls-remote --heads origin \
    | awk -v numbers="$unmarked" 'BEGIN { split(numbers, list, " "); for (i in list) wanted[list[i]] = 1 }
        { head = $2; sub(/^refs\/heads\//, "", head); count = split(head, part, "-")
          for (i = 2; i <= count; i++) if (part[i] in wanted) { print $1 "\t" head; next } }' \
    | while IFS=$'\t' read -r sha head; do
        jq -n -c --arg head "$head" --arg at "$(gh api "repos/$repo/commits/$sha" --jq .commit.committer.date)" \
          '{head: $head, at: ($at | fromdateiso8601)}'
      done | jq -s -c . > "$board/branches.json"
fi
now=$(date +%s)
printf '{}\n' > "$board/live.json"
# The pick is read from GitHub again before the claim, and once more after
# its write (#4660): the board is as old as the run, so a run that read it
# before another lane's claim landed would claim the same issue. The order is
# taken again with each reading, until the pick it gives is one already read.
# Under `status:claimed`, the write keeps another lane's claim marker standing
# before its own (`claimed.jq`), so two runs that both reread before either
# writes see the earlier claim after their writes: it keeps the issue, and
# the later run takes its marker off and its next pick. Without the label, no
# marker is live, and the write keeps none (#5531). Readings reach jq through
# files, an issue body being past the argument limit at its largest (#2671,
# #5292).
printf '{}\n' > "$board/reread.json"
claimed=false
while :; do
  lines=$(claim_input "$board" "$lane" "$now" \
    | jq -r -L "$claims" --argjson concerns "$concerns" --argjson cutoff "$(jq -R -s -f "$claims/cutoff.jq" "$root/.config/references/window.toml")" -f "$claims/next.jq")
  unread=$(jq -R -r --slurpfile live "$board/live.json" 'capture("^(blocked: #)?(?<n>[0-9]+)(\t|$)").n | select($live[0][.] == null)' <<< "$lines")
  if [[ -n $unread ]]; then
    for number in $unread; do
      deps_blocked_by "$repo" "$number" > "$board/blocked.json"
      jq -c --arg n "$number" --slurpfile read "$board/blocked.json" \
        '.[$n] = [$read[0][] | select(.state == "open") | .number]' "$board/live.json" > "$board/next.json"
      mv "$board/next.json" "$board/live.json"
    done
    continue
  fi
  number=$(awk -F '\t' '/^[0-9]+\t/ { print $1 }' <<< "$lines")
  [[ -n $number ]] || break
  if [[ $(jq --arg n "$number" 'has($n)' "$board/reread.json") == false ]]; then
    gh api "repos/$repo/issues/$number" --jq '{labels: [.labels[].name], body}' > "$board/read.json"
    jq --arg n "$number" --slurpfile read "$board/read.json" '.[$n] = $read[0]' "$board/reread.json" > "$board/next.json"
    mv "$board/next.json" "$board/reread.json"
    continue
  fi
  [[ ${usage_dry_run:-false} == false ]] || break
  gh api "repos/$repo/issues/$number" --jq '{labels: [.labels[].name], body}' \
    | jq -c --arg lane "$lane" '{lane: $lane, step: "write", labels, body}' \
    | jq -c -L "$claims" -f "$claims/claimed.jq" > "$board/marked.json"
  claim_mark "$repo" "$number" "$lane" "$board/read.json" < "$board/marked.json"
  if [[ $claim_kept == true ]]; then
    claimed=true
    break
  fi
  # Another lane's claim stands before this one: it keeps the issue.
  # `claim_mark` took this run's marker off, when its write left one, and the
  # order passes over the issue on the reading.
  echo "claim:next: #$number holds another lane's earlier claim; taking the next pick" >&2
  jq --arg n "$number" --slurpfile read "$board/read.json" '.[$n] = $read[0]' "$board/reread.json" > "$board/next.json"
  mv "$board/next.json" "$board/reread.json"
done
# A claim with no marker and no branch names no lane (#4504): no lane holds
# it, and the lane working it writes its marker.
awk '/^unattributed: / { print; print "claim:next: " $2 " names no lane; the lane working it writes `<!-- claim: lane=<lane> -->` in its body" }' <<< "$lines" >&2
# A held claim, one no open pull request names, is reported and never stops
# the lane's next claim (`next.jq`): the seat opens it when it can.
awk '/^held: / { print; print "claim:next: " $2 " has no open pull request yet; open it with `pr:open` when its gate passes" }' <<< "$lines" >&2
awk '/^collector: /' <<< "$lines" >&2
source "$claims/design.bash"
design=$(design_report "$board/issues.json")
if [[ -n $design ]]; then
  read -r units pages < <(awk '/ unit [^ ]+: / { u++; next } { p++ } END { print u + 0, p + 0 }' <<< "$design")
  echo "design pages: $units units and $pages pages that no open unit names; mise run report:design" >&2
fi
while read -r _ issue; do
  echo "blocked: $issue by $(jq -r --arg n "${issue#\#}" '.[$n] | map("#\(.)") | join(", ")' "$board/live.json")" >&2
done < <(awk '/^blocked: /' <<< "$lines")
awk '/^(observation due|sections due|restate): /' <<< "$lines"
source "$claims/pick.bash"
pick=$(claim_pick <<< "$lines")
if [[ -z "$pick" ]]; then
  echo "no claim: $lane" >&2
  exit 1
fi
IFS=$'\t' read -r number bucket title <<< "$pick"
if [[ $claimed == true ]]; then
  echo "claim:next: claimed ($bucket)" >&2
else
  echo "claim:next: dry run, nothing claimed ($bucket)" >&2
fi
printf '#%s %s\n' "$number" "$title"
'''

# A seat lets its own claim go (#3915). `claim:release <lane> <n>` takes
# `status:claimed` off only when that lane holds the claim. It writes the
# lane's release marker in its body (`.config/claims/markers.jq`).
# `claim:next <lane>` offers it first for 2 hours. Another lane passes it over.
# A seat releases a blocked unit. It returns another unit with findings.
# `--forgo` gives the continuation up (#4104): the body keeps no
# marker, so the next `claim:next` walks the order, as after a ruling that
# names another unit first.
["claim:release"]
description = "Let a lane's claim go, keeping the continuation for the lane unless it is forgone"
usage = '''
arg "<lane>" help="the lane, a key of the factory's lane table"
arg "<issue>" help="the claimed issue's number"
flag "--forgo" help="give the lane's continuation up, so claim:next walks the order"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
lane=${usage_lane:?}
number=${usage_issue:?}
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/lanes.bash"
if ! lanes_has "$lane"; then
  echo "claim:release: no lane \`$lane\` in $(lanes_file)" >&2
  exit 2
fi
repo=${GH_REPO:-'{owner}/{repo}'}
issue=$(gh api "repos/$repo/issues/$number" --jq '{number, state, labels: [.labels[].name], body: (.body // "")}')
decision=$(jq -c --arg lane "$lane" '{step: "release", lane: $lane, issue: .}' <<< "$issue" \
  | jq -c -L "$root/.config/claims" -f "$root/.config/claims/taken.jq")
case $(jq -r .verdict <<< "$decision") in
  release) ;;
  refused) jq -r .line <<< "$decision" >&2; exit 1 ;;
  *) echo "claim:release: invalid claim decision" >&2; exit 1 ;;
esac
gh api -X DELETE "repos/$repo/issues/$number/labels/status:claimed" > /dev/null
forgo=${usage_forgo:-false}
jq -c -L "$root/.config/claims" --arg lane "$lane" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson forgo "$forgo" \
  'include "markers"; {body: (.body | if $forgo then unmarked else marked(released_marker($lane; $at)) end)}' <<< "$issue" \
  | gh api -X PATCH "repos/$repo/issues/$number" --input - > /dev/null
if [[ $forgo == true ]]; then
  echo "claim:release: released #$number to the order" >&2
else
  echo "claim:release: released #$number to $lane for 2 hours" >&2
fi
'''

# A seat edits an issue body it holds (#6210): `issue:edit <n> <body>` writes
# the body file over issue n's body and keeps each claim or release marker the
# old body carried and the file lacks (`.config/claims/claimed.jq`'s `edit`).
# A seat that writes a body from its own draft with `gh issue edit` drops the
# lane's marker, and `claim:take` then refuses the issue until the lane's next
# gate writes it back. One read and one write.
["issue:edit"]
description = "Write a body over an issue's body, keeping the claim and release markers it carried"
usage = '''
arg "<issue>" help="the issue's number"
arg "<body>" help="the body file"
'''
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
number=${usage_issue:?}
root=$(git rev-parse --show-toplevel)
repo=${GH_REPO:-'{owner}/{repo}'}
old=$(gh api "repos/$repo/issues/$number" --jq '.body // ""')
jq -n -c -L "$root/.config/claims" --rawfile body "${usage_body:?}" --arg old "$old" '{step: "edit", old: $old, body: $body}' \
  | jq -c -L "$root/.config/claims" -f "$root/.config/claims/claimed.jq" \
  | gh api -X PATCH "repos/$repo/issues/$number" --input - > /dev/null
echo "issue:edit: wrote the body of #$number with its claim markers"
'''

# A lane claims the unit it works (#5146): `claim:take <n>` adds
# `status:claimed` to issue n and writes the lane's claim marker after any
# other lane's, or alone when its read shows no label (`.config/claims/
# taken.jq`, #5531), as `claim:next` does for its pick. It reads the body once
# more: when another lane's marker stands first, that lane keeps the issue,
# and the run takes its own marker off and exits 1.
# Both tasks write the claim through `claim_mark` (`.config/claims/mark.bash`,
# #5175).
# The lane is `--lane`, else the lane of the branch it runs on,
# `<lane>-<n>-…` (`.config/claims/taken.jq`). It refuses a closed issue, an
# issue another lane claims, and an issue another lane released in the last 2
# hours (#6954). It refuses a unit under `shape:signed` whose newest frame
# marker is absent or names another frame (#7018): it prints the rows that
# `unit:check` refuses at the frame now and pages the architect once for the
# unit (`frame.bash`). It does nothing for an issue the lane holds.
# The gate refuses a unit branch whose issue holds no claim of its lane and
# names this task.
["claim:take"]
description = "Claim the issue a lane works, as claim:next claims its pick"
usage = '''
arg "<issue>" help="the issue's number"
flag "--lane <lane>" help="the lane that takes the claim; the lane of the current branch by default"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
number=${usage_issue:?}
[[ $number =~ ^[0-9]+$ ]] || { echo "claim:take: the issue is a number, not \`$number\`" >&2; exit 2; }
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$claims/lanes.bash"
lane=${usage_lane:-}
if [[ -z $lane ]]; then
  branch=$(git branch --show-current)
  lane=$(jq -nc --arg branch "$branch" --argjson lanes "$(lanes_keys)" \
    '{step: "branch", branch: $branch, lanes: $lanes}' | jq -r -L "$claims" -f "$claims/taken.jq" | jq -r '.lane // empty')
  [[ -n $lane ]] || { echo "claim:take: the branch \`$branch\` names no lane; name it with --lane" >&2; exit 2; }
fi
[[ $lane =~ ^[a-z][a-z0-9-]*$ ]] || { echo "claim:take: \`$lane\` is no lane" >&2; exit 2; }
# `claim:release` accepts the same lanes (#6639): a lane the table holds.
if ! lanes_has "$lane"; then
  echo "claim:take: no lane \`$lane\` in $(lanes_file)" >&2
  exit 2
fi
repo=${GH_REPO:-'{owner}/{repo}'}
read_issue() { gh api "repos/$repo/issues/$number" --jq '{number, state, labels: [.labels[].name], body: (.body // "")}'; }
issue=$(read_issue)
# A signed unit's newest frame marker and the frame now (#7018), read only
# for an issue under `shape:signed`; a failed read leaves `signed` null.
source "$claims/frame.bash"
signed=null
if jq -e '.labels | index("shape:signed")' <<< "$issue" > /dev/null; then
  signed=$(unit_frame_signed "$root" "$repo" "$number") || signed=null
fi
decision=$(jq -c --arg lane "$lane" --argjson now "$(date +%s)" --argjson signed "$signed" \
  '{step: "take", lane: $lane, now: $now, issue: ., signed: $signed}' <<< "$issue" \
  | jq -c -L "$claims" -f "$claims/taken.jq")
case $(jq -r .verdict <<< "$decision") in
  refused)
    line=$(jq -r .line <<< "$decision")
    echo "$line" >&2
    # A unit signed at another frame: `unit:check` names the rows that the
    # frame now refuses, and the architect is paged once for the unit.
    if jq -e '.stale' <<< "$decision" > /dev/null; then
      mise run --quiet unit:check "$number" >&2 || :
      unit_frame_page "$number" "$(jq -r .stale.frame <<< "$decision")" \
        "frame #$number: signed $(jq -r '.stale.marker // "with no marker"' <<< "$decision"), frame now $(jq -r .stale.frame <<< "$decision"); its sections again, then unit:sign"
    fi
    exit 1
    ;;
  held)
    echo "claim:take: $lane holds #$number already" >&2
    exit 0
    ;;
esac
source "$claims/mark.bash"
reread=$(mktemp)
trap 'rm -f "$reread"' EXIT
claim_mark "$repo" "$number" "$lane" "$reread" <<< "$(jq -c '{body}' <<< "$decision")"
if [[ $claim_kept != true ]]; then
  echo "claim:take: another lane claimed #$number first, and keeps it" >&2
  exit 1
fi
echo "claim:take: $lane claims #$number" >&2
'''

# A landing patches the features ledger rows it names, in the landing (#2525):
# `ledger:patched <body> <base> [--head <ref>] [--pr <n>]` reads the rows the
# change from `<base>` to the head (`HEAD` by default) adds, edits or removes
# in `ledger/features.sql`, and the rows the body's `## Ledger` names, and
# prints one refusal per row out of step (`.config/claims/ledger.jq`): a
# named row untouched or unknown, a touched row unnamed, a touched declined
# row naming only issues the body closes (#2848), and with `--pr` a named row
# whose `since` lacks `#<n>`. Exits 1 on a refusal. `pr:land` runs
# it on the pull request with its number and refuses; `pr:open` runs it
# without one and prints each line as a note. The tables reach jq through
# files, never as arguments: a table past the argument limit (#2671) would
# refuse every landing with `Argument list too long`. The repository read is
# the caller's (`GIT_DIR` honoured); the reading is this checkout's.
["ledger:patched"]
description = "Refuse a landing whose ledger rows and its body's ## Ledger disagree"
usage = '''
arg "<body>" help="the body file"
arg "<base>" help="the commit the change is read from"
flag "--head <ref>" help="the change's head; HEAD by default"
flag "--pr <number>" help="the pull request's number, which each named row's since carries"
'''
tools.jq = "1.8.1"
env.LEDGER_READING_ROOT = "{{ config_root }}"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$LEDGER_READING_ROOT
tables=$(mktemp -d)
trap 'rm -rf "$tables"' EXIT
rows_at() { { git show "$1:ledger/features.sql" 2> /dev/null || true; printf '%s\n' 'SELECT * FROM feature ORDER BY id;'; } | sqlite3 -json; }
rows_at "${usage_base:?}" > "$tables/base.json"
rows_at "${usage_head:-HEAD}" > "$tables/head.json"
findings=$(jq -n --rawfile body "${usage_body:?}" --argjson pr "${usage_pr:-null}" \
  --slurpfile base "$tables/base.json" --slurpfile head "$tables/head.json" \
  '($base | add // []) as $base | ($head | add // []) as $head
   | (INDEX($base[]; .id)) as $was | (INDEX($head[]; .id)) as $now
   | {pr: $pr, body: $body, rows: [$head[].id],
      touched: ([$head[] | select($was[.id] != .) | {id, since, status, issue}] + [$base[] | select($now[.id] == null) | {id, since: null, status: null, issue: null}])}' \
  | jq -r -L "$root/.config/claims" -f "$root/.config/claims/ledger.jq")
[[ -z "$findings" ]] || { echo "$findings"; exit 1; }
{% endraw %}'''

# A reserved grammar rule is not lowered (#2528): `ledger:reserved <base>
# [--head <ref>]` reads the syntax ledger's rows at `<base>` and at the head
# (`HEAD` by default), and for each rule `reserved` at the base that the head
# makes `implemented`, the issue its row cites, through gh; it prints one
# refusal per such rule whose issue is not open or whose body names neither
# the rule nor its kind, with the row (`.config/claims/reserved.jq`), and
# exits 1. The ledger is the lowering's own reading (`check:syntax-ledger`
# holds it to the exemplars), so a lowering that admits a reserved form moves
# its row. `pr:land` runs it on the pull request and refuses; `pr:open` runs
# it and prints each line as a note. The repository read is the caller's
# (`GIT_DIR` honoured); the reading is this checkout's.
["ledger:reserved"]
description = "Refuse a landing that lowers a reserved grammar rule its row's open issue does not name"
usage = '''
arg "<base>" help="the commit the change is read from"
flag "--head <ref>" help="the change's head; HEAD by default"
'''
tools.jq = "1.8.1"
env.LEDGER_READING_ROOT = "{{ config_root }}"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$LEDGER_READING_ROOT
tables=$(mktemp -d)
trap 'rm -rf "$tables"' EXIT
rows_at() { git show "$1:ledger/syntax.json" 2> /dev/null | jq '[.rules[]? | select(.standing == "committed")]' || echo '[]'; }
rows_at "${usage_base:?}" > "$tables/base.json"
rows_at "${usage_head:-HEAD}" > "$tables/head.json"
jq -n --slurpfile base "$tables/base.json" --slurpfile head "$tables/head.json" \
  '(INDEX($head[0][]; .name)) as $now
   | [$base[0][] | select(.status == "reserved") | {name, kind, issue, admission, now: $now[.name].status}]' > "$tables/rows.json"
mkdir "$tables/issues"
shopt -s nullglob
while read -r number; do
  gh issue view "$number" --json number,state,body > "$tables/issues/$number.json" 2> /dev/null || rm -f "$tables/issues/$number.json"
done < <(jq -r '.[] | select(.now == "implemented") | .issue // empty | ltrimstr("#")' "$tables/rows.json" | sort -u)
findings=$(jq -n --slurpfile rows "$tables/rows.json" '{rows: $rows[0], issues: ([inputs | {key: (.number | tostring), value: {state, body}}] | from_entries)}' \
    "$tables"/issues/*.json < /dev/null \
  | jq -r -L "$root/.config/claims" -f "$root/.config/claims/reserved.jq")
[[ -z "$findings" ]] || { echo "$findings"; exit 1; }
{% endraw %}'''

# Nothing private reaches a public issue or pull request body (#2530; the
# agents' guidance, § Public and private). `body:check [--title <text>]
# <file>...` reads the private-names list at
# `$XDG_CONFIG_HOME/gandr/private-names` (`~/.config` by default): one
# extended regular expression per line, matched without regard to case, `#`
# lines and blank lines skipped. The list is the owner's and never lives in
# the tree. Each match is printed with its file (or `title`) and line, and
# the check exits 1; a missing or empty list refuses too, naming its path,
# never a silent pass. A title that holds a JSON escape `\uXXXX` is refused
# too (#6496, `.config/issues/title.jq`): a filer that quotes the title for
# the shell with a JSON encoder sends the escape, and GitHub shows it as
# text. A comment that closes or declines a unit on a probe passes
# `--sets-aside <n>` (#6569, `.config/claims/measured.jq`): for each
# `## Sources` row of #n whose `saves:` claims a saving, the comment needs a
# line `measured: <value> by <instrument>`, or it is refused. One GraphQL
# read takes the body of #n. `pr:open` runs it on the title and the body
# before it pushes, and `issue:file` before it files.
["body:check"]
description = "Refuse a body or a title naming anything on the private-names list, a title holding a JSON escape, and a probe comment with no measured saving"
usage = '''
flag "--title <text>" help="a title to scan with the files"
flag "--sets-aside <issue>" help="the files are a comment that closes or declines this unit on a probe"
arg "<file>..." help="the body files to scan"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
list=${XDG_CONFIG_HOME:-$HOME/.config}/gandr/private-names
patterns=$(mktemp)
found=$(mktemp)
trap 'rm -f "$patterns" "$found"' EXIT
if [[ -f $list ]]; then
  grep -vE '^[[:space:]]*(#|$)' "$list" > "$patterns" || true
fi
if [[ ! -s $patterns ]]; then
  echo "body:check: no private-names list at $list (one pattern per line); write it before posting a body" >&2
  exit 2
fi
eval "files=(${usage_file:?})"
# grep exits 1 on no match, 2 on an unreadable file or a malformed pattern:
# the second fails the check.
scan() { grep -HniE -f "$patterns" "$@" >> "$found" || (($? == 1)); }
escaped=
if [[ -n ${usage_title:-} ]]; then
  printf '%s\n' "$usage_title" | scan --label=title
  escaped=$(printf '%s' "$usage_title" | jq -R -s -r -f "$(git rev-parse --show-toplevel)/.config/issues/title.jq")
fi
scan -- "${files[@]}"
unmeasured=
if [[ -n ${usage_sets_aside:-} ]]; then
  [[ $usage_sets_aside =~ ^[0-9]+$ ]] || { echo "body:check: --sets-aside takes an issue number, not \`$usage_sets_aside\`" >&2; exit 2; }
  root=$(git rev-parse --show-toplevel)
  unit_body=$(gh issue view "$usage_sets_aside" --json body --jq .body)
  unmeasured=$(jq -n --arg issue "$unit_body" --rawfile comment <(cat -- "${files[@]}") '{issue: $issue, comment: $comment}' \
    | jq -r -L "$root/.config/claims" -f "$root/.config/claims/measured.jq")
fi
if [[ -s $found ]]; then
  printf 'body:check FAILED: these lines name private material (%s); rewrite them:\n' "$list" >&2
  sed 's/^/  /' "$found" >&2
fi
if [[ -n $escaped ]]; then
  printf 'body:check FAILED: the title holds JSON escapes; pass the title as the text a reader sees, quoted for the shell (shlex.quote in Python), never JSON-encoded:\n' >&2
  printf '%s\n' "$escaped" | sed 's/^/  /' >&2
fi
if [[ -n $unmeasured ]]; then
  printf 'body:check FAILED: %s\n' "$unmeasured" >&2
fi
if [[ -s $found || -n $escaped || -n $unmeasured ]]; then
  exit 1
fi
echo "body check OK: nothing on the private-names list in ${usage_title:+the title and }${#files[@]} file(s)"
{% endraw %}'''

# A public body keeps the explanatory register (#3591; the agents'
# guidance, baseline.md § explanatory-prose). `body:prose <file>...` reads
# each body's paragraphs and list items and holds each sentence to the body
# rules of `crates/workflow-prose/README.md`: a passive outside the stated
# list, a tense other than the present, more than 25 words, a semicolon
# between sentences and a dash between clauses. A code block, a table, a
# heading, an HTML comment and the block `pr:open` writes are not read, and
# an item of a mechanism's form is read from its answer. Each finding prints
# its file, line, rule, sentence and fix, and the check exits 1. Bodies keep
# no ledger. `pr:open` runs it on the body before it pushes, and `issue:file`
# on a body it files with no `--template`. The nightly `report:prose` runs
# it over every open body.
["body:prose"]
description = "Refuse a body whose sentences break the body rules of the prose gate"
usage = 'arg "<file>..." help="the body files to read"'
tools.python = "3.15.2"
tools."github:astral-sh/uv" = "0.13.6"
tools."pipx:spacy" = { version = "3.8.18", depends = ["python", "github:astral-sh/uv"], uvx_args = "--python 3.15.2 --with en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85" }
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
python="$(mise where pipx:spacy)/spacy/bin/python"
eval "files=(${usage_file:?})"
paths=()
for file in "${files[@]}"; do paths+=("$(realpath "$file")"); done
status=0
(cd "$root" && .config/mise/scope cargo run --locked --quiet --package gandr-workflow-prose --bin prose -- --python "$python" --body "${paths[@]}") || status=$?
if ((status == 1)); then
  echo "body:prose FAILED: rewrite each sentence above as its fix states (baseline.md § explanatory-prose)" >&2
fi
exit "$status"
{% endraw %}'''

# The one way a seat or the coordinator files an issue: `issue:file <title>
# <body> [label]...` runs `body:check` on the title and the body, and
# `body:prose` on a body filed with no `--template` (#3591), then
# `gh issue create` with each label, printing the issue's address. The labels
# are the full set or the issue is refused (#2902): exactly one `kind:`,
# `priority:` and `effort:`, one or more `area:`, a missing `priority:` or
# `effort:` taking its kind's default from `.config/issues/defaults.toml`
# and an epic keeping `kind:epic` alone (the rule
# `.config/issues/labels.jq`). A unit (a body with `## Sources`) is refused
# before it is filed when it lacks a section (`findings.jq`, as `unit:check`
# reads it) or a design page's claim (`claim.jq`, #6569), and once filed has
# the dependencies its `## After` names set by
# `unit:check --fix`, so no filed unit lacks them. `--epic <n>` links the
# issue under the epic and sets the epic `blocked by` it, and a body line
# `Advances #n`, `Part of #n` or `from: #n` naming an open `kind:epic` sets
# that epic `blocked by` it too (#3398): an epic is blocked by its units and
# closes once every one is closed (`.config/claims/deps.bash`). An epic that
# holds 100 sub-issues, GitHub's limit, takes no more, and GitHub refuses the
# link only once the issue exists (#5149). So `--epic` counts the epic's
# sub-issues before it creates the issue. At the limit it files the issue
# under no epic, ends the body with `Epic: #<n> (full)`, and prints a note
# that names the epic. A count that fails stops the task before it creates
# the issue. A closing keyword in the body outside its head's keyword lines
# (`targets.jq`'s `strays`, #2980) is noted on stderr:
# it does nothing in an issue, but the same words in a pull request's body
# close the issue they name on merge. A mechanism files a unit or marks what
# it could not (#3112, `tracker.md` § tracker-filing): `--template <filer>`
# appends `.config/issues/templates/<filer>.md` to the body, the filer's
# observation, each `{{field}}` filled from `--fields` (`template.jq`), and
# a `kind:defect` that is no `collector` and fails `unit:check` is refused
# unless it carries `status:unsectioned`, its claiming seat's to section
# (#3134). A unit filed whole is sectioned before its claim, so it is signed
# by construction: `issue:file` labels it `shape:signed`, the label
# `pr:open` waits for (`signed.jq`).
["issue:file"]
description = "File an issue with its full label set once its title and body name nothing private, linked and its dependencies set"
usage = '''
arg "<title>" help="the issue's title"
arg "<body>" help="the body file; with --template, the observation the template follows"
arg "[label]..." help="labels: one `kind:`, one or more `area:`, a `priority:` and an `effort:` unless the kind's default serves, any others"
flag "--epic <n>" help="the epic to link the issue under"
flag "--template <filer>" help="the filer's template under .config/issues/templates/ that fills the unit's sections"
flag "--fields <json>" help="the template's fields, one JSON object of strings"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
body=$(realpath "${usage_body:?}")
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$claims/deps.bash"
source "$root/.config/issues/labels.bash"
epic=${usage_epic:-}
[[ -z $epic || $epic =~ ^[0-9]+$ ]] || { echo "issue:file: --epic takes an issue number, not \`$epic\`" >&2; exit 2; }
template=${usage_template:-}
if [[ -n $template ]]; then
  file=$root/.config/issues/templates/$template.md
  if [[ ! -f $file ]]; then
    echo "issue:file: no template \`$template\`; the filers': $(cd "$root/.config/issues/templates" && ls -- *.md | sed 's/\.md$//' | paste -sd ' ' -)" >&2
    exit 2
  fi
  rendered=$(mktemp)
  trap 'rm -f "$rendered"' EXIT
  jq -R -s -r -L "$root/.config/issues" --argjson fields "${usage_fields:-{\}}" --rawfile observation "$body" \
    'include "template"; render($fields; $observation)' "$file" > "$rendered" \
    || { echo "issue:file: the template \`$template\` is not filled" >&2; exit 1; }
  body=$rendered
elif [[ -n ${usage_fields:-} ]]; then
  echo "issue:file: --fields fills a template; name it with --template" >&2
  exit 2
fi
mise run --quiet body:check --title "${usage_title:?}" "$body" >&2
if [[ -z $template ]]; then
  mise run --quiet body:prose "$body" >&2
fi
jq -R -s -r -L "$claims" 'include "targets"; strays[]
  | "issue:file: note: the line `\(.line)` carries `\(.keyword)`, a closing keyword; it does nothing here, but closes the issue it names if the words reach a pull request body"' "$body" >&2
eval "labels=(${usage_label:-})"
labelled() { local label; for label in "${labels[@]}"; do [[ $label != "$1" ]] || return 0; done; return 1; }
unit=false
if jq -R -s -e 'split("\n") | any(test("^## Sources\\s*$"))' "$body" > /dev/null; then
  unit=true
fi
defect=false
if labelled kind:defect && ! labelled collector && ! labelled status:unsectioned; then
  defect=true
fi
if [[ $unit == true || $defect == true ]]; then
  concerns=$(sqlite3 -json :memory: ".read $root/ledger/concerns.sql" 'SELECT id, issue FROM concern ORDER BY id;')
  findings=$(jq -R -s -r -L "$claims" --argjson concerns "$concerns" --argjson labels "$(printf '%s\n' "${labels[@]}" | jq -R -s -c 'split("\n") | map(select(. != ""))')" \
    --argjson cutoff "$(jq -R -s -f "$claims/cutoff.jq" "$root/.config/references/window.toml")" -f "$claims/unit.jq" "$body")
  if [[ $unit == true ]]; then
    # A unit filed now was signed after the claim rule landed, so it has no
    # body from before it.
    source "$root/.config/references/vault.bash"
    source "$claims/claim.bash"
    findings=$(printf '%s\n%s\n' "$findings" "$(claim_check "$(< "$body")" null)" | awk 'NF')
  fi
  if [[ -n $findings ]]; then
    if [[ $unit == true ]]; then
      printf 'issue:file: the body is a unit (it has `## Sources`) and lacks what a unit issue carries (units.md § units-issue):\n' >&2
    else
      printf 'issue:file: a kind:defect is filed as a unit or marked (tracker.md § tracker-filing): fill its sections from its filer'"'"'s template (--template, .config/issues/templates/), or label it status:unsectioned for its claiming seat; it lacks:\n' >&2
    fi
    printf '%s\n' "$findings" | sed 's/^/  - /' >&2
    exit 1
  fi
  unit=true
  labels+=(shape:signed)
fi
plan=$(labels_plan "$(printf '%s\n' "${labels[@]}" | jq -R . | jq -s -c 'map(select(. != ""))')" "$(labels_defaults)")
refused=$(awk -F'\t' '$1 == "refuse" { print "  - " $2 }' <<< "$plan")
if [[ -n $refused ]]; then
  printf 'issue:file: the labels are not the full set (tracker.md § tracker-issues):\n%s\n' "$refused" >&2
  exit 1
fi
while IFS=$'\t' read -r verb label; do
  case "$verb" in
    add)
      labels+=("$label")
      echo "issue:file: $label, the kind's default" >&2
      ;;
    remove)
      for i in "${!labels[@]}"; do [[ ${labels[$i]} != "$label" ]] || unset 'labels[i]'; done
      echo "issue:file: $label dropped: an epic is one kind, kind:epic" >&2
      ;;
  esac
done <<< "$plan"
# gh fills `{owner}` and `{repo}` from the checkout's remote, so the
# repository's name costs no read.
repo='{owner}/{repo}'
# One query before the filing reads the epic and each epic the body names as
# its own (#5709). A second query after the filing reads the new issue's
# REST id, only when a link or a block is written. A new issue has no parent
# and blocks nothing, so its links are written unread.
mapfile -t named < <(jq -R -s -r -L "$claims" 'include "sections"; epic_refs[]' "$body" | sort -nu)
read='{}'
if [[ -n $epic || ${#named[@]} -gt 0 ]]; then read=$(deps_issues "$repo" - ${epic:+"$epic"} "${named[@]}"); fi
full=false
if [[ -n $epic ]]; then
  jq -e --arg n "$epic" 'has($n)' <<< "$read" > /dev/null || { echo "issue:file: --epic #$epic is no issue" >&2; exit 2; }
  held=$(jq --arg n "$epic" '.[$n].sub_issues | length' <<< "$read")
  if (( held >= 100 )); then
    full=true
    filed=$(mktemp)
    trap 'rm -f "${rendered:-}" "$filed"' EXIT
    { cat "$body"; printf '\nEpic: #%s (full)\n' "$epic"; } > "$filed"
    body=$filed
  fi
fi
# Each open epic the body names as its own is blocked by the new issue
# (#3398), unless the link sets it.
blocks=()
for named_epic in "${named[@]}"; do
  [[ $full == true || $named_epic != "$epic" ]] || continue
  jq -e --arg n "$named_epic" '.[$n] | . != null and .state == "open" and (.labels | index("kind:epic") != null)' <<< "$read" > /dev/null || continue
  blocks+=("$named_epic")
done
flags=()
for label in "${labels[@]}"; do flags+=(--label "$label"); done
url=$(gh issue create --title "$usage_title" --body-file "$body" "${flags[@]}")
number=${url##*/}
if [[ -n $epic && $full != true ]] || (( ${#blocks[@]} > 0 )); then
  id=$(deps_issues "$repo" - "$number" | jq -r --arg n "$number" '.[$n].id')
fi
if [[ $full == true ]]; then
  echo "issue:file: #$epic holds $held sub-issues, GitHub's limit, so #$number is filed under no epic; its body names #$epic" >&2
elif [[ -n $epic ]]; then
  deps_link_filed "$repo" "$epic" "$number" "$id" >&2
fi
for blocked in "${blocks[@]}"; do
  deps_set_block "$repo" "$blocked" "$number" "$id" >&2
done
if [[ $unit == true ]]; then
  mise run --quiet unit:check --fix "$number" >&2
fi
echo "$url"
{% endraw %}'''

# A merged pull request's `## Refactoring` verdict, filed (#2885):
# `refactor:file <pr>` reads the pull request, the area and epic of the unit
# it closed, and every `kind:refactor` issue, and carries out what
# `.config/claims/filing.jq` decides. A `yes` or `maybe` with rows joins the
# one open collector of the unit's area, `refactor(<area>): verdicts`: the
# collector gains the rows it lacks and a `from:` line. An area with no open
# collector gets one through `issue:file` (its labels `kind:refactor`,
# `collector` and the unit's `area:`, linked under the unit's epic). Either
# pages the coordinator through the page command of the stall configuration
# (`.config/stall/stall.bash`), who queues the collector in its area's lane.
# A pull request that closes no issue, as one advancing an epic's unit does,
# takes the area and epic of the issue its branch names (`<lane>-<n>-…`, or
# `<lane>-<seat>-<n>-…` from a numbered seat, #3836), and failing that the
# lane's own `area:<lane>` label. The lane is one or more lowercase words
# that hyphens join, as `diagnostic-help` (#6012). An issue carrying the
# pull request's `from:` line is the filing, so a second run files nothing.
# Two runs that overlap, on one host or two, each read the board before the
# other files (#5149). So a run that opens a collector reads the board
# again. When an earlier issue carries its `from:` line, or an earlier
# collector of its area is open, the run closes its own collector as that
# issue's duplicate, and adds its rows to the earlier collector when it
# lacks them. `pr:watch` runs it when its pull request merges; `stall:watch`
# pages a verdict still unfiled. `--dry-run` prints the decision and changes
# nothing. `.config/claims/branch-unit.bash` runs its cases.
["refactor:file"]
description = "File a merged pull request's yes or maybe refactoring verdict on its area's refactor collector and page the coordinator"
usage = '''
arg "<pr>" help="the merged pull request's number"
flag "--dry-run" help="print the decision without filing or paging"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
number=${usage_pr:?}
[[ $number =~ ^[1-9][0-9]*$ ]] || { echo "refactor:file: expected a pull request number, not \`$number\`" >&2; exit 2; }
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$root/.config/gh/repo.bash"
repo=$(repo_name)
pr=$(gh api graphql -F owner='{owner}' -F name='{repo}' -F number="$number" -f query='
  query($owner: String!, $name: String!, $number: Int!) {
    repository(owner: $owner, name: $name) {
      pullRequest(number: $number) {
        state body headRefName
        closingIssuesReferences(first: 10) { nodes { number parent { number } labels(first: 30) { nodes { name } } } }
      }
    }
  }' --jq '.data.repository.pullRequest')
state=$(jq -r .state <<< "$pr")
[[ $state == MERGED ]] || { echo "refactor:file: #$number is $state, not merged" >&2; exit 2; }
area=$(jq -c '[.closingIssuesReferences.nodes[].labels.nodes[].name | select(startswith("area:")) | ltrimstr("area:")] | first' <<< "$pr")
epic=$(jq -r '[.closingIssuesReferences.nodes[].parent.number | values] | first // empty' <<< "$pr")
head=$(jq -r .headRefName <<< "$pr")
lane=${head%%-*}
if [[ $head =~ ^([a-z]+(-[a-z]+)*)(-[0-9]+)?-([1-9][0-9]*)-[a-z] ]]; then
  lane=${BASH_REMATCH[1]}
  named=${BASH_REMATCH[4]}
  if [[ $area == null ]]; then
    unit=$(gh api "repos/$repo/issues/$named" --jq '{area: ([.labels[].name | select(startswith("area:")) | ltrimstr("area:")] | first),
      epic: ((.parent_issue_url // "" | capture("/issues/(?<n>[0-9]+)$").n) // "")}')
    area=$(jq -c .area <<< "$unit")
    [[ -n $epic ]] || epic=$(jq -r .epic <<< "$unit")
  fi
fi
if [[ $area == null ]] && gh label list -R "$repo" --search "area:$lane" --json name --jq '.[].name' | grep -Fxq "area:$lane"; then
  area=$(jq -cn --arg lane "$lane" '$lane')
fi
# The board and the pull request reach jq through files, never as arguments:
# the refactor issues' bodies are past the argument limit (#3771, as #2671).
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
# The run reads the board through `decide <board file>`, which prints what
# `filing.jq` decides over it.
decide() {
  jq -n --argjson number "$number" --slurpfile pr "$scratch/pr.json" --argjson area "$area" --slurpfile issues "$1" \
    '{pr: {number: $number, body: $pr[0].body, area: $area}, issues: $issues[0]}' | jq -c -L "$claims" -f "$claims/filing.jq"
}
gh issue list -R "$repo" --label kind:refactor --state all --limit 1000 --json number,state,title,body > "$scratch/issues.json"
printf '%s' "$pr" > "$scratch/pr.json"
decision=$(decide "$scratch/issues.json")
if [[ ${usage_dry_run:-false} == true ]]; then
  jq --arg epic "$epic" '. + {epic: (if $epic == "" then null else ($epic | tonumber) end)}' <<< "$decision"
  exit 0
fi
body=$scratch/body.md
case $(jq -r .act <<< "$decision") in
  none)
    echo "refactor:file: #$number's verdict files nothing"
    exit 0
    ;;
  filed)
    echo "refactor:file: #$number is filed as #$(jq -r .issue <<< "$decision")"
    exit 0
    ;;
  update)
    issue=$(jq -r .issue <<< "$decision")
    jq -j .body <<< "$decision" > "$body"
    gh issue edit "$issue" -R "$repo" --body-file "$body" > /dev/null
    line="refactor collector #$issue gains #$number's verdict; queue it in its area's lane"
    ;;
  open)
    jq -j .body <<< "$decision" > "$body"
    mapfile -t labels < <(jq -r '.labels[]' <<< "$decision")
    url=$(mise run --quiet issue:file "$(jq -r .title <<< "$decision")" "$body" "${labels[@]}" ${epic:+--epic "$epic"})
    issue=${url##*/}
    # Another run, on this host or another, can file the same verdict, or a
    # verdict of the same area, between this run's board read and its create
    # (#5149). So the run reads the board again: the earliest issue that
    # carries `from: #<pr>`, or the earliest open collector of the area, is
    # the filing. Of two runs, the later create reads after both issues
    # exist, so it closes its own issue as the earlier one's duplicate.
    gh issue list -R "$repo" --label kind:refactor --state all --limit 1000 --json number,state,title,body > "$scratch/after.json"
    title=$(jq -r .title <<< "$decision")
    first=$(jq -r -L "$claims" --argjson pr "$number" --arg title "$title" \
      'include "sections"; [.[] | select((.body | from_lines | any(.[]; . == $pr)) or (.state == "OPEN" and .title == $title)) | .number] | min // empty' "$scratch/after.json")
    if [[ -n $first && $first -lt $issue ]]; then
      gh issue close "$issue" -R "$repo" --duplicate-of "$first" > /dev/null
      jq --argjson own "$issue" 'map(select(.number != $own))' "$scratch/after.json" > "$scratch/others.json"
      decision=$(decide "$scratch/others.json")
      if [[ $(jq -r .act <<< "$decision") != update ]]; then
        echo "refactor:file: #$number is filed as #$first by another run, so #$issue is closed as its duplicate"
        exit 0
      fi
      jq -j .body <<< "$decision" > "$body"
      gh issue edit "$first" -R "$repo" --body-file "$body" > /dev/null
      echo "refactor:file: #$issue is closed as the duplicate of the earlier collector #$first, which gains #$number's verdict"
      issue=$first
      line="refactor collector #$issue gains #$number's verdict; queue it in its area's lane"
    else
      line="refactor collector #$issue opened from #$number's verdict; queue it in its area's lane"
    fi
    ;;
esac
echo "refactor:file: $line"
source "$root/.config/stall/stall.bash"
page=$(stall_configuration | jq -c '.page // empty')
if [[ -z $page ]]; then
  echo "refactor:file: no page command in $stall_config; tell the coordinator: $line" >&2
  exit 0
fi
mapfile -t command < <(jq -r '.command[]' <<< "$page")
mapfile -t coordinator < <(jq -r '.coordinator[]' <<< "$page")
"${command[@]}" "${coordinator[@]}" "$line" || echo "refactor:file: the page failed; tell the coordinator: $line" >&2
{% endraw %}'''

# An issue's full label set, applied after the fact (#2902): `issue:labels
# <n>...` adds each missing `priority:` and `effort:` its kind's default
# names (`.config/issues/defaults.toml`, the rule `.config/issues/labels.jq`,
# as `issue:file` applies them) and removes each `kind:` beside `kind:epic`,
# and `--sweep` does so for every open issue. What the rule cannot repair (no
# `kind:` or `area:`, a `kind:`, `priority:` or `effort:` given twice, a kind
# without a default) is printed, exiting 1; `report:deps` lists it nightly.
["issue:labels"]
description = "Give each open issue its kind's missing priority: and effort:, and an epic kind:epic alone"
usage = '''
arg "[issue]..." help="the issues; none with --sweep"
flag "--sweep" help="every open issue"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/issues/labels.bash"
source "$root/.config/issues/open.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
defaults=$(labels_defaults)
eval "issues=(${usage_issue:-})"
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
if [[ ${usage_sweep:-false} == true ]]; then
  open_issues "$repo" "$scratch/open.json"
  jq -c '.[] | select(.pull_request | not) | {number, labels}' "$scratch/open.json" > "$scratch/issues"
else
  (( ${#issues[@]} > 0 )) || { echo "issue:labels takes issues, or --sweep" >&2; exit 2; }
  for n in "${issues[@]}"; do
    [[ $n =~ ^[0-9]+$ ]] || { echo "issue:labels takes issue numbers, not \`$n\`" >&2; exit 2; }
    gh api "repos/$repo/issues/$n" --jq '{number, labels: [.labels[].name]} | @json'
  done > "$scratch/issues"
fi
added=0
short=0
while IFS= read -r issue; do
  number=$(jq -r .number <<< "$issue")
  plan=$(labels_plan "$(jq -c .labels <<< "$issue")" "$defaults")
  adds=()
  removes=()
  while IFS=$'\t' read -r verb what; do
    case "$verb" in
      add) adds+=(-f "labels[]=$what") ;;
      remove) removes+=("$what") ;;
      refuse) echo "#$number: $what" >&2; short=$((short + 1)) ;;
    esac
  done <<< "$plan"
  for label in "${removes[@]}"; do
    gh api -X DELETE "repos/$repo/issues/$number/labels/$(jq -rn --arg l "$label" '$l | @uri')" > /dev/null
  done
  if (( ${#adds[@]} > 0 )); then
    gh api -X POST "repos/$repo/issues/$number/labels" "${adds[@]}" > /dev/null
  fi
  if (( ${#adds[@]} + ${#removes[@]} > 0 )); then
    echo "#$number: $(awk -F'\t' '$1 == "add" || $1 == "remove" { printf "%s %s; ", ($1 == "add" ? "added" : "removed"), $2 }' <<< "$plan")"
    added=$((added + 1))
  fi
done < "$scratch/issues"
echo "issue:labels: $added issue(s) relabelled; $short problem(s) the rule cannot repair"
(( short == 0 ))
{% endraw %}'''

# An epic's sub-issues, linked and ordered by the one task that writes the
# order (#2902): `epic:order <epic> <n>...` links each under the epic, the
# epic `blocked by` each open one, and orders them as given. A sequential
# ladder takes `--chain`: each sub-issue is set `blocked by` the one before
# it, and lists it in its `## After` (`with_after` in
# `.config/claims/sections.jq`), the section being the record. An epic body's
# ladder table is not read; the sub-issues' `## After` is.
["epic:order"]
description = "Link and order an epic's sub-issues, the epic blocked by each open one; --chain sets each blocked by the one before"
usage = '''
arg "<epic>" help="the epic"
arg "<issue>..." help="its sub-issues, in order"
flag "--chain" help="set each sub-issue blocked by the one before it and list it in its ## After"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
epic=${usage_epic:?}
eval "issues=(${usage_issue:?})"
claims=$(git rev-parse --show-toplevel)/.config/claims
source "$claims/deps.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
for n in "$epic" "${issues[@]}"; do
  [[ $n =~ ^[0-9]+$ ]] || { echo "epic:order takes issue numbers, not \`$n\`" >&2; exit 2; }
done
previous=
previous_id=
for n in "${issues[@]}"; do
  deps_link "$repo" "$epic" "$n"
  id=$(deps_id "$repo" "$n")
  if [[ -n $previous ]]; then
    gh api -X PATCH "repos/$repo/issues/$epic/sub_issues/priority" -F sub_issue_id="$id" -F after_id="$previous_id" > /dev/null
    if [[ ${usage_chain:-false} == true ]]; then
      deps_block "$repo" "$n" "$previous"
      body=$(gh api "repos/$repo/issues/$n" --jq '.body // ""')
      edited=$(jq -n --rawfile body <(printf '%s' "$body") --argjson after "$previous" --argjson epic "$epic" \
        '{body: $body, after: $after, epic: $epic}' | jq -r -L "$claims" -f "$claims/chain.jq")
      if [[ $edited != "$body" ]]; then
        printf '%s\n' "$edited" | gh issue edit "$n" --body-file - > /dev/null
        printf 'listed #%s in #%s'"'"'s ## After\n' "$previous" "$n"
      fi
    fi
  fi
  previous=$n
  previous_id=$id
done
printf 'ordered #%s: %s\n' "$epic" "$(printf '#%s ' "${issues[@]}")"
{% endraw %}'''

# An epic is blocked by every open sub-issue (#2902): `epic:deps <epic>...`
# sets each dependency it lacks, `--all` for every open `kind:epic`, its
# sub-issues and dependencies read in one pass over the open issues
# (`deps_open_graph`, #3192). It is idempotent; `report:deps` reruns it
# nightly. A dependency GitHub refuses, a cycle among them, is printed and
# the run goes on, exiting 1 at its end (#4903).
["epic:deps"]
description = "Set each epic blocked by its open sub-issues"
usage = '''
arg "[epic]..." help="the epics; none with --all"
flag "--all" help="every open kind:epic issue"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
claims=$(git rev-parse --show-toplevel)/.config/claims
source "$claims/deps.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
eval "epics=(${usage_epic:-})"
if [[ ${usage_all:-false} == true ]]; then
  mapfile -t epics < <(gh api --paginate "repos/$repo/issues?state=open&labels=kind:epic&per_page=100" --jq '.[] | select(.pull_request == null) | .number')
  graph=$(deps_open_graph "$repo")
fi
(( ${#epics[@]} > 0 )) || { echo "epic:deps takes epics, or --all" >&2; exit 2; }
refused=0
# Runs the setter `$1` for the epic `$3` and the child `$4`, naming a refusal.
block() {
  local said
  if ! said=$("$@" 2>&1); then
    printf '#%s: GitHub refused #%s as a blocked-by dependency: %s\n' "$3" "$4" "$(awk 'NF { line = $0 } END { print line }' <<< "$said")"
    refused=$((refused + 1))
  elif [[ -n $said ]]; then
    printf '%s\n' "$said"
  fi
}
for epic in "${epics[@]}"; do
  if [[ -n ${graph:-} ]]; then
    while read -r child; do
      block deps_set_block "$repo" "$epic" "$child"
    done < <(jq -r --arg epic "$epic" '(.[$epic] // {blocked_by: [], sub_issues: []}) as $read | [$read.blocked_by[].number] as $set
      | $read.sub_issues[] | select(.state == "open" and .number != ($epic | tonumber) and (.number | IN($set[]) | not)) | .number' <<< "$graph")
  else
    while read -r child; do
      block deps_block "$repo" "$epic" "$child"
    done < <(deps_sub_issues "$repo" "$epic" | jq -r --argjson self "$epic" '.[] | select(.state == "open" and .number != $self) | .number')
  fi
done
echo "epic:deps: ${#epics[@]} epic(s) read; $refused dependency(ies) refused"
(( refused == 0 ))
{% endraw %}'''

# An epic's membership as `blocked by`, backfilled (#3398): `epics:link`
# reads every issue once, open or closed, and sets each open `kind:epic`
# blocked by every issue whose body names it or that its body names
# (`.config/epics/link.jq`, neither an epic nor a `collector` a member), so
# the epics workflow closes it once the last of them closes. It reads the
# issues in one paginated GraphQL query, and each open epic's blocked-by set
# from one `deps_open_graph` pass (#5688); only its writes and the read of
# the repository's name are REST. It
# prints, per epic, what it added and how many of its members are open;
# `--dry-run` prints the same and sets nothing. A dependency GitHub refuses
# is printed and the run goes on, exiting 1 at its end. It is idempotent.
["epics:link"]
description = "Set each open epic blocked by every issue its body names or that names it"
usage = '''
flag "--dry-run" help="print what would be set and set nothing"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/deps.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
# Every issue, 100 a page at one point, newest first as the REST list gives
# them: REST takes a page for each 100 issues and pull requests (#5688).
issues=$(gh api graphql --paginate -F owner='{owner}' -F name='{repo}' -f query='
  query($owner: String!, $name: String!, $endCursor: String) {
    repository(owner: $owner, name: $name) {
      issues(first: 100, after: $endCursor, orderBy: {field: CREATED_AT, direction: DESC}) {
        pageInfo { hasNextPage endCursor }
        nodes { number state body labels(first: 100) { nodes { name } } }
      }
    }
  }' --jq '.data.repository.issues.nodes[] | {number, state: (.state | ascii_downcase), labels: [.labels.nodes[].name], body: (.body // "")}' \
  | jq -s -c '.')
# Each open issue's blocked-by numbers in one pass, where REST takes a read
# for each epic.
blocked=$(deps_open_graph "$repo" | jq -c 'map_values([.blocked_by[].number])')
plan=$(jq -c '{issues: .}' <<< "$issues" | jq -c -f "$root/.config/epics/link.jq")
states=$(jq -c 'map({key: (.number | tostring), value: .state}) | from_entries' <<< "$issues")
refused=0
epics=0
while read -r entry; do
  epic=$(jq -r .epic <<< "$entry")
  set_now=$(jq -c --arg epic "$epic" '.[$epic] // []' <<< "$blocked")
  set=$set_now
  added=0
  for member in $(jq -r --argjson set "$set_now" '.members[] | select(IN($set[]) | not)' <<< "$entry"); do
    if [[ ${usage_dry_run:-false} != true ]] && ! why=$(deps_set_block "$repo" "$epic" "$member" 2>&1 > /dev/null); then
      printf '#%s: GitHub refused #%s as a blocked-by dependency: %s\n' "$epic" "$member" "$(awk 'NF { line = $0 } END { print line }' <<< "$why")"
      refused=$((refused + 1))
      continue
    fi
    added=$((added + 1))
    set=$(jq -c --argjson n "$member" '. + [$n]' <<< "$set")
  done
  read -r open total < <(jq -r --argjson states "$states" \
    '"\([.[] | select($states[tostring] == "open")] | length) \(length)"' <<< "$set")
  printf '#%s: %s %s; %s open of %s blocked-by\n' "$epic" "$([[ ${usage_dry_run:-false} == true ]] && echo 'would add' || echo added)" "$added" "$open" "$total"
  epics=$((epics + 1))
done < <(jq -c '.[]' <<< "$plan")
echo "epics:link: $epics open epic(s) read; $refused dependency(ies) refused"
(( refused == 0 ))
{% endraw %}'''

# The open issues and pull requests as one JSON array in a file (#5681):
# the nightly's reports job writes it once, and `report:deps` and
# `report:prose` read the file that `OPEN_ISSUES` names in place of 8 pages
# each (`open_issues` in `.config/issues/open.bash`). GH_REPO names the
# repository.
["issues:open"]
description = "Write the open issues and pull requests to a file, one JSON array"
usage = '''
arg "<file>" help="the file to write"
'''
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/issues/open.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
OPEN_ISSUES='' open_issues "$repo" "${usage_file:?}"
'''

# The design work that no open issue holds (#3401, #3160 step 6):
# `report:design` reads the vault checkout that `vault_checkout` names, and
# prints one line for each design page whose filename no `## Sources` row of
# an open issue names, and one for each open unit of a vault unit table that
# no open issue cites (`.config/claims/design.jq`, its cases held by
# `check:claims`). A unit table has a `complete` column with a box in each
# row, and an issue cites a unit when its body names the page and writes
# `unit <n>`, or `units` before a list or a range that holds `<n>`. Drafts
# count, as the absorption statuses do not cover them. Without a vault
# checkout, as in CI, it prints nothing. `claim:next` prints one summary line
# that names this task when the reading finds anything. GH_REPO names the
# repository.
["report:design"]
description = "List each design page and each open vault unit that no open issue names"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/design.bash"
source "$root/.config/issues/open.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
open=$(mktemp)
issues=$(mktemp)
trap 'rm -f "$open" "$issues"' EXIT
open_issues "$repo" "$open"
jq '[.[] | select(.pull_request | not) | {number, body}]' "$open" > "$issues"
design_report "$issues"
'''

# The nightly tracker report (#2902): `report:deps` reruns `epic:deps
# --all`, then reads every open issue for a dependency stated and not set
# (prose naming an open issue as `after #n`, `blocked on #n`, `waits on #n`,
# `once #n lands` or `needs #n`; an `## After` item; an epic's open
# sub-issue) and for a label set short of one `kind:`, `area:`, `priority:`
# and `effort:` (`.config/issues/labels.jq`), and for a features ledger row
# owing on no open issue, or only on open epics, each closing itself once
# its units close (`.config/ledger/owing.bash`, #2973, #3398), and writes
# them on one
# `collector` issue, `report: dependencies`, opened by the first finding,
# updated each night, and closed by a night with none. The rule is
# `.config/claims/report.jq`, its cases held by `check:claims`. Only issues
# that state a dependency, and epics, cost a dependency read. GH_REPO names
# the repository; without REPORT_FILE set the task prints the report and
# writes nothing. A dependency GitHub refuses `epic:deps` prints and leaves
# unset, so the report's epic row names it, and the report is still written
# (#4903).
["report:deps"]
description = "Report each open issue's stated dependency GitHub does not record, and each label set short, on one issue"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$claims/deps.bash"
source "$root/.config/issues/labels.bash"
source "$root/.config/issues/keep.bash"
source "$root/.config/ledger/owing.bash"
source "$root/.config/issues/open.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
write=${REPORT_FILE:-}
title='report: dependencies'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
if [[ -n $write ]]; then
  status=0
  mise run --quiet epic:deps --all || status=$?
  (( status <= 1 )) || exit "$status"
fi
open_issues "$repo" "$scratch/all.json"
jq '[.[] | select(.pull_request | not) | {number, title, labels, body}]' "$scratch/all.json" > "$scratch/open.json"
deps_open_graph "$repo" > "$scratch/graph.json"
jq -n -c --slurpfile open "$scratch/open.json" --slurpfile graph "$scratch/graph.json" '{open: $open[0], graph: $graph[0]}' \
  | jq -c -f "$claims/reads.jq" > "$scratch/issues.jsonl"
issue_found "$title" > "$scratch/filed.json"
labels_defaults > "$scratch/defaults.json"
sqlite3 -bail "$scratch/features.db" < "$root/ledger/features.sql"
(cd "$root" && ledger_owing "$scratch/features.db") \
  | jq -R -s -c 'split("\n") | map(select(. != "") | split("\t") | {row: .[0], issues: (.[1] | split(" ") | map(select(. != "") | tonumber))})' > "$scratch/owing.json"
jq -n --slurpfile open "$scratch/open.json" --slurpfile issues "$scratch/issues.jsonl" --slurpfile filed "$scratch/filed.json" \
  --slurpfile defaults "$scratch/defaults.json" --slurpfile owing "$scratch/owing.json" \
  '{issues: $issues, open: [$open[0][] | {number, labels}], owing: $owing[0], defaults: $defaults[0], previous: ($filed[0].body // "")}' \
  | jq -c -L "$claims" -L "$root/.config/issues" -f "$claims/report.jq" > "$scratch/report.json"
jq -r .body "$scratch/report.json" > "$scratch/body.md"
count=$(jq .count "$scratch/report.json")
if [[ -z $write ]]; then
  cat "$scratch/body.md"
  echo "report:deps: $count finding(s); REPORT_FILE unset, nothing written" >&2
  exit 0
fi
issue_keep "$title" "$(< "$scratch/filed.json")" "$count" "$scratch/body.md" \
  gh issue create --title "$title" --label collector --label kind:ci --label area:workflow \
  --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
{% endraw %}'''

# The nightly prose report (#3591): `report:prose` reads every open issue
# body and every open pull request body under the body rules (`body:prose`),
# in one parse, and writes one row per body that breaks a rule on one
# `collector` issue, `report: prose`, opened by the first finding, updated
# each night, and closed by a night with none. A collector's own body is not
# read. GH_REPO names the repository; without REPORT_FILE set the task prints
# the report and writes nothing.
["report:prose"]
description = "Report each open issue and pull request body that breaks a body rule, on one issue"
tools.jq = "1.8.1"
tools.python = "3.15.2"
tools."github:astral-sh/uv" = "0.13.6"
tools."pipx:spacy" = { version = "3.8.18", depends = ["python", "github:astral-sh/uv"], uvx_args = "--python 3.15.2 --with en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85" }
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/issues/keep.bash"
source "$root/.config/issues/open.bash"
repo=${GH_REPO:-'{owner}/{repo}'}
write=${REPORT_FILE:-}
title='report: prose'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
mkdir "$scratch/bodies"
open_issues "$repo" "$scratch/all.json"
jq -c '.[] | select(.labels | index("collector") | not) | {number, body}' "$scratch/all.json" > "$scratch/open.jsonl"
while read -r item; do
  jq -r .body <<< "$item" > "$scratch/bodies/$(jq .number <<< "$item").md"
done < "$scratch/open.jsonl"
shopt -s nullglob
bodies=("$scratch"/bodies/*.md)
touch "$scratch/findings.txt"
if ((${#bodies[@]} > 0)); then
  python="$(mise where pipx:spacy)/spacy/bin/python"
  status=0
  (cd "$root" && .config/mise/scope cargo run --locked --quiet --package gandr-workflow-prose --bin prose -- --python "$python" --body "${bodies[@]}") > "$scratch/findings.txt" || status=$?
  ((status <= 1)) || { echo "report:prose: the body parse failed (exit $status)" >&2; exit "$status"; }
fi
awk -v dir="$scratch/bodies/" 'index($0, dir) == 1 {
    split(substr($0, length(dir) + 1), part, ":")
    number = part[1]; sub(/\.md$/, "", number)
    rule = part[3]; sub(/^ /, "", rule)
    count[number]++
    if (!((number, rule) in seen)) { seen[number, rule] = 1; rules[number] = rules[number] (rules[number] == "" ? "" : ", ") rule }
  }
  END { for (number in count) printf "%s\t%d\t%s\n", number, count[number], rules[number] }' "$scratch/findings.txt" | sort -n > "$scratch/rows.tsv"
count=$(awk 'END { print NR }' "$scratch/rows.tsv")
{
  printf 'The nightly reads each open issue body and each open pull request body under the body rules (`mise run body:prose`, #3591). '
  printf 'It read %s bodies tonight. The table gives each body that breaks a rule.\n\n' "${#bodies[@]}"
  printf '| Body | Findings | Rules |\n| --- | --- | --- |\n'
  awk -F'\t' '{ printf "| #%s | %s | %s |\n", $1, $2, $3 }' "$scratch/rows.tsv"
  printf '\nRun `mise run body:prose <file>` on a body for each sentence and its fix.\n\nfrom: %s\n' "${GITHUB_RUN_URL:-a run by hand}"
} > "$scratch/body.md"
issue_found "$title" > "$scratch/filed.json"
if [[ -z $write ]]; then
  cat "$scratch/body.md"
  echo "report:prose: $count bodies with a finding; REPORT_FILE unset, nothing written" >&2
  exit 0
fi
issue_keep "$title" "$(< "$scratch/filed.json")" "$count" "$scratch/body.md" \
  gh issue create --title "$title" --label collector --label kind:ci --label area:workflow \
  --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
{% endraw %}'''

# The dead-weight report (#2891): each crate's items that no code outside
# tests names, and its exported items that no other crate names, from the
# compiler's evidence records. The merge group's policy job keeps its
# records as the `evidence-records` artifact, so the report builds nothing.
# It reads the newest artifact whose commit has landed on the checked-out
# trunk, and blames each item's lines at that commit. So the job that runs it
# checks out the whole history. `.config/dead-weight/facts.jq` reduces each
# unit's records, in parallel, `verdicts.jq` joins them, `blame.jq` dates each
# item, and `render.jq` writes each crate's body. Their cases are
# `check:dead-weight`'s.
#
# With REPORT_FILE set, each crate keeps one issue, `refactor(<crate>): dead
# weight`: a changed table rewrites it, an unchanged one writes nothing, and
# a crate with no row left closes it. A night writes at most 20 issues and
# opens at most five of them, the closings first and then the crates with
# the most rows, so the actions identity stays within its GraphQL hour
# (`.config/gh/calls.toml`) and the board takes the first report over some
# nights. Without REPORT_FILE, or with `--crate`, the task prints the bodies
# and writes nothing. GH_REPO names the repository.
["report:dead-weight"]
description = "Report each crate's items with no caller outside tests and its exported items with no use in another crate, on one issue per crate"
tools.jq = "1.8.1"
usage = '''
flag "--records <dir>" help="the evidence records read, of the checked-out tree; the newest landed evidence-records artifact by default"
flag "--crate <dir>" help="print the body of one crate, its directory under crates/, with every row, and write nothing"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
rules=$root/.config/dead-weight
source "$root/.config/issues/keep.bash"
source "$root/.config/gh/repo.bash"
# Each row's link names the repository as text, which gh's `{owner}/{repo}`
# cannot give (#5749).
repo=$(repo_name)
write=${REPORT_FILE:-}
grace=14
budget=28000
opening=5
writes=20
if [[ -n ${usage_crate:-} ]]; then write= budget=null; fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
# The records and the commit they describe: a directory named by
# `--records` describes the working tree, and an artifact its run's head.
if [[ -n ${usage_records:-} ]]; then
  records=$usage_records
  commit=$(git rev-parse HEAD)
  rev=
else
  gh api "repos/$repo/actions/artifacts?name=evidence-records&per_page=20" \
    --jq '.artifacts[] | select(.expired | not) | [.workflow_run.id, .workflow_run.head_sha] | @tsv' > "$scratch/artifacts.tsv"
  run=
  while IFS=$'\t' read -r id sha; do
    if git merge-base --is-ancestor "$sha" HEAD 2> /dev/null; then run=$id commit=$sha; break; fi
  done < "$scratch/artifacts.tsv"
  # An artifact keeps for two days, and a merge group keeps one when it
  # lints Rust. So none means no Rust landed in that time, and each table
  # still holds. A failed upload fails its merge group's step.
  if [[ -z $run ]]; then
    echo "report:dead-weight: no unexpired evidence-records artifact of a landed commit; no Rust landed, and the tables stand"
    exit 0
  fi
  records=$scratch/records
  gh run download "$run" --repo "$repo" --name evidence-records --dir "$records"
  rev=$commit
fi
shopt -s nullglob
units=("$records"/*.jsonl)
if (( ${#units[@]} == 0 )); then
  echo "report:dead-weight: $records holds no evidence record" >&2
  exit 1
fi
mkdir "$scratch/facts" "$scratch/dates"
# xargs gives each file after the fixed arguments: `$1` the rules, `$2` the
# directory written, `$3` the file.
printf '%s\0' "${units[@]}" | xargs -0 -P "$(nproc)" -n 1 bash -c '
  unit=$(basename "$3" .jsonl)
  jq -s -c --arg unit "$unit" -f "$1/facts.jq" "$3" > "$2/$unit.json"' _ "$rules" "$scratch/facts"
jq -n -c --rawfile kept "$rules/kept.txt" '{units: [inputs], kept: $kept}' "$scratch"/facts/*.json \
  | jq -c -f "$rules/verdicts.jq" \
  | jq -c --arg crate "${usage_crate:-}" 'map(select($crate == "" or .crate == $crate))' > "$scratch/verdicts.json"
# One blame for each file, over the ranges of its items: `$1` the rules, `$2`
# the directory written, `$3` the revision or nothing, `$4` the file and `$5`
# its ranges.
jq -r 'group_by(.file)[] | [.[0].file, (map([.start, .end]) | unique | tojson)] | @tsv' "$scratch/verdicts.json" \
  | while IFS=$'\t' read -r file ranges; do printf '%s\0%s\0' "$file" "$ranges"; done \
  | xargs -0 -r -P "$(nproc)" -n 2 bash -c '
      mapfile -t flags < <(jq -r ".[] | \"-L\", \"\(.[0]),\(.[1])\"" <<< "$5")
      git blame --porcelain ${3:+"$3"} "${flags[@]}" -- "$4" > "$2/$$.porcelain"
      jq -n -c --rawfile porcelain "$2/$$.porcelain" --argjson ranges "$5" "{porcelain: \$porcelain, ranges: \$ranges}" \
        | jq -c -f "$1/blame.jq" | jq -c --arg file "$4" "with_entries(.key = \"\(\$file):\(.key)\")" > "$2/$$.json"
      rm -- "$2/$$.porcelain"' _ "$rules" "$scratch/dates" "$rev"
jq -s -c 'add // {}' "$scratch"/dates/*.json < /dev/null > "$scratch/dates.json"
# The crates that no other crate names (#6817), each with the epics that its
# README's `## References` names: the report gives such a crate one row that
# waits for its epic, and no row for each item. A crate with a binary is its
# own consumer.
lonely=$(cargo metadata --format-version 1 --no-deps --locked --manifest-path "$root/Cargo.toml" \
  | jq -c --arg root "$root/" '.packages as $all
      | [$all[] | .name as $n | select(all(.targets[]; .kind | index("bin") | not))
          | select([$all[] | select(.name != $n) | .dependencies[].name | select(. == $n)] | length == 0)
          | .manifest_path | ltrimstr($root) | rtrimstr("/Cargo.toml") | select(startswith("crates/")) | ltrimstr("crates/")]' \
  | jq -r '.[]' | while IFS= read -r crate; do
      awk '/^## /{ on = ($0 == "## References"); next } on' "$root/crates/$crate/README.md" 2> /dev/null \
        | { grep -oE '(^|[^[:alnum:]/])#[0-9]+' || :; } | tr -dc '0-9\n' | jq -R 'select(. != "") | tonumber' \
        | jq -s -c --arg crate "$crate" '{($crate): unique}'
    done | jq -s -c 'add // {}')
jq -n -c --slurpfile items "$scratch/verdicts.json" --slurpfile dates "$scratch/dates.json" --arg today "$(date -u +%F)" \
  --argjson grace "$grace" --argjson budget "$budget" --arg repository "$repo" --arg commit "$commit" --argjson lonely "$lonely" \
  '{items: $items[0], dates: $dates[0], today: $today, grace: $grace, budget: $budget, repository: $repository, commit: $commit, lonely: $lonely}' \
  | jq -c -f "$rules/render.jq" > "$scratch/bodies.json"
rows=$(jq 'map(.count) | add // 0' "$scratch/bodies.json")
if [[ -z $write ]]; then
  jq -r '.[] | "# \(.title)\n\n\(.body)\n"' "$scratch/bodies.json"
  echo "report:dead-weight: $(jq length "$scratch/bodies.json") crates, $rows rows at ${commit::9}; nothing written" >&2
  exit 0
fi
gh issue list --repo "$repo" --state all --label kind:refactor --search '"dead weight" in:title' --limit 500 \
  --json number,title,state,body > "$scratch/filed.json"
written=0
opened=0
# The night's write bound: `$1` the title. A crate past it waits for a later
# night, and its table stays as filed until then.
room() {
  if (( written >= writes )); then
    echo "report:dead-weight: $1 waits for a later night; $writes issues written tonight"
    return 1
  fi
  written=$((written + 1))
}
# A crate with no row left closes its open issue, first.
while IFS=$'\t' read -r title crate; do
  room "$title" || continue
  found=$(jq -c --arg title "$title" '[.[] | select(.title == $title) | {number, state, body}] | first' "$scratch/filed.json")
  printf 'No item of `%s` lacks a caller outside tests or a use in another crate at `%s` (#2891).\n' "$crate" "${commit::9}" > "$scratch/body.md"
  issue_keep "$title" "$found" 0 "$scratch/body.md" true
done < <(jq -r --slurpfile bodies "$scratch/bodies.json" '($bodies[0] | map(.title)) as $kept
  | .[] | select(.state == "OPEN") | .title | select(test("^refactor\\(.+\\): dead weight$")) | select(. as $t | $kept | index($t) | not)
  | [., capture("^refactor\\((?<crate>.+)\\)").crate] | @tsv' "$scratch/filed.json")
while IFS= read -r crate; do
  jq -c --arg crate "$crate" '.[] | select(.crate == $crate)' "$scratch/bodies.json" > "$scratch/this.json"
  title=$(jq -r .title "$scratch/this.json")
  jq -r .body "$scratch/this.json" > "$scratch/body.md"
  found=$(jq -c --arg title "$title" '[.[] | select(.title == $title) | {number, state, body}] | first' "$scratch/filed.json")
  # A body names the commit of its records, which moves each night. So a
  # body is the same as the filed one when they differ only in that commit,
  # and an unchanged table writes nothing.
  if [[ $(jq -r '.state // empty' <<< "$found") == OPEN ]] \
    && jq -e --rawfile body "$scratch/body.md" '
      def plain: gsub("\r"; "") | rtrimstr("\n") | gsub("blob/[0-9a-f]{40}/"; "blob/") | gsub("`[0-9a-f]{9}`"; "``");
      (.body | plain) == ($body | plain)' <<< "$found" > /dev/null; then
    continue
  fi
  if [[ $found == null ]]; then
    if (( opened >= opening )); then
      echo "report:dead-weight: $title waits for a later night; $opening issues opened tonight"
      continue
    fi
    room "$title" || continue
    opened=$((opened + 1))
  else
    room "$title" || continue
  fi
  issue_keep "$title" "$found" "$(jq .count "$scratch/this.json")" "$scratch/body.md" \
    gh issue create --repo "$repo" --title "$title" --label kind:refactor --label collector \
    --label "area:$(jq -r .area "$scratch/this.json")" --label priority:backlog --label effort:easy --body-file "$scratch/body.md"
done < <(jq -r 'sort_by(-.count, .crate)[].crate' "$scratch/bodies.json")
{% endraw %}'''

# The threads outside the pool (#3610): every site that states
# `expect(pool_only_threads, reason = "…")` in the crates, with its item and
# its reason, as one Markdown table on standard output. The nightly writes it
# into the reports job's summary, so a reason is read where it is listed. The
# class is the reason's prefix: `io`, `world`, `pool` or `benchmark`. The
# lint, not this list, refuses a thread with no stated reason.
["report:threads"]
description = "List each site that owns a thread outside the pool, with its stated reason"
run = '''
#!/usr/bin/env bash
set -euo pipefail
git ls-files -z -- 'crates/*.rs' | xargs -0 awk '
  FNR == 1 { pending = 0 }
  /^[[:space:]]*pool_only_threads,$/ { pending = 1; site = FILENAME ":" FNR; next }
  pending == 1 && match($0, /reason = "[^"]*"/) {
    reason = substr($0, RSTART + 10, RLENGTH - 11)
    pending = 2
    next
  }
  pending == 2 && match($0, /fn [A-Za-z_][A-Za-z0-9_]*/) {
    item = substr($0, RSTART + 3, RLENGTH - 3)
    class = reason
    sub(/:.*/, "", class)
    sub(/^[a-z]+: /, "", reason)
    rows[++count] = sprintf("|%s|`%s`|`%s`|%s|", class, item, site, reason)
    pending = 0
  }
  END {
    print "## Threads outside the pool"
    print ""
    printf "%d sites own a thread and state why (`pool_only_threads`, #3610).\n\n", count
    print "|Class|Item|Site|Reason|"
    print "|---|---|---|---|"
    for (row = 1; row <= count; row++) print rows[row]
  }
'
'''

# The night's chain report (#6893). Each chain job of the nightly builds the
# driver cold (`.config/nightly/chain-build.bash`) and keeps its build log as
# the artifact `chain-log-<arch>`, and `reports` downloads each one into
# `<logs>`. The task reads each log into the architecture's row
# (`.config/nightly/chain.jq`): the units, the wall, the chain and the slack
# of the longest units off it, with the head and the machine. A log that
# does not read is named and set aside, so one architecture's failure keeps
# the others' rows. For each crate's source on a chain the task counts the
# landings of the four weeks before the head, on the first parent, and
# divides by 4: the edits in a week of the metric of a split. It writes the
# rows into `<logs>/rows`, which the nightly keeps as the artifact `chain`.
# The report puts each row beside the last night's: the rows of the newest
# `chain` artifact of another run on `main` (`.config/nightly/chain-night.jq`
# the rule, `.config/nightly/chain.json` its cases, held by `check:nightly`).
# The report goes to standard output, and the nightly writes it into the job
# summary of `reports`. A chain that grows past the share in one night, on
# the same machine, adds a row to the build's one chain collector, opened on
# its first growth (`.config/issues/keep.bash`). Only with REPORT_FILE set
# does the task write the collector. Without it, the task prints what it
# reads. Given no logs, or logs of no architecture, the task prints the last
# night's rows: a landing that changes a crate's dependencies reads the chain
# there for its pull request. The report never blocks a landing. GH_REPO
# names the repository.
["report:chain"]
description = "Read each architecture's cold build into its chain, report it beside the last night's, and file a growth past the share on the build's chain collector"
tools.jq = "1.8.1"
usage = '''
arg "[logs]" help="the directory of the night's build logs, a `chain-log-<arch>` directory for each architecture; none prints the last night's rows"
flag "--share <percent>" default="10" help="the growth in one night past which the collector takes a row"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/issues/keep.bash"
source "$root/.config/gh/repo.bash"
here=$root/.config/nightly
repo=$(repo_name)
share=${usage_share:?}
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
# The landings of each source on a chain in the four weeks before its row's
# head, on the first parent, divided by 4: one JSON object by source. A head
# that the clone does not hold counts from HEAD.
edits() {
  jq -r '.[] | .head as $head | .chain[] | select(.source != null) | "\($head) \(.source)"' "$1" | sort -u \
    | while read -r head source; do
      git cat-file -e "$head^{commit}" 2> /dev/null || head=HEAD
      since=$(( $(git show -s --format=%ct "$head") - 28 * 86400 ))
      count=$(git rev-list --count --first-parent --since="@$since" "$head" -- "$source")
      jq -n -c --arg source "$source" --argjson count "$count" '{($source): ($count / 4)}'
    done \
    | jq -s -c 'add // {}'
}
run=$(gh api "repos/$repo/actions/artifacts?name=chain&per_page=20" \
  --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == \"main\" and (.workflow_run.id | tostring) != \"${GITHUB_RUN_ID:-}\")] | sort_by(.created_at) | last | .workflow_run.id // empty")
if [[ -n $run ]]; then
  gh run download "$run" --repo "$repo" --name chain --dir "$scratch/last"
else
  echo "report:chain: no night on main kept the chain" >&2
fi
shopt -s nullglob
last=("$scratch"/last/chain-*.json)
jq -s -c . "${last[@]}" /dev/null > "$scratch/last.json"
logs=()
if [[ -n ${usage_logs:-} ]]; then logs=("$usage_logs"/chain-log-*/); fi
if (( ${#logs[@]} == 0 )); then
  [[ -z ${usage_logs:-} ]] || echo "report:chain: $usage_logs holds no chain-log-<arch> directory; the last night's rows follow" >&2
  jq -n -c --argjson share "$share" --slurpfile last "$scratch/last.json" --slurpfile edits <(edits "$scratch/last.json") \
    '{share: $share, run: null, rows: $last[0], last: [], issues: [], edits: $edits[0]}' \
    | jq -r -f "$here/chain-night.jq" | jq -r .summary
  exit 0
fi
mkdir -p "$usage_logs/rows"
for dir in "${logs[@]}"; do
  arch=$(basename "$dir")
  arch=${arch#chain-log-}
  if ! jq -s -c --argjson top 5 -f "$here/chain.jq" "$dir/build.jsonl" > "$scratch/row.json"; then
    echo "report:chain: the $arch build log does not read; the report leaves $arch out" >&2
    continue
  fi
  jq -c --arg arch "$arch" --arg head "$(< "$dir/head")" --arg machine "$(< "$dir/machine")" '{arch: $arch, head: $head, machine: $machine} + .' \
    "$scratch/row.json" > "$usage_logs/rows/chain-$arch.json"
done
rows=("$usage_logs"/rows/chain-*.json)
jq -s -c . "${rows[@]}" /dev/null > "$scratch/rows.json"
title="perf: the build's chain grows past $share % in one night"
found=null
run=null
if [[ -n ${REPORT_FILE:-} ]]; then
  found=$(issue_found "$title")
  run=$(jq -n -c --argjson id "${GITHUB_RUN_ID:?}" --arg url "${GITHUB_RUN_URL:?}" '{id: $id, url: $url}')
fi
jq -n -c --argjson share "$share" --slurpfile run <(printf '%s\n' "$run") --slurpfile found <(printf '%s\n' "$found") --arg title "$title" \
  --slurpfile rows "$scratch/rows.json" --slurpfile last "$scratch/last.json" --slurpfile edits <(edits "$scratch/rows.json") \
  '{share: $share, run: $run[0], rows: $rows[0], last: $last[0], issues: [$found[0] | select(. != null) | . + {title: $title}], edits: $edits[0]}' \
  | jq -c -f "$here/chain-night.jq" > "$scratch/night.json"
jq -r .summary "$scratch/night.json"
if [[ $(jq '.action != null' "$scratch/night.json") == true ]]; then
  jq -r .action.body "$scratch/night.json" > "$scratch/body.md"
  issue_keep "$title" "$found" "$(jq '.grew | length' "$scratch/night.json")" "$scratch/body.md" \
    mise run --quiet issue:file "$title" "$scratch/body.md" kind:defect area:workflow collector >&2
elif [[ -z ${REPORT_FILE:-} && $(jq '.grew | length' "$scratch/night.json") -gt 0 ]]; then
  echo "report:chain: a chain grows past $share %; REPORT_FILE unset, nothing written" >&2
fi
{% endraw %}'''

# How the pull request obligations are answered (#2886): over the pull
# requests merged in a period and the unit issues they close, five tables,
# the lane (the closed unit's first `area:`) as the row and the ISO week of
# the merge as the column: the unit's Concerns marked `no`, the Sources read
# items by disposition, the Readings selected and answered at a site, the
# Refactoring verdicts, the Ledger rows moved. The rule is
# `.config/claims/obligations.jq`, reading the sections through
# `sections.jq` as the checks do, its cases held by `check:claims`. No figure
# is a gate: the coordinator reads the report, and a figure that calls for a
# change becomes a unit.
#
# The period is the month so far (`--since`, `--until` for a hand run,
# `--lane` to keep one lane). With REPORT_FILE set the nightly writes it on
# one `collector` issue per month, `report: obligations, <YYYY-MM>`, and
# closes the previous month's once its last full update is written;
# without, the report is printed. GH_REPO names the repository.
["report:obligations"]
description = "Report how the merged pull requests answer their obligations, by lane and week, on one issue a month"
usage = '''
flag "--since <date>" help="the first merge date read, YYYY-MM-DD; the month's first day by default"
flag "--until <date>" help="the last merge date read, YYYY-MM-DD; today by default"
flag "--lane <area>" help="keep one lane, its area without the `area:` prefix"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
repo=${GH_REPO:-'{owner}/{repo}'}
write=${REPORT_FILE:-}
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
# The report for merges from `$1` to `$2` (YYYY-MM-DD),
# written to `$scratch/body.md`. GitHub's search answers at most 1000
# results a query, fewer than a month's merges, so the period is read a day
# at a time, its days from `period.jq` (#3576). The search leaves out every
# pull request a token cannot read, so the nightly's job grants
# `pull-requests: read`.
render() {
  local days day
  days=$(period "$1" "$2" | jq -r '.days[]')
  : > "$scratch/nodes.jsonl"
  for day in $days; do
    gh api graphql --paginate -F q="repo:$repo is:pr is:merged merged:$day" -f query='
      query($q: String!, $endCursor: String) {
        search(query: $q, type: ISSUE, first: 50, after: $endCursor) {
          pageInfo { hasNextPage endCursor }
          nodes { ... on PullRequest { number mergedAt body
            closingIssuesReferences(first: 5) { nodes { number body labels(first: 20) { nodes { name } } } } } }
        }
      }' --jq '.data.search.nodes[]' >> "$scratch/nodes.jsonl"
  done
  jq -s -c --arg lane "${usage_lane:-}" '[.[]
      | (.closingIssuesReferences.nodes | map(select(any(.labels.nodes[]; .name | startswith("area:")))) | first) as $unit
      | {number, merged: .mergedAt, body: (.body // ""), issue: ($unit.body // null),
         lane: (if $unit == null then "none" else first($unit.labels.nodes[].name | select(startswith("area:")) | ltrimstr("area:")) end)}
      | select($lane == "" or .lane == $lane)] | sort_by(.merged)' "$scratch/nodes.jsonl" > "$scratch/prs.json"
  jq -n -c --arg since "$1" --arg until "$2" --slurpfile prs "$scratch/prs.json" \
    '{since: $since, until: $until, prs: $prs[0]}' \
    | jq -r -L "$claims" -f "$claims/obligations.jq" > "$scratch/body.md"
}
# The period `period.jq` reads from `$1` to `$2`: its days and the month
# before.
period() {
  jq -n -c --arg since "$1" --arg until "$2" '{since: $since, until: $until}' | jq -c -f "$claims/period.jq"
}
# The open issue titled `$1`, or nothing.
filed() {
  gh issue list --state open --label collector --search "\"$1\" in:title" --json number,title \
    | jq -r --arg title "$1" 'first(.[] | select(.title == $title)) | .number'
}
since=${usage_since:-$(date -u +%Y-%m-01)}
until=${usage_until:-$(date -u +%Y-%m-%d)}
span=$(period "$since" "$until")
title="report: obligations, ${since::7}"
if [[ -z $write ]]; then
  render "$since" "$until"
  cat "$scratch/body.md"
  exit 0
fi
previous_since=$(jq -r .previous.since <<< "$span")
previous_title="report: obligations, ${previous_since::7}"
previous=$(filed "$previous_title")
if [[ -n $previous ]]; then
  render "$previous_since" "$(jq -r .previous.until <<< "$span")"
  gh issue edit "$previous" --body-file "$scratch/body.md" > /dev/null
  gh issue close "$previous" --reason completed > /dev/null
  echo "closed #$previous: ${previous_since::7} in full"
fi
render "$since" "$until"
number=$(filed "$title")
if [[ -z $number ]]; then
  gh issue create --title "$title" --label collector --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  gh issue edit "$number" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number"
fi
{% endraw %}'''

# The bootstrap census (#2896, rung 0 of #2895): `ledger/census.md`'s block
# between its `census` markers, the record that picks the first crate to
# rewrite in gandr. Each workspace crate with a library is read from its
# rustdoc JSON as `purposes:items` builds it, without private items: its
# public items as that task lists them, its boundary surface, clauses and
# witnesses by `.config/census/surface.jq`. Its `#[spec]` attributes and its
# lines are counted in its library's Rust sources, test modules left out
# (`tests.rs` and `tests/` under `src/`); its workspace dependencies, the
# `[dependencies]` alone, come from `cargo metadata`; it is on the hotpath
# when a function of it carries a `hotpath::measure` attribute.
# `.config/census/census.jq` ranks and renders them, its cases held by
# `check:census`.
#
# Almost every change to a library moves the census, so no landing is held to
# it. `census.yml` builds it weekly and runs `--check` on the result, which
# writes nothing. A stale census is reported on one `collector` issue,
# `report: bootstrap census`, opened by the first stale week, updated by each
# stale week and closed by a current one; it carries the difference, and
# whoever takes it runs the task and lands the file. `--check` files only with
# REPORT_FILE set; without it a stale census prints its difference and exits
# 1. `--census` takes the census an earlier run built, so the job that files
# builds nothing. GH_REPO names the repository.
["report:bootstrap-census"]
description = "Write ledger/census.md's crate census, or report it stale with --check"
tools.jq = "1.8.1"
usage = '''
flag "--check" help="write nothing: report a stale census, on its issue with REPORT_FILE set"
flag "--census <file>" help="the census an earlier run of this task wrote, taken instead of building one"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
census=.config/census
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
build() {
  mise run --quiet purposes:items > "$scratch/items.tsv"
  jq -R -s '[split("\n")[] | select(. != "") | split("\t") | select(.[2] != "crate" and .[2] != "module") | .[0]]
    | group_by(.) | map({key: .[0], value: length}) | from_entries' "$scratch/items.tsv" > "$scratch/items.json"
  { git grep -l -e 'hotpath::measure' -- 'crates/*/src/**' || true; } \
    | jq -R -s '[split("\n")[] | select(. != "") | split("/")[1]] | unique' > "$scratch/hotpath.json"
  cargo metadata --locked --no-deps --format-version 1 | jq -c '
    (.workspace_root + "/crates/") as $crates
    | [.packages[] | select(.manifest_path | startswith($crates))] as $members
    | ($members | map({key: .name, value: (.manifest_path | ltrimstr($crates) | split("/")[0])}) | from_entries) as $dir
    | $members[]
    | {crate: $dir[.name], deps: ([.dependencies[] | select(.kind == null) | $dir[.name] // empty] | unique)} as $member
    | .targets[]
    | select(any(.kind[]; . == "lib"))
    | $member + {library: (.name | gsub("-"; "_"))}' > "$scratch/crates.jsonl"
  : > "$scratch/rows.jsonl"
  while IFS= read -r member; do
    crate=$(jq -r .crate <<< "$member")
    sources=(":(glob)crates/$crate/src/**/*.rs" ':(exclude,glob)**/tests.rs' ':(exclude,glob)**/tests/**')
    specs=$({ git grep -h -o -e '#\[spec(' -- "${sources[@]}" || true; } | wc -l)
    lines=$(git ls-files -z -- "${sources[@]}" | xargs -0 -r cat | wc -l)
    jq -c -f "$census/surface.jq" "target/purposes/doc/$(jq -r .library <<< "$member").json" > "$scratch/surface.json"
    jq -n -c --argjson member "$member" --argjson specs "$specs" --argjson lines "$lines" \
      --slurpfile surface "$scratch/surface.json" --slurpfile items "$scratch/items.json" --slurpfile hotpath "$scratch/hotpath.json" \
      '$member + $surface[0] + {items: ($items[0][$member.crate] // 0), specs: $specs, lines: $lines, hotpath: ($hotpath[0] | index($member.crate) != null)} | del(.library)' \
      >> "$scratch/rows.jsonl"
  done < "$scratch/crates.jsonl"
  jq -s '{rows: .}' "$scratch/rows.jsonl" | jq -j --rawfile doc ledger/census.md -f "$census/census.jq"
}
if [[ -n ${usage_census:-} ]]; then
  cp "$usage_census" "$scratch/census.md"
else
  build > "$scratch/census.md"
fi
if [[ ${usage_check:-false} != true ]]; then
  cp "$scratch/census.md" ledger/census.md
  echo "report:bootstrap-census: wrote ledger/census.md"
  exit 0
fi
stale=false
diff -u --label 'ledger/census.md, committed' --label 'ledger/census.md, taken now' ledger/census.md "$scratch/census.md" > "$scratch/difference" || stale=true
if [[ -z ${REPORT_FILE:-} ]]; then
  if [[ $stale == true ]]; then
    cat "$scratch/difference"
    echo 'report:bootstrap-census: ledger/census.md is stale; run `mise run report:bootstrap-census` and land it' >&2
    exit 1
  fi
  echo "report:bootstrap-census: ledger/census.md is current"
  exit 0
fi
title='report: bootstrap census'
gh issue list --state all --label collector --search "\"$title\" in:title" --json number,state,title \
  | jq -c --arg title "$title" '[.[] | select(.title == $title)] | first' > "$scratch/filed.json"
number=$(jq -r '.number // empty' "$scratch/filed.json")
state=$(jq -r '.state // empty' "$scratch/filed.json")
head=$(git rev-parse --short HEAD)
if [[ $stale == false ]]; then
  if [[ $state == OPEN ]]; then
    gh issue close "$number" --reason completed --comment "\`ledger/census.md\` is current at $head." > /dev/null
    echo "closed #$number: the census is current"
  else
    echo "report:bootstrap-census: ledger/census.md is current"
  fi
  exit 0
fi
{
  echo "\`ledger/census.md\` is not the census of \`main\` at $head. Run \`mise run report:bootstrap-census\` and land the file (#2896)."
  echo
  if (( $(wc -c < "$scratch/difference") > 60000 )); then
    echo "The difference is $(wc -l < "$scratch/difference") lines, past an issue body's size; \`mise run report:bootstrap-census --check\` prints it."
  else
    echo '```diff'
    cat "$scratch/difference"
    echo '```'
  fi
} > "$scratch/body.md"
if [[ -z $number ]]; then
  gh issue create --title "$title" --label collector --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  [[ $state == OPEN ]] || gh issue reopen "$number" > /dev/null
  gh issue edit "$number" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number: the census is stale"
fi
{% endraw %}'''

# The pull request's title becomes the header of its merge commit on main,
# and the PR title workflow lints it with the commit rules: a conventional
# header of at most 72 characters, its type and scope from
# commitlint.config.mjs.
#
# The head opens on a tree the landing's gate passed on (#5076, #5458): where
# no gate passed on its tree, the task runs `mise run check`, the light
# checks and Clippy with the compiler policy over the packages the change
# reaches. It runs no test, no sweep and no specification obligation, since
# the merge group runs them on each group. A defect's observation is the
# author's to give, so the body's `### Observed` box is written and read here
# (`evidence:obligations --observed-only`). Commit the transcript it asks for,
# then run `pr:open` again.
#
# The body names the issues it works, one per line: `Closes #n` for an issue
# the pull request finishes (GitHub closes it on merge), `Advances #n` for a
# slice of a larger one. On merge, `.github/workflows/claims.yml` takes
# `status:claimed` off every issue the body closes or advances (#1270); a seat
# that goes on to the next slice claims it again when it starts. The
# `## Ledger` section names rows; these lines name issues.
#
# Every pull request stacks on the server's top (#1264): when any pull request
# is open, the branch's own commits are rebased onto the top's branch (`top.jq`:
# the open pull request no other targets, on the longest chain from main). Its
# own commits leave out every other open pull request's, every patch the top
# already carries (`own_fork`, #1298), and every commit below the one the
# branch was last stacked on, recorded in the worktree's git directory
# (`stack_base`, #3877). So a rerun after the top moved never carries another
# pull request's change. Its own commits are read against
# the top's head, and it opens with the top's branch as its base, linked into
# the top's stack (`gh stack link`). Above members already in the merge queue
# only the open members are linked (#1988); where GitHub refuses that link,
# as it does over a pull request queued on its own (#1353), the pull request
# waits unlinked on the top, and GitHub moves it to the trunk when the queued
# one merges. The task prints which path it took. With nothing open it opens
# against the trunk. The top is read again just before the push: a
# new top stacked above the read one that changes none of the branch's
# paths takes the branch without a new gate, and any other move is
# refused (`restack_moved`, `moved.jq`, #3849).
#
# Every new pull request targets the top of the latest stack, queued or not
# (#1983): a top not landing is read first, and with every open pull request
# landing the top is the queued chain's. The new one is rebased onto that
# top's head, measured against it, and opened on its branch unlinked. When
# the queued top merges and its branch is deleted, GitHub moves the pull
# request to main, and it is the bottom of the next chain; `pr:land`
# retargets what stands on a landing's branches first (`retarget_landing`,
# #1420) as belt and braces. Nothing waits for the queue, and nothing opens a
# second root on main.
#
# A prefix a landing is queueing carries the `landing` label (#1556) while
# the landing waits on its members' required checks. A top carrying it is
# waited out (`await_top`), never the queue: once the prefix is queued the
# label is gone and the new pull request opens on the queued top. The top is
# read at the start and again just before the push
# (#1601): a landing started between the two reads holds and queues the
# top. A top changed or restacked by
# then is refused, to be opened again.
#
# The merge queue's own landings move the trunk past an open top, so a branch
# stacked on it builds on a trunk that lacks each repair since: its gate fails
# on a test the trunk already repairs (#6760, #6707 on #6759). A top behind
# the trunk that is not queued, held or conflicting is therefore restacked
# onto the tip first, its whole stack in one push (`restack_behind`). A
# restack that stops leaves the top, pages its lanes and the coordinator, and
# the task opens on the trunk beside it.
#
# A top can still lack a change of the trunk that the new pull request builds
# on (#3654): it forked before the change merged. The rebase onto it then
# conflicts, though the own commits apply to the trunk. A top bound for the
# trunk carries the change once it merges or its seat rebases it: one queued
# and one conflicting with the trunk within its seat's claim window. Each is
# a future event, so the task prints what it waits on and an `arm:` line for
# `pr:await` on the top, and exits 0 (#4164, `bound.jq`): the seat arms the
# job and ends its turn, and the job's exit wakes it to run `pr:open` again.
# A top conflicting past the window has no seat rebasing it, so the task
# stacks past it, on the highest pull request below it that does not
# conflict, or on the trunk as a second bottom (`stack_on_top`). A top held
# as a draft is refused, naming the changes it lacks.
#
# The rule runs from the branch the task is run on, so a branch that lacks a
# change main made to `.config/pr-stack` is refused until it is rebased onto
# main (`stacking_current`): a branch forked before a fix runs the rule the
# fix replaced.
#
# A fix the open stack waits on cannot stack on it: it would land behind the
# pull request it unblocks. `--unblocks <n>` names that pull request, and the
# fix opens as a second bottom on main, measured against main, and is set to
# auto-merge so it queues on its own (#1353). The body must name #n. Once it
# merges, `pr:land` from the red stack restacks it onto main. Every
# other second bottom is refused.
#
# The body must work the branch's issue: a branch `<lane>-<n>-<slug>` is
# refused unless the body says `Advances #n` or closes #n, and a branch with
# no number unless the body works some issue, so the merge takes the claim
# off what it worked (`claims.yml`, #2462). It answers the sources the issues
# it works request (#2499): every key an issue's `## Sources` names has an
# item in the body's `## Sources read` with a disposition and its evidence,
# and a `supersedes` item is refused while a tracked line still names the old
# key without marking it demoted. It answers every reading axis once it works
# a unit (#2522, #2955): each axis's row in the body's `## Readings` reads
# `answered: <exemplar or site>`, `trivial: <what it reduces to>`,
# `not applicable: <what the change lacks that the axis asks about>` or
# `deferred: #n`, never `not selected` or a bare form, and an axis an issue
# selects answered other than `answered:` takes a `departed:` item keyed by
# the axis in `## Sources read`; an issue it works whose reading is still the
# migration's `unstated` placeholder is refused until the seat restates it
# on the issue. It names each concern it touches
# (#2523): each `## Concerns` item names a concern of `ledger/concerns.sql`
# with `within`, `consolidated: <what merged>` or `new concern: <why none
# fits>`, the last for a row the change adds, and a module or crate the change
# adds (since `evidence:base`) under a concern whose sites all lie in other
# crates is refused unless the body declares it `consolidated` or a
# `new concern`. A change to the parser, its grammar or its syntax tree
# states its surface form (#2527): a `### Surface form` subsection with a
# `cost:` line and a `demand: <site>` line; the goldens `corpus:goldens`
# records there ask for none (#2756). A closing keyword closes only from the
# head's `Closes #n` lines (#2980): one anywhere else is refused, since
# GitHub closes the issue it names on merge. Every body answers
# `## Refactoring` (#2884): `yes`, `maybe` or `no`, and for the first two a
# table `| Kind | Where | Observation |`, each `Where` resolved by
# `check:refactoring` against the rustdoc JSON, which it builds when a
# `Where` needs it. A body answers its issues' `## Engineering` with measured
# numbers, and a `spec_clause_traversal` waiver or an `economy:` ceiling the
# change adds cites the open issue that removes it (#5039,
# `.config/claims/ceilings.bash`). The rule is
# `.config/claims/opening.jq`, reading the sections through `sections.jq`, its
# cases held by `check:claims`; a `note:` line it prints does not refuse.
# Each issue the body works, an epic or a `collector` aside, passes
# `unit:check` and carries the coordinator's `shape:signed` (#3134,
# `.config/claims/signed.jq`): the seat that sections an issue on its claim
# pages for the label and works on, and the landing waits for it. A missing
# label is a wait (#4164): with nothing else refused, the task prints its
# `wait:` line and an `arm:` line for `pr:await` on the issue, and exits 0. A
# body working a `collector` (#3326) `Advances` it, never closes it, and lists the
# rows it clears under `## Rows`, each an open row as the collector keys it.
#
# Vault pages are cited by their mint (#2793). With the vault checkout
# `$XDG_CONFIG_HOME/gandr/references` names, the task writes each page's
# `vault:<mint>` beside its filename in the body's `## Sources read`
# (`annotated.jq`), so the item's key is the one a crate carries verbatim.
# When an issue marks a vault page primary and the change touches a crate's
# sources, that crate must cite the page in a `# References` line, or the
# body marks the page `read: <what it informed>`. Without the checkout,
# neither applies.
#
# Before anything else the task sweeps the clone's landed worktrees and
# refuses under the disk floor (`wt:sweep --guard`).
#
# `--hold "<reason>"` opens it held by the owner (#3253): a draft labelled
# `hold:owner` with the reason commented (`pr:hold --owner`), unlinked,
# which nothing lands until `pr:release`.
["pr:open"]
description = "Open the pull request on the server's top once its tree passes the landing's gate"
usage = '''
arg "<title>" help="the pull request title: a conventional header"
arg "<body>" help="the body file; a defect's observation block is written in place"
flag "--unblocks <number>" help="the open pull request this fix unblocks: open on the trunk and queue on its own"
flag "--hold <reason>" help="the owner holds it: open it as a draft labelled `hold:owner` (`pr:hold --owner`), unlinked"
'''
# `findings.jq` stops jq 1.8.2 at an assertion; the claim tasks pin 1.8.1.
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
body=$(realpath "${usage_body:?}")
source "$(git rev-parse --show-toplevel)/.config/gh/repo.bash"
repo=$(repo_name)
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
own=$(git branch --show-current)
[[ -n "$own" && "$own" != "$trunk" ]] || { echo "pr:open opens the checked-out branch; check out a unit branch, not $trunk" >&2; exit 2; }
if existing=$(gh pr view "$own" -R "$repo" --json number,state --jq 'select(.state == "OPEN") | .number' 2> /dev/null) && [[ -n "$existing" ]]; then
  echo "$own already has PR #$existing open; land it with \`pr:land\`" >&2
  exit 2
fi
claims=$(git rev-parse --show-toplevel)/.config/claims
issues=$(jq -Rrs -L "$claims" 'include "targets"; targets(working) | unique[]' "$body" \
  | while IFS= read -r number; do gh api "repos/$repo/issues/$number" --jq '{number, body: (.body // ""), labels: [.labels[].name]}'; done \
  | jq -s .)
mentions=$(jq -Rrs -L "$claims" 'include "sections"; superseded[]' "$body" \
  | while IFS= read -r key; do { git grep -nIF -e "$key" || true; } | jq -R . | jq -s --arg key "$key" '{($key): .}'; done \
  | jq -s 'add // {}')
# Measured on a fetched trunk (#3148, `measured_from`), and refused first when
# the branch rides a rewritten trunk with no stack base (#5990).
if ! refusal=$(rewritten_base); then
  echo "$refusal" >&2
  exit 2
fi
from=$(measured_from)
concerns_at() { { git show "$1:ledger/concerns.sql"; printf '%s\n' "$2"; } | sqlite3 -json; }
ids=$(concerns_at HEAD 'SELECT id, issue FROM concern ORDER BY id;')
had=$(concerns_at "$from" 'SELECT id FROM concern ORDER BY id;')
sites=$(concerns_at HEAD 'SELECT concern, crate, module FROM site ORDER BY concern, crate, module;')
concerns=$(jq -n --argjson ids "${ids:-[]}" --argjson had "${had:-[]}" --argjson sites "${sites:-[]}" \
  '{ids: [$ids[].id], rows: $ids, base: [$had[].id], sites: $sites}')
added=$(git diff --no-renames --name-only --diff-filter=A "$from" HEAD -- ':(glob)crates/*/src/**/*.rs' | jq -R . | jq -s .)
# The added modules that a crate of the base already holds at the same path
# below `src` (#7055): a module moved between crates is no new module of a
# concern. Each side is written with no `.rs` and no `/mod`.
module_paths() { awk '{ sub(/^crates\/[^\/]+\/src\//, ""); sub(/\.rs$/, ""); sub(/\/mod$/, ""); print }' | sort -u; }
held=$(comm -12 <(jq -r '.[]' <<< "$added" | module_paths) \
  <(git ls-tree -r --name-only "$from" -- crates | awk -F/ '$3 == "src" && /\.rs$/' | module_paths) | jq -R . | jq -s .)
# The lines the change adds where a defect's regression is named (#2524,
# #3538), every file kind `opening.jq`'s `regression` reads (#4863).
regressions=$("$claims/regressions.bash" "$from")
# The comment lines the change removes and does not add back, per source
# (#6004, `comments.bash`), which `opening.jq`'s `facts_kept` counts.
comments=$("$claims/comments.bash" "$from")
# The ceilings the change adds (#5039, `ceilings.bash`), each with the issues
# it cites that stand open: one read per issue cited.
ceilings=$("$claims/ceilings.bash" "$from")
open=$(jq -r '[.[].cites[]] | unique[]' <<< "$ceilings" \
  | while IFS= read -r n; do gh api "repos/$repo/issues/$n" --jq 'select(.state == "open" and .pull_request == null) | .number' 2> /dev/null || :; done \
  | jq -s -c .)
ceilings=$(jq -c --argjson open "$open" 'map(. + {open: [.cites[] | select(IN($open[]))]})' <<< "$ceilings")
# The `gh` call sites the change alters (#5061, `.config/gh/changed.bash`),
# each of which the body prices under `## API budget`.
budget=$("$claims/../gh/changed.bash" "$from")
# The paths the change touches in the parser, its grammar and its syntax tree
# (#2527); `opening.jq` sets aside the goldens among them (#2756).
surface=$(git diff --no-renames --name-only "$from" HEAD -- crates/surface-parser crates/surface-grammar crates/surface-syntax | jq -R . | jq -s .)
# The vault pages the issues name, and the crates' citations of them (#2793).
# With a vault checkout configured (`.config/references/vault.bash`), each
# resolved page's `vault:<mint>` is written beside its filename in the body's
# `## Sources read`, and `opening.jq` asks each crate whose sources the change
# touches to cite the issues' primary pages; without one, as in CI, neither.
source "$(git rev-parse --show-toplevel)/.config/references/vault.bash"
source "$(git rev-parse --show-toplevel)/.config/references/ledger.bash"
vaultdir=$(mktemp -d)
pages=$(vault_pages)
if [[ $pages == null ]]; then
  echo null > "$vaultdir/vault.json"
else
  git ls-files | awk -F/ '{ print $NF }' | sort -u > "$vaultdir/tree"
  printf '%s\n' "$pages" > "$vaultdir/pages.json"
  jq -n --rawfile body "$body" --slurpfile pages "$vaultdir/pages.json" --rawfile tree "$vaultdir/tree" '{body: $body, pages: $pages[0], tree: $tree}' \
    | jq -j -L "$claims" -f "$claims/annotated.jq" > "$vaultdir/body"
  if ! cmp -s "$vaultdir/body" "$body"; then
    cp "$vaultdir/body" "$body"
    echo "wrote each vault page's \`vault:<mint>\` beside its filename in $body's \`## Sources read\`"
  fi
  git diff --no-renames --name-only "$from" HEAD -- ':(glob)crates/*/src/**' ':(glob)crates/*/README.md' \
    | awk -F/ '{ print $2 }' | sort -u > "$vaultdir/touched"
  : > "$vaultdir/cites"
  if [[ -s "$vaultdir/touched" ]]; then
    mapfile -t cited_sources < <(references_sources | awk -F/ 'NR == FNR { touched[$0] = 1; next } touched[$2]' "$vaultdir/touched" -)
    if (( ${#cited_sources[@]} )); then
      LC_ALL=C awk -f .config/references/cites.awk "${cited_sources[@]}" | awk -F'\t' '$1 == "cite" { print $3 "\t" $2 }' > "$vaultdir/cites"
    fi
  fi
  jq -n --slurpfile pages "$vaultdir/pages.json" --rawfile tree "$vaultdir/tree" --rawfile touched "$vaultdir/touched" --rawfile cites "$vaultdir/cites" -L "$claims" \
    'include "vault"; {pages: $pages[0], tree: ($tree | vault_tree), touched: ($touched | split("\n") | map(select(. != ""))),
      cited: ($cites | split("\n") | map(select(. != "") | split("\t")) | group_by(.[0]) | map({key: .[0][0], value: (map(.[1]) | unique)}) | from_entries)}' \
    > "$vaultdir/vault.json"
fi
# Each reading reaches `opening.jq` through a file, never as an argument: it
# grows with the change past the argument limit (`opening-input.bash`, #7076).
# `vault.json` is written above.
source "$claims/opening-input.bash"
for reading in "${opening_readings[@]}"; do
  if [[ $reading != vault ]]; then printf '%s\n' "${!reading}" > "$vaultdir/$reading.json"; fi
done
findings=$(opening_input "$vaultdir" "$own" "$body" | jq -r -L "$claims" -f "$claims/opening.jq")
# Each issue the body works is sectioned and signed (#3134, `signed.jq`).
signed=$(jq -n --slurpfile issues <(printf '%s\n' "$issues") '{issues: $issues[0]}' \
  | jq -r -L "$claims" --argjson concerns "$(jq -c .rows <<< "$concerns")" --argjson cutoff "$(jq -R -s -f "$claims/cutoff.jq" "$claims/../references/window.toml")" -f "$claims/signed.jq")
if [[ -n $signed ]]; then findings=${findings:+$findings$'\n'}$signed; fi
# A design page an issue builds on is absorbed in the same pair, or the body
# says why it stays design (#3161, `absorbing.jq`).
absorbing=$(jq -n --rawfile body "$body" --slurpfile issues <(printf '%s\n' "$issues") --slurpfile absorption <(vault_absorption) \
  '{body: $body, issues: $issues[0], absorption: $absorption[0]}' | jq -r -L "$claims" -f "$claims/absorbing.jq")
if [[ -n $absorbing ]]; then findings=${findings:+$findings$'\n'}$absorbing; fi
rm -rf "$vaultdir"
# A `wait:` line names a future event, never a refusal (#4164): with nothing
# else refused, the task prints it and its `arm:` line and exits 0, the seat
# arms `pr:await`, and its exit wakes the seat to run `pr:open` again.
if [[ -n "$findings" ]]; then
  if grep -qvE '^(note|wait|arm): ' <<< "$findings"; then echo "$findings" >&2; exit 2; fi
  if grep -q '^arm: ' <<< "$findings"; then echo "$findings"; exit 0; fi
  echo "$findings" >&2
fi
# The title and the body name nothing private and keep the body rules before
# anything is built (#3849), so a long sentence costs no gate; they are read
# again as posted, once the observation block is written.
mise run --quiet body:check --title "${usage_title:?}" "$body"
mise run --quiet body:prose "$body"
# The features ledger rows the body names against those the change touches
# (#2525), as notes: `pr:land` refuses them once the number is known.
if ! ledger=$(mise run --quiet ledger:patched "$body" "$from" 2> /dev/null); then
  printf '%s\n' "${ledger:-ledger:patched failed to read the ledger}" | sed 's/^/note: /' >&2
fi
# The issues the body closes against the rows that owe them (#6767): GitHub
# closes each such issue when the pull request merges, and a row that still
# owes one turns `check:ledger` red for every lane from then on. The gate
# reads only the commits' `Closes` lines, so the task reads the body here.
LEDGER_BODY="$body" "$(git rev-parse --show-toplevel)/.config/ledger/check.bash" \
  || { echo "name an open issue that owes the rest of each row above, or move the row to implemented, then run \`pr:open\` again" >&2; exit 2; }
# A reserved grammar rule the change lowers without an open issue naming it
# (#2528, `ledger:reserved`), as notes: `pr:land` refuses it.
if ! reserved=$(mise run --quiet ledger:reserved "$from" 2> /dev/null); then
  printf '%s\n' "${reserved:-ledger:reserved failed to read the ledger}" | sed 's/^/note: /' >&2
fi
# A defect's observation in the running program (#3758) is the author's to
# give, so it is read here with no Rust evidence built
# (`evidence:obligations --observed-only`). The cheap reads go first.
status=0
mise run evidence:obligations --body "$body" --require-acknowledged --observed-only "$from" || status=$?
if (( status == 2 )); then
  echo "commit the transcript that the open \`### Observed\` box in $body asks for, then run \`pr:open\` again" >&2
  exit 2
fi
(( status == 0 )) || exit "$status"
# Every `Where` of the body's `## Refactoring` names an item of the
# workspace's rustdoc JSON, built by `check:refactoring` when a `Where` needs
# it, or a tracked path (#2884, `check:refactoring`).
mise run --quiet check:refactoring "$body" \
  || { echo "name each \`## Refactoring\` \`Where\` as the workspace carries it, then run \`pr:open\` again" >&2; exit 2; }
# Each item, test, ledger row and file that the change takes out has its row
# in the body's `## Deletes`, and each deletion the architect's sign-off at a
# head that the change keeps (#6817, `check:deletes`). A test whose text
# changes has its row in `## Preserved and changed`.
mise run --quiet check:deletes --title "${usage_title:?}" "$body" "$from" \
  || { echo "account for what the change takes out in \`## Deletes\`, then run \`pr:open\` again" >&2; exit 2; }
# Landed worktrees go before anything else, and under the disk floor the
# task refuses (`wt:sweep --guard`).
mise run wt:sweep --guard
stacking_current || exit 2
# The head is gated where no gate passed on its tree (#5458, `mise run
# check`): the light checks, and Clippy with the compiler policy over the
# packages the change reaches. It is gated on its own fork, before the stack
# below adds its commits to the change. A reworded commit or a rebase that
# changes nothing keeps its tree, so its gate counts (#5076,
# `.config/gate-scope/passed.bash`). The gate reads the work, so work that
# HEAD does not hold is refused first.
passed=$(git rev-parse --show-toplevel)/.config/gate-scope/passed.bash
# A stacked head keeps each generated artifact its own commits hold, while the
# base below them moved (#6144). Before the push, `stale.bash` runs the check
# of each artifact that one side wrote from inputs the other side changed. The
# old base is the gated head less its own commits; a head the stack did not
# move reads an empty change and runs nothing.
replay=$(git rev-parse --show-toplevel)/.config/replay/stale.bash
replayed() {
  local fork old
  fork=$(git merge-base HEAD "origin/$base")
  old=$(git rev-parse --verify --quiet "$gated~$(git rev-list --count "$fork..HEAD")") || old=$fork
  "$replay" "$old" "$fork" HEAD
}
if ! "$passed" require pr:open HEAD 2> /dev/null; then
  [[ $("$passed" tree) == "$(git rev-parse 'HEAD^{tree}')" ]] \
    || { echo "the work holds changes that HEAD does not; commit or drop them, then run \`pr:open\` again" >&2; exit 2; }
  mise run check
  "$passed" require pr:open HEAD || exit 2
fi
gated=$(git rev-parse HEAD)
unblocks=${usage_unblocks:-}
if [[ -n "$unblocks" ]]; then
  [[ "$unblocks" =~ ^[0-9]+$ && $(gh pr view "$unblocks" -R "$repo" --json state --jq .state 2> /dev/null) == OPEN ]] \
    || { echo "--unblocks names #$unblocks, which is not an open pull request" >&2; exit 2; }
  grep -qE -- "#$unblocks([^0-9]|\$)" "$body" \
    || { echo "the body must name #$unblocks, the pull request this fix unblocks" >&2; exit 2; }
  top=null
else
  top=$(await_top "$own")
fi
git fetch --quiet origin "$trunk"
stack_on_top "$own" "$top" || { status=$?; (( status == 3 )) && exit 0; exit 1; }
top=$stacked_top
if [[ "$top" == null ]]; then
  base=$trunk
  measured=$(mise run --quiet evidence:base)
  if [[ -n "$stacked_past" ]]; then echo "opening against $trunk past #$stacked_past"
  elif [[ -z "$unblocks" ]]; then echo "no pull request is open: opening against $trunk"; fi
else
  base=$(jq -r .head <<< "$top")
  top_number=$(jq -r .number <<< "$top")
  measured=origin/$base
fi
# The branch's own commits, from the top's head (or the trunk's fork) to
# HEAD, keep the commit rules and each changes something (#2640): a
# trailer-less or empty commit, such as a copy of a merged commit a rebase
# flattened, fails the format gate in the queue and holds the stack above it.
COMMITLINT_BIN=$(mise which commitlint) "$(git rev-parse --show-toplevel)/.config/commits/lint.bash" "$measured" HEAD --empty \
  || { echo "drop or amend each commit above, so every own commit keeps the commit rules, then run \`pr:open\` again" >&2; exit 2; }
# Nor does it add a file named as residue (`.config/merge-residue/names`):
# a merge driver's backup, or a tool's leftover such as `wt:warm`'s clone
# probe (#3222), staged by a `git add -A`.
if foreign=$(git diff --no-renames --name-only --diff-filter=A "$measured" HEAD \
  | grep -E -f "$(git rev-parse --show-toplevel)/.config/merge-residue/names"); then
  printf 'the change adds files named as residue; drop them from its commits, then run `pr:open` again:\n%s\n' "$(sed 's/^/  /' <<< "$foreign")" >&2
  exit 2
fi
# A top that moved since it was read is restacked onto
# when it stands above the measured fork and shares no path with the change,
# and refused otherwise (#3849, `restack_moved`).
# A branch stacked past a top no seat rebases stays where it stacked
# (#4164): that top would read as moved.
if [[ -z "$unblocks" && -z "$stacked_past" ]]; then
  restack_moved "$own" "$top" "$measured" || exit 2
  top=$stacked_top
  if [[ "$top" != null ]]; then
    base=$(jq -r .head <<< "$top")
    top_number=$(jq -r .number <<< "$top")
  fi
fi
# A second bottom is refused unless it unblocks the open stack: with any other
# pull request open and not landing, the base is a branch of the stack.
if [[ -z "$unblocks" && -z "$stacked_past" && "$base" == "$trunk" && $(landable_prs | jq --arg own "$own" '[.[] | select(.head != $own and (.landing | not))] | length') != 0 ]]; then
  echo "$own would open a second bottom on $trunk while another pull request is open; run \`pr:open\` again to stack it on the top" >&2
  exit 2
fi
# The title and the body, as they will be posted, name nothing private
# (`body:check`, #2530) and keep the body rules (`body:prose`, #3591).
mise run --quiet body:check --title "${usage_title:?}" "$body"
mise run --quiet body:prose "$body"
# The head that is pushed carries the gate (#5091): a restack above rebases
# the branch onto the top and changes its tree. The gate on the branch's own
# commits counts while the rebase keeps their patches (`passed.bash carry`),
# and the merge queue checks the combination. A generated artifact is the
# exception: the merge queue requires no check of the recovery records, so
# `replayed` reads each artifact the move makes due (#6144). The stack is first
# come, first served: no `pr:open` waits on another, and no seat gates again
# because another seat opened first. A rebase that changes a patch gates the
# new head.
"$passed" carry "$gated" HEAD "$(git merge-base HEAD "origin/$base")" || mise run check
"$passed" require pr:open HEAD || exit 2
replayed || exit 2
# The stack goes on from no draft (#6797): a draft holds every pull request
# above it. The top was read through the budget's shared cache, and a seat
# can hold it in the seconds since, so it is read again fresh before the
# push. Nor does the branch hold a commit of another open pull request past
# the base it opens on (`foreign_commits`): a landing would squash it under
# this title.
if [[ "$top" != null ]]; then
  gh_budget_stale
  if [[ $(top_reading "$top_number" | jq -r .draft) == true ]]; then
    echo "the top #$top_number is a draft since it was read, and a draft holds every pull request above it; run \`pr:open\` again to stack on the top below it" >&2
    exit 2
  fi
fi
foreign=$(foreign_commits null "$own" "$base" HEAD) || { echo "the commits of $own past $base cannot be read; run \`pr:open\` again" >&2; exit 2; }
if [[ "$foreign" != '[]' ]]; then
  echo "past $base the branch holds $(jq -r 'map("\(.commits) commit(s) of #\(.number)") | join(", ")' <<< "$foreign"), which a landing would squash under this title (#6797); rebase it onto the pull request it builds on, then run \`pr:open\` again" >&2
  exit 2
fi
git push --quiet --force-with-lease -u origin HEAD
hold=${usage_hold:-}
url=$(gh pr create -R "$repo" --base "$base" --head "$own" --title "${usage_title:?}" --body-file "$body" ${hold:+--draft})
echo "$url"
# Held from its opening (#3253): a held pull request is no member of a stack,
# so it is not linked, and nothing lands it until `pr:release`.
if [[ -n "$hold" ]]; then
  mise run --quiet pr:hold --owner "${url##*/}" "$hold"
  exit 0
fi
if [[ -n "$unblocks" ]]; then
  gh pr merge "${url##*/}" -R "$repo" --merge --auto
  echo "#${url##*/} opens on $trunk to unblock #$unblocks and queues on its own; once it merges, \`pr:land\` from the red stack restacks it onto $trunk"
fi
# Two `pr:open`s that read the same top at once open on one base, and the
# stack goes on from one of them only (`beside.jq`). The later one moves
# onto the top read again, as `restack_moved` moves onto a top that moved
# (#3849). One that cannot move is held, naming the pull request beside it.
if [[ -z "$unblocks" && -z "$stacked_past" ]]; then
  number=${url##*/}
  beside=$(landable_prs | jq -c --argjson n "$number" --arg base "$base" -f "$(git rev-parse --show-toplevel)/.config/pr-stack/beside.jq")
  if [[ "$beside" != null ]]; then
    if restack_moved "$own" "$top" "$measured" && [[ "$stacked_top" != "$top" ]]; then
      top=$stacked_top
      base=$(jq -r .head <<< "$top")
      top_number=$(jq -r .number <<< "$top")
      "$passed" carry "$gated" HEAD "$(git merge-base HEAD "origin/$base")" || mise run check
      "$passed" require pr:open HEAD || exit 2
      replayed || exit 2
      git push --quiet --force-with-lease origin HEAD
      if ! set_base "$number" "$base"; then
        mise run --quiet pr:hold "$number" "opened beside #$beside on one base, and its base cannot move onto #$top_number: rebase it onto the top, then \`pr:release $number\`"
        exit 0
      fi
      echo "#$number opened beside #$beside on one base; it moves onto #$top_number"
    else
      mise run --quiet pr:hold "$number" "opened beside #$beside on one base: rebase it onto the top, then \`pr:release $number\`"
      exit 0
    fi
  fi
fi
# The base agrees with the branch once the pull request stands (#6797):
# another seat's `pr:land` or cut can move the base in the seconds since the
# opening, and keep the branch. A base that disagrees holds the pull request.
if [[ -z "$unblocks" ]]; then
  number=${url##*/}
  foreign=$(foreign_commits "$number" "$own" "$(gh pr view "$number" -R "$repo" --json baseRefName --jq .baseRefName)") || foreign='[]'
  if [[ "$foreign" != '[]' ]]; then
    mise run --quiet pr:hold "$number" "its branch holds $(jq -r 'map("\(.commits) commit(s) of #\(.number)") | join(", ")' <<< "$foreign") past its base: set its base to the pull request it builds on, or rebase it, then \`pr:release $number\`"
    exit 0
  fi
fi
# A stack of one means its top merged after its first reading and before
# this reading: GitHub moves the pull request to the trunk, and `gh stack
# link` takes no chain of one, so nothing is linked (#3817). The next landing
# queues it.
if [[ "$base" != "$trunk" ]]; then
  number=${url##*/}
  stack=$(server_stack "$number")
  queued=$(queued_of "$stack")
  if [[ $(jq length <<< "$stack") == 1 ]]; then
    echo "#$number opens on $trunk, unlinked: #$top_number merged while it opened, and the next landing queues it"
  elif [[ "$queued" == '[]' ]]; then
    stack_link "$stack"
    echo "#$number stacked on #$top_number: $(jq -r 'map("#\(.number)") | join(" ← ")' <<< "$stack")"
  elif stack_link "$(jq -c --argjson queued "$queued" '[.[] | select(.number | IN($queued[]) | not)]' <<< "$stack")" 2> /dev/null; then
    echo "#$number stacked on #$top_number above the queued #$(jq -r '.[-1]' <<< "$queued"): $(jq -r 'map("#\(.number)") | join(" ← ")' <<< "$stack")"
  else
    echo "#$number waits unlinked on $base above the queued #$(jq -r '.[-1]' <<< "$queued"): GitHub moves it to $trunk when that one merges, and the next landing links and queues it"
  fi
fi
{% endraw %}'''

# Head checks and merge-group checks are separate runs. Watch the queue entry
# as well as the pull request; green head checks alone do not prove landing.
# The entry runs every workflow with a merge_group trigger; each is reported.
# The task sweeps the clone's landed worktrees first (`wt:sweep`), and once
# the pull request merged it removes the branch's own worktree.
# Open the pull request with `pr:open`; never `gh pr create --fill` on a branch
# of several commits: it titles the pull request with the branch name.
#
# Every landing is a stack's (#1264), read from the server, the only record:
# the pull request's base chain down to the trunk and the open pull requests based
# on it up to the top (`chain.jq`). What lands is the largest prefix that is
# ready (#1988, `land_prefix`, decided by `.config/pr-stack/prefix.jq`, its
# cases held by `check:pr-stack`), in units (#2046): every member green on
# the trunk's required contexts and free of conflicts is queued, up to the
# first red, pending or conflicting one (#2783), which the task names with
# what cuts it, and at most the smaller of the queue's
# `max_entries_to_merge` and `max_entries_to_build` members at once; a
# queued unit below that is topped up with the green members above it
# (#2096), and once it is full the next unit goes in when it merged. The
# queue merges a queued stack whole, so a longer unit waits
# for every member's group to be built before any of it merges. The tail
# above the prefix is the next stack. The task runs from any member, and the
# caller's own pull request need not be in the prefix: with something below
# it red or pending the task says so and exits 0, and `pr:watch` lands the
# stack the moment that one goes green; with units below it queued the task
# queues each in turn until its own is. A chain of one is a plain landing, by
# auto-merge, unless it is the last open member of a server stack, which
# GitHub refuses auto-merge and `gh stack merge` queues; a longer one is
# linked (`gh stack link`) and queued as one group by `gh stack merge` up to
# the unit's top, and the task waits on the caller's pull request when it is
# in the queue. A stack whose top holds the branch of a pull request queued on
# its own outside it (`carried_queued`) waits for that one to merge and reads
# the stack again, unless that one is queued off the trunk, on a base no open
# pull request heads: its queue merges nothing, so the stack lands past it
# and names it (`carried.jq`, #4168).
# Before any queueing, every open pull request on a branch the landing
# deletes, outside it, is retargeted to the trunk (`retarget_landing`, #1420); one
# linked into the landing's stack is left alone (#1520). A bottom standing
# off the trunk, on a base that merged or is gone, leaves the queue and its
# server stack and is retargeted to the trunk; one on an unmerged branch is
# refused by name (`bottom.jq`, `retarget_bottom`, #4168).
#
# Nothing is restacked before the queue: a restack moves every head and
# reruns every check, so a ready prefix would wait a checks cycle for a
# rebase the queue does itself when it builds the merge group. A prefix that
# comes back unmergeable is restacked by `pr:watch`.
#
# Before the landing, when the checked-out branch is the pull request's own,
# its head queues only on a tree the landing's gate passed on (#5458). A
# rebase that changes the tree leaves no gate on it, so the task runs
# `mise run check` on the head again; a tree a gate passed on is not gated
# again. It reads no specification obligation: the merge group runs the tests
# on each group.
#
# A queued stack member leaves the queue alone only by being closed and
# reopened: `dequeuePullRequest` looks for a queue on the member's own base
# branch and finds none, a push to a queued branch is refused, and a stack
# member's base cannot be edited. The members below it stay queued.
["pr:land"]
description = "Queue the ready prefix of the pull request's stack and wait for the merge queue outcome"
tools.jq = "1.8.1"
usage = '''
arg "[number]" help="pull request number; defaults to the current branch"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:-}
if [[ -z "$number" ]]; then number=$(gh pr view --json number --jq .number); fi
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
source "$(git rev-parse --show-toplevel)/.config/gh/repo.bash"
repo=$(repo_name)
deadline=$((SECONDS + 5400))
queued=false
previous=
# Set when the entry first leaves the queue with every run green while the
# pull request still reads OPEN: the poll waits for MERGED until then.
merging_until=

# One poll's reading of the pull request and its queue entry, from
# `pr_reading`: while it is open, the host's one shared reading of the open
# pull requests, so the 30 s polls of every landing on the host cost one
# query between them (#5061).
pr_state() {
  pr_reading "$number" \
    | jq -r '[.state, .mergeable, .mergeStateStatus, (.autoMergeRequest != null), (.mergeCommit.oid // "-"), .baseRefName,
        (.commits.nodes[0].commit.statusCheckRollup.contexts.nodes // [] | length),
        .isInMergeQueue, (.mergeQueueEntry.state // "-"), (.mergeQueueEntry.position // 0)] | @tsv'
}
# Every workflow's run for the pull request's newest queue entry, one per line.
group_runs() {
  gh run list -R "$repo" --event merge_group --limit 100 --json databaseId,headBranch,conclusion,url,status --jq "[.[] | select(.headBranch | split(\"/\") | last | startswith(\"pr-$number-\"))] | (.[0].headBranch // empty) as \$entry | .[] | select(.headBranch == \$entry) | [.databaseId, .url, .status, .conclusion] | @tsv"
}
# Succeeds once the entry has runs and every one of them has completed.
settled() {
  local run_id url run_status conclusion
  [[ -n "$1" ]] || return 1
  while IFS=$'\t' read -r run_id url run_status conclusion; do
    [[ "$run_status" == completed ]] || return 1
  done <<< "$1"
}
# Succeeds when every run of the entry concluded success.
succeeded() {
  local run_id url run_status conclusion
  while IFS=$'\t' read -r run_id url run_status conclusion; do
    [[ "$conclusion" == success ]] || return 1
  done <<< "$1"
}
job_times() {
  gh run view "$1" -R "$repo" --json jobs --jq '.jobs[] | [.name, (if .conclusion == "skipped" then "0s" elif .startedAt == null or .completedAt == null or .startedAt == "" or .completedAt == "" then "pending" else (((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) | tostring) + "s" end), .conclusion] | @tsv'
}
conflicts() {
  local ahead other files own file shared
  own=$(gh pr view "$number" -R "$repo" --json files --jq '.files[].path')
  ahead=$(gh api graphql --paginate -F owner='{owner}' -F name='{repo}' -f branch="$base" -f query="
    query(\$owner: String!, \$name: String!, \$branch: String!, \$endCursor: String) {
      repository(owner: \$owner, name: \$name) {
        mergeQueue(branch: \$branch) {
          entries(first: 100, after: \$endCursor) {
            nodes { position pullRequest { number } }
            pageInfo { hasNextPage endCursor }
          }
        }
      }
    }" --jq ".data.repository.mergeQueue.entries.nodes[] | select(.position < $position) | .pullRequest.number")
  printf 'PR #%s is UNMERGEABLE in the queue. Entries ahead:\n' "$number"
  while IFS= read -r other; do
    [[ -n "$other" ]] || continue
    printf 'PR #%s; shared files:\n' "$other"
    files=$(gh pr view "$other" -R "$repo" --json files --jq '.files[].path')
    shared=false
    while IFS= read -r file; do
      [[ -n "$file" ]] || continue
      if [[ $'\n'"$own"$'\n' == *$'\n'"$file"$'\n'* ]]; then
        printf '  %s\n' "$file"
        shared=true
      fi
    done <<< "$files"
    if [[ "$shared" == false ]]; then echo '  (none)'; fi
  done <<< "$ahead"
  echo "rebase onto $trunk once they merge, then run \`pr:land\` again"
}

# The landing is the stack's largest ready prefix (#1988, `land_prefix`), in
# units (#2046): run from any member, it queues every member green on the
# required contexts and free of conflicts, up to the first red, pending or
# conflicting one (#2783), a unit at a time,
# until the caller's own pull request is queued. A stack that holds the
# commits of a pull request queued on its own waits for that one to merge,
# then reads the stack again. A stack on an old lineage of the trunk is
# replayed onto it first and queues nothing (#6399, `replay_lineage`): its
# new heads land once their checks pass.
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
trap 'release_landing; drop_scratch' EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
trap 'exit 129' HUP
# Landed worktrees go first; a sweep that fails never holds a landing.
mise run wt:sweep || echo "wt:sweep failed; landing regardless" >&2

# The features ledger rows the body names are the rows the change patches,
# each `since` carrying the pull request's number (#2525, `ledger:patched`),
# read from its base's fork to its head; the landing is refused otherwise.
IFS=$'\t' read -r ledger_base ledger_head < <(gh pr view "$number" -R "$repo" --json baseRefName,headRefName --jq '[.baseRefName, .headRefName] | @tsv')
git fetch --quiet origin "$ledger_base" "$ledger_head"
# The change is read from the commit `change_base` names (#6055, #6062): the
# merge base with the base branch, or the head of the pull request below that
# the queue holds open on the trunk. A head that stands on an old copy of the
# pull request below is refused with the replay first.
if ! ledger_from=$(change_base "$ledger_base" "$ledger_head" "$number"); then
  printf 'PR #%s:\n  %s\n' "$number" "$ledger_from" >&2
  exit 2
fi
ledger_body=$(mktemp)
gh pr view "$number" -R "$repo" --json body --jq .body > "$ledger_body"
status=0
ledger=$(mise run --quiet ledger:patched "$ledger_body" "$ledger_from" \
  --head "origin/$ledger_head" --pr "$number" 2> /dev/null) || status=$?
# Nor does it land while a design page its issues build on is still owed in
# its `## Vault` (#3161, `absorbing.jq`): the page's status may have moved
# since `pr:open` read it.
source "$(git rev-parse --show-toplevel)/.config/references/vault.bash"
claims=$(git rev-parse --show-toplevel)/.config/claims
land_issues=$(jq -Rrs -L "$claims" 'include "targets"; targets(working) | unique[]' "$ledger_body" \
  | while IFS= read -r issue; do gh api "repos/$repo/issues/$issue" --jq '{number, body: (.body // "")}'; done \
  | jq -s .)
absorbing=$(jq -n --rawfile body "$ledger_body" --slurpfile issues <(printf '%s\n' "$land_issues") --slurpfile absorption <(vault_absorption) \
  '{body: $body, issues: $issues[0], absorption: $absorption[0]}' | jq -r -L "$claims" -f "$claims/absorbing.jq")
rm -f "$ledger_body"
if (( status != 0 )); then
  printf 'PR #%s:\n%s\n' "$number" "${ledger:-ledger:patched failed to read the ledger}" | sed '2,$s/^/  /' >&2
  exit 2
fi
# Nor does it lower a reserved grammar rule its row's open issue does not
# name (#2528, `ledger:reserved`).
status=0
reserved=$(mise run --quiet ledger:reserved "$ledger_from" \
  --head "origin/$ledger_head" 2> /dev/null) || status=$?
if (( status != 0 )); then
  printf 'PR #%s:\n%s\n' "$number" "${reserved:-ledger:reserved failed to read the ledger}" | sed '2,$s/^/  /' >&2
  exit 2
fi
if [[ -n $absorbing ]]; then
  printf 'PR #%s:\n%s\n' "$number" "$absorbing" | sed '2,$s/^/  /' >&2
  exit 2
fi

# A pull request landed from its own branch queues only on a tree the
# landing's gate passed on (#5076, `passed.bash`). A rebase that changes the
# head's tree, as a restack does, leaves no gate on it, so the head is gated
# again here when it is the checked-out commit (#5458, `mise run check`). A
# pull request landed from elsewhere is landed on its required checks.
own=$(gh pr view --json number --jq .number 2> /dev/null) || own=
if [[ "$own" == "$number" ]]; then
  passed=$(git rev-parse --show-toplevel)/.config/gate-scope/passed.bash
  if ! "$passed" require pr:land "origin/$ledger_head" 2> /dev/null; then
    if [[ $(git rev-parse HEAD) == "$(git rev-parse "origin/$ledger_head")" && $("$passed" tree) == "$(git rev-parse 'HEAD^{tree}')" ]]; then
      mise run check
    fi
    "$passed" require pr:land "origin/$ledger_head" || exit 2
  fi
fi

while :; do
  status=0
  land_prefix "$number" || status=$?
  case "$status" in
    0) break ;;
    3)
      [[ $(in_queue "$number") != true ]] || break
      (( SECONDS < deadline )) || { echo "timed out waiting on the pull request queued below" >&2; exit 2; }
      sleep 60
      ;;
    *) exit "$status" ;;
  esac
done
# A stack whose bottom is red while it sits behind main, with nothing of it
# queued, may be red for what main has fixed since, as a fix opened with
# `pr:open --unblocks` is: it is restacked onto the trunk, its checks run again,
# and `pr:watch` lands it once they are green. The rebase runs in a scratch
# worktree; the checked-out branch, when the stack moved it, is taken back.
IFS=$'\t' read -r verdict _upto stop <<< "$prefix_decision"
if [[ "$verdict" == hold && "$stop" == red && "$prefix_queued" == '[]' ]]; then
  bottom=$(jq -r '.[0].head' <<< "$prefix_server")
  git fetch --quiet origin "$trunk" "$bottom"
  if ! git merge-base --is-ancestor "origin/$trunk" "origin/$bottom"; then
    if ! git diff --quiet || ! git diff --cached --quiet; then
      echo "the checkout has uncommitted changes; commit or drop them, then run \`pr:land\` again to restack the stack onto $trunk" >&2
      exit 2
    fi
    echo "the stack's bottom is red and behind $trunk: restacking it onto $trunk"
    restack "$prefix_server"
    own_head=$(git branch --show-current)
    if jq -e --arg head "$own_head" 'any(.[]; .head == $head)' <<< "$prefix_server" > /dev/null; then
      git reset --quiet --keep "origin/$own_head"
    fi
  fi
fi
# The seat's wake-up: run as a deferred job, `pr:watch` exits with one line
# the moment the pull request needs a hand or has landed, and lands its
# stack the moment it goes green.
printf "arm: /bin/bash -c 'mise run pr:watch %s' timer-pr-%s\n" "$number" "$number"
if [[ $(in_queue "$number") != true ]]; then
  echo "#$number is not in this landing; \`pr:watch\` lands it once it and every pull request below it are green"
  exit 0
fi
queued=true
while (( SECONDS < deadline )); do
  current=$(pr_state)
  IFS=$'\t' read -r state mergeable merge_status auto commit base check_count in_queue queue_status position <<< "$current"
  if [[ "$current" != "$previous" ]]; then
    printf 'PR #%s: %s; %s; %s; auto-merge=%s; queued=%s; entry=%s; position=%s; checks=%s\n' "$number" "$state" "$mergeable" "$merge_status" "$auto" "$in_queue" "$queue_status" "$position" "$check_count"
    previous=$current
  fi
  if [[ "$in_queue" == true ]]; then queued=true; fi
  if [[ "$state" == MERGED ]]; then
    entry_runs=$(group_runs)
    if settled "$entry_runs"; then
      printf 'Merged PR #%s: %s\n' "$number" "$commit"
      while IFS=$'\t' read -r -u 3 run_id url run_status conclusion; do
        printf 'Merge-group run: %s\n' "$url"
        job_times "$run_id"
      done 3<<< "$entry_runs"
      remove_landed_worktree "$number"
      exit 0
    fi
  elif [[ "$queue_status" == UNMERGEABLE ]]; then
    conflicts
    exit 3
  elif [[ "$state" == CLOSED || ( "$queued" == true && "$in_queue" == false && "$auto" == false ) ]]; then
    entry_runs=$(group_runs)
    if [[ -n "$entry_runs" ]]; then
      if settled "$entry_runs"; then
        # The queue drops a merged entry a moment before the pull request
        # reads MERGED, so an entry gone with every run green while the
        # pull request reads OPEN is waited on for five minutes.
        if [[ "$state" == OPEN ]] && succeeded "$entry_runs"; then
          if [[ -z "$merging_until" ]]; then merging_until=$((SECONDS + 300)); fi
          if (( SECONDS < merging_until )); then sleep 30; continue; fi
        fi
        printf 'PR #%s dequeued or closed.\n' "$number"
        # A failed run's failed steps explain the removal; with none failed,
        # every run's whole log does.
        while IFS=$'\t' read -r -u 3 run_id url run_status conclusion; do
          printf 'Merge-group run: %s (%s)\n' "$url" "$conclusion"
          job_times "$run_id"
          if [[ "$conclusion" == failure ]]; then
            gh run view "$run_id" -R "$repo" --log-failed
          elif [[ "$entry_runs" != *$'\t'failure* ]]; then
            gh run view "$run_id" -R "$repo" --log
          fi
        done 3<<< "$entry_runs"
        exit 1
      fi
    else
      printf 'PR #%s dequeued or closed without merging; no merge-group run found.\n' "$number"
      exit 1
    fi
  elif [[ ( "$merge_status" == BLOCKED || "$merge_status" == UNSTABLE ) && "$check_count" != 0 ]]; then
    check_status=0
    failed=$(gh pr checks "$number" -R "$repo" --json bucket,name,state,link --jq '.[] | select(.bucket == "fail" or .bucket == "cancel") | [.name, .state, .link] | @tsv') || check_status=$?
    if [[ "$check_status" != 0 && "$check_status" != 1 && "$check_status" != 8 ]]; then exit "$check_status"; fi
    if [[ -n "$failed" ]]; then
      logs_ready=true
      runs=' '
      while IFS=$'\t' read -r _check_name _check_state link; do
        if [[ "$link" =~ /actions/runs/([0-9]+) ]]; then
          run_id=${BASH_REMATCH[1]}
          [[ "$runs" != *" $run_id "* ]] || continue
          runs+="$run_id "
          run_status=$(gh run view "$run_id" -R "$repo" --json status --jq .status)
          if [[ "$run_status" != completed ]]; then logs_ready=false; fi
        fi
      done <<< "$failed"
      if [[ "$logs_ready" == true ]]; then
        printf 'PR #%s checks failed:\n%s\n' "$number" "$failed"
        for run_id in $runs; do gh run view "$run_id" -R "$repo" --log-failed; done
        exit 1
      fi
    fi
  fi
  sleep 30
done
printf 'Timed out after 90 minutes: PR #%s %s\n' "$number" "$previous" >&2
exit 2
{% endraw %}
'''

# A pull request held on purpose, for a base, a ruling or a sibling, is a
# draft with its reason (#2972): `pr:hold <n> "<reason>"` converts it and
# comments a lead sentence above its reason table under a `<!-- hold -->` marker. A draft is no stall
# (`stall:watch`), and neither `pr:watch` nor the `landing` workflow lands
# it, nor anything stacked above it (`rests.jq`, #3253). The owner's hold is
# `--owner`: the draft also carries the `hold:owner` label, which holds it
# still if the draft is taken back, and is never a chat note. A pull request
# in the merge queue, or set to enter it by auto-merge, leaves it first
# (#4655): its auto-merge is turned off, and a queued one is closed and
# reopened, the one way out of a queue for a stack member (`pr:land`). The
# draft alone leaves a queued entry to merge. `pr:release <n>` ends either
# hold, and the next watch lands it once green.
#
# A hold never stops the stack above its pull request (#5902). A member with
# members above it is cut to the top of its stack first (`cut_to_top`, as the
# stack watcher cuts a red bottom): the members above replay past it and
# land, and it waits alone. A cut that `heal.jq` refuses, or that waits on a
# queued member, leaves it in place, and the hold says the members above
# wait. A pull request closed unmerged is refused: the stack watcher closes a
# member so when it cuts it, and a hold would reopen it and stop the stack
# above it again. Its seat fixes it and opens it again with `pr:open`.
["pr:hold"]
description = "Hold a pull request on purpose: take it out of the merge queue, make it a draft and comment the reason in a table"
usage = '''
arg "<number>" help="pull request number"
arg "<reason>" help="why it is held: the base, ruling or sibling it waits on, or the owner's review"
flag "--owner" help="the owner's hold: label it `hold:owner` as well"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:?}
reason=${usage_reason:?}
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
[[ -n "${reason// }" ]] || { echo 'pr:hold needs the reason it is held' >&2; exit 2; }
source "$(git rev-parse --show-toplevel)/.config/gh/repo.bash"
repo=$(repo_name)
IFS=$'\t' read -r state draft queued auto < <(gh api graphql -F owner='{owner}' -F name='{repo}' -F number="$number" \
  -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { state isDraft isInMergeQueue autoMergeRequest { enabledAt } } } }' \
  --jq '.data.repository.pullRequest | [.state, .isDraft, .isInMergeQueue, (.autoMergeRequest != null)] | @tsv')
case $state in
  CLOSED)
    echo "#$number is closed unmerged: the stack watcher closes a member so when it cuts it out of its stack, and a hold would reopen it and stop the stack above it again. Its seat fixes it and opens it again with \`mise run pr:open\`" >&2
    exit 2
    ;;
  MERGED) echo "#$number merged: there is nothing to hold" >&2; exit 2 ;;
esac
who='as a draft'
if [[ "${usage_owner:-false}" == true ]]; then
  gh label create hold:owner -R "$repo" --color B60205 --description "Held by the owner: no landing queues it or the stack above it" --force > /dev/null
  gh pr edit "$number" -R "$repo" --add-label hold:owner > /dev/null
  who='by the owner'
fi
if [[ "$auto" == true ]]; then gh pr merge "$number" -R "$repo" --disable-auto > /dev/null; fi
if [[ "$queued" == true ]]; then
  gh pr close "$number" -R "$repo" > /dev/null
  gh pr reopen "$number" -R "$repo" > /dev/null
  echo "#$number left the merge queue"
fi
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
stack=$(server_stack "$number")
if [[ $(jq --argjson n "$number" 'any(.[]; .number == $n) and .[-1].number != $n' <<< "$stack") == true ]]; then
  if cut=$(cut_to_top "$number" "$stack" "[$number]"); then
    IFS=$'\t' read -r before after <<< "$cut"
    echo "#$number cut to the top of its stack: $before is now $after"
  else
    echo "#$number stays in its stack, and the members above it wait for its release" >&2
  fi
fi
if [[ "$draft" != true ]]; then
  gh pr ready "$number" -R "$repo" --undo > /dev/null
fi
reason_cell=${reason//\\/\\\\}
reason_cell=${reason_cell//|/\\|}
reason_cell=${reason_cell//$'\r'/}
reason_cell=${reason_cell//$'\n'/<br>}
gh pr comment "$number" -R "$repo" --body "$(printf '<!-- hold -->\nThis pull request is held %s.\n\n| Field | Value |\n| --- | --- |\n| Reason | %s |\n| Release | `mise run pr:release %s` |\n' "$who" "$reason_cell" "$number")" > /dev/null
echo "#$number held $who: $reason"
'''

# The end of a hold (#3253): the draft taken back and the owner's
# `hold:owner` label taken off, so the next watch lands it once green. A
# pull request whose branch holds a commit of another open pull request past
# its base is refused, and the refusal names that pull request
# (`foreign_commits`, #6797): a landing would squash the commit under its
# title.
["pr:release"]
description = "End a pull request's hold: ready the draft and take off the owner's label"
usage = '''
arg "<number>" help="pull request number"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:?}
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
source "$(git rev-parse --show-toplevel)/.config/gh/repo.bash"
repo=$(repo_name)
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
IFS=$'\t' read -r draft owner head base < <(gh pr view "$number" -R "$repo" --json isDraft,labels,headRefName,baseRefName --jq '[.isDraft, any(.labels[]; .name == "hold:owner"), .headRefName, .baseRefName] | @tsv')
foreign=$(foreign_commits "$number" "$head" "$base") || { echo "the commits of #$number past $base cannot be read; run \`pr:release $number\` again" >&2; exit 2; }
if [[ "$foreign" != '[]' ]]; then
  echo "#$number stays held: past $base its branch holds $(jq -r 'map("\(.commits) commit(s) of #\(.number)") | join(", ")' <<< "$foreign"), which a landing would squash under its title (#6797); set its base to the pull request it builds on, or rebase it, then \`pr:release $number\` again" >&2
  exit 2
fi
if [[ "$owner" == true ]]; then gh pr edit "$number" -R "$repo" --remove-label hold:owner > /dev/null; fi
if [[ "$draft" == true ]]; then gh pr ready "$number" -R "$repo" > /dev/null; fi
echo "#$number released: its next \`pr:watch\` lands it once green"
'''

# The wake-up a seat arms when `pr:open` waits on a future event (#4164),
# from the `arm:` line `pr:open` prints. It polls the issue or the top pull
# request it names every 30 seconds, and exits the moment its event happens,
# printing one line and nothing else on stdout (`.config/pr-stack/await.jq`):
#   signed #n         the issue carries `shape:signed` (exit 0)
#   top-merged #n     the top merged (exit 0)
#   top-current #n    the top holds every change of the trunk the branch
#                     builds on, and does not conflict (exit 0)
#   top-stale #n      the top has conflicted with the trunk past its seat's
#                     claim window, so `pr:open` stacks past it (exit 0)
#   issue-closed #n   the issue closed (exit 1)
#   top-closed #n     the top closed without merging (exit 1)
#   await-timeout #n  the deadline passed (exit 2)
# On an exit 0 the seat runs `pr:open` again; any other needs a hand. A
# reading that fails, a rate-limited one among them, is tried again at the
# next poll. It runs in the branch's worktree, which `top-current` reads.
["pr:await"]
description = "Wait for the future event pr:open waits on: an issue's sign-off, or a top that merged, is current or went stale"
quiet = true
usage = '''
arg "<number>" help="the issue waiting on `shape:signed`, or the top pull request"
flag "--timeout <seconds>" default="10800" help="give up after this many seconds"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:?}
timeout=${usage_timeout:-10800}
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected an issue or pull request number' >&2; exit 2; }
[[ "$timeout" =~ ^[0-9]+$ ]] || { echo 'Expected --timeout in seconds' >&2; exit 2; }
source "$(git rev-parse --show-toplevel)/.config/gh/repo.bash"
repo=$(repo_name)
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
deadline=$((SECONDS + timeout))
# The lock's key: one wait a number on a host (#4268), so a second
# `pr:await` on the same issue or pull request is refused while the first
# runs.
subject=#$number
key=$number
await_lock=${XDG_STATE_HOME:-$HOME/.local/state}/gandr/watch/$key.await
mkdir -p "$(dirname "$await_lock")"
if [[ -f $await_lock ]] && kill -0 "$(< "$await_lock")" 2> /dev/null; then
  echo "pr:await: $subject is already awaited on this host by pid $(< "$await_lock"); one wait a number" >&2
  exit 2
fi
echo $$ > "$await_lock"
trap 'rm -f "$await_lock"' EXIT
# One poll's reading, as `awaited` reads it: an issue's state and labels; or
# a pull request's state, merge state, the age of its head commit and whether
# it still lacks a trunk change the branch builds on. An open pull request is
# read from the host's one shared reading of the open pull requests
# (`pulls_reading`), so the 30 s polls of every wait on the host cost one
# query between them (#5061). Only an issue, or a pull request no longer
# open, is read alone. The poll calls it as a condition, where `set -e` does
# not hold, so each step that can fail fails the reading itself (#4803).
reading() {
  local all issue pull head lacked lacks=false
  all=$(pulls_reading) || return 1
  pull=$(jq -c --argjson n "$number" '.[] | select(.number == $n)' <<< "$all") || return 1
  if [[ -z $pull ]]; then
    issue=$(gh api "repos/$repo/issues/$number") || return 1
    if [[ $(jq -r 'has("pull_request")' <<< "$issue") == false ]]; then
      jq -c '{kind: "issue", state: (.state | ascii_upcase), labels: [.labels[].name]}' <<< "$issue"
      return
    fi
    pull=$(pr_reading "$number") || return 1
  fi
  pull=$(jq -c '{kind: "pull", state, merge: .mergeStateStatus, head: .headRefName,
    age: (now - (.commits.nodes[0].commit.committedDate | fromdateiso8601) | floor)}' <<< "$pull") || return 1
  if [[ $(jq -r .state <<< "$pull") == OPEN ]]; then
    head=$(jq -r .head <<< "$pull")
    git fetch --quiet origin "$head" "$trunk" || return 1
    lacked=$(trunk_lacked "$head") || return 1
    if [[ -n $lacked ]]; then lacks=true; fi
  fi
  jq -c --argjson lacks "$lacks" '. + {lacks: $lacks}' <<< "$pull"
}
while :; do
  if read=$(reading 2> /dev/null); then
    failed=0
    event=$(jq -c -L "$pr_stack_dir" 'include "await"; awaited' <<< "$read")
    if [[ $event != null ]]; then
      if [[ $number == hold ]]; then jq -r .event <<< "$event"; else printf '%s #%s\n' "$(jq -r .event <<< "$event")" "$number"; fi
      exit "$(jq -r .exit <<< "$event")"
    fi
  else
    # A failed read, a rate limit among them, backs off: five minutes, never
    # the next poll (#4268).
    failed=$(( ${failed:-0} + 1 ))
  fi
  (( SECONDS < deadline )) || { echo "await-timeout $subject"; exit 2; }
  if (( ${failed:-0} > 0 )); then sleep 300; else sleep "${pr_stack_poll:-30}"; fi
done
{% endraw %}'''

# The wake-up a seat arms after `pr:land`: it polls the pull request and its
# queue entry and exits the moment one of these holds, printing one line and
# nothing else on stdout:
#   pr-merged #n               landed, its branch's worktree removed and its
#                              `## Refactoring` verdict filed (`refactor:file`,
#                              #2885; a failed filing is told on stderr and
#                              `stall:watch` pages it) (exit 0)
#   pr-closed #n               closed without merging
#   pr-dirty #n                a landing ahead conflicts: rebase, `pr:land`
#   pr-red #n <job>            a required check, or the queue entry's run,
#                              concluded failure: read the named job's log
#   pr-dequeued #n <reason> <above>
