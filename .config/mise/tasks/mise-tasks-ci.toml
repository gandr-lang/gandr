# since this watch began, if any (#3745). The queue removes an entry whose
# merge-group run failed, and the entry is gone by the time the removal is
# read, so `red_entry` has no head to ask: `queue-runs.jq` finds the run by
# the queue's own branch for this pull request, under `jq`, since `gh api`
# takes no `--arg` (#4225).
red_queue_run() {
