#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# Run the workflow, not a shell approximation of it.
# The clone runs committed HEAD, so commit changes before this gate. A linked
# worktree's .git file points outside act's copied workspace;
# a disposable full clone preserves history and keeps generated install pins
# and container paths out of the developer checkout. The clone is removed on
# either success or failure. .actrc supplies the vendored native runner image.
# act does not exercise GitHub's merge queue, permission/allowlist enforcement,
# cross-run artifact delivery or branch-scoped promotion into main's caches.
# act cannot execute macOS runners. That lane is retained for hosted CI;
# the local gate runs every Linux check in the same workflow. Forward flags
# to act for runner-image selection without changing the committed workflow.
# Each invocation gives a disposable workflow copy a unique name, isolating
# containers across repositories and worktrees. The checkout stays unchanged.
# act runs with --reuse, so it never removes a job's container itself: act
# allows that removal a fixed minute (pkg/runner/job_executor.go), and under
# a dozen compiling jobs a removal past it fails the job's cleanup and stops
# every later stage of the run, the joins and the gate jobs among them.
# reap_jobs passes act's output through and removes each job's container,
# its anonymous volumes and act's two named volumes as the job reports its
# end, at no deadline, so disk frees as each job ends. The exit/signal trap
# removes what is left: step containers, and anything a reap could not.
# Startup reaps abandoned runs by workflow-process liveness, never age, and
# leaves act-toolcache untouched.
# Offline action mode reuses cached actions without fetching; cache misses
# still download the pinned action.
# act resets Git indexes even offline, so each invocation snapshots the shared
# action cache. A green run atomically publishes only new entries; a bounded
# directory lock serializes publication, never the gates themselves.
# Two host-wide slots bound concurrent gates across repositories and worktrees:
# the host lock `act` (`.config/mise/host-lock.bash`, #3105), which a dead
# holder releases with its last process.
# A local run is scoped to the jobs a change touches (#2541): the task
# refuses, before anything starts, without a `-j <job>` among its arguments,
# and when the committed branch changes nothing under `.github/` or
# `.config/mise/tasks/` against its fork from `origin/main`. The owner runs
# `act` directly for anything else.
["ci:act"]
description = "Run the committed CI workflow's named jobs locally, after a workflow or task change"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
job=false
for argument in "$@"; do
  case "$argument" in
    -j | --job | -j?* | --job=*) job=true ;;
  esac
done
if [[ "$job" != true ]]; then
  echo 'ci:act: name the jobs the change touches with `-j <job>`; the whole workflow runs in hosted CI' >&2
  exit 2
fi
if [[ -z $(git diff --name-only origin/main...HEAD -- .github .config/mise/tasks) ]]; then
  echo 'ci:act: the committed branch changes nothing under .github/ or .config/mise/tasks/ against origin/main; act runs only after a workflow or task change' >&2
  exit 2
fi
remove_run() {
  local run_id=$1 kind ids resource status=0
  for kind in container network volume; do
    case "$kind" in
      container) ids=$(docker ps -aq --filter "name=^/act-CI-tmp-${run_id}-") ;;
      network) ids=$(docker network ls -q --filter "name=^act-CI-tmp-${run_id}-") ;;
      volume) ids=$(docker volume ls -q --filter "name=^act-CI-tmp-${run_id}-") ;;
    esac || { status=1; continue; }
    while IFS= read -r resource; do
      [[ -n "$resource" ]] || continue
      if [[ "$kind" == container ]]; then
        docker container rm -f -v "$resource" || status=1
      else
        docker "$kind" rm -f "$resource" || status=1
      fi
    done <<< "$ids"
  done
  return "$status"
}

# A job's container name is act's own (createContainerName in
# pkg/runner/run_context.go): `act-` and the job's run-qualified name, the
# prefix of its end line, with every other character than a letter or digit
# a dash and `--` folded once, cut to 63 characters less trailing dashes,
# then a dash and the SHA-256 of the whole folded name. The reader also
# marks act's action-cache race (below) in the file its argument names.
reap_jobs() {
  local line job name hash
  while IFS= read -r line; do
    printf '%s\n' "$line"
    if [[ "$line" == *"] remove $scratch/actions/"*"/.gitignore: no such file or directory" ]]; then
      printf '%s\n' "$line" >> "$1"
    fi
    [[ "$line" =~ ^\[(.+)\]\ 🏁\ \ Job\ (succeeded|failed)$ ]] || continue
    job=${BASH_REMATCH[1]}
    job=${job%"${job##*[! ]}"}
    name=$(LC_ALL=C.UTF-8 sed -e 's/[^a-zA-Z0-9]/-/g' -e 's/--/-/g' <<< "act-$job")
    hash=$(printf '%s' "$name" | sha256sum)
    name=${name:0:63}
    while [[ "$name" == *- ]]; do name=${name%-}; done
    name+="-${hash%% *}"
    {
      docker container rm -f -v "$name" > /dev/null &&
        docker volume rm -f "$name" "$name-env" > /dev/null ||
        printf 'ci:act: %s stays for the final cleanup\n' "$name" >&2
    } &
  done
  wait
}

# Snapshot names before probing processes; a new run cannot lose resources
# absent from the snapshot. A process-query error must not imply an orphan.
{% raw %}
names=$(docker ps -a --filter name=act-CI-tmp- --format '{{.Names}}')
names+=$'\n'$(docker network ls --filter name=act-CI-tmp- --format '{{.Name}}')
names+=$'\n'$(docker volume ls --filter name=act-CI-tmp- --format '{{.Name}}')
{% endraw %}
seen=' '
while IFS= read -r name; do
  [[ "$name" =~ ^act-CI-tmp-([[:alnum:]]+)- ]] || continue
  run_id=${BASH_REMATCH[1]}
  [[ "$seen" != *" $run_id "* ]] || continue
  seen+="$run_id "
  if pgrep -f "[t]mp[.]${run_id}/ci[.]yml" >/dev/null; then
    continue
  else
    status=$?
    [[ "$status" == 1 ]] || exit "$status"
  fi
  remove_run "$run_id"
done <<< "$names"

scratch=$(mktemp -d)
run_id=${scratch##*/tmp.}
action_cache="${XDG_CACHE_HOME:-$HOME/.cache}/act"
lockdir="${action_cache}.publish-lock"
publish=
locked=false
act_pid=
reaper_pid=
slotted=false
cleanup() {
  local status=$?
  trap - EXIT INT TERM
  if [[ -n "$act_pid" ]]; then
    kill -TERM "$act_pid" 2>/dev/null || true
    wait "$act_pid" || true
  fi
  if [[ -n "$reaper_pid" ]]; then
    exec 3>&-
    wait "$reaper_pid" || true
  fi
  remove_run "$run_id" || { if [[ "$status" == 0 ]]; then status=1; fi; }
  if [[ "$locked" == true ]]; then rmdir "$lockdir" || status=1; fi
  if [[ -n "$publish" ]]; then rm -rf "$publish" || status=1; fi
  rm -rf "$scratch" || status=1
  if [[ "$slotted" == true ]]; then
    printf '%s Released act slot %s (pid %s)\n' "$(date -u +%FT%TZ)" "$host_slot" "$$"
  fi
  exit "$status"
}
trap cleanup EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
source "{{config_root}}/.config/mise/host-lock.bash"
host_lock act 2 "mise run ci:act -- $*"
slotted=true
printf '%s Acquired act slot %s (pid %s)\n' "$(date -u +%FT%TZ)" "$host_slot" "$$"
mkdir -p "$action_cache" "$scratch/actions"
cp -R "$action_cache/." "$scratch/actions/"
git clone --quiet --local --no-hardlinks -- "{{config_root}}" "$scratch/checkout"
# act names the repository after the clone's origin, a local path here, and
# every checkout step refuses a path for `owner/repo`; the source's own origin
# names it.
git -C "$scratch/checkout" remote set-url origin "$(git -C "{{config_root}}" remote get-url origin)"
cd "$scratch/checkout"
ACT_RUN_ID=${scratch##*/} yq '.name += "-" + strenv(ACT_RUN_ID)' .github/workflows/ci.yml > "$scratch/ci.yml"
# act's shared action cache races (nektos/act#6180, open): two jobs that
# prepare one action in the same instant both see its `.gitignore`, and the
# second removal fails its job with `remove …/.gitignore: no such file or
# directory`. A run that fails with that line runs once more, from a clean
# slate, and the second verdict stands: a real failure fails it again, and a
# run that fails without the line is never retried.
attempt=1
while :; do
  rm -f "$scratch/act-race"
  exec 3> >(reap_jobs "$scratch/act-race")
  reaper_pid=$!
  status=0
  act workflow_dispatch --workflows "$scratch/ci.yml" --action-cache-path "$scratch/actions" --action-offline-mode --rm --reuse "$@" >&3 2>&3 &
  act_pid=$!
  wait "$act_pid" || status=$?
  act_pid=
  exec 3>&-
  wait "$reaper_pid"
  reaper_pid=
  if [[ "$status" == 0 ]]; then break; fi
  if [[ "$attempt" != 1 || ! -s "$scratch/act-race" ]]; then exit "$status"; fi
  printf 'ci:act: act exited %s after its action-cache race (nektos/act#6180); running once more:\n' "$status" >&2
  cat "$scratch/act-race" >&2
  remove_run "$run_id"
  attempt=2
done
publish=$(mktemp -d "${action_cache}.publish.XXXXXXXX")
for entry in "$scratch/actions/"*; do
  [[ -d "$entry" && ! -e "$action_cache/${entry##*/}" ]] || continue
  cp -R "$entry" "$publish/"
done
deadline=$((SECONDS + 30))
until mkdir "$lockdir" 2>/dev/null; do
  if (( SECONDS >= deadline )); then
    printf 'Timed out publishing act action cache: %s\n' "$lockdir" >&2
    exit 1
  fi
  sleep 0.2
done
locked=true
for entry in "$publish/"*; do
  [[ -d "$entry" && ! -e "$action_cache/${entry##*/}" ]] || continue
  mv "$entry" "$action_cache/"
done
'''

# Test priorities come from measured queue runs, never from memory: the tool
# stores each run's JUnit reports under target/test-timing, prints every test
# that has or would have a priority, and generates the overrides a reviewer
# commits to .config/nextest.toml (crates/workflow-test-timing/README.md).
["ci:timing"]
description = "Propose nextest priorities from recent merge-queue test timings"
usage = '''
flag "--runs <runs>" help="how many of the latest successful queue runs to read" default="5"
flag "--offline" help="report on the stored runs without invoking gh"
'''
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-test-timing -- --runs {{usage.runs}}{% if usage.offline %} --offline{% endif %}"

# Specification cost is profiled, never guessed from clause shapes: the tool
# samples the slowest enforcing tests the timing store names under perf and
# ranks the #[spec] checks by the time charged to them (Linux only;
# crates/workflow-spec-cost/README.md). Named tests go to the binary directly.
["ci:spec-cost"]
description = "Rank executable specifications by profiled check time"
usage = '''
flag "--tests <tests>" help="how many of the slowest enforcing tests to profile" default="5"
flag "--runs <runs>" help="how many of the newest stored queue runs name them" default="5"
flag "--frequency <hz>" help="samples per second" default="499"
flag "--top <top>" help="how many checks to list" default="30"
'''
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-spec-cost -- --tests {{usage.tests}} --runs {{usage.runs}} --frequency {{usage.frequency}} --top {{usage.top}}"

# The one-token-drop recovery matrix in full: some forty thousand parses
# against the per-source records under crates/surface-parser/tests/recovery,
# where every other profile visits the sweep's sample. UPDATE_EXPECT=1
# re-records from the full matrix; GANDR_RECOVERY_SOURCE=<path in the corpus>
# narrows either run to one source.
["ci:recovery"]
description = "Every corpus source cut short and with each token dropped, against its recovery record"
run = ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --profile sweeps -E 'test(=sweeps::dropped_tokens_recover_no_worse_than_the_record)'"

# The goldens a corpus source carries beside it — its recovery record, its
# role golden and, for a refusing source, its rendered refusals — rewritten
# for every source. The records are a sweep and run whole under the `sweeps`
# profile: under a pull-request profile the 30 s bound cuts the rewrite short
# and leaves a partial record. The role golden and the rendered refusals read
# every source under any profile. A new or changed source runs this once,
# then the check.
["corpus:goldens"]
description = "Rewrite every corpus source's recovery record, role golden and rendered refusals"
env.UPDATE_EXPECT = "1"
run = [
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --profile sweeps -E 'test(=sweeps::dropped_tokens_recover_no_worse_than_the_record)'",
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-grammar --test tests -E 'test(=highlight::corpus_roles_match_the_golden)'",
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-render-terminal --test tests -E 'test(=corpus::every_refusing_source_renders_as_its_golden)'",
]

# The nightly sweeps with specifications enforced, under the `nightly`
# nextest profile (.config/nextest.toml): every sweep whole, those too costly
# for the nightly budget each over the night's slice of the corpus, by the
# nights it states.
# Every other profile visits each sweep's stated sample; `--profile sweeps`
# visits the whole corpus in every sweep. The run builds into the enforcing
# gate's target directory, which the nightly workflow restores.
# GANDR_SWEEP_NIGHT=<day> replays another night.
["ci:sweeps-nightly"]
description = "Every sweep with specifications enforced, the costliest over the night's slice"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = ".config/mise/scope cargo nextest run --workspace --locked --profile nightly"

# Each crate's tests with every feature it declares on, which no gate builds:
# the gate tests each crate with its default features alone (#1785). A crate
# that declares no feature beyond `default` has nothing to turn on, and its
# gate run already is this one. The crates declaring features, sorted by name,
# rotate one a night, the i-th on the nights whose day number is i modulo
# their count, so a new feature puts its crate on the rotation by being
# declared and lengthens the cycle by a night. A night's cost is its crate's
# build: the restored plain state holds the layers below `gandr-core-term`,
# and the tower above them compiles with the night's features. A third of the
# crates a night took 164 to 213 s on the arm64 runner, about its costliest
# crate's alone, since the crates share that tower; the job's share is 186 s
# (#3288). GANDR_SWEEP_NIGHT=<day> replays another night, as for the sweeps;
# `--all` runs every such crate.
["ci:all-features"]
description = "Each crate's tests with every feature on, over the night's crate of those that declare features"
tools.jq = "1.8.1"
usage = '''
flag "--all" help="every crate that declares a feature, not the night's one"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
night=${GANDR_SWEEP_NIGHT:-$(($(date -u +%s) / 86400))}
mapfile -t crates < <(cargo metadata --locked --no-deps --format-version 1 | jq -r '[.packages[] | select(.features | keys - ["default"] | length > 0) | .name] | sort[]')
# Counted by hand: mise renders the script as a template, where the hash
# after an open brace opens a comment.
nights=0
for _ in "${crates[@]}"; do nights=$((nights + 1)); done
if ((nights == 0)); then echo "no crate declares a feature"; exit 0; fi
packages=()
for index in "${!crates[@]}"; do
  if [[ ${usage_all:-false} == true ]] || ((index == night % nights)); then packages+=(--package "${crates[index]}"); fi
done
echo "night $night, crate $((night % nights + 1)) of $nights: ${packages[*]}"
.config/mise/scope cargo nextest run --locked --profile "${NEXTEST_PROFILE:-default}" --all-features "${packages[@]}"
'''

# The enforcing suite, instrumented into target/coverage so it never shares
# the cached enforcing state, under the `coverage` nextest profile (its own
# limit, each sweep over its sample — .config/nextest.toml says why). The
# plain-only parser test is cfg(not(anodized_panic)), so it is a second
# instrumented run; a line is covered when either run executed it.
# `--no-report` implies `--no-clean`, and `report` reads every workspace
# object in the target directory, so the plain directory is cleaned of the
# workspace's objects first: a restored state otherwise keeps the previous
# revision's test binary beside this one's, and its coverage map, at the old
# line numbers with no hits, merges in as missed lines.
# Each object is exported on its own, then each line keeps its highest count
# across every export (#1368): llvm-cov keeps one record per function across
# the objects it is given, the first it reads, and a binary that links a crate
# without calling one of its `#[inline]` or generic functions carries a zero
# record for it that shadowed the counts of the binary that ran it. Within one
# object the real record replaces the zero one. `report -v` prints the export
# command cargo-llvm-cov builds, so the profile, the objects and the ignored
# paths are cargo-llvm-cov's own; its merged report is discarded.
# llvm-tools supplies llvm-cov; the CI image leaves it out, so the task adds
# it (a no-op where it is installed).
["ci:coverage"]
description = "Enforcing line coverage, with the plain-only parser witness merged in, as coverage.lcov"
run = '''
#!/usr/bin/env bash
set -euo pipefail
root="{{ config_root }}"
rustup component add llvm-tools
export NEXTEST_PROFILE=coverage
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
exports() {
  local target=$1 prefix=$2 line llvm_cov object index=0 count=0
  local -a options=() objects=()
  line=$(CARGO_TARGET_DIR="$target" "$root/.config/mise/scope" cargo llvm-cov report -v --lcov --output-path "$scratch/$prefix.discarded" 2>&1 > /dev/null \
    | grep -F ' export -format=lcov ')
  line=${line#*\`}
  line=${line%\`*}
  # The command is cargo-llvm-cov's: paths and one single-quoted pattern.
  eval "set -- $line"
  llvm_cov=$1
  shift
  while (( $# > 0 )); do
    if [[ $1 == -object ]]; then objects+=("$2"); count=$((count + 1)); shift 2; else options+=("$1"); shift; fi
  done
  if (( count == 0 )); then
    echo "cargo llvm-cov report named no object in $target" >&2
    return 1
  fi
  for object in "${objects[@]}"; do
    "$llvm_cov" "${options[@]}" -object "$object" > "$scratch/$prefix-$index.lcov" &
    index=$((index + 1))
    while (( $(jobs -rp | wc -l) >= $(nproc) )); do wait -n; done
  done
  while (( $(jobs -rp | wc -l) > 0 )); do wait -n; done
  rm -f "$scratch/$prefix.discarded"
  echo "$prefix: $count objects exported"
}
RUSTFLAGS="--cfg anodized_panic" CARGO_TARGET_DIR="$root/target/coverage" \
  "$root/.config/mise/scope" cargo llvm-cov nextest --workspace --locked --no-report
exports "$root/target/coverage" enforcing
CARGO_TARGET_DIR="$root/target/coverage-plain" \
  cargo llvm-cov clean --workspace
CARGO_TARGET_DIR="$root/target/coverage-plain" \
  "$root/.config/mise/scope" cargo llvm-cov nextest --locked --no-report \
  -p gandr-surface-parser --test tests \
  -E 'test(=acceptance::corpus_files_cold_parse_within_p99_latency_budget)'
exports "$root/target/coverage-plain" plain
awk '
  /^SF:/ {
    file = substr($0, 4)
    if (!(file in seen)) { seen[file] = ++nfiles; files[nfiles] = file }
  }
  /^DA:/ {
    split(substr($0, 4), parts, ",")
    key = file SUBSEP parts[1]
    if (!(key in hits) || parts[2]+0 > hits[key]) hits[key] = parts[2]+0
    if (!(key in listed)) { listed[key] = 1; seq[file] = seq[file] parts[1] "\n" }
  }
  END {
    for (i = 1; i <= nfiles; i++) {
      file = files[i]
      print "SF:" file
      n = split(seq[file], nums, "\n")
      for (a = 1; a < n; a++)
        for (b = a + 1; b <= n; b++)
          if (nums[a] != "" && nums[b] != "" && nums[b]+0 < nums[a]+0) {
            tmp = nums[a]; nums[a] = nums[b]; nums[b] = tmp
          }
      covered = 0
      total = 0
      for (a = 1; a <= n; a++) {
        if (nums[a] == "") continue
        hit = hits[file SUBSEP nums[a]]
        print "DA:" nums[a] "," hit
        total++
        if (hit+0 > 0) covered++
      }
      print "LH:" covered
      print "LF:" total
      print "end_of_record"
    }
  }
' "$scratch"/*.lcov > "$root/coverage.lcov"
'''

# Main's coverage upload against the one before it, as Markdown; with
# `--file-issue`, a drop over the threshold or fewer files opens or updates
# one issue (crates/workflow-coverage-guard/README.md). The coverage
# workflow passes codecov.yml's project threshold. Arguments pass through:
# `--repository`, `--sha`, `--threshold`, optionally `--wait` and
# `--file-issue`.
["ci:coverage-guard"]
description = "Main's coverage upload against the one before it, filed when it drops"
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-coverage-guard --"

# Each test's enforcing time over its plain time, from a run's enforcing JUnit
# report and a plain baseline's; the enforcing lane reports it on every run
# (crates/workflow-spec-cost/README.md). Flags and target directory match the
# enforcing test build, which already compiled most of the binary. Arguments
# pass through to it: `--plain`, `--enforcing`, `--baseline-commit`,
# `--baseline-age-hours`, and optionally `--threshold`, `--floor`, `--top`.
["ci:spec-cost-ratio"]
description = "Compare each test's enforcing time with a plain baseline's"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = ".config/mise/scope cargo run --locked --quiet --profile test --package gandr-workflow-spec-cost --bin spec-cost-ratio --"

# Each CI lane's median job time over the newest merge-queue and
# pull-request runs against its budget, as Markdown; `--issue TITLE` keeps
# one issue in step (crates/workflow-lane-budget/README.md). The nightly
# workflow passes the budget table. Arguments pass through: `--budget
# NAME=SECONDS` per lane, optionally `--runs` and `--issue`.
["ci:lane-budget"]
description = "Each CI lane's median job time over recent runs against its budget"
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-lane-budget --"

# An enforcing shard's test listing, written to `CI_WITNESS_LISTING` for the
# shard's own witness gate (`check:witnesses` with `CI_WITNESS_LISTINGS`). The
# flags are the shard's test task's, so the listing builds nothing the shard
# did not.
["ci:witness-listing"]
description = "List an enforcing shard's tests as nextest JSON for the witness gate"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
env.CARGO_UNSTABLE_FEATURE_UNIFICATION = "true"
run = ".config/mise/scope cargo nextest list {{ env.CI_SHARD_ARGS | default(value='--workspace') }} --locked --config 'resolver.feature-unification=\"workspace\"' --message-format json > \"${CI_WITNESS_LISTING:?}\""

# The build state a test lane hands to the next landing holds what this run's
# builds used: Cargo never deletes a unit a dependency, feature or lockfile
# change superseded, so a state restored and saved on every landing grows
# with every manifest change (crates/workflow-build-state/README.md). Each
# task asks Cargo again for the lane's builds, fresh by now, as JSON messages
# and prunes every other unit. The enforcing build compiled the binary.
["ci:prune-enforcing"]
description = "Prune the enforcing test state to the units this run's builds used"
env.RUSTFLAGS = "--cfg anodized_panic"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/enforcing"
run = [
  ".config/mise/scope cargo nextest run --workspace --locked --no-run --cargo-message-format json > target/enforcing/units.jsonl",
  "target/enforcing/debug/build-state prune --profile-dir target/enforcing/debug target/enforcing/units.jsonl",
]

# The plain lane's builds: the plain-only tests, the corpus driver, the corpus
# comments suite and the pruning binary itself. A new plain-lane build joins
# this list, or the next landing rebuilds it.
["ci:prune-plain"]
description = "Prune the plain test state to the units this run's builds used"
run = [
  ".config/mise/scope cargo nextest run --locked --package gandr-surface-parser --test tests --no-run --cargo-message-format json > target/debug/units-tests.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-lang --message-format json > target/debug/units-corpus.jsonl",
  ".config/mise/scope cargo test --locked --package gandr-surface-corpus --test tests --no-run --message-format json > target/debug/units-comments.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-tests.jsonl target/debug/units-corpus.jsonl target/debug/units-comments.jsonl target/debug/units-tool.jsonl",
]

# The documentation lane's builds, with the arguments `check:doc` gives
# them: the private-item rustdoc and the pruning binary itself.
["ci:prune-docs"]
description = "Prune the documentation state to the units this run's builds used"
env.RUSTDOCFLAGS = "-D warnings"
run = [
  ".config/mise/scope cargo doc --workspace --all-features --locked --no-deps --document-private-items --message-format json > target/debug/units-doc.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-doc.jsonl target/debug/units-tool.jsonl",
]

# The examples lane's builds, with the arguments `check:doctests` gives
# them: the libraries the documentation examples link and the pruning
# binary itself. Cargo refuses `--no-run` for documentation examples, so
# `RUSTDOC=true` builds the libraries they link and runs none of them.
["ci:prune-doctests"]
description = "Prune the documentation examples' state to the units this run's builds used"
run = [
  "RUSTDOC=true .config/mise/scope cargo test --doc --workspace --locked --message-format json > target/debug/units-doctests.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-doctests.jsonl target/debug/units-tool.jsonl",
]

# The Clippy lane's two passes, with the arguments ci.yml gives them, and the
# pruning binary itself.
["ci:prune-clippy"]
description = "Prune the Clippy state to the units this run's passes used"
run = [
  ".config/mise/scope cargo clippy --workspace --all-targets --locked --message-format json -- --deny warnings > target/debug/units-clippy.jsonl",
  "RUSTFLAGS='--cfg anodized_panic' CARGO_TARGET_DIR=target/enforcing .config/mise/scope cargo clippy --workspace --all-targets --locked --profile test --message-format json -- --deny warnings > target/enforcing/debug/units-clippy.jsonl",
  ".config/mise/scope cargo build --locked --profile test --package gandr-workflow-build-state --message-format json > target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/debug target/debug/units-clippy.jsonl target/debug/units-tool.jsonl",
  "target/debug/build-state prune --profile-dir target/enforcing/debug target/enforcing/debug/units-clippy.jsonl",
]

# A build script's `rerun-if-changed` inputs are read by mtime, not by
# checksum, so a fresh checkout's dates reran `runtime-emitter`'s build script
# on every restored state, and rebuilt every crate above it (#3206). An
# archived state records the sources it was built from, and an unpacked one
# dates each source unchanged since to before its build
# (`.config/build-state/sources.bash`, its cases held by `check:build-state`).
["ci:sources-record"]
description = "Record the tracked sources a build state was built from, inside its target directory"
usage = 'arg "<target>" help="the profile directory the state archives"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
source .config/build-state/sources.bash
sources_record "$usage_target"
'''

["ci:sources-restamp"]
description = "Date the sources an unpacked build state was built from to before its build"
run = '''
#!/usr/bin/env bash
set -euo pipefail
source .config/build-state/sources.bash
records=()
for dir in target/debug target/enforcing/debug; do
  if [[ -e $dir/$SOURCES_RECORD ]]; then records+=("$dir/$SOURCES_RECORD"); fi
done
sources_restamp "${records[@]}"
'''

# Main keeps one cache entry per state: the run that saved one deletes the
# entries under the state's key prefix it supersedes. Push runs of main
# overlap, so an older landing's run can save after a newer one's; a run
# deletes only the entries created before its own, and whichever run deletes
# last, the newest entry stands. Creation times compare to the second, and a
# tie deletes neither. A run whose own entry is not listed deletes nothing.
# GITHUB_REPOSITORY names the repository.
["ci:delete-superseded"]
description = "Delete main's cache entries under a key prefix created before this run's own"
usage = '''
arg "<prefix>" help="the key prefix the state's entries share"
arg "<key>" help="the key this run saved"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
gh cache list --repo "${GITHUB_REPOSITORY:?}" --ref refs/heads/main --key "${usage_prefix:?}" --limit 100 --json id,key,createdAt \
  --jq 'def created: .createdAt | sub("\\.[0-9]+"; "") | fromdate;
    (map(select(.key == env.usage_key)) | first | if . == null then null else created end) as $own
    | .[] | select($own != null and created < $own) | .id' |
  xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
{% endraw %}'''

# One hotpath series, run under the profiler and uploaded twice: as
# `<series>`, judged on allocation in every crate (hotpath/<series>-policy.toml),
# and as `<series>-timing`, judged on wall-clock time in the crates the change
# reaches (hotpath/<series>-timing-policy.toml, its `[functions]` table
# given an `ignore` naming every instrumented function of any other
# workspace crate). hotpath's policy has no timing-only ignore, so the closure
# needs a report of its own.
#
# The closure is every workspace crate a changed file sits in and every crate
# that depends on one, however indirectly. A changed lockfile, workspace
# manifest, toolchain pin or `.cargo/` file, or no base to compare with
# (main's push, a dispatch), reaches every crate. A closure that misses the
# series' package skips the timing upload. hotpath names a function by its
# full module path, `<crate>::<module>::<fn>`, with `<impl_type>::` before
# the function where the attribute names one, and an ignore pattern must
# match that whole name. A crate's names are read from its
# `#[cfg_attr(feature = "hotpath", hotpath::measure…)]` attributes, each
# pattern the crate's library name, `*` and the file's module: the file
# names only the innermost module, and `*` stands for any modules around it.
# A series' own `measure_block!` labels belong to its package. CI_BASE_SHA names the
# base. Each upload's report is also written to target/hotpath/reports/, which
# the job keeps as the artifact `hotpath-<commit>` for `ci:hotpath-base`.
#
# A report is a report, never a red `main` (#2641). Each upload's outcome is
# `.config/hotpath/upload.jq`'s: under act, which holds no OIDC token, it is
# skipped; under `HOTPATH_UPLOAD=fail-on-error` (a pull request's lane) a
# report hotpath Cloud did not take fails the job, as hotpath itself does;
# otherwise (main's push) it is a warning, the report is kept all the same,
# and its benchmark is named under target/hotpath/unsent/ for
# `ci:hotpath-unsent`, which files it.
#
# Every run's report, the uploads' among them, is kept as
# target/hotpath/runs/<series>-<n>.json, and runs without an upload follow
# until HOTPATH_RUNS (default 1) are kept: the several-run judgement of
# `ci:hotpath-judge` reads them, and the job keeps them as the artifact
# `hotpath-runs-<commit>` for a later pull request's base and main's next
# push.
["ci:hotpath"]
description = "Run a hotpath series and upload its allocation and timing reports"
tools.jq = "1.8.1"
usage = '''
arg "<series>" help="the benchmark name"
arg "<package>" help="the package holding the bench"
arg "<bench>" help="the bench target"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
series=${usage_series:?}
package=${usage_package:?}
bench=${usage_bench:?}
root=$(git rev-parse --show-toplevel)
scratch="$root/target/hotpath"
mkdir -p "$scratch/reports" "$scratch/runs" "$scratch/unsent"
rm -f "$scratch/runs/$series"-*.json "$scratch/$series-timing-policy.toml" \
  "$scratch/unsent/$series" "$scratch/unsent/$series-timing"
kept=0
keep() {
  kept=$((kept + 1))
  cp "$1" "$scratch/runs/$series-$kept.json"
}
upload() {
  rm -f "$scratch/$1.json"
  HOTPATH_BENCHMARK=$1 HOTPATH_POLICY_PATH=$2 HOTPATH_UPLOAD_RESPONSE_PATH="$scratch/$1.json" \
    HOTPATH_OUTPUT_FORMAT=json HOTPATH_OUTPUT_PATH="$scratch/reports/$1.json" \
    "$root/.config/mise/scope" cargo test --locked --profile test --package "$package" --bench "$bench" --features hotpath
  outcome=$(jq -n --arg mode "${HOTPATH_UPLOAD:-}" --arg act "${ACT:-}" --arg sent "$([[ -s $scratch/$1.json ]] && echo true)" \
    '{mode: $mode, act: ($act == "true"), sent: ($sent == "true")}' | jq -r -f "$root/.config/hotpath/upload.jq")
  case $outcome in
    refused)
      echo "::error::hotpath: the $1 report was not uploaded"
      exit 1
      ;;
    unsent)
      echo "::warning::hotpath: the $1 report was not uploaded; it is kept in the run's hotpath artifact and filed by ci:hotpath-unsent"
      : > "$scratch/unsent/$1"
      ;;
  esac
  keep "$scratch/reports/$1.json"
}
more() {
  while (( kept < ${HOTPATH_RUNS:-1} )); do
    HOTPATH_UPLOAD=0 HOTPATH_OUTPUT_FORMAT=json HOTPATH_OUTPUT_PATH="$scratch/run.json" \
      "$root/.config/mise/scope" cargo test --locked --profile test --package "$package" --bench "$bench" --features hotpath
    keep "$scratch/run.json"
  done
}
upload "$series" "$root/hotpath/$series-policy.toml"

base=${CI_BASE_SHA:-}
: > "$scratch/changed"
every=true
if [[ -n "$base" ]] && git fetch --quiet --depth=1 origin "$base" \
  && git diff --no-renames --name-only -z "$base" HEAD > "$scratch/changed"; then
  every=false
fi
cargo metadata --locked --format-version 1 > "$scratch/metadata.json"
# The first line is `in` or `out`, for the series' package; then the
# directory and the library name of each workspace crate outside the
# closure, a tab between them, one per line.
jq -r --rawfile changed "$scratch/changed" --argjson every "$every" --arg package "$package" '
  def grow($crates; $deps):
    . as $reached
    | [$crates[] | select(.id as $id | ($reached | index($id)) != null or any($deps[$id][]; . as $dep | ($reached | index($dep)) != null)) | .id]
    | if length == ($reached | length) then . else grow($crates; $deps) end;
  .workspace_root as $root
  | .workspace_members as $members
  | [.packages[] | select(.id as $id | ($members | index($id)) != null)
      | {id, name, dir: (.manifest_path | ltrimstr($root + "/") | rtrimstr("Cargo.toml")),
         lib: (([.targets[] | select(.kind | index("lib"))] | first | .name) // .name | gsub("-"; "_"))}] as $crates
  | ([.resolve.nodes[] | {key: .id, value: [.deps[].pkg]}] | from_entries) as $deps
  | ($changed | split("\u0000") | map(select(length > 0))) as $files
  | ($every or any($files[]; . == "Cargo.lock" or . == "Cargo.toml" or . == "rust-toolchain.toml" or startswith(".cargo/"))) as $all
  | (if $all then [$crates[].id]
     else [$crates[] | select(.dir as $dir | any($files[]; startswith($dir))) | .id] | grow($crates; $deps) end) as $closure
  | (if any($crates[]; .name == $package and (.id as $id | ($closure | index($id)) != null)) then "in" else "out" end),
    ($crates[] | select(.id as $id | ($closure | index($id)) == null) | "\(.dir)\t\(.lib)")
' "$scratch/metadata.json" > "$scratch/outside"
if [[ $(head -n 1 "$scratch/outside") != in ]]; then
  echo "the change reaches no crate $package depends on: no $series-timing upload"
  more
  exit 0
fi
tail -n +2 "$scratch/outside" | while IFS=$'\t' read -r dir lib; do
  [[ -d "$root/${dir}src" ]] || continue
  find "$root/${dir}src" -name '*.rs' -exec awk -v lib="$lib" '
    FNR == 1 {
      stem = FILENAME; sub(/\.rs$/, "", stem); sub(/\/mod$/, "", stem); sub(/.*\//, "", stem)
      module = stem == "lib" ? lib : lib "::*" stem
      pending = 0
    }
    /hotpath::measure/ {
      pending = 1; owner = module
      if (match($0, /impl_type = "[^"]+"/)) owner = module "::" substr($0, RSTART + 13, RLENGTH - 14)
      next
    }
    pending && match($0, /fn [A-Za-z_][A-Za-z0-9_]*/) { print owner "::" substr($0, RSTART + 3, RLENGTH - 3); pending = 0 }
  ' {} +
done | sort -u > "$scratch/ignored"
# hotpath takes `ignore` in the `[functions]` table alone and refuses it in
# a metric block (#996), so the line goes right under that table's header,
# wherever the formatter places the table.
ignore=
if [[ -s "$scratch/ignored" ]]; then
  ignore="ignore = [$(sed 's/.*/"&"/' "$scratch/ignored" | paste -sd, -)]"
fi
awk -v ignore="$ignore" '
  { print }
  $0 == "[functions]" { found = 1; if (ignore != "") print ignore }
  END { if (!found) { print FILENAME " has no [functions] table to hold the ignore" > "/dev/stderr"; exit 1 } }
' "$root/hotpath/$series-timing-policy.toml" > "$scratch/$series-timing-policy.toml"
upload "$series-timing" "$scratch/$series-timing-policy.toml"
more
{% endraw %}'''

# A pull request's baseline: the reports of its base branch's head, uploaded
# to hotpath Cloud as this pull request's before its own, so the Cloud
# compares the head with the commit below it rather than with main's newest
# (#2019). A stacked pull request then reads only its own contribution, and
# a regression the pull request below carries reads 0 % here.
#
# The base head's run kept its reports as the artifact `hotpath-<base>`
# (ci:hotpath); each is stamped with this pull request's event fields, its
# `base_sha` and the other run's `ref` dropped (it is the base), its policy's
# `pr_check` set to `off` so it posts no check, and posted with the job's
# OIDC token, as hotpath's own relay posts a report file. When no run kept
# one (a base whose change reached no Rust, an expired artifact), the base
# is checked out, each series built and run with the same policy change, its
# in-process upload reading it as the base's report since the checkout is
# the event's base, and the head checked out again; the reports land in
# target/hotpath/base/measured/, which the job keeps as `hotpath-<base>`.
# Arguments: `<series>:<package>:<bench>`, one per series. GITHUB_EVENT_PATH,
# GITHUB_REPOSITORY, CI_BASE_SHA and GH_TOKEN describe the run.
["ci:hotpath-base"]
description = "Upload a pull request's base head's hotpath reports before its own"
tools.jq = "1.8.1"
usage = 'arg "<series>..." help="each series as series:package:bench"'
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
base=${CI_BASE_SHA:?the pull request base head}
repo=${GITHUB_REPOSITORY:?}
root=$(git rev-parse --show-toplevel)
dir="$root/target/hotpath/base"
rm -rf "$dir"
mkdir -p "$dir/found" "$dir/measured" "$dir/policy"
eval "series=(${usage_series:?})"
pull=$(jq -c '.pull_request | {number, base_ref: .base.ref, head_ref: .head.ref, head_sha: .head.sha}' "${GITHUB_EVENT_PATH:?}")
run=$(gh api "repos/$repo/actions/artifacts?name=hotpath-$base&per_page=100" \
  --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
if [[ -n $run ]] && gh run download "$run" -R "$repo" -n "hotpath-$base" -D "$dir/found" \
  && compgen -G "$dir/found/*.json" > /dev/null; then
  token=$(curl -sS --fail -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?}" \
    "${ACTIONS_ID_TOKEN_REQUEST_URL:?}&audience=hotpath.rs" | jq -er .value)
  echo "::add-mask::$token"
  for report in "$dir/found"/*.json; do
    benchmark=$(basename "$report" .json)
    jq --argjson pull "$pull" '
      .meta.ci.event = "pull_request"
      | .meta.ci.pull_request = $pull
      | del(.meta.git.base_sha, .meta.git.ref)
      | if .meta.policy then .meta.policy.source |= (split("\n") | map(if startswith("pr_check") then "pr_check = \"off\"" else . end) | join("\n")) else . end
    ' "$report" > "$dir/upload.json"
    status=$(curl -sS -X POST "${HOTPATH_API_URL:-https://hotpath.rs}/api/v1/reports" \
      --url-query "benchmark=$benchmark" -H "Authorization: Bearer $token" \
      -H "Content-Type: application/json" --data-binary @"$dir/upload.json" \
      -o "$dir/response.json" -w '%{http_code}')
    if [[ $status != 200 && $status != 201 ]]; then
      echo "hotpath.rs refused $benchmark's base report (HTTP $status): $(head -c 2000 "$dir/response.json")" >&2
      exit 1
    fi
    echo "uploaded $benchmark's base report from hotpath-$base (run $run)"
  done
  exit 0
fi
echo "no run kept hotpath-$base: building and running the base here"
head=$(git rev-parse HEAD)
git fetch --quiet --depth=1 origin "$base"
git checkout --quiet --detach "$base"
trap 'git checkout --quiet --detach "$head"' EXIT
for spec in "${series[@]}"; do
  IFS=: read -r name package bench <<< "$spec"
  for benchmark in "$name" "$name-timing"; do
    [[ -f "$root/hotpath/$benchmark-policy.toml" ]] || continue
    awk '/^pr_check *=/ { print "pr_check = \"off\""; next } { print }' \
      "$root/hotpath/$benchmark-policy.toml" > "$dir/policy/$benchmark-policy.toml"
    HOTPATH_BENCHMARK=$benchmark HOTPATH_POLICY_PATH="$dir/policy/$benchmark-policy.toml" \
      HOTPATH_UPLOAD_RESPONSE_PATH="$dir/$benchmark-response.json" \
      HOTPATH_OUTPUT_FORMAT=json HOTPATH_OUTPUT_PATH="$dir/measured/$benchmark.json" \
      "$root/.config/mise/scope" cargo test --locked --profile test --package "$package" --bench "$bench" --features hotpath
    test -s "$dir/$benchmark-response.json"
  done
done
{% endraw %}'''

# A commit's hotpath runs judged against its base's, several a side
# (crates/workflow-hotpath-guard/src/judge.rs). On a pull request the judge
# reads only the rows under each policy's share floor: hotpath Cloud judges
# the rows at and over it on one report a side, and skips the rest. With
# `--all`, on main's push against the commit main stood at before it (the
# push's `before`, never its first parent: a chain pushed by hand brings
# several commits), the judge reads every row, which hotpath Cloud never
# judges on a push. The base's runs are the artifact `hotpath-runs-<base>`
# its own run kept, never measured here; without one nothing is judged,
# said once. Each series is judged as `<series>-<scope>` under its
# allocation policy and, when `ci:hotpath` wrote a timing policy for it (the
# change reaches the series), as `<series>-timing-<scope>` under that one,
# its ignore included, `<scope>` being `band` or, with `--all`, `push`. Each
# judgement's check run body is written to target/hotpath/judged/, which
# the job keeps for the poster: the job running the change's code holds no
# token to post a check. Arguments: `--all`, then each series' name.
# GITHUB_REPOSITORY, CI_BASE_SHA, CI_HEAD_SHA and GH_TOKEN describe the run.
["ci:hotpath-judge"]
description = "Judge a commit's hotpath runs against its base's, several a side"
usage = '''
flag "--all" help="judge every row, as main's push does, not only those under the share floor"
arg "<series>..." help="each series by name"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
shopt -s nullglob
base=${CI_BASE_SHA:?the base commit}
head=${CI_HEAD_SHA:?the judged commit}
repo=${GITHUB_REPOSITORY:?}
root=$(git rev-parse --show-toplevel)
scratch="$root/target/hotpath"
dir="$scratch/judged"
rm -rf "$dir"
mkdir -p "$dir/base" "$dir/checks"
eval "series=(${usage_series:?})"
scope=band
band=(--band)
if [[ ${usage_all:-false} == true ]]; then
  scope=push
  band=()
fi
run=$(gh api "repos/$repo/actions/artifacts?name=hotpath-runs-$base&per_page=100" \
  --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
if [[ -z $run ]] || ! gh run download "$run" -R "$repo" -n "hotpath-runs-$base" -D "$dir/base"; then
  echo "no run kept hotpath-runs-$base: no $scope judgement"
  exit 0
fi
for name in "${series[@]}"; do
  for benchmark in "$name" "$name-timing"; do
    policy="$root/hotpath/$benchmark-policy.toml"
    if [[ $benchmark == "$name-timing" ]]; then policy="$scratch/$benchmark-policy.toml"; fi
    if [[ ! -f $policy ]]; then
      echo "$benchmark: the change reaches no crate of the series; no $scope judgement"
      continue
    fi
    base_runs=("$dir/base/$name"-[0-9]*.json)
    head_runs=("$scratch/runs/$name"-[0-9]*.json)
    if (( ${#base_runs[@]} == 0 || ${#head_runs[@]} == 0 )); then
      echo "$benchmark: no runs of $name on both sides; no $scope judgement"
      continue
    fi
    runs=()
    for report in "${base_runs[@]}"; do runs+=(--base-run "$report"); done
    for report in "${head_runs[@]}"; do runs+=(--head-run "$report"); done
    "$root/.config/mise/scope" cargo run --locked --quiet --profile test --package gandr-workflow-hotpath-guard --bin hotpath-judge -- \
      --repository "$repo" --head "$head" --base "$base" --benchmark "$benchmark-$scope" \
      --policy "$policy" "${band[@]}" --output "$dir/checks/$benchmark-$scope.json" "${runs[@]}"
  done
done
{% endraw %}'''

# A commit's concluded `hotpath / <benchmark>` checks, filed on one issue per
# regressed function, `perf: <function>`, labelled kind:performance and the
# function's area: its body indexes the function's regressions, and each
# pull request has one report comment there, edited by its later runs
# (crates/workflow-hotpath-guard/README.md). The hotpath guard workflow runs
# it on each concluded check's completion. Arguments pass through: `--sha`,
# optionally `--repository`, `--pull` and `--file-issue`.
["ci:hotpath-guard"]
description = "A commit's hotpath checks, filed on each regressed function's issue"
run = ".config/mise/scope cargo run --locked --quiet --package gandr-workflow-hotpath-guard --bin hotpath-guard --"

# A landing's hotpath verdicts, read on main's push from each merged pull
# request's `hotpath / <benchmark>` checks (the number from each landing
# merge's `(#n)` suffix, the checks on the pull request's head). A merge
# queue lands a stack in one push, so every merge commit after the push's
# base (HOTPATH_PUSH_BEFORE) is read, through the compare API: the checkout
# holds one commit. Only a merge names its pull request: a branch commit the
# merge brings may end its subject with an issue's number, as `(#1216)` did,
# and is never read. A number that names no pull request is skipped with a
# note. Each red check and each report that improves past its policy's
# band is a row of the open `Hotpath: the landed deltas` tracking issue, whose
# body the task rewrites in place: its prose kept, its rows collapsed under a
# summary counting the landings, the regressed and the improved. A red row
# links the issues of the functions the pull request regressed, each holding
# the pull request's row (the hotpath guard's index). A commit without a pull
# request number reads nothing. GH_REPO names the repository.
["ci:hotpath-landed"]
description = "Add the landed pull requests' hotpath verdicts to the ledger"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
ledger_title='Hotpath: the landed deltas'
before=${HOTPATH_PUSH_BEFORE:-}
if [[ -n $before && ! $before =~ ^0+$ ]]; then
  landings=$(gh api "repos/$repo/compare/$before...$(git rev-parse HEAD)" \
    --jq '.commits[] | select((.parents | length) > 1) | "\(.sha[0:8]) \(.commit.message | split("\n") | first)"')
elif (( $(git cat-file -p HEAD | grep -c '^parent ') > 1 )); then
  landings="$(git rev-parse --short=8 HEAD) $(git log -1 --format=%s HEAD)"
else
  landings=
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
: > "$scratch/rows"
landed=0
while IFS=' ' read -r commit subject; do
  [[ $subject =~ \(#([0-9]+)\)$ ]] || continue
  pr=${BASH_REMATCH[1]}
  if ! head=$(gh pr view "$pr" --repo "$repo" --json headRefOid --jq .headRefOid 2> /dev/null); then
    echo "#$pr names no pull request; skipped"
    continue
  fi
  landed=$((landed + 1))
  gh api --paginate "repos/$repo/commits/$head/check-runs" \
    --jq '.check_runs[] | select(.name | startswith("hotpath / ")) | {name, conclusion, summary: (.output.summary // "")}' \
    | jq -s . > "$scratch/runs.json"
  if [[ $(jq length "$scratch/runs.json") == 0 ]]; then
    echo "#$pr carries no hotpath check"
    continue
  fi
  issues=$(gh issue list --repo "$repo" --state all --label kind:performance --limit 100 \
    --search "\"#$pr\" in:body" --json number,title,body \
    | jq -r --arg row "| #$pr |" '[.[] | select((.title | startswith("perf: ")) and (.body | contains($row))) | "#\(.number)"] | join(" ")')
  while IFS= read -r run; do
    benchmark=$(jq -r '.name | ltrimstr("hotpath / ")' <<< "$run")
    conclusion=$(jq -r '.conclusion // "pending"' <<< "$run")
    # The summary's heading reads `` `<benchmark>` · <verdict> ``.
    verdict=$(jq -r '.summary | split("\n") | map(select(startswith("### "))) | (first // "") | sub("^### [^·]*· *"; "")' <<< "$run")
    if [[ $conclusion == failure ]]; then
      row_issue=${issues:-—}
    elif grep -qi improv <<< "$verdict"; then
      row_issue='—'
    else
      continue
    fi
    printf '| %s | #%s | %s | %s | %s |\n' "$commit" "$pr" "$benchmark" "${verdict:-$conclusion}" "$row_issue" >> "$scratch/rows"
  done < <(jq -c '.[]' "$scratch/runs.json")
done <<< "$landings"
if (( landed == 0 )); then
  echo "the push merges no pull request: no hotpath verdict to read"
  exit 0
fi
if [[ ! -s $scratch/rows ]]; then
  echo "no hotpath regression or improvement past the band in $landed landing(s)"
  exit 0
fi
ledger=$(gh issue list --repo "$repo" --state open --label collector --search "\"$ledger_title\" in:title" --json number,title \
  | jq -r --arg title "$ledger_title" '[.[] | select(.title == $title)] | first | .number // empty')
header='| Commit | PR | Benchmark | Verdict | Issue |'
: > "$scratch/kept"
if [[ -z $ledger ]]; then
  printf 'Every landing whose `hotpath / <benchmark>` check is red, or whose report improves past its policy'"'"'s band, is one row here. `mise run ci:hotpath-landed` adds the row on main'"'"'s push; a red row links the issues of the functions it regressed, where the pull request'"'"'s row is settled by a fix or a stated acceptance.\n' > "$scratch/prose"
else
  gh issue view "$ledger" --repo "$repo" --json body --jq .body | tr -d '\r' > "$scratch/ledger.md"
  # The prose before the table, less the collapsed block's opening and the
  # blank lines that end it; then the table's rows.
  awk -v header="$header" '$0 == header {exit} /^<details><summary>/ {next} {line[++n] = $0}
    END {while (n > 0 && line[n] ~ /^[[:space:]]*$/) n--; for (i = 1; i <= n; i++) print line[i]}' \
    "$scratch/ledger.md" > "$scratch/prose"
  awk -v header="$header" '$0 == header {table = 1; getline; next} table && /^\|/ {print} table && /^<\/details>/ {exit}' \
    "$scratch/ledger.md" > "$scratch/kept"
fi
while IFS= read -r row; do
  key=$(cut -d'|' -f3-4 <<< "$row")
  if grep -qF -- "$key" "$scratch/kept"; then continue; fi
  printf '%s\n' "$row" >> "$scratch/kept"
done < "$scratch/rows"
count=$(wc -l < "$scratch/kept" | tr -d ' ')
rows=rows
(( count != 1 )) || rows=row
regressed=$(cut -d'|' -f5 "$scratch/kept" | grep -cF '⚠️' || true)
improved=$(cut -d'|' -f5 "$scratch/kept" | grep -ci improv || true)
{
  cat "$scratch/prose"
  printf '\n<details><summary>%s %s — %s regressed, %s improved</summary>\n\n%s\n| --- | --- | --- | --- | --- |\n' \
    "$count" "$rows" "$regressed" "$improved" "$header"
  cat "$scratch/kept"
  printf '\n</details>\n'
} > "$scratch/ledger.md"
if [[ -z $ledger ]]; then
  ledger=$(gh issue create --repo "$repo" --title "$ledger_title" --label collector --label area:workflow \
    --label kind:performance --label priority:medium --label effort:unknown \
    --body-file "$scratch/ledger.md" | sed 's|.*/||')
else
  gh issue edit "$ledger" --repo "$repo" --body-file "$scratch/ledger.md" > /dev/null
fi
echo "ledger #$ledger"
cat "$scratch/rows"
{% endraw %}'''

# Main's hotpath reports not uploaded (#2641): each benchmark `ci:hotpath`
# could not upload on main's push (HOTPATH_UNSENT, space-separated) is a row
# of one open `kind:ci` issue, `ci: hotpath reports not uploaded on main`,
# opened by the first and updated by each later one; `.config/hotpath/
# unsent.jq` writes its body. The row links the run, whose `hotpath-<commit>`
# artifact keeps the measurements. GH_REPO names the repository;
# GITHUB_SERVER_URL, GITHUB_RUN_ID and GITHUB_SHA the run.
["ci:hotpath-unsent"]
description = "File main's hotpath reports not uploaded on one kind:ci issue"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
title='ci: hotpath reports not uploaded on main'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
gh issue list --repo "$repo" --state open --label kind:ci --search "\"$title\" in:title" --json number,title,body \
  | jq -c --arg title "$title" '[.[] | select(.title == $title)] | first' > "$scratch/issue.json"
jq -n --slurpfile issue "$scratch/issue.json" --arg commit "${GITHUB_SHA:?}" \
  --arg url "${GITHUB_SERVER_URL:?}/$repo/actions/runs/${GITHUB_RUN_ID:?}" --arg benchmarks "${HOTPATH_UNSENT:?}" \
  '{issue: $issue[0], run: {commit: $commit, url: $url, benchmarks: ($benchmarks | split(" ") | map(select(length > 0)))}}' \
  | jq -c -f .config/hotpath/unsent.jq > "$scratch/filed.json"
jq -r .body "$scratch/filed.json" > "$scratch/body.md"
number=$(jq -r '.number // empty' "$scratch/filed.json")
if [[ -z $number ]]; then
  gh issue create --repo "$repo" --title "$title" --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number"
fi
'''

# A landing's surviving mutants, read on main's push from each merged pull
# request's mutants comment, the one the `report the mutants of the change`
# lane last posted (`mutants:changed`, #1456). A merge queue lands a stack in
# one push, so every merge commit after the push's base (MUTANTS_PUSH_BEFORE)
# is read through the compare API, as `ci:hotpath-landed` reads them, and a
# number that names no pull request is skipped with a note. Each pull
# request whose report names a survivor gets one issue, `test: #<n> leaves <k>
# mutant(s) alive`. A later landing of the same number updates it in place.
# Its labels are kind:gap, `collector` (#2537), the pull request's `area:`
# labels and the tier of each crate a survivor lives in, so the lane that
# owns the crate picks it up. Its body is the report. A commit without a pull
# request number, or a pull request without a report, files nothing. GH_REPO
# names the repository.
["ci:mutants-landed"]
description = "File each landed pull request's surviving mutants on one issue"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
repo=${GH_REPO:?}
before=${MUTANTS_PUSH_BEFORE:-}
if [[ -n $before && ! $before =~ ^0+$ ]]; then
  landings=$(gh api "repos/$repo/compare/$before...$(git rev-parse HEAD)" \
    --jq '.commits[] | select((.parents | length) > 1) | .commit.message | split("\n") | first')
elif (( $(git cat-file -p HEAD | grep -c '^parent ') > 1 )); then
  landings=$(git log -1 --format=%s HEAD)
else
  landings=
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
while IFS= read -r subject; do
  [[ $subject =~ \(#([0-9]+)\)$ ]] || continue
  pr=${BASH_REMATCH[1]}
  if ! gh pr view "$pr" --repo "$repo" --json number > /dev/null 2>&1; then
    echo "#$pr names no pull request; skipped"
    continue
  fi
  gh api --paginate --slurp "repos/$repo/issues/$pr/comments" \
    | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- gandr-mutants -->")))] | first | .body // ""' \
    > "$scratch/report.md"
  if [[ ! -s $scratch/report.md ]]; then
    echo "#$pr carries no mutants report"
    continue
  fi
  count=$(sed -n 's/^\([0-9][0-9]*\) survivor(s)\.$/\1/p' "$scratch/report.md" | tail -n 1)
  if [[ -z $count || $count == 0 ]]; then
    echo "#$pr leaves no mutant of its lines alive"
    continue
  fi
  labels=(--label kind:gap --label collector --label priority:medium --label effort:unknown)
  while IFS= read -r label; do labels+=(--label "$label"); done < <({
    gh pr view "$pr" --repo "$repo" --json labels --jq '.labels[].name | select(startswith("area:"))'
    sed -n 's/^| `crates\/\([a-z]*\)-[^`]*` | .*/\1/p' "$scratch/report.md" \
      | grep -Fx -e kernel -e theory -e core -e storage -e runtime -e surface -e workflow | sed 's/^/area:/' || true
  } | sort -u)
  {
    printf 'Landed with #%s: the mutants of its own lines that no witness caught, as its last mutants report read them. Each survivor is a witness to write, or a `- witness:` bullet its function lacks.\n\n' "$pr"
    sed '1{/^<!-- gandr-mutants -->$/d;}' "$scratch/report.md"
  } > "$scratch/body.md"
  title="test: #$pr leaves $count mutant(s) alive"
  key="test: #$pr leaves "
  issue=$(gh issue list --repo "$repo" --state open --search "\"${key% }\" in:title" --json number,title \
    | jq -r --arg key "$key" '[.[] | select(.title | startswith($key))] | first | .number // empty')
  if [[ -n $issue ]]; then
    gh issue edit "$issue" --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]/#--label/--add-label}" > /dev/null
    echo "#$pr: updated #$issue ($count survivor(s))"
  else
    url=$(gh issue create --repo "$repo" --title "$title" --body-file "$scratch/body.md" "${labels[@]}")
    echo "#$pr: opened $url ($count survivor(s))"
  fi
done <<< "$landings"
{% endraw %}'''

# The night's recovery sweep, filed by cause (`ledger:recovery`, #1782): one
# issue per first error and mutation kind, never one per mutant or exemplar.
# The report's `cause:` lines name each cause with its count and families. A
# cause is filed as `recovery: <name> marks other bytes than a <kind> tile`,
# kind:defect, area:surface and `collector` (#2537), its body the cause's
# first findings and its families as a checklist collapsed under their
# count. A cause already filed
# is skipped: an issue in any state whose title opens with `recovery: <name> `
# and names the kind's tile, or names neither kind's and so covers both
# (#1829). A night opens at most
# RECOVERY_LIMIT issues (3 by default), the causes largest first as the report
# ranks them, so a first sweep's long tail is filed over later nights rather
# than in one burst. RECOVERY_REPORT names the report (`target/recovery.txt`
# by default); without RECOVERY_FILE set the task prints what it would file
# and files nothing. GH_REPO names the repository; GITHUB_RUN_URL, when set,
# is linked from each body.
#
# The task keeps the open recovery collectors' rows (#3326,
# `.config/claims/swept.jq`, its cases held by `check:claims`): over a whole
# report, the one ending in its `mutants swept:` line, each family row of a
# collector is ticked once the night's cause of its name and kind no longer
# lists the family, and unticked when it lists it again. A night without the
# cause is a clear run, counted on the body; the third in a row closes the
# collector, its comment naming the landing whose body `Advances` it, the
# latest merged.
["ci:recovery-file"]
description = "File each cause of the recovery sweep's report on one issue"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
report=${RECOVERY_REPORT:-target/recovery.txt}
file=${RECOVERY_FILE:-}
limit=${RECOVERY_LIMIT:-3}
opened=0
repo=${GH_REPO:-}
if [[ -n $file && -z $repo ]]; then
  echo "RECOVERY_FILE needs GH_REPO" >&2
  exit 2
fi
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
if [[ -n $repo ]]; then
  gh issue list --repo "$repo" --state all --limit 1000 --search '"recovery:" in:title' --json number,title > "$scratch/filed.json"
fi
pattern='^cause: `([^`]+)` (deleted|missed): ([0-9]+) mutants in ([0-9]+) families: (.*)$'
while IFS= read -r line; do
  [[ $line =~ $pattern ]] || continue
  name=${BASH_REMATCH[1]} kind=${BASH_REMATCH[2]} count=${BASH_REMATCH[3]} family_count=${BASH_REMATCH[4]} families=${BASH_REMATCH[5]}
  family_noun=families
  (( family_count != 1 )) || family_noun=family
  title="recovery: $name marks other bytes than a $kind tile"
  if [[ $name == unnamed ]]; then
    first=': first error "'
  else
    first=": first error \`$name\`"
  fi
  if [[ $kind == deleted ]]; then
    how='` deleted: first error'
    wrong='deleted'
  else
    how='` written as `'
    wrong='written as its near miss'
  fi
  grep -F -e "$first" "$report" | grep -F -e "$how" | head -n 5 > "$scratch/findings" || true
  {
    printf 'The recovery sweep (`gandr ledger recovery corpus/ledger`, #1782) writes each literal tile of each syntax exemplar wrong and reads the first error. %s mutants whose tile was %s are first refused `%s` at other bytes than the mutation.\n\n' "$count" "$wrong" "$name"
    printf '## Findings\n\nThe first of them; the nightly run lists every one%s.\n\n```text\n' "${GITHUB_RUN_URL:+ ($GITHUB_RUN_URL)}"
    cat "$scratch/findings"
    printf '```\n\n## Families\n\nA box is ticked once the sweep marks the family'"'"'s mutants where they were made.\n\n<details><summary>%s %s — open</summary>\n\n' "$family_count" "$family_noun"
    tr ',' '\n' <<< "$families" | sed 's/^ *//; s/^\(.*\)$/- [ ] `\1`/'
    printf '\n</details>\n'
  } > "$scratch/body.md"
  if [[ -n $repo ]]; then
    filed=$(jq -r --arg key "recovery: $name " --arg tile " $kind tile" \
      '[.[] | select((.title | startswith($key)) and ((.title | contains($tile)) or ((.title | contains(" deleted tile") | not) and (.title | contains(" missed tile") | not))))] | first | .number // empty' \
      "$scratch/filed.json")
    if [[ -n $filed ]]; then
      echo "filed already as #$filed: $title"
      continue
    fi
  fi
  if (( opened >= limit )); then
    echo "deferred to a later night: $title ($count mutants)"
    continue
  fi
  opened=$(( opened + 1 ))
  if [[ -z $file ]]; then
    echo "would file: $title ($count mutants)"
    continue
  fi
  url=$(gh issue create --repo "$repo" --title "$title" --label kind:defect --label area:surface --label collector \
    --label priority:high --label effort:easy --body-file "$scratch/body.md")
  echo "filed $url: $title ($count mutants)"
done < "$report"
if ! grep -q -E '^[0-9]+ mutants swept: ' "$report"; then
  echo "the report ends in no \`mutants swept:\` line, so no collector's rows are read from it" >&2
  exit 0
fi
[[ -n $repo ]] || exit 0
claims=$(git rev-parse --show-toplevel)/.config/claims
jq -R 'capture("^cause: `(?<name>[^`]+)` (?<kind>deleted|missed): [0-9]+ mutants in [0-9]+ families: (?<families>.*)$")
    | .families |= (split(",") | map(gsub("^\\s+|\\s+$"; "")))' "$report" \
  | jq -s . > "$scratch/causes.json"
gh issue list --repo "$repo" --state open --label collector --limit 1000 --search '"recovery:" in:title' --json number,title,body > "$scratch/open.json"
jq -n --slurpfile causes "$scratch/causes.json" --slurpfile issues "$scratch/open.json" '{causes: $causes[0], issues: $issues[0]}' \
  | jq -c -L "$claims" -f "$claims/swept.jq" \
  | while IFS= read -r swept; do
      number=$(jq -r .number <<< "$swept")
      close=$(jq -r .close <<< "$swept")
      if [[ -z $file ]]; then
        echo "would mark #$number's rows ($(jq -r .clear <<< "$swept") clear run(s))$([[ $close == true ]] && echo ', and close it')"
        continue
      fi
      jq -r .body <<< "$swept" > "$scratch/swept.md"
      gh issue edit "$number" --repo "$repo" --body-file "$scratch/swept.md" > /dev/null
      echo "marked #$number's rows ($(jq -r .clear <<< "$swept") clear run(s))"
      if [[ $close == true ]]; then
        landing=$(gh pr list --repo "$repo" --state merged --limit 100 --search "\"#$number\" in:body" --json number,mergedAt,body \
          | jq -r --arg n "$number" '[.[] | select(.body | test("(?i)\\badvances\\s+#\($n)\\b"))] | max_by(.mergedAt) | .number // empty')
        gh issue close "$number" --repo "$repo" --comment "The recovery sweep has found no mutant of this cause for three nights${GITHUB_RUN_URL:+ ($GITHUB_RUN_URL)}, so every family is marked where it was made; $(if [[ -n $landing ]]; then echo "the landing: #$landing."; else echo "no merged pull request advances it."; fi)" > /dev/null
        echo "closed #$number${landing:+ (the landing: #$landing)}"
      fi
    done
{% endraw %}'''

# A worktree is removed when its branch lands, mechanically: nothing else
# removed one but a seat remembering to, and a `pr:watch` that dies with its
# shell never prints `pr-merged`, so landed worktrees and their build
# directories piled up until a disk filled. `pr:open`, `pr:land` and the
# `pre-start` hook run this sweep, and `pr:land` and `pr:watch` remove the
# landed pull request's own worktree, so no seat has to remember.
#
# The decisions are `.config/pr-stack/sweep.jq`'s, its cases held by
# `check:pr-stack`; this task reads the facts and acts. A branch has landed
# when Worktrunk reads it integrated into the default branch (`wt list`: the
# same commit, an ancestor, or its changes already there, which holds a
# branch whose server copy a restack moved) and the head Worktrunk read beside
# that reason is off origin/main's first-parent line: the merge queue lands a
# branch as a merge's second parent, while a branch cut from main and not yet
# committed to sits on that line. Both halves come from the one `wt list`
# snapshot (#2299): judged across two reads, a branch whose first commit fell
# between them read integrated at main's tip and off the line at its commit,
# and its live worktree went. A worktree whose head is no longer the judged
# one is kept, and the head is read once more just before `wt remove`. A
# landed branch's worktree goes by `wt remove --foreground`, which deletes the
# branch as merged and refuses a dirty or otherwise unsafe tree; the sweep
# makes no safety check of its own, prints a refusal and keeps that tree. The
# primary worktree, the caller's own and `wip/` branches stay. A
# scratch worktree (`restack`'s and the mutation lanes', named
# `gandr-scratch-<pid>.`) goes once its process is gone, and an unnamed
# detached one under a temporary directory once unchanged for 4 hours. Then
# `git worktree prune`, and Worktrunk's trash (`.git/wt/trash`), whose
# background deletes die with the shell that started them, is emptied.
#
# With `--guard` (`pr:open`, `pre-start`) the task refuses when the free
# space left is under 150 GB, naming the largest build directories.
["wt:sweep"]
description = "Remove this clone's landed worktrees and leaked scratch, and with --guard refuse under 150 GB free"
tools.jq = "1.8.1"
usage = '''
flag "--guard" help="refuse when the free space after the sweep is under 150 GB"
flag "--dry-run" help="print each worktree's decision and act on none"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
floor_gb=150
command -v wt > /dev/null || { echo "wt:sweep needs Worktrunk's wt on PATH" >&2; exit 2; }
here=$(realpath "$(git rev-parse --show-toplevel)")
common=$(git rev-parse --path-format=absolute --git-common-dir)
trunk_ref=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD) || trunk_ref=origin/main
git fetch --quiet origin "${trunk_ref#origin/}" || echo "wt:sweep: fetching $trunk_ref failed; sweeping against the last fetch" >&2
declare -A first_parent=()
while IFS= read -r commit; do first_parent[$commit]=1; done < <(git rev-list --first-parent "$trunk_ref")
# The integration reason and the head it was judged at, from one snapshot; the
# head leads its line, as it is never empty and a tab-separated read
# collapses an empty field in the middle.
declare -A integrated=() judged=()
while IFS=$'\t' read -r tree_path sha reason; do
  key=$(realpath "$tree_path" 2> /dev/null || printf '%s' "$tree_path")
  integrated[$key]=$reason
  judged[$key]=$sha
done < <(wt list --format=json | jq -r '.items[] | select(.worktree != null and .worktree.path != null) | [.worktree.path, .head.sha, (.default_branch.integration.reason // "")] | @tsv')
tmp_roots=()
for root in "${TMPDIR:-/tmp}" /tmp /var/folders; do
  [[ -d "$root" ]] || continue
  tmp_roots+=("${root%/}/" "$(realpath "$root")/")
done
under_tmp() {
  local root
  for root in "${tmp_roots[@]}"; do [[ "$1" == "$root"* ]] && return 0; done
  return 1
}
# One fact line per worktree, then the decisions; the primary is listed
# first by Git.
facts=()
kept=()
pruned=()
tree() {
  local merged=false moved=false scratch=null holder=null alive=false young=false gitdir key
  [[ -n "$path" ]] || return 0
  if [[ "$flag" == prunable ]]; then pruned+=("pruned $path${branch:+ ($branch)}: its directory is gone"); return 0; fi
  if [[ -n "$flag" ]]; then kept+=("kept $path${branch:+ ($branch)}: $flag"); return 0; fi
  key=$(realpath "$path")
  if [[ -n "$branch" && -n "${integrated[$key]:-}" && -z "${first_parent[${judged[$key]:-none}]:-}" ]]; then merged=true; fi
  if [[ -n "${judged[$key]:-}" && "$head" != "${judged[$key]}" ]]; then moved=true; fi
  if [[ "$path" =~ /gandr-scratch-([0-9]+)\. ]] || { [[ -z "$branch" ]] && under_tmp "$path"; }; then
    if [[ "$path" =~ /gandr-scratch-([0-9]+)\. ]]; then
      holder=${BASH_REMATCH[1]}
      if kill -0 "$holder" 2> /dev/null; then alive=true; fi
    fi
    gitdir=$(sed -n 's/^gitdir: //p' "$path/.git" 2> /dev/null) || gitdir=
    if [[ -n "$gitdir" && -n $(find "$gitdir" -maxdepth 1 -name index -mmin -240 2> /dev/null) ]]; then young=true; fi
    scratch=$(jq -nc --argjson holder "$holder" --argjson alive "$alive" --argjson young "$young" '{holder: $holder, alive: $alive, young: $young}')
  fi
  facts+=("$(jq -nc --arg path "$path" --arg branch "$branch" --argjson primary "$primary" \
    --argjson cwd "$([[ $key == "$here" ]] && echo true || echo false)" \
    --argjson merged "$merged" --argjson moved "$moved" --argjson scratch "$scratch" \
    '{path: $path, branch: (if $branch == "" then null else $branch end), primary: $primary, cwd: $cwd, merged: $merged, moved: $moved, scratch: $scratch}')")
}
path= head= branch= flag= primary=true
while IFS= read -r line; do
  case "$line" in
    "worktree "*) path=${line#worktree } ;;
    "HEAD "*) head=${line#HEAD } ;;
    "branch "*) branch=${line#branch refs/heads/} ;;
    locked*) flag="locked" ;;
    prunable*) flag=prunable ;;
    "")
      tree
      if [[ -n "$path" ]]; then primary=false; fi
      path= head= branch= flag=
      ;;
  esac
done < <(git worktree list --porcelain; echo)
removed=0
dry_run=${usage_dry_run:-false}
# A detached worktree's branch reads `-`: a tab field cannot be empty.
while IFS=$'\t' read -r action path branch reason; do
  if [[ "$branch" == - ]]; then branch=; fi
  label="$path${branch:+ ($branch)}"
  if [[ "$dry_run" == true ]]; then printf '%s %s: %s\n' "$action" "$label" "$reason"; continue; fi
  case "$action" in
    remove)
      judged_head=${judged[$(realpath "$path")]:-}
      if now=$(git -C "$path" rev-parse HEAD 2> /dev/null) && [[ "$now" != "$judged_head" ]]; then
        kept+=("kept $label: $reason, but its head moved to ${now:0:9} after it was judged at ${judged_head:0:9}")
      elif out=$(wt remove --foreground --yes "$path" 2>&1); then
        echo "removed $label: $reason"
        removed=$((removed + 1))
      else
        kept+=("kept $label: $reason, but wt remove refused: ${out##*$'\n'}")
      fi
      ;;
    force)
      if git worktree remove --force "$path" 2> /dev/null || { [[ ! -e "$path/.git" ]] && rm -rf "$path"; }; then
        echo "removed $label: $reason"
        removed=$((removed + 1))
        if [[ "$path" =~ ^(.*/gandr-scratch-[0-9]+\.[^/]+)/ ]]; then rmdir "${BASH_REMATCH[1]}" 2> /dev/null || true; fi
      else
        kept+=("kept $label: $reason, but git worktree remove failed")
      fi
      ;;
    *) kept+=("kept $label: $reason") ;;
  esac
done < <(printf '%s\n' "${facts[@]}" | jq -s -f .config/pr-stack/sweep.jq | jq -r '.[] | [.action, .path, (.branch // "-"), .reason] | @tsv')
if (( ${#kept[@]} > 0 )); then printf '%s\n' "${kept[@]}"; fi
[[ "$dry_run" != true ]] || exit 0
git worktree prune
if (( ${#pruned[@]} > 0 )); then printf '%s\n' "${pruned[@]}"; fi
trash="$common/wt/trash"
if [[ -d "$trash" ]] && [[ -n $(find "$trash" -mindepth 1 -maxdepth 1 -print -quit) ]]; then
  find "$trash" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2> /dev/null || true
  echo "emptied $trash"
fi
free_gb=$(( $(df -Pk "$common" | awk 'NR == 2 { print $4 }') / 1048576 ))
echo "wt:sweep removed $removed worktrees; ${free_gb} GB free"
if [[ "${usage_guard:-false}" == true ]] && (( free_gb < floor_gb )); then
  echo "refused: ${free_gb} GB free is under the ${floor_gb} GB floor; the largest build directories:" >&2
  git worktree list --porcelain | sed -n 's/^worktree //p' | while IFS= read -r tree; do
    if [[ -d "$tree/target" ]]; then du -sk "$tree/target"; fi
  done | sort -rn | awk 'NR <= 10 { printf "  %d GB  %s\n", $1 / 1048576, $2 }' >&2
  exit 1
fi
{% endraw %}'''

# Landing is transactional (#2539): no branch outlives its unit unless it is
# named `wip/<name>` and an open issue names its head. `branches:sweep`
# prints, for the repository it runs in, three lists: the remote branches
# no open pull request accounts for, the local ones likewise with the
# worktree holding each, and the `wip/` branches no open issue names. The
# trunk and the merge queue's own branches are never listed. It prints and
# never deletes, and exits 0: the session close-out deletes from its output
# (`wt remove`, `git push --delete`). The decisions are
# `.config/pr-stack/branches.jq`'s, its cases held by `check:pr-stack`; the
# remote is read live (`git ls-remote`), never from this clone's stale
# remote-tracking refs. `--remote` prints the remote's two lists alone, the
# part one host's run answers for every host.
["branches:sweep"]
description = "List the branches no open pull request or wip/ issue accounts for; delete none"
tools.jq = "1.8.1"
usage = '''
flag "--remote" help="list only the remote's branches"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
trunk=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
remote=$(git ls-remote --heads origin | awk '{ sub("^refs/heads/", "", $2); print $2 }' | jq -R . | jq -cs .)
local_branches='[]'
if [[ ${usage_remote:-false} != true ]]; then
  local_branches=$(
    {
      git for-each-ref refs/heads --format='%(refname:short)' | jq -R '{name: ., worktree: null}'
      git worktree list --porcelain | awk '/^worktree / { tree = substr($0, 10) } /^branch refs\/heads\// { print substr($2, 12) "\t" tree }' \
        | jq -R 'split("\t") | {name: .[0], worktree: .[1]}'
    } | jq -cs 'group_by(.name) | map({name: .[0].name, worktree: (map(.worktree | values) | first)})'
  )
fi
heads=$(gh pr list -R "$repo" --state open --limit 1000 --json headRefName --jq '[.[].headRefName]')
issues=$(gh issue list -R "$repo" --state open --limit 5000 --json title,body --jq '[.[] | "\(.title)\n\(.body)"]')
reading=$(jq -n --arg trunk "$trunk" --argjson remote "$remote" --argjson local "$local_branches" \
  --argjson heads "$heads" --argjson issues "$issues" \
  '{trunk: $trunk, remote: $remote, local: $local, heads: $heads, issues: $issues}' \
  | jq -c -f .config/pr-stack/branches.jq)
list() {
  local title=$1 lines=$2
  printf '%s (%s):\n' "$title" "$(grep -c . <<< "$lines" || true)"
  [[ -z $lines ]] || sed 's/^/  /' <<< "$lines"
}
list "$repo: remote branches no open pull request accounts for" "$(jq -r '.remote[]' <<< "$reading")"
if [[ ${usage_remote:-false} != true ]]; then
  list "$repo: local branches no open pull request accounts for" \
    "$(jq -r '.local[] | .name + (if .worktree then "  (worktree " + .worktree + ")" else "" end)' <<< "$reading")"
fi
list "$repo: wip/ branches no open issue names" "$(jq -r '.wip[]' <<< "$reading")"
{% endraw %}'''

# A new worktree starts warm (`.config/wt.toml`'s `post-start`): every
# gitignored artifact of the primary worktree — the build directory, the code
# index, the extension's modules — is copied in by `wt step copy-ignored`,
# only where the filesystem clones: APFS and btrfs share the blocks until one
# side writes, while a full copy of the build directory per worktree fills a
# disk. A filesystem that cannot clone skips the copy, and the worktree's
# first build is cold. Existing files are never overwritten, so the step is
# safe to re-run. The probe that asks whether the filesystem clones is
# written outside both trees (#3222): its source in the clone's git
# directory, on the primary's filesystem, and its copy beside the worktree,
# on the worktree's, so `git add -A` in either never meets it while the copy
# runs.
["wt:warm"]
description = "Clone the primary worktree's gitignored artifacts into this one, or skip where the filesystem cannot clone"
run = '''
#!/usr/bin/env bash
set -euo pipefail
primary=$(git worktree list --porcelain | sed -n '1s/^worktree //p')
here=$(git rev-parse --show-toplevel)
[[ "$(realpath "$primary")" != "$(realpath "$here")" ]] || exit 0
probe=$(mktemp "$(realpath "$(git rev-parse --git-common-dir)")/wt-warm-probe.XXXXXX")
copy=$(mktemp -u "$(dirname "$here")/.wt-warm-probe.$(basename "$here").XXXXXX")
trap 'rm -f "$probe" "$copy"' EXIT
case "$(uname -s)" in
  Darwin) clone=(cp -c) ;;
  *) clone=(cp --reflink=always) ;;
esac
if ! "${clone[@]}" "$probe" "$copy" 2> /dev/null; then
  echo "wt:warm: $here's filesystem cannot clone from $primary; skipping the copy, the first build is cold"
  exit 0
fi
rm -f "$probe" "$copy"
wt step copy-ignored
'''

# A unit issue is the brief, and work starts only on one that carries its
# sections (#2532, `units.md` § units-issue). `unit:check <n>` reads the
# issue's body and prints each section missing, empty or malformed, exiting 1
# on any; the rule is `.config/claims/unit.jq`, reading the sections through
# `sections.jq` as `pr:open` does, its cases held by `check:claims`. The
# vault's dispatch script runs it on the issue a prompt names and refuses to
# launch on a failure. The web files a unit through the form
# `.github/ISSUE_TEMPLATE/unit.yml`, a field per section, and the issues
# workflow (#3113) runs the same reading on every opened or edited issue,
# labelling `status:unsectioned` while it fails.
#
# A `## Sources` line naming a vault page by its filename (#2793) is read
# against the vault checkout `$XDG_CONFIG_HOME/gandr/references` names
# (`.config/references/vault.bash`, the rule `.config/claims/vault.jq`): the
# page's `vault:<mint>` is shown beside its name, and a filename no vault page
# carries is refused, a wrong name being a wrong source. A filename the tree
# carries is the tree's. Without a vault checkout, as in CI, the lines are
# read for their shape alone.
#
# The term map (#3158): a unit whose title or prose meets a row of
# `.config/references/terms.toml` is refused while its `## Sources` names
# none of the vault pages, tree paths or issues that row says own the term
# (`.config/claims/terms.jq`). A line `- <owner> — not read: <why>` names
# it. The two listings find what a seat searches for; the map finds what it
# did not know to search for. An epic or a `collector` is not read.
#
# The dependencies (#2902): an issue is GitHub-`blocked by` each issue its
# `## After` lists, and an epic by each open sub-issue too; the plan is
# `.config/claims/deps.jq`, the calls `.config/claims/deps.bash`. Each one
# missing is refused, naming `--fix`, which sets it (idempotent) and leaves
# the rest of the check as it was. A dependency set on GitHub that neither
# names is printed as a note, not refused: the section is the record. An
# open epic the body names as its own (`Advances #n`, `Part of #n` or
# `from: #n`, #3398) is `blocked by` the issue in turn, so the epic closes
# only once the issue does; one that is not is refused, `--fix` setting it.
["unit:check"]
description = "Refuse a unit issue missing a section work needs, or a dependency its ## After names"
usage = '''
arg "<issue>" help="the issue number"
flag "--fix" help="set each GitHub dependency the issue owes before checking"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
issue=${usage_issue:?}
[[ $issue =~ ^[0-9]+$ ]] || { echo "unit:check takes an issue number, not \`$issue\`" >&2; exit 2; }
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$root/.config/references/vault.bash"
concerns=$(sqlite3 -json :memory: ".read $root/ledger/concerns.sql" 'SELECT id FROM concern ORDER BY id;' | jq -c 'map(.id)')
source "$claims/deps.bash"
repo=$(gh api 'repos/{owner}/{repo}' --jq .full_name)
issued=$(gh api "repos/$repo/issues/$issue" --jq '{number, title, labels: [.labels[].name], body: (.body // "")}')
body=$(jq -r .body <<< "$issued")
findings=$(jq -R -s -r -L "$claims" --argjson concerns "$concerns" -f "$claims/unit.jq" <<< "$body")
if ! jq -e '.labels | index("kind:epic") or index("collector")' <<< "$issued" > /dev/null; then
  terms=$(jq -n --argjson issued "$issued" --argjson terms "$(yq -o json '.term' "$root/.config/references/terms.toml")" \
    '{title: $issued.title, body: $issued.body, terms: $terms}' | jq -r -L "$claims" -f "$claims/terms.jq")
  findings=$(printf '%s\n%s\n' "$findings" "$terms" | awk 'NF')
fi
subs='[]'
if jq -e '.labels | index("kind:epic")' <<< "$issued" > /dev/null; then
  subs=$(deps_sub_issues "$repo" "$issue")
fi
plan=$(jq -n --argjson issued "$issued" --argjson blocked "$(deps_blocked_by "$repo" "$issue")" --argjson subs "$subs" \
  '$issued + {blocked_by: $blocked, sub_issues: $subs}' | jq -r -L "$claims" -f "$claims/deps.jq")
while IFS=$'\t' read -r verb blocker why; do
  case "$verb" in
    set)
      if [[ ${usage_fix:-false} == true ]]; then
        deps_block "$repo" "$issue" "$blocker"
      else
        findings=$(printf '%s\n%s\n' "$findings" "#$blocker is not set as a \`blocked by\` dependency on GitHub, and $why: run \`mise run unit:check --fix $issue\`" | awk 'NF')
      fi
      ;;
    extra) echo "note: #$issue is blocked by #$blocker on GitHub, and its \`## After\` does not list it" ;;
  esac
done <<< "$plan"
blocking=$(deps_blocking "$repo" "$issue")
for epic in $(deps_named_epics "$repo" "$body"); do
  [[ $epic != "$issue" ]] || continue
  jq -e --argjson n "$epic" 'any(.[]; .number == $n)' <<< "$blocking" > /dev/null && continue
  if [[ ${usage_fix:-false} == true ]]; then
    deps_set_block "$repo" "$epic" "$issue"
  else
    findings=$(printf '%s\n%s\n' "$findings" "#$epic, the epic the body names, is not set \`blocked by\` #$issue on GitHub, so it would close with #$issue open: run \`mise run unit:check --fix $issue\`" | awk 'NF')
  fi
done
pages=$(vault_pages)
shown=
if [[ $pages != null ]]; then
  scratch=$(mktemp -d)
  trap 'rm -rf "$scratch"' EXIT
  git -C "$root" ls-files | awk -F/ '{ print $NF }' | sort -u > "$scratch/tree"
  printf '%s\n' "$pages" > "$scratch/pages.json"
  vault=$(jq -n --arg body "$body" --slurpfile pages "$scratch/pages.json" --rawfile tree "$scratch/tree" '{body: $body, pages: $pages[0], tree: $tree}' \
    | jq -r -L "$claims" -f "$claims/shown.jq")
  refused=$(awk -F'\t' '$1 == "refuse" { print $2 }' <<< "$vault")
  shown=$(awk -F'\t' '$1 == "show" { print "  " $2 }' <<< "$vault")
  findings=$(printf '%s\n%s\n' "$findings" "$refused" | awk 'NF')
fi
if [[ -n "$findings" ]]; then
  printf 'unit check FAILED: #%s lacks what a unit issue carries (units.md § units-issue; the form is .github/ISSUE_TEMPLATE/unit.yml):\n' "$issue" >&2
  printf '%s\n' "$findings" | sed 's/^/  - /' >&2
  exit 1
fi
echo "unit check OK: #$issue carries every section a unit needs"
if [[ -n "$shown" ]]; then
  echo "its vault pages, read against the vault \$XDG_CONFIG_HOME/gandr/references names:"
  printf '%s\n' "$shown"
fi
'''

# A seat claims its own next item, in the order `tracker.md` § tracker-claims
# states, without asking (#2533). `claim:next <area>` reads the open issues
# once, with their bodies, and the sub-issue order of each open epic holding a
# candidate; the pick is `.config/claims/next.jq`, its cases held by
# `check:claims`. The pick is the first candidate in order, sectioned or not
# (#3134): sectioning is the claim's first obligation, so each section the
# pick lacks opens the claim as `sections due: #n — <finding>` (`unit:check`'s
# findings). The seat writes them, runs `## Try first` before `## The shape`
# is final, passes `unit:check`, and pages the coordinator `sections #n:
# <the shape's first line>` for `shape:signed`; it works on meanwhile, and
# `pr:open` refuses the landing until the label stands. A pick whose readings
# still hold the migration's `unstated` placeholder is claimed (#2955), and
# the claim opens with one `restate: `<axis>`: <question>` line per such
# axis. An issue with an open `blocked by` dependency is not picked (#2902):
# each one ranked ahead of the pick is printed on stderr as `blocked: #n by
# #a, #b`, its open blockers read from GitHub. A `kind:defect` `collector` in
# the area holding an open row heads the order (#3326): it is claimed as the
# defect it is, its rows worked by the landing, and prints no section due,
# keeping its own shape. Any other collector in the area holding an open row
# is printed first, on stderr, as `collector: #n (k open rows)` (#3111), the
# carving due. It adds `status:claimed` and prints the claim as `#n <title>`;
# `--dry-run` prints it without claiming.
# No candidate prints `no claim: <area>` and exits 1.
["claim:next"]
description = "Claim the next item in an area's claim order"
usage = '''
arg "<area>" help="the area, `workflow` or `area:workflow`"
flag "--dry-run" help="print the pick without claiming it"
'''
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
area=${usage_area:?}
area=area:${area#area:}
claims=$(git rev-parse --show-toplevel)/.config/claims
source "$claims/deps.bash"
# REST throughout: the GraphQL limit, shared by every seat's watches, runs out
# within the hour, and a seat must still claim its next item.
repo=$(gh api 'repos/{owner}/{repo}' --jq .full_name)
# The board reaches jq through files, never as arguments: with its bodies it
# is past the argument limit (#2671).
board=$(mktemp -d)
trap 'rm -rf "$board"' EXIT
gh api --paginate "repos/$repo/issues?state=open&per_page=100" --jq '[.[] | select(.pull_request == null)
  | {number, title, labels: [.labels[].name],
     body, blocked: (.issue_dependencies_summary.blocked_by // 0),
     parent: ([.parent_issue_url // "" | capture("/repos/'"$repo"'/issues/(?<n>[0-9]+)$").n | tonumber][0])}]' | jq -s 'add // []' > "$board/issues.json"
epics=$(jq -r --arg area "$area" '[.[] | select(.labels | index("kind:epic")) | .number] as $epics
  | [.[] | select((.labels | index($area)) and .parent != null) | .parent as $p | select($epics | index($p))] | map(.parent) | unique[]' "$board/issues.json")
order='{}'
for epic in $epics; do
  children=$(gh api --paginate "repos/$repo/issues/$epic/sub_issues?per_page=100" --jq '[.[].number]' | jq -s 'add // []')
  order=$(jq --arg epic "$epic" --argjson children "$children" '. + {($epic): $children}' <<< "$order")
done
concerns=$(sqlite3 -json :memory: ".read $(git rev-parse --show-toplevel)/ledger/concerns.sql" 'SELECT id FROM concern ORDER BY id;' | jq -c 'map(.id)')
lines=$(jq -n --arg area "$area" --slurpfile issues "$board/issues.json" --argjson order "$order" '{area: $area, issues: $issues[0], order: $order}' \
  | jq -r -L "$claims" --argjson concerns "$concerns" -f "$claims/next.jq")
awk '/^collector: /' <<< "$lines" >&2
while read -r _ issue; do
  echo "blocked: $issue by $(deps_open_blockers "$repo" "${issue#\#}")" >&2
done < <(awk '/^blocked: /' <<< "$lines")
awk '/^(sections due|restate): /' <<< "$lines"
pick=$(awk '!/^(collector|blocked|sections due|restate): /' <<< "$lines")
if [[ -z "$pick" ]]; then
  echo "no claim: $area" >&2
  exit 1
fi
IFS=$'\t' read -r number bucket title <<< "$pick"
if [[ ${usage_dry_run:-false} == true ]]; then
  echo "claim:next: dry run, nothing claimed ($bucket)" >&2
else
  gh api -X POST "repos/$repo/issues/$number/labels" -f 'labels[]=status:claimed' > /dev/null
  echo "claim:next: claimed ($bucket)" >&2
fi
printf '#%s %s\n' "$number" "$title"
'''

# A landing patches the features ledger rows it names, in the landing (#2525):
# `ledger:patched <body> <base> [--head <ref>] [--pr <n>]` reads the rows the
# change from `<base>` to the head (`HEAD` by default) adds, edits or removes
# in `ledger/features.sql`, and the rows the body's `## Ledger` names, and
# prints one refusal per row out of step (`.config/claims/ledger.jq`): a
# named row untouched or unknown, a touched row unnamed, a touched declined
# row naming only issues the body closes (#2848), and with `--pr` a named row
# whose `since` lacks `#<n>`. Exits 1 on a refusal. `pr:land` runs
# it on the pull request with its number and refuses; `pr:open` runs it
# without one and prints each line as a note. The tables reach jq through
# files, never as arguments: a table past the argument limit (#2671) would
# refuse every landing with `Argument list too long`. The repository read is
# the caller's (`GIT_DIR` honoured); the reading is this checkout's.
["ledger:patched"]
description = "Refuse a landing whose ledger rows and its body's ## Ledger disagree"
usage = '''
arg "<body>" help="the body file"
arg "<base>" help="the commit the change is read from"
flag "--head <ref>" help="the change's head; HEAD by default"
flag "--pr <number>" help="the pull request's number, which each named row's since carries"
'''
tools.jq = "1.8.1"
env.LEDGER_READING_ROOT = "{{ config_root }}"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$LEDGER_READING_ROOT
tables=$(mktemp -d)
trap 'rm -rf "$tables"' EXIT
rows_at() { { git show "$1:ledger/features.sql" 2> /dev/null || true; printf '%s\n' 'SELECT * FROM feature ORDER BY id;'; } | sqlite3 -json; }
rows_at "${usage_base:?}" > "$tables/base.json"
rows_at "${usage_head:-HEAD}" > "$tables/head.json"
findings=$(jq -n --rawfile body "${usage_body:?}" --argjson pr "${usage_pr:-null}" \
  --slurpfile base "$tables/base.json" --slurpfile head "$tables/head.json" \
  '($base | add // []) as $base | ($head | add // []) as $head
   | (INDEX($base[]; .id)) as $was | (INDEX($head[]; .id)) as $now
   | {pr: $pr, body: $body, rows: [$head[].id],
      touched: ([$head[] | select($was[.id] != .) | {id, since, status, issue}] + [$base[] | select($now[.id] == null) | {id, since: null, status: null, issue: null}])}' \
  | jq -r -L "$root/.config/claims" -f "$root/.config/claims/ledger.jq")
[[ -z "$findings" ]] || { echo "$findings"; exit 1; }
{% endraw %}'''

# A reserved grammar rule is not lowered (#2528): `ledger:reserved <base>
# [--head <ref>]` reads the syntax ledger's rows at `<base>` and at the head
# (`HEAD` by default), and for each rule `reserved` at the base that the head
# makes `implemented`, the issue its row cites, through gh; it prints one
# refusal per such rule whose issue is not open or whose body names neither
# the rule nor its kind, with the row (`.config/claims/reserved.jq`), and
# exits 1. The ledger is the lowering's own reading (`check:syntax-ledger`
# holds it to the exemplars), so a lowering that admits a reserved form moves
# its row. `pr:land` runs it on the pull request and refuses; `pr:open` runs
# it and prints each line as a note. The repository read is the caller's
# (`GIT_DIR` honoured); the reading is this checkout's.
["ledger:reserved"]
description = "Refuse a landing that lowers a reserved grammar rule its row's open issue does not name"
usage = '''
arg "<base>" help="the commit the change is read from"
flag "--head <ref>" help="the change's head; HEAD by default"
'''
tools.jq = "1.8.1"
env.LEDGER_READING_ROOT = "{{ config_root }}"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$LEDGER_READING_ROOT
tables=$(mktemp -d)
trap 'rm -rf "$tables"' EXIT
rows_at() { git show "$1:ledger/syntax.json" 2> /dev/null | jq '[.rules[]? | select(.standing == "committed")]' || echo '[]'; }
rows_at "${usage_base:?}" > "$tables/base.json"
rows_at "${usage_head:-HEAD}" > "$tables/head.json"
jq -n --slurpfile base "$tables/base.json" --slurpfile head "$tables/head.json" \
  '(INDEX($head[0][]; .name)) as $now
   | [$base[0][] | select(.status == "reserved") | {name, kind, issue, admission, now: $now[.name].status}]' > "$tables/rows.json"
mkdir "$tables/issues"
shopt -s nullglob
while read -r number; do
  gh issue view "$number" --json number,state,body > "$tables/issues/$number.json" 2> /dev/null || rm -f "$tables/issues/$number.json"
done < <(jq -r '.[] | select(.now == "implemented") | .issue // empty | ltrimstr("#")' "$tables/rows.json" | sort -u)
findings=$(jq -n --slurpfile rows "$tables/rows.json" '{rows: $rows[0], issues: ([inputs | {key: (.number | tostring), value: {state, body}}] | from_entries)}' \
    "$tables"/issues/*.json < /dev/null \
  | jq -r -L "$root/.config/claims" -f "$root/.config/claims/reserved.jq")
[[ -z "$findings" ]] || { echo "$findings"; exit 1; }
{% endraw %}'''

# Nothing private reaches a public issue or pull request body (#2530; the
# agents' guidance, § Public and private). `body:check [--title <text>]
# <file>...` reads the private-names list at
# `$XDG_CONFIG_HOME/gandr/private-names` (`~/.config` by default): one
# extended regular expression per line, matched without regard to case, `#`
# lines and blank lines skipped. The list is the owner's and never lives in
# the tree. Each match is printed with its file (or `title`) and line, and
# the check exits 1; a missing or empty list refuses too, naming its path,
# never a silent pass. `pr:open` runs it on the title and the body before it
# pushes, and `issue:file` before it files.
["body:check"]
description = "Refuse a body naming anything on the private-names list"
usage = '''
flag "--title <text>" help="a title to scan with the files"
arg "<file>..." help="the body files to scan"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
list=${XDG_CONFIG_HOME:-$HOME/.config}/gandr/private-names
patterns=$(mktemp)
found=$(mktemp)
trap 'rm -f "$patterns" "$found"' EXIT
if [[ -f $list ]]; then
  grep -vE '^[[:space:]]*(#|$)' "$list" > "$patterns" || true
fi
if [[ ! -s $patterns ]]; then
  echo "body:check: no private-names list at $list (one pattern per line); write it before posting a body" >&2
  exit 2
fi
eval "files=(${usage_file:?})"
# grep exits 1 on no match, 2 on an unreadable file or a malformed pattern:
# the second fails the check.
scan() { grep -HniE -f "$patterns" "$@" >> "$found" || (($? == 1)); }
if [[ -n ${usage_title:-} ]]; then printf '%s\n' "$usage_title" | scan --label=title; fi
scan -- "${files[@]}"
if [[ -s $found ]]; then
  printf 'body:check FAILED: these lines name private material (%s); rewrite them:\n' "$list" >&2
  sed 's/^/  /' "$found" >&2
  exit 1
fi
echo "body check OK: nothing on the private-names list in ${usage_title:+the title and }${#files[@]} file(s)"
{% endraw %}'''

# The one way a seat or the coordinator files an issue: `issue:file <title>
# <body> [label]...` runs `body:check` on the title and the body, then
# `gh issue create` with each label, printing the issue's address. The labels
# are the full set or the issue is refused (#2902): exactly one `kind:`,
# `priority:` and `effort:`, one or more `area:`, a missing `priority:` or
# `effort:` taking its kind's default from `.config/issues/defaults.toml`
# and an epic keeping `kind:epic` alone (the rule
# `.config/issues/labels.jq`). A unit (a body with `## Sources`) is refused
# before it is filed when it lacks a section (`findings.jq`, as `unit:check`
# reads it), and once filed has the dependencies its `## After` names set by
# `unit:check --fix`, so no filed unit lacks them. `--epic <n>` links the
# issue under the epic and sets the epic `blocked by` it, and a body line
# `Advances #n`, `Part of #n` or `from: #n` naming an open `kind:epic` sets
# that epic `blocked by` it too (#3398): an epic is blocked by its units and
# closes once every one is closed (`.config/claims/deps.bash`). A closing
# keyword in the body outside its head's keyword lines (`targets.jq`'s
# `strays`, #2980) is noted on stderr:
# it does nothing in an issue, but the same words in a pull request's body
# close the issue they name on merge. A mechanism files a unit or marks what
# it could not (#3112, `tracker.md` § tracker-filing): `--template <filer>`
# appends `.config/issues/templates/<filer>.md` to the body, the filer's
# observation, each `{{field}}` filled from `--fields` (`template.jq`), and
# a `kind:defect` that is no `collector` and fails `unit:check` is refused
# unless it carries `status:unsectioned`, its claiming seat's to section
# (#3134). A unit filed whole is sectioned before its claim, so it is signed
# by construction: `issue:file` labels it `shape:signed`, the label
# `pr:open` waits for (`signed.jq`).
["issue:file"]
description = "File an issue with its full label set once its title and body name nothing private, linked and its dependencies set"
usage = '''
arg "<title>" help="the issue's title"
arg "<body>" help="the body file; with --template, the observation the template follows"
arg "[label]..." help="labels: one `kind:`, one or more `area:`, a `priority:` and an `effort:` unless the kind's default serves, any others"
flag "--epic <n>" help="the epic to link the issue under"
flag "--template <filer>" help="the filer's template under .config/issues/templates/ that fills the unit's sections"
flag "--fields <json>" help="the template's fields, one JSON object of strings"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
body=$(realpath "${usage_body:?}")
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$claims/deps.bash"
source "$root/.config/issues/labels.bash"
epic=${usage_epic:-}
[[ -z $epic || $epic =~ ^[0-9]+$ ]] || { echo "issue:file: --epic takes an issue number, not \`$epic\`" >&2; exit 2; }
template=${usage_template:-}
if [[ -n $template ]]; then
  file=$root/.config/issues/templates/$template.md
  if [[ ! -f $file ]]; then
    echo "issue:file: no template \`$template\`; the filers': $(cd "$root/.config/issues/templates" && ls -- *.md | sed 's/\.md$//' | paste -sd ' ' -)" >&2
    exit 2
  fi
  rendered=$(mktemp)
  trap 'rm -f "$rendered"' EXIT
  jq -R -s -r -L "$root/.config/issues" --argjson fields "${usage_fields:-{\}}" --rawfile observation "$body" \
    'include "template"; render($fields; $observation)' "$file" > "$rendered" \
    || { echo "issue:file: the template \`$template\` is not filled" >&2; exit 1; }
  body=$rendered
elif [[ -n ${usage_fields:-} ]]; then
  echo "issue:file: --fields fills a template; name it with --template" >&2
  exit 2
fi
mise run --quiet body:check --title "${usage_title:?}" "$body" >&2
jq -R -s -r -L "$claims" 'include "targets"; strays[]
  | "issue:file: note: the line `\(.line)` carries `\(.keyword)`, a closing keyword; it does nothing here, but closes the issue it names if the words reach a pull request body"' "$body" >&2
eval "labels=(${usage_label:-})"
labelled() { local label; for label in "${labels[@]}"; do [[ $label != "$1" ]] || return 0; done; return 1; }
unit=false
if jq -R -s -e 'split("\n") | any(test("^## Sources\\s*$"))' "$body" > /dev/null; then
  unit=true
fi
defect=false
if labelled kind:defect && ! labelled collector && ! labelled status:unsectioned; then
  defect=true
fi
if [[ $unit == true || $defect == true ]]; then
  concerns=$(sqlite3 -json :memory: ".read $root/ledger/concerns.sql" 'SELECT id FROM concern ORDER BY id;' | jq -c 'map(.id)')
  findings=$(jq -R -s -r -L "$claims" --argjson concerns "$concerns" -f "$claims/unit.jq" "$body")
  if [[ -n $findings ]]; then
    if [[ $unit == true ]]; then
      printf 'issue:file: the body is a unit (it has `## Sources`) and lacks what a unit issue carries (units.md § units-issue):\n' >&2
    else
      printf 'issue:file: a kind:defect is filed as a unit or marked (tracker.md § tracker-filing): fill its sections from its filer'"'"'s template (--template, .config/issues/templates/), or label it status:unsectioned for its claiming seat; it lacks:\n' >&2
    fi
    printf '%s\n' "$findings" | sed 's/^/  - /' >&2
    exit 1
  fi
  unit=true
  labels+=(shape:signed)
fi
plan=$(labels_plan "$(printf '%s\n' "${labels[@]}" | jq -R . | jq -s -c 'map(select(. != ""))')" "$(labels_defaults)")
refused=$(awk -F'\t' '$1 == "refuse" { print "  - " $2 }' <<< "$plan")
if [[ -n $refused ]]; then
  printf 'issue:file: the labels are not the full set (tracker.md § tracker-issues):\n%s\n' "$refused" >&2
  exit 1
fi
while IFS=$'\t' read -r verb label; do
  case "$verb" in
    add)
      labels+=("$label")
      echo "issue:file: $label, the kind's default" >&2
      ;;
    remove)
      for i in "${!labels[@]}"; do [[ ${labels[$i]} != "$label" ]] || unset 'labels[i]'; done
      echo "issue:file: $label dropped: an epic is one kind, kind:epic" >&2
      ;;
  esac
done <<< "$plan"
flags=()
for label in "${labels[@]}"; do flags+=(--label "$label"); done
url=$(gh issue create --title "$usage_title" --body-file "$body" "${flags[@]}")
number=${url##*/}
repo=$(gh api 'repos/{owner}/{repo}' --jq .full_name)
if [[ -n $epic ]]; then
  deps_link "$repo" "$epic" "$number" >&2
fi
deps_block_named_epics "$repo" "$number" "$(< "$body")" >&2
if [[ $unit == true ]]; then
  mise run --quiet unit:check --fix "$number" >&2
fi
echo "$url"
{% endraw %}'''

# A merged pull request's `## Refactoring` verdict, filed (#2885):
# `refactor:file <pr>` reads the pull request, the area and epic of the unit
# it closed, and every `kind:refactor` issue, and carries out what
# `.config/claims/filing.jq` decides. A `yes` or `maybe` with rows opens an
# issue through `issue:file` (its labels `kind:refactor`, the unit's `area:`
# and `status:unsectioned`, linked under the unit's epic); a `maybe` whose
# `Where` an open refactor issue observes adds its rows and a `from:` line to
# that issue instead. Either pages the coordinator through the page command of
# the stall configuration (`.config/stall/stall.bash`); the seat that claims
# the issue writes its sections (#3134). A pull request that closes no issue,
# as one advancing an epic's unit does, takes the area and epic of the issue
# its branch names (`<lane>-<n>-…`), and failing that the lane's own
# `area:<lane>` label. An
# issue carrying the pull request's `from:` line is the filing, so a second
# run files nothing. `pr:watch` runs it when its pull request merges;
# `stall:watch` pages a verdict still unfiled. `--dry-run` prints the
# decision and changes nothing.
["refactor:file"]
description = "File a merged pull request's yes or maybe refactoring verdict as a kind:refactor issue and page the coordinator"
usage = '''
arg "<pr>" help="the merged pull request's number"
flag "--dry-run" help="print the decision without filing or paging"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
number=${usage_pr:?}
[[ $number =~ ^[1-9][0-9]*$ ]] || { echo "refactor:file: expected a pull request number, not \`$number\`" >&2; exit 2; }
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
pr=$(gh api graphql -F owner="${repo%/*}" -F name="${repo#*/}" -F number="$number" -f query='
  query($owner: String!, $name: String!, $number: Int!) {
    repository(owner: $owner, name: $name) {
      pullRequest(number: $number) {
        state body headRefName
        closingIssuesReferences(first: 10) { nodes { number parent { number } labels(first: 30) { nodes { name } } } }
      }
    }
  }' --jq '.data.repository.pullRequest')
state=$(jq -r .state <<< "$pr")
[[ $state == MERGED ]] || { echo "refactor:file: #$number is $state, not merged" >&2; exit 2; }
area=$(jq -c '[.closingIssuesReferences.nodes[].labels.nodes[].name | select(startswith("area:")) | ltrimstr("area:")] | first' <<< "$pr")
epic=$(jq -r '[.closingIssuesReferences.nodes[].parent.number | values] | first // empty' <<< "$pr")
head=$(jq -r .headRefName <<< "$pr")
if [[ $area == null && $head =~ ^[a-z]+-([1-9][0-9]*)- ]]; then
  unit=$(gh api "repos/$repo/issues/${BASH_REMATCH[1]}" --jq '{area: ([.labels[].name | select(startswith("area:")) | ltrimstr("area:")] | first),
    epic: ((.parent_issue_url // "" | capture("/issues/(?<n>[0-9]+)$").n) // "")}')
  area=$(jq -c .area <<< "$unit")
  [[ -n $epic ]] || epic=$(jq -r .epic <<< "$unit")
fi
lane=${head%%-*}
if [[ $area == null ]] && gh label list -R "$repo" --search "area:$lane" --json name --jq '.[].name' | grep -Fxq "area:$lane"; then
  area=$(jq -cn --arg lane "$lane" '$lane')
fi
issues=$(gh issue list -R "$repo" --label kind:refactor --state all --limit 1000 --json number,state,body)
decision=$(jq -n --argjson number "$number" --argjson pr "$pr" --argjson area "$area" --argjson issues "$issues" \
  '{pr: {number: $number, body: $pr.body, area: $area}, issues: $issues}' | jq -c -L "$claims" -f "$claims/filing.jq")
if [[ ${usage_dry_run:-false} == true ]]; then
  jq --arg epic "$epic" '. + {epic: (if $epic == "" then null else ($epic | tonumber) end)}' <<< "$decision"
  exit 0
fi
body=$(mktemp)
trap 'rm -f "$body"' EXIT
case $(jq -r .act <<< "$decision") in
  none)
    echo "refactor:file: #$number's verdict files nothing"
    exit 0
    ;;
  filed)
    echo "refactor:file: #$number is filed as #$(jq -r .issue <<< "$decision")"
    exit 0
    ;;
  update)
    issue=$(jq -r .issue <<< "$decision")
    jq -j .body <<< "$decision" > "$body"
    gh issue edit "$issue" -R "$repo" --body-file "$body" > /dev/null
    line="refactor #$issue gains #$number's maybe rows; rule on it"
    ;;
  open)
    jq -j .body <<< "$decision" > "$body"
    mapfile -t labels < <(jq -r '.labels[]' <<< "$decision")
    url=$(mise run --quiet issue:file "$(jq -r .title <<< "$decision")" "$body" "${labels[@]}" ${epic:+--epic "$epic"})
    issue=${url##*/}
    line="refactor #$issue filed from #$number's verdict; its claiming seat sections it"
    ;;
esac
echo "refactor:file: $line"
source "$root/.config/stall/stall.bash"
page=$(stall_configuration | jq -c '.page // empty')
if [[ -z $page ]]; then
  echo "refactor:file: no page command in $stall_config; tell the coordinator: $line" >&2
  exit 0
fi
mapfile -t command < <(jq -r '.command[]' <<< "$page")
mapfile -t coordinator < <(jq -r '.coordinator[]' <<< "$page")
"${command[@]}" "${coordinator[@]}" "$line" || echo "refactor:file: the page failed; tell the coordinator: $line" >&2
{% endraw %}'''

# An issue's full label set, applied after the fact (#2902): `issue:labels
# <n>...` adds each missing `priority:` and `effort:` its kind's default
# names (`.config/issues/defaults.toml`, the rule `.config/issues/labels.jq`,
# as `issue:file` applies them) and removes each `kind:` beside `kind:epic`,
# and `--sweep` does so for every open issue. What the rule cannot repair (no
# `kind:` or `area:`, a `kind:`, `priority:` or `effort:` given twice, a kind
# without a default) is printed, exiting 1; `report:deps` lists it nightly.
["issue:labels"]
description = "Give each open issue its kind's missing priority: and effort:, and an epic kind:epic alone"
usage = '''
arg "[issue]..." help="the issues; none with --sweep"
flag "--sweep" help="every open issue"
'''
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/issues/labels.bash"
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
defaults=$(labels_defaults)
eval "issues=(${usage_issue:-})"
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
if [[ ${usage_sweep:-false} == true ]]; then
  gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
    --jq '.[] | select(.pull_request == null) | {number, labels: [.labels[].name]} | @json' > "$scratch/issues"
else
  (( ${#issues[@]} > 0 )) || { echo "issue:labels takes issues, or --sweep" >&2; exit 2; }
  for n in "${issues[@]}"; do
    [[ $n =~ ^[0-9]+$ ]] || { echo "issue:labels takes issue numbers, not \`$n\`" >&2; exit 2; }
    gh api "repos/$repo/issues/$n" --jq '{number, labels: [.labels[].name]} | @json'
  done > "$scratch/issues"
fi
added=0
short=0
while IFS= read -r issue; do
  number=$(jq -r .number <<< "$issue")
  plan=$(labels_plan "$(jq -c .labels <<< "$issue")" "$defaults")
  adds=()
  removes=()
  while IFS=$'\t' read -r verb what; do
    case "$verb" in
      add) adds+=(-f "labels[]=$what") ;;
      remove) removes+=("$what") ;;
      refuse) echo "#$number: $what" >&2; short=$((short + 1)) ;;
    esac
  done <<< "$plan"
  for label in "${removes[@]}"; do
    gh api -X DELETE "repos/$repo/issues/$number/labels/$(jq -rn --arg l "$label" '$l | @uri')" > /dev/null
  done
  if (( ${#adds[@]} > 0 )); then
    gh api -X POST "repos/$repo/issues/$number/labels" "${adds[@]}" > /dev/null
  fi
  if (( ${#adds[@]} + ${#removes[@]} > 0 )); then
    echo "#$number: $(awk -F'\t' '$1 == "add" || $1 == "remove" { printf "%s %s; ", ($1 == "add" ? "added" : "removed"), $2 }' <<< "$plan")"
    added=$((added + 1))
  fi
done < "$scratch/issues"
echo "issue:labels: $added issue(s) relabelled; $short problem(s) the rule cannot repair"
(( short == 0 ))
{% endraw %}'''

# An epic's sub-issues, linked and ordered by the one task that writes the
# order (#2902): `epic:order <epic> <n>...` links each under the epic, the
# epic `blocked by` each open one, and orders them as given. A sequential
# ladder takes `--chain`: each sub-issue is set `blocked by` the one before
# it, and lists it in its `## After` (`with_after` in
# `.config/claims/sections.jq`), the section being the record. An epic body's
# ladder table is not read; the sub-issues' `## After` is.
["epic:order"]
description = "Link and order an epic's sub-issues, the epic blocked by each open one; --chain sets each blocked by the one before"
usage = '''
arg "<epic>" help="the epic"
arg "<issue>..." help="its sub-issues, in order"
flag "--chain" help="set each sub-issue blocked by the one before it and list it in its ## After"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
epic=${usage_epic:?}
eval "issues=(${usage_issue:?})"
claims=$(git rev-parse --show-toplevel)/.config/claims
source "$claims/deps.bash"
repo=$(gh api 'repos/{owner}/{repo}' --jq .full_name)
for n in "$epic" "${issues[@]}"; do
  [[ $n =~ ^[0-9]+$ ]] || { echo "epic:order takes issue numbers, not \`$n\`" >&2; exit 2; }
done
previous=
previous_id=
for n in "${issues[@]}"; do
  deps_link "$repo" "$epic" "$n"
  id=$(deps_id "$repo" "$n")
  if [[ -n $previous ]]; then
    gh api -X PATCH "repos/$repo/issues/$epic/sub_issues/priority" -F sub_issue_id="$id" -F after_id="$previous_id" > /dev/null
    if [[ ${usage_chain:-false} == true ]]; then
      deps_block "$repo" "$n" "$previous"
      body=$(gh api "repos/$repo/issues/$n" --jq '.body // ""')
      edited=$(jq -n --arg body "$body" --argjson after "$previous" --argjson epic "$epic" \
        '{body: $body, after: $after, epic: $epic}' | jq -r -L "$claims" -f "$claims/chain.jq")
      if [[ $edited != "$body" ]]; then
        printf '%s\n' "$edited" | gh issue edit "$n" --repo "$repo" --body-file - > /dev/null
        printf 'listed #%s in #%s'"'"'s ## After\n' "$previous" "$n"
      fi
    fi
  fi
  previous=$n
  previous_id=$id
done
printf 'ordered #%s: %s\n' "$epic" "$(printf '#%s ' "${issues[@]}")"
{% endraw %}'''

# An epic is blocked by every open sub-issue (#2902): `epic:deps <epic>...`
# sets each dependency it lacks, `--all` for every open `kind:epic`, its
# sub-issues and dependencies read in one pass over the open issues
# (`deps_open_graph`, #3192). It is idempotent; `report:deps` reruns it
# nightly.
["epic:deps"]
description = "Set each epic blocked by its open sub-issues"
usage = '''
arg "[epic]..." help="the epics; none with --all"
flag "--all" help="every open kind:epic issue"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
claims=$(git rev-parse --show-toplevel)/.config/claims
source "$claims/deps.bash"
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
eval "epics=(${usage_epic:-})"
if [[ ${usage_all:-false} == true ]]; then
  mapfile -t epics < <(gh api --paginate "repos/$repo/issues?state=open&labels=kind:epic&per_page=100" --jq '.[] | select(.pull_request == null) | .number')
  graph=$(deps_open_graph "$repo")
fi
(( ${#epics[@]} > 0 )) || { echo "epic:deps takes epics, or --all" >&2; exit 2; }
for epic in "${epics[@]}"; do
  if [[ -n ${graph:-} ]]; then
    while read -r child; do
      deps_set_block "$repo" "$epic" "$child"
    done < <(jq -r --arg epic "$epic" '(.[$epic] // {blocked_by: [], sub_issues: []}) as $read | [$read.blocked_by[].number] as $set
      | $read.sub_issues[] | select(.state == "open" and .number != ($epic | tonumber) and (.number | IN($set[]) | not)) | .number' <<< "$graph")
  else
    while read -r child; do
      deps_block "$repo" "$epic" "$child"
    done < <(deps_sub_issues "$repo" "$epic" | jq -r --argjson self "$epic" '.[] | select(.state == "open" and .number != $self) | .number')
  fi
done
echo "epic:deps: ${#epics[@]} epic(s) blocked by their open sub-issues"
{% endraw %}'''

# An epic's membership as `blocked by`, backfilled (#3398): `epics:link`
# reads every issue once, open or closed, and sets each open `kind:epic`
# blocked by every issue whose body names it or that its body names
# (`.config/epics/link.jq`, neither an epic nor a `collector` a member), so
# the epics workflow closes it once the last of them closes. It prints, per
# epic, what it added and how many of its members are open; `--dry-run`
# prints the same and sets nothing. A dependency GitHub refuses is printed
# and the run goes on, exiting 1 at its end. It is idempotent.
["epics:link"]
description = "Set each open epic blocked by every issue its body names or that names it"
usage = '''
flag "--dry-run" help="print what would be set and set nothing"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
source "$root/.config/claims/deps.bash"
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
issues=$(gh api --paginate "repos/$repo/issues?state=all&per_page=100" \
  --jq '.[] | select(.pull_request == null) | {number, state, labels: [.labels[].name], body: (.body // "")}' | jq -s -c '.')
plan=$(jq -c '{issues: .}' <<< "$issues" | jq -c -f "$root/.config/epics/link.jq")
states=$(jq -c 'map({key: (.number | tostring), value: .state}) | from_entries' <<< "$issues")
refused=0
epics=0
while read -r entry; do
  epic=$(jq -r .epic <<< "$entry")
  set_now=$(deps_blocked_by "$repo" "$epic" | jq -c '[.[].number]')
  set=$set_now
  added=0
  for member in $(jq -r --argjson set "$set_now" '.members[] | select(IN($set[]) | not)' <<< "$entry"); do
    if [[ ${usage_dry_run:-false} != true ]] && ! why=$(deps_set_block "$repo" "$epic" "$member" 2>&1 > /dev/null); then
      printf '#%s: GitHub refused #%s as a blocked-by dependency: %s\n' "$epic" "$member" "$(awk 'NF { line = $0 } END { print line }' <<< "$why")"
      refused=$((refused + 1))
      continue
    fi
    added=$((added + 1))
    set=$(jq -c --argjson n "$member" '. + [$n]' <<< "$set")
  done
  read -r open total < <(jq -r --argjson states "$states" \
    '"\([.[] | select($states[tostring] == "open")] | length) \(length)"' <<< "$set")
  printf '#%s: %s %s; %s open of %s blocked-by\n' "$epic" "$([[ ${usage_dry_run:-false} == true ]] && echo 'would add' || echo added)" "$added" "$open" "$total"
  epics=$((epics + 1))
done < <(jq -c '.[]' <<< "$plan")
echo "epics:link: $epics open epic(s) read; $refused dependency(ies) refused"
(( refused == 0 ))
{% endraw %}'''

# The nightly tracker report (#2902): `report:deps` reruns `epic:deps
# --all`, then reads every open issue for a dependency stated and not set
# (prose naming an open issue as `after #n`, `blocked on #n`, `waits on #n`,
# `once #n lands` or `needs #n`; an `## After` item; an epic's open
# sub-issue) and for a label set short of one `kind:`, `area:`, `priority:`
# and `effort:` (`.config/issues/labels.jq`), and for a features ledger row
# owing on no open issue, or only on open epics, each closing itself once
# its units close (`.config/ledger/owing.bash`, #2973, #3398), and writes
# them on one
# `collector` issue, `report: dependencies`, opened by the first finding,
# updated each night, and closed by a night with none. The rule is
# `.config/claims/report.jq`, its cases held by `check:claims`. Only issues
# that state a dependency, and epics, cost a dependency read. GH_REPO names
# the repository; without REPORT_FILE set the task prints the report and
# writes nothing.
["report:deps"]
description = "Report each open issue's stated dependency GitHub does not record, and each label set short, on one issue"
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
source "$claims/deps.bash"
source "$root/.config/issues/labels.bash"
source "$root/.config/ledger/owing.bash"
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
write=${REPORT_FILE:-}
title='report: dependencies'
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
if [[ -n $write ]]; then
  GH_REPO=$repo mise run --quiet epic:deps --all
fi
gh api --paginate "repos/$repo/issues?state=open&per_page=100" \
  --jq '[.[] | select(.pull_request == null) | {number, title, labels: [.labels[].name], body: (.body // "")}]' | jq -s 'add // []' > "$scratch/open.json"
deps_open_graph "$repo" > "$scratch/graph.json"
jq -n -c --slurpfile open "$scratch/open.json" --slurpfile graph "$scratch/graph.json" '{open: $open[0], graph: $graph[0]}' \
  | jq -c -f "$claims/reads.jq" > "$scratch/issues.jsonl"
gh issue list --repo "$repo" --state all --label collector --search "\"$title\" in:title" --json number,title,state,body \
  | jq -c --arg title "$title" '[.[] | select(.title == $title)] | first' > "$scratch/filed.json"
labels_defaults > "$scratch/defaults.json"
sqlite3 -bail "$scratch/features.db" < "$root/ledger/features.sql"
(cd "$root" && ledger_owing "$scratch/features.db") \
  | jq -R -s -c 'split("\n") | map(select(. != "") | split("\t") | {row: .[0], issues: (.[1] | split(" ") | map(select(. != "") | tonumber))})' > "$scratch/owing.json"
jq -n --slurpfile open "$scratch/open.json" --slurpfile issues "$scratch/issues.jsonl" --slurpfile filed "$scratch/filed.json" \
  --slurpfile defaults "$scratch/defaults.json" --slurpfile owing "$scratch/owing.json" \
  '{issues: $issues, open: [$open[0][] | {number, labels}], owing: $owing[0], defaults: $defaults[0], previous: ($filed[0].body // "")}' \
  | jq -c -L "$claims" -L "$root/.config/issues" -f "$claims/report.jq" > "$scratch/report.json"
jq -r .body "$scratch/report.json" > "$scratch/body.md"
count=$(jq .count "$scratch/report.json")
number=$(jq -r '.number // empty' "$scratch/filed.json")
state=$(jq -r '.state // empty' "$scratch/filed.json")
if [[ -z $write ]]; then
  cat "$scratch/body.md"
  echo "report:deps: $count finding(s); REPORT_FILE unset, nothing written" >&2
  exit 0
fi
if (( count == 0 )); then
  if [[ $state == OPEN ]]; then
    gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
    gh issue close "$number" --repo "$repo" --reason completed > /dev/null
    echo "closed #$number: no findings"
  else
    echo "report:deps: no findings"
  fi
elif [[ -z $number ]]; then
  gh issue create --repo "$repo" --title "$title" --label collector --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  [[ $state == OPEN ]] || gh issue reopen "$number" --repo "$repo" > /dev/null
  gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number: $count finding(s)"
fi
{% endraw %}'''

# How the pull request obligations are answered (#2886): over the pull
# requests merged in a period and the unit issues they close, five tables,
# the lane (the closed unit's first `area:`) as the row and the ISO week of
# the merge as the column: the unit's Concerns marked `no`, the Sources read
# items by disposition, the Readings selected and answered at a site, the
# Refactoring verdicts, the Ledger rows moved. The rule is
# `.config/claims/obligations.jq`, reading the sections through
# `sections.jq` as the checks do, its cases held by `check:claims`. No figure
# is a gate: the coordinator reads the report, and a figure that calls for a
# change becomes a unit.
#
# The period is the month so far (`--since`, `--until` for a hand run,
# `--lane` to keep one lane). With REPORT_FILE set the nightly writes it on
# one `collector` issue per month, `report: obligations, <YYYY-MM>`, and
# closes the previous month's once its last full update is written;
# without, the report is printed. GH_REPO names the repository.
["report:obligations"]
description = "Report how the merged pull requests answer their obligations, by lane and week, on one issue a month"
usage = '''
flag "--since <date>" help="the first merge date read, YYYY-MM-DD; the month's first day by default"
flag "--until <date>" help="the last merge date read, YYYY-MM-DD; today by default"
flag "--lane <area>" help="keep one lane, its area without the `area:` prefix"
'''
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
root=$(git rev-parse --show-toplevel)
claims=$root/.config/claims
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
write=${REPORT_FILE:-}
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
# The report for merges from `$1` to `$2` (YYYY-MM-DD),
# written to `$scratch/body.md`. GitHub's search answers at most 1000
# results a query, fewer than a month's merges, so the period is read a day
# at a time.
render() {
  local day=$1
  : > "$scratch/nodes.jsonl"
  while [[ ! $day > $2 ]]; do
    gh api graphql --paginate -F q="repo:$repo is:pr is:merged merged:$day" -f query='
      query($q: String!, $endCursor: String) {
        search(query: $q, type: ISSUE, first: 50, after: $endCursor) {
          pageInfo { hasNextPage endCursor }
          nodes { ... on PullRequest { number mergedAt body
            closingIssuesReferences(first: 5) { nodes { number body labels(first: 20) { nodes { name } } } } } }
        }
      }' --jq '.data.search.nodes[]' >> "$scratch/nodes.jsonl"
    day=$(date -u -d "$day +1 day" +%Y-%m-%d)
  done
  jq -s -c --arg lane "${usage_lane:-}" '[.[]
      | (.closingIssuesReferences.nodes | map(select(any(.labels.nodes[]; .name | startswith("area:")))) | first) as $unit
      | {number, merged: .mergedAt, body: (.body // ""), issue: ($unit.body // null),
         lane: (if $unit == null then "none" else first($unit.labels.nodes[].name | select(startswith("area:")) | ltrimstr("area:")) end)}
      | select($lane == "" or .lane == $lane)] | sort_by(.merged)' "$scratch/nodes.jsonl" > "$scratch/prs.json"
  jq -n -c --arg since "$1" --arg until "$2" --slurpfile prs "$scratch/prs.json" \
    '{since: $since, until: $until, prs: $prs[0]}' \
    | jq -r -L "$claims" -f "$claims/obligations.jq" > "$scratch/body.md"
}
# The open issue titled `$1`, or nothing.
filed() {
  gh issue list --repo "$repo" --state open --label collector --search "\"$1\" in:title" --json number,title \
    | jq -r --arg title "$1" 'first(.[] | select(.title == $title)) | .number'
}
since=${usage_since:-$(date -u +%Y-%m-01)}
until=${usage_until:-$(date -u +%Y-%m-%d)}
title="report: obligations, ${since::7}"
if [[ -z $write ]]; then
  render "$since" "$until"
  cat "$scratch/body.md"
  exit 0
fi
previous_since=$(date -u -d "${since::7}-01 -1 month" +%Y-%m-01)
previous_title="report: obligations, ${previous_since::7}"
previous=$(filed "$previous_title")
if [[ -n $previous ]]; then
  render "$previous_since" "$(date -u -d "${since::7}-01 -1 day" +%Y-%m-%d)"
  gh issue edit "$previous" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
  gh issue close "$previous" --repo "$repo" --reason completed > /dev/null
  echo "closed #$previous: ${previous_since::7} in full"
fi
render "$since" "$until"
number=$(filed "$title")
if [[ -z $number ]]; then
  gh issue create --repo "$repo" --title "$title" --label collector --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number"
fi
{% endraw %}'''

# The bootstrap census (#2896, rung 0 of #2895): `ledger/census.md`'s block
# between its `census` markers, the record that picks the first crate to
# rewrite in gandr. Each workspace crate with a library is read from its
# rustdoc JSON as `purposes:items` builds it, without private items: its
# public items as that task lists them, its boundary surface, clauses and
# witnesses by `.config/census/surface.jq`. Its `#[spec]` attributes and its
# lines are counted in its library's Rust sources, test modules left out
# (`tests.rs` and `tests/` under `src/`); its workspace dependencies, the
# `[dependencies]` alone, come from `cargo metadata`; it is on the hotpath
# when a function of it carries a `hotpath::measure` attribute.
# `.config/census/census.jq` ranks and renders them, its cases held by
# `check:census`.
#
# Almost every change to a library moves the census, so no landing is held to
# it. `census.yml` builds it weekly and runs `--check` on the result, which
# writes nothing. A stale census is reported on one `collector` issue,
# `report: bootstrap census`, opened by the first stale week, updated by each
# stale week and closed by a current one; it carries the difference, and
# whoever takes it runs the task and lands the file. `--check` files only with
# REPORT_FILE set; without it a stale census prints its difference and exits
# 1. `--census` takes the census an earlier run built, so the job that files
# builds nothing. GH_REPO names the repository.
["report:bootstrap-census"]
description = "Write ledger/census.md's crate census, or report it stale with --check"
tools.jq = "1.8.1"
usage = '''
flag "--check" help="write nothing: report a stale census, on its issue with REPORT_FILE set"
flag "--census <file>" help="the census an earlier run of this task wrote, taken instead of building one"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
census=.config/census
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
build() {
  mise run --quiet purposes:items > "$scratch/items.tsv"
  jq -R -s '[split("\n")[] | select(. != "") | split("\t") | select(.[2] != "crate" and .[2] != "module") | .[0]]
    | group_by(.) | map({key: .[0], value: length}) | from_entries' "$scratch/items.tsv" > "$scratch/items.json"
  { git grep -l -e 'hotpath::measure' -- 'crates/*/src/**' || true; } \
    | jq -R -s '[split("\n")[] | select(. != "") | split("/")[1]] | unique' > "$scratch/hotpath.json"
  cargo metadata --locked --no-deps --format-version 1 | jq -c '
    (.workspace_root + "/crates/") as $crates
    | [.packages[] | select(.manifest_path | startswith($crates))] as $members
    | ($members | map({key: .name, value: (.manifest_path | ltrimstr($crates) | split("/")[0])}) | from_entries) as $dir
    | $members[]
    | {crate: $dir[.name], deps: ([.dependencies[] | select(.kind == null) | $dir[.name] // empty] | unique)} as $member
    | .targets[]
    | select(any(.kind[]; . == "lib"))
    | $member + {library: (.name | gsub("-"; "_"))}' > "$scratch/crates.jsonl"
  : > "$scratch/rows.jsonl"
  while IFS= read -r member; do
    crate=$(jq -r .crate <<< "$member")
    sources=(":(glob)crates/$crate/src/**/*.rs" ':(exclude,glob)**/tests.rs' ':(exclude,glob)**/tests/**')
    specs=$({ git grep -h -o -e '#\[spec(' -- "${sources[@]}" || true; } | wc -l)
    lines=$(git ls-files -z -- "${sources[@]}" | xargs -0 -r cat | wc -l)
    jq -c -f "$census/surface.jq" "target/purposes/doc/$(jq -r .library <<< "$member").json" > "$scratch/surface.json"
    jq -n -c --argjson member "$member" --argjson specs "$specs" --argjson lines "$lines" \
      --slurpfile surface "$scratch/surface.json" --slurpfile items "$scratch/items.json" --slurpfile hotpath "$scratch/hotpath.json" \
      '$member + $surface[0] + {items: ($items[0][$member.crate] // 0), specs: $specs, lines: $lines, hotpath: ($hotpath[0] | index($member.crate) != null)} | del(.library)' \
      >> "$scratch/rows.jsonl"
  done < "$scratch/crates.jsonl"
  jq -s '{rows: .}' "$scratch/rows.jsonl" | jq -j --rawfile doc ledger/census.md -f "$census/census.jq"
}
if [[ -n ${usage_census:-} ]]; then
  cp "$usage_census" "$scratch/census.md"
else
  build > "$scratch/census.md"
fi
if [[ ${usage_check:-false} != true ]]; then
  cp "$scratch/census.md" ledger/census.md
  echo "report:bootstrap-census: wrote ledger/census.md"
  exit 0
fi
stale=false
diff -u --label 'ledger/census.md, committed' --label 'ledger/census.md, taken now' ledger/census.md "$scratch/census.md" > "$scratch/difference" || stale=true
if [[ -z ${REPORT_FILE:-} ]]; then
  if [[ $stale == true ]]; then
    cat "$scratch/difference"
    echo 'report:bootstrap-census: ledger/census.md is stale; run `mise run report:bootstrap-census` and land it' >&2
    exit 1
  fi
  echo "report:bootstrap-census: ledger/census.md is current"
  exit 0
fi
repo=${GH_REPO:-$(gh api 'repos/{owner}/{repo}' --jq .full_name)}
title='report: bootstrap census'
gh issue list --repo "$repo" --state all --label collector --search "\"$title\" in:title" --json number,state,title \
  | jq -c --arg title "$title" '[.[] | select(.title == $title)] | first' > "$scratch/filed.json"
number=$(jq -r '.number // empty' "$scratch/filed.json")
state=$(jq -r '.state // empty' "$scratch/filed.json")
head=$(git rev-parse --short HEAD)
if [[ $stale == false ]]; then
  if [[ $state == OPEN ]]; then
    gh issue close "$number" --repo "$repo" --reason completed --comment "\`ledger/census.md\` is current at $head." > /dev/null
    echo "closed #$number: the census is current"
  else
    echo "report:bootstrap-census: ledger/census.md is current"
  fi
  exit 0
fi
{
  echo "\`ledger/census.md\` is not the census of \`main\` at $head. Run \`mise run report:bootstrap-census\` and land the file (#2896)."
  echo
  if (( $(wc -c < "$scratch/difference") > 60000 )); then
    echo "The difference is $(wc -l < "$scratch/difference") lines, past an issue body's size; \`mise run report:bootstrap-census --check\` prints it."
  else
    echo '```diff'
    cat "$scratch/difference"
    echo '```'
  fi
} > "$scratch/body.md"
if [[ -z $number ]]; then
  gh issue create --repo "$repo" --title "$title" --label collector --label kind:ci --label area:workflow \
    --label priority:medium --label effort:unknown --body-file "$scratch/body.md"
else
  [[ $state == OPEN ]] || gh issue reopen "$number" --repo "$repo" > /dev/null
  gh issue edit "$number" --repo "$repo" --body-file "$scratch/body.md" > /dev/null
  echo "updated #$number: the census is stale"
fi
{% endraw %}'''

# The pull request's title becomes the header of its merge commit on main,
# and the PR title workflow lints it with the commit rules: a conventional
# header of at most 72 characters, its type and scope from
# commitlint.config.mjs. The body carries the change's prose obligations as
# its `## Re-verification` section, written into the body file here
# (`evidence:obligations --body`) with any ticks the file already holds;
# `gh pr create` waits until every box is ticked, so the pull request's first
# obligations lane reads them. Tick one box per obligation in the file and run
# `pr:open` again.
#
# The body names the issues it works, one per line: `Closes #n` for an issue
# the pull request finishes (GitHub closes it on merge), `Advances #n` for a
# slice of a larger one. On merge, `.github/workflows/claims.yml` takes
# `status:claimed` off every issue the body closes or advances (#1270); a seat
# that goes on to the next slice claims it again when it starts. The
# `## Ledger` section names rows; these lines name issues.
#
# Every pull request stacks on the server's top (#1264): when any pull request
# is open, the branch's own commits are rebased onto the top's branch (`top.jq`:
# the open pull request no other targets, on the longest chain from main). Its
# own commits leave out every other open pull request's and every patch the top
# already carries (`own_fork`, #1298), so a rerun after the top moved never
# carries another pull request's change. Its obligations are measured against
# the top's head, and it opens with the top's branch as its base, linked into
# the top's stack (`gh stack link`). Above members already in the merge queue
# only the open members are linked (#1988); where GitHub refuses that link,
# as it does over a pull request queued on its own (#1353), the pull request
# waits unlinked on the top, and GitHub moves it to main when the queued one
# merges. The task prints which path it took. With nothing open it opens
# against main.
#
# Every new pull request targets the top of the latest stack, queued or not
# (#1983): a top not landing is read first, and with every open pull request
# landing the top is the queued chain's. The new one is rebased onto that
# top's head, measured against it, and opened on its branch unlinked. When
# the queued top merges and its branch is deleted, GitHub moves the pull
# request to main, and it is the bottom of the next chain; `pr:land`
# retargets what stands on a landing's branches first (`retarget_landing`,
# #1420) as belt and braces. Nothing waits for the queue, and nothing opens a
# second root on main.
#
# A prefix a landing is queueing carries the `landing` label (#1556) while
# the landing waits on its members' required checks. A top carrying it is
# waited out (`await_top`), never the queue: once the prefix is queued the
# label is gone and the new pull request opens on the queued top. The top is
# read at the start and again just before the push
# (#1601): the obligations step between takes about a minute, and a landing
# started inside it holds and queues the top. A top changed or restacked by
# then is refused, to be opened again.
#
# The rule runs from the branch the task is run on, so a branch that lacks a
# change main made to `.config/pr-stack` is refused until it is rebased onto
# main (`stacking_current`): a branch forked before a fix runs the rule the
# fix replaced.
#
# A fix the open stack waits on cannot stack on it: it would land behind the
# pull request it unblocks. `--unblocks <n>` names that pull request, and the
# fix opens as a second bottom on main, measured against main, and is set to
# auto-merge so it queues on its own (#1353). The body must name #n. Once it
# merges, `pr:land` from the red stack restacks it onto main. Every
# other second bottom is refused.
#
# A change that reaches the recovery records (the parser, its grammar, its
# syntax tree or a corpus source) is swept whole before it opens, and a stale
# record refuses it, naming `corpus:goldens` (#2101).
#
# The body must work the branch's issue: a branch `<lane>-<n>-<slug>` is
# refused unless the body says `Advances #n` or closes #n, and a branch with
# no number unless the body works some issue, so the merge takes the claim
# off what it worked (`claims.yml`, #2462). It answers the sources the issues
# it works request (#2499): every key an issue's `## Sources` names has an
# item in the body's `## Sources read` with a disposition and its evidence,
# and a `supersedes` item is refused while a tracked line still names the old
# key without marking it demoted. It answers every reading axis once it works
# a unit (#2522, #2955): each axis's row in the body's `## Readings` reads
# `answered: <exemplar or site>`, `trivial: <what it reduces to>`,
# `not applicable: <what the change lacks that the axis asks about>` or
# `deferred: #n`, never `not selected` or a bare form, and an axis an issue
# selects answered other than `answered:` takes a `departed:` item keyed by
# the axis in `## Sources read`; an issue it works whose reading is still the
# migration's `unstated` placeholder is refused until the seat restates it
# on the issue. It names each concern it touches
# (#2523): each `## Concerns` item names a concern of `ledger/concerns.sql`
# with `within`, `consolidated: <what merged>` or `new concern: <why none
# fits>`, the last for a row the change adds, and a module or crate the change
# adds (since `evidence:base`) under a concern whose sites all lie in other
# crates is refused unless the body declares it `consolidated` or a
# `new concern`. A change to the parser, its grammar or its syntax tree
# states its surface form (#2527): a `### Surface form` subsection with a
# `cost:` line and a `demand: <site>` line; the goldens `corpus:goldens`
# records there ask for none (#2756). A closing keyword closes only from the
# head's `Closes #n` lines (#2980): one anywhere else is refused, since
# GitHub closes the issue it names on merge. Every body answers
# `## Refactoring` (#2884): `yes`, `maybe` or `no`, and for the first two a
# table `| Kind | Where | Observation |`, each `Where` resolved by
# `check:refactoring` against the rustdoc JSON once `evidence:obligations`
# has built it. The rule is
# `.config/claims/opening.jq`, reading the sections through `sections.jq`, its
# cases held by `check:claims`; a `note:` line it prints does not refuse.
# Each issue the body works, an epic or a `collector` aside, passes
# `unit:check` and carries the coordinator's `shape:signed` (#3134,
# `.config/claims/signed.jq`): the seat that sections an issue on its claim
# pages for the label and works on, and the landing waits for it. A body
# working a `collector` (#3326) `Advances` it, never closes it, and lists the
# rows it clears under `## Rows`, each an open row as the collector keys it.
#
# Vault pages are cited by their mint (#2793). With the vault checkout
# `$XDG_CONFIG_HOME/gandr/references` names, the task writes each page's
# `vault:<mint>` beside its filename in the body's `## Sources read`
# (`annotated.jq`), so the item's key is the one a crate carries verbatim.
# When an issue marks a vault page primary and the change touches a crate's
# sources, that crate must cite the page in a `# References` line, or the
# body marks the page `read: <what it informed>`. Without the checkout,
# neither applies.
#
# Before anything else the task sweeps the clone's landed worktrees and
# refuses under the disk floor (`wt:sweep --guard`).
#
# `--hold "<reason>"` opens it held by the owner (#3253): a draft labelled
# `hold:owner` with the reason commented (`pr:hold --owner`), unlinked,
# which nothing lands until `pr:release`.
["pr:open"]
description = "Open the pull request on the server's top once its body acknowledges every prose obligation"
usage = '''
arg "<title>" help="the pull request title: a conventional header"
arg "<body>" help="the body file; its re-verification section is written in place"
flag "--unblocks <number>" help="the open pull request this fix unblocks: open on main and queue on its own"
flag "--hold <reason>" help="the owner holds it: open it as a draft labelled `hold:owner` (`pr:hold --owner`), unlinked"
'''
# `findings.jq` stops jq 1.8.2 at an assertion; the claim tasks pin 1.8.1.
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
body=$(realpath "${usage_body:?}")
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
trunk=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
own=$(git branch --show-current)
[[ -n "$own" && "$own" != "$trunk" ]] || { echo "pr:open opens the checked-out branch; check out a unit branch, not $trunk" >&2; exit 2; }
if existing=$(gh pr view "$own" -R "$repo" --json number,state --jq 'select(.state == "OPEN") | .number' 2> /dev/null) && [[ -n "$existing" ]]; then
  echo "$own already has PR #$existing open; land it with \`pr:land\`" >&2
  exit 2
fi
claims=$(git rev-parse --show-toplevel)/.config/claims
issues=$(jq -Rrs -L "$claims" 'include "targets"; targets(working) | unique[]' "$body" \
  | while IFS= read -r number; do gh api "repos/$repo/issues/$number" --jq '{number, body: (.body // ""), labels: [.labels[].name]}'; done \
  | jq -s .)
mentions=$(jq -Rrs -L "$claims" 'include "sections"; superseded[]' "$body" \
  | while IFS= read -r key; do { git grep -nIF -e "$key" || true; } | jq -R . | jq -s --arg key "$key" '{($key): .}'; done \
  | jq -s 'add // {}')
# Measured on a fetched trunk (#3148, `measured_from`).
from=$(measured_from)
concerns_at() { { git show "$1:ledger/concerns.sql"; printf '%s\n' "$2"; } | sqlite3 -json; }
ids=$(concerns_at HEAD 'SELECT id FROM concern ORDER BY id;')
had=$(concerns_at "$from" 'SELECT id FROM concern ORDER BY id;')
sites=$(concerns_at HEAD 'SELECT concern, crate, module FROM site ORDER BY concern, crate, module;')
concerns=$(jq -n --argjson ids "${ids:-[]}" --argjson had "${had:-[]}" --argjson sites "${sites:-[]}" \
  '{ids: [$ids[].id], base: [$had[].id], sites: $sites}')
added=$(git diff --no-renames --name-only --diff-filter=A "$from" HEAD -- ':(glob)crates/*/src/**/*.rs' | jq -R . | jq -s .)
# The lines the change adds where a defect's regression is named (#2524),
# those that can name an issue alone, to keep the argument small.
regressions=$(git diff -U0 --no-renames --no-color "$from" HEAD -- ':(glob)corpus/**/*.gandr' ':(glob)**/*.rs' ':(glob).config/**/*.json' \
  | jq -Rs '[foreach (split("\n")[]) as $line ({path: null};
      if ($line | startswith("+++ ")) then {path: ($line | sub("^\\+\\+\\+ (b/)?"; ""))}
      else {path, text: (if ($line | startswith("+")) then $line[1:] else null end)} end;
      select(.text != null and (.text | test("[#_][0-9]"))))]')
# The paths the change touches in the parser, its grammar and its syntax tree
# (#2527); `opening.jq` sets aside the goldens among them (#2756).
surface=$(git diff --no-renames --name-only "$from" HEAD -- crates/surface-parser crates/surface-grammar crates/surface-syntax | jq -R . | jq -s .)
# The vault pages the issues name, and the crates' citations of them (#2793).
# With a vault checkout configured (`.config/references/vault.bash`), each
# resolved page's `vault:<mint>` is written beside its filename in the body's
# `## Sources read`, and `opening.jq` asks each crate whose sources the change
# touches to cite the issues' primary pages; without one, as in CI, neither.
source "$(git rev-parse --show-toplevel)/.config/references/vault.bash"
source "$(git rev-parse --show-toplevel)/.config/references/ledger.bash"
vaultdir=$(mktemp -d)
pages=$(vault_pages)
if [[ $pages == null ]]; then
  echo null > "$vaultdir/vault.json"
else
  git ls-files | awk -F/ '{ print $NF }' | sort -u > "$vaultdir/tree"
  printf '%s\n' "$pages" > "$vaultdir/pages.json"
  jq -n --rawfile body "$body" --slurpfile pages "$vaultdir/pages.json" --rawfile tree "$vaultdir/tree" '{body: $body, pages: $pages[0], tree: $tree}' \
    | jq -j -L "$claims" -f "$claims/annotated.jq" > "$vaultdir/body"
  if ! cmp -s "$vaultdir/body" "$body"; then
    cp "$vaultdir/body" "$body"
    echo "wrote each vault page's \`vault:<mint>\` beside its filename in $body's \`## Sources read\`"
  fi
  git diff --no-renames --name-only "$from" HEAD -- ':(glob)crates/*/src/**' ':(glob)crates/*/README.md' \
    | awk -F/ '{ print $2 }' | sort -u > "$vaultdir/touched"
  : > "$vaultdir/cites"
  if [[ -s "$vaultdir/touched" ]]; then
    mapfile -t cited_sources < <(references_sources | awk -F/ 'NR == FNR { touched[$0] = 1; next } touched[$2]' "$vaultdir/touched" -)
    if (( ${#cited_sources[@]} )); then
      LC_ALL=C awk -f .config/references/cites.awk "${cited_sources[@]}" | awk -F'\t' '$1 == "cite" { print $3 "\t" $2 }' > "$vaultdir/cites"
    fi
  fi
  jq -n --slurpfile pages "$vaultdir/pages.json" --rawfile tree "$vaultdir/tree" --rawfile touched "$vaultdir/touched" --rawfile cites "$vaultdir/cites" -L "$claims" \
    'include "vault"; {pages: $pages[0], tree: ($tree | vault_tree), touched: ($touched | split("\n") | map(select(. != ""))),
      cited: ($cites | split("\n") | map(select(. != "") | split("\t")) | group_by(.[0]) | map({key: .[0][0], value: (map(.[1]) | unique)}) | from_entries)}' \
    > "$vaultdir/vault.json"
fi
findings=$(jq -n --arg branch "$own" --rawfile body "$body" --argjson issues "$issues" --argjson mentions "$mentions" \
  --argjson concerns "$concerns" --argjson added "$added" --argjson regressions "$regressions" --argjson surface "$surface" \
  --slurpfile vault "$vaultdir/vault.json" \
  '{branch: $branch, body: $body, issues: $issues, mentions: $mentions, concerns: $concerns, added: $added, regressions: $regressions, surface: $surface, vault: $vault[0]}' \
  | jq -r -L "$claims" -f "$claims/opening.jq")
# Each issue the body works is sectioned and signed (#3134, `signed.jq`).
signed=$(jq -n --argjson issues "$issues" '{issues: $issues}' \
  | jq -r -L "$claims" --argjson concerns "$(jq -c .ids <<< "$concerns")" -f "$claims/signed.jq")
if [[ -n $signed ]]; then findings=${findings:+$findings$'\n'}$signed; fi
# A design page an issue builds on is absorbed in the same pair, or the body
# says why it stays design (#3161, `absorbing.jq`).
absorbing=$(jq -n --rawfile body "$body" --argjson issues "$issues" --argjson absorption "$(vault_absorption)" \
  '{body: $body, issues: $issues, absorption: $absorption}' | jq -r -L "$claims" -f "$claims/absorbing.jq")
if [[ -n $absorbing ]]; then findings=${findings:+$findings$'\n'}$absorbing; fi
rm -rf "$vaultdir"
if [[ -n "$findings" ]]; then
  echo "$findings" >&2
  if grep -qv '^note: ' <<< "$findings"; then exit 2; fi
fi
# The features ledger rows the body names against those the change touches
# (#2525), as notes: `pr:land` refuses them once the number is known.
if ! ledger=$(mise run --quiet ledger:patched "$body" "$from" 2> /dev/null); then
  printf '%s\n' "${ledger:-ledger:patched failed to read the ledger}" | sed 's/^/note: /' >&2
fi
# A reserved grammar rule the change lowers without an open issue naming it
# (#2528, `ledger:reserved`), as notes: `pr:land` refuses it.
if ! reserved=$(mise run --quiet ledger:reserved "$from" 2> /dev/null); then
  printf '%s\n' "${reserved:-ledger:reserved failed to read the ledger}" | sed 's/^/note: /' >&2
fi
# Landed worktrees go before anything else, and under the disk floor the
# task refuses (`wt:sweep --guard`).
mise run wt:sweep --guard
stacking_current || exit 2
unblocks=${usage_unblocks:-}
if [[ -n "$unblocks" ]]; then
  [[ "$unblocks" =~ ^[0-9]+$ && $(gh pr view "$unblocks" -R "$repo" --json state --jq .state 2> /dev/null) == OPEN ]] \
    || { echo "--unblocks names #$unblocks, which is not an open pull request" >&2; exit 2; }
  grep -qE -- "#$unblocks([^0-9]|\$)" "$body" \
    || { echo "the body must name #$unblocks, the pull request this fix unblocks" >&2; exit 2; }
  top=null
else
  top=$(await_top "$own")
fi
git fetch --quiet origin "$trunk"
if [[ "$top" == null ]]; then
  base=$trunk
  measured=$(mise run --quiet evidence:base)
  if [[ -z "$unblocks" ]]; then echo "no pull request is open: opening against $trunk"; fi
else
  base=$(jq -r .head <<< "$top")
  top_number=$(jq -r .number <<< "$top")
  git fetch --quiet origin "$base"
  if ! git merge-base --is-ancestor "origin/$base" HEAD; then
    fork=$(own_fork "$own" "$base")
    git rebase --quiet --update-refs --onto "origin/$base" "$fork" \
      || { git rebase --abort; echo "the rebase of $own onto $base (#$top_number, the top) conflicts; resolve it on $own, run the hooks, and run \`pr:open\` again" >&2; exit 1; }
  fi
  measured=origin/$base
fi
# The branch's own commits, from the top's head (or the trunk's fork) to
# HEAD, keep the commit rules and each changes something (#2640): a
# trailer-less or empty commit, such as a copy of a merged commit a rebase
# flattened, fails the format gate in the queue and holds the stack above it.
COMMITLINT_BIN=$(mise which commitlint) "$(git rev-parse --show-toplevel)/.config/commits/lint.bash" "$measured" HEAD --empty \
  || { echo "drop or amend each commit above, so every own commit keeps the commit rules, then run \`pr:open\` again" >&2; exit 2; }
# Nor does it add a file named as residue (`.config/merge-residue/names`):
# a merge driver's backup, or a tool's leftover such as `wt:warm`'s clone
# probe (#3222), staged by a `git add -A`.
if foreign=$(git diff --no-renames --name-only --diff-filter=A "$measured" HEAD \
  | grep -E -f "$(git rev-parse --show-toplevel)/.config/merge-residue/names"); then
  printf 'the change adds files named as residue; drop them from its commits, then run `pr:open` again:\n%s\n' "$(sed 's/^/  /' <<< "$foreign")" >&2
  exit 2
fi
status=0
mise run evidence:obligations --body "$body" --require-acknowledged "$measured" || status=$?
if (( status == 2 )); then
  echo "tick one box per prose obligation, and the lint assessment's and the hotpath verdict's boxes once their verdicts are written, in $body's ## Re-verification section, then run \`pr:open\` again" >&2
  exit 2
fi
(( status == 0 )) || exit "$status"
# Every `Where` of the body's `## Refactoring` names an item of the
# workspace's rustdoc JSON, which `evidence:obligations` has just built
# through `evidence:rustdoc`, or a tracked path (#2884, `check:refactoring`).
mise run --quiet check:refactoring "$body" \
  || { echo "name each \`## Refactoring\` \`Where\` as the workspace carries it, then run \`pr:open\` again" >&2; exit 2; }
# A change that reaches the recovery records, as prepare's `parser` filter
# reads it, sweeps them whole first (`ci:recovery`, about two minutes
# plain): a stale record is refused here rather than met in the queue
# (#2101).
if git diff --no-renames --name-only "$measured" HEAD \
  | grep -qE '^(crates/surface-(parser|grammar|syntax)/|corpus/.*\.gandr$)'; then
  mise run ci:recovery \
    || { echo "a recovery record the change reaches is stale; re-record with \`mise run corpus:goldens\`, commit, and run \`pr:open\` again" >&2; exit 1; }
fi
# A second bottom is refused unless it unblocks the open stack: with any other
# pull request open and not landing, the base is a branch of the stack.
if [[ -z "$unblocks" && "$base" == "$trunk" && $(landable_prs | jq --arg own "$own" '[.[] | select(.head != $own and (.landing | not))] | length') != 0 ]]; then
  echo "$own would open a second bottom on $trunk while another pull request is open; run \`pr:open\` again to stack it on the top" >&2
  exit 2
fi
if [[ -z "$unblocks" ]]; then
  now=$(await_top "$own")
  if [[ "$base" != "$trunk" ]]; then git fetch --quiet origin "$base"; fi
  if [[ $(jq -r '.number // empty' <<< "$now") != $(jq -r '.number // empty' <<< "$top") ]] \
    || { [[ "$base" != "$trunk" ]] && ! git merge-base --is-ancestor "origin/$base" HEAD; }; then
    echo "the stack top moved from #$(jq -r '.number // "none"' <<< "$top") to #$(jq -r '.number // "none"' <<< "$now"), or was restacked, while the obligations were measured; run \`pr:open\` again" >&2
    exit 2
  fi
fi
# The title and the body, as they will be posted, name nothing private
# (`body:check`, #2530).
mise run --quiet body:check --title "${usage_title:?}" "$body"
git push --quiet --force-with-lease -u origin HEAD
hold=${usage_hold:-}
url=$(gh pr create -R "$repo" --base "$base" --head "$own" --title "${usage_title:?}" --body-file "$body" ${hold:+--draft})
echo "$url"
# Held from its opening (#3253): a held pull request is no member of a stack,
# so it is not linked, and nothing lands it until `pr:release`.
if [[ -n "$hold" ]]; then
  mise run --quiet pr:hold --owner "${url##*/}" "$hold"
  exit 0
fi
if [[ -n "$unblocks" ]]; then
  gh pr merge "${url##*/}" -R "$repo" --merge --auto
  echo "#${url##*/} opens on $trunk to unblock #$unblocks and queues on its own; once it merges, \`pr:land\` from the red stack restacks it onto main"
fi
if [[ "$base" != "$trunk" ]]; then
  number=${url##*/}
  stack=$(server_stack "$number")
  queued=$(queued_of "$stack")
  if [[ "$queued" == '[]' ]]; then
    stack_link "$stack"
    echo "#$number stacked on #$top_number: $(jq -r 'map("#\(.number)") | join(" ← ")' <<< "$stack")"
  elif stack_link "$(jq -c --argjson queued "$queued" '[.[] | select(.number | IN($queued[]) | not)]' <<< "$stack")" 2> /dev/null; then
    echo "#$number stacked on #$top_number above the queued #$(jq -r '.[-1]' <<< "$queued"): $(jq -r 'map("#\(.number)") | join(" ← ")' <<< "$stack")"
  else
    echo "#$number waits unlinked on $base above the queued #$(jq -r '.[-1]' <<< "$queued"): GitHub moves it to $trunk when that one merges, and the next landing links and queues it"
  fi
fi
{% endraw %}'''

# Head checks and merge-group checks are separate runs. Watch the queue entry
# as well as the pull request; green head checks alone do not prove landing.
# The entry runs every workflow with a merge_group trigger; each is reported.
# The task sweeps the clone's landed worktrees first (`wt:sweep`), and once
# the pull request merged it removes the branch's own worktree.
# Open the pull request with `pr:open`; never `gh pr create --fill` on a branch
# of several commits: it titles the pull request with the branch name.
#
# Every landing is a stack's (#1264), read from the server, the only record:
# the pull request's base chain down to main and the open pull requests based
# on it up to the top (`chain.jq`). What lands is the largest prefix that is
# ready (#1988, `land_prefix`, decided by `.config/pr-stack/prefix.jq`, its
# cases held by `check:pr-stack`), in units (#2046): every member green on
# the trunk's required contexts and free of conflicts is queued, up to the
# first red, pending or conflicting one (#2783), which the task names with
# what cuts it, and at most the smaller of the queue's
# `max_entries_to_merge` and `max_entries_to_build` members at once; a
# queued unit below that is topped up with the green members above it
# (#2096), and once it is full the next unit goes in when it merged. The
# queue merges a queued stack whole, so a longer unit waits
# for every member's group to be built before any of it merges. The tail
# above the prefix is the next stack. The task runs from any member, and the
# caller's own pull request need not be in the prefix: with something below
# it red or pending the task says so and exits 0, and `pr:watch` lands the
# stack the moment that one goes green; with units below it queued the task
# queues each in turn until its own is. A chain of one is a plain landing, by
# auto-merge, unless it is the last open member of a server stack, which
# GitHub refuses auto-merge and `gh stack merge` queues; a longer one is
# linked (`gh stack link`) and queued as one group by `gh stack merge` up to
# the unit's top, and the task waits on the caller's pull request when it is
# in the queue. A stack whose top holds the branch of a pull request queued on
# its own outside it (`carried_queued`) waits for that one to merge and reads
# the stack again.
# Before any queueing, every open pull request on a branch the landing
# deletes, outside it, is retargeted to main (`retarget_landing`, #1420); one
# linked into the landing's stack is left alone (#1520).
#
# Nothing is restacked before the queue: a restack moves every head and
# reruns every check, so a ready prefix would wait a checks cycle for a
# rebase the queue does itself when it builds the merge group. A prefix that
# comes back unmergeable is restacked by `pr:watch`.
#
# Before the landing, when the checked-out branch is the pull request's own,
# the prose obligations are written into its body against its base, its
# ticks carried, and the landing is refused while a box is unticked; its own
# labels join its targets' for the lint assessment, and its head's red
# hotpath checks owe the hotpath verdict. Once every box is ticked, a failed
# obligations lane is rerun so it reads the ticks.
#
# A queued stack member leaves the queue alone only by being closed and
# reopened: `dequeuePullRequest` looks for a queue on the member's own base
# branch and finds none, a push to a queued branch is refused, and a stack
# member's base cannot be edited. The members below it stay queued.
["pr:land"]
description = "Queue the ready prefix of the pull request's stack and wait for the merge queue outcome"
usage = '''
arg "[number]" help="pull request number; defaults to the current branch"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:-}
if [[ -z "$number" ]]; then number=$(gh pr view --json number --jq .number); fi
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
owner=${repo%/*}
name=${repo#*/}
deadline=$((SECONDS + 5400))
queued=false
previous=
# Set when the entry first leaves the queue with every run green while the
# pull request still reads OPEN: the poll waits for MERGED until then.
merging_until=

pr_state() {
  gh pr view "$number" -R "$repo" --json state,mergeable,mergeStateStatus,autoMergeRequest,mergeCommit,baseRefName,statusCheckRollup --jq '[.state, .mergeable, .mergeStateStatus, (.autoMergeRequest != null), (.mergeCommit.oid // "-"), .baseRefName, (.statusCheckRollup | length)] | @tsv'
}
queue_state() {
  gh api graphql -f owner="$owner" -f name="$name" -F number="$number" -f query="
    query(\$owner: String!, \$name: String!, \$number: Int!) {
      repository(owner: \$owner, name: \$name) {
        pullRequest(number: \$number) {
          isInMergeQueue
          mergeQueueEntry { state position }
        }
      }
    }" --jq '.data.repository.pullRequest | [.isInMergeQueue, (.mergeQueueEntry.state // "-"), (.mergeQueueEntry.position // 0)] | @tsv'
}
# Every workflow's run for the pull request's newest queue entry, one per line.
group_runs() {
  gh run list -R "$repo" --event merge_group --limit 100 --json databaseId,headBranch,conclusion,url,status --jq "[.[] | select(.headBranch | split(\"/\") | last | startswith(\"pr-$number-\"))] | (.[0].headBranch // empty) as \$entry | .[] | select(.headBranch == \$entry) | [.databaseId, .url, .status, .conclusion] | @tsv"
}
# Succeeds once the entry has runs and every one of them has completed.
settled() {
  local run_id url run_status conclusion
  [[ -n "$1" ]] || return 1
  while IFS=$'\t' read -r run_id url run_status conclusion; do
    [[ "$run_status" == completed ]] || return 1
  done <<< "$1"
}
# Succeeds when every run of the entry concluded success.
succeeded() {
  local run_id url run_status conclusion
  while IFS=$'\t' read -r run_id url run_status conclusion; do
    [[ "$conclusion" == success ]] || return 1
  done <<< "$1"
}
job_times() {
  gh run view "$1" -R "$repo" --json jobs --jq '.jobs[] | [.name, (if .conclusion == "skipped" then "0s" elif .startedAt == null or .completedAt == null or .startedAt == "" or .completedAt == "" then "pending" else (((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) | tostring) + "s" end), .conclusion] | @tsv'
}
conflicts() {
  local ahead other files own file shared
  own=$(gh pr view "$number" -R "$repo" --json files --jq '.files[].path')
  ahead=$(gh api graphql --paginate -f owner="$owner" -f name="$name" -f branch="$base" -f query="
    query(\$owner: String!, \$name: String!, \$branch: String!, \$endCursor: String) {
      repository(owner: \$owner, name: \$name) {
        mergeQueue(branch: \$branch) {
          entries(first: 100, after: \$endCursor) {
            nodes { position pullRequest { number } }
            pageInfo { hasNextPage endCursor }
          }
        }
      }
    }" --jq ".data.repository.mergeQueue.entries.nodes[] | select(.position < $position) | .pullRequest.number")
  printf 'PR #%s is UNMERGEABLE in the queue. Entries ahead:\n' "$number"
  while IFS= read -r other; do
    [[ -n "$other" ]] || continue
    printf 'PR #%s; shared files:\n' "$other"
    files=$(gh pr view "$other" -R "$repo" --json files --jq '.files[].path')
    shared=false
    while IFS= read -r file; do
      [[ -n "$file" ]] || continue
      if [[ $'\n'"$own"$'\n' == *$'\n'"$file"$'\n'* ]]; then
        printf '  %s\n' "$file"
        shared=true
      fi
    done <<< "$files"
    if [[ "$shared" == false ]]; then echo '  (none)'; fi
  done <<< "$ahead"
  echo "rebase onto main once they merge, then run \`pr:land\` again"
}

# The landing is the stack's largest ready prefix (#1988, `land_prefix`), in
# units (#2046): run from any member, it queues every member green on the
# required contexts and free of conflicts, up to the first red, pending or
# conflicting one (#2783), a unit at a time,
# until the caller's own pull request is queued. A stack that holds the
# commits of a pull request queued on its own waits for that one to merge,
# then reads the stack again.
trunk=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
trap 'release_landing; drop_scratch' EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
trap 'exit 129' HUP
# Landed worktrees go first; a sweep that fails never holds a landing.
mise run wt:sweep || echo "wt:sweep failed; landing regardless" >&2

# The features ledger rows the body names are the rows the change patches,
# each `since` carrying the pull request's number (#2525, `ledger:patched`),
# read from its base's fork to its head; the landing is refused otherwise.
IFS=$'\t' read -r ledger_base ledger_head < <(gh pr view "$number" -R "$repo" --json baseRefName,headRefName --jq '[.baseRefName, .headRefName] | @tsv')
git fetch --quiet origin "$ledger_base" "$ledger_head"
ledger_body=$(mktemp)
gh pr view "$number" -R "$repo" --json body --jq .body > "$ledger_body"
status=0
ledger=$(mise run --quiet ledger:patched "$ledger_body" "$(git merge-base "origin/$ledger_base" "origin/$ledger_head")" \
  --head "origin/$ledger_head" --pr "$number" 2> /dev/null) || status=$?
# Nor does it land while a design page its issues build on is still owed in
# its `## Vault` (#3161, `absorbing.jq`): the page's status may have moved
# since `pr:open` read it.
source "$(git rev-parse --show-toplevel)/.config/references/vault.bash"
claims=$(git rev-parse --show-toplevel)/.config/claims
land_issues=$(jq -Rrs -L "$claims" 'include "targets"; targets(working) | unique[]' "$ledger_body" \
  | while IFS= read -r issue; do gh api "repos/$repo/issues/$issue" --jq '{number, body: (.body // "")}'; done \
  | jq -s .)
absorbing=$(jq -n --rawfile body "$ledger_body" --argjson issues "$land_issues" --argjson absorption "$(vault_absorption)" \
  '{body: $body, issues: $issues, absorption: $absorption}' | jq -r -L "$claims" -f "$claims/absorbing.jq")
rm -f "$ledger_body"
if (( status != 0 )); then
  printf 'PR #%s:\n%s\n' "$number" "${ledger:-ledger:patched failed to read the ledger}" | sed '2,$s/^/  /' >&2
  exit 2
fi
# Nor does it lower a reserved grammar rule its row's open issue does not
# name (#2528, `ledger:reserved`).
status=0
reserved=$(mise run --quiet ledger:reserved "$(git merge-base "origin/$ledger_base" "origin/$ledger_head")" \
  --head "origin/$ledger_head" 2> /dev/null) || status=$?
if (( status != 0 )); then
  printf 'PR #%s:\n%s\n' "$number" "${reserved:-ledger:reserved failed to read the ledger}" | sed '2,$s/^/  /' >&2
  exit 2
fi
if [[ -n $absorbing ]]; then
  printf 'PR #%s:\n%s\n' "$number" "$absorbing" | sed '2,$s/^/  /' >&2
  exit 2
fi

# The prose obligations are measured on the checked-out tree when it is the
# pull request's own branch, against its base, and written into its body, its
# ticks carried; the landing is refused while a box is unticked, and a failed
# obligations lane is rerun once every box is ticked, so it reads the ticks.
# A pull request landed from elsewhere is landed on its required checks,
# which hold the obligations lane.
own=$(gh pr view --json number --jq .number 2> /dev/null) || own=
if [[ "$own" == "$number" ]]; then
  base=$(gh pr view "$number" -R "$repo" --json baseRefName --jq .baseRefName)
  git fetch --quiet origin "$base"
  measured=origin/$base
  if [[ "$base" == "$trunk" ]]; then measured=$(mise run --quiet evidence:base); fi
  body=$(mktemp)
  gh pr view "$number" -R "$repo" --json body --jq .body > "$body"
  cp "$body" "$body.read"
  status=0
  mise run evidence:obligations "$measured" --body "$body" --pr "$number" --require-acknowledged || status=$?
  if (( status != 0 && status != 2 )); then rm -f "$body" "$body.read"; exit "$status"; fi
  if ! cmp -s "$body" "$body.read"; then gh pr edit "$number" -R "$repo" --body-file "$body" > /dev/null; fi
  rm -f "$body" "$body.read"
  if (( status == 2 )); then
    echo "PR #$number: tick one box per prose obligation, and the lint assessment's and the hotpath verdict's boxes once their verdicts are written, in its body's ## Re-verification section, then run \`pr:land\` again" >&2
    exit 2
  fi
  lane=$(gh pr checks "$number" -R "$repo" --json name,bucket,link --jq '.[] | select(.name == "re-verify obligated specifications (linux)" and .bucket == "fail") | .link')
  if [[ -n "$lane" ]]; then
    run_id=${lane#*/runs/}
    gh run rerun "${run_id%%/*}" -R "$repo" --job "${lane##*/job/}"
  fi
fi

while :; do
  status=0
  land_prefix "$number" || status=$?
  case "$status" in
    0) break ;;
    3)
      [[ $(in_queue "$number") != true ]] || break
      (( SECONDS < deadline )) || { echo "timed out waiting on the pull request queued below" >&2; exit 2; }
      sleep 60
      ;;
    *) exit "$status" ;;
  esac
done
# A stack whose bottom is red while it sits behind main, with nothing of it
# queued, may be red for what main has fixed since, as a fix opened with
# `pr:open --unblocks` is: it is restacked onto main, its checks run again,
# and `pr:watch` lands it once they are green. The rebase runs in a scratch
# worktree; the checked-out branch, when the stack moved it, is taken back.
IFS=$'\t' read -r verdict _upto stop <<< "$prefix_decision"
if [[ "$verdict" == hold && "$stop" == red && "$prefix_queued" == '[]' ]]; then
  bottom=$(jq -r '.[0].head' <<< "$prefix_server")
  git fetch --quiet origin "$trunk" "$bottom"
  if ! git merge-base --is-ancestor "origin/$trunk" "origin/$bottom"; then
    if ! git diff --quiet || ! git diff --cached --quiet; then
      echo "the checkout has uncommitted changes; commit or drop them, then run \`pr:land\` again to restack the stack onto $trunk" >&2
      exit 2
    fi
    echo "the stack's bottom is red and behind $trunk: restacking it onto $trunk"
    restack "$prefix_server"
    own_head=$(git branch --show-current)
    if jq -e --arg head "$own_head" 'any(.[]; .head == $head)' <<< "$prefix_server" > /dev/null; then
      git reset --quiet --keep "origin/$own_head"
    fi
  fi
fi
# The seat's wake-up: run as a deferred job, `pr:watch` exits with one line
# the moment the pull request needs a hand or has landed, and lands its
# stack the moment it goes green.
printf "arm: /bin/bash -c 'mise run pr:watch %s' timer-pr-%s\n" "$number" "$number"
if [[ $(in_queue "$number") != true ]]; then
  echo "#$number is not in this landing; \`pr:watch\` lands it once it and every pull request below it are green"
  exit 0
fi
queued=true
while (( SECONDS < deadline )); do
  snapshot=$(pr_state)
  IFS=$'\t' read -r state mergeable merge_status auto commit base check_count <<< "$snapshot"
  entry=$(queue_state)
  IFS=$'\t' read -r in_queue queue_status position <<< "$entry"
  current="$snapshot $entry"
  if [[ "$current" != "$previous" ]]; then
    printf 'PR #%s: %s; %s; %s; auto-merge=%s; queued=%s; entry=%s; position=%s; checks=%s\n' "$number" "$state" "$mergeable" "$merge_status" "$auto" "$in_queue" "$queue_status" "$position" "$check_count"
    previous=$current
  fi
  if [[ "$in_queue" == true ]]; then queued=true; fi
  if [[ "$state" == MERGED ]]; then
    entry_runs=$(group_runs)
    if settled "$entry_runs"; then
      printf 'Merged PR #%s: %s\n' "$number" "$commit"
      while IFS=$'\t' read -r -u 3 run_id url run_status conclusion; do
        printf 'Merge-group run: %s\n' "$url"
        job_times "$run_id"
      done 3<<< "$entry_runs"
      remove_landed_worktree "$number"
      exit 0
    fi
  elif [[ "$queue_status" == UNMERGEABLE ]]; then
    conflicts
    exit 3
  elif [[ "$state" == CLOSED || ( "$queued" == true && "$in_queue" == false && "$auto" == false ) ]]; then
    entry_runs=$(group_runs)
    if [[ -n "$entry_runs" ]]; then
      if settled "$entry_runs"; then
        # The queue drops a merged entry a moment before the pull request
        # reads MERGED, so an entry gone with every run green while the
        # pull request reads OPEN is waited on for five minutes.
        if [[ "$state" == OPEN ]] && succeeded "$entry_runs"; then
          if [[ -z "$merging_until" ]]; then merging_until=$((SECONDS + 300)); fi
          if (( SECONDS < merging_until )); then sleep 30; continue; fi
        fi
        printf 'PR #%s dequeued or closed.\n' "$number"
        # A failed run's failed steps explain the removal; with none failed,
        # every run's whole log does.
        while IFS=$'\t' read -r -u 3 run_id url run_status conclusion; do
          printf 'Merge-group run: %s (%s)\n' "$url" "$conclusion"
          job_times "$run_id"
          if [[ "$conclusion" == failure ]]; then
            gh run view "$run_id" -R "$repo" --log-failed
          elif [[ "$entry_runs" != *$'\t'failure* ]]; then
            gh run view "$run_id" -R "$repo" --log
          fi
        done 3<<< "$entry_runs"
        exit 1
      fi
    else
      printf 'PR #%s dequeued or closed without merging; no merge-group run found.\n' "$number"
      exit 1
    fi
  elif [[ ( "$merge_status" == BLOCKED || "$merge_status" == UNSTABLE ) && "$check_count" != 0 ]]; then
    check_status=0
    failed=$(gh pr checks "$number" -R "$repo" --json bucket,name,state,link --jq '.[] | select(.bucket == "fail" or .bucket == "cancel") | [.name, .state, .link] | @tsv') || check_status=$?
    if [[ "$check_status" != 0 && "$check_status" != 1 && "$check_status" != 8 ]]; then exit "$check_status"; fi
    if [[ -n "$failed" ]]; then
      logs_ready=true
      runs=' '
      while IFS=$'\t' read -r _check_name _check_state link; do
        if [[ "$link" =~ /actions/runs/([0-9]+) ]]; then
          run_id=${BASH_REMATCH[1]}
          [[ "$runs" != *" $run_id "* ]] || continue
          runs+="$run_id "
          run_status=$(gh run view "$run_id" -R "$repo" --json status --jq .status)
          if [[ "$run_status" != completed ]]; then logs_ready=false; fi
        fi
      done <<< "$failed"
      if [[ "$logs_ready" == true ]]; then
        printf 'PR #%s checks failed:\n%s\n' "$number" "$failed"
        for run_id in $runs; do gh run view "$run_id" -R "$repo" --log-failed; done
        exit 1
      fi
    fi
  fi
  sleep 30
done
printf 'Timed out after 90 minutes: PR #%s %s\n' "$number" "$previous" >&2
exit 2
{% endraw %}
'''

# A pull request held on purpose, for a base, a ruling or a sibling, is a
# draft with its reason (#2972): `pr:hold <n> "<reason>"` converts it and
# comments the reason under a `<!-- hold -->` marker. A draft is no stall
# (`stall:watch`), and neither `pr:watch` nor the `landing` workflow lands
# it, nor anything stacked above it (`rests.jq`, #3253). The owner's hold is
# `--owner`: the draft also carries the `hold:owner` label, which holds it
# still if the draft is taken back, and is never a chat note. `pr:release
# <n>` ends either hold, and the next watch lands it once green.
["pr:hold"]
description = "Hold a pull request on purpose: make it a draft and comment the reason"
usage = '''
arg "<number>" help="pull request number"
arg "<reason>" help="why it is held: the base, ruling or sibling it waits on, or the owner's review"
flag "--owner" help="the owner's hold: label it `hold:owner` as well"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:?}
reason=${usage_reason:?}
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
[[ -n "${reason// }" ]] || { echo 'pr:hold needs the reason it is held' >&2; exit 2; }
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
who='as a draft'
if [[ "${usage_owner:-false}" == true ]]; then
  gh label create hold:owner -R "$repo" --color B60205 --description "Held by the owner: no landing queues it or the stack above it" --force > /dev/null
  gh pr edit "$number" -R "$repo" --add-label hold:owner > /dev/null
  who='by the owner'
fi
if [[ $(gh pr view "$number" -R "$repo" --json isDraft --jq .isDraft) != true ]]; then
  gh pr ready "$number" -R "$repo" --undo > /dev/null
fi
gh pr comment "$number" -R "$repo" --body "$(printf '<!-- hold -->\n**Held** %s: %s\n\n`mise run pr:release %s` ends the hold; its next `pr:watch` lands it once green, and the stack above it with it.\n' "$who" "$reason" "$number")" > /dev/null
echo "#$number held $who: $reason"
'''

# The end of a hold (#3253): the draft taken back and the owner's
# `hold:owner` label taken off, so the next watch lands it once green.
["pr:release"]
description = "End a pull request's hold: ready the draft and take off the owner's label"
usage = '''
arg "<number>" help="pull request number"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:?}
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
IFS=$'\t' read -r draft owner < <(gh pr view "$number" -R "$repo" --json isDraft,labels --jq '[.isDraft, any(.labels[]; .name == "hold:owner")] | @tsv')
if [[ "$owner" == true ]]; then gh pr edit "$number" -R "$repo" --remove-label hold:owner > /dev/null; fi
if [[ "$draft" == true ]]; then gh pr ready "$number" -R "$repo" > /dev/null; fi
echo "#$number released: its next \`pr:watch\` lands it once green"
'''

# The wake-up a seat arms after `pr:land`: it polls the pull request and its
# queue entry and exits the moment one of these holds, printing one line and
# nothing else on stdout:
#   pr-merged #n               landed, its branch's worktree removed and its
#                              `## Refactoring` verdict filed (`refactor:file`,
#                              #2885; a failed filing is told on stderr and
#                              `stall:watch` pages it) (exit 0)
#   pr-closed #n               closed without merging
#   pr-dirty #n                a landing ahead conflicts: rebase, `pr:land`
#   pr-red #n <job>            a required check, or the queue entry's run,
#                              concluded failure: read the named job's log
#   pr-dequeued #n <reason> <above>
#                              the entry left the queue, or came back
#                              UNMERGEABLE: read the entry's run. <above>
#                              names the stack over it: `above-none` with
#                              nothing stacked on it, else `above-ejected
#                              #a …` for the open pull requests above that
#                              left the queue with it and `above-queued #b …`
#                              for any still in it
#   pr-timeout #n              the deadline passed (exit 2)
# The merge-queue entry is the only truth for a dequeue: a stack is queued as a
# unit and never sets auto-merge, so a pull request not yet seen in the queue
# is waited on, not reported. A BLOCKED pull request with checks still running
# is no event. An entry the queue removes because it merged is waited out
# until the state reads MERGED.
#
# The watch is also the landing trigger (#1988): the moment the pull
# request's head reads green on the trunk's required contexts, out of the
# queue, it queues the stack's ready prefix (`land_prefix`), as `pr:land`
# does, once per head; a stack waiting on a pull request queued on its own,
# or on a unit of its own queued below (#2046), and a landing that failed, a
# rate-limited read among them (#2746), are tried again every 2 minutes. A
# seat's `pr:open` and `pr:watch` land its pull request without a
# `pr:land`. A draft, held on purpose (`pr:hold`), is never landed. A pull
# request whose watch ended is read by the `landing` workflow whenever a `CI`
# run completes, a pull request leaves the queue or a draft is taken back
# (#2701, #2984): it lands it, or tells its seat.
#
# A dequeue or a conflict with no red check anywhere in the pull request's
# server stack needs no hand (#1264): the stack is restacked onto main, what
# moved is printed on stderr, the landing trigger queues it again once its
# checks are green, and the watch goes on, up to three times. A branch the
# restack moved is moved on the server only; its seat's checkout reads it at
# its next fetch. A red check, or a restack that conflicts, is the event line
# as before. A `landing` label a landing left on the pull request, queued or
# merged, is taken off (#1556).
#
# A conflict is a `DIRTY` merge state read on two polls in a row at the same
# head (`.config/pr-stack/dirty.jq`, #2854): GitHub recomputes the merge
# state lazily after a push to the pull request or below it, so one reading
# taken while its stack is restacked can be stale. A head that moved between
# the readings starts the count again; only a repeated `DIRTY` heals or is
# `pr-dirty`.
["pr:watch"]
description = "Wait for the one event that needs a hand on a pull request"
quiet = true
usage = '''
arg "<number>" help="pull request number"
flag "--timeout <seconds>" default="10800" help="give up after this many seconds"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
number=${usage_number:?}
timeout=${usage_timeout:-10800}
[[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a pull request number' >&2; exit 2; }
[[ "$timeout" =~ ^[0-9]+$ ]] || { echo 'Expected --timeout in seconds' >&2; exit 2; }
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
owner=${repo%/*}
name=${repo#*/}
deadline=$((SECONDS + timeout))
seen_queued=false
# The head the landing trigger last ran on, and the earliest time it runs
# again on a stack that waits or a landing that failed.
landed_head=
retry_at=0
# A reading out of the queue after one in it counts only when the next poll
# repeats it, so a moment between readings is no removal.
gone=0
# The head of the last `DIRTY` reading not yet repeated (`dirty.jq`, #2854):
# a merge state GitHub has not recomputed since a restack is no conflict.
dirty_seen=null

# State, merge state, queued, the entry's state and head, the last removal,
# whether it carries the `landing` label, the pull request's head, and
# whether it is a draft.
snapshot() {
  gh api graphql -f owner="$owner" -f name="$name" -F number="$number" -f query="
    query(\$owner: String!, \$name: String!, \$number: Int!) {
      repository(owner: \$owner, name: \$name) {
        pullRequest(number: \$number) {
          state mergeStateStatus isInMergeQueue headRefOid isDraft
          mergeQueueEntry { state headCommit { oid } }
          timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
            nodes { ... on RemovedFromMergeQueueEvent { reason } }
          }
          labels(first: 50) { nodes { name } }
        }
      }
    }" --jq '.data.repository.pullRequest | [.state, .mergeStateStatus, .isInMergeQueue, (.mergeQueueEntry.state // "-"), (.mergeQueueEntry.headCommit.oid // "-"), ((.timelineItems.nodes[0].reason // "") | if . == "" then "-" else ascii_downcase end), any(.labels.nodes[]; .name == "landing"), .headRefOid, .isDraft] | @tsv'
}
# The first failed required check on the head of `$1`, this pull request by
# default, if any. A cancelled check is red unless another run of its
# workflow on the same head was not cancelled (`superseded.jq`, #2829): two
# pull_request events for one head start two runs in the same second, the
# concurrency group cancels one, whichever id it carries, and its cancelled
# checks stay listed until the surviving run's jobs start.
red_check() {
  local status=0 checks red link run superseded
  checks=$(gh pr checks "${1:-$number}" -R "$repo" --required --json bucket,name,link) || status=$?
  # 1: some check failed; 8: some check pending.
  if [[ "$status" != 0 && "$status" != 1 && "$status" != 8 ]]; then return "$status"; fi
  while IFS=$'\t' read -r red link; do
    [[ -n "$red" ]] || continue
    if [[ "$link" =~ /actions/runs/([0-9]+)/ ]]; then
      run=${BASH_REMATCH[1]}
      superseded=$(gh api "repos/$repo/actions/runs/$run" --jq '"\(.head_sha)\t\(.workflow_id)\t\(.conclusion)"' |
        while IFS=$'\t' read -r sha workflow conclusion; do
          [[ "$conclusion" == cancelled ]] || continue
          gh api "repos/$repo/actions/workflows/$workflow/runs?head_sha=$sha&per_page=100" \
            --jq '[.workflow_runs[] | {id, conclusion}]' \
            | jq -c --argjson run "$run" -f "$pr_stack_dir/superseded.jq"
        done) || superseded=
      if [[ "$superseded" == true ]]; then continue; fi
    fi
    printf '%s' "$red"
    return 0
  done < <(jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "\(.name)\t\(if .bucket == "cancel" then .link else "" end)"' <<< "$checks")
}
trunk=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
source "$(git rev-parse --show-toplevel)/.config/pr-stack/stack.bash"
trap drop_scratch EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
trap 'exit 129' HUP
heals=0
required=$(required_contexts)
# Restack this pull request's server stack onto main, when no pull request in
# it has a red check; the landing trigger queues it again once its checks are
# green.
heal() {
  local stack member red
  (( heals < 3 )) || return 1
  stack=$(server_stack "$number")
  [[ $(jq length <<< "$stack") != 0 ]] || return 1
  for member in $(jq -r '.[].number' <<< "$stack"); do
    red=$(red_check "$member") || return 1
    [[ -z "$red" ]] || return 1
  done
  restack "$stack" >&2 || return 1
  heals=$((heals + 1))
  seen_queued=false
  gone=0
  echo "pr-restacked #$number: $(jq -r 'map("#\(.number)") | join(" ← ")' <<< "$stack")" >&2
}
# The open pull requests stacked above this one, bottom first: each one's base
# is the branch of the one below it.
stacked_above() {
  local branch next above
  branch=$(gh pr view "$number" -R "$repo" --json headRefName --jq .headRefName)
  for _layer in $(seq 64); do
    next=$(gh pr list -R "$repo" --state open --base "$branch" --json number,headRefName --jq 'first // empty | [.number, .headRefName] | @tsv')
    [[ -n "$next" ]] || return 0
    IFS=$'\t' read -r above branch <<< "$next"
    printf '%s\n' "$above"
  done
}
# Whether the stack above left the queue with this pull request.
above_word() {
  local above ejected='' kept='' in_queue
  while IFS= read -r above; do
    [[ -n "$above" ]] || continue
    in_queue=$(gh api graphql -f owner="$owner" -f name="$name" -F number="$above" -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { isInMergeQueue } } }' --jq .data.repository.pullRequest.isInMergeQueue)
    if [[ "$in_queue" == true ]]; then kept+=" #$above"; else ejected+=" #$above"; fi
  done <<< "$(stacked_above)"
  if [[ -z "$ejected$kept" ]]; then printf 'above-none'; return; fi
  [[ -z "$ejected" ]] || printf 'above-ejected%s' "$ejected"
  [[ -z "$ejected" || -z "$kept" ]] || printf ' '
  [[ -z "$kept" ]] || printf 'above-queued%s' "$kept"
}
# The first failed job of a run the queue entry's head started, if any.
red_entry() {
  local run_id job
  for run_id in $(gh run list -R "$repo" --event merge_group --commit "$1" --json databaseId,conclusion --jq '.[] | select(.conclusion == "failure") | .databaseId'); do
    job=$(gh run view "$run_id" -R "$repo" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name] | first // empty')
    if [[ -n "$job" ]]; then printf '%s' "$job"; return; fi
  done
}

while (( SECONDS < deadline )); do
  # A failed read is no event; the next poll reads again.
  if ! reading=$(snapshot) || [[ -z "$reading" ]]; then sleep 60; continue; fi
  IFS=$'\t' read -r state merge_status in_queue entry_state entry_head removed held head draft <<< "$reading"
  if [[ "$in_queue" == true ]]; then seen_queued=true; fi
  # A `landing` label still on a queued or merged pull request was left by a
  # `pr:land` that never reached its exit (#1556): it would hold `pr:open`.
  if [[ "$held" == true && ( "$in_queue" == true || "$state" == MERGED ) ]]; then
    gh pr edit "$number" -R "$repo" --remove-label landing > /dev/null 2>&1 || true
  fi
  case "$state" in
    MERGED)
      # Filed before the worktree, which may be this watch's own, goes.
      mise run --quiet refactor:file "$number" >&2 || echo "refactor-unfiled #$number: refactor:file failed; stall:watch pages the verdict" >&2
      remove_landed_worktree "$number"
      echo "pr-merged #$number"
      exit 0
      ;;
    CLOSED) echo "pr-closed #$number"; exit 1 ;;
    OPEN) ;;
    *) echo "unexpected pull request state: $state" >&2; exit 2 ;;
  esac
  verdict=$(jq -cn --arg status "$merge_status" --arg head "$head" --argjson seen "$dirty_seen" \
    '{status: $status, head: $head, seen: $seen}' | jq -c -f "$pr_stack_dir/dirty.jq")
  dirty_seen=$(jq -c .seen <<< "$verdict")
  case $(jq -r .act <<< "$verdict") in
    confirm) sleep 60; continue ;;
    conflict)
      if heal; then sleep 60; continue; fi
      echo "pr-dirty #$number"
      exit 1
      ;;
    clear) ;;
    *) echo "unexpected dirty.jq verdict: $verdict" >&2; exit 2 ;;
  esac
  job=$(red_check) || job=
  if [[ -z "$job" && "$entry_head" != - ]]; then job=$(red_entry "$entry_head") || job=; fi
  if [[ -n "$job" ]]; then echo "pr-red #$number $job"; exit 1; fi
  if [[ "$entry_state" == UNMERGEABLE ]]; then
    if heal; then sleep 60; continue; fi
    echo "pr-dequeued #$number unmergeable $(above_word)"
    exit 1
  fi
  # Out of the queue after it was in it; a removal because it merged settles
  # to MERGED on a later poll.
  if [[ "$seen_queued" == true && "$in_queue" == false && "$removed" != merged ]]; then
    gone=$((gone + 1))
  else
    gone=0
  fi
  if (( gone >= 2 )); then
    if heal; then sleep 60; continue; fi
    echo "pr-dequeued #$number ${removed/#-/removed} $(above_word)"
    exit 1
  fi
  # A draft is held on purpose (`pr:hold`, #2972): the trigger never lands it.
  if [[ "$in_queue" == false && "$draft" == false && "$head" != "$landed_head" ]] && (( SECONDS >= retry_at )) \
    && [[ $(required_state "$number" "$required") == green ]]; then
    status=0
    land_prefix "$number" >&2 || status=$?
    # Only a landing that ran records the head (`landed.jq`, #2746).
    IFS='|' read -r landed_head retry_at < <(jq -rn --argjson status "$status" --arg head "$head" \
      --arg landed_head "$landed_head" --argjson now "$SECONDS" --argjson retry_at "$retry_at" \
      '{status: $status, head: $head, landed_head: $landed_head, now: $now, retry_at: $retry_at}' \
      | jq -r -f "$pr_stack_dir/landed.jq")
  fi
  sleep 60
done
echo "pr-timeout #$number"
exit 2
{% endraw %}
'''

# The stall detector (#2785): the ways the fleet stops landing that no seat
# sees from inside its own `pr:watch`, read off the open pull requests and
# their merge-queue removals: a green root left unqueued, a pull request
# ejected again and again, a stack piled past a depth, a red pull request no
# new head revises, a conflicting one left so, a stacked member whose base
# conflicts or merged under it (`.config/stall/detect.jq`, its cases held by
# `check:stall`). It queues and revises nothing: a stall is its seat's to
# answer and the coordinator's to decide, and one no seat holds is filed as
# a unit, its `## Observation` the finding's line and its other sections the
# `stall` template's (`issue:file --template stall`, #3112). Each reading
# closes every open stall report whose stall no finding carries any more,
# its comment naming what cleared it (`.config/stall/reports.jq`).
#
# `stall:check` reads once, prints each finding's line and exits 1 on any;
# it pages nothing and leaves the detector's memory as it found it.
# `stall:watch` reads every `interval` seconds and pages each finding once
# while it lasts, to its lane's seat and to the coordinator at once (#2972).
# A finding standing `escalate` minutes after its first page stalls its pull
# request: a comment opening `<!-- stall -->` names the finding and the seat,
# the `status:stalled` label goes on, and the coordinator is paged again
# every `repage` minutes until the finding clears; the comment and label come
# off once the pull request is queued, a draft (a hold, `pr:hold`) or closed.
# A page, comment or label that failed is tried again at the next reading; a
# seat's page that failed is told to the coordinator with the line. A seat
# is paged by its name, never a block id: the page script resolves it at
# page time (#2977). Each reading also asks the `check` command whether each
# seat has a live block, and pages the coordinator once when one has had
# none for two readings in a row. The thresholds, the page script, the check
# and each target's arguments (the triage seat's, the coordinator's, and each
# lane's seat's under `seats`, a lane without one paging the triage seat) are
# configuration,
# never the tree's (`.config/stall/stall.bash`).
["stall:check"]
description = "Read the open pull requests once for stalls; exit 1 on a finding"
quiet = true
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/stall/stall.bash
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
trunk=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
reading=$(stall_reading "$repo" "$trunk" "$(stall_memory)") || { echo "stall:check: the reading failed" >&2; exit 2; }
jq -r '.findings[].line' <<< "$reading"
[[ $(jq '.findings | length' <<< "$reading") == 0 ]]
{% endraw %}
'''

["stall:watch"]
description = "Read the open pull requests for stalls every interval, paging each finding once"
quiet = true
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/stall/stall.bash
page=$(stall_configuration | jq -c '.page // empty')
if [[ -z "$page" ]] || ! jq -e '([.command, .triage, .coordinator] | all(type == "array" and length > 0 and all(type == "string")))
    and ((.seats // {}) | type == "object" and all(.[]; type == "array" and length > 0 and all(type == "string")))
    and ((.check // ["-"]) | type == "array" and length > 0 and all(type == "string"))' <<< "$page" > /dev/null; then
  echo "stall:watch pages through $stall_config's \`page\`: {\"command\": [<page script>, ...], \"triage\": [<the script's arguments before the line>, ...], \"coordinator\": [...], \"seats\": {\"<lane>\": [...], ...}, \"check\": [<the liveness command, given a seat's arguments>, ...]}" >&2
  exit 2
fi
mapfile -t command < <(jq -r '.command[]' <<< "$page")
mapfile -t coordinator < <(jq -r '.coordinator[]' <<< "$page")
mapfile -t check < <(jq -r '(.check // [])[]' <<< "$page")
# Page lane `$1`'s seat (the triage seat for a lane without one), then the
# coordinator unless the seat is the coordinator, with the line `$2`. A seat
# page that fails (the page script's exit 2: no live block) is told to the
# coordinator with the line, and fails the whole, so the next reading pages
# again.
page_seat() {
  local -a seat
  local status=0
  mapfile -t seat < <(jq -r --arg lane "$1" '(.seats[$lane] // .triage)[]' <<< "$page")
  "${command[@]}" "${seat[@]}" "$2" || status=1
  if [[ "${seat[*]}" != "${coordinator[*]}" ]]; then
    if (( status == 0 )); then
      "${command[@]}" "${coordinator[@]}" "$2" || status=1
    else
      "${command[@]}" "${coordinator[@]}" "$2 (not delivered to \`${seat[*]}\`)" || :
    fi
  fi
  return "$status"
}
# Each seat's liveness, once a reading (#2977): a seat the `check` command
# finds without a live block for two readings in a row is paged to the
# coordinator once, until it is live again. Reads and answers the count of
# readings each seat has been found gone, `{"<seat's arguments>": n}`.
sweep() {
  local gone=$1 seat args
  (( ${#check[@]} > 0 )) || { echo '{}'; return; }
  while IFS= read -r seat; do
    mapfile -t args < <(jq -r '.[]' <<< "$seat")
    if "${check[@]}" "${args[@]}" > /dev/null 2>&1; then
      gone=$(jq -c --arg s "${args[*]}" 'del(.[$s])' <<< "$gone")
      continue
    fi
    gone=$(jq -c --arg s "${args[*]}" '.[$s] += 1' <<< "$gone")
    if [[ $(jq --arg s "${args[*]}" '.[$s]' <<< "$gone") == 2 ]]; then
      "${command[@]}" "${coordinator[@]}" "STALL seat-gone ${args[*]}: no live block for two readings; it must register" >&2 \
        || gone=$(jq -c --arg s "${args[*]}" '.[$s] = 1' <<< "$gone")
    fi
  done < <(jq -c '[.triage, (.seats // {})[]] | unique[]' <<< "$page")
  echo "$gone"
}
# Close each open stall report whose event is over (#3112): `reports.jq`
# decides from the reading's findings and each report's pull request's state,
# and the closing comment names what cleared it. A failed read closes
# nothing; the next reading reads again.
reports() {
  local open states pr state number comment
  open=$(gh issue list -R "$repo" --state open --label kind:defect --search '"stall:" in:title' --limit 100 --json number,title) || return 0
  states='{}'
  for pr in $(jq -r '.[].title | capture("^stall: \\S+ on #(?<pr>[0-9]+),").pr' <<< "$open" | sort -u); do
    state=$(gh pr view "$pr" -R "$repo" --json state --jq .state) || return 0
    states=$(jq -c --arg pr "$pr" --arg state "$state" '.[$pr] = $state' <<< "$states")
  done
  while IFS=$'\t' read -r number comment; do
    echo "stall:watch: stall report #$number closed" >&2
    gh issue close "$number" -R "$repo" --comment "$comment" > /dev/null || :
  done < <(jq -c --argjson reports "$open" --argjson states "$states" '{reports: $reports, states: $states, findings}' <<< "$reading" \
    | jq -r -f "$stall_dir/reports.jq" | jq -r '.[] | "\(.number)\t\(.comment)"')
}
# Take pull request `$1`'s `<!-- stall -->` comments and its label off.
release() {
  local id
  for id in $(gh api --paginate "repos/$repo/issues/$1/comments" --jq '.[] | select(.body | startswith("<!-- stall -->")) | .id'); do
    gh api -X DELETE "repos/$repo/issues/comments/$id" > /dev/null || return 1
  done
  gh api -X DELETE "repos/$repo/issues/$1/labels/status:stalled" > /dev/null 2>&1 || :
}
repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
trunk=$(gh repo view "$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
mkdir -p "$(dirname "$stall_state")"
while :; do
  interval=$(stall_thresholds | jq .interval)
  # A failed read is no finding; the next reading reads again.
  if ! reading=$(stall_reading "$repo" "$trunk" "$(stall_memory)"); then
    echo "stall:watch: the reading failed; reading again in ${interval}s" >&2
    sleep "$interval"
    continue
  fi
  paged=$(jq -c .paged <<< "$reading")
  stalled=$(jq -c .stalled <<< "$reading")
  while IFS= read -r finding; do
    line=$(jq -r .line <<< "$finding")
    key=$(jq -r '"\(.number):\(.kind)"' <<< "$finding")
    echo "$line"
    sent=true
    page_seat "$(jq -r .lane <<< "$finding")" "$line" || sent=false
    # A finding no lane places is filed once its pages are sent, its line
    # the observation and its sections the `stall` template's (#3112), so a
    # page sent again never files it twice.
    if [[ "$sent" == true && $(jq .placed <<< "$finding") == false ]]; then
      title=$(jq -r '"stall: \(.kind) on #\(.number), whose lane `\(.lane)` no seat holds"' <<< "$finding")
      observation=$(mktemp)
      printf '## Observation\n\n%s\n' "$line" > "$observation"
      mise run --quiet issue:file "$title" "$observation" kind:defect area:workflow priority:high effort:easy \
        --template stall --fields "$(jq -c '{pr: "\(.number)", kind, lane}' <<< "$finding")" || sent=false
      rm -f "$observation"
    fi
    if [[ "$sent" == false ]]; then paged=$(jq -c --arg key "$key" 'del(.[$key])' <<< "$paged"); fi
  done < <(jq -c '.pages[]' <<< "$reading")
  while IFS= read -r finding; do
    line=$(jq -r .line <<< "$finding")
    echo "$line (paged again)"
    if ! "${command[@]}" "${coordinator[@]}" "$line"; then
      paged=$(jq -c --arg key "$(jq -r '"\(.number):\(.kind)"' <<< "$finding")" '.[$key].last = 0' <<< "$paged")
    fi
  done < <(jq -c '.repages[]' <<< "$reading")
  while IFS= read -r stall; do
    number=$(jq -r .number <<< "$stall")
    echo "stall:watch: #$number stalled" >&2
    if ! gh pr comment "$number" -R "$repo" --body "$(jq -r .comment <<< "$stall")" > /dev/null \
      || ! gh pr edit "$number" -R "$repo" --add-label status:stalled > /dev/null; then
      stalled=$(jq -c --arg n "$number" 'del(.[$n])' <<< "$stalled")
    fi
  done < <(jq -c '.stall[]' <<< "$reading")
  for number in $(jq -r '.release[]' <<< "$reading"); do
    echo "stall:watch: #$number released" >&2
    release "$number" || stalled=$(jq -c --arg n "$number" --argjson now "$(date +%s)" '.[$n] = $now' <<< "$stalled")
  done
  gone=$(sweep "$(stall_memory | jq -c '.gone // {}')")
  reports
  jq -c --argjson paged "$paged" --argjson stalled "$stalled" --argjson gone "$gone" \
    '{seen, paged: $paged, stalled: $stalled, gone: $gone}' <<< "$reading" > "$stall_state.tmp"
  mv "$stall_state.tmp" "$stall_state"
  sleep "$interval"
done
{% endraw %}
'''
