# it has a red check; the landing trigger queues it again once its checks are
# green. A member in the merge queue never moves (`heal.jq`, #3615): the
# heal waits for it to merge, printing `pr-waits` once, and the watch polls
# on. A member below this one that a required check failed on, or that the
# queue removed for `failed_checks`, is cut out when no member above it
# changes a path it changes (#4642): the members above restack past it
# (`restack_past`), and it waits alone for its seat.
waited=
heal() {
  local stack member red queued decision at=0 cut=
  stack=$(server_stack "$number")
  queued=$(queued_of "$stack")
  members_file=$(mktemp)
