  # shellcheck disable=SC2046
  git fetch --quiet origin "$trunk" $(jq -r '.[].head' <<< "$stack")
  for member in $(jq -r '.[].number' <<< "$stack"); do
    red=$(red_check "$member") || { rm -f "$members_file"; members_file=; return 1; }
    [[ -n $red || $(queue_removal "$member") != failed_checks ]] || red=failed_checks
    member_paths "$stack" "$at" \
      | jq -c --argjson number "$member" --argjson red "$([[ -n $red ]] && echo true || echo false)" \
        --argjson queued "$queued" \
        '{number: $number, red: $red, queued: ($number | IN($queued[])), paths: .}' >> "$members_file"
    at=$((at + 1))
  done
  decision=$(jq -cn --argjson heals "$heals" --argjson own "$number" --slurpfile members "$members_file" \
    '{heals: $heals, own: $own, members: $members}' | jq -c -f "$pr_stack_dir/heal.jq")
  rm -f "$members_file"
  members_file=
  case $(jq -r .act <<< "$decision") in
    stop) return 1 ;;
    wait)
      queued=$(jq -r '.queued | map("#\(.)") | join(" ")' <<< "$decision")
      [[ $waited == "$queued" ]] || echo "pr-waits #$number: $queued in the merge queue never moves; the restack waits for it to merge" >&2
      waited=$queued
      return 0
      ;;
    past)
      cut=$(jq -r .red <<< "$decision")
      restack_past "$stack" "$cut" >&2 || return 1
      ;;
    restack) restack "$stack" >&2 || return 1 ;;
  esac
  heals=$((heals + 1))
  seen_queued=false
  gone=0
  waited=
