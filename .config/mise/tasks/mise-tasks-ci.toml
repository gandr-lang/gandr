  for run_id in $(gh api "repos/$repo/actions/runs?event=merge_group&per_page=30" \
    | jq -r --arg prefix "gh-readonly-queue/$trunk/pr-$number-" --arg since "$started" -f "$root/.config/pr-stack/queue-runs.jq"); do
    job=$(gh run view "$run_id" -R "$repo" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | .name] | first // empty')
    if [[ -n "$job" ]]; then printf '%s' "$job"; return; fi
  done
}
started=$(date -u +%Y-%m-%dT%H:%M:%SZ)

while (( SECONDS < deadline )); do
  # A failed read is no event. It backs off five minutes before the next
  # poll: a rate limit read again in a minute is read again as a limit, and
  # every watch on the host reading it at once is what trips it (#4268).
  if ! reading=$(snapshot) || [[ -z "$reading" ]]; then sleep 300; continue; fi
  IFS=$'\t' read -r state merge_status in_queue entry_state entry_head removed held head draft <<< "$reading"
  if [[ "$in_queue" == true ]]; then seen_queued=true; fi
  # A `landing` label still on a queued or merged pull request was left by a
  # `pr:land` that never reached its exit (#1556): it would hold `pr:open`.
  if [[ "$held" == true && ( "$in_queue" == true || "$state" == MERGED ) ]]; then
    gh pr edit "$number" -R "$repo" --remove-label landing > /dev/null 2>&1 || true
  fi
  case "$state" in
    MERGED)
      # Filed before the worktree, which may be this watch's own, goes.
      mise run --quiet refactor:file "$number" >&2 || echo "refactor-unfiled #$number: refactor:file failed; stall:watch pages the verdict" >&2
      remove_landed_worktree "$number"
      echo "pr-merged #$number"
      exit 0
      ;;
    CLOSED) echo "pr-closed #$number"; exit 1 ;;
    OPEN) ;;
    *) echo "unexpected pull request state: $state" >&2; exit 2 ;;
  esac
  verdict=$(jq -cn --arg status "$merge_status" --arg head "$head" --argjson seen "$dirty_seen" \
    '{status: $status, head: $head, seen: $seen}' | jq -c -f "$pr_stack_dir/dirty.jq")
  dirty_seen=$(jq -c .seen <<< "$verdict")
  case $(jq -r .act <<< "$verdict") in
    confirm) sleep 60; continue ;;
    conflict)
      if heal; then sleep 60; continue; fi
      echo "pr-dirty #$number"
      exit 1
      ;;
    clear) ;;
    *) echo "unexpected dirty.jq verdict: $verdict" >&2; exit 2 ;;
  esac
  job=$(red_check) || job=
  if [[ -z "$job" && "$entry_head" != - ]]; then job=$(red_entry "$entry_head") || job=; fi
  if [[ -n "$job" ]]; then echo "pr-red #$number $job"; exit 1; fi
  if [[ "$entry_state" == UNMERGEABLE ]]; then
    if heal; then sleep 60; continue; fi
    echo "pr-dequeued #$number unmergeable $(above_word)"
    exit 1
  fi
  # An entry the queue removed for failed checks is red, whatever the pull
  # request's own checks say: the enforcing lane runs only in the merge
  # group, so a failure there shows nowhere else (#3745). It is never
  # healed: a restack would queue the same failure again, and again.
  if [[ "$in_queue" == false && "$removed" == failed_checks ]]; then
    job=$(red_queue_run) || job=
    if [[ -n "$job" ]]; then echo "pr-red #$number $job"; exit 1; fi
  fi
  # Out of the queue after it was in it; a removal because it merged settles
  # to MERGED on a later poll.
  if [[ "$seen_queued" == true && "$in_queue" == false && "$removed" != merged ]]; then
    gone=$((gone + 1))
  else
    gone=0
  fi
  if (( gone >= 2 )); then
    if heal; then sleep 60; continue; fi
    echo "pr-dequeued #$number ${removed/#-/removed} $(above_word)"
    exit 1
  fi
  # A draft is held on purpose (`pr:hold`, #2972): the trigger never lands it.
  if [[ "$in_queue" == false && "$draft" == false && "$head" != "$landed_head" ]] && (( SECONDS >= retry_at )) \
    && [[ $(required_state "$number" "$required") == green ]]; then
    status=0
    land_prefix "$number" >&2 || status=$?
    # Only a landing that ran records the head (`landed.jq`, #2746).
    IFS='|' read -r landed_head retry_at < <(jq -rn --argjson status "$status" --arg head "$head" \
      --arg landed_head "$landed_head" --argjson now "$SECONDS" --argjson retry_at "$retry_at" \
      '{status: $status, head: $head, landed_head: $landed_head, now: $now, retry_at: $retry_at}' \
      | jq -r -f "$pr_stack_dir/landed.jq")
  fi
  sleep 60
done
echo "pr-timeout #$number"
exit 2
{% endraw %}
'''

# The stall detector (#2785): the ways the fleet stops landing that no seat
# sees from inside its own `pr:watch`, read off the open pull requests and
# their merge-queue removals: a green root left unqueued, a pull request
# ejected again and again, a stack piled past a depth, a red pull request no
# new head revises, a conflicting one left so, a stacked member whose base
# conflicts or merged under it (`.config/stall/detect.jq`, its cases held by
# `check:stall`). It queues and revises nothing: a stall is its seat's to
# answer and the coordinator's to decide, and one no seat holds is filed as
# a unit: the observation `.config/stall/observation.jq` writes, the
# finding's line in a text block, then the `stall` template's sections
# (`issue:file --template stall`, #3112, #3596). Each reading
# closes every open stall report whose stall no finding carries any more,
# its comment naming what cleared it (`.config/stall/reports.jq`).
#
# `stall:check` reads once, prints each finding's line and exits 1 on any;
# it pages nothing and leaves the detector's memory as it found it. Its
# first finding is the detector's own absence (#4167): a last reading
# `stall:watch` recorded on this host more than two intervals ago, or none,
# is the line `STALL detector-down` (`.config/stall/live.jq`).
# `stall:watch` reads every `interval` seconds and pages each finding once
# while it lasts, to its lane's seat and to the coordinator at once (#2972).
# The seat's page is the finding's line. The coordinator's ends with the
# decisions its kind admits, each with its command (`decide.jq`, #4655).
# Each reading records its time in the detector's memory as `read`.
# `stall:watch --install` runs it as a service that starts it again 20
# seconds after any exit, a `systemd --user` unit on Linux and a `launchd`
# agent on macOS (`.config/service/service.jq`, #4167), and `--remove` stops
# and deletes that service. One runs per fleet, on the triage lane's host.
# The service runs from a clone of its own under the state directory, set
# to `origin/landing` before each reading. A landing that changes a file
# under `.config/` or `mise.toml` starts the watch again from that clone,
# so a repair of the detector is live at the next reading (#7002).
# A finding standing `escalate` minutes after its first page stalls its pull
# request: a comment opening `<!-- stall -->` names the finding and the seat,
# the `status:stalled` label goes on, and the coordinator is paged again
# every `repage` minutes until the finding clears; the comment and label come
# off once the pull request is queued, a draft (a hold, `pr:hold`) or closed.
# A page, comment or label that failed is tried again at the next reading; a
# seat's page that failed is told to the coordinator with the line. A seat
# is paged by its name, never a block id: the page script resolves it at
# page time (#2977). Each reading also asks the `check` command whether each
# seat has a live block, and pages the coordinator once when one has had
# none for two readings in a row. Each reading also asks the `activity`
# command for each seat's activity, the seats at once: `working`, `waiting`
# (no turn, and a background job runs) or `idle`, with the time it entered
# that state (#5996). A read that fails keeps the seat's last activity. A
# seat `idle` for `idle` minutes is paged once to its seat and the
# coordinator, whatever it holds (`seat-idle`, #3822): its line names the
# claims its lane holds and ends with the `claim` command for the lane. A
# claim is the lane's its marker names, and a markerless one is the lane's
# whose areas it carries (#4174). The coordinator's line carries the seat's
# last reported line. It asks for a decision only when the `peek` command,
# the claim's dry run, prints no work. The thresholds, the page script, the
# check, the activity, claim and peek commands, and each target's arguments
# (the triage seat's, the coordinator's, and each lane's seat's under
# `seats`, a lane without one paging the triage seat) are configuration,
# never the tree's (`.config/stall/stall.bash`).
["stall:check"]
description = "Read the open pull requests once for stalls; exit 1 on a finding"
quiet = true
tools.jq = "1.8.1"
tools.yq = "4.54.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/stall/stall.bash
source .config/gh/repo.bash
repo=$(repo_name)
source .config/pr-stack/trunk.bash
reading=$(stall_reading "$repo" "$trunk" "$(stall_memory)") || { echo "stall:check: the reading failed" >&2; exit 2; }
live=$(stall_liveness)
if [[ -n "$live" ]]; then echo "$live"; fi
jq -r '.findings[].line' <<< "$reading"
[[ -z "$live" && $(jq '.findings | length' <<< "$reading") == 0 ]]
{% endraw %}
'''

["stall:watch"]
description = "Read the open pull requests for stalls every interval, paging each finding once; --install runs it as a service"
quiet = true
tools.jq = "1.8.1"
tools.yq = "4.54.1"
usage = '''
flag "--install" help="install and start the service that keeps stall:watch running from a clone of its own at origin/landing"
flag "--remove" help="stop and delete that service"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/stall/stall.bash
if [[ ${usage_remove:-false} == true ]]; then stall_service remove; exit; fi
page=$(stall_configuration | jq -c '.page // empty')
if [[ -z "$page" ]] || ! jq -e '([.command, .triage, .coordinator] | all(type == "array" and length > 0 and all(type == "string")))
    and ((.seats // {}) | type == "object" and all(.[]; type == "array" and length > 0 and all(type == "string")))
    and ([.check, .activity, .claim, .peek] | all((. // ["-"]) | type == "array" and length > 0 and all(type == "string")))' <<< "$page" > /dev/null; then
  echo "stall:watch pages through $stall_config's \`page\`: {\"command\": [<page script>, ...], \"triage\": [<the script's arguments before the line>, ...], \"coordinator\": [...], \"seats\": {\"<lane>\": [...], ...}, \"check\": [<the liveness command, given a seat's arguments>, ...], \"activity\": [<the activity command, given a seat's arguments>, ...], \"claim\": [<the claim command, {lane} the lane>, ...], \"peek\": [<the claim's dry run, {lane} the lane>, ...]}" >&2
  exit 2
fi
# The service starts only on a configuration the loop reads.
if [[ ${usage_install:-false} == true ]]; then stall_service install; exit; fi
mapfile -t command < <(jq -r '.command[]' <<< "$page")
mapfile -t coordinator < <(jq -r '.coordinator[]' <<< "$page")
mapfile -t check < <(jq -r '(.check // [])[]' <<< "$page")
# The work the `peek` command prints for lane `$1`, as a JSON string, or null
# when it prints none, fails or is not configured (#5996).
peek_work() {
  local out
  local -a peek
  mapfile -t peek < <(jq -r --arg lane "$1" '(.peek // [])[] | gsub("\\{lane\\}"; $lane)' <<< "$page")
  if (( ${#peek[@]} > 0 )) && out=$("${peek[@]}" 2> /dev/null) && [[ -n $out ]]; then
    jq -Rc 'select(. != "")' <<< "$out" | jq -sc 'first // null'
  else
    echo null
  fi
}
# Page lane `$1`'s seat (the triage seat for a lane without one) with the
# finding's line `$2`, then the coordinator with `$3`, the line and the
# decisions its kind admits (`decide.jq`, #4655). A seat that is the
# coordinator is paged `$3` alone. A seat page that fails (the page script's
# exit 2: no live block) is told to the coordinator with `$3`, and fails the
# whole, so the next reading pages again.
page_seat() {
  local -a seat
  local status=0
  mapfile -t seat < <(jq -r --arg lane "$1" '(.seats[$lane] // .triage)[]' <<< "$page")
  if [[ "${seat[*]}" == "${coordinator[*]}" ]]; then
    "${command[@]}" "${coordinator[@]}" "$3" || status=1
    return "$status"
  fi
  "${command[@]}" "${seat[@]}" "$2" || status=1
  if (( status == 0 )); then
    "${command[@]}" "${coordinator[@]}" "$3" || status=1
  else
    "${command[@]}" "${coordinator[@]}" "$3 (not delivered to \`${seat[*]}\`)" || :
  fi
  return "$status"
}
# Each seat's liveness, once a reading (#2977): a seat the `check` command
# finds without a live block for two readings in a row is paged to the
# coordinator once, until it is live again. Reads and answers the count of
# readings each seat has been found gone, `{"<seat's arguments>": n}`.
sweep() {
  local gone=$1 seat args
  (( ${#check[@]} > 0 )) || { echo '{}'; return; }
  while IFS= read -r seat; do
    mapfile -t args < <(jq -r '.[]' <<< "$seat")
    if "${check[@]}" "${args[@]}" > /dev/null 2>&1; then
      gone=$(jq -c --arg s "${args[*]}" 'del(.[$s])' <<< "$gone")
      continue
    fi
    gone=$(jq -c --arg s "${args[*]}" '.[$s] += 1' <<< "$gone")
    if [[ $(jq --arg s "${args[*]}" '.[$s]' <<< "$gone") == 2 ]]; then
      "${command[@]}" "${coordinator[@]}" "STALL seat-gone ${args[*]}: no live block for two readings; it must register" >&2 \
        || gone=$(jq -c --arg s "${args[*]}" '.[$s] = 1' <<< "$gone")
    fi
  done < <(jq -c '[.triage, (.seats // {})[]] | unique[]' <<< "$page")
  echo "$gone"
}
# Close each open stall report whose event is over (#3112): `reports.jq`
# decides from the reading's findings and each report's pull request's state,
# and the closing comment names what cleared it. A failed read closes
# nothing; the next reading reads again.
reports() {
  local open states pr state number comment
  open=$(gh issue list -R "$repo" --state open --label kind:defect --search '"stall:" in:title' --limit 100 --json number,title) || return 0
  states='{}'
  for pr in $(jq -r '.[].title | capture("^stall: \\S+ on #(?<pr>[0-9]+),").pr' <<< "$open" | sort -u); do
    state=$(gh pr view "$pr" -R "$repo" --json state --jq .state) || return 0
    states=$(jq -c --arg pr "$pr" --arg state "$state" '.[$pr] = $state' <<< "$states")
  done
  while IFS=$'\t' read -r number comment; do
    echo "stall:watch: stall report #$number closed" >&2
    gh issue close "$number" -R "$repo" --comment "$comment" > /dev/null || :
  done < <(jq -c --slurpfile reports <(printf '%s\n' "$open") --slurpfile states <(printf '%s\n' "$states") \
    '{reports: $reports[0], states: $states[0], findings}' <<< "$reading" \
    | jq -r -f "$stall_dir/reports.jq" | jq -r '.[] | "\(.number)\t\(.comment)"')
}
# Take pull request `$1`'s `<!-- stall -->` comments and its label off.
release() {
  local id
  for id in $(gh api --paginate "repos/$repo/issues/$1/comments?per_page=100" --jq '.[] | select(.body | startswith("<!-- stall -->")) | .id'); do
    gh api -X DELETE "repos/$repo/issues/comments/$id" > /dev/null || return 1
  done
  gh api -X DELETE "repos/$repo/issues/$1/labels/status:stalled" > /dev/null 2>&1 || :
}
# Cut each red bottom out of its stack and place it on the top (#5073,
# `cut_bottom`): a stack's root on the trunk, neither queued nor a draft,
# that the queue removed for `failed_checks` or a required check failed at
# with conclusion `failure`. Its seat is told once a head, by a comment under
# a `<!-- pr-ejected <head> -->` mark naming the check and its run, and the
# coordinator gets one `STALL ejected-and-cut` line naming the stack before
# and after. A cut refused or in conflict moves nothing, and the reading's
# `ejected` and `pile-up` findings report it as before.
cuts() {
  local root line before after check run head base mark
  for root in $(pulls_reading | jq -r --arg trunk "$trunk" '.[] | select(.baseRefName == $trunk and .stack != null and (.isInMergeQueue | not) and (.isDraft | not)) | .number'); do
    line=$(cut_bottom "$root") || { echo "stall:watch: #$root is not cut" >&2; continue; }
    [[ -n $line ]] || continue
    IFS=$'\t' read -r before after check run <<< "$line"
    echo "stall:watch: #$root cut: $before → $after" >&2
    read -r head base < <(pr_reading "$root" | jq -r '"\(.headRefOid) \(.baseRefName)"')
    mark="<!-- pr-ejected $head -->"
    if [[ $(gh api --paginate "repos/$repo/issues/$root/comments?per_page=100" --jq '.[].body' | jq -sR --arg mark "$mark" 'contains($mark)') == false ]]; then
      gh pr comment "$root" -R "$repo" --body "$mark
pr-ejected #$root: the required check \`$check\` failed at ${head::12} ($run). \`stall:watch\` cut #$root out of its stack and placed it on the top: $after. Fix the check, rebase the branch onto \`$base\`, and push. #$root lands last." > /dev/null || :
    fi
    "${command[@]}" "${coordinator[@]}" "STALL ejected-and-cut #$root: \`$check\` failed ($run); the stack $before is now $after" || :
  done
}
# Page each landing event's seat within a minute (#5214). Between readings,
# the watch reads the newest issue comments once a minute with a conditional
# request: a minute that changes nothing answers 304 and costs no rate
# limit. A comment the landing watcher or `cuts` marks is an event
# (`events.jq`), and it pages the seat of the lane its branch names, or the
# coordinator for a branch no seat's lane names. An event of a dequeued or
# red pull request ends the wait at once, so the next reading's cut of a red
# bottom (`cuts`) runs within a minute of the queue's removal.
events_etag=
events_seen=null
events_urgent=0
poll_events() {
  local out body result number lane line
  out=$(gh api -i -H "If-None-Match: $events_etag" "repos/$repo/issues/comments?sort=created&direction=desc&per_page=50" 2> /dev/null) || :
  out=${out//$'\r'/}
  [[ $(awk 'NR == 1 { print $2; exit }' <<< "$out") == 200 ]] || return 0
  events_etag=$(awk -F': ' 'tolower($1) == "etag" { print $2; exit }' <<< "$out")
  body=$(awk 'body { print } /^$/ { body = 1 }' <<< "$out")
  result=$(jq -c --argjson seen "$events_seen" '{seen: $seen, comments: .}' <<< "$body" | jq -c -f "$stall_dir/events.jq") || return 0
  events_seen=$(jq -c .seen <<< "$result")
  if jq -e '.events | any(.kind | IN("dequeued", "red"))' <<< "$result" > /dev/null; then
    events_urgent=1
  fi
  while IFS=$'\t' read -r number line; do
    echo "$line"
    lane=$(gh api "repos/$repo/pulls/$number" --jq '.head.ref | split("-")[0]' 2> /dev/null) || lane=
    if [[ -n $lane ]] && jq -e --arg lane "$lane" '(.seats // {}) | has($lane)' <<< "$page" > /dev/null; then
      page_seat "$lane" "$line" "$line" || :
    else
      "${command[@]}" "${coordinator[@]}" "$line" || :
    fi
  done < <(jq -r '.events[] | "\(.number)\t\(.line)"' <<< "$result")
}
# Wait `$1` seconds for the next reading, polling the events each minute; an
# urgent event ends the wait.
listen() {
  local left=$1 step
  events_urgent=0
  while (( left > 0 )); do
    step=$(( left < 60 ? left : 60 ))
    sleep "$step"
    left=$(( left - step ))
    poll_events
    (( events_urgent == 0 )) || return 0
  done
}
source .config/gh/repo.bash
repo=$(repo_name)
source .config/pr-stack/stack.bash
required=$(required_contexts)
trap 'drop_scratch' EXIT
mkdir -p "$(dirname "$stall_state")"
while :; do
  # The service sets its own checkout to `origin/landing` before each
  # reading, and starts again from it when the move changes a script it
  # reads (#7002). A run from another checkout reads with that checkout's
  # scripts.
  if [[ $(git rev-parse --show-toplevel) -ef $stall_home ]]; then
    before=$(git rev-parse HEAD)
    if ! service_home_sync "$stall_home"; then
      echo "stall:watch: $stall_home cannot take origin/landing; reading with the commit it holds" >&2
    elif stall_scripts_moved "$before"; then
      echo "stall:watch: landing moves the scripts from ${before::9} to $(git rev-parse --short=9 HEAD); the watch starts again from them" >&2
      drop_scratch
      exec mise run stall:watch
    fi
  fi
  interval=$(stall_thresholds | jq .interval)
  # A failed read is no finding; the next reading reads again.
  if ! reading=$(stall_reading "$repo" "$trunk" "$(stall_memory)"); then
    echo "stall:watch: the reading failed; reading again in ${interval}s" >&2
    listen "$interval"
    continue
  fi
  paged=$(jq -c .paged <<< "$reading")
  stalled=$(jq -c .stalled <<< "$reading")
  while IFS= read -r finding; do
    if [[ $(jq -r .kind <<< "$finding") == seat-idle ]]; then
      finding=$(jq -c --argjson work "$(peek_work "$(jq -r .lane <<< "$finding")")" '. + {work: $work}' <<< "$finding")
    fi
    line=$(jq -r .line <<< "$finding")
    key=$(jq -r '"\(.number // .lane):\(.kind)"' <<< "$finding")
    echo "$line"
    sent=true
    page_seat "$(jq -r .lane <<< "$finding")" "$line" "$(jq -r -f "$stall_dir/decide.jq" <<< "$finding")" || sent=false
    # A finding no lane places is filed once its pages are sent, under the
    # observation `observation.jq` writes and the `stall` template's sections
    # (#3112, #3596), so a page sent again never files it twice.
    if [[ "$sent" == true && $(jq .placed <<< "$finding") == false ]]; then
      title=$(jq -r '"stall: \(.kind) on #\(.number), whose lane `\(.lane)` no seat holds"' <<< "$finding")
      observation=$(mktemp)
      jq -r -f "$stall_dir/observation.jq" <<< "$finding" > "$observation"
      mise run --quiet issue:file "$title" "$observation" kind:defect area:workflow priority:high effort:easy \
        --template stall --fields "$(jq -c '{pr: "\(.number)", kind, lane}' <<< "$finding")" || sent=false
      rm -f "$observation"
    fi
    if [[ "$sent" == false ]]; then paged=$(jq -c --arg key "$key" 'del(.[$key])' <<< "$paged"); fi
  done < <(jq -c '.pages[]' <<< "$reading")
  while IFS= read -r finding; do
    line=$(jq -r .line <<< "$finding")
    echo "$line (paged again)"
    if ! "${command[@]}" "${coordinator[@]}" "$(jq -r -f "$stall_dir/decide.jq" <<< "$finding")"; then
      paged=$(jq -c --arg key "$(jq -r '"\(.number // .lane):\(.kind)"' <<< "$finding")" '.[$key].last = 0' <<< "$paged")
    fi
  done < <(jq -c '.repages[]' <<< "$reading")
  while IFS= read -r stall; do
    number=$(jq -r .number <<< "$stall")
    echo "stall:watch: #$number stalled" >&2
    if ! gh pr comment "$number" -R "$repo" --body "$(jq -r .comment <<< "$stall")" > /dev/null \
      || ! gh pr edit "$number" -R "$repo" --add-label status:stalled > /dev/null; then
      stalled=$(jq -c --arg n "$number" 'del(.[$n])' <<< "$stalled")
    fi
  done < <(jq -c '.stall[]' <<< "$reading")
  for number in $(jq -r '.release[]' <<< "$reading"); do
    echo "stall:watch: #$number released" >&2
    release "$number" || stalled=$(jq -c --arg n "$number" --argjson now "$(date +%s)" '.[$n] = $now' <<< "$stalled")
  done
  cuts
  gone=$(sweep "$(stall_memory | jq -c '.gone // {}')")
  reports
  jq -c --argjson paged "$paged" --argjson stalled "$stalled" --argjson gone "$gone" --argjson read "$(date +%s)" \
    '{seen, paged: $paged, stalled: $stalled, gone: $gone, activity, read: $read}' <<< "$reading" > "$stall_state.tmp"
  mv "$stall_state.tmp" "$stall_state"
  listen "$interval"
done
{% endraw %}
'''

# `landing:watch` gives a red head of `landing` an owner (#6587,
# `.config/integration/watch.bash`). Each minute it reads `landing` and
# `main` by `git fetch`. A new head runs the landing's gate over the move
# since the last green head, in a worktree of its own under the lane
# `watch`. A red check files one defect, or comments on the open one,
# for the pull request that the search over the first parents names. The
# watcher claims the defect for that pull request's lane and pages the
# lane's seat `FIX`. A gap of `main` behind `landing` past 45 minutes pages
# the fixer once for each head of `main`. The page script and the seats
# are the stall detector's configuration. After each green head, the
# watcher fills the records cache of `check:deletes` on its host for each
# package that the move touches, in the background (#6861). `--once` reads
# once and ends.
# `--install` runs it as a service beside `stall:watch`, on the triage
# lane's host, and `--remove` stops and deletes that service. The service
# runs from a clone of its own under the state directory, set to
# `origin/landing` before each reading (#6653).
["landing:watch"]
description = "Run the landing's gate on each new head of landing and give a red head an owner; --install runs it as a service"
quiet = true
tools.jq = "1.8.1"
usage = '''
flag "--once" help="read once and end"
flag "--install" help="install and start the service that keeps landing:watch running from this checkout"
flag "--remove" help="stop and delete that service"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/integration/watch.bash
if [[ ${usage_remove:-false} == true ]]; then watch_service remove; exit; fi
if [[ ${usage_install:-false} == true ]]; then watch_service install; exit; fi
source .config/gh/repo.bash
repo=$(repo_name)
while :; do
  # The service sets its own checkout to `origin/landing` before each
  # reading, and the reading sources `watch.bash` from it again (#6653).
  # A run from another checkout reads with that checkout's script.
  if [[ $(git rev-parse --show-toplevel) -ef $watch_home ]]; then
    service_home_sync "$watch_home" || echo "landing:watch: $watch_home cannot take origin/landing; reading with the commit it holds" >&2
  fi
  # A reading that prints no state keeps the last one.
  state=$(watch_reading "$repo" | jq -c --argjson read "$(date +%s)" '.read = $read') || state=
  [[ -z $state ]] || watch_remember "$state"
  [[ ${usage_once:-false} == true ]] && break
  sleep "$watch_interval"
done
{% endraw %}
'''
