#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# A library producer moves its nightly and Clippy tag from a stable release.
# An external consumer takes the nightly from a reviewed full workflow commit
# and changes its Dylint metadata revision in the same operation. The installer
# reads that metadata too, so no independently editable binary revision exists.
# Either way the rust-clippy commit the Dylint driver's build reads
# (`.github/docker/rust-clippy.bash`, for the CI image and `check:dylint`)
# moves with them: the commit on the Clippy tag's first-parent line that set
# the channel.
["toolchain:bump"]
description = "Move the compiler and its local or external lint source together"
usage = '''
arg "[version]" help="stable release for a local library producer, e.g. 1.98.0"
flag "--workflow-rev <revision>" help="reviewed full 40-hex commit for an external workflow consumer"
'''
tools.jq = "1.8.1"
# Preserve shell parameter length syntax through template rendering.
run = '''
{% raw %}#!/usr/bin/env sh
set -eu

version=${usage_version:-}
revision=${usage_workflow_rev:-}
workflow_git=https://github.com/gandr-lang/quenchant
old_revision=
if [ -f Cargo.toml ]; then
  old_revision=$(cargo metadata --manifest-path Cargo.toml --no-deps --format-version 1 | jq -er --arg git "$workflow_git" '[.metadata.dylint.libraries[]? | select(.git == $git and .pattern == "crates/quenchant-dylints")] | if length == 0 then "" elif length == 1 then .[0].rev | select(type == "string" and test("^[0-9a-f]{40}$")) else error("expected one workflow library") end')
fi

if [ -n "$revision" ]; then
  if [ -n "$version" ] || [ -z "$old_revision" ]; then
    echo 'toolchain:bump: --workflow-rev requires external Dylint metadata and no stable version' >&2
    exit 1
  fi
  case "$revision" in
    *[!0-9a-f]*|'') echo 'toolchain:bump: revision must be lowercase hexadecimal' >&2; exit 1 ;;
  esac
  if [ "${#revision}" -ne 40 ]; then
    echo 'toolchain:bump: revision must be a full 40-hex commit' >&2
    exit 1
  fi
  channel=$(gh api --jq .content "repos/gandr-lang/quenchant/contents/rust-toolchain.toml?ref=$revision" | base64 -d | sed -n 's/^channel = "\([^"]*\)".*/\1/p')
  clippy_tag=$(gh api --jq .content "repos/gandr-lang/quenchant/contents/Cargo.toml?ref=$revision" | base64 -d | sed -n '/^\[workspace\.dependencies\.clippy_utils\]/,/^\[/s/^tag = "\([^"]*\)".*/\1/p')
else
  if [ -z "$version" ] || [ -n "$old_revision" ]; then
    echo 'toolchain:bump: external consumers require --workflow-rev; local producers require a stable version' >&2
    exit 1
  fi
  case "$version" in
    *[!0-9.]*|'') echo 'toolchain:bump: stable version must contain only digits and dots' >&2; exit 1 ;;
  esac
  # rust-clippy's release tag names the nightly its clippy_utils was built
  # against; the bump writes both pins from that one file.
  channel=$(gh api --jq .content "repos/rust-lang/rust-clippy/contents/rust-toolchain.toml?ref=rust-$version" | base64 -d | sed -n 's/^channel = "\([^"]*\)".*/\1/p')
  clippy_tag=rust-$version
fi
case "$channel" in
  nightly-*) ;;
  *) echo 'toolchain:bump: source carries no usable nightly channel' >&2; exit 1 ;;
esac

# Dylint's walk yields the commit on rust-clippy's first-parent line that set
# the channel: the first whose first parent names an earlier one.
# rust-clippy.bash serves that commit to the driver's build as `main`, so the
# walk stops there. A tag may sit a few commits after it, so the bump walks
# the tag's first parents back to it.
case "$clippy_tag" in
  rust-[0-9]*) ;;
  *) echo 'toolchain:bump: source carries no rust-<stable> clippy_utils tag' >&2; exit 1 ;;
esac
clippy_channel_at() {
  gh api --jq .content "repos/rust-lang/rust-clippy/contents/rust-toolchain.toml?ref=$1" | base64 -d | sed -n 's/^channel = "\([^"]*\)".*/\1/p'
}
clippy_rev=$(gh api --jq .sha "repos/rust-lang/rust-clippy/commits/$clippy_tag")
if [ "$(clippy_channel_at "$clippy_rev")" != "$channel" ]; then
  echo "toolchain:bump: rust-clippy $clippy_tag ($clippy_rev) does not name $channel" >&2
  exit 1
fi
steps=0
while clippy_parent=$(gh api --jq '.parents[0].sha' "repos/rust-lang/rust-clippy/commits/$clippy_rev") \
  && [ "$(clippy_channel_at "$clippy_parent")" = "$channel" ]; do
  clippy_rev=$clippy_parent
  steps=$((steps + 1))
  if [ "$steps" -ge 500 ]; then
    echo "toolchain:bump: no commit within 500 first parents of rust-clippy $clippy_tag sets $channel" >&2
    exit 1
  fi
done

# Values enter Perl through environment variables, never program interpolation.
export WORKFLOW_OLD_REV="$old_revision" WORKFLOW_NEW_REV="$revision" WORKFLOW_CHANNEL="$channel" WORKFLOW_STABLE="$version" CLIPPY_TAG="$clippy_tag" CLIPPY_REV="$clippy_rev"
if [ -n "$revision" ]; then
  perl -0777 -pi -e 's{(^\[\[workspace\.metadata\.dylint\.libraries\]\]\n)(.*?)(?=^\[|\z)}{my ($head, $body) = ($1, $2); if ($body =~ /^git = "https:\/\/github\.com\/gandr-lang\/quenchant"$/m && $body =~ /^pattern = "crates\/quenchant-dylints"$/m) { $body =~ s/^rev = "\Q$ENV{WORKFLOW_OLD_REV}\E"$/rev = "$ENV{WORKFLOW_NEW_REV}"/m; } "$head$body"}gmse' Cargo.toml
elif [ -f Cargo.toml ]; then
  perl -0777 -pi -e 's{(^\[workspace\.dependencies\.clippy_utils\]\n)(.*?)(?=^\[|\z)}{my ($head, $body) = ($1, $2); $body =~ s/^tag = ".*"$/tag = "rust-$ENV{WORKFLOW_STABLE}"/m; "$head$body"}gmse' Cargo.toml
fi
perl -pi -e 's/^channel = .*/channel = "$ENV{WORKFLOW_CHANNEL}"/' rust-toolchain.toml
if [ -f .github/docker/rust-clippy.bash ]; then
  perl -0777 -pi -e 's{^# rust-clippy.s \S+, the commit that set \S+\.\nrev=[0-9a-f]{40}$}{# rust-clippy\x27s $ENV{CLIPPY_TAG}, the commit that set $ENV{WORKFLOW_CHANNEL}.\nrev=$ENV{CLIPPY_REV}}m or die "rust-clippy.bash carries no rust-clippy pin\n"' .github/docker/rust-clippy.bash
fi

echo "pinned channel $channel; workflow revision ${revision:-local-library}; rust-clippy $clippy_tag at $clippy_rev"
echo 'clear ~/.dylint_drivers and target/dylint, then rerun the full gate wall'
echo 'external consumers: mise run check'
{% endraw %}
'''

# Every project pin but the compiler and the Dylint driver moves to its newest
# release, and the lockfile with it. `mise upgrade --bump` would also rewrite
# `rust-toolchain.toml` to the newest nightly, apart from the rust-clippy tag
# the Dylint driver is built against; the channel moves only with
# `toolchain:bump` above. The driver and its linker follow the library's
# `dylint_linting` at the pinned quenchant revision. The global config's tools
# stay with the user.
["tools:bump"]
description = "Bump every project tool pin but the compiler and the Dylint driver, each moved with what it is built against"
run = "mise upgrade --bump --no-global --exclude rust --exclude cargo:cargo-dylint --exclude cargo:dylint-link"

# The driver's release build, linked as the gandr toolchain `dev` (#4379), so
# a `gandr` on `PATH` that selects `dev` runs this checkout's build. The first
# toolchain linked becomes the default.
["install"]
description = "Build the release driver and link target/release as the gandr toolchain dev"
run = '''
cargo build --release --locked -p gandr-lang --bin gandr
target/release/gandr toolchain link dev target/release
'''

# Each host's toolchain follows `main` (#4499): every `interval` seconds the
# follower fetches `origin main` into the main checkout, fast-forwards it,
# builds the driver in its warm `target/` and deploys the build as the
# default toolchain `main`. Every relay re-execs into it on its next message
# (#4380). The builds live under `$XDG_DATA_HOME/gandr/builds/<commit>/`, the
# current one and the one before it, linked as `previous` for a rollback; a
# build a process still runs stays until the next deploy (`prune.jq`). A
# checkout off `main` or dirty is never touched, and it and a failed build
# are paged once per commit (`.config/follow/follow.bash`). `--once` reads
# once and exits. `--install` runs the follower as a host service from this
# checkout, as `stall:watch --install` does (`.config/service/`), and
# `--remove` stops and deletes it. The checkout, the interval and the page
# command are configuration, never the tree's.
["toolchain:follow"]
description = "Build and deploy main as the default toolchain whenever main moves; --install runs it as a service"
quiet = true
tools.jq = "1.8.1"
usage = '''
flag "--once" help="read once and exit"
flag "--install" help="install and start the service that keeps toolchain:follow running from this checkout"
flag "--remove" help="stop and delete that service"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
source .config/service/service.bash
source .config/follow/follow.bash
description='gandr toolchain follower (toolchain:follow)'
if [[ ${usage_remove:-false} == true ]]; then service_unit remove toolchain-follow toolchain:follow "$description"; exit; fi
config=$(follow_configuration) || exit 2
# The service starts only on a configuration the loop reads.
if [[ ${usage_install:-false} == true ]]; then service_unit install toolchain-follow toolchain:follow "$description"; exit; fi
mapfile -t follow_page_command < <(jq -r '.page[]' <<< "$config")
checkout=$(jq -r .checkout <<< "$config")
while :; do
  (follow_once "$checkout") || echo "toolchain:follow: the reading failed; reading again next interval" >&2
  if [[ ${usage_once:-false} == true ]]; then exit; fi
  sleep "$(jq .interval <<< "$(follow_configuration)")"
done
{% endraw %}
'''
