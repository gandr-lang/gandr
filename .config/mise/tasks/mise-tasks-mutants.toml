#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The mutation lane: cargo-mutants over one crate with the settings its
# campaign measured. Every mutant relinks the crate's test binaries, so the
# host's own target rustflags, which may name a memory-hungry linker, give
# way to `-Ctarget-cpu=native --cap-lints=warn` for the host triple. The
# workspace denies `unused` and `warnings`, so without the cap a mutant that
# leaves a parameter, an import or a helper unused fails to build and reads
# unviable, whatever its type (#1456, lever 4). This is cargo-mutants'
# documented answer to strict lints. The cap is set here rather than
# through cargo-mutants' `cap_lints`, which would replace these flags
# instead of adding to them, so every build of a run shares one set. Four
# mutants build at once under a jobserver of eight tasks; nextest runs each
# one's tests. Each scratch copy carries the checkout's `.git`
# (`--copy-vcs true`): a sweep test reads the change against the merge base,
# which needs a Git work tree (#3344). From a worktree that is the gitlink
# alone.
# A whole crate takes hours, which is why a witness batch reruns only the
# survivors it answers (`mutants:named`). Further arguments pass through to
# cargo-mutants (`--shard k/n`, `--list`, `--timeout`). Outcomes land in
# `mutants.out/<crate>`, or in `MUTANTS_OUTPUT` when set. One run holds the
# host at a time, in a scope of its own whose memory is capped
# (`.config/mise/mutants.bash`): a second run waits for the first, naming it,
# or with `--no-wait` refuses at once (#2540). The release ships no
# Apple-silicon binary, so the pin stays `cargo:` (binstall fetches the rest).
["mutants"]
description = "Mutation-test one crate with the campaign's measured settings"
tools."cargo:cargo-mutants" = "27.1.0"
env.NEXTEST_TEST_THREADS = "8"
run = '''
#!/usr/bin/env bash
set -euo pipefail
crate=
previous=
arguments=()
for argument in "$@"; do
  case "$previous" in
    -p | --package) crate=$argument ;;
  esac
  case "$argument" in
    --package=*) crate=${argument#--package=} ;;
  esac
  previous=$argument
  if [[ $argument == --no-wait ]]; then export MUTANTS_NO_WAIT=1; else arguments+=("$argument"); fi
done
set -- "${arguments[@]}"
if [[ -z "$crate" ]]; then
  echo 'usage: mise run mutants -- -p <crate> [--no-wait] [cargo-mutants arguments]' >&2
  exit 2
fi
host=$(rustc -vV | sed -n 's/^host: //p')
triple=$(tr '[:lower:]-' '[:upper:]_' <<< "$host")
export "CARGO_TARGET_${triple}_RUSTFLAGS=-Ctarget-cpu=native --cap-lints=warn"
output=${MUTANTS_OUTPUT:-mutants.out/$crate}
mkdir -p "$output"
source .config/mise/mutants.bash
hold_mutants_lock "mise run mutants -- $*"
exec "${mutants_scope[@]}" cargo mutants --test-tool nextest -j 4 --jobserver-tasks 8 --copy-vcs true --output "$output" "$@"
'''

# The survivors a witness batch answers, rerun alone: each `file:function`
# names a source file, relative to the crate's `src/` or to the workspace,
# and a function in it, bare or with its impl path (`converge`,
# `Replay::settle`). The files narrow the run with `--file` and the
# functions with one `--re` over the mutant names: an operator mutant ends
# in the function it sits in (`replace == with != in Edit<'_>::verdict`), a
# replaced body starts with it (`replace Edit<'_>::verdict -> … with Ok(())`;
# #745). The trust path's crates are checked this way after each batch
# lands. Outcomes land in `mutants.out/<crate>/named`.
["mutants:named"]
description = "Rerun only the named survivors of one crate under the measured settings"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
crate=
named=()
while (( $# > 0 )); do
  case "$1" in
    -p | --package) crate=${2:-}; shift 2 ;;
    --package=*) crate=${1#--package=}; shift ;;
    *) named+=("$1"); shift ;;
  esac
done
if [[ -z "$crate" || ${#named[@]} == 0 ]]; then
  echo 'usage: mise run mutants:named -- -p <crate> <file:function>...' >&2
  exit 2
fi
root=$(cargo metadata --locked --no-deps --format-version 1 | jq -r --arg crate "$crate" \
  '.workspace_root as $workspace | .packages[] | select(.name == $crate) | .manifest_path | rtrimstr("/Cargo.toml") | ltrimstr($workspace + "/")')
if [[ -z "$root" ]]; then
  printf 'no workspace crate named %s\n' "$crate" >&2
  exit 2
fi
files=()
functions=
for entry in "${named[@]}"; do
  file=${entry%%:*}
  function=${entry#*:}
  if [[ "$file" == "$entry" || -z "$function" ]]; then
    printf 'expected <file:function>, got %s\n' "$entry" >&2
    exit 2
  fi
  if [[ ! -f "$file" ]]; then file="$root/src/$file"; fi
  if [[ ! -f "$file" ]]; then
    printf 'no source file %s in %s\n' "${entry%%:*}" "$crate" >&2
    exit 2
  fi
  files+=(--file "$file")
  functions+="${functions:+|}$function"
done
MUTANTS_OUTPUT="mutants.out/$crate/named" exec mise run mutants -- -p "$crate" \
  "${files[@]}" --re "( in |: replace )(.*::)?($functions)( -> .*| with .*)?\$"
{% endraw %}
'''

# Each mutant under the tests that name its function (#1456). The whole-crate
# run tests every mutant against the crate's whole suite, so a mutant an
# unrelated corpus sweep catches reads caught and costs the sweep's time; here
# a mutant is caught only when a witness of its function fails. The index is
# the obligations report's: each function's `- witness:` bullets in the
# rustdoc JSON of the crate's library and each binary, #1611
# (`.config/mutants/items.jq`). The mutants group by function
# (`.config/mutants/groups.jq`), and each group's filterset of witnesses
# selects the tests of its mutants. The run builds and links only the test
# binaries that those witnesses live in (#3210): each integration target that
# they name, and the crate's library and binaries when a witness is a unit
# test. A function no witness names runs nothing: its mutants read missed at
# once and are listed again in `unwitnessed.txt`, the gap the coverage lane
# fills.
#
# One build serves the mutants (#6878). In a worktree of its own,
# `.config/mutants/schema.jq` writes each mutated function body as a match
# on `GANDR_MUTANT`: one arm for each mutant and the original body as the
# default arm. A check round builds the witnesses' binaries. An error on an
# arm takes the arm's mutants out of the schema
# (`.config/mutants/refused.jq`), and the next round builds again. Then each
# mutant in the schema runs its witnesses over that one build, with
# `GANDR_MUTANT` set to its number. A mutant out of the schema builds alone,
# as before: each function's group of them is one cargo-mutants invocation,
# in a lane's own tree, which reads unviable when the mutant does not build.
# The `--lanes` lanes share one list of that work, the mutants in the schema
# first, and a lane claims the next item that no other lane holds. So a slow
# mutant holds one lane alone, and the other lanes take the rest. Before any
# mutant, the witnesses run once with no mutant selected, so a witness that
# fails there stops the run instead of reading every mutant caught.
#
# The witnesses run under nextest's `mutants` profile, which ends none of
# them, so a slow witness on a loaded machine reads timeout, never caught.
# Each tree is a detached worktree of the repository, with the working tree
# laid over it. The schema's rounds and each lane's builds share `mutants`'
# flags, the lint cap included. The run holds the host's mutants lock as
# `mutants` does, waiting for a run that holds it or, with `--no-wait`,
# refusing at once (#2540). Each cargo invocation runs in its own capped
# scope (`.config/mise/mutants.bash`).
#
# Each outcome stays in `outcomes/` under a key of its content
# (`mutants_keyed`). The key hashes the toolchain, the flags, the workspace
# manifest, `Cargo.lock`, the cargo and nextest settings, the timeout, the
# files of the crate and of each workspace crate that it depends on, and the
# mutant's name, replacement and witnesses. A run reads each outcome whose
# key it computes again, and it builds nothing for those mutants. An edit
# outside those files moves no key. A run deletes each outcome that is not
# under one of its keys, so the store holds one outcome for each mutant that
# it lists at most.
# Outcomes land in `mutants.out/<crate>/witnessed` or `MUTANTS_OUTPUT`. The
# task writes `caught`, `missed`, `timeout`, `unviable`, and `unwitnessed.txt`.
# `unwitnessed.txt` is a static coverage gap. Its collector owns that gap.
# The summary gives the outcomes read by their keys, the mutants that the
# schema held, its check rounds, the mutants that built alone, and the wall
# time. `--in-diff` keeps only mutants in a diff's added lines.
# `mutants:changed` uses cargo-mutants' `--in-diff`. The whole-suite
# `mutants` maps a crate first.
#
# `--iterate` carries a crate's outcomes from one run to the next, across
# trees, as cargo-mutants' own `--iterate` does, in `iterate/` beside the
# outcomes. The mutants a run catches or finds unviable are settled
# (`settled.txt`) and no later `--iterate` run lists them again. The ones it
# misses or times out are tried (`tried.txt`) and wait out the pass: a run
# that leaves no mutant waiting ends it, writes `iterate/passed` and clears
# the tried list, so the next pass lists every survivor again. `--until`
# bounds a run's wall time: no mutant or group starts once that many seconds
# have gone since the run started, and the one running then is stopped at
# it. A stopped group's outcomes so far count. Each other mutant that has no
# outcome waits for the next run. A run therefore takes what fits and the
# rest follows it, which `mutants:nightly` relies on. Their names are in
# `waiting.txt`.
#
# `--seed-target <dir>` copies a built target directory into the schema's
# tree and each lane before its first build, and each builds in its own
# copy. A tree sits elsewhere, so the workspace's own crates rebuild there,
# but every dependency is the seed's. CI seeds the trees with main's restored
# test state, so they build in parallel instead of queueing on one target
# directory's lock.
["mutants:witnessed"]
description = "Mutation-test one crate, each mutant under the witnesses of its function"
depends = ["evidence:rustdoc"]
tools."cargo:cargo-mutants" = "27.1.0"
tools.jq = "1.8.1"
env.NEXTEST_TEST_THREADS = "2"
env.NEXTEST_PROFILE = "mutants"
usage = '''
flag "-p --package <crate>" required=#true help="the crate to mutate"
flag "--lanes <count>" default="4" help="the mutants that test at once over the schema's build, and the workspace copies whose groups build alone"
flag "--timeout <seconds>" default="300" help="the longest a mutant's witnesses may run"
flag "--in-diff <file>" help="mutate only the lines a unified diff adds"
flag "--iterate" help="skip the mutants earlier --iterate runs settled, and those they tried in the current pass"
flag "--until <seconds>" help="start no mutant or group after this many seconds and stop the one running then; the rest wait for the next run"
flag "--seed-target <dir>" help="copy this built target directory into the schema's tree and each lane, which build in their copies"
flag "--no-wait" help="refuse at once, naming the holder, when another mutants run holds the host"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
crate=${usage_package:?}
lanes=${usage_lanes:-4}
timeout=${usage_timeout:-300}
iterate=${usage_iterate:-false}
until=${usage_until:-}
seed=${usage_seed_target:-}
[[ ${usage_no_wait:-false} != true ]] || export MUTANTS_NO_WAIT=1
in_diff=()
if [[ -n "${usage_in_diff:-}" ]]; then
  [[ -f "$usage_in_diff" ]] || { printf 'no diff at %s\n' "$usage_in_diff" >&2; exit 2; }
  in_diff=(--in-diff "$(realpath "$usage_in_diff")")
fi
[[ "$lanes" =~ ^[1-9][0-9]*$ ]] || { echo '--lanes takes a positive count' >&2; exit 2; }
[[ "$timeout" =~ ^[1-9][0-9]*$ ]] || { echo '--timeout takes a positive count of seconds' >&2; exit 2; }
if [[ -n "$until" ]]; then
  [[ "$until" =~ ^[1-9][0-9]*$ ]] || { echo '--until takes a positive count of seconds' >&2; exit 2; }
  command -v timeout > /dev/null || { echo '--until stops a group with timeout(1), which is not on the path' >&2; exit 2; }
fi
if [[ -n "$seed" ]]; then
  [[ -d "$seed" ]] || { printf 'no target directory at %s\n' "$seed" >&2; exit 2; }
  seed=$(cd "$seed" && pwd)
fi
host=$(rustc -vV | sed -n 's/^host: //p')
triple=$(tr '[:lower:]-' '[:upper:]_' <<< "$host")
export "CARGO_TARGET_${triple}_RUSTFLAGS=-Ctarget-cpu=native --cap-lints=warn"
output=${MUTANTS_OUTPUT:-mutants.out/$crate/witnessed}
source .config/mise/mutants.bash
hold_mutants_lock "mise run mutants:witnessed -- -p $crate"
scope=${mutants_scope[0]}
mkdir -p "$output/outcomes"
output=$(cd "$output" && pwd)
find "$output" -mindepth 1 -maxdepth 1 ! -name outcomes ! -name iterate -exec rm -rf {} +
[[ "$iterate" == true ]] || rm -rf "$output/iterate"
mkdir -p "$output/logs"
started=$SECONDS
mutants_listed "$crate" "$output" "${in_diff[@]}"
listed=$(jq length "$output/list.json")
if [[ "$iterate" == true ]]; then
  mkdir -p "$output/iterate"
  touch "$output/iterate/settled.txt" "$output/iterate/tried.txt"
  jq --rawfile known <(cat "$output/iterate/settled.txt" "$output/iterate/tried.txt") \
    '($known | split("\n") | map({key: ., value: true}) | from_entries) as $known | map(select($known[.name] | not))' \
    "$output/list.json" > "$output/listed.json"
  mv "$output/listed.json" "$output/list.json"
fi
mutants_grouped "$output"
lib=$(jq -r '.lib // true' "$output/group-input.json")
mutants_keyed "$crate" "$timeout" "$output"
jq -c --rawfile known <(for entry in "$output"/outcomes/*; do [[ ! -f "$entry" ]] || printf '%s\n' "${entry##*/}"; done) \
  '($known | split("\n")) as $known | map(select(.key | IN($known[]) | not))' "$output/keyed.json" > "$output/pending.json"
# An outcome is written whole under its key, so a run that stops leaves each
# outcome it reached and no part of one.
record() { printf '%s\n' "$2" > "$output/outcomes/$1.part" && mv "$output/outcomes/$1.part" "$output/outcomes/$1"; }
held=0
rounds=0
alone=0
if [[ $(jq length "$output/pending.json") != 0 ]]; then
  # Each tree is a detached worktree of this repository at HEAD with the
  # working tree's files laid over it: some witnesses read the history
  # (`git merge-base origin/main HEAD`), which a bare copy has not got. A
  # tracked file the working tree deleted is left out of the overlay here,
  # since macOS's tar cannot skip an unreadable name.
  # A seeded tree builds in its own copy, never in a shared target directory.
  # The scratch is named for this process, so `wt:sweep` leaves it while the
  # run lives and removes what a killed run left.
  [[ -z "$seed" ]] || unset CARGO_TARGET_DIR
  scratch=$(mktemp -d "${TMPDIR:-/tmp}/gandr-scratch-$$.XXXXXX")
  trap 'for lane in "$scratch"/*/; do git worktree remove --force "$lane" 2> /dev/null || true; done; rm -rf "$scratch"; git worktree prune' EXIT
  tree() {
    git worktree add --quiet --detach "$1" HEAD
    git ls-files -z --cached --others --exclude-standard \
      | while IFS= read -r -d '' path; do [[ ! -e "$path" && ! -L "$path" ]] || printf '%s\0' "$path"; done \
      | tar --null -T - -cf - | tar -xf - -C "$1"
    [[ -z "$seed" ]] || cp -a "$seed" "$1/target"
  }
  # The binaries that the pending mutants' witnesses live in (#3210): each
  # integration target that they name, and the crate's own targets when a
  # witness is a unit test. The schema builds these and no other.
  selectors=()
  while IFS= read -r test; do selectors+=("--test=$test"); done < <(jq -r '[.[].tests[]] | unique[]' "$output/pending.json")
  if jq -e 'any(.[]; .unit)' "$output/pending.json" > /dev/null; then
    if [[ $lib == true ]]; then selectors+=(--lib --bins); else selectors+=(--bins); fi
  fi
  # One schema of the pending mutants (#6878): `schema.jq` writes each body
  # that holds one as a match on `GANDR_MUTANT`, and the crate's target roots
  # get the switch. A round builds the witnesses' binaries. Each error on an
  # arm takes the arm's mutant out of the schema (`refused.jq`), and the next
  # round builds the schema again. An error on no arm ends the schema: its
  # files go back, and every pending mutant builds alone.
  schema=$scratch/schema
  tree "$schema"
  jq -c '.workspace_root as $root | .packages[] | select(.name == $crate) | [.targets[] | select(.kind | index("lib") or index("bin")) | .src_path | ltrimstr($root + "/")]' \
    --arg crate "$crate" <(cargo metadata --locked --no-deps --format-version 1) > "$output/roots.json"
  { jq -r '.[].file' "$output/list.json"; jq -r '.[]' "$output/roots.json"; } | sort -u | while IFS= read -r file; do
    jq -Rs --arg file "$file" '{($file): .}' "$schema/$file"
  done | jq -s 'add' > "$output/files.json"
  dropped=$(jq -c --slurpfile pending "$output/pending.json" '[.[].name] - [$pending[0][].name]' "$output/list.json")
  written() {
    jq -r '.files | keys[]' "$1" | while IFS= read -r file; do jq -j --arg file "$file" '.files[$file]' "$1" > "$schema/$file"; done
  }
  while :; do
    jq -n --slurpfile list "$output/list.json" --slurpfile files "$output/files.json" --slurpfile roots "$output/roots.json" --argjson dropped "$dropped" \
      '{mutants: $list[0], files: $files[0], roots: $roots[0], dropped: $dropped}' | jq -c -f .config/mutants/schema.jq > "$output/schema.json"
    written "$output/schema.json"
    rounds=$((rounds + 1))
    status=0
    (cd "$schema" && "${mutants_scope[@]}" cargo test --locked --no-run --message-format=json --package "$crate" "${selectors[@]}") \
      > "$output/logs/round-$rounds.json" 2> "$output/logs/round-$rounds.log" || status=$?
    (( status != 0 )) || break
    refused=$(jq -n --slurpfile schema "$output/schema.json" '{arms: $schema[0].arms, messages: [inputs]}' "$output/logs/round-$rounds.json" \
      | jq -c -f .config/mutants/refused.jq)
    if jq -e --argjson dropped "$dropped" '(.unplaced | length) > 0 or (.dropped - $dropped | length) == 0' <<< "$refused" > /dev/null; then
      printf 'the schema fails to build outside its arms (%s; see %s); each pending mutant builds alone\n' \
        "$(jq -r '.unplaced | join(", ")' <<< "$refused")" "$output/logs/round-$rounds.log" >&2
      jq -n --slurpfile files "$output/files.json" '{files: $files[0], held: []}' > "$output/schema.json"
      written "$output/schema.json"
      break
    fi
    dropped=$(jq -c --argjson dropped "$dropped" '$dropped + .dropped | unique' <<< "$refused")
  done
  # One run of every pending mutant's witnesses with no mutant selected, in
  # the schema as the mutants will run: a witness that fails there, or names
  # no test, would read each of its function's mutants caught.
  union=$(jq -r '[.[].filter | sub("^package\\(=[^)]*\\) & "; "")] | unique | join(" | ")' "$output/pending.json")
  (cd "$schema" && "$scope" cargo nextest run --locked --package "$crate" "${selectors[@]}" --no-tests=fail -E "package(=$crate) & ($union)") > "$output/logs/witnesses.log" 2>&1 \
    || { printf 'the witnesses fail unmutated; see %s\n' "$output/logs/witnesses.log" >&2; exit 1; }
  # The lanes share one list of work, in order: each mutant in the schema,
  # then each group of the mutants out of it. A lane claims the next item
  # that no other lane holds, so a slow item holds one lane alone and the
  # other lanes take the rest. No item starts once `--until` has passed.
  jq -c --slurpfile schema "$output/schema.json" '[.[] | select(.name | IN($schema[0].held[]))]' "$output/pending.json" > "$output/held.json"
  held=$(jq length "$output/held.json")
  jq -c --slurpfile held "$output/held.json" '[.[] | select(.name | IN($held[0][].name) | not)]' "$output/pending.json" > "$output/alone.json"
  alone=$(jq length "$output/alone.json")
  mkdir -p "$output/alone/groups" "$scratch/claims"
  echo '[]' > "$output/alone/groups.json"
  if (( alone > 0 )); then
    jq --slurpfile alone "$output/alone.json" '[.[] | select(.name | IN($alone[0][].name))]' "$output/list.json" > "$output/alone/list.json"
    cp "$output/items.json" "$output/group-input.json" "$output/alone/"
    mutants_grouped "$output/alone"
    # The lanes' trees for the groups, one after another while the mutants
    # in the schema run. A lane waits for its own tree at its first group.
    (for (( lane = 0; lane < lanes; lane++ )); do tree "$scratch/$lane" || touch "$scratch/failed"; touch "$scratch/$lane.ready"; done) &
  fi
  jq -r '.[] | [.name, .key] | @tsv' "$output/alone.json" > "$output/alone/keys.tsv"
  jq -c --slurpfile groups "$output/alone/groups.json" \
    '(.[] | {held: .}), ($groups[0] | to_entries[] | select(.value.filter != null) | {index: .key, group: .value})' \
    "$output/held.json" > "$output/work.jsonl"
  # A mutant in the schema runs its witnesses over the one build, with
  # `GANDR_MUTANT` set to its number. An exit of 0 reads missed, the timeout
  # timeout, and any other failure caught, as cargo-mutants reads its test
  # phase. A failed build or an empty test list leaves no outcome, and so
  # does a stop at `--until` (`$2`, the seconds left).
  held_mutant() {
    local mutant=$1 limit=$timeout id status
    [[ -z "$2" ]] || (( $2 >= limit )) || limit=$2
    id=$(jq -r .id <<< "$mutant")
    status=0
    (cd "$schema" && GANDR_MUTANT=$id timeout --kill-after=30 "$limit" "${mutants_scope[@]}" cargo nextest run --locked --package "$crate" \
      "${selectors[@]}" --no-tests=fail -E "$(jq -r .filter <<< "$mutant")") > "$output/logs/mutant-$id.log" 2>&1 || status=$?
    case $status in
      0) record "$(jq -r .key <<< "$mutant")" missed ;;
      124 | 137) (( limit != timeout )) || record "$(jq -r .key <<< "$mutant")" timeout ;;
      4 | 101) printf 'mutant %s left no outcome (exit %s); see %s\n' "$id" "$status" "$output/logs/mutant-$id.log" >&2; touch "$scratch/failed" ;;
      *) record "$(jq -r .key <<< "$mutant")" caught ;;
    esac
  }
  # A mutant out of the schema builds alone, as cargo-mutants builds it: its
  # function's mutants out of the schema form one group, and each group is
  # one cargo-mutants invocation in the lane's own tree (`$1`) that selects
  # exactly its mutants with the nextest filterset of the function's
  # witnesses. Such a mutant reads unviable when it does not build.
  alone_group() {
    local dir=$1 index=$2 group=$3 out=$output/alone/groups/$2 status selected test outcome
    local -a limit=()
    [[ -z "$4" ]] || limit=(timeout --kill-after=30 "$4")
    # `--cargo-arg` reaches the build of each mutant as well as its test
    # run; an argument after `--` reaches the test run alone.
    selected=()
    while IFS= read -r test; do selected+=("--cargo-arg=--test=$test"); done < <(jq -r '.tests[]' <<< "$group")
    if [[ $(jq -r .unit <<< "$group") == true ]]; then
      if [[ $lib == true ]]; then selected+=(--cargo-arg=--lib --cargo-arg=--bins); else selected+=(--cargo-arg=--bins); fi
    fi
    mkdir -p "$out"
    jq -r '.names[]' <<< "$group" > "$out/names.txt"
    # cargo-mutants exits 0 with every mutant caught, 2 with one missed and
    # 3 with one timed out; any other exit leaves the group to rerun.
    # `timeout` exits 124, or 137 once it kills, when `--until` stops it.
    status=0
    (cd "$dir" && "${limit[@]}" "${mutants_scope[@]}" cargo mutants --in-place --baseline skip --timeout "$timeout" \
      --test-tool nextest --jobserver-tasks 2 --package "$crate" --file "$(jq -r .file <<< "$group")" --re "$(jq -r .re <<< "$group")" \
      "${selected[@]}" --output "$out" -- -E "$(jq -r .filter <<< "$group")") > "$output/logs/alone-$index.log" 2>&1 || status=$?
    # cargo-mutants 27.1.0 skips `--re` for a struct literal's field
    # deletions, so a group keeps only the outcomes of its own mutants. A
    # stopped group's outcomes so far count.
    for outcome in caught missed timeout unviable; do
      [[ ! -f "$out/mutants.out/$outcome.txt" ]] || awk -F'\t' -v outcome="$outcome" \
        'FILENAME == ARGV[1] { key[$1] = $2; next } FILENAME == ARGV[2] { mine[$0] = 1; next } ($0 in mine) && ($0 in key) { print key[$0] "\t" outcome }' \
        "$output/alone/keys.tsv" "$out/names.txt" "$out/mutants.out/$outcome.txt"
    done | while IFS=$'\t' read -r key outcome; do record "$key" "$outcome"; done
    if [[ ! -f "$out/mutants.out/outcomes.json" ]] || (( status != 0 && status != 2 && status != 3 )); then
      if (( ${#limit[@]} > 0 && (status == 124 || status == 137) )); then
        printf 'group %s (%s) stopped at --until; its other mutants wait for the next run\n' "$index" "$(jq -r .item <<< "$group")" >&2
      else
        printf 'group %s (%s) left no outcomes; see %s\n' "$index" "$(jq -r .item <<< "$group")" "$output/logs/alone-$index.log" >&2
        touch "$scratch/failed"
      fi
    fi
  }
  run_lane() {
    local lane=$1 item=0 work left=
    while IFS= read -r work; do
      item=$((item + 1))
      mkdir "$scratch/claims/$item" 2> /dev/null || continue
      if [[ -n "$until" ]]; then
        left=$((until - (SECONDS - started)))
        (( left > 0 )) || break
      fi
      if [[ $(jq -r 'has("held")' <<< "$work") == true ]]; then
        held_mutant "$(jq -c .held <<< "$work")" "$left"
      else
        until [[ -e "$scratch/$lane.ready" ]]; do sleep 1; done
        alone_group "$scratch/$lane" "$(jq -r .index <<< "$work")" "$(jq -c .group <<< "$work")" "$left"
      fi
    done < "$output/work.jsonl"
  }
  for (( lane = 0; lane < lanes; lane++ )); do run_lane "$lane" & done
  wait
  [[ ! -e "$scratch/failed" ]] || exit 1
fi
for outcome in caught missed timeout unviable waiting; do : > "$output/$outcome.txt"; done
jq -r '.[] | [.key, .name] | @tsv' "$output/keyed.json" | while IFS=$'\t' read -r key name; do
  if [[ -f "$output/outcomes/$key" ]]; then printf '%s\n' "$name" >> "$output/$(< "$output/outcomes/$key").txt"; else printf '%s\n' "$name" >> "$output/waiting.txt"; fi
done
for outcome in caught missed timeout unviable waiting; do sort -o "$output/$outcome.txt" "$output/$outcome.txt"; done
waiting=$(wc -l < "$output/waiting.txt" | tr -d ' ')
# A run keeps only the outcomes under its own keys, so the store holds one
# outcome for each mutant that it lists at most.
comm -23 <(for entry in "$output"/outcomes/*; do [[ ! -f "$entry" ]] || printf '%s\n' "${entry##*/}"; done | sort) \
  <(jq -r '.[].key' "$output/keyed.json" | sort) | while IFS= read -r key; do rm -f "$output/outcomes/$key"; done
if [[ "$iterate" == true ]]; then
  sort -u -o "$output/iterate/settled.txt" "$output/iterate/settled.txt" "$output/caught.txt" "$output/unviable.txt"
  if (( waiting == 0 )); then
    : > "$output/iterate/tried.txt"
    touch "$output/iterate/passed"
  else
    sort -u -o "$output/iterate/tried.txt" "$output/iterate/tried.txt" "$output/missed.txt" "$output/timeout.txt"
    rm -f "$output/iterate/passed"
  fi
fi
carried=
[[ "$iterate" != true ]] || carried=" $((listed - $(jq length "$output/list.json"))) mutants settled or tried earlier."
carried+=" $(( $(jq length "$output/keyed.json") - $(jq length "$output/pending.json") )) read by their keys. One schema build held $held after $rounds check round(s), and $alone built alone."
(( waiting == 0 )) || carried+=" $waiting mutant(s) wait for the next run."
count() { wc -l < "$output/$1.txt" | tr -d ' '; }
printf '%s witnessed: %s mutants. %s groups. %s with a witness. Caught %s. Missed %s. Unwitnessed %s. Timeout %s. Unviable %s.%s Wall time %ss.\n' \
  "$crate" "$(jq length "$output/list.json")" "$(jq length "$output/groups.json")" "$(jq length "$output/keyed.json")" \
  "$(count caught)" "$(count missed)" "$(count unwitnessed)" "$(count timeout)" "$(count unviable)" "$carried" "$((SECONDS - started))" \
  | tee "$output/summary.txt"
{% endraw %}
'''

# The static witness gap for one crate. This task reads existing rustdoc JSON.
# It exits 2 when that JSON is absent. It lists cargo-mutants once and starts
# no build or test. `ci:mutants-landed --unwitnessed` files its result.
["mutants:unwitnessed"]
description = "List one crate's mutants whose functions have no witness"
tools."cargo:cargo-mutants" = "27.1.0"
tools.jq = "1.8.1"
usage = '''
flag "-p --package <crate>" required=#true help="the crate to list"
flag "--no-wait" help="refuse at once when another mutants run holds the host"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
crate=${usage_package:?}
[[ ${usage_no_wait:-false} != true ]] || export MUTANTS_NO_WAIT=1
output=${MUTANTS_OUTPUT:-mutants.out/$crate/unwitnessed}
source .config/mise/mutants.bash
hold_mutants_lock "mise run mutants:unwitnessed -- -p $crate"
mkdir -p "$output"
output=$(cd "$output" && pwd)
find "$output" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
mutants_listed "$crate" "$output"
mutants_grouped "$output"
listed=$(jq length "$output/list.json")
unwitnessed=$(wc -l < "$output/unwitnessed.txt" | tr -d ' ')
printf '%s unwitnessed: %s of %s mutants name no witness. No builds run.\n' "$crate" "$unwitnessed" "$listed" \
  | tee "$output/summary.txt"
{% endraw %}
'''

# The mutants of one change (#1456, lever 2). The diff starts at HEAD's base.
# Each crate whose Rust sources the diff touches runs `mutants:witnessed
# --in-diff` when it has a mutant on an added line. A function outside the diff
# adds no mutant. `mutants.out/changed/<crate>` or `MUTANTS_OUTPUT` has one
# `report.md`. It gives each crate's count line and each tested survivor.
# A survivor is `missed` or `timeout`. `unwitnessed.txt` names static gaps.
# `survivors.txt` lists the survivors. The task exits zero with survivors.
# A restart over the same change reads each outcome by its key.
#
# The rustdoc JSON the listing reads is built once, for every crate.
# `--until` bounds the run's wall time from the task's start, that build
# included: each crate runs under what is left of it, and a crate the budget
# never reaches runs nothing. The report names every mutant the budget left
# untested, under its crate and collapsed, and counts them in its last line;
# `unreached.txt` lists them. An untested mutant is not a survivor.
# `--seed-target` passes through to each crate's lanes.
["mutants:changed"]
description = "Mutation-test the lines a change adds, each mutant under the witnesses of its function"
tools."cargo:cargo-mutants" = "27.1.0"
tools.jq = "1.8.1"
usage = '''
flag "--base <ref>" help="the branch the change is read against; the trunk of .config/pr-stack/trunk.bash when absent"
flag "--lanes <count>" default="4" help="the mutants that test at once over the schema's build, and the workspace copies whose groups build alone"
flag "--timeout <seconds>" default="300" help="the longest a mutant's witnesses may run"
flag "--until <seconds>" help="the run's wall-time budget, from the task's start"
flag "--seed-target <dir>" help="copy this built target directory into the schema's tree and each lane, which build in their copies"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
started=$SECONDS
until=${usage_until:-}
[[ -z "$until" || "$until" =~ ^[1-9][0-9]*$ ]] || { echo '--until takes a positive count of seconds' >&2; exit 2; }
seed=()
[[ -z "${usage_seed_target:-}" ]] || seed=(--seed-target "$usage_seed_target")
source .config/pr-stack/trunk.bash
base=${usage_base:-origin/$trunk}
output=${MUTANTS_OUTPUT:-mutants.out/changed}
source .config/mise/mutants.bash
fork=$(git merge-base "$base" HEAD) || { printf 'HEAD shares no history with %s\n' "$base" >&2; exit 2; }
mkdir -p "$output"
find "$output" -mindepth 1 -maxdepth 1 -type f -delete
git diff --no-ext-diff --no-color "$fork" HEAD -- '*.rs' > "$output/change.diff"
git diff --name-only "$fork" HEAD -- '*.rs' > "$output/files.txt"
mapfile -t crates < <(cargo metadata --locked --no-deps --format-version 1 | jq -r --rawfile files "$output/files.txt" '
  .workspace_root as $root
  | [.packages[] | {name, dir: (.manifest_path | rtrimstr("Cargo.toml") | ltrimstr($root + "/"))}] as $packages
  | [$files | split("\n")[] | select(. != "") as $file
      | [$packages[] | select(.dir as $dir | $file | startswith($dir))] | max_by(.dir | length) | .name // empty]
  | unique[]')
for dir in "$output"/*/; do
  [[ -d "$dir" ]] || continue
  name=${dir%/}
  name=${name##*/}
  printf '%s\n' "${crates[@]}" | grep -Fxq -- "$name" || rm -rf "$dir"
done
: > "$output/survivors.txt"
: > "$output/unreached.txt"
{
  printf '## Mutants of the change\n\n'
  printf 'Against `%s` · the lines the change adds in %s crate(s) with Rust sources changed.\n' "$(git rev-parse --short "$fork")" "${#crates[@]}"
} > "$output/report.md"
# Names the mutants `$1` the budget left untested in the report, collapsed
# under a summary counting them, and lists them.
untested() {
  [[ -s "$1" ]] || return 0
  local count noun=mutants
  count=$(wc -l < "$1" | tr -d ' ')
  (( count != 1 )) || noun=mutant
  printf '\n<details><summary>%s %s not reached within the %ss budget — untested</summary>\n\n' "$count" "$noun" "$until"
  sed 's/^/- /' "$1"
  printf '\n</details>\n'
  cat "$1" >> "$output/unreached.txt"
}
documented=false
for crate in "${crates[@]}"; do
  cargo mutants --list --json --package "$crate" --in-diff "$output/change.diff" | jq -r '.[].name' > "$output/$crate.listed"
  if [[ ! -s "$output/$crate.listed" ]]; then
    printf '\n### %s\n\nNo mutant on an added line.\n' "$crate" >> "$output/report.md"
    continue
  fi
  if [[ "$documented" == false ]]; then
    mise run evidence:rustdoc
    documented=true
  fi
  limit=()
  if [[ -n "$until" ]]; then
    left=$((until - (SECONDS - started)))
    if (( left <= 0 )); then
      { printf '\n### %s\n' "$crate"; untested "$output/$crate.listed"; } >> "$output/report.md"
      continue
    fi
    limit=(--until "$left")
  fi
  MUTANTS_OUTPUT="$output/$crate" mise run --skip-deps mutants:witnessed -- --package "$crate" \
    --lanes "${usage_lanes:-4}" --timeout "${usage_timeout:-300}" --in-diff "$output/change.diff" "${limit[@]}" "${seed[@]}"
  out=$output/$crate
  {
    printf '\n### %s\n\n%s\n' "$crate" "$(< "$out/summary.txt")"
    mutants_survivors "$out" || printf '\nEvery mutant on an added line it tested is caught or unviable.\n'
    untested "$out/waiting.txt"
  } >> "$output/report.md"
  cat "$out/missed.txt" "$out/timeout.txt" >> "$output/survivors.txt"
done
printf '\n%s survivor(s)' "$(wc -l < "$output/survivors.txt" | tr -d ' ')" >> "$output/report.md"
if [[ -s "$output/unreached.txt" ]]; then
  printf '; %s mutant(s) not reached within the %ss budget' "$(wc -l < "$output/unreached.txt" | tr -d ' ')" "$until" >> "$output/report.md"
fi
printf '.\n' >> "$output/report.md"
cat "$output/report.md"
{% endraw %}
'''

# The night's mutation run (#1456, lever 3): one crate a night, taken in a
# fixed rotation over the workspace's crates by name, under
# `mutants:witnessed --iterate --until`. A night tests what fits its budget
# and stops. The crate stays the night's until a run ends its pass, and the
# next night takes the next crate, wrapping at the last. A large crate is
# therefore cut into as many nights as its cost needs, and no night runs
# longer. Each crate's outcomes stay in `mutants.out/nightly/<crate>` (or
# under `MUTANTS_OUTPUT`), the rotation's place in `cursor`. A crate's next
# pass lists only what the earlier ones did not settle: its new mutants and
# its survivors. `--until` counts from the task's own start, so the
# rustdoc build the listing reads comes out of the night's budget.
# `--package` runs one crate and leaves the rotation where it is. The night's
# report, `report.md`, gives the crate's count line and every survivor of
# the night with its verdict, as `mutants:changed` gives them. The task exits
# 0 whatever survives.
["mutants:nightly"]
description = "Mutation-test the night's crate where the rotation and the last night left it"
tools."cargo:cargo-mutants" = "27.1.0"
tools.jq = "1.8.1"
usage = '''
flag "--until <seconds>" required=#true help="the night's wall-time budget, from the task's start"
flag "--lanes <count>" default="1" help="the mutants that test at once over the schema's build, and the workspace copies whose groups build alone"
flag "--timeout <seconds>" default="300" help="the longest a mutant's witnesses may run"
flag "--package <crate>" help="mutate this crate and leave the rotation where it is"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
export LC_ALL=C
started=$SECONDS
until=${usage_until:?}
[[ "$until" =~ ^[1-9][0-9]*$ ]] || { echo '--until takes a positive count of seconds' >&2; exit 2; }
state=${MUTANTS_OUTPUT:-mutants.out/nightly}
source .config/mise/mutants.bash
mkdir -p "$state"
mapfile -t crates < <(cargo metadata --locked --no-deps --format-version 1 \
  | jq -r '.packages[] | select(any(.targets[]; .kind | index("lib") or index("bin"))) | .name' | sort)
if [[ -n "${usage_package:-}" ]]; then
  crate=$usage_package
else
  cursor=$(cat "$state/cursor" 2> /dev/null || true)
  crate=
  for name in "${crates[@]}"; do [[ "$name" != "$cursor" ]] || crate=$name; done
  if [[ -z "$crate" || -e "$state/$crate/iterate/passed" ]]; then
    crate=${crates[0]}
    for name in "${crates[@]}"; do
      if [[ "$name" > "$cursor" ]]; then crate=$name; break; fi
    done
  fi
  printf '%s\n' "$crate" > "$state/cursor"
fi
printf '%s\n' "$crate" > "$state/crate"
mise run evidence:rustdoc
left=$((until - (SECONDS - started)))
if (( left <= 0 )); then
  printf 'the documentation build spent the night'"'"'s %ss before %s could start\n' "$until" "$crate" >&2
  exit 1
fi
MUTANTS_OUTPUT="$state/$crate" mise run --skip-deps mutants:witnessed -- --package "$crate" \
  --lanes "${usage_lanes:-1}" --timeout "${usage_timeout:-300}" --iterate --until "$left"
out=$state/$crate
{
  printf '## Mutants of the night\n\n'
  if [[ -e "$out/iterate/passed" ]]; then
    printf '`%s` · this night ends its pass; the next night takes the next crate.\n\n' "$crate"
  else
    printf '`%s` · its pass goes on the next night.\n\n' "$crate"
  fi
  printf '%s\n' "$(< "$out/summary.txt")"
  mutants_survivors "$out" || printf '\nNo mutant the night tested survives.\n'
} > "$state/report.md"
cat "$state/report.md"
if [[ ${MUTANTS_CAMPAIGN:-} == 1 ]]; then
  mkdir -p ledger/mutants
  cp "$out/iterate/settled.txt" "ledger/mutants/$crate.txt"
  cat "$out/missed.txt" "$out/timeout.txt" | sort -u > "$out/survivors.txt"
  GH_REPO="${GH_REPO:-gandr-lang/gandr}" mise run ci:mutants-landed -- --package "$crate" --campaign "$out/survivors.txt"
fi
{% endraw %}
'''

["mutants:campaign"]
description = "Run one bounded mutation campaign on the dedicated host"
usage = '''
flag "--until <seconds>" required=#true help="the campaign's wall-time budget"
flag "--lanes <count>" required=#true help="the mutants or groups that run at once within the host memory budget"
flag "--timeout <seconds>" default="300" help="the longest a mutant's witnesses may run"
flag "--package <crate>" help="mutate this crate and leave the rotation where it is"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
state=${XDG_STATE_HOME:-"$HOME/.local/state"}/gandr-mutants
arguments=(--until "${usage_until:?}" --lanes "${usage_lanes:?}" --timeout "${usage_timeout:-300}")
if [[ -n "${usage_package:-}" ]]; then arguments+=(--package "$usage_package"); fi
MUTANTS_CAMPAIGN=1 MUTANTS_OUTPUT="$state" mise run mutants:nightly -- "${arguments[@]}"
'''
