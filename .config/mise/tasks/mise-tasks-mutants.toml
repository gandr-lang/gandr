#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The mutation lane: cargo-mutants over one crate with the settings its
# campaign measured. Every mutant relinks the crate's test binaries, so the
# host's own target rustflags, which may name a memory-hungry linker, give
# way to `-Ctarget-cpu=native` alone for the host triple. Four mutants build
# at once under a jobserver of eight tasks; nextest runs each one's tests.
# A whole crate takes hours, which is why a witness batch reruns only the
# survivors it answers (`mutants:named`). Further arguments pass through to
# cargo-mutants (`--shard k/n`, `--list`, `--timeout`). Outcomes land in
# `mutants.out/<crate>`, or in `MUTANTS_OUTPUT` when set. One run holds the
# host at a time, in a scope of its own whose memory is capped
# (`.config/mise/mutants.bash`). The release ships no Apple-silicon binary,
# so the pin stays `cargo:` (binstall fetches the rest).
["mutants"]
description = "Mutation-test one crate with the campaign's measured settings"
tools."cargo:cargo-mutants" = "27.1.0"
env.NEXTEST_TEST_THREADS = "8"
run = '''
#!/usr/bin/env bash
set -euo pipefail
crate=
previous=
for argument in "$@"; do
  case "$previous" in
    -p | --package) crate=$argument ;;
  esac
  case "$argument" in
    --package=*) crate=${argument#--package=} ;;
  esac
  previous=$argument
done
if [[ -z "$crate" ]]; then
  echo 'usage: mise run mutants -- -p <crate> [cargo-mutants arguments]' >&2
  exit 2
fi
host=$(rustc -vV | sed -n 's/^host: //p')
triple=$(tr '[:lower:]-' '[:upper:]_' <<< "$host")
export "CARGO_TARGET_${triple}_RUSTFLAGS=-Ctarget-cpu=native"
output=${MUTANTS_OUTPUT:-mutants.out/$crate}
mkdir -p "$output"
source .config/mise/mutants.bash
hold_mutants_lock "mise run mutants -- $*"
exec "${mutants_scope[@]}" cargo mutants --test-tool nextest -j 4 --jobserver-tasks 8 --output "$output" "$@"
'''

# The survivors a witness batch answers, rerun alone: each `file:function`
# names a source file, relative to the crate's `src/` or to the workspace,
# and a function in it, bare or with its impl path (`converge`,
# `Replay::settle`). The files narrow the run with `--file` and the
# functions with one `--re` over the mutant names: an operator mutant ends
# in the function it sits in (`replace == with != in Edit<'_>::verdict`), a
# replaced body starts with it (`replace Edit<'_>::verdict -> … with Ok(())`;
# #745). The trust path's crates are checked this way after each batch
# lands. Outcomes land in `mutants.out/<crate>/named`.
["mutants:named"]
description = "Rerun only the named survivors of one crate under the measured settings"
tools.jq = "1.8.1"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
crate=
named=()
while (( $# > 0 )); do
  case "$1" in
    -p | --package) crate=${2:-}; shift 2 ;;
    --package=*) crate=${1#--package=}; shift ;;
    *) named+=("$1"); shift ;;
  esac
done
if [[ -z "$crate" || ${#named[@]} == 0 ]]; then
  echo 'usage: mise run mutants:named -- -p <crate> <file:function>...' >&2
  exit 2
fi
root=$(cargo metadata --locked --no-deps --format-version 1 | jq -r --arg crate "$crate" \
  '.workspace_root as $workspace | .packages[] | select(.name == $crate) | .manifest_path | rtrimstr("/Cargo.toml") | ltrimstr($workspace + "/")')
if [[ -z "$root" ]]; then
  printf 'no workspace crate named %s\n' "$crate" >&2
  exit 2
fi
files=()
functions=
for entry in "${named[@]}"; do
  file=${entry%%:*}
  function=${entry#*:}
  if [[ "$file" == "$entry" || -z "$function" ]]; then
    printf 'expected <file:function>, got %s\n' "$entry" >&2
    exit 2
  fi
  if [[ ! -f "$file" ]]; then file="$root/src/$file"; fi
  if [[ ! -f "$file" ]]; then
    printf 'no source file %s in %s\n' "${entry%%:*}" "$crate" >&2
    exit 2
  fi
  files+=(--file "$file")
  functions+="${functions:+|}$function"
done
MUTANTS_OUTPUT="mutants.out/$crate/named" exec mise run mutants -- -p "$crate" \
  "${files[@]}" --re "( in |: replace )(.*::)?($functions)( -> .*| with .*)?\$"
{% endraw %}
'''

# Each mutant under the tests that name its function (#1456). The whole-crate
# run tests every mutant against the crate's whole suite, so a mutant an
# unrelated corpus sweep catches reads caught and costs the sweep's time; here
# a mutant is caught only when a witness of its function fails. The index is
# the obligations report's: each function's `- witness:` bullets in the
# crate's rustdoc JSON (`.config/mutants/items.jq`). The mutants group by
# function (`.config/mutants/groups.jq`), and each group runs as one
# cargo-mutants invocation selecting exactly its mutants, with the nextest
# filterset of the function's witnesses. A function no witness names runs
# nothing: its mutants read missed at once and are listed again in
# `unwitnessed.txt`, the gap the coverage lane fills.
#
# The witnesses run under nextest's `mutants` profile, which ends none of
# them, so a slow witness on a loaded machine reads timeout, never caught.
# The groups run across `--lanes` detached worktrees of the repository, with
# the working tree laid over each, in place, each lane keeping its own target
# directory warm from one group to the next. The witnesses run once
# unmutated first, in a lane, so a witness that fails there stops the run
# instead of reading every mutant caught.
# The run holds the host's mutants lock as `mutants` does, and each group's
# cargo-mutants runs in its own capped scope (`.config/mise/mutants.bash`).
# Outcomes land in `mutants.out/<crate>/witnessed` (or `MUTANTS_OUTPUT`):
# cargo-mutants' `caught`, `missed`, `timeout` and `unviable` lists, merged,
# `unwitnessed.txt`, each group's log under `logs/`, and a summary line with
# the wall time. The whole-suite `mutants` stays the way to map a crate first.
["mutants:witnessed"]
description = "Mutation-test one crate, each mutant under the witnesses of its function"
depends = ["evidence:rustdoc"]
tools."cargo:cargo-mutants" = "27.1.0"
tools.jq = "1.8.1"
env.NEXTEST_TEST_THREADS = "2"
env.NEXTEST_PROFILE = "mutants"
usage = '''
flag "-p --package <crate>" required=#true help="the crate to mutate"
flag "--lanes <count>" default="4" help="workspace copies whose groups build and test at once"
flag "--timeout <seconds>" default="300" help="the longest a mutant's witnesses may run"
'''
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
crate=${usage_package:?}
lanes=${usage_lanes:-4}
timeout=${usage_timeout:-300}
[[ "$lanes" =~ ^[1-9][0-9]*$ ]] || { echo '--lanes takes a positive count' >&2; exit 2; }
[[ "$timeout" =~ ^[1-9][0-9]*$ ]] || { echo '--timeout takes a positive count of seconds' >&2; exit 2; }
package=$(cargo metadata --locked --no-deps --format-version 1 | jq -c --arg crate "$crate" '.packages[] | select(.name == $crate)')
if [[ -z "$package" ]]; then
  printf 'no workspace crate named %s\n' "$crate" >&2
  exit 2
fi
documented=$(jq -r '[.targets[] | select(.kind | index("lib") or index("bin"))] | first | .name // empty | gsub("-"; "_")' <<< "$package")
targets=$(jq -c '[.targets[] | select(.kind | index("test")) | .name]' <<< "$package")
doc=target/evidence/doc/$documented.json
[[ -f "$doc" ]] || { printf 'no rustdoc JSON for %s at %s\n' "$crate" "$doc" >&2; exit 2; }
host=$(rustc -vV | sed -n 's/^host: //p')
triple=$(tr '[:lower:]-' '[:upper:]_' <<< "$host")
export "CARGO_TARGET_${triple}_RUSTFLAGS=-Ctarget-cpu=native"
output=${MUTANTS_OUTPUT:-mutants.out/$crate/witnessed}
source .config/mise/mutants.bash
hold_mutants_lock "mise run mutants:witnessed -- -p $crate"
scope=${mutants_scope[0]}
rm -rf "$output"
mkdir -p "$output/logs"
started=$SECONDS
"$scope" cargo mutants --list --json --package "$crate" > "$output/list.json"
jq -f .config/mutants/items.jq "$doc" > "$output/items.json"
jq -n --slurpfile mutants "$output/list.json" --slurpfile items "$output/items.json" \
  --arg package "$crate" --argjson targets "$targets" \
  '{mutants: $mutants[0], items: $items[0], package: $package, targets: $targets}' \
  | jq -f .config/mutants/groups.jq > "$output/groups.json"
jq -r '.[] | select(.filter == null) | .names[]' "$output/groups.json" > "$output/unwitnessed.txt"
witnessed=$(jq -c '[.[] | select(.filter != null)]' "$output/groups.json")
if [[ $(jq length <<< "$witnessed") != 0 ]]; then
  # Each lane is a detached worktree of this repository at HEAD with the
  # working tree's files laid over it: some witnesses read the history
  # (`git merge-base origin/main HEAD`), which a bare copy has not got.
  scratch=$(mktemp -d)
  trap 'for lane in "$scratch"/[0-9]*; do git worktree remove --force "$lane" 2> /dev/null || true; done; rm -rf "$scratch"; git worktree prune' EXIT
  for (( lane = 0; lane < lanes; lane++ )); do
    git worktree add --quiet --detach "$scratch/$lane" HEAD
    git ls-files -z --cached --others --exclude-standard | tar --null --ignore-failed-read -T - -cf - | tar -xf - -C "$scratch/$lane"
  done
  # One unmutated run of every witness, in a lane as the mutants will run:
  # a witness that fails there, or names no test, would read each of its
  # function's mutants caught.
  union=$(jq -r '[.[].filter | sub("^package\\(=[^)]*\\) & "; "")] | unique | join(" | ")' <<< "$witnessed")
  (cd "$scratch/0" && "$scope" cargo nextest run --locked --package "$crate" --no-tests=fail -E "package(=$crate) & ($union)") > "$output/logs/witnesses.log" 2>&1 \
    || { printf 'the witnesses fail unmutated; see %s\n' "$output/logs/witnesses.log" >&2; exit 1; }
  run_lane() {
    local lane=$1 index=0 group file re filter out
    while IFS= read -r group; do
      if (( index % lanes == lane )); then
        file=$(jq -r .file <<< "$group")
        re=$(jq -r .re <<< "$group")
        filter=$(jq -r .filter <<< "$group")
        out=$scratch/out/$index
        mkdir -p "$out"
        jq -r '.names[]' <<< "$group" > "$out/names.txt"
        (cd "$scratch/$lane" && "${mutants_scope[@]}" cargo mutants --in-place --baseline skip --timeout "$timeout" \
          --test-tool nextest --jobserver-tasks 2 --package "$crate" --file "$file" --re "$re" \
          --output "$out" -- -E "$filter") > "$output/logs/$index.log" 2>&1 || true
        if [[ ! -f "$out/mutants.out/outcomes.json" ]]; then
          printf 'group %s (%s) left no outcomes; see %s\n' "$index" "$(jq -r .item <<< "$group")" "$output/logs/$index.log" >&2
          touch "$scratch/failed"
        fi
      fi
      index=$((index + 1))
    done < <(jq -c '.[]' <<< "$witnessed")
  }
  for (( lane = 0; lane < lanes; lane++ )); do run_lane "$lane" & done
  wait
  [[ ! -e "$scratch/failed" ]] || exit 1
  # cargo-mutants 27.1.0 skips `--re` for a struct literal's field deletions,
  # so every group in their file runs them too: each group keeps only the
  # outcomes of its own mutants.
  for outcome in caught missed timeout unviable; do
    for out in "$scratch"/out/*; do
      [[ ! -f "$out/mutants.out/$outcome.txt" ]] || grep -Fx -f "$out/names.txt" "$out/mutants.out/$outcome.txt" || true
    done | sort > "$output/$outcome.txt"
  done
else
  for outcome in caught missed timeout unviable; do : > "$output/$outcome.txt"; done
fi
sort -o "$output/missed.txt" "$output/missed.txt" "$output/unwitnessed.txt"
count() { wc -l < "$output/$1.txt" | tr -d ' '; }
printf '%s witnessed: %s mutants in %s groups, %s with a witness; caught %s, missed %s (%s unwitnessed), timeout %s, unviable %s; %ss\n' \
  "$crate" "$(jq length "$output/list.json")" "$(jq length "$output/groups.json")" "$(jq length <<< "$witnessed")" \
  "$(count caught)" "$(count missed)" "$(count unwitnessed)" "$(count timeout)" "$(count unviable)" "$((SECONDS - started))" \
  | tee "$output/summary.txt"
{% endraw %}
'''
