#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The features ledger (`ledger/README.md`). `ledger/features.sql` is tracked;
# `ledger/features.db` is built from it and ignored. The `feature` table is
# `WITHOUT ROWID`, so `.dump` writes its rows in primary-key order: the dump
# depends on the rows, never on the order they were written in, and two
# branches adding rows touch different lines. `check:ledger` in
# `mise-tasks-check.toml` holds the round trip and the paths.

["ledger:build"]
description = "Build ledger/features.db from the tracked dump ledger/features.sql"
# Built beside the target and moved over it, so a refused row leaves the
# previous database in place.
run = '''
set -eu
rm -f ledger/features.db.new
sqlite3 -bail ledger/features.db.new < ledger/features.sql
mv ledger/features.db.new ledger/features.db
'''

["ledger:dump"]
description = "Dump ledger/features.db to the tracked ledger/features.sql, rows in id order"
run = "sqlite3 ledger/features.db .dump > ledger/features.sql"

# The crate map (#2290): `ledger/crates.dot` and the category graph between
# `crates/README.md`'s markers, generated from `cargo metadata` and the sites
# of `ledger/concerns.sql` by `.config/crate-map/map.jq`. `check:crate-map`
# in `mise-tasks-check.toml` holds their currency, the layering and the
# concerns' sites.
["ledger:crate-map"]
description = "Generate ledger/crates.dot and crates/README.md's category map from cargo metadata and the concerns"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
metadata=$(cargo metadata --locked --no-deps --format-version 1)
sites=$(sqlite3 -json :memory: '.read ledger/concerns.sql' 'SELECT DISTINCT concern, crate FROM site ORDER BY concern, crate;')
map() { jq "$1" --arg form "$2" --rawfile readme crates/README.md --argjson concerns "${sites:-[]}" -f .config/crate-map/map.jq <<< "$metadata"; }
map -r dot > ledger/crates.dot.new
map -j readme > crates/README.md.new
mv ledger/crates.dot.new ledger/crates.dot
mv crates/README.md.new crates/README.md
'''

# The concerns ledger, `ledger/concerns.sql`, is edited by hand: an `INSERT`
# added or changed. This task rewrites it as `sqlite3`'s own dump, rows in
# key order, refusing a row that breaks a constraint and leaving the file as
# it was. `check:crate-map` holds the round trip.
["ledger:concerns"]
description = "Normalize ledger/concerns.sql as its own sqlite3 dump"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fresh=$(mktemp -d)
trap 'rm -rf "$fresh"' EXIT
sqlite3 -bail "$fresh/concerns.db" < ledger/concerns.sql
sqlite3 "$fresh/concerns.db" .dump > ledger/concerns.sql
'''

# The purposes ledger, `ledger/purposes.sql`, is edited by hand: an `INSERT`
# added or changed. This task rewrites it as `sqlite3`'s own dump, rows in
# key order, refusing a row that breaks a constraint and leaving the file as
# it was. `check:purposes` holds the round trip.
["ledger:purposes"]
description = "Normalize ledger/purposes.sql as its own sqlite3 dump"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fresh=$(mktemp -d)
trap 'rm -rf "$fresh"' EXIT
sqlite3 -bail "$fresh/purposes.db" < ledger/purposes.sql
sqlite3 "$fresh/purposes.db" .dump > ledger/purposes.sql
'''

# The entries the purposes ledger rows: each named crate's library documented
# as rustdoc JSON without private items, each read by
# `.config/purposes/items.jq`, one tab-separated line per entry: crate, path,
# kind, location. With no crate named, every crate with a library; a name
# with no library under `crates/` prints nothing. The JSON builds in a target
# directory of its own, so `check:doc`'s HTML and `evidence:rustdoc`'s JSON,
# both with private items, are not rebuilt under its flags.
["purposes:items"]
description = "Print the public items, modules and crate root of each named crate's library"
tools.jq = "1.8.1"
usage = '''
arg "[crate]..." help="crate directories under crates/; every crate with a library when none is named" var=#true
'''
env.RUSTDOCFLAGS = "-Z unstable-options --output-format json"
env.CARGO_TARGET_DIR = "{{ config_root }}/target/purposes"
run = '''
{% raw %}#!/usr/bin/env bash
set -euo pipefail
read -ra named <<< "${usage_crate:-}"
selected=()
packages=()
while IFS=$'\t' read -r crate package library; do
  if (( ${#named[@]} == 0 )) || [[ " ${named[*]} " == *" $crate "* ]]; then
    selected+=("$crate:$library")
    packages+=(--package "$package")
  fi
done < <(cargo metadata --locked --no-deps --format-version 1 | jq -r '
  (.workspace_root + "/crates/") as $crates
  | .packages[]
  | select(.manifest_path | startswith($crates))
  | (.manifest_path | ltrimstr($crates) | split("/")[0]) as $crate
  | .name as $package
  | .targets[]
  | select(any(.kind[]; . == "lib"))
  | [$crate, $package, (.name | gsub("-"; "_"))]
  | @tsv')
(( ${#selected[@]} )) || exit 0
.config/mise/scope cargo doc --locked --no-deps --lib --quiet "${packages[@]}"
for entry in "${selected[@]}"; do
  jq -r --arg crate "${entry%%:*}" -f .config/purposes/items.jq "$CARGO_TARGET_DIR/doc/${entry#*:}.json"
done
{% endraw %}'''

# Each entry of the named crate, or of every crate with a library, beside its
# row of `ledger/purposes.sql`: one tab-separated line per entry under a
# header, `no row` in the purpose column of an entry the ledger lacks.
["purposes:list"]
description = "List a crate's public items, modules and root beside their purposes"
usage = '''
arg "[crate]" help="the crate's directory under crates/; every crate with a library when omitted"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
fresh=$(mktemp -d)
trap 'rm -rf "$fresh"' EXIT
mise run --quiet purposes:items ${usage_crate:+"$usage_crate"} > "$fresh/entries.tsv"
if [[ ! -s $fresh/entries.tsv ]]; then
  echo "${usage_crate:-}: no crate under crates/ with that directory has a library" >&2
  exit 1
fi
db="$fresh/purposes.db"
sqlite3 -bail "$db" < ledger/purposes.sql
sqlite3 -bail -tabs "$db" 'CREATE TABLE entry(crate TEXT, path TEXT, kind TEXT, location TEXT);' ".import $fresh/entries.tsv entry"
sqlite3 -bail -header -separator $'\t' "$db" "
  SELECT e.crate, e.path, e.kind, e.location,
    coalesce(p.purpose, 'no row') AS purpose, p.concerns, p.naming, p.doc, p.finding
  FROM entry e LEFT JOIN purpose p USING (crate, path, kind)
  ORDER BY e.crate, e.path, e.kind;"
'''

# The recovery sweep over the syntax exemplars (`gandr-surface-dispatcher`'s
# `ledger::recovery` module): every literal tile written as its near miss and
# deleted, each mutant's first error read against the mutation. The whole
# report goes to the file named, `target/recovery.txt` by default; its causes
# and its count are printed. A mutant marked elsewhere is the report's content,
# not a failure: the task fails only when the sweep cannot run. The nightly
# workflow runs it and `ci:recovery-file` files each cause.
["ledger:recovery"]
description = "Sweep the syntax exemplars for recovery: each tile missed and deleted, the first error read"
usage = '''
arg "[report]" help="the file the whole report is written to" default="target/recovery.txt"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
report={{ usage.report }}
mkdir -p "$(dirname "$report")"
status=0
.config/mise/scope cargo run --locked --quiet --profile test --package gandr-lang -- ledger recovery corpus/ledger > "$report" || status=$?
if (( status > 1 )); then
  cat "$report"
  exit "$status"
fi
grep -e '^cause: ' -e ' mutants swept: ' "$report" || true
'''
