#:tombi toml-version = "v1.0.0"

# The list of the IO census: each path of IO of Rust's `std`, of `tokio`, of
# `libc` and of `rustix`. A path is in the list when a call through it makes a
# system call, or when its type holds a resource of the system.
#
# The list is a configuration of the Clippy lints `disallowed_methods` and
# `disallowed_types`. The workspace `clippy.toml` does not hold it. A census run
# points Clippy at this directory, caps each other lint at a warning, and keeps
# only the diagnostics of the two lints:
#
#     CLIPPY_CONF_DIR=.config/census/io cargo clippy --message-format=json -- \
#       --cap-lints warn -A clippy::all -A clippy::pedantic -A clippy::nursery \
#       -A clippy::cargo -A clippy::restriction \
#       -W clippy::disallowed_methods -W clippy::disallowed_types
#
# Each diagnostic is one use: one resolved path in an item that the target
# builds. A use under a `cfg` of a different target, or of a feature that is
# off, gives no diagnostic. A call in the expansion of a macro, such as the
# `write_fmt` of `writeln!`, is a use.
#
# The `reason` of each entry is the operation of the path. The census groups
# its counts by this text. The operations are: `open`, `read`, `write`, `seek`,
# `metadata`, `directory`, `rename`, `remove`, `lock`, `spawn`, `wait`,
# `signal`, `exit`, `environment`, `clock`, `sleep`, `thread`, `socket`,
# `memory map`, `wait on an address` and `resource limit`.
#
# A method of the traits `Read`, `Write`, `Seek` and `BufRead` is one use for
# each receiver, also for a receiver in memory such as `Vec<u8>`. The lint
# reads the trait method and not the type of the receiver.
#
# A path of `tokio`, of `libc` or of `rustix` resolves only in a crate that
# links that dependency, and a path of `std::os` or of `libc` resolves only on
# its target. Thus each such entry has `allow-invalid = true`.

disallowed-types = [
