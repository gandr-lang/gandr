# The areas each lane claims from (#3736): `claim:next <lane>` walks the
# defect and refactor buckets of every area its row lists, the first area's
# first, before any other bucket. The factory's `queue-next` reads the same
# rows for each lane's defects. Each `area:` label is in the row of an active
# lane (#6218), so no defect waits for triage alone. A new lane or a new area
# is a row here. `claim:take` and `claim:release` accept a lane only when this
# table holds its row (#6639).
[lane]
floor = ["surface", "ux", "core", "analysis", "editor", "lsp", "mcp"]
spaces = ["theory", "kernel", "storage", "runtime", "distribution", "interop"]
coordinator = ["workflow", "ci"]
triage = ["workflow", "ci"]
triage-2 = ["workflow", "ci"]
surface = ["surface", "ux"]
diagnostic-help = ["surface", "ux", "core"]
# The lanes of 2026-11-10 (#6639). Their rows route no defect by themselves
# today: the factory's queue file gives none of these lanes a defects line,
# and the coordinator routes their defects by hand. The drift, mutants and
# architect lanes take no defects, so their rows list no area.
engine = ["core", "storage"]
views = ["ux", "editor", "lsp", "mcp"]
reduction = ["kernel", "theory"]
manifold = ["runtime", "distribution"]
drift = []
mutants = []
architect = []
# Retired lanes. Their rows stay: `claim:take` and the merged-branch read name
# the lane of an old branch from them.
core = ["core", "kernel"]
theory = ["theory", "kernel"]
program-logic = ["program-logic", "runtime"]
elaboration = ["elaboration", "storage"]
toolchain = ["distribution", "surface"]
references-editor = ["editor", "lsp", "surface"]
sorts = ["core", "kernel"]
cells = ["theory", "kernel"]
algebra = ["theory", "kernel"]
reals = ["theory", "kernel"]
workflow = ["workflow", "ci"]
