  { file = ".config/claims/claims.sh", scope = "-", api = "rest", identity = "actions", calls = 8, points = 4, pages = 2, measured = "rest", hour = 10, trigger = "claims.yml: a merge's run reads the claimed list, 10 on 2026-11-06, and the open pulls, one page each, and no events, about 3 requests with its releases; the two-hourly sweep reads events only for the claims whose age decides them, 16 requests on 2026-11-04" },
  { file = ".config/claims/claims.sh", scope = "unmark", api = "rest", identity = "actions", calls = 2, points = 2, measured = "rest", hour = 2, trigger = "claims.yml: each silent claim the sweep or a merge's run removes, a read of its body and the write that takes its lane's marker off; a few lapses a day" },
