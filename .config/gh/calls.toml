# The hour's ceiling of each identity on each API: a fifth of the reader's
# and the writer's 5,000 a host, the whole of a workflow token's hour, which
# no host shares, and a fifth of the integration cycle's App, whose 5,000 an
# hour no other site shares (#5440).
[budget]
read = { graphql = 1000, rest = 1000 }
write = { graphql = 1000, rest = 1000 }
actions = { graphql = 1000, rest = 1000 }
cycle = { graphql = 1000, rest = 1000 }
