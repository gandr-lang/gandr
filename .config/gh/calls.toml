# The hour's ceiling of each identity on each API: a fifth of the reader's
# and the writer's 5,000 a host, and the whole of a workflow token's hour,
# which no host shares. `cycle` holds the whole of the `gandr-lang` App
# installation's 5,000 an hour (#5440). `landing` is landing.yml's
# `LANDING_TOKEN`, a token of the writer's account, and holds a fifth of
# its 5,000, as a host does (#5695).
[budget]
read = { graphql = 1000, rest = 1000 }
write = { graphql = 1000, rest = 1000 }
actions = { graphql = 1000, rest = 1000 }
landing = { graphql = 1000, rest = 1000 }
cycle = { graphql = 5000, rest = 5000 }
