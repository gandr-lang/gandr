# The price of every `gh` call site under .config/ and .github/ (#5061).
# `check:gh-budget` reads it beside `sites.awk`'s list and refuses a site
# with no row, a row whose site is gone, a row with no measured points, and
# an identity whose hour on one API is over its ceiling (`budget.jq`).
#
# A row is one site, the file and the task, function or workflow step that
# holds the calls (`sites.awk`), for one API and one identity:
#
# - `calls`: the calls of that API and kind the site holds, as listed.
# - `points`: what one run of the site spends: GraphQL points, or REST
#   requests, a page each.
# - `pages`: for a site that gives `--paginate`, the pages its lists read
#   in one run, at the counts its trigger names with their date (#5681). A
#   list with no `per_page` reads 30 a page. `points` covers them.
# - `schedule`: for a row that a workflow's cron runs, the workflow's file
#   name or a list of them. The row then spends only in the UTC hours the
#   crons name, and a row with none spends in each hour.
# - `measured`: `cost`, the `rateLimit` cost of one call (2026-11-04, a
#   dry run); `rest`, one request a call and a page; `log`, the router's
#   call log of 2026-11-04; `free`, the `rate_limit` endpoint; `rule`, a
#   GraphQL write: one point a request, the requests counted from gh's
#   steps (a lookup, then the mutation).
# - `trigger`: what runs the site, and how often.
# - `hour`: the runs in an hour on one host at eight seats. A read through
#   `budget.bash` is shared on the host for 30 s, so one argument set runs
#   at most 120 times an hour whatever the seats.
#
# The router lets each identity make 30 GraphQL and 40 REST calls a minute
# on a host and holds a call over that, so no row can pass 1,800 GraphQL or
# 2,400 REST calls an hour.
#
# A change that adds or changes a call site states its row's numbers under
# `## API budget` in its pull request (`pr:open`).

