# The citation window: `check:references` refuses a work the crates or the
# corpus cite that appeared before `cutoff`, unless an entry here covers its
# site. The cutoff is a fixed year. A ruling moves it forward, in one change
# that allows whatever the move newly refuses.
#
# A `[[crate]]` entry covers a crate whole by its directory under `crates/`,
# and a `[[corpus]]` entry a corpus subject whole: the directory under
# `corpus/` holding the sources. A `[[site]]` entry keeps one work at one
# site: `site` is `<crate>::<module>`, the crate alone at its root, or a
# corpus source's path; `work` is the key or locator the site cites; and
# `exemplar` says why no newer work states what the site builds. A work's
# lineage alone is no reason to keep it: the newest work cites what it builds
# on. An entry that covers no citation older than the cutoff is refused.
#
# Every crate and corpus subject citing an older work starts whole. Refreshing
# a crate's citations deletes its whole entry and adds a `[[site]]` entry for
# each work it keeps.

