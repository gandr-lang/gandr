# The citation window: `check:references` refuses a work the crates or the
# corpus cite that appeared before `cutoff`, unless an entry here covers its
# site. The cutoff is a fixed year. A ruling moves it forward, in one change
# that allows whatever the move newly refuses.
#
# A `[[site]]` entry keeps one work at one site. Its `site` is
# `<crate>::<module>`, the crate alone at its root, or the path of a corpus
# source. Its `work` is the key or the locator that the site cites. Its
# `exemplar` says why no newer work states what the site builds. A work's
# lineage alone is no reason to keep it: the newest work cites what it builds
# on.
#
# An entry that covers no citation older than the cutoff is refused. The
# window has one entry for each site and each older work, so a new citation
# of an older work is refused at its site. An entry whose exemplar is
# `frozen` keeps a citation of the tree at the freeze of the window. The
# citation refresh of its site writes the reason in its place, or cites the
# newer work and deletes the entry.

cutoff = 2019

