# A borrowed `dyn Console` in a function's parameter, alone or in a tuple,
# takes `Streams`. `Streams` is the closed set of the known consoles. The run
# stage has one instance, and each operation is one match. A field keeps its
# form for the second phase.
id: borrowed-console-is-the-closed-set
language: Rust
severity: hint
message: a function takes its console as the closed set of the known consoles, not a trait object
rule:
  pattern:
    context: "fn f(console: &mut dyn $TRAIT) {}"
    selector: dynamic_type
  regex: ^dyn (?:[A-Za-z_]+::)*Console$
  inside:
    kind: reference_type
    inside:
      kind: parameter
      stopBy:
        not:
          kind: tuple_type
      inside:
        kind: parameters
fix: Streams<'_>
