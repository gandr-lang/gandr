# The codemod of the writers' and consoles' wave (#7387): each `dyn io::Write`
# and `dyn fmt::Display` behind a reference in a function's parameter takes
# `impl`, a generic of the function, and each `dyn Console` there takes
# `Streams<'_>`, the closed set of the known consoles. The compiler's errors
# that stay are the wave's second phase.
ruleDirs:
  - rules
