# consumers:
# - surface-grammar
# - surface-lsp
# - surface-render-remote (dev)
# - surface-repl
# - surface-tui
[workspace.dependencies.gandr-surface-render-remote]
path = "crates/surface-render-remote"

# The terminal face of the diagnostics model: a diagnostic laid out as a
