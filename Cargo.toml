# - surface-dispatcher
# - surface-format
# - surface-grammar (dev)
# - surface-lowering (dev)
# - surface-lsp
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-surface-parser]
path = "crates/surface-parser"

# The presentation printer: checked core types and normal-form values laid
