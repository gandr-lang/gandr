# consumers:
# - surface-corpus (dev)
# - surface-diagnostics (dev)
# - surface-dispatcher
# - surface-driver
# - surface-format
# - surface-lowering
# - surface-lsp
# - surface-parser
# - surface-pretty
# - surface-render-terminal (dev)
# - surface-repl
# - surface-session
# - surface-tui
[workspace.dependencies.gandr-surface-grammar]
path = "crates/surface-grammar"

# The document-layout engine: the sealed document arena, Pareto resolution
