# consumers:
# - surface-driver
# - surface-repl
# - surface-session (dev)
# - surface-tui
[workspace.dependencies.gandr-surface-render-terminal]
path = "crates/surface-render-terminal"

# The read-evaluate loop: the completeness gate, the session loop and its
