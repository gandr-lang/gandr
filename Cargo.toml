# - surface-diagnostics (dev)
# - surface-driver
# - surface-lsp
# - surface-render-terminal (dev)
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-surface-dispatcher]
path = "crates/surface-dispatcher"

# The source formatter: a parsed source laid out at a page width, its tokens
