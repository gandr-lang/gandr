# consumers:
# - runtime-stencils (dev)
# - surface-diagnostics
# - surface-dispatcher
# - surface-render-terminal (dev)
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-surface-corpus]
path = "crates/surface-corpus"

# The diagnostics model: refusals, unsettled declarations, goals, warnings and
