# - surface-diagnostics
# - surface-dispatcher
# - surface-format
# - surface-lsp
# - surface-render-terminal (dev)
# - surface-session
[workspace.dependencies.gandr-surface-lowering]
path = "crates/surface-lowering"

# The language server: diagnostics and semantic tokens over the Language
