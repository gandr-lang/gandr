[workspace]
resolver = "3"
# Each directory of the crates folder is a member. A directory with no
# manifest stops each cargo command. A checkout can keep such a directory
# after a crate leaves the tree. Remove it, or add it to `exclude`.
members = ["crates/*"]
# The reader links rustc's own libraries, which the `rustc-dev` component
# supplies and which no other crate links. So it builds in a workspace of its
# own, under `check:rust-record`, and no build of this workspace needs the
# component.
exclude = ["crates/runtime-rust-reader"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor is Rust 1.100.0, for its custom allocators and its never type
# (#7382).
rust-version = "1.100"
repository = "https://github.com/gandr-lang/gandr"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

# One table per dependency: what it is, and `# features:` with the need behind
# each enabled feature. The default features are always off. A feature is on
# only because a build or a test failed without it. `cargo tree --invert
# <package> --depth 1 --edges normal,build,dev --prefix none` prints the
# crates that take one.
[workspace.dependencies]

# Thread-local heap high-water measurements in the staging example, and the
# heap the edit loop keeps in the session's measurement.
# features:
# - none: the allocator counter has no optional features.
[workspace.dependencies.allocation-counter]
version = "0.8.1"
default-features = false

# Source-snippet layout: the backend the terminal renderer projects a
# diagnostic into, the one rustc and cargo render through. Defaults off: `std`
# only gives `anstyle` an `io::Write` sink, and a rendering is a `String`.
# The choice, its alternatives and its reversal are in the consumer's docs.
[workspace.dependencies.annotate-snippets]
version = "0.12.17"
default-features = false

# Executable specifications through the core-only quenchant facade, named
# `anodized`: import `anodized::spec` and write `#[spec(...)]`; the policy
# lane denies qualified specification attributes. The backend is the
# anodized fork, supporting ordinary and const functions and type refinements
# without `std` or its `logic` feature. Without an instrumentation cfg,
# predicates are type-checked but not evaluated; with the feature off, strip
# mode erases specifications and the backend entirely. The fork used
# directly lacks the facade's backend-free strip mode, and handwritten
# assertions lack its shared specification representation. Reconsider the
# facade when the backend or its supported build modes change.
# features:
# - anodized: compile the development backend; `--cfg anodized_panic` selects
#   enforcement for the whole build graph, independently of build profile.
#   The feature alone never enables enforcement.
[workspace.dependencies.anodized]
package = "quenchant-anodized"
git = "https://github.com/gandr-lang/quenchant"
rev = "666f60b58e1996e116f96cee889aba57cd189160"
default-features = false
features = ["anodized"]

# The snapshot of a store's roots that its readers load with no lock: the
# register, the one writer of the roots, swaps in a new snapshot at each
# drain, and a reader keeps the one it loaded. The choice, its alternatives
# and its reversal are in the `register` module of `storage-store`.
# features:
# - none: `weak`, `serde` and the experimental strategies stay off. The
#   snapshot is a strong `Arc`, and nothing serialises it.
[workspace.dependencies.arc-swap]
version = "1.9.3"
default-features = false

# BLAKE3 gives the digest of a content or of a node identity. The kernel keys
# its verdicts by it. `gandr-surface-build-identity` digests the kernel and
# the sites with it. Each verdict key and each stratum key binds one of those
# digests.
#
# The engine hub names its sockets by it, and a sweep's sample orders its
# sources by it. A finding of the prose gate keys its sentence by it. A plan
# keys its minimal form by it, and the emitter keys each machine block by it.
[workspace.dependencies.blake3]
version = "1.8.7"
default-features = false

# The arena of a host's chunk holder and of a store plane's records: an
# append-only vector whose push and get take `&self` with no lock, and whose
# elements never move, so a chunk or a record that the holder lends stays at
# its address while threads push. The choice, its alternatives and its
# reversal are in the pull request of #6899 that adds it.
# features:
# - none: the crate has no feature to turn on.
[workspace.dependencies.boxcar]
version = "0.2.14"
default-features = false

# The driver's argument parser, built through `derive`. The `color` and
# `suggestions` defaults stay off: the first pulls the `anstream` terminal
# stack, the second edit-distance matching with nothing to match against.
# features:
# - std: the hosted driver
# - derive: the `Parser` derive the driver's argument surface is built with
# - help: the generated `--help` text
# - usage: the usage line `--help` and an argument error print
# - error-context: the context an argument error reports
# - env: `GANDR_JOBS`, the environment's default for `--jobs`
[workspace.dependencies.clap]
version = "4.6.6"
default-features = false
features = ["derive", "env", "error-context", "help", "std", "usage"]

# Standing observer workers exchange jobs and results.
# features:
# - std: Sender/Receiver and bounded are absent without hosted support.
[workspace.dependencies.crossbeam-channel]
version = "0.5.17"
default-features = false
features = ["std"]

# Standing observer workers balance irregular admission families.
# features:
# - std: Injector/Worker are absent without hosted epoch support.
[workspace.dependencies.crossbeam-deque]
version = "0.8.8"
default-features = false
features = ["std"]

# The activity ring: each worker of the pool writes its events into a bounded
# lock-free queue, and a full queue drops its oldest event. Chosen over
# `ringbuf` and `rtrb`, whose single-producer rings drop no oldest event while
# a consumer reads, and over a ring of our own.
# features:
# - alloc: `ArrayQueue` in the `no_std` fork crate
[workspace.dependencies.crossbeam-queue]
version = "0.3.14"
default-features = false
features = ["alloc"]

# Ed25519 receipts over the kernel's recorded verdicts: the installation's
# kernel signs what it checked, and a run recalls a verdict only on a
# receipt whose signer its policy trusts. Chosen over ed25519-compact (one
# maintainer, a fiftieth of the dependents) and ring (no `no_std`, which the
# kernel requires). Verification is `verify_strict`, which refuses weak keys.
# features:
# - fast: precomputed tables, so a verification costs 24 µs rather than 40
# - zeroize: a signing key's bytes are cleared when it drops
[workspace.dependencies.ed25519-dalek]
version = "3.0.0"
default-features = false
features = ["fast", "zeroize"]

# The snapshot comparison for the ranking golden of the inline completion. It
# compares a file or an inline literal whole. It prints a diff on a mismatch.
# `UPDATE_EXPECT=1` writes the file again. It has no optional feature.
[workspace.dependencies.expect-test]
version = "1.5.1"
default-features = false

# The hasher behind the grammar's label index, the syntax tree builder's
# leaf-digest cache, the printer's binder scopes, the content table's interner
# and the derivation identities' address and subterm sets: a fixed-seed
# folded-multiply hash, deterministic across runs. The choices and their
# reversals are in the consumers' READMEs and module docs.
# features:
# - none: the fixed-seed state needs neither `std` nor a random seed
[workspace.dependencies.foldhash]
version = "0.2.0"
default-features = false

# The kernel's mapping calls with no C library, and a heap of size classes
# over them.
[workspace.dependencies.gandr-boot-alloc]
path = "crates/boot-alloc"

# The operations on a range of bytes that allocate nothing. Each operation
# has the range that a function of the layer `boot` reads, and the place that
# it writes.
[workspace.dependencies.gandr-boot-core]
path = "crates/boot-core"

# The IO core of the bootstrap with no C library. It reads a file and writes
# to a descriptor, each time by its own system call on Linux x86-64.
[workspace.dependencies.gandr-boot-io]
path = "crates/boot-io"

# The judgement that checks a declaration: its name-free input, the verdicts,
# the ledger of obligations and the words of a refusal.
[workspace.dependencies.gandr-core-checker]
path = "crates/core-checker"

# The base of the judgement that checks a declaration. It holds the faces,
# the input of a declaration, the run of a module and the verdicts. It also
# holds the ledger of obligations and the words of a refusal.
[workspace.dependencies.gandr-core-checker-base]
path = "crates/core-checker-base"

# The kernel bridge of the checking judgement: readmission through the
# kernel's one checked entry, and the staging templates.
[workspace.dependencies.gandr-core-checker-bridge]
path = "crates/core-checker-bridge"

# The content form of a core node: its canonical table, numbered by
# discovery, free of arena ids and admission positions, and its mint.
[workspace.dependencies.gandr-core-content]
path = "crates/core-content"

# The fork a check hands its independent jobs to, and its serial reference.
[workspace.dependencies.gandr-core-fork]
path = "crates/core-fork"

# The incremental check over the core judgement. It holds the seam of an
# item, the resume with its validation and the checkpoints by content. It
# also holds the synthesis stream and the store of kernel verdicts.
[workspace.dependencies.gandr-core-incremental]
path = "crates/core-incremental"

# The normal forms by evaluation of the core. It holds the weak-head
# evaluation, the readback and the conversion machine. The kernel replays the
# traces of that machine. The oracle of this crate checks the readback of
# each tier.
[workspace.dependencies.gandr-core-nbe]
path = "crates/core-nbe"

# The base of the glued value domain. It holds the arena of a run, the
# closures, the values and the neutrals, and the free indices. It also holds
# the content guards, the identity of an element and the stage terms. The
# sharing overlay has its erasure and its measure.
[workspace.dependencies.gandr-core-nbe-base]
path = "crates/core-nbe-base"

# The one writer that publishes a file whole: a private temporary created
# exclusively, then renamed onto its name.
[workspace.dependencies.gandr-core-publish]
path = "crates/core-publish"

# The sequent intermediate language. It focuses a core term into commands. A
# run answers into its store, and the language reads the terminal of a run.
[workspace.dependencies.gandr-core-sequent]
path = "crates/core-sequent"

# Contractive binary session types and their one relation engine. The
# judgement decides endpoint equivalence and the subtype relation through it.
# The causal web of a dialogue and its decomposition come from it.
[workspace.dependencies.gandr-core-session]
path = "crates/core-session"

# The core call-by-push-value syntax, the one unified context, the definition
# chain and the per-scope definitional environment.
[workspace.dependencies.gandr-core-term]
path = "crates/core-term"

# The metacontext and the solver that an elaborator calls for its
# metavariables. The checker solves the holes that a call names for the
# implicits that it omits.
[workspace.dependencies.gandr-core-unify]
path = "crates/core-unify"

# The support-keyed check-memo seam, generic over consumer-owned types.
[workspace.dependencies.gandr-kernel-check-memo]
path = "crates/kernel-check-memo"

# The conversion-decision seam between the untrusted engine and the kernel.
[workspace.dependencies.gandr-kernel-conversion-trace]
path = "crates/kernel-conversion-trace"

# The checking machine of the certified kernel, the conversion, the admission,
# and the check of a conversion trace again.
# features: none. The check of a certificate is synchronous and no_std.
[workspace.dependencies.gandr-kernel-core]
path = "crates/kernel-core"
default-features = false

# The record of the kernel and its rewriting. It holds the admitted entries
# and their staging, the content encoding and the check support. It also
# holds the rewrite of terms, the refusals of the kernel, and the verdict keys
# and receipts.
[workspace.dependencies.gandr-kernel-core-base]
path = "crates/kernel-core-base"

# The region: values in buckets under a budget, whose ids carry its brand,
# and an allocator under the same budget.
[workspace.dependencies.gandr-kernel-data]
path = "crates/kernel-data"

# The oracle of the certified kernel for the levels of a universe.
[workspace.dependencies.gandr-kernel-strata]
path = "crates/kernel-strata"

# The flat term arena, the format of the subterm table and the decode budgets.
# It also holds the leaf vocabularies that the core language reads and does
# not state again.
# features: none. The crate holds native session code and evidence data.
[workspace.dependencies.gandr-kernel-term]
path = "crates/kernel-term"
default-features = false

# The `gandr` driver: its verbs over the surface pipeline, the hub and the
# faces it serves.
[workspace.dependencies.gandr-lang]
path = "crates/surface-driver"

# The copy-and-patch emission. It lowers the command IL, and it has the
# patchers for arm64 on macOS and Linux and for Linux x86-64. It holds the
# content cache and the policy of the native tier. When it cannot emit, it
# uses the portable executor.
[workspace.dependencies.gandr-runtime-emitter]
path = "crates/runtime-emitter"

# The host's network for the `Net` interface: streams to peers named by
# their keys, over QUIC through iroh, on a thread beside the program.
[workspace.dependencies.gandr-runtime-net]
path = "crates/runtime-net"

# The record of Rust functions that the pinned toolchain gives, with each
# staged body. With no default feature, it holds the record and its bytes
# alone. A consumer that reads the cache sets `std`.
# features:
# - std: set by surface-dispatcher, which reads the cache and runs the reader
[workspace.dependencies.gandr-runtime-rust-record]
path = "crates/runtime-rust-record"
default-features = false

# The L machine's transitions written once: the stencils the emitter copies
# and the portable executor that dispatches the same functions.
[workspace.dependencies.gandr-runtime-stencils]
path = "crates/runtime-stencils"

# Kernel artifacts on the record plane, under a manifest identity, read back
# through the kernel's decoder.
[workspace.dependencies.gandr-storage-artifact]
path = "crates/storage-artifact"

# The content-defined chunks: the place where a stream of canonical units
# breaks, and the committed parameters that decide that place.
[workspace.dependencies.gandr-storage-chunker]
path = "crates/storage-chunker"

# The authenticated ordered-record plane.
[workspace.dependencies.gandr-storage-records]
path = "crates/storage-records"

# One store over the value plane, the record plane and named roots, under one
# directory.
[workspace.dependencies.gandr-storage-store]
path = "crates/storage-store"

# The content-addressed value plane: one value as a typed chunk DAG under
# content pointers.
[workspace.dependencies.gandr-storage-values]
path = "crates/storage-values"

# The agentic face of the engine hub. It serves the toolset of the Reactive
# Agent Protocol by default, and the Model Context Protocol for compatibility.
# Both go through the one table of operations of the hub.
[workspace.dependencies.gandr-surface-agentic]
path = "crates/surface-agentic"

# The identities of a build: the kernel's build identity and the build of the
# theory sites, each a digest of what its library compiles. A binary alone
# depends on it, so a change of a digest compiles no library again.
[workspace.dependencies.gandr-surface-build-identity]
path = "crates/surface-build-identity"

# The expectation language: the expectation schemas, the strict and fixture
# roots, the comparison that settles a value and the shape of a report.
[workspace.dependencies.gandr-surface-corpus]
path = "crates/surface-corpus"

# The diagnostics model: refusals, unsettled declarations, goals, warnings and
# ledger lines as diagnostics every face projects, and their builders.
[workspace.dependencies.gandr-surface-diagnostics]
path = "crates/surface-diagnostics"

# Routes a driver invocation into the surface pipeline, and composes that
# pipeline over the sources a verb walks.
[workspace.dependencies.gandr-surface-dispatcher]
path = "crates/surface-dispatcher"

# The run stage: each run of a checked module's program, native or on the
# executor, and the engine the composition and the walk take.
[workspace.dependencies.gandr-surface-evaluate]
path = "crates/surface-evaluate"

# The features ledger as data: the record `gandr check` reads at the toolchain
# step, and the rows the tools list and show.
[workspace.dependencies.gandr-surface-features]
path = "crates/surface-features"

# The source formatter. It sets a parsed source at a page width. It keeps
# the tokens and the comments, and it checks that the meaning does not change.
[workspace.dependencies.gandr-surface-format]
path = "crates/surface-format"

# The checked precedence-bounded grammar: its mold table and its precedence
# DAG. It holds the default surface, which the melder pushes. It also holds the
# table that pairs each glyph with its ASCII spelling. With the feature
# `baked`, the mold table of the gandr surface is a file of the user's cache.
# Only the first process builds it.
[workspace.dependencies.gandr-surface-grammar]
path = "crates/surface-grammar"
features = ["baked"]

# The document-layout engine: the sealed document arena, Pareto resolution
# under width taint, the plan arena and the first-order render machine.
[workspace.dependencies.gandr-surface-layout]
path = "crates/surface-layout"

# The lowering of the surface into the core: resolution, module collection,
# the attribute side table, the origin table and the refusal classifier.
[workspace.dependencies.gandr-surface-lowering]
path = "crates/surface-lowering"

# The base of the lowering: the namespace engine, the per-node table, the
# form stretches and the circuit readings that the lowering's families share.
[workspace.dependencies.gandr-surface-lowering-base]
path = "crates/surface-lowering-base"

# The capability family of the lowering: capability scopes and their
# handlers, session endpoints, method calls and field access, over the
# lowering's base.
[workspace.dependencies.gandr-surface-lowering-capability]
path = "crates/surface-lowering-capability"

# The exits family of the lowering, over the base of the lowering. It moves
# an early exit to the end of its body. It holds the break, the continue and
# the re-entry of a loop, and the runs that a computation requests.
[workspace.dependencies.gandr-surface-lowering-exits]
path = "crates/surface-lowering-exits"

# The expression and type lowering: each expression, type, pattern, block and
# declaration body, over the lowering's base and its families.
[workspace.dependencies.gandr-surface-lowering-expression]
path = "crates/surface-lowering-expression"

# The identity family of the lowering: path, bridge and flow types, the
# identity operations, transports and derived operations, over the
# lowering's base.
[workspace.dependencies.gandr-surface-lowering-identity]
path = "crates/surface-lowering-identity"

# The model and arity family of the lowering, over the base of the lowering.
# It holds the type families, the derived model signatures and the model
# implicits. It also holds the reducts and the arity of the type forms.
[workspace.dependencies.gandr-surface-lowering-model]
path = "crates/surface-lowering-model"

# The native family of the lowering, over the base of the lowering. It holds
# the data families, the constructors and the signature of a data
# declaration. It compiles a match to native eliminations.
[workspace.dependencies.gandr-surface-lowering-native]
path = "crates/surface-lowering-native"

# The language server. It gives diagnostics and semantic tokens over the
# Language Server Protocol. Each request checks the whole document again. It
# also holds the shared workspace of the engine hub.
[workspace.dependencies.gandr-surface-lsp]
path = "crates/surface-lsp"

# The base of the language server. It holds the messages of the protocol,
# the transport, the positions and the token stream. It also holds the inline
# completion and the markup that the families of the server share.
[workspace.dependencies.gandr-surface-lsp-base]
path = "crates/surface-lsp-base"

# The core of the families of the language server. It holds the reading of a
# held text, the hover, the completion and the definitions. It also holds the
# signature help, the semantic tokens and the files of a workspace.
[workspace.dependencies.gandr-surface-lsp-core]
path = "crates/surface-lsp-core"

# The diagnostics of the language server. It holds the recheck of a document
# and the kernel tiers. It also holds the repairs and fills of a hole, and the
# checkpoints that a save keeps.
[workspace.dependencies.gandr-surface-lsp-diagnostics]
path = "crates/surface-lsp-diagnostics"

# The navigation of the language server. It holds references, highlights,
# rename and the call hierarchy. It also holds inlay hints, copied sources,
# shadows and the documentation site.
[workspace.dependencies.gandr-surface-lsp-navigation]
path = "crates/surface-lsp-navigation"

# The surface parser: the lossless labeler, the obligation-minimizing molder
# and the push-machine melder that commit a molded tree.
[workspace.dependencies.gandr-surface-parser]
path = "crates/surface-parser"

# The presentation printer. It sets checked core types and normal-form values
# at a page width through the layout engine.
[workspace.dependencies.gandr-surface-pretty]
path = "crates/surface-pretty"

# The renderer seam: presentation spans, cards and transcript blocks, the
# byte-to-position projections and the versioned render-bus frame.
# features:
# - serde: the wire image the codec witnesses round-trip, so the gate runs
#   them; the hub's render-bus face writes it and `gandr view` reads it
[workspace.dependencies.gandr-surface-render-remote]
path = "crates/surface-render-remote"

# The terminal face of the diagnostics model. It shows a diagnostic as a
# source snippet with its loci, its contexts and its notes.
[workspace.dependencies.gandr-surface-render-terminal]
path = "crates/surface-render-terminal"

# The read-evaluate loop: the completeness gate, the session loop and its
# meta-commands, the transcript encoder, the batch and line-editor faces.
[workspace.dependencies.gandr-surface-repl]
path = "crates/surface-repl"

# The interactive session. It lowers each revision, judges it, resumes it
# through the incremental checker and keeps a checkpoint of it.
[workspace.dependencies.gandr-surface-session]
path = "crates/surface-session"

# The concrete syntax tree and the grammar-facing mold vocabulary it carries.
[workspace.dependencies.gandr-surface-syntax]
path = "crates/surface-syntax"

# The terminal face. It paints the transcript of the read-evaluate loop, an
# input pane and a status line on the full screen.
[workspace.dependencies.gandr-surface-tui]
path = "crates/surface-tui"

# The cell-shape substrate: command patterns, matching, the reduction order,
# the cell alphabet and its store.
# features:
# - none: alloc-only cell patterns and stores.
[workspace.dependencies.gandr-theory-cell-complexes]
path = "crates/theory-cell-complexes"
default-features = false

# The toy alphabet and the adversary frame, for engine suites. It is a
# dev-dependency only, and its workspace test checks that.
[workspace.dependencies.gandr-theory-cell-complexes-tools]
path = "crates/theory-cell-complexes-tools"

# Cellular sheaves over finite graded posets: gluing over a cover, and
# cohomology through a tower of levels.
# features:
# - none: alloc-only stalks, entry maps and exact rational matrices.
[workspace.dependencies.gandr-theory-cellular-sheaves]
path = "crates/theory-cellular-sheaves"
default-features = false

# The diagram view of circuit algebras: monogamous acyclic wirings with
# interfaces, their canonical form and the relabelling that checks it, and
# the overlaps of two diagrams.
# features:
# - none: alloc-only wiring and embedding matching.
[workspace.dependencies.gandr-theory-circuit-algebras]
path = "crates/theory-circuit-algebras"
default-features = false

# The rewriting engine: firing, the overlap enumerator and its support,
# replayable coherence certificates, budgeted completion.
# features:
# - none: alloc-only bounded completion and replay.
[workspace.dependencies.gandr-theory-coherent-resolutions]
path = "crates/theory-coherent-resolutions"
default-features = false

# Description elaboration into rewriting cells.
# features:
# - none: the certificate fixtures use the alloc-only elaborator.
[workspace.dependencies.gandr-theory-computads]
path = "crates/theory-computads"
default-features = false

# Certificate composition and bounded backward pathway queries.
# features:
# - none: alloc-only theory machinery.
[workspace.dependencies.gandr-theory-decomposition-spaces]
path = "crates/theory-decomposition-spaces"
default-features = false

# The identity relations on derivations: the earned shift equivalence and its
# guard, the causal order and the normal form of a certificate.
[workspace.dependencies.gandr-theory-deep-inference]
path = "crates/theory-deep-inference"

# Discrete Morse theory on finite cell complexes: acyclic matchings and their
# check, the greedy matching, and Brown's collapsing scheme.
# features:
# - none: alloc-only matchings over the caller's cells.
[workspace.dependencies.gandr-theory-discrete-morse]
path = "crates/theory-discrete-morse"
default-features = false

# Standing insertion-only graph and offset-constraint maintenance.
# features:
# - none: alloc-only graph machinery.
[workspace.dependencies.gandr-theory-dynamic-graphs]
path = "crates/theory-dynamic-graphs"
default-features = false

# A proof-producing e-graph over the term table of a Lawvere theory:
# congruence closure with a proof forest, explanations and their replay, the
# worklist rebuild, e-class analyses and the phases of a saturation.
# features:
# - none: alloc-only classes over the caller's table.
[workspace.dependencies.gandr-theory-e-graphs]
path = "crates/theory-e-graphs"
default-features = false

# Canonical dyadics and oriented intervals with outward-rounded arithmetic.
# features:
# - none: the dyadics on big-integer mantissas, with no feature of their own.
[workspace.dependencies.gandr-theory-exact-reals]
path = "crates/theory-exact-reals"

# Finite graded posets with their cells as data, and their subcomplexes.
# features:
# - none: alloc-only posets over finite Stone duality's bit rows.
[workspace.dependencies.gandr-theory-graded-posets]
path = "crates/theory-graded-posets"
default-features = false

# The precedence DAG, the walk machine, and the graph algorithms they read.
# features:
# - none: alloc-only graph machinery.
[workspace.dependencies.gandr-theory-graphs]
path = "crates/theory-graphs"
default-features = false

# The levitated description table: codes, rule faces, circuit rules and their
# occurrence record, bridge arities.
# features:
# - none: allocation-only description syntax.
[workspace.dependencies.gandr-theory-levitation]
path = "crates/theory-levitation"
default-features = false

# Register presentations of nominal automata over caller-owned names: partial
# injective stores and their transfers.
# features:
