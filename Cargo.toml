[workspace]
resolver = "3"
members = [
  "crates/core-checker",
  "crates/core-incremental",
  "crates/core-nbe",
  "crates/core-sequent",
  "crates/core-term",
  "crates/kernel-check-memo",
  "crates/kernel-conversion-trace",
  "crates/kernel-core",
  "crates/kernel-strata",
  "crates/kernel-term",
  "crates/storage-artifact",
  "crates/storage-chunker",
  "crates/storage-records",
  "crates/storage-values",
  "crates/surface-corpus",
  "crates/surface-diagnostics",
  "crates/surface-dispatcher",
  "crates/surface-driver",
  "crates/surface-grammar",
  "crates/surface-layout",
  "crates/surface-lowering",
  "crates/surface-lsp",
  "crates/surface-parser",
  "crates/surface-pretty",
  "crates/surface-render-remote",
  "crates/surface-repl",
  "crates/surface-session",
  "crates/surface-syntax",
  "crates/surface-tui",
  "crates/theory-cell-complexes",
  "crates/theory-cell-complexes-tools",
  "crates/theory-circuit-algebras",
  "crates/theory-coherent-resolutions",
  "crates/theory-computads",
  "crates/theory-deep-inference",
  "crates/theory-graphs",
  "crates/theory-levitation",
  "crates/theory-orders",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor the git `anodized` dependency declares; the workspace checks clean
# under it (`cargo +1.95.0 check --workspace --all-targets --locked`).
rust-version = "1.95.0"
repository = "https://github.com/gandr-lang/gandr"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

# One table per dependency: what it is, `# features:` with the need behind
# each enabled feature, `# consumers:`. Defaults are always off; a feature is
# on only because a build or a test failed without it.
[workspace.dependencies]

# Source-snippet layout: the backend the diagnostics renderer projects a
# report into, the one rustc and cargo render through. Defaults off: `std`
# only gives `anstyle` an `io::Write` sink, and a rendering is a `String`.
# The choice, its alternatives and its reversal are in the consumer's README.
# consumers:
# - surface-diagnostics
[workspace.dependencies.annotate-snippets]
version = "0.12.16"
default-features = false

# Executable specifications, including const functions, with a core-only facade.
# Logic/BigInt is optional, so no_std consumers build with defaults off.
# Runtime enforcement is selected for the whole build graph with
# `--cfg anodized_panic`, never inferred from the optimization profile.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - core-term
# - kernel-check-memo
# - kernel-conversion-trace
# - kernel-core
# - kernel-strata
# - kernel-term
# - storage-artifact
# - storage-chunker
# - storage-records
# - storage-values
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-driver
# - surface-grammar
# - surface-layout
# - surface-lowering
# - surface-lsp
# - surface-parser
# - surface-pretty
# - surface-render-remote
# - surface-repl
# - surface-session
# - surface-syntax
# - surface-tui
# - theory-cell-complexes
# - theory-cell-complexes-tools
# - theory-circuit-algebras
# - theory-coherent-resolutions
# - theory-computads
# - theory-deep-inference
# - theory-graphs
# - theory-levitation
# - theory-orders
[workspace.dependencies.anodized]
git = "https://github.com/silvanshade/anodized"
rev = "2ccb1b0ef982a064c0ac5681b7b32b074344dae3"
default-features = false

# BLAKE3 hashing for content and node identities.
# consumers:
# - core-incremental
# - storage-artifact
# - storage-records
# - storage-values
# - surface-syntax
[workspace.dependencies.blake3]
version = "1.8.7"
default-features = false

# The driver's argument parser, built through `derive`. The `color` and
# `suggestions` defaults stay off: the first pulls the `anstream` terminal
# stack, the second edit-distance matching with nothing to match against.
# features:
# - std: the hosted driver
# - derive: the `Parser` derive the driver's argument surface is built with
# - help: the generated `--help` text
# - usage: the usage line `--help` and an argument error print
# - error-context: the context an argument error reports
# consumers:
# - surface-driver
[workspace.dependencies.clap]
version = "4.6.6"
default-features = false
features = ["derive", "error-context", "help", "std", "usage"]

# Snapshot comparison for the highlighter's role goldens and the printer's
# layout goldens: a file compared whole, a diff on mismatch, and a rewrite
# under `UPDATE_EXPECT=1`. It has no features to leave off.
# consumers:
# - surface-grammar (dev)
# - surface-pretty (dev)
[workspace.dependencies.expect-test]
version = "1.5.1"
default-features = false

# The checking judgement: the name-free declaration input, the verdicts, the
# obligation ledger and the refusal vocabulary.
# consumers:
# - core-incremental
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-lowering (dev)
# - surface-session
[workspace.dependencies.gandr-core-checker]
path = "crates/core-checker"

# Incremental checking over the core judgement: the item seam, validated
# resume, content-addressed checkpoints and the synthesis stream.
# consumers:
# - surface-repl
# - surface-session
# - surface-tui (dev)
[workspace.dependencies.gandr-core-incremental]
path = "crates/core-incremental"

# Normalisation by evaluation over the core: weak-head evaluation, readback,
# the conversion machine whose recorded traces the kernel replays, and the
# oracle the L machine's readback is compared against.
# consumers:
# - core-checker
# - core-sequent (dev)
# - kernel-core (dev)
# - surface-pretty (dev)
[workspace.dependencies.gandr-core-nbe]
path = "crates/core-nbe"

# The sequent intermediate language and the L machine: focusing a core term
# into commands, running a command, and reading a run's terminal back.
# consumers:
# - surface-dispatcher
[workspace.dependencies.gandr-core-sequent]
path = "crates/core-sequent"

# The core call-by-push-value syntax, the one unified context, the definition
# chain and the per-scope definitional environment.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - kernel-core (dev)
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-lowering
# - surface-pretty
# - surface-session
[workspace.dependencies.gandr-core-term]
path = "crates/core-term"

# The support-keyed check-memo seam, generic over consumer-owned types.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - kernel-core
[workspace.dependencies.gandr-kernel-check-memo]
path = "crates/kernel-check-memo"

# The conversion-decision seam between the untrusted engine and the kernel.
# consumers:
# - core-checker
# - core-nbe
# - kernel-core
# - kernel-term
[workspace.dependencies.gandr-kernel-conversion-trace]
path = "crates/kernel-conversion-trace"

# The certified kernel's checking machine, conversion, admission and the
# replay of conversion traces.
# consumers:
# - core-checker
# - core-nbe (dev)
# - surface-lowering (dev)
[workspace.dependencies.gandr-kernel-core]
path = "crates/kernel-core"

# The certified kernel's universe-level oracle.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - core-term
# - kernel-core
# - kernel-term
# - storage-artifact (dev)
# - surface-lowering
# - surface-pretty
[workspace.dependencies.gandr-kernel-strata]
path = "crates/kernel-strata"

# The flat term arena, the subterm-table sharing format, and the decode budgets;
# the leaf vocabularies the core language reads rather than restates.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - core-term
# - kernel-core
# - storage-artifact
# - surface-corpus
# - surface-dispatcher
# - surface-lowering
# - surface-pretty
# - surface-repl (dev)
# - surface-session
# - surface-tui (dev)
[workspace.dependencies.gandr-kernel-term]
path = "crates/kernel-term"

# Kernel artifacts on the record plane, under a manifest identity, read back
# through the kernel's decoder.
# consumers:
# - surface-corpus (dev)
# - surface-session
[workspace.dependencies.gandr-storage-artifact]
path = "crates/storage-artifact"

# Content-defined chunking: where a stream of canonical units is cut, and the
# committed parameters that decide it.
# consumers:
# - storage-records
# - storage-values
[workspace.dependencies.gandr-storage-chunker]
path = "crates/storage-chunker"

# The authenticated ordered-record plane.
# consumers:
# - storage-artifact
# - storage-values (dev)
# - surface-corpus (dev)
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-storage-records]
path = "crates/storage-records"

# The expectation language: the expectation schemas, the strict and fixture
# roots, the settle comparison and the report shape.
# consumers:
# - surface-diagnostics
# - surface-dispatcher
# - surface-lsp
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-surface-corpus]
path = "crates/surface-corpus"

# Renders a dispatcher step: refusals, unsettled declarations and goals as
# source snippets, and the ledger lines a verb prints beside them.
# consumers:
# - surface-driver
# - surface-lsp
# - surface-repl
# - surface-session (dev)
# - surface-tui
[workspace.dependencies.gandr-surface-diagnostics]
path = "crates/surface-diagnostics"

# Routes a driver invocation into the surface pipeline, and composes that
# pipeline over the sources a verb walks.
# consumers:
# - surface-diagnostics
# - surface-driver
# - surface-lsp
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-surface-dispatcher]
path = "crates/surface-dispatcher"

# The checked precedence-bounded grammar: its mold table, its precedence
# DAG and the built-in surface the melder pushes over.
# consumers:
# - surface-corpus (dev)
# - surface-diagnostics (dev)
# - surface-dispatcher
# - surface-lowering
# - surface-lsp
# - surface-parser
# - surface-repl
# - surface-session
# - surface-tui
[workspace.dependencies.gandr-surface-grammar]
path = "crates/surface-grammar"

# The document-layout engine: the sealed document arena, Pareto resolution
# under width taint, the plan arena and the first-order render machine.
# consumers:
# - surface-pretty
[workspace.dependencies.gandr-surface-layout]
path = "crates/surface-layout"

# Lowering the surface into the core: resolution, module collection, the
# attribute side table, the origin table and the refusal classifier.
# consumers:
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-session
[workspace.dependencies.gandr-surface-lowering]
path = "crates/surface-lowering"

# The language server: diagnostics and semantic tokens over the Language
# Server Protocol, each request rechecking the whole document.
# consumers:
# - surface-driver
[workspace.dependencies.gandr-surface-lsp]
path = "crates/surface-lsp"

# The surface parser: the lossless labeler, the obligation-minimizing molder
# and the push-machine melder that commit a molded tree.
# consumers:
# - surface-corpus (dev)
# - surface-dispatcher
# - surface-grammar (dev)
# - surface-lowering (dev)
# - surface-lsp
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-surface-parser]
path = "crates/surface-parser"

# The presentation printer: checked core types and normal-form values laid
# out at a page width through the layout engine.
# consumers:
# - surface-repl
[workspace.dependencies.gandr-surface-pretty]
path = "crates/surface-pretty"

# The renderer seam: presentation spans, cards and transcript blocks, the
# byte-to-position projections and the versioned render-bus frame.
# features:
# - serde: the wire image the codec witnesses round-trip, so the gate runs them
# consumers:
# - surface-grammar
# - surface-lsp
# - surface-render-remote (dev)
# - surface-repl
# - surface-tui
[workspace.dependencies.gandr-surface-render-remote]
path = "crates/surface-render-remote"

# The read-evaluate loop: the completeness gate, the session loop and its
# meta-commands, the transcript encoder, the batch and line-editor faces.
# consumers:
# - surface-driver
# - surface-tui
[workspace.dependencies.gandr-surface-repl]
path = "crates/surface-repl"

# The interactive session: each revision lowered, judged, resumed through the
# incremental checker and checkpointed.
# consumers:
# - surface-repl
[workspace.dependencies.gandr-surface-session]
path = "crates/surface-session"

# The concrete syntax tree and the grammar-facing mold vocabulary it carries.
# consumers:
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-grammar
# - surface-lowering
# - surface-lsp
# - surface-parser
# - surface-repl
# - surface-session
# - surface-tui
[workspace.dependencies.gandr-surface-syntax]
path = "crates/surface-syntax"

# The terminal face: the read-evaluate loop's transcript, an input pane and a
# status line, painted full-screen.
# consumers:
# - surface-driver
[workspace.dependencies.gandr-surface-tui]
path = "crates/surface-tui"

# The cell-shape substrate: command patterns, matching, the reduction order,
# the cell alphabet and its store.
# consumers:
# - core-sequent
# - theory-cell-complexes-tools
# - theory-circuit-algebras
# - theory-coherent-resolutions
# - theory-computads
# - theory-deep-inference
[workspace.dependencies.gandr-theory-cell-complexes]
path = "crates/theory-cell-complexes"

# The toy alphabet and the adversary frame, for engine suites; a
# dev-dependency only, which its workspace test checks.
# consumers:
# - theory-coherent-resolutions (dev)
# - theory-computads (dev)
# - theory-deep-inference (dev)
[workspace.dependencies.gandr-theory-cell-complexes-tools]
path = "crates/theory-cell-complexes-tools"

# The rewriting engine: firing, the overlap enumerator and its support,
# replayable coherence certificates, budgeted completion.
# consumers:
# - theory-computads
# - theory-deep-inference
[workspace.dependencies.gandr-theory-coherent-resolutions]
path = "crates/theory-coherent-resolutions"

# The identity relations on derivations: earned shift equivalence and the
# guard it is earned against, the causal order, the certificate normal form.
# consumers:
# - theory-computads
[workspace.dependencies.gandr-theory-deep-inference]
path = "crates/theory-deep-inference"

# The precedence DAG, the walk machine, and the graph algorithms they read.
# consumers:
# - surface-grammar
# - surface-parser
[workspace.dependencies.gandr-theory-graphs]
path = "crates/theory-graphs"

# The levitated description table: codes, rule faces, circuit rules and their
# occurrence record, bridge arities.
# consumers:
# - theory-computads
[workspace.dependencies.gandr-theory-levitation]
path = "crates/theory-levitation"

# The order-maintenance structure: stable handles over a total order with
# constant-time comparison.
# consumers:
# - core-incremental
[workspace.dependencies.gandr-theory-orders]
path = "crates/theory-orders"

# Percent-decoding: the path a `file` URI names. The choice and its reversal
# are in the language server's README.
# features:
# - alloc: the decoded path as an owned string
# consumers:
# - surface-lsp
[workspace.dependencies.percent-encoding]
version = "2.3.2"
default-features = false
features = ["alloc"]

# Graph storage and algorithms. Reached only through `theory-graphs`, which
# owns the dependency and exposes none of its types; the grammar's
# closing-class derivation reads its strongly-connected-component
# condensation. The choice and its reversal are in that crate's README.
# consumers:
# - theory-graphs
[workspace.dependencies.petgraph]
version = "0.8.3"
default-features = false

# Property-based testing with shrinking.
# features:
# - std: the test runner, its random source and failure persistence
# consumers:
# - core-checker (dev)
# - core-incremental (dev)
# - core-sequent (dev)
# - kernel-strata (dev)
# - kernel-term (dev)
# - storage-artifact (dev)
# - storage-records (dev)
# - storage-values (dev)
# - surface-layout (dev)
# - surface-parser (dev)
# - surface-session (dev)
# - theory-cell-complexes (dev)
# - theory-circuit-algebras (dev)
# - theory-coherent-resolutions (dev)
# - theory-deep-inference (dev)
# - theory-graphs (dev)
# - theory-levitation (dev)
# - theory-orders (dev)
[workspace.dependencies.proptest]
version = "1.11.0"
default-features = false
features = ["std"]

# Profile-independent arithmetic families; strict operations are the default.
# features:
# - none: core-only arithmetic, without unsafe fast mode or instrumentation
# consumers:
# - core-term
# - kernel-core
[workspace.dependencies.quenchant-arith]
git = "https://github.com/gandr-lang/quenchant"
rev = "111850988c96b7b33ee898f54c017ca645243e7f"
default-features = false

# Named non-failure absence, sealed at each decision site.
# features:
# - none: core-only shapes without instrumentation
# consumers:
# - core-checker
# - core-incremental
# - core-term
# - kernel-core
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-driver
# - surface-layout
# - surface-lowering
# - surface-lsp
# - surface-pretty
# - surface-repl
# - surface-session
# - theory-cell-complexes
# - theory-cell-complexes-tools
# - theory-circuit-algebras
# - theory-coherent-resolutions
# - theory-computads
# - theory-deep-inference
# - theory-levitation
[workspace.dependencies.quenchant-shape]
git = "https://github.com/gandr-lang/quenchant"
rev = "111850988c96b7b33ee898f54c017ca645243e7f"
default-features = false

# The terminal face's renderer: layout, styled text and widgets, the headless
# test backend, and the crossterm backend with the terminal setup and key
# events it re-exports. Defaults off: `all-widgets` adds the calendar and
# `time`, `layout-cache` an LRU the face's one layout does not need, `macros`
# a crate the face does not use. The choice, its alternatives, its build cost
# and its reversal are in the consumer's README.
# features:
# - crossterm: the backend `gandr tui` draws through, with raw mode, the
#   alternate screen and key events
# consumers:
# - surface-tui
[workspace.dependencies.ratatui]
version = "0.30.2"
default-features = false
features = ["crossterm"]

# The line editor of the read-evaluate loop's terminal face: raw-mode input,
# editing keys and in-memory history. Defaults off: `with-file-history` writes
# plaintext history, `with-dirs` locates it, `custom-bindings` adds a keymap
# trie the face does not use. The choice, its alternatives and its reversal
# are in the consumer's README.
# consumers:
# - surface-repl
[workspace.dependencies.rustyline]
version = "18.0.1"
default-features = false

# The serialization framework the render-bus wire image and the language
# server's protocol messages derive through.
# features:
# - alloc: the owned strings and vectors, and the tagged enums' buffered content
# - derive: the `Serialize` and `Deserialize` derives
# consumers:
# - surface-lsp
# - surface-render-remote
[workspace.dependencies.serde]
version = "1.0.229"
default-features = false
features = ["alloc", "derive"]

# JSON: the language server's wire format, and the format the render-bus codec
# witnesses round-trip through.
# features:
# - alloc: the owned value tree and the string encoder without std
# consumers:
# - surface-lsp
# - surface-render-remote (dev)
[workspace.dependencies.serde_json]
version = "1.0.151"
default-features = false
features = ["alloc"]

# Optional structured diagnostics, with no runtime or output backend.
# features:
# - attributes: skip-all boundary spans without argument Debug bounds
# consumers:
# - core-nbe
# - surface-dispatcher
# - surface-driver (also enables std for its scoped subscriber)
[workspace.dependencies.tracing]
version = "0.1.44"
default-features = false
features = ["attributes"]

# Application-owned stderr formatting, without a log bridge or filter parser.
# features:
# - fmt: scoped driver output, including its registry and std requirements
# consumers:
# - surface-driver
[workspace.dependencies.tracing-subscriber]
version = "0.3.23"
default-features = false
features = ["fmt"]

# The lint wall. Every group is denied at priority -1 so an individual `allow`
# below it wins; every allow states the class it exempts. A lint leaves this
# wall only with the reason recorded beside it.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# nursery
missing_const_for_fn = "allow"
useless_let_if_seq = "allow"

# pedantic
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

# style
needless_raw_string_hashes = "allow"
needless_return = "allow"

# restriction
alloc_instead_of_core = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
# Wire fields use explicit little-endian conversions, keeping bytes identical
# across host and target byte orders. Host-local byte views for checksums or
# caches use the same conversions instead of `to_ne_bytes` / `from_ne_bytes`;
# this can require a byte swap on a big-endian host.
# Reversal: a required external byte contract specifies big-endian or native
# byte order; revisit `big_endian_bytes` or `host_endian_bytes` respectively.
big_endian_bytes = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
inline_trait_bounds = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
missing_docs_in_private_items = "deny"
missing_inline_in_public_items = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
non_zero_suggestions = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
pattern_type_mismatch = "deny"
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
return_and_then = "deny"
same_name_method = "deny"
# A block statement keeps its semicolon inside the block.
# `semicolon_outside_block` together with the pedantic
# `semicolon_if_nothing_returned` leaves a multi-line block statement whose
# value is unit with no legal form, and rustfmt produces that form whenever
# the block's expression does not fit one line. The inside form is the one
# fixed point both lints and rustfmt agree on.
semicolon_inside_block = "deny"
# Shadowing is preferred without exception, so all three shadow lints stay off.
# `shadow_unrelated` and `shadow_reuse` misfire in practice; `shadow_same` bars
# only rebinding a value to itself, which the preference permits. All are
# allowed by default. Reversal: the owner withdraws the preference, and all
# three return together with the re-binding rule.
single_char_lifetime_names = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"

[workspace.lints.rust]
deprecated_safe = "deny"
future_incompatible = "deny"
keyword_idents = "deny"
let_underscore = "deny"
nonstandard_style = "deny"
refining_impl_trait = "deny"
rust_2018_compatibility = "deny"
rust_2018_idioms = "deny"
rust_2021_compatibility = "deny"
rust_2024_compatibility = "deny"
# The policy library's lint-selection cfg: `cfg_attr(dylint_lib = …)` on a
# crate root selects opt-in quenchant lints under Dylint and is inert
# everywhere else. The three specification cfgs select runtime enforcement,
# print-only checks, and discarded specifications; the enforcing lane sets the
# first for the whole graph.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(dylint_lib, values("quenchant_dylints"))', "cfg(anodized_panic)", "cfg(anodized_print)", "cfg(anodized_discard_specs)"] }
unknown_or_malformed_diagnostic_attributes = "deny"
# Nightly-creep guard: consumer crates have no feature exemption. A library
# producer scopes its rustc_private expectation to the compiler-plugin crate.
unstable_features = "deny"
unused = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
# Module and item docs intentionally cross-link to private implementation items;
# docs are always built with `--document-private-items`, so those targets
# resolve. Without this allow, the lint rejects that deliberate doc style.
private_intra_doc_links = "allow"

# The compiler-plugin half of the lint wall: specification presence, adequacy
# grammar, nominal signature boundaries, transparent layout, recursion and
# ownership cycles, and — allow by default until the workspace opts in — the
# executable-predicate and adequacy-presence gates, the `Maybe`-shaped enum
# and the erased-error signature. Loaded from the pinned Git source by
# `mise run check:dylint`; `mise run workflow:install` installs the gate binary
# from the same revision.
[[workspace.metadata.dylint.libraries]]
git = "https://github.com/gandr-lang/quenchant"
rev = "e6c8502dd46f5111a3f2e76e1356c8ac42940193"
pattern = "crates/quenchant-dylints"

# The everyday optimized build. Size-optimized and nothing else, so each crate
# compiles independently in parallel; the whole-program work lives in `dist`.
[profile.release]
opt-level = "s"

# Tests run optimized. The heaviest tests are codegen-bound rather than
# algorithmically slow: proptest's generation and shrinking machinery, and the
# budget-boundary encode/decode that must sit on `MAX_TABLE_ENTRIES`, both pay
# roughly 6x per unit under unoptimized codegen. `debug_assertions` and
# `overflow_checks` remain on at this opt-level. Specification enforcement is
# independent: the enforcing lane supplies `--cfg anodized_panic` to the whole
# graph.
[profile.test]
opt-level = 2

# The shipped binary: `cargo build-dist` (`.cargo/config.toml`), which also
# applies `.cargo/config.dist.toml` (a size-optimized std, immediate abort on
# panic, fat LTO at link). Serial by construction: one codegen unit per crate
# and one fat LTO per binary, each re-optimizing the whole graph.
[profile.dist]
inherits = "release"
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
