[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor declared by the pinned quenchant facade and support libraries.
rust-version = "1.97"
repository = "https://github.com/gandr-lang/gandr"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

# One table per dependency: what it is, `# features:` with the need behind
# each enabled feature, `# consumers:`. Defaults are always off; a feature is
# on only because a build or a test failed without it.
[workspace.dependencies]

# Thread-local heap high-water measurements in the staging example, and the
# heap the edit loop keeps in the session's measurement.
# features:
# - none: the allocator counter has no optional features.
# consumers:
# - core-checker (dev)
# - surface-session (dev)
[workspace.dependencies.allocation-counter]
version = "0.8.1"
default-features = false

# Source-snippet layout: the backend the terminal renderer projects a
# diagnostic into, the one rustc and cargo render through. Defaults off: `std`
# only gives `anstyle` an `io::Write` sink, and a rendering is a `String`.
# The choice, its alternatives and its reversal are in the consumer's docs.
# consumers:
# - surface-render-terminal
[workspace.dependencies.annotate-snippets]
version = "0.12.16"
default-features = false

# Executable specifications through the core-only quenchant facade, named
# `anodized`: import `anodized::spec` and write `#[spec(...)]`; the policy
# lane denies qualified specification attributes. The backend is the
# anodized fork, supporting ordinary and const functions and type refinements
# without `std` or its `logic` feature. Without an instrumentation cfg,
# predicates are type-checked but not evaluated; with the feature off, strip
# mode erases specifications and the backend entirely. The fork used
# directly lacks the facade's backend-free strip mode, and handwritten
# assertions lack its shared specification representation. Reconsider the
# facade when the backend or its supported build modes change.
# features:
# - anodized: compile the development backend; `--cfg anodized_panic` selects
#   enforcement for the whole build graph, independently of build profile.
#   The feature alone never enables enforcement.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - core-session
# - core-term
# - kernel-check-memo
# - kernel-conversion-trace
# - kernel-core
# - kernel-strata
# - kernel-term
# - storage-artifact
# - storage-chunker
# - storage-records
# - storage-schema
# - storage-values
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-driver
# - surface-format
# - surface-grammar
# - surface-layout
# - surface-lowering
# - surface-lsp
# - surface-mcp
# - surface-parser
# - surface-pretty
# - surface-render-remote
# - surface-render-terminal
# - surface-repl
# - surface-session
# - surface-syntax
# - surface-tui
# - theory-cell-complexes
# - theory-cell-complexes-tools
# - theory-circuit-algebras
# - theory-coherent-resolutions
# - theory-computads
# - theory-decomposition-spaces
# - theory-deep-inference
# - theory-dynamic-graphs
# - theory-graphs
# - theory-levitation
# - theory-nominal-automata
# - theory-orders
# - theory-shapes
# - theory-sites
# - theory-spec-combinators
# - theory-virtual-doctrines
# - workflow-build-state
# - workflow-lane-budget
# - workflow-spec-cost
# - workflow-sweep
# - workflow-test-timing
[workspace.dependencies.anodized]
package = "quenchant-anodized"
git = "https://github.com/gandr-lang/quenchant"
rev = "8b8d0702d69409549e855606a85492c777e05fc9"
default-features = false
features = ["anodized"]

# BLAKE3 hashing for content and node identities, the engine hub's socket
# names, and the rank a sweep's sample orders sources by.
# consumers:
# - core-incremental
# - storage-artifact
# - storage-records
# - storage-schema
# - storage-values
# - surface-corpus (dev)
# - surface-lsp
# - surface-parser (dev)
# - surface-syntax
# - workflow-sweep
[workspace.dependencies.blake3]
version = "1.8.7"
default-features = false

# The driver's argument parser, built through `derive`. The `color` and
# `suggestions` defaults stay off: the first pulls the `anstream` terminal
# stack, the second edit-distance matching with nothing to match against.
# features:
# - std: the hosted driver
# - derive: the `Parser` derive the driver's argument surface is built with
# - help: the generated `--help` text
# - usage: the usage line `--help` and an argument error print
# - error-context: the context an argument error reports
# - env: `GANDR_JOBS`, the environment's default for `--jobs`
# consumers:
# - surface-driver
# - workflow-build-state
# - workflow-lane-budget
# - workflow-spec-cost
# - workflow-test-timing
[workspace.dependencies.clap]
version = "4.6.6"
default-features = false
features = ["derive", "env", "error-context", "help", "std", "usage"]

# Standing observer workers exchange jobs and results.
# features:
# - std: Sender/Receiver and bounded are absent without hosted support.
# consumers:
# - core-checker (dev)
[workspace.dependencies.crossbeam-channel]
version = "0.5.17"
default-features = false
features = ["std"]

# Standing observer workers balance irregular admission families.
# features:
# - std: Injector/Worker are absent without hosted epoch support.
# consumers:
# - core-checker (dev)
[workspace.dependencies.crossbeam-deque]
version = "0.8.8"
default-features = false
features = ["std"]

# Snapshot comparison for the highlighter's role goldens, the printer's
# layout goldens and the inline completion's ranking golden: a file or an
# inline literal compared whole, a diff on mismatch, and a rewrite under
# `UPDATE_EXPECT=1`. It has no features to leave off.
# consumers:
# - surface-format (dev)
# - surface-grammar (dev)
# - surface-lsp (dev)
# - surface-pretty (dev)
[workspace.dependencies.expect-test]
version = "1.5.1"
default-features = false

# The hasher behind the grammar's label index, the syntax tree builder's
# leaf-digest cache, the printer's binder scopes, the content table's interner
# and the derivation identities' address and subterm sets: a fixed-seed
# folded-multiply hash, deterministic across runs. The choices and their
# reversals are in the consumers' READMEs and module docs.
# features:
# - none: the fixed-seed state needs neither `std` nor a random seed
# consumers:
# - core-incremental
# - surface-grammar
# - surface-pretty
# - theory-deep-inference
[workspace.dependencies.foldhash]
version = "0.2.0"
default-features = false

# The checking judgement: the name-free declaration input, the verdicts, the
# obligation ledger and the refusal vocabulary.
# consumers:
# - core-incremental
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-lowering (dev)
# - surface-render-terminal (dev)
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-core-checker]
path = "crates/core-checker"

# Incremental checking over the core judgement: the item seam, validated
# resume, content-addressed checkpoints and the synthesis stream.
# consumers:
# - surface-lsp
# - surface-pretty
# - surface-repl
# - surface-session
# - surface-tui (dev)
[workspace.dependencies.gandr-core-incremental]
path = "crates/core-incremental"

# Normalisation by evaluation over the core: weak-head evaluation, readback,
# the conversion machine whose recorded traces the kernel replays, and the
# oracle the tiers' readback is compared against.
# consumers:
# - core-checker
# - core-sequent (dev)
# - kernel-core (dev)
# - surface-dispatcher
# - surface-pretty (dev)
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-core-nbe]
path = "crates/core-nbe"

# The sequent intermediate language: focusing a core term into commands,
# the store a run answers into, and reading a run's terminal back.
# consumers:
# - runtime-emitter
# - runtime-stencils (dev)
# - surface-dispatcher
[workspace.dependencies.gandr-core-sequent]
path = "crates/core-sequent"

# Contractive binary session types and their one relation engine: the
# judgement decides endpoint equivalence and subtyping through it.
# consumers:
# - core-checker
[workspace.dependencies.gandr-core-session]
path = "crates/core-session"

# The core call-by-push-value syntax, the one unified context, the definition
# chain and the per-scope definitional environment.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - kernel-core (dev)
# - runtime-emitter
# - runtime-stencils (dev)
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-format
# - surface-lowering
# - surface-pretty
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-core-term]
path = "crates/core-term"

# The support-keyed check-memo seam, generic over consumer-owned types.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - kernel-core
[workspace.dependencies.gandr-kernel-check-memo]
path = "crates/kernel-check-memo"

# The conversion-decision seam between the untrusted engine and the kernel.
# consumers:
# - core-checker
# - core-nbe
# - kernel-core
# - kernel-term
# - surface-corpus (dev)
[workspace.dependencies.gandr-kernel-conversion-trace]
path = "crates/kernel-conversion-trace"

# The certified kernel's checking machine, conversion, admission and the
# replay of conversion traces.
# features: none; synchronous no_std certificate replay.
# consumers:
# - core-checker
# - core-nbe (dev)
# - core-session
# - surface-corpus (dev)
# - surface-lowering (dev)
# - theory-levitation (dev)
[workspace.dependencies.gandr-kernel-core]
path = "crates/kernel-core"
default-features = false

# The certified kernel's universe-level oracle.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - core-term
# - kernel-core
# - kernel-term
# - storage-artifact (dev)
# - surface-lowering
# - surface-pretty
# - surface-session (dev)
[workspace.dependencies.gandr-kernel-strata]
path = "crates/kernel-strata"

# The flat term arena, the subterm-table sharing format, and the decode budgets;
# the leaf vocabularies the core language reads rather than restates.
# features: none; native session code and evidence data.
# consumers:
# - core-checker
# - core-incremental
# - core-nbe
# - core-sequent
# - core-session
# - core-term
# - kernel-core
# - runtime-emitter
# - runtime-stencils (dev)
# - storage-artifact
# - surface-corpus
# - surface-diagnostics
# - surface-dispatcher
# - surface-lowering
# - surface-pretty
# - surface-repl (dev)
# - surface-session
# - surface-tui (dev)
# - theory-levitation (dev)
[workspace.dependencies.gandr-kernel-term]
path = "crates/kernel-term"
default-features = false

# Copy-and-patch emission: the lowering of the command IL, the patchers for
# arm64 on macOS and Linux and for Linux x86-64, the content cache and the
# native tier's policy, falling back to the portable executor.
# consumers:
# - core-sequent (dev)
# - runtime-stencils (dev)
# - surface-dispatcher
[workspace.dependencies.gandr-runtime-emitter]
path = "crates/runtime-emitter"

# The L machine's transitions written once: the stencils the emitter copies
# and the portable executor that dispatches the same functions.
# consumers:
# - runtime-emitter (build and normal)
[workspace.dependencies.gandr-runtime-stencils]
path = "crates/runtime-stencils"

# Kernel artifacts on the record plane, under a manifest identity, read back
# through the kernel's decoder.
# consumers:
# - surface-corpus (dev)
# - surface-session
[workspace.dependencies.gandr-storage-artifact]
path = "crates/storage-artifact"

# Content-defined chunking: where a stream of canonical units is cut, and the
# committed parameters that decide it.
# consumers:
# - storage-records
# - storage-values
[workspace.dependencies.gandr-storage-chunker]
path = "crates/storage-chunker"

# The authenticated ordered-record plane.
# consumers:
# - storage-artifact
# - storage-schema
# - storage-values (dev)
# - surface-corpus (dev)
# - surface-lsp
# - surface-repl
# - surface-session
[workspace.dependencies.gandr-storage-records]
path = "crates/storage-records"

# The expectation language: the expectation schemas, the strict and fixture
