[package]
name = "gandr-workflow-outputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The values that a program computes from the tree and that the tree does not hold: the writer of each kind of output"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["ci", "corpus", "gandr", "outputs"]
categories = ["development-tools::testing"]
publish.workspace = true

# The pinned anodized facade supplies the specification attribute, and BLAKE3
# the fingerprint of a tree and the key of a value. The store of the outputs
# holds each value. serde_json reads `cargo metadata`.
#
# The surface grammar and the parser make the tree of a source. The graph
# crate names the side of a context of a mold. The render seam names each
# role of the highlight. The dispatcher walks the refusing sources with the
# engine of the run stage. The terminal renderer writes each diagnostic at a
# verbosity of the diagnostics crate.
[dependencies]
anodized.workspace = true
blake3.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-dispatcher.workspace = true
gandr-surface-evaluate.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-render-remote.workspace = true
gandr-surface-render-terminal.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-graphs.workspace = true
gandr-workflow-output-store.workspace = true
serde_json.workspace = true

[[bin]]
name = "outputs"
path = "src/main.rs"

[lints]
workspace = true
