[package]
name = "gandr-surface-dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Routes a gandr driver invocation and composes the surface pipeline: parse, lower, check, settle"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "language", "toolchain"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The composition names every stage it runs: the grammar and the parser, the
# lowering, the checker and the kernel bridge it carries, the settle
# comparison the corpus library owns, and the run stage's focusing and
# readback, with the emitter running a run native or on its executor and the
# network's runtime serving a program's `Net` operations. The
# diagnostics model spells the types a refusal names while the arena is at
# hand, and builds what each step prints; the type table spells the type a
# face asks for through the presentation printer. The `stage` verb builds the
# normaliser's staging observer programs and checks them through the
# checker's program entry, on the driver's `rayon` pool. The reader maps a
# source above its crossover through memmap2. The `ledger` verb writes the
# syntax ledger's machine form through serde_json. A package's manifest
# carries the BLAKE3 digest of its body, through blake3, so the checker
# tells its own file from a hand edit; its address is the BLAKE3 digest of
# its items' content keys, which the incremental checker's program states.
# A closure's judgement is held in a self_cell with the closure's lowering,
# whose names it borrows. A `[presentation]` table, the user's configuration
# file's and a package manifest's alike, is read through toml. A package's
# lock commits each dependency's identity through the storage tier's store,
# and records the pointer the value plane returns; a package's export commits
# there too, each kernel artifact as the artifact crate's declaration records.
# A `check` that keeps the kernel's verdicts admits under the policy and key
# the kernel's verdict vocabulary names.
# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled. `hotpath` profiles a closure's lowering and
# judgement, the prelude's among them, for the benchmark report.
[dependencies]
anodized.workspace = true
blake3.workspace = true
gandr-core-checker.workspace = true
gandr-core-incremental.workspace = true
gandr-core-nbe.workspace = true
gandr-core-sequent.workspace = true
gandr-core-term.workspace = true
gandr-kernel-core.workspace = true
gandr-kernel-strata.workspace = true
gandr-kernel-term.workspace = true
gandr-runtime-emitter.workspace = true
gandr-runtime-net.workspace = true
gandr-storage-artifact.workspace = true
gandr-storage-store.workspace = true
gandr-storage-values.workspace = true
gandr-surface-corpus.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-format.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-lowering.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-pretty.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-cell-complexes.workspace = true
hotpath = { workspace = true, optional = true }
memmap2.workspace = true
quenchant-shape.workspace = true
rayon.workspace = true
self_cell.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing = { workspace = true, optional = true }

# The corpus sweeps draw their samples through the sweep crate; the
# critical-pair differential reads both overlap enumerators over the cells
# and the presented terms.
[dev-dependencies]
gandr-theory-circuit-algebras.workspace = true
gandr-theory-coherent-resolutions.workspace = true
gandr-theory-levitation.workspace = true
gandr-workflow-sweep.workspace = true

# The default width counts the host's physical performance cores; Linux reads
# them from sysfs with std alone.
[target.'cfg(target_os = "macos")'.dependencies]
sysctl.workspace = true

[features]
default = []
# The checker's judgement and readmission, a rule block's decision with its
# completion, and a closure's lowering and judgement, the prelude's among
# them, profiled for the benchmark report (the driver's `hotpath` bench).
hotpath = [
  "dep:hotpath",
  "gandr-core-checker/hotpath",
  "gandr-surface-lowering/hotpath",
  "hotpath/hotpath",
]
# Invocation boundary diagnostics through the caller-owned subscriber.
tracing = ["dep:tracing"]

[lints]
workspace = true
