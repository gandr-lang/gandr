[package]
name = "gandr-surface-dispatcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Routes a gandr driver invocation and composes the surface pipeline: parse, lower, check, settle"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "language", "toolchain"]
categories = ["development-tools"]
publish.workspace = true
autotests = false
autobenches = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The measurement: a `harness = false` bench that times the pool's hand-offs:
# one dependence schedule over three graphs, one `each`, and the fallback of
# `each` by an atomic cursor, each over three job times at each width that the
# run names, with percentiles and allocations.
[[bench]]
harness = false
name = "schedule"
path = "benches/schedule.rs"

# The composition names every stage it runs: the grammar and the parser, the
# lowering, the checker and the kernel bridge it carries, the settle
# comparison the corpus library owns, and the tier's focusing and readback,
# with the emitter running a run native or on its executor and the
# network's runtime serving a program's `Net` operations.
# The diagnostics model spells the types a refusal names while the arena is at
# hand, and builds what each step prints; the type table spells the type a
# face asks for through the presentation printer. The `stage` verb builds the
# normaliser's staging observer programs and checks them through the
# checker's program entry, on the driver's pool. The pool owns its workers and
# implements the fork crate's trait, so every consumer forks on it through that
# trait. The pool's dependence schedule hands its jobs over the wait-free rings
# of rtrb, one ring of jobs and one ring of results for each task.
# The reader maps a source above its crossover through memmap2, and rewrites
# a mapped source through the one writer. A package's manifest
# carries the BLAKE3 digest of its body, through blake3, so the checker
# tells its own file from a hand edit; its address is the BLAKE3 digest of
# its items' content keys, which the incremental checker's program states.
# A closure's judgement is held in a self_cell with the closure's lowering,
# whose names it borrows. A `[presentation]` table, the user's configuration
# file's and a package manifest's alike, is read through toml. A package's
# lock commits each dependency's identity through the storage tier's store,
# and records the pointer the value plane returns; a package's export commits
# there too, each kernel artifact as the artifact crate's declaration records.
# A `check` that keeps the kernel's verdicts admits under the policy and key
# the kernel's verdict vocabulary names, and commits each stratum it
# certifies through the store under that key, its image and its build from
# the site crate.
# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled. `hotpath` profiles a closure's lowering and
# judgement, the prelude's among them, for the benchmark report. The cells
# census fuses each block's composition overlaps through the
# coherent-resolutions crate, and composes their distance grades in the
# Lawvere quantale of the ordered-algebras crate, over exact dyadics. A
# composition says whether the core checker keeps its goal memo through the
# check-memo seam's activity.
[dependencies]
anodized.workspace = true
blake3.workspace = true
gandr-core-checker.workspace = true
gandr-core-fork.workspace = true
gandr-core-incremental.workspace = true
gandr-core-nbe.workspace = true
gandr-core-publish.workspace = true
gandr-core-sequent.workspace = true
gandr-core-term.workspace = true
gandr-kernel-check-memo.workspace = true
gandr-kernel-core.workspace = true
gandr-kernel-strata.workspace = true
gandr-kernel-term.workspace = true
gandr-runtime-emitter.workspace = true
gandr-runtime-net.workspace = true
gandr-storage-artifact.workspace = true
gandr-storage-store.workspace = true
gandr-storage-values.workspace = true
gandr-surface-corpus.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-features.workspace = true
gandr-surface-format.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-lowering.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-pretty.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-cell-complexes.workspace = true
gandr-theory-coherent-resolutions.workspace = true
gandr-theory-exact-reals.workspace = true
gandr-theory-ordered-algebras.workspace = true
gandr-theory-sites.workspace = true
hotpath = { workspace = true, optional = true }
memmap2.workspace = true
quenchant-shape.workspace = true
rtrb.workspace = true
self_cell.workspace = true
toml.workspace = true
tracing = { workspace = true, optional = true }

# The corpus sweeps draw their samples through the sweep crate; the
# critical-pair differential reads both overlap enumerators over the cells
# and the presented terms. The weight probe weighs the oriented rules in the
# max-plus semiring of the ordered-algebras crate. The test of the one-time
# pad reads a joint distribution into a `Distribution` of theory-probability,
# over the rationals of the sheaf crate. The corpus tests of one nextest run
# share a walk's digest through serde and serde_json (#5256). The tests read
# the pool's recording fork, so the crate's own targets turn its `instrument`
# feature on. A test that composes, walks or judges a source names the run
# stage's engine, and reads the items it needs through the crate's own
# `fixture` feature. Cargo admits the cycle of a dev-dependency, and the test
# links one copy of this crate. The schedule bench counts the allocations of
# one schedule through allocation-counter. The pool's grant test makes its
# jobserver as a FIFO through nix.
[dev-dependencies]
allocation-counter.workspace = true
gandr-surface-dispatcher = { workspace = true, features = ["fixture", "instrument"] }
gandr-surface-evaluate.workspace = true
gandr-theory-cellular-sheaves.workspace = true
gandr-theory-circuit-algebras.workspace = true
gandr-theory-levitation.workspace = true
gandr-theory-probability.workspace = true
gandr-workflow-sweep.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true

# The default width counts the host's physical performance cores; Linux reads
# them from sysfs with std alone.
[target.'cfg(target_os = "macos")'.dependencies]
sysctl.workspace = true

# The pool's grant opens a jobserver's end with `O_NONBLOCK`, which `std` does
# not name.
[target."cfg(unix)".dependencies]
libc.workspace = true

[features]
default = []
# The items the crate's tests read beside its public ones: its shared test
# fixtures, and each item that a test reads and the crate keeps to itself.
fixture = []
# The checker's judgement and readmission, a rule block's decision with its
# completion, and a closure's lowering and judgement, the prelude's among
# them, profiled for the benchmark report (the driver's `hotpath` bench).
hotpath = [
  "dep:hotpath",
  "gandr-core-checker/hotpath",
  "gandr-surface-lowering/hotpath",
  "hotpath/hotpath",
]
# The pool's recording fork: each job it runs writes a start and an end into
# the activity ring of the thread that runs it. Off, no fork records.
instrument = ["gandr-core-fork/instrument"]
# Invocation boundary diagnostics through the caller-owned subscriber.
tracing = ["dep:tracing"]
unfolding-probe = [
  "gandr-core-checker/unfolding-probe",
  "gandr-core-nbe/unfolding-probe",
]

[lints]
workspace = true
