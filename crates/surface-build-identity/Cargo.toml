[package]
name = "gandr-surface-build-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The identities of a build that the driver passes down: the kernel's build identity and the build of the theory sites, each a digest of what its library compiles"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["build", "gandr", "identity", "kernel"]
categories = ["development-tools::build-utils"]
publish.workspace = true

# The kernel's record names the kernel's identity, and the sites name their
# build. The driver alone depends on this crate.
[dependencies]
gandr-kernel-core-base.workspace = true
gandr-theory-sites.workspace = true

# The tests include the digest module. The build script includes it too.
[dev-dependencies]
blake3.workspace = true
toml.workspace = true

# The build script reads the manifests and the lock with `toml`, and digests
# what each library compiles with BLAKE3.
[build-dependencies]
blake3.workspace = true
toml.workspace = true

[lints]
workspace = true
