[package]
name = "gandr-surface-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr surface parser: a lossless labeler, a molder choosing molds by completion obligations, and a resumable push-machine melder over the checked precedence-bounded grammar"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "incremental", "no-std", "parsing", "precedence"]
categories = ["no-std", "parser-implementations"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

[dependencies]
gandr-surface-grammar.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-graphs.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
