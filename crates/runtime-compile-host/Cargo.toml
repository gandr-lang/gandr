[package]
name = "gandr-runtime-compile-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Feature-gated positive-core program images and compile-host boundary vocabulary"
readme = "README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/lib.rs"

[dependencies]
anodized = { workspace = true, optional = true }
gandr-core-checker = { workspace = true, optional = true }
gandr-core-term = { workspace = true, optional = true }
gandr-kernel-term = { workspace = true, optional = true }

[dev-dependencies]
gandr-core-sequent.workspace = true
# Dev-only self activation keeps ordinary builds feature-free while every
# workspace test and policy inventory sees the optional public surface.
gandr-runtime-compile-host.workspace = true

[features]
default = []
compile-host = ["dep:anodized", "dep:gandr-core-checker", "dep:gandr-core-term", "dep:gandr-kernel-term"]

[lints]
workspace = true
