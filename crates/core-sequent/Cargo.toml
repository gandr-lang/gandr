[package]
name = "gandr-core-sequent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The command IL a call-by-push-value program is focused into, the store its runs answer into, and the readback of their values"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["call-by-push-value", "gandr", "no-std", "sequent-calculus"]
categories = ["compilers", "no-std"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The IL is stated over the core language's vocabulary: its zones from the
# core syntax, its literals, indices and injection sides from the kernel's
# term crate, its lift levels from the level oracle, and its cut polarity from
# the cell substrate, so a cell pattern's polarity reaches a command unchanged.
# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled. The shape crate supplies `Maybe`, the answer
# the core's strengthening gives when a transport motive reads its binder.
[dependencies]
anodized.workspace = true
gandr-core-term.workspace = true
gandr-kernel-strata.workspace = true
gandr-kernel-term.workspace = true
gandr-theory-cell-complexes.workspace = true
quenchant-shape.workspace = true

# The run suite runs focused commands on the emitter's two tiers, the
# runtime this IL is lowered to; the differential suite compares their
# readback against the core's normaliser, the one evaluator in the tree that
# shares no step with them. The emitter depending on this crate is a cycle
# only through the integration target, which links one copy of each.
[dev-dependencies]
gandr-core-nbe.workspace = true
gandr-runtime-emitter.workspace = true
proptest.workspace = true

[lints]
workspace = true
