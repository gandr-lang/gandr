# The checker's refusals as the store keeps them.
#
# The build script reads `CheckRefusal` from `crates/core-checker-base/src/refusal.rs`
# and writes the store's `Refusal`, its projection, its seat and its codec arms
# from it and from this table. A refusal the checker adds needs one row here:
# its wire tag. The script refuses a refusal without a row, a row without a
# refusal, a tag two rows share and a field a row names that the refusal lacks.
# The store keeps every field: a seat builds the checker's refusal again from
# the store's.
#
# A row's keys:
# - `tag`: the byte that opens the refusal's frame. A tag is never reused.
# - `sites`: the fields whose type has two roles, read as the node's site
#   rather than its content; a tuple field is named by its position.
# - `codec = "hand"`: the codec writes and reads the refusal by a hand-written
#   arm, beside the generated ones.

# Each checker payload type the store reads in item coordinates: the type the
# store keeps, and the method that reads it. The projection reads the checker's
# payload by that method, and a seat builds it again by the method of the same
# name. A type no row names is kept as the checker states it. A row with `site`
# reads a field `sites` names by that method, as a `Site`. A row with `contents
# = true` keeps a type that holds type contents: the codec bounds their levels
# and reads them in the order it writes them, through the type's `Contents`.
[roles]
ValueId = { stored = "Site", by = "value_site" }
ComputationId = { stored = "Site", by = "computation_site" }
ValueTypeId = { stored = "TypeContent", by = "value_type", site = "value_type_site", contents = true }
CompTypeId = { stored = "TypeContent", by = "comp_type", contents = true }
ConstantIndex = { stored = "Reference", by = "reference" }
CoreNode = { stored = "Site", by = "core_site" }
TermNode = { stored = "Site", by = "term_site" }
TypeNode = { stored = "TypeContent", by = "type_node", contents = true }
CheckingForm = { stored = "Form", by = "form" }
Mismatch = { stored = "Mismatched", by = "mismatch", contents = true }
Endpoint = { stored = "EndpointSite", by = "endpoint" }
LinearityDefect = { stored = "Linearity", by = "linearity", contents = true }
LocatedDefect = { stored = "Located", by = "located", contents = true }
Forced = { stored = "Forcing", by = "forced", contents = true }

