[package]
name = "gandr-surface-pretty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The presentation printer: checked core types and normal-form values laid out at a page width through the layout engine, sugared or explicit"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["call-by-push-value", "gandr", "layout", "pretty-printing"]
categories = ["text-processing"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The printer reads core types and values and the incremental checker's
# content tables, the leaf vocabularies and levels they carry, and lays its
# documents out through the layout engine; a name the printer cannot spell
# says why through the shape crate's named absence. The grammar's spelling
# table names each glyph's ASCII spelling. The binder scopes index the nodes
# they reach in a `hashbrown` map under `foldhash`'s fixed seed. The pinned
# anodized facade supplies core-only specification helpers; logic/BigInt
# stays disabled.
[dependencies]
anodized.workspace = true
foldhash.workspace = true
gandr-core-incremental.workspace = true
gandr-core-term.workspace = true
gandr-kernel-strata.workspace = true
gandr-kernel-term.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-layout.workspace = true
hashbrown.workspace = true
quenchant-shape.workspace = true

# The goldens compare whole files, and the value goldens print normal forms
# evaluation and readback produce. A univalence statement's golden names its
# descriptions and its stratum.
[dev-dependencies]
expect-test.workspace = true
gandr-core-nbe.workspace = true
gandr-theory-levitation.workspace = true
gandr-theory-sites.workspace = true

[lints]
workspace = true
