[package]
name = "gandr-workflow-ledger-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The ledger tasks of gandr's surface: the syntax ledger's writer, the exemplars gate, the recovery sweep, and the features ledger's list and show, run by the `ledger` binary"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "ledger", "workflow"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

[[bin]]
name = "ledger"
path = "src/main.rs"

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The syntax ledger reads the built-in grammar, the parser's labeler and
# molder, and the lowering's attribute registry. An exemplar is parsed,
# lowered and judged as the corpus states it, and the recovery sweep composes
# each mutant through the dispatcher on its pool. The list and the show read
# the features ledger. The ledger's machine form is written through
# serde_json. Its decision table reads a mold's left bound through the graph
# crate's `Bound` where it asks whether a hole faces an opener. The binary
# reads its verbs through clap. The pinned anodized facade supplies the
# executable specifications.
[dependencies]
anodized.workspace = true
clap.workspace = true
gandr-core-term.workspace = true
gandr-surface-corpus.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-dispatcher.workspace = true
gandr-surface-evaluate.workspace = true
gandr-surface-features.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-lowering.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-graphs.workspace = true
quenchant-shape.workspace = true
serde_json.workspace = true

[lints]
workspace = true
