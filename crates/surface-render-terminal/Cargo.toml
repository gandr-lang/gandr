[package]
name = "gandr-surface-render-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lays a gandr diagnostic out for a terminal: a source snippet with its loci, contexts and notes"
repository.workspace = true
license.workspace = true
keywords = ["diagnostics", "gandr", "language"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The renderer reads the diagnostics model alone: no producer, no dispatcher.
# `annotate-snippets` lays the snippet out; the model names the spans it
# rebases onto the excerpt. The pinned anodized facade supplies core-only
# specification helpers; logic/BigInt stays disabled.
[dependencies]
annotate-snippets.workspace = true
anodized.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-syntax.workspace = true
quenchant-shape.workspace = true

# The suite renders the diagnostics of real compositions. The dispatcher walks
# them over the default grammar with the engine of the run stage. The suite
# builds the refusals of the lowering itself. One golden cuts the origin table
# of a refusal of the checker to its primary node. It names that node through
# the types of the checker and of the corpus.
#
# The suite parses the JSON image back. Each refusing source of the corpus
# renders its refusals through the writer of the outputs crate. Each rendered
# text goes to the store of the outputs.
[dev-dependencies]
gandr-core-checker.workspace = true
gandr-surface-corpus.workspace = true
gandr-surface-dispatcher.workspace = true
gandr-surface-evaluate.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-lowering.workspace = true
gandr-workflow-output-store.workspace = true
gandr-workflow-outputs.workspace = true
serde_json.workspace = true

[lints]
workspace = true
