[package]
name = "gandr-storage-chunker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Content-defined chunk boundaries for the storage tier: a record-safe byte profile and a typed boundary-event profile, each a committed parameter block"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["chunking", "content-defined", "gandr", "no-std"]
categories = ["algorithms", "no-std"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The chunker decides boundaries over caller-supplied bytes and events;
# it hashes nothing itself.
# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled.
[dependencies]
anodized.workspace = true

[lints]
workspace = true
