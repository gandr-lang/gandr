[package]
name = "gandr-core-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The core checking judgement: four directed faces, the name-free declaration input, the conversion boundary, the obligation ledger, the refusal vocabulary and the kernel bridge"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["bidirectional", "call-by-push-value", "gandr", "no-std", "type-checking"]
categories = ["compilers", "no-std"]
publish.workspace = true
autotests = false

[[example]]
name = "staging_templates"
test = true

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The judgement is stated over the core language's own vocabulary and its
# context, and reads the leaf vocabulary (admission positions, de Bruijn
# indices, literals, base types, sorts) from the term crate that core-term
# re-uses it from, and levels from the strata crate. A code constant unfolds,
# and a static operator reduces, through the normaliser's conversion machine,
# whose recorded trace is the certificate the kernel replays; a replayed
# certificate is addressed by the check-memo seam's content digest. The kernel
# bridge erases into the term crate's arena and admits through the kernel's
# choke point, which re-derives every declaration the judgement accepts. The
# certified strata's species and equivalences come from the site crate,
# which `ua_n` reads its range and alphabet from; alloc-only `once_cell`
# cells hold each bound's catalogue and each stratum once per process. An
# endpoint's session type is related to another through the session crate's
# one relation engine. The pinned anodized facade supplies the executable
# specifications; logic/BigInt stays disabled in this no_std library. Nothing
# here names a surface crate: names, spans and syntax stay above the core.
# `hotpath` profiles checking and readmission for the benchmark report.
[dependencies]
anodized.workspace = true
gandr-core-nbe.workspace = true
gandr-core-session.workspace = true
gandr-core-term.workspace = true
gandr-kernel-check-memo.workspace = true
gandr-kernel-conversion-trace.workspace = true
gandr-kernel-core.workspace = true
gandr-kernel-strata.workspace = true
gandr-kernel-term.workspace = true
gandr-theory-deep-inference.workspace = true
gandr-theory-sites.workspace = true
hotpath = { workspace = true, optional = true }
once_cell.workspace = true
quenchant-shape.workspace = true
serde.workspace = true

# The univalence witnesses name the descriptions their statements relate.
[dev-dependencies]
allocation-counter.workspace = true
crossbeam-channel.workspace = true
crossbeam-deque.workspace = true
gandr-theory-levitation.workspace = true
proptest.workspace = true
ringbuf.workspace = true
rtrb.workspace = true
serde_json.workspace = true

[features]
default = []
# Per-declaration checking and kernel readmission timed and their allocations
# counted for the benchmark report (the driver's `hotpath` bench).
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[lints]
workspace = true
