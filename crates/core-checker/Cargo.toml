[package]
name = "gandr-core-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The core checking judgement: the base and the kernel bridge under one name, the staged programs and the elaboration session that fills a hole and resumes what waited"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["bidirectional", "call-by-push-value", "gandr", "no-std", "type-checking"]
categories = ["compilers", "no-std"]
publish.workspace = true
autotests = false

[[example]]
name = "staging_templates"
test = true

[[test]]
name = "tests"
path = "tests/lib.rs"

# The top holds what reads both the base and the bridge: a staged program
# reads the bridge's templates, and the elaboration session readmits what it
# resumes. It re-exports both lower crates, so a consumer names one crate.
# The normaliser, the term crates and the kernel give the vocabulary that a
# session and a staged program read. A staged program forks its independent
# jobs through the fork crate's trait. The pinned anodized facade supplies
# the executable specifications. Nothing here names a surface crate: names,
# spans and syntax stay above the core.
[dependencies]
anodized.workspace = true
gandr-core-checker-base.workspace = true
gandr-core-checker-bridge.workspace = true
gandr-core-fork.workspace = true
gandr-core-nbe.workspace = true
gandr-core-term.workspace = true
gandr-kernel-core.workspace = true
gandr-kernel-term.workspace = true
hotpath = { workspace = true, optional = true }
quenchant-shape.workspace = true

# The staging example measures its heap and its queues against the
# alternatives it names. The integration target reads the base's fixtures,
# the strata of a universe, and the property runner of the session's laws.
[dev-dependencies]
allocation-counter.workspace = true
crossbeam-channel.workspace = true
crossbeam-deque.workspace = true
gandr-core-checker-base = { workspace = true, features = ["fixture"] }
gandr-kernel-strata.workspace = true
gandr-theory-deep-inference.workspace = true
proptest.workspace = true
rayon.workspace = true
ringbuf.workspace = true
rtrb.workspace = true
serde_json.workspace = true

[features]
default = []
# Per-declaration checking, the trial of each model slot's candidates, and
# kernel readmission timed and their allocations counted for the benchmark
# report (the driver's `hotpath` bench).
hotpath = [
  "dep:hotpath",
  "gandr-core-checker-base/hotpath",
  "gandr-core-checker-bridge/hotpath",
  "hotpath/hotpath",
]
# The tally and the trace buffer of each checking context (the base's
# `instrument`), which the hub's instrument reads.
instrument = ["gandr-core-checker-base/instrument"]
unfolding-probe = ["gandr-core-checker-base/unfolding-probe"]

[lints]
workspace = true
