[package]
name = "gandr-core-unify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Contextual metavariables over the core and the unifier that solves them by forced solutions only"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "metavariables", "no-std", "unification"]
categories = ["compilers", "no-std"]
