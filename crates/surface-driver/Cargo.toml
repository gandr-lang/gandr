# The registry name `gandr` belongs to an unrelated crate, so the driver's
# package is `gandr-lang`, the name this project holds; it installs the `gandr`
# binary. The one exception to the `gandr-<directory>` package schema
# (`crates/README.md`).
[package]
name = "gandr-lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Driver for the gandr language toolchain"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "language", "toolchain"]
categories = ["development-tools"]
# Publishing is manual: flipping this field is itself the deliberate act of a
# manual publish.
publish.workspace = true

[[bin]]
name = "gandr"
path = "src/main.rs"

# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled. serde_json encodes the run's summary line
# under `--verbosity json`.
[dependencies]
anodized.workspace = true
clap.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-dispatcher.workspace = true
gandr-surface-format.workspace = true
gandr-surface-lsp.workspace = true
gandr-surface-mcp.workspace = true
gandr-surface-repl.workspace = true
gandr-surface-tui.workspace = true
quenchant-shape.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
# On macOS, serve every allocation from one private malloc zone rather than
# the default zone; off, and on every other target, the system allocator.
# Off by default: it missed its kill line. README § The global allocator.
malloc-zone = []
# Hosted stderr diagnostics; the dispatcher receives instrumentation only.
tracing = ["dep:tracing", "dep:tracing-subscriber", "gandr-surface-dispatcher/tracing", "tracing/std"]

[lints]
workspace = true
