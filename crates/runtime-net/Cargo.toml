[package]
name = "gandr-runtime-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The host's network for the `Net` interface: streams to peers named by their keys, over QUIC through iroh"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "iroh", "network", "quic"]
categories = ["network-programming"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# iroh dials and accepts; the mDNS lookup finds peers on the local network
# when a binding asks for it; tokio runs the endpoint's thread. The value
# plane holds the chunks an endpoint serves and fetches, and verifies each
# on receipt. The pinned anodized facade supplies the specification
# attribute.
[dependencies]
anodized.workspace = true
gandr-storage-values.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
tokio.workspace = true

# The chunk wire's witnesses commit a run's values through the emitter's
# crossing: the sequent crate's store holds them, the kernel's term crate
# spells their literals, and the chunker's constants cut them.
[dev-dependencies]
gandr-core-sequent.workspace = true
gandr-kernel-term.workspace = true
gandr-runtime-emitter.workspace = true
gandr-storage-chunker.workspace = true

[lints]
workspace = true
