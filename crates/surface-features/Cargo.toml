[package]
name = "gandr-surface-features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The features ledger of gandr as data: the record the toolchain step of `gandr check` reads, and the rows the tools list and show"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "language", "ledger"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

# One integration target, so a witness path of an integration case reads
# `tests::<area>::<name>`. The unit tests stay beside the reader.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The pinned anodized facade supplies the executable specifications. A row and
# a shown feature are written as JSON through serde_json's value tree.
[dependencies]
anodized.workspace = true
serde_json.workspace = true

[lints]
workspace = true
