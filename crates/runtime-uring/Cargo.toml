[package]
name = "gandr-runtime-uring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The kernel's io_uring: the ring, its submission and completion queues, its registrar and its operations"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "io-uring", "linux"]
categories = ["filesystem", "network-programming", "os::linux-apis"]
publish.workspace = true

# The build script makes the kernel's declarations only with the `bindgen`
# feature on, so the build dependency is optional with it.
[build-dependencies]
bindgen = { workspace = true, default-features = true, features = ["experimental"], optional = true }

# The ring is the Linux kernel's, so the crate's dependencies are Linux's
# alone. On another system the crate compiles empty.
[target.'cfg(target_os = "linux")'.dependencies]
axboe-liburing = { workspace = true }
bon = { workspace = true, features = ["implied-bounds"] }
libc = { workspace = true }
rustix = { workspace = true, features = ["net"] }
socket2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
assert_fs = { workspace = true }
notify = { workspace = true }
num_cpus = { workspace = true }
predicates = { workspace = true }
static_assertions_next = { workspace = true }

[features]
bindgen = ["dep:bindgen"]
debug = []

[lints]
workspace = true
