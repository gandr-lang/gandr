[package]
name = "gandr-surface-lowering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lowering the gandr surface into the core: resolution tables, module collection, imports, the namespace engine, the attribute side table, the origin table and the refusal classifier"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["call-by-push-value", "gandr", "lowering", "no-std"]
categories = ["compilers", "no-std"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The pinned anodized facade supplies the executable specifications of the
# readers and minters; logic/BigInt stays disabled in this no_std library.
# The specification combinators bound a clause to what a call appended.
# self_cell holds a closure's text beside its parse and its suspended
# lowering, which borrow it.
[dependencies]
anodized.workspace = true
gandr-core-term.workspace = true
gandr-kernel-strata.workspace = true
gandr-kernel-term.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-cell-complexes.workspace = true
gandr-theory-circuit-algebras.workspace = true
gandr-theory-coherent-resolutions.workspace = true
gandr-theory-computads.workspace = true
gandr-theory-levitation.workspace = true
gandr-theory-spec-combinators.workspace = true
quenchant-shape.workspace = true
self_cell.workspace = true

# The kernel's content digest witnesses that two spellings readmit as one
# declaration content; the univalence witnesses name the stratum they lower.
[dev-dependencies]
gandr-core-checker.workspace = true
gandr-kernel-core.workspace = true
gandr-surface-parser.workspace = true
gandr-theory-sites.workspace = true

[lints]
workspace = true
