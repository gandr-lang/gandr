[package]
name = "gandr-theory-coherent-resolutions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Coherent resolution of gandr's cell rewriting systems: firing under the alphabet's discipline, budgeted normalization, the multi-sum overlap enumerator, replayable coherence certificates, and budgeted Knuth-Bendix and Squier completion"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["completion", "gandr", "no-std", "rewriting"]
categories = ["mathematics", "no-std"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled. `hotpath` profiles the overlap enumeration and
# normalization for the benchmark report.
[dependencies]
anodized.workspace = true
gandr-theory-cell-complexes.workspace = true
gandr-theory-spec-combinators.workspace = true
hotpath = { workspace = true, optional = true }
quenchant-shape.workspace = true

# The spine suite runs one law suite over the tracelet replay and the
# kernel's conversion replay, so it reads the kernel's replay surface.
[dev-dependencies]
gandr-kernel-conversion-trace.workspace = true
gandr-kernel-core.workspace = true
gandr-kernel-term.workspace = true
gandr-theory-cell-complexes-tools.workspace = true
proptest.workspace = true

[features]
default = []
# The overlap queries and normalization timed and their allocations counted
# for the benchmark report (the driver's `hotpath` bench).
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[lints]
workspace = true
