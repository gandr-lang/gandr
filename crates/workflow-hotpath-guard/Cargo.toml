[package]
name = "gandr-workflow-hotpath-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A commit's hotpath checks, filed on one issue per regressed function"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["ci", "gandr", "hotpath", "performance"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

[[bin]]
name = "hotpath-guard"
path = "src/main.rs"

[[bin]]
name = "hotpath-judge"
path = "src/bin/judge.rs"

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The pinned anodized facade supplies the specification attribute; the shape
# crate the `Maybe` a commit without a pull request has for it. serde reads
# `gh`'s answers and the hotpath reports the judge compares; toml the
# regression policy it applies.
[dependencies]
anodized.workspace = true
clap.workspace = true
quenchant-shape.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
