[package]
name = "gandr-surface-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr language server: diagnostics, semantic tokens and inline completion over the Language Server Protocol"
repository.workspace = true
license.workspace = true
keywords = ["gandr", "language", "lsp"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The server compiles over its base, which holds the protocol, the transport
# and the parts that read neither the dispatcher nor the session. The server
# reads the pipeline's own faces: a session per open document, over the
# incremental checker's memory checkpoint store and the record plane's memory
# block store; the dispatcher's root classification and check verb, the
# diagnostics model's diagnostics, the grammar's highlighter over the parser's
# tree, the parser's completion query, the printer's page width for a hover's
# type, and the renderer seam's UTF-16 projection. The wire is JSON, decoded
# and encoded through serde. The hub's render-bus face writes the seam's
# frames, so the seam's serde image is on.
# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled. `hotpath` profiles a recheck for the
# benchmark report. The documentation site renders its prose through
# pulldown-cmark. A declaration's kernel tier is keyed by the kernel's
# constant index, its position in the admission. With the `instrument`
# feature, the hub folds the activity ring of the fork crate.
[dependencies]
anodized.workspace = true
blake3.workspace = true
gandr-core-fork = { workspace = true, optional = true }
gandr-core-incremental.workspace = true
gandr-kernel-term.workspace = true
gandr-storage-records.workspace = true
gandr-surface-corpus.workspace = true
gandr-surface-diagnostics.workspace = true
gandr-surface-dispatcher.workspace = true
gandr-surface-format.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-lowering.workspace = true
gandr-surface-lsp-base.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-pretty.workspace = true
gandr-surface-render-remote = { workspace = true, features = ["serde"] }
gandr-surface-session.workspace = true
gandr-surface-syntax.workspace = true
hotpath = { workspace = true, optional = true }
pathdiff.workspace = true
pulldown-cmark.workspace = true
quenchant-shape.workspace = true
serde.workspace = true
serde_json.workspace = true

# The editor-simulation suite generates random edit scripts and shrinks a
# failing one to its smallest keystroke sequence; the inline completion's
# ranking golden is an inline snapshot; the corpus sweeps draw their samples
# through the sweep crate, and name each corpus source by its percent-encoded
# `file` URI. The test of the store card commits a value into a store of its
# own, through the store and the value plane.
[dev-dependencies]
expect-test.workspace = true
gandr-storage-store.workspace = true
gandr-storage-values.workspace = true
gandr-surface-lsp = { workspace = true, features = ["client"] }
gandr-workflow-sweep.workspace = true
percent-encoding.workspace = true
proptest.workspace = true

[features]
default = []
# A client of a served session over pipes, for the editor tests, the
# benchmark report and the parser report.
client = []
# A document's recheck timed and its allocations counted for the benchmark
# report (the driver's `hotpath` bench).
hotpath = ["dep:hotpath", "hotpath/hotpath"]
# The instrument's layers: each recheck runs at the sink its client chose,
# and the session compiles its recording sinks. While a watcher follows the
# activity, each job of a recheck marks the activity ring, and one thread of
# the hub folds the ring for the watchers. Off, every recheck runs at the
# silent sink, which records nothing, and no ring and no fold is compiled.
instrument = [
  "dep:gandr-core-fork",
  "gandr-core-fork/instrument",
  "gandr-surface-dispatcher/instrument",
  "gandr-surface-session/instrument",
]

[lints]
workspace = true
