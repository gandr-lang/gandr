[package]
name = "gandr-surface-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr expectation language: the checks, owes and refuses schemas, the strict and fixture corpus roots, the settle comparison and the report shape"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["corpus", "gandr", "no-std", "testing", "type-checking"]
categories = ["compilers", "no-std"]
publish.workspace = true
autotests = false

# The suite builds its synthetic modules from source text, through the same
# parse, lower and check a driver runs; the library never names the parser.
# The kernel export suite commits each corpus source's kernel artifact as
# records and reads it back through the record plane, and replays a tampered
# artifact through the kernel to name its refusal. A source that imports a
# sibling is exported over its import closure as the dispatcher lays it out,
# a dev-dependency cycle as `gandr-surface-diagnostics`'s.
# The comment gate is the `comments` area of the one integration target, not
# a library dependency: the library never names the parser.
# `CORPUS_COMMENTS_WRITE_LEDGER=1` rewrites the ledger. Each area file is its
# own `cfg(test)` module, so a witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The settle comparison reads a lowered module — its declarations and its
# attribute side table — beside the checker's verdicts for the same module,
# and reads each attribute payload's literal out of the arena both were
# written into. Nothing here names the parser or the dispatcher: walking a
# root and adapting the lowering's declarations to the checker's input are
# the driver's.
# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled.
[dependencies]
anodized.workspace = true
gandr-core-checker.workspace = true
gandr-core-term.workspace = true
gandr-kernel-term.workspace = true
gandr-surface-lowering.workspace = true
gandr-surface-syntax.workspace = true
quenchant-shape.workspace = true

[dev-dependencies]
blake3.workspace = true
gandr-kernel-conversion-trace.workspace = true
gandr-kernel-core.workspace = true
gandr-storage-artifact.workspace = true
gandr-storage-records.workspace = true
gandr-surface-dispatcher.workspace = true
gandr-surface-grammar.workspace = true
gandr-surface-parser.workspace = true

[lints]
workspace = true
