[package]
name = "gandr-surface-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The gandr diagnostics model: refusals, unsettled declarations, goals, warnings and ledger lines, built from what the producers recorded"
repository.workspace = true
license.workspace = true
keywords = ["diagnostics", "gandr", "language"]
categories = ["development-tools"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The model reads the vocabulary of each producer. From the comparison that
# settles a module, it reads the declaration report and the refusal names.
# From the lowering, it reads the refusals and the origin table. From the
# checker, it reads the refusals, the failures and their failure classes.
# From the kernel, it reads the occurrence sites and the descent rules.
#
# The model measures the spans against the source text. A fill defect of a
# composite is a refusal of the sites crate. A univalence refusal carries the
# degree, the shape and the element indices of the sites crate.
#
# The pretty printer spells the types of a failure while the arena is at
# hand. The parser reads what separates a head that is no function from the
# operand beside it, and a refusal names that as its repair. A refusal of a
# handler names its law by the name of the levitation.
#
# The JSON image derives through serde and encodes through serde_json. The
# pinned anodized facade supplies the specification helpers of `core` alone.
# The facade does not enable its feature logic/BigInt.
[dependencies]
anodized.workspace = true
gandr-core-checker.workspace = true
gandr-core-term.workspace = true
gandr-kernel-term.workspace = true
gandr-runtime-rust-record.workspace = true
gandr-surface-corpus.workspace = true
gandr-surface-lowering.workspace = true
gandr-surface-parser.workspace = true
gandr-surface-pretty.workspace = true
gandr-surface-syntax.workspace = true
gandr-theory-levitation.workspace = true
gandr-theory-sites.workspace = true
quenchant-shape.workspace = true
serde.workspace = true
serde_json.workspace = true

# The suite builds diagnostics from real compositions: the dispatcher's walk
# over the built-in grammar, with the run stage's engine, and a document
# parsed after its import closure. The malformed-form sweep draws its sample
# through the sweep crate. The level solver's refusal fills the obstruction
# shape from the potential maintenance and the cycle witness of the graph
# crate.
[dev-dependencies]
gandr-surface-dispatcher.workspace = true
gandr-surface-evaluate.workspace = true
gandr-surface-grammar.workspace = true
gandr-theory-dynamic-graphs.workspace = true
gandr-theory-graphs.workspace = true
gandr-workflow-sweep.workspace = true

[lints]
workspace = true
