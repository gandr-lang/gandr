[package]
name = "gandr-theory-reductions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Reductions of one complex onto another for gandr: the collapse, the inclusion, both inverse witnesses and their replay, two reductions in sequence, and reductions side by side"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["cell-complex", "gandr", "no-std", "reduction"]
categories = ["mathematics", "no-std"]
publish.workspace = true
autotests = false

# One integration target, each area file its own `cfg(test)` module, so a
# witness path reads `tests::<area>::<name>`.
[[test]]
name = "tests"
path = "tests/lib.rs"

# The pinned anodized facade supplies core-only specification helpers;
# logic/BigInt stays disabled in this no_std library.
[dependencies]
anodized.workspace = true

[lints]
workspace = true
