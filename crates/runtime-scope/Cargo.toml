[package]
name = "gandr-runtime-scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A scoped runtime over the kernel's queue: one thread drives a scope's futures, and the scope's end drains each operation"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["async", "gandr", "io-uring", "kqueue"]
categories = ["asynchronous", "network-programming", "os::linux-apis", "os::macos-apis"]
publish.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/lib.rs"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
assert_fs = { workspace = true }
gandr-kernel-data = { workspace = true }
predicates = { workspace = true }

# Each target takes its kernel's adapter: the ring on Linux, and the queue
# of events on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
gandr-runtime-uring = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["net"] }
socket2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The pair's test fills a pipe to its capacity, which `pipe` reads.
rustix = { workspace = true, features = ["pipe"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["event", "net"] }
socket2 = { workspace = true }

[lints]
workspace = true
