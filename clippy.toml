#:tombi toml-version = "v1.0.0"

allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true

# The report format nextest writes, named as its documentation names it; `..`
# keeps clippy's default list.
doc-valid-idents = ["JUnit", ".."]

# `multiple_crate_versions` stays denied for every split but these.
#
# `hashbrown`: petgraph 0.8.3 pins `hashbrown` 0.15 and kasuari 0.4, the
# layout solver the terminal face's renderer links, pins `hashbrown` 0.16,
# while the `indexmap` release petgraph resolves to depends on `hashbrown`
# 0.17; nothing this workspace owns can unify them. Reversal: remove the entry
# when petgraph (petgraph/petgraph#991, on its main branch) and kasuari both
# release on `hashbrown` 0.17.
#
# `foldhash`: the default hasher of those `hashbrown` majors — 0.1 under
# petgraph's `hashbrown` 0.15, 0.2 under the 0.16 and 0.17 whose default the
# renderer turns on. Reversal: remove the entry with petgraph's `hashbrown`
# 0.17 bump, which moves its hasher to 0.2.
#
# `syn`: the `anodized` specification macros build on `syn` 2 and
# `serde_derive` on `syn` 3. The lint reads the workspace metadata, where the
# renderer seam's own test build switches its `serde` feature on, so every
# crate that depends on the seam appears to reach both majors; each proc-macro
# links one, and no artifact links both. Reversal: remove the entry when
# `anodized` moves to `syn` 3.
#
# `windows-sys`: notify 8.2, the file watcher the language server and the
# terminal REPL link, pins `windows-sys` 0.60, while rustix, mio, errno and
# rustyline resolve to 0.61; only Windows builds link either. Reversal: remove
# the entry when a stable notify release depends on 0.61 (its 9.0 line does).
#
# The rest are splits inside iroh's own graph, which the network's runtime
# (`runtime-net`) links; nothing this workspace owns reaches either side.
# netwatch links `netdev` 0.45 and 0.46, so two of `netlink-packet-core`,
# `netlink-packet-route`, `netlink-sys`, `jni`, `jni-sys` and, through jni
# 0.21, `thiserror` 1 beside 2 and `thiserror-impl`; ring links `getrandom`
# 0.2 beside rand's 0.4; aes-gcm under the QUIC stack links `cpufeatures`
# 0.2 and `crypto-common` 0.1 beside the 0.3 and 0.2 that ed25519 links;
# tokio-websockets links `base64` 0.22 beside hyper-util's 0.23; postcard
# links `embedded-io` 0.4 beside 0.6; and jni 0.21 links `windows-sys` 0.45
# on `windows-targets` 0.42 and ring `windows-sys` 0.52 on 0.52, beside
# notify's 0.60 on 0.53, so three of `windows-targets` and of each
# `windows_<target>` crate it selects, which only Windows builds link.
# Reversal: remove each entry when the iroh release the root manifest pins
# resolves to one version of it.
allowed-duplicate-crates = [
  "base64",
  "cpufeatures",
  "crypto-common",
  "embedded-io",
  "foldhash",
  "getrandom",
  "hashbrown",
  "jni",
  "jni-sys",
  "netdev",
  "netlink-packet-core",
  "netlink-packet-route",
  "netlink-sys",
  "syn",
  "thiserror",
  "thiserror-impl",
  "windows-sys",
  "windows-targets",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_gnullvm",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
]
