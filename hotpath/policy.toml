# hotpath Cloud's comparison of a pull request's benchmark report with its
# base's (https://hotpath.rs/regression_policy). Shared by the `gandr` series
# (crates/surface-driver/benches/hotpath.rs) and the `store` series
# (crates/storage-schema/benches/store.rs).
#
# A report, never a gate: no check is posted, the comment is the whole
# verdict. Allocation counts of a fixed workload repeat to within 0.1%, so a
# 2% change in them is a real one. Wall-clock time on a shared runner is
# judged at the same 2% to read how often noise alone crosses it.

pr_check = "off"
pr_comment = "always"

[functions]
min_percent_total = 0

[functions.alloc]
judged = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 1

[functions.timing]
judged = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 1
