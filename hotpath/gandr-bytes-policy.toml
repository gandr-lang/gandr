# The budgets of the allocation of the `gandr` series in bytes. A budget of a
# function takes its `alloc` only in bytes, and the report of `gandr` counts
# allocations. Thus the budgets need a run of their own.
# - see: crates/surface-driver/benches/hotpath.rs, hotpath/gandr-policy.toml,
#   https://hotpath.rs/performance_budgets
#
# The gate `hotpath-gate` of each landing runs the series with
# `HOTPATH_ALLOC_METRIC=bytes`. It judges each budget on that run alone, with
# no base. A broken budget fails `gandr-bytes`, and the trailer
# `Changes-hotpath: gandr-bytes` of a commit accepts it. `mise run ci:hotpath`
# uploads such a run as `gandr-bytes` too, and hotpath Cloud checks the same
# budgets. Its check `hotpath / gandr-bytes` is never a required check.
# - see: crates/workflow-hotpath-guard/src/judge/budget.rs

pr_check = "fail"
pr_comment = "on_change"

[functions.alloc]
judged = false

# The per-component floor (#2395): what a component laid after the prelude
# allocates to use the prelude's judgement again. Where a component still
# copies a part of the prelude and does not share it (#2461), its average
# grows with the prelude. Thus a budget that a grown prelude breaks shows the
# floor growing with it. The series measures 1090 KB for each resumed
# lowering, 333 KB for each continued program and 15.1 KB for each resumed
# kernel record (`a2485e814`, linux-x86_64). The shared parts are these: for
# the lowering, the tables of each node, the tables by declaration, the
# declarations, the descriptions and the model signatures; for the kernel
# record, the arena, the entries and the exports.
#
# On `main` at `2bb83b26`, a lowering that resumes takes 3451.9 KB. A program
# that continues takes 648.6 KB, and a kernel record that resumes takes
# 30.2 KB. Each of these breaks its budget.
#
# Each rule has `fail_check = false`: the gate of each landing shows it and
# refuses nothing. A rule fails the check again when the copy of the prelude
# goes. A new measurement can also give it a new limit.
# - see: #2461
[[functions.budgets]]
match = "gandr_surface_dispatcher::compose::lower_onto_closure"
alloc = { avg = "1186 KB" }
message = "a component's lowering resumed onto the prelude's copies the prelude's slots, structures and other collected tables, and its origins (#2461)"
fail_check = false

[[functions.budgets]]
match = "gandr_surface_dispatcher::program::after"
alloc = { avg = "512 KB" }
message = "a component's program continued from the prelude's copies the prelude's program (#2461)"
fail_check = false

[[functions.budgets]]
match = "gandr_core_checker_bridge::bridge::resume"
alloc = { avg = "16 KB" }
message = "a component's readmission resumed from the prelude's record shares its kernel arena, entries and exports; a grown average copies one of them again (#2461)"
fail_check = false
