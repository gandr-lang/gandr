# hotpath Cloud's judgement of the `store` series' allocation report
# (crates/storage-schema/benches/store.rs) against its base's
# (https://hotpath.rs/regression_policy).
# `mise run ci:hotpath` uploads it; the series' wall-clock time is judged
# apart, as `store-timing` (hotpath/store-timing-policy.toml).
#
# Allocation counts of a fixed workload repeat to within 0.1%, so a 2% change
# in any crate is a real one and fails the `hotpath / store` check, which is
# never a required check: a regression lands red rather than blocks. The
# comment is posted only when the comparison finds a change.

pr_check = "fail"
pr_comment = "on_change"

[functions]
min_percent_total = 1

[functions.alloc]
judged = true
fail_check = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 1

[functions.timing]
judged = false
