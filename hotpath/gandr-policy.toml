# hotpath Cloud's judgement of the `gandr` series' allocation report
# (crates/surface-driver/benches/hotpath.rs) against its base's
# (https://hotpath.rs/regression_policy).
# `mise run ci:hotpath` uploads it; the series' wall-clock time is judged
# apart, as `gandr-timing` (hotpath/gandr-timing-policy.toml).
#
# Allocation counts of a fixed workload repeat to within 0.1%, so a 2% change
# in any crate is a real one and fails the `hotpath / gandr` check, which is
# never a required check: a regression lands red rather than blocks. The
# comment is posted only when the comparison finds a change.

pr_check = "fail"
pr_comment = "on_change"

[functions]
min_percent_total = 1

[functions.alloc]
judged = true
fail_check = true
min_percent_change = 2
metrics = ["avg", "total"]
min_calls = 1

[functions.timing]
judged = false

# The per-component floor (#2395): what a component laid after the prelude
# allocates to reuse the prelude's judgement, checked on every report without
# a baseline. Where a reuse still copies the prelude's part rather than
# sharing it (#2461), its average grows with the prelude; a ceiling broken by
# a grown prelude is the floor growing with it. Measured in the series: 1.04
# MB per resumed lowering, whose per-node tables and tables by declaration
# are shared, 439 KB per continued program, 14 KB per resumed kernel record,
# whose arena, entries and exports are shared.
[[functions.budgets]]
match = "gandr_surface_dispatcher::compose::lower_onto_closure"
alloc = { avg = "1264 KB" }
message = "a component's lowering resumed onto the prelude's copies the prelude's collected tables, origins and declarations (#2461)"

[[functions.budgets]]
match = "gandr_surface_dispatcher::evaluate::after"
alloc = { avg = "512 KB" }
message = "a component's program continued from the prelude's copies the prelude's program (#2461)"

[[functions.budgets]]
match = "gandr_core_checker::bridge::resume"
alloc = { avg = "16 KB" }
message = "a component's readmission resumed from the prelude's record shares its kernel arena, entries and exports; a grown average copies one of them again (#2461)"
