# hotpath Cloud's judgement of the `gandr` series' wall-clock report
# (crates/surface-driver/benches/hotpath.rs) against its base's
# (https://hotpath.rs/regression_policy).
# `mise run ci:hotpath` uploads it only when the change reaches a crate the
# series' package depends on, and adds to `[functions]` an `ignore` naming
# every instrumented function of a crate outside that closure; the series'
# allocation is judged in every crate as `gandr` (hotpath/gandr-policy.toml).
#
# Wall-clock time on a shared runner is noisy: it is judged on the average of
# functions called at least 20 times, at 7.5%. A regression fails the
# `hotpath / gandr-timing` check, which is never a required check. The ratchet:
# each observed false positive raises `min_percent_change` here by 2.5, to a
# ceiling of 15, and the owner is told of every step.

pr_check = "fail"
pr_comment = "on_change"

[functions]
min_percent_total = 1

[functions.timing]
judged = true
fail_check = true
min_percent_change = 7.5
metrics = ["avg"]
min_calls = 20

# The prelude's instance machinery (#2395), checked on every report without a
# baseline. A closure is lowered once per walk or session, and judged once
# under each root its components settle under: a walk whose components start
# with a `std` module settles those under the strict root, and the rest under
# the fixture root. The series lowers 8 closures and judges 9, since the
# component walk judges under both roots (#4790). A pass over the prelude in
# every component makes as many calls as components, 64 in the component floor
# alone, so the ceiling sits between the two: a new workload or root stays
# under it, and a per-component pass breaks it. Each function the
# `prelude resolve` workload measures must run, so a renamed function or a
# lost attribute breaks its budget rather than passing silently.
[[functions.budgets]]
match = "gandr_surface_dispatcher::compose::lower_closure"
calls = { min = 1, max = 16 }
message = "the prelude is lowered once per walk, never per component (#2331)"

[[functions.budgets]]
match = "gandr_surface_dispatcher::compose::judge_closure"
calls = { min = 1, max = 16 }
message = "the prelude is judged once per walk and root, never per component (#2331)"

# A readmission resumes the prelude's crossing from the record of the walk's
# or session's first one under its root, so each declaration crosses into the
# kernel once per readmission that cannot resume it: 981 in the series. The
# prelude is 50 declarations, so the component floor crosses 114 (the prelude
# once and 64 one-definition components) and the component walk 233 (the
# prelude once per root and its components' own). A component that crossed the
# prelude again adds 50 for each, over 3000 in the component floor alone, so
# the ceiling leaves the corpus room to grow and still breaks at that.
[[functions.budgets]]
match = "gandr_core_checker::bridge::cross"
calls = { min = 1, max = 2000 }
message = "a component resumes the prelude's crossing, never crosses it again (#2395)"

# Each component after its root's first in a walk resumes the prelude's
# record: 63 in the `component floor` workload, 85 in the series. What a resume
# costs, in allocation, is pinned in hotpath/gandr-policy.toml.
[[functions.budgets]]
match = "gandr_core_checker::bridge::resume"
calls = { min = 63 }
message = "each component after a walk's first resumes the prelude's kernel record (#2395)"

[[functions.budgets]]
match = "gandr_surface_lowering::lower::model::flattened::Lowerer::model_candidates"
message = "a model slot's candidates are collected in the prelude resolve workload"

[[functions.budgets]]
match = "gandr_surface_lowering::lower::model::Lowerer::packed_structure"
message = "each candidate is packed in the prelude resolve workload"

[[functions.budgets]]
match = "gandr_surface_lowering::lower::model::reduct::Lowerer::mint_reducts"
message = "an include's reduct maps are minted in the prelude resolve workload"

[[functions.budgets]]
match = "gandr_core_checker::elaboration::constraints::Deferrals::resolve"
message = "each model slot's candidates are tried in the prelude resolve workload"

[[functions.budgets]]
match = "gandr_core_checker::elaboration::constraints::tried"
message = "each candidate's trial runs in the many candidates workload, against the store rather than a copy of it"

[[functions.budgets]]
match = "gandr_surface_lowering::lower::generic::Lowerer::mint_generics"
message = "a derived equality is minted in the prelude resolve workload"
