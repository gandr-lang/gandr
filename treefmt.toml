#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/treefmt.json

# Build output is gitignored, but the explicit exclude keeps `treefmt` from
# traversing it in environments where the git-walker's `.git` pointer is
# dangling and the implicit skip does not apply.
# Runtime state, resolver output and formatter caches are not source.
excludes = [
  "target/**",
  # Verbatim-mandated content: license text and every resolver's lockfile. A
  # formatter that rewrites a lockfile fights the resolver that owns it, and the
  # two rewrite each other on every run. `mise.lock` is here because the
  # vendored `mise.toml` sets `lockfile = true`, so every consumer tracks one;
  # per-project lockfiles in other formats stay consumer deltas.
  "**/LICENSE.*.txt",
  "Cargo.lock",
  "aube-lock.yaml",
  "mise.lock",
  # mise's npm backend owns these dependency locks and install manifests.
  ".mise/locks/**",
  # Installed packages and the extension's build output.
  "**/node_modules/**",
  "contrib/gandr-vscode/dist/**",
  # The tool's own cache, written at the root of every tree rumdl runs in.
  # Gitignoring is not scoping: the excludes are explicit.
  ".rumdl_cache",
]

# Formatter entries and their mise pins move together.

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

# Every corpus source in the gandr formatter's layout (#492). It keeps each
# token and comment as written, so a source spelled in the explicit form stays
# explicit; `check:fmt` runs the same check in one process.
[formatter.gandr]
command = "cargo"
options = [
  "run",
  "--locked",
  "--quiet",
  "--profile",
  "test",
  "--package",
  "gandr-lang",
  "--",
  "fmt",
]
includes = [
  "corpus/classifier/**/*.gandr",
  "corpus/fragment/**/*.gandr",
  "corpus/model/**/*.gandr",
  "corpus/pathological/**/*.gandr",
  "corpus/pending/**/*.gandr",
  "corpus/surface/**/*.gandr",
  "crates/surface-corpus/strict/**/*.gandr",
]

# The mutating formatter takes the lower priority so `fmt` completes before
# `check` when both cover the same markdown set.
[formatter."rumdl-format"]
priority = 0
command = "rumdl"
options = ["fmt"]
includes = ["*.md"]

[formatter."rumdl-verify"]
priority = 1
command = "rumdl"
options = ["check"]
includes = ["*.md"]

[formatter."tombi-format"]
priority = 0
command = "tombi"
options = ["format"]
includes = ["*.toml"]

[formatter."tombi-lint"]
priority = 1
command = "tombi"
options = ["lint", "--error-on-warnings"]
includes = ["*.toml"]

# The syntax ledger's machine form is generated, one rule per line, and
# `check:syntax-ledger` owns its bytes; the input method's table is generated
# from its pinned sources, one command per line, and `check:input-table` owns
# its bytes.
[formatter.oxfmt]
command = "oxfmt"
options = ["--config", ".oxfmtrc.json"]
includes = ["*.json", "*.jsonc", "*.yaml", "*.yml", "*.mjs", "*.mts", "*.ts"]
excludes = ["ledger/syntax.json", "contrib/gandr-vscode/src/input/table.json"]

# Check-only: type-aware lint, the TypeScript checker included.
[formatter.oxlint]
priority = 1
command = "oxlint"
options = ["--config", ".oxlintrc.json"]
includes = ["*.ts", "*.mts"]

[formatter.typos]
command = "typos"
options = ["--write-changes", "--force-exclude"]
includes = ["*"]

# Check-only: file size budgets. Markdown shape and budgets belong to
# `check:markdown`, which judges every tracked markdown file once.
[formatter.sizelint]
command = "sizelint"
options = ["check"]
includes = ["*"]
excludes = ["*.md"]

# Check-only: shell lint at default severity (style included); a per-line directive with its reason is the only sanctioned suppression.
[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

# Workflow and composite-action lint: one pass with the mise pin rather than a
# separate workflow-lint job. Composite actions cannot hide moved steps.
[formatter.zizmor]
priority = 1
command = "zizmor"
options = ["--min-severity", "low"]
includes = [".github/workflows/*.yml", ".github/actions/*/action.yml"]
