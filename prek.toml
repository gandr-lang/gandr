#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/prek.json

fail_fast = false
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prek-validate-config"
name = "prek validate-config"
language = "system"
entry = "mise exec -- prek validate-config prek.toml"
files.glob = ["prek.toml", "mise.toml", "mise.lock"]
pass_filenames = false
stages = ["pre-commit"]

# npm sidecars and mise.lock must describe the same cold-install tree.
[[repos.hooks]]
id = "lockfile"
name = "locked-install check"
language = "system"
entry = "mise run check:lockfile"
files.glob = ["mise.toml", "mise.lock", ".mise/locks/**"]
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "merge-residue"
name = "merge residue check"
language = "system"
entry = "mise run check:merge-residue"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "workflow-hashing"
name = "workflow hashing check"
language = "system"
entry = "mise run check:workflow-hashing"
pass_filenames = false
files = "^\\.github/"
stages = ["pre-commit"]

# Identity requirements are checked by commitlint, not a stamping hook.

# The staged paths only, without the gandr formatter (#1243): the gate and CI
# check the whole tree, the corpus layout included.
[[repos.hooks]]
id = "treefmt-staged"
name = "treefmt on the staged paths"
language = "system"
entry = "mise run treefmt:staged"
pass_filenames = true
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "markdown"
name = "markdown allowlist and budgets"
language = "system"
entry = "mise run check:markdown"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "readme-pin"
name = "the root README matches the owner's pin"
language = "system"
entry = "mise run check:readme-pin"
pass_filenames = false
files = '^(README\.md|\.config/readme\.sha256)$'
stages = ["pre-commit"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
entry = "mise x -- commitlint --edit"
language = "system"
stages = ["commit-msg"]
always_run = true
pass_filenames = true

# A push to a queued pull request, or below one, ejects the chain (#2531).
[[repos.hooks]]
id = "queued-push"
name = "no push to a queued pull request or below one"
language = "system"
entry = "mise exec -- bash .config/pr-stack/queued-push.bash"
stages = ["pre-push"]
always_run = true
pass_filenames = false

# A pushed commit failing the commit rules holds every pull request above it
# in the queue (#2640): the commits past origin/main are linted first.
[[repos.hooks]]
id = "commit-rules"
name = "the pushed commits keep the commit rules"
language = "system"
entry = "mise exec -- bash .config/commits/push.bash"
stages = ["pre-push"]
always_run = true
pass_filenames = false
