# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: epics

# An epic closes when its last sub-issue closes (#2536, `tracker.md`
# § tracker-issues). On every closed issue, `.config/epics/epics.sh` reads
# its parent and the parent's sub-issues, and `close.jq` decides: an open
# `kind:epic` here with no open sub-issue left gets the line naming the
# closing sub-issue appended to its body and closes as completed. An epic in
# another repository is listed in the run log, not closed.
on:
  issues:
    types: [closed]

permissions:
  contents: read
# No concurrency group: one shared group would let any later closing replace
# a pending run, the last sub-issue's among them. Sub-issues closing in the
# same seconds may both see every sibling closed; the script appends its line
# only to an epic whose body does not carry it yet.

jobs:
  epics:
    name: close an epic whose last sub-issue closed
    # ci.yml's runner: arm64 wherever the architecture does not matter.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # The script runs from the default branch.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
      - name: close the parent epic
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: .config/epics/epics.sh "$ISSUE"
