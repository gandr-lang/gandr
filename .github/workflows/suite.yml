# One test suite of the gates, in partitions. `gates.yml` calls it one time
# for each suite.
#
# The job `build` builds each test binary of the suite with
# `cargo nextest run --no-run`, and saves its target directory under a key of
# the commit. Each job `tests` restores that directory at the same path, so
# Cargo finds each unit fresh and builds nothing. A test that starts Cargo, or
# that reads a path of the build, finds the same paths as in one job. nextest
# gives each test to one partition by a hash of its name:
# `--partition hash:<i>/<n>`.
#
# A run of `main` saves the target directory in the scope of `main`, so the
# next run of `main` starts from it. A run of a pull request of a fork saves
# it in the scope of that pull request, which no other branch reads.
name: suite

on:
  workflow_call:
    inputs:
      slug:
        description: the name of the suite in its cache keys
        type: string
        required: true
      enforcing:
        description: run the suite with each `#[spec]` clause enforced
        type: boolean
        default: false
      target:
        description: the target directory of the suite, in its cache
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The cache holds no incremental state. A restored unit with the same
  # source content is fresh without it.
  CARGO_INCREMENTAL: "0"
  # The partitions of a suite. The matrix of the job `tests` has one entry
  # for each of them.
  PARTITIONS: "4"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # GitHub gives the token of a pull request of a fork read access only,
    # whatever this block asks. So only a push to `main` can write packages.
    permissions:
      contents: read
      packages: write
    steps:
      - name: check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `.config/mise/enforcing` sets the flag that runs each `#[spec]`
      # clause. The suite has a target directory of its own, with an absolute
      # path: a test that starts Cargo in the directory of a crate takes the
      # same directory.
      - name: set the enforcing suite
        if: ${{ inputs.enforcing }}
        run: |
          {
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/enforcing"
            echo "CARGO_UNSTABLE_FEATURE_UNIFICATION=true"
            echo "CARGO_RESOLVER_FEATURE_UNIFICATION=workspace"
          } >> "$GITHUB_ENV"
      # The key hashes the pin file, so a change of the pin is a new cache.
      - name: restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains/*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      # With no argument, rustup reads `rust-toolchain.toml`: its channel, its
      # components and its profile.
      - name: install the toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # Each Linux build links with mold (`.cargo/config.toml`).
      - name: install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      # The version of the pin in `mise.toml`.
      - name: install cargo-nextest
        run: curl --proto '=https' --tlsv1.2 -fsSL https://get.nexte.st/0.9.150/linux | tar -xzf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # The release asset of kache, checked against its pinned digest. The
      # archive has the client and its engine, which work only as a pair.
      - name: install kache
        env:
          KACHE_VERSION: v2.2.0
          KACHE_SHA256: eeb6e72b9f55d0e9d61cae0789ffa8f3ab8c33bef166b7af655cc0806447ebac
        run: |
          archive="$RUNNER_TEMP/kache.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/kunobi-ninja/kache/releases/download/$KACHE_VERSION/kache-x86_64-unknown-linux-musl.tar.gz"
          echo "$KACHE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" kache kache-engine
          config="$RUNNER_TEMP/kache.toml"
          printf '[cache.remote]\ntype = "oci"\nrepository = "ghcr.io/%s/kache"\nprefix = "gates"\n' "${GITHUB_REPOSITORY,,}" > "$config"
          {
            echo "KACHE_CONFIG=$config"
            echo "RUSTC_WRAPPER=kache"
          } >> "$GITHUB_ENV"
          kache --version
      # The cache of this commit, if a run saved it; else the newest cache of
      # this suite, the toolchain and the lock file; else the newest one of
      # this suite and the toolchain.
      - name: restore the target directory
        id: target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.target }}
          key: gate-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            gate-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            gate-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # A build fetches the crates of the host alone. A test of the driver
      # resolves its tree for `wasm32-wasip3` with `--offline`, so the suite
      # fetches the crates of each target first, and the cache holds them.
      - name: fetch the crates of each target
        run: cargo fetch --locked
      - name: build the tests
        env:
          ENFORCING: ${{ inputs.enforcing }}
          KACHE_OCI_USERNAME: ${{ github.actor }}
          KACHE_OCI_PASSWORD: ${{ github.token }}
        run: |
          wrapper=()
          if [[ "$ENFORCING" == true ]]; then
            wrapper=(.config/mise/enforcing)
          fi
          "${wrapper[@]}" cargo nextest run --workspace --locked --no-run
      # The daemon sends each queued upload before it ends, and the runner
      # then goes away. The counts show the hits of the run.
      - name: stop kache
        if: ${{ always() }}
        run: |
          kache stats || true
          kache daemon stop
      # A failed build saves its units too, for the next run of `main`.
      - name: save the target directory
        if: ${{ always() && steps.target.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.target }}
          key: ${{ steps.target.outputs.cache-primary-key }}

  tests:
    name: tests ${{ matrix.partition }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set the enforcing suite
        if: ${{ inputs.enforcing }}
        run: |
          {
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/enforcing"
            echo "CARGO_UNSTABLE_FEATURE_UNIFICATION=true"
            echo "CARGO_RESOLVER_FEATURE_UNIFICATION=workspace"
          } >> "$GITHUB_ENV"
      # A sweep test lists the corpus sources that the change touches by a
      # diff from `GANDR_SWEEP_BASE`. The base is the commit that the event
      # changes: the head of `main` before the push, or the base of the pull
      # request. The checkout holds one commit, so the step fetches the base
      # alone.
      - name: fetch the sweep base
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          echo "GANDR_SWEEP_BASE=$BASE" >> "$GITHUB_ENV"
      - name: restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains/*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: install the toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # A test that starts a build of its own links with mold.
      - name: install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      - name: install cargo-nextest
        run: curl --proto '=https' --tlsv1.2 -fsSL https://get.nexte.st/0.9.150/linux | tar -xzf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # The build of this run. A miss fails the job: a partition does not
      # build the suite again.
      - name: restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.target }}
          key: gate-${{ inputs.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: run the tests
        env:
          ENFORCING: ${{ inputs.enforcing }}
          PARTITION: ${{ matrix.partition }}
        run: |
          wrapper=()
          if [[ "$ENFORCING" == true ]]; then
            wrapper=(.config/mise/enforcing)
          fi
          "${wrapper[@]}" cargo nextest run --workspace --locked --no-fail-fast --partition "hash:$PARTITION/$PARTITIONS"
