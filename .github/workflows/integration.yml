# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: integration

# The integration cycle (#5440) of the landing model (#5438). `integration`
# takes the tip of `landing`, and ci.yml runs the lanes of a merge group on
# it with no fail-fast. A red run writes the known-red list and pages the
# fixer, and the landings go on. A green run fast-forwards `main`, and a
# rebase moves `landing` onto a fix that `main` takes (#5441). A cycle
# starts when the one before it ends: the end of a dispatched run of ci.yml
# on `integration` starts this workflow. A push to `landing` or
# `integration` starts it too, so an idle cycle takes a new landing or a fix
# at once. Each step reads the state of the cycle from GitHub (`ci:cycle`),
# so a repeated event changes nothing, and the next event recovers a lost
# one. There is no schedule: GitHub's scheduler ran this repository's
# schedules hours late (landing.yml). The step checks out the default branch
# and runs its script there. It runs none of the code on `integration`. Each
# step also reads the brake (#5442), and a brake that takes or lets go pages
# every lane and the coordinator.
#
# Every call of the step runs on the `gandr-lang` App, minted from the
# organisation's secrets `LANDING_APP_ID` and `LANDING_APP_PRIVATE_KEY`, which
# landing.yml reads too: the workflow's token has no room for the cycle in
# `.config/gh/calls.toml`. The App's merge commits are signed, and its pushes
# start this workflow again, which reads that nothing changed. Without the
# two secrets, the step only says that it waits for them.
on:
  push:
    branches: [landing, integration]
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [integration]
  workflow_dispatch: {}

permissions:
  contents: read

# One step at a time, never cancelled: a step moves refs and writes issues.
# Events that arrive meanwhile collapse into the one pending step, which
# reads everything they changed.
concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  # A push runs the workflow file of the branch it pushes. The relay starts
  # this workflow on the default branch, so every step runs the default
  # branch's file, and the factory runner admits its page.
  relay:
    name: start a cycle step on the default branch
    if: ${{ github.event_name == 'push' && github.repository_owner == 'gandr-lang' }}
    # ci.yml's runner: arm64 wherever the architecture does not matter.
    runs-on: &linux ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: dispatch this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # A dispatch that GitHub refuses with a server error loses the cycle
        # of this push, so the step tries again, four times at most.
        run: |
          for wait in 0 10 30 60; do
            sleep "$wait"
            if gh workflow run integration.yml --ref "$DEFAULT_BRANCH"; then exit 0; fi
          done
          exit 1

  # The cycle's one step (`ci:cycle`): it reads the verdict, fast-forwards
  # `main` on green, takes `landing` into `integration`, keeps the known-red
  # list and starts the suite. Only a dispatched run of ci.yml on
  # `integration` ends a cycle.
  cycle:
    name: take landing into integration and start the suite
    if: ${{ github.event_name != 'push' && github.repository_owner == 'gandr-lang' && github.ref_name == github.event.repository.default_branch && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: *linux
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      page: ${{ steps.step.outputs.page }}
      brake: ${{ steps.step.outputs.brake }}
      list: ${{ steps.step.outputs.list }}
      rebase: ${{ steps.step.outputs.rebase }}
    env:
      LANDING_APP_ID: ${{ secrets.LANDING_APP_ID }}
      # mise.toml pins neither tool: the task's own pins (`tools.jq`,
      # `tools.yq`) install them when it runs, and no other tool installs.
      MISE_ENABLE_TOOLS: "jq,yq"
    steps:
      - name: say that the cycle waits for its App
        if: ${{ env.LANDING_APP_ID == '' }}
        run: echo "The cycle waits for its App, the secrets LANDING_APP_ID and LANDING_APP_PRIVATE_KEY." >> "$GITHUB_STEP_SUMMARY"
      # The brake (#5442) reads the lag of `main` behind `landing` from git:
      # the commits of the whole history and the trees of one commit.
      - name: git checkout
        if: ${{ env.LANDING_APP_ID != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
          ref: ${{ github.event.repository.default_branch }}
      - name: mint the App's token
        id: app
        if: ${{ env.LANDING_APP_ID != '' }}
        uses: &app-token actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.LANDING_APP_ID }}
          private-key: ${{ secrets.LANDING_APP_PRIVATE_KEY }}
          # The step's needs, no more: move `integration` and `main`, merge;
          # dispatch ci.yml and read its runs and reports; keep the issues.
          permission-contents: write
          permission-actions: write
          permission-issues: write
      # The list of self-hosted runners needs `Administration: read` (#5526).
      # An App installation without it refuses this token, and the cycle's
      # suite runs on the hosted runner, as before.
      - name: mint the token that reads the runners
        id: runners
        if: ${{ env.LANDING_APP_ID != '' }}
        continue-on-error: true
        uses: *app-token
        with:
          client-id: ${{ secrets.LANDING_APP_ID }}
          private-key: ${{ secrets.LANDING_APP_PRIVATE_KEY }}
          permission-administration: read
      # No cache, as in pr-title.yml: the shared cache holds every tool of
      # CI, and this job installs none of mise.toml's.
      - name: install mise
        if: ${{ env.LANDING_APP_ID != '' }}
        uses: ./.github/actions/install-tools # zizmor: ignore[self-repository]
        with:
          cache: "false"
      - id: step
        name: read the verdict, take landing and start the suite
        if: ${{ env.LANDING_APP_ID != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUNNERS_TOKEN: ${{ steps.runners.outputs.token }}
          GH_REPO: ${{ github.repository }}
          CYCLE_FILE: "true"
        run: mise run ci:cycle

  # A new list that is red, or that holds a conflict, pages the fixer. A
  # brake that takes or lets go pages every lane and the coordinator. The
  # factory's own runner passes the list's issue number to one command,
  # which pages the seats. No text of the issue reaches the runner, and the
  # job holds no token.
  notify:
    name: page the fixer and the lanes
    needs: cycle
    if: ${{ needs.cycle.outputs.page != '' || needs.cycle.outputs.brake != '' }}
    runs-on: [self-hosted, factory] # zizmor: ignore[self-hosted-runner]
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: page the fixer
        if: ${{ needs.cycle.outputs.page != '' }}
        env:
          ISSUE: ${{ needs.cycle.outputs.page }}
        run: factory-notify integration-red "$ISSUE"
      - name: page every lane and the coordinator
        if: ${{ needs.cycle.outputs.brake == 'on' || needs.cycle.outputs.brake == 'off' }}
        env:
          BRAKE: ${{ needs.cycle.outputs.brake }}
          ISSUE: ${{ needs.cycle.outputs.list }}
        run: factory-notify "brake-$BRAKE" "$ISSUE"

  # A `main` that moved to a fix that `landing` lacks: the factory runner
  # rebases `landing` onto `main` (#5441, `.config/landing/rebase.bash`).
  # `landing`'s rules accept signed commits alone, and the host's key signs
  # the new commits. The host's credentials push them. The job runs the
  # default branch's script, and the rebase runs no code of `landing`. A
  # rebase that fails leaves `landing` as it was and pages the workflow lane
  # with the run. Its log names the cause: the files of a conflict, or the
  # error of another failure, such as a refused fetch. The rebase waits up to
  # 25 minutes while the merge queue builds a group on `landing` (#6553), so
  # the job runs on the factory runner for 35 minutes at most.
  rebase:
    name: rebase landing onto main
    needs: cycle
    if: ${{ needs.cycle.outputs.rebase == 'true' }}
    runs-on: [self-hosted, factory] # zizmor: ignore[self-hosted-runner]
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: rebase landing onto main
        run: .config/landing/rebase.bash
      - name: page the workflow lane
        if: ${{ failure() }}
        env:
          RUN: ${{ github.run_id }}
        run: factory-notify landing-rebase "$RUN"
