# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: Coverage

# Daily on main when main moved since the last upload, never per landing: an
# instrumented run pays a cold instrumented build and two to three times the
# test time, and a run per push was cancelled by the next push before it
# uploaded. A pull request that wants numbers dispatches this workflow, which
# always measures, or runs `mise run ci:coverage`. After an upload of main,
# the guard compares it with the upload before it and files a drop.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time; a dispatch during the scheduled run replaces it.
concurrency:
  group: coverage-main
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_CARGO_BINSTALL_QUICKINSTALL: "true"
  MISE_CARGO_BINSTALL_NATIVE: "true"
  # Must match ci.yml and the image. The image checks the list at build time.
  MISE_DISABLE_TOOLS: "cargo:hotpath,github:j178/prek,github:max-sixty/worktrunk,github:nektos/act,github:orhun/git-cliff"
  # Empty selects the bare runner. A set value selects the pin-file tag,
  # and only a published tag is used: this workflow does not publish.
  GANDR_CI_IMAGE: ${{ vars.GANDR_CI_IMAGE }}
  # The sweeps run their samples here; main measured at its own head has no
  # change to add to them.
  GANDR_SWEEP_BASE: HEAD

jobs:
  # Definitions only: aliases run in each consuming job's context. The
  # `needs` is what lets the aliases below name `needs.ci-image-ref`: a
  # job that declares no needs has no `needs` context, and the workflow
  # fails validation before any job starts.
  template:
    if: false
    needs: ci-image-ref
    # ci.yml's runner: arm64 wherever the architecture does not matter.
    runs-on: &linux ubuntu-24.04-arm
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - &trust-workspace
        name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - &find-image
        id: image
        name: find the published image
        uses: ./.github/actions/find-image # zizmor: ignore[self-repository]
        with:
          enabled: ${{ env.GANDR_CI_IMAGE != '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - &setup-rust
        name: setup rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.ci-image-ref.outputs.ref == '' }}
          cache-save: false
      - &install-policy-tools
        name: install mise-managed policy tools
        if: ${{ needs.ci-image-ref.outputs.ref == '' }}
        uses: ./.github/actions/install-tools # zizmor: ignore[self-repository]
      # The instrumented builds live in their own target directories and
      # nothing else writes them. Each part restores the state of the
      # directory it builds, `COVERAGE_STATE` (`coverage` for the enforcing
      # slices, `coverage-plain` for the plain witness), and the part that
      # sets `COVERAGE_STATE_SAVE` is that state's one cache writer. The key
      # is the dependency fingerprint: the dependencies' instrumented
      # artifacts are what a run reuses (cargo-llvm-cov rebuilds the
      # workspace's own crates so coverage data is never stale), so one entry
      # per fingerprint is exact, and a partial match restores the newest
      # entry to rebuild from.
      - &identify-coverage-state
        name: identify coverage-state inputs
        env:
          CI_STATE_FINGERPRINT: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
        run: printf 'COVERAGE_STATE_FINGERPRINT=%s\n' "$CI_STATE_FINGERPRINT" >> "$GITHUB_ENV"
      - &restore-coverage-state
        name: restore instrumented build state
        id: coverage-state-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/${{ env.COVERAGE_STATE }}
          key: gandr-v2-${{ env.COVERAGE_STATE }}-state-${{ runner.os }}-${{ runner.arch }}-${{ env.COVERAGE_STATE_FINGERPRINT }}
          restore-keys: gandr-v2-${{ env.COVERAGE_STATE }}-state-${{ runner.os }}-${{ runner.arch }}-
      - &measure-coverage
        name: measure this part's coverage
        run: mise run ci:coverage "$COVERAGE_PART"
      - &save-coverage-state
        name: cache instrumented build state
        if: ${{ !cancelled() && env.COVERAGE_STATE_SAVE == 'true' && steps.coverage-state-restore.outputs.cache-hit != 'true' && hashFiles(format('target/{0}/**/.rustc_info.json', env.COVERAGE_STATE)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/${{ env.COVERAGE_STATE }}
          key: ${{ steps.coverage-state-restore.outputs.cache-primary-key }}
      # The upload runs only after the measure succeeds, so a failed measure
      # uploads nothing, and the last processed upload stays main's (#3978).
      - &upload-coverage
        name: upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          flags: enforcing
          fail_ci_if_error: true
          disable_search: true

  # A missing tag selects the bare runner; this workflow does not build the
  # image.
  ci-image-ref:
    name: resolve the CI image reference
    runs-on: *linux
    permissions: *image-read-permissions
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - *git-checkout
      - *find-image

  # The scheduled run measures only when main moved since the last successful
  # upload; a dispatch always measures. A run that skipped the measurement
  # succeeds at the same commit the last upload covered, so the comparison
  # stays exact across skips, and a failed measurement is retried next day.
  freshness:
    name: decide whether main moved since the last upload
    runs-on: *linux
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - id: compare
        name: compare main against the last successful upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uploaded=$(gh run list --workflow coverage.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$uploaded" = "$GITHUB_SHA" ]; then
            echo "main is at $GITHUB_SHA, the commit the last successful upload covered: nothing to measure"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $GITHUB_SHA, the last successful upload covered ${uploaded:-nothing}: measuring"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  # The measure in parts, so no job reaches its limit (#4020): the whole
  # instrumented run took 40 minutes against its 45, its tests 12 to more
  # than 30 of them. Each enforcing part builds the workspace and runs one of
  # nextest's four hash slices of the suite; the plain part runs the
  # plain-only parser witness. Each part exports its own report, and `join`
  # merges them.
  coverage-part:
    name: measure coverage (${{ matrix.part }})
    needs: [ci-image-ref, freshness]
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.freshness.outputs.stale == 'true') }}
    # The one CI job on x86-64 Linux: the emitter's x86-64 patcher and memory
    # placement compile and run only there, and this run covers them.
    runs-on: ubuntu-latest
    permissions: *image-read-permissions
    container: &ci-image ${{ needs.ci-image-ref.outputs.ref }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: enforcing-1
            slice: hash:1/4
            state: coverage
            save: true
          - part: enforcing-2
            slice: hash:2/4
            state: coverage
          - part: enforcing-3
            slice: hash:3/4
            state: coverage
          - part: enforcing-4
            slice: hash:4/4
            state: coverage
          - part: plain
            slice: plain
            state: coverage-plain
            save: true
    env:
      COVERAGE_PART: ${{ matrix.slice }}
      COVERAGE_STATE: ${{ matrix.state }}
      COVERAGE_STATE_SAVE: ${{ matrix.save }}
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - *identify-coverage-state
      - *restore-coverage-state
      - *measure-coverage
      - *save-coverage-state
      - name: keep this part's report
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.part }}
          path: coverage.lcov
          retention-days: 1
          if-no-files-found: error
      # A sweep that reaches the coverage limit ends and passes, so the
      # upload still runs (#3975); `guard` files it from this report.
      - name: upload the test report
        if: ${{ always() }}
        continue-on-error: true
        uses: *upload-artifact
        with:
          name: junit-coverage-${{ matrix.part }}
          path: target/nextest/coverage/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  # The parts' reports as one (`mise run ci:coverage-merge`), uploaded only
  # when every part measured, so a failed part uploads nothing and the last
  # processed upload stays main's (#3978).
  coverage:
    name: join and upload coverage
    needs: [ci-image-ref, coverage-part]
    if: ${{ !cancelled() && needs.coverage-part.result == 'success' }}
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 15
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - name: download the parts' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: target/coverage-parts
      - name: join the parts' reports
        shell: bash
        run: mise run ci:coverage-merge target/coverage-parts/*/coverage.lcov
      - *upload-coverage

  # Main's upload against the upload before it (`mise run
  # ci:coverage-guard`): a fall of more than codecov.yml's project threshold
  # or an upload covering fewer files opens or updates the one issue
  # `coverage: main dropped from X to Y (<sha>)` with each crate's delta,
  # for triage. Alerting, never a gate. Its own job, so `issues: write`
  # never reaches the job that runs the test suite. An upload Codecov leaves
  # unprocessed is named on the summary and skipped for the newest processed
  # one. Two in a row open one issue (#3978). The guard writes the newest
  # processed upload as the README's badge, and `mise run
  # ci:coverage-badge` publishes it on the orphan `badges` branch, so a
  # failed or unprocessed run never turns the badge `unknown`. A sweep that
  # reached the coverage run's 600 s limit is filed on its own collector, as
  # the nightly files one (`mise run ci:slow-file`, #3975).
  guard:
    name: file a coverage drop
    needs: [ci-image-ref, coverage]
    if: ${{ !cancelled() && needs.coverage.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: *linux
    permissions:
      contents: write
      packages: read
      actions: read
      issues: write
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 25
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - name: compare main's upload with the one before
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: mise run ci:coverage-guard --threshold 0.5 --file-issue --badge coverage-badge.json >> "$GITHUB_STEP_SUMMARY"
      - name: publish the coverage badge
        if: ${{ !cancelled() && hashFiles('coverage-badge.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: mise run ci:coverage-badge coverage-badge.json >> "$GITHUB_STEP_SUMMARY"
      - name: download the coverage parts' test reports
        id: tested
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-coverage-*
          path: target/test-timing/${{ github.run_id }}
      - name: file the sweeps that reached their limit
        if: ${{ !cancelled() && steps.tested.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLOW_BUDGET: "600"
          SLOW_FILE: "true"
          SLOW_REASON: "in the coverage run, its limit. nextest ends such a sweep and passes it, so a timeout never blocks the upload (#3975)."
          SLOW_RUN_ID: ${{ github.run_id }}
          SLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: mise run ci:slow-file
