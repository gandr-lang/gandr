# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: Nightly

# Every sweep over its whole input, which the merge queue samples: the
# `nightly` nextest profile with specifications enforced (`mise run
# ci:sweeps-nightly`), the costliest sweeps each over the night's slice of
# the corpus; one crate that declares features a night, its tests with
# every feature on; and the recovery sweep over the syntax
# exemplars, its causes filed. Daily on main when main moved since the last
# successful run; a failure is a red run on main, never a blocked queue. A
# dispatch always runs. Beside them, every day, each CI lane's median job
# time against its budget. The whole workflow is held to fifteen minutes
# summed over its jobs.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time; a dispatch during the scheduled run replaces it.
concurrency:
  group: nightly-main
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_CARGO_BINSTALL_QUICKINSTALL: "true"
  MISE_CARGO_BINSTALL_NATIVE: "true"
  # Must match ci.yml and the image. The image checks the list at build time.
  MISE_DISABLE_TOOLS: "cargo:hotpath,github:j178/prek,github:max-sixty/worktrunk,github:nektos/act,github:orhun/git-cliff"
  # Empty selects the bare runner. A set value selects the pin-file tag,
  # and only a published tag is used: this workflow does not publish.
  GANDR_CI_IMAGE: ${{ vars.GANDR_CI_IMAGE }}

jobs:
  # Definitions only: aliases run in each consuming job's context. The
  # `needs` is what lets the aliases below name `needs.ci-image-ref`: a
  # job that declares no needs has no `needs` context, and the workflow
  # fails validation before any job starts.
  template:
    if: false
    needs: ci-image-ref
    # ci.yml's runner: the test states this workflow restores are its arm64
    # ones.
    runs-on: &linux ubuntu-24.04-arm
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - &trust-workspace
        name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - &find-image
        id: image
        name: find the published image
        uses: ./.github/actions/find-image # zizmor: ignore[self-repository]
        with:
          enabled: ${{ env.GANDR_CI_IMAGE != '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - &install-policy-tools
        name: install mise-managed policy tools
        if: ${{ needs.ci-image-ref.outputs.ref == '' }}
        uses: ./.github/actions/install-tools # zizmor: ignore[self-repository]
      - &setup-rust
        name: setup rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.ci-image-ref.outputs.ref == '' }}
          cache-save: false
      # The ci.yml test-state restore: main's newest complete test state of
      # this toolchain generation, which Cargo's fingerprints bring up to
      # date. Only main's ci.yml push runs write it; this workflow reads.
      - &identify-build-state
        name: identify build-state inputs
        env:
          CI_STATE_INPUTS: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          CI_STATE_GENERATION: ${{ hashFiles('rust-toolchain.toml') }}
        run: printf 'CI_BUILD_FINGERPRINT=%s\nCI_BUILD_GENERATION=%s\n' "$CI_STATE_INPUTS" "$CI_STATE_GENERATION" >> "$GITHUB_ENV"
      - &restore-test-state
        name: restore complete test state
        uses: ./.github/actions/restore-test-state # zizmor: ignore[self-repository]
      # Whether the state came down, tested once in the shell: `hashFiles`
      # over a tarball reads the whole archive inside the expression engine,
      # whose 120 s budget a large state exceeds.
      - &find-build-state
        name: find the restored build state
        shell: bash
        run: if [[ -e "build-state-$CI_BUILD_STATE.tar.zst" ]]; then echo CI_BUILD_STATE_FOUND=true >> "$GITHUB_ENV"; fi
      # Each source unchanged since the state was built is dated before it,
      # so a build script's inputs read as fresh (ci.yml's anchor, #3206).
      - &unpack-build-state
        name: unpack build state
        if: &state-found ${{ env.CI_BUILD_STATE_FOUND == 'true' }}
        shell: bash
        run: |
          zstd -dc "build-state-$CI_BUILD_STATE.tar.zst" | tar -xf -
          mise run --quiet ci:sources-restamp
      # The dependency cache also holds Cargo's registry; this fills it.
      - &fetch-dependencies
        name: fetch locked dependencies
        if: *state-found
        run: cargo fetch --locked

  # A missing tag selects the bare runner; this workflow does not build the
  # image.
  ci-image-ref:
    name: resolve the CI image reference
    runs-on: *linux
    permissions: *image-read-permissions
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - *git-checkout
      - *find-image

  # The scheduled run measures only when main moved since the last successful
  # run; a dispatch always runs. A run that skipped the lanes succeeds at the
  # commit the last full run covered, so the comparison stays exact across
  # skips, and a failed lane runs again the next day.
  freshness:
    name: decide whether main moved since the last successful run
    runs-on: *linux
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - id: compare
        name: compare main against the last successful run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run list --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '"stale=" + ((.[0].headSha // "") != env.GITHUB_SHA | tostring)' >> "$GITHUB_OUTPUT"

  # The sweeps restore main's enforcing test state, which Cargo's
  # fingerprints bring up to date, and run the nightly task. The plain build
  # of the whole test graph costs six minutes on its own; the sweeps run
  # enforced alone, as every pull-request lane runs their samples. The job's
  # share of the nightly's 900 s is 504 s, its 458 s in nightly 40667395217
  # scaled by 900/818, as every job's share is (#3013): 56 s of setup and
  # 402 s of sweeps. A night's slice of a rotating sweep costs what its
  # sources cost, so one night's sweeps can run past the share while the
  # whole nightly stays within 900 s.
  sweeps:
    name: sweep the night's inputs, specifications enforced
    needs: [ci-image-ref, freshness]
    if: &main-moved ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.freshness.outputs.stale == 'true') }}
    runs-on: *linux
    permissions: *image-read-permissions
    container: &ci-image ${{ needs.ci-image-ref.outputs.ref }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 15
    env:
      CI_BUILD_STATE: cargo-test-enforcing
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - *identify-build-state
      - *restore-test-state
      - *find-build-state
      - *unpack-build-state
      - *fetch-dependencies
      - name: run the night's sweeps
        run: mise run ci:sweeps-nightly

  # The recovery sweep (`mise run ledger:recovery`, #1782): every literal
  # tile of every syntax exemplar missed and deleted, built from the same
  # enforcing state as the sweeps, in a job of its own beside them: the two
  # together outrun one job's fifteen minutes. Its causes and counts are the
  # job summary, the whole backlog visible whether or not it is filed; the
  # report goes to `reports`, which holds the write token. The job's share of
  # the nightly's 900 s is 107 s, its 97 s in nightly 40667395217 scaled by
  # 900/818 (#3013). The sweep runs the driver the restored test build links,
  # resolved as that state was, so the step is the sweep: 7175 mutants on one
  # thread took 20 s locally (#3289).
  recovery:
    name: sweep the exemplars for recovery, specifications enforced
    needs: [ci-image-ref, freshness]
    if: *main-moved
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 15
    env:
      CI_BUILD_STATE: cargo-test-enforcing
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - *identify-build-state
      - *restore-test-state
      - *find-build-state
      - *unpack-build-state
      - *fetch-dependencies
      - name: sweep the exemplars for recovery
        env:
          RUSTFLAGS: --cfg anodized_panic
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/enforcing
          CARGO_UNSTABLE_FEATURE_UNIFICATION: "true"
          CARGO_RESOLVER_FEATURE_UNIFICATION: workspace
        shell: bash
        run: |
          mkdir -p recovery.out
          mise run ledger:recovery recovery.out/report.txt > recovery.out/causes.txt
          {
            echo '## Recovery sweep'
            echo
            grep -e ' mutants swept: ' recovery.out/causes.txt
            echo
            sed -n 's/^cause: /- /p' recovery.out/causes.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the recovery report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-report
          path: recovery.out/report.txt
          retention-days: 7

  # Each crate's tests with every feature it declares on, one of those crates
  # a night (`mise run ci:all-features` says which), in the plain lane's
  # restored test state. The sweeps sample as on a landing that changed no
  # source. A feature-gated test that fails here is filed as a defect, never
  # skipped (#1785). The job's share of the nightly's 900 s is 147 s, its
  # 134 s in nightly 40667395217 scaled by 900/818 (#3013). One crate a night
  # builds about its own closure; a crate whose night stays past the share
  # gets its own saved build state (#3288).
  all-features:
    name: test every crate with every feature on
    needs: [ci-image-ref, freshness]
    if: *main-moved
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 15
    env:
      CI_BUILD_STATE: cargo-test-plain-only
      GANDR_SWEEP_BASE: HEAD
      NEXTEST_PROFILE: ci
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - *identify-build-state
      - *restore-test-state
      - *find-build-state
      - *unpack-build-state
      - *fetch-dependencies
      - name: run the night's crates' tests with every feature on
        run: mise run ci:all-features

  # The night's reports and filings run as one job, each its own step, so
  # one container start serves them (#3208): a start costs 20 to 25 s, and
  # the lane budget, the recovery filing and the reports did a minute or less
  # of work each once the dependency report read in one pass (#3192). The job
  # waits on the recovery sweep for the causes it files. A failing step hides
  # none after it: each runs unless the run was cancelled, and the lane
  # budget, which refuses a night past the ceiling, runs last.
  #
  # The recovery sweep's causes, filed (`mise run ci:recovery-file`): one
  # issue per first error and mutation kind, at most three new a night, a
  # cause already filed skipped. Only the scheduled run files; a dispatch
  # prints what it would file. The report comes from the recovery job, so
  # filing builds nothing.
  #
  # The dependency report (`mise run report:deps`, #2902): every open epic
  # set blocked by its open sub-issues, then each dependency an open issue
  # states (an `## After` item, prose naming an open issue, an epic's open
  # sub-issue) that GitHub does not record, on one `report: dependencies`
  # issue. Then the obligations report (`mise run report:obligations`,
  # #2886): how the month's merged pull requests answered their obligations,
  # by lane and week, on one `report: obligations, <month>` issue. Only the
  # scheduled run writes; a dispatch prints the reports. They read the
  # tracker alone, so they build nothing. The obligations report's search
  # leaves out every pull request the token cannot read, and writes zeros
  # rather than failing, so the job grants `pull-requests: read` (#3576).
  # Then the prose report (`mise run report:prose`, #3591): each open issue
  # body and each open pull request body that breaks a body rule, on one
  # `report: prose` issue. It builds the `prose` binary and parses under the
  # spaCy venv `check:prose` pins, restored from the cache the merge group's
  # prose lane saves. Then the threads outside the pool (`mise run
  # report:threads`, #3610): each site that states why it owns a thread, with
  # its reason, in the job summary. It reads the tree alone, in under a
  # second.
  #
  # Each lane's median job time over the newest ten merge-queue and
  # pull-request runs of ci.yml against its budget, as the job summary and on
  # one issue while any lane is over (`mise run ci:lane-budget`). Alerting,
  # never a gate: nothing waits on this job. The one refusal is the nightly's
  # sum: the job reports past 900 s, its budget, and fails when the newest
  # completed nightly passed 1200 s, its ceiling (#3013). A budget changes
  # with its lane's shape, in the same commit; the name is the job's display
  # name. Each budget is about 1.5 times the lane's median once build state
  # was pruned, the toolchain installed once and Clippy given its own state.
  # This job's share of the nightly's 900 s is 113 s, its 103 s in nightly
  # 40667395217 scaled by 900/818 (#3013). The lane budget reads the runs'
  # jobs eight at a time (#3290), and a read GitHub answers with a server
  # error is read again (#3492).
  #
  # The enforcing lanes are held by the cone a landing touched: deep when it
  # changed a file under crates/kernel-* or crates/core-*, Cargo.lock,
  # rust-toolchain.toml or .cargo/, surface otherwise. A deep landing
  # rebuilds the whole enforcing graph and takes longer than a surface one,
  # so one budget is wrong on both sides; each class is held to its own.
  # The deep budget is the surface one plus the measured cost of the extra
  # units a deep landing rebuilds. The enforcing shards' budgets scale the
  # lane's by each shard's share of the arm64 probe's deep rebuild and suite
  # (#702): checker 0.41, rest 0.26, and the surface shard's 0.51 split as
  # engine 0.37 and faces 0.32, each its setup, two thirds of the one
  # shard's build and its own tests' share (#1177); a join is setup,
  # transfer and the witness listing. The dispatcher shard took the engine
  # shard's longest chain and three quarters of its tests (#2148), so it
  # holds the engine's budgets and the engine keeps them as a bound; the
  # lowering shard took the checker shard's longest unit, the lowering's
  # library tests, so it holds the checker's in the same way. The
  # steps it repeats, about 175 s: setup, restore, the parser's tests' build
  # and the 77 s sweep, until ten hosted runs give it a median; the plain
  # lane's stands. The mutants lane's budget is its first measurement's, a
  # one-function change at about 290 s under act on a loaded host with no
  # restored state, until ten hosted runs give it a median. The macOS lanes
  # run in the daily run and on a dispatch, which this job does not sample.
  # The daily mutation run is the one lane held over the scheduled runs
  # (`--daily`): fourteen minutes, its job's own limit, so a night over it
  # means the night's sizing failed. This workflow's own all-features and
  # recovery lanes are held over its scheduled runs (`--nightly`): about 1.5
  # times the 194 to 216 s each third of the all-features crates took on a
  # dispatch, and the 210 s the recovery sweep's setup and run took inside
  # the sweeps job. The hosted budget is this workflow's summed job time per
  # run (`--summed`): 15 minutes for its median, 20 the ceiling no night
  # passes; the table times every active workflow and reads the cache's usage.
  reports:
    name: report and file the night's findings
    needs: [ci-image-ref, recovery]
    if: ${{ !cancelled() && needs.ci-image-ref.result == 'success' }}
    runs-on: *linux
    permissions:
      contents: read
      packages: read
      actions: read
      issues: write
      pull-requests: read
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RECOVERY_FILE: ${{ github.event_name == 'schedule' && 'file' || '' }}
      RECOVERY_REPORT: recovery.out/report.txt
      REPORT_FILE: ${{ github.event_name == 'schedule' && 'file' || '' }}
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - name: download the recovery report
        if: &recovered ${{ !cancelled() && needs.recovery.result != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-report
          path: recovery.out
      - name: file the recovery sweep's causes
        if: *recovered
        run: mise run ci:recovery-file
      - name: report the dependencies
        if: &not-cancelled ${{ !cancelled() }}
        run: mise run report:deps
      - name: report the obligations answered
        if: *not-cancelled
        run: mise run report:obligations
      - name: locate the prose tools
        id: prose-tools
        if: *not-cancelled
        shell: bash
        run: |
          printf 'installs=%s/installs\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}" >> "$GITHUB_OUTPUT"
          printf 'pins=%s\n' "$(sed -n '/^\["check:prose"\]/,/^usage/p' .config/mise/tasks/mise-tasks-check.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: restore the prose tools
        if: *not-cancelled
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.prose-tools.outputs.installs }}/python
            ${{ steps.prose-tools.outputs.installs }}/github-astral-sh-uv
            ${{ steps.prose-tools.outputs.installs }}/pipx-spacy
          key: prose-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prose-tools.outputs.pins }}
      - name: report the prose of the open bodies
        if: *not-cancelled
        run: mise run report:prose
      - name: list the threads outside the pool
        if: *not-cancelled
        run: mise run --quiet report:threads >> "$GITHUB_STEP_SUMMARY"
      - name: compare each lane with its budget
        if: *not-cancelled
        run: >-
          mise run ci:lane-budget --issue "CI lane budgets"
          --budget "test enforcing targets (linux, dispatcher)=170"
          --budget "test enforcing targets (linux, dispatcher):deep=250"
          --budget "test enforcing targets (linux, engine)=170"
          --budget "test enforcing targets (linux, engine):deep=250"
          --budget "test enforcing targets (linux, faces)=145"
          --budget "test enforcing targets (linux, faces):deep=215"
          --budget "test enforcing targets (linux, checker)=190"
          --budget "test enforcing targets (linux, checker):deep=285"
          --budget "test enforcing targets (linux, lowering)=190"
          --budget "test enforcing targets (linux, lowering):deep=285"
          --budget "test enforcing targets (linux, rest)=135"
          --budget "test enforcing targets (linux, rest):deep=200"
          --budget "join the enforcing shards (linux)=120"
          --budget "test plain-only targets (linux)=160"
          --budget "sweep the recovery records (linux)=260"
          --budget "document the workspace (linux)=150"
          --budget "test the documentation examples (linux)=200"
          --budget "check quenchant compiler policy=180"
          --budget "check Clippy wall=150"
          --budget "re-verify obligated specifications (linux)=180"
          --budget "report the mutants of the change (linux)=300"
          --daily "mutate the night's crate (linux)=840"
          --nightly "test every crate with every feature on=300"
          --nightly "sweep the exemplars for recovery, specifications enforced=320"
          --summed "Nightly=900/1200"
          >> "$GITHUB_STEP_SUMMARY"
