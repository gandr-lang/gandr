# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: Nightly

# Every sweep over its whole input, which the merge queue samples: the
# `nightly` nextest profile with specifications enforced (`mise run
# ci:sweeps-nightly`), the costliest sweeps each over the night's slice of
# the corpus; one crate that declares features a night, its tests with
# every feature on; and the recovery sweep over the syntax
# exemplars, its causes filed. Daily on main when the night's commit moved
# since the last successful run; each lane runs at the commit of main whose
# test state it restores. A failure is a red run on main, never a blocked
# queue. A dispatch always runs. Beside them, every day, each CI lane's
# median job time against its budget. The whole workflow is held to fifteen
# minutes summed over its jobs.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tip:
        description: "Run the tip of the dispatched ref, not each saved test state's commit"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time; a dispatch during the scheduled run replaces it.
concurrency:
  group: nightly-main
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MISE_CARGO_BINSTALL_QUICKINSTALL: "true"
  MISE_CARGO_BINSTALL_NATIVE: "true"
  # Must match ci.yml and the image. The image checks the list at build time.
  MISE_DISABLE_TOOLS: "cargo:hotpath,github:j178/prek,github:max-sixty/worktrunk,github:nektos/act,github:orhun/git-cliff"
  # Empty selects the bare runner. A set value selects the pin-file tag,
  # and only a published tag is used: this workflow does not publish.
  GANDR_CI_IMAGE: ${{ vars.GANDR_CI_IMAGE }}

jobs:
  # Definitions only: aliases run in each consuming job's context. The
  # `needs` is what lets the aliases below name `needs.ci-image-ref`: a
  # job that declares no needs has no `needs` context, and the workflow
  # fails validation before any job starts.
  template:
    if: false
    needs: ci-image-ref
    # ci.yml's runner: the test states this workflow restores are its arm64
    # ones.
    runs-on: &linux ubuntu-24.04-arm
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      # A lane sets `CI_COMMIT` to the commit of the test state it restores.
      # Every other job checks out the run's own commit.
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CI_COMMIT }}
          fetch-depth: ${{ env.CI_FETCH_DEPTH || '1' }}
      - &trust-workspace
        name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - &find-image
        id: image
        name: find the published image
        uses: ./.github/actions/find-image # zizmor: ignore[self-repository]
        with:
          enabled: ${{ env.GANDR_CI_IMAGE != '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - &install-policy-tools
        name: install mise-managed policy tools
        if: ${{ needs.ci-image-ref.outputs.ref == '' }}
        uses: ./.github/actions/install-tools # zizmor: ignore[self-repository]
      - &setup-rust
        name: setup rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: ${{ needs.ci-image-ref.outputs.ref == '' }}
          cache-save: false
      # The ci.yml test-state restore: main's newest complete test state of
      # this toolchain generation, which Cargo's fingerprints bring up to
      # date. Only main's ci.yml push runs write it; this workflow reads.
      - &identify-build-state
        name: identify build-state inputs
        env:
          CI_STATE_INPUTS: ${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          CI_STATE_GENERATION: ${{ hashFiles('rust-toolchain.toml') }}
        run: printf 'CI_BUILD_FINGERPRINT=%s\nCI_BUILD_GENERATION=%s\n' "$CI_STATE_INPUTS" "$CI_STATE_GENERATION" >> "$GITHUB_ENV"
      - &restore-test-state
        name: restore complete test state
        uses: ./.github/actions/restore-test-state # zizmor: ignore[self-repository]
      # Whether the state came down, tested once in the shell: `hashFiles`
      # over a tarball reads the whole archive inside the expression engine,
      # whose 120 s budget a large state exceeds.
      - &find-build-state
        name: find the restored build state
        shell: bash
        run: if [[ -e "build-state-$CI_BUILD_STATE.tar.zst" ]]; then echo CI_BUILD_STATE_FOUND=true >> "$GITHUB_ENV"; fi
      # Each source unchanged since the state was built is dated before it,
      # so a build script's inputs read as fresh (ci.yml's anchor, #3206).
      - &unpack-build-state
        name: unpack build state
        if: &state-found ${{ env.CI_BUILD_STATE_FOUND == 'true' }}
        shell: bash
        run: |
          zstd -dc "build-state-$CI_BUILD_STATE.tar.zst" | tar -xf -
          mise run --quiet ci:sources-restamp
      # The dependency cache also holds Cargo's registry; this fills it.
      - &fetch-dependencies
        name: fetch locked dependencies
        if: *state-found
        run: cargo fetch --locked

  # A missing tag selects the bare runner; this workflow does not build the
  # image.
  ci-image-ref:
    name: resolve the CI image reference
    runs-on: *linux
    permissions: *image-read-permissions
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - *git-checkout
      - *find-image

  # The night runs each lane at the commit of main whose test state the lane
  # restores, so its build is warm by construction (#6863). Main keeps one
  # cache entry per state (`ci:delete-superseded`), and the entry's key ends
  # in the commit that saved it. A push of main saves its states 7 to 19
  # minutes after the move, so the tip can be newer than every saved state,
  # and a lane at the tip rebuilds a cycle of landings. The enforcing state's
  # commit is the night's commit. A dispatch with `tip` runs the tip of its
  # ref, which a probe of a branch's own sources needs. With no entry of a
  # state, its lanes run the tip as well.
  #
  # The scheduled run measures only when the night's commit moved since the
  # last successful run; a dispatch always runs. Each run records the commit
  # it covers as the artifact `night-commit`, a run that skipped the lanes
  # included, so the comparison stays exact across skips, and a failed lane
  # runs again the next day. A last run with no record compares its tip.
  freshness:
    name: choose the night's commit and whether it moved
    runs-on: *linux
    permissions:
      actions: read
    outputs:
      enforcing: ${{ steps.states.outputs.enforcing }}
      plain: ${{ steps.states.outputs.plain }}
      stale: ${{ steps.compare.outputs.stale }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: states
        name: find the commit of each saved test state
        if: ${{ !inputs.tip }}
        env:
          PREFIX: gandr-v3-test-state-${{ runner.os }}-${{ runner.arch }}-
        run: >-
          gh cache list --ref refs/heads/main --key "$PREFIX" --limit 100 --json key,createdAt
          --jq 'def newest($state): map(select(.key | startswith(env.PREFIX + $state + "-")))
          | max_by(.createdAt) | .key // "" | split("-") | last;
          "enforcing=\(newest("cargo-test-enforcing"))", "plain=\(newest("cargo-test-plain-only"))"'
          >> "$GITHUB_OUTPUT"
      - id: compare
        name: compare the night's commit against the last successful run
        shell: bash
        env:
          NIGHT: ${{ steps.states.outputs.enforcing || github.sha }}
        run: |
          found=$(gh run list --workflow nightly.yml --branch main --status success --limit 1 \
            --json databaseId,headSha --jq '.[0] // {} | "\(.databaseId // "") \(.headSha // "")"')
          read -r run last <<< "$found"
          if [[ -n $run ]] && gh run download "$run" --name night-commit --dir "$RUNNER_TEMP/last"; then
            last=$(<"$RUNNER_TEMP/last/commit")
          fi
          mkdir -p "$RUNNER_TEMP/night"
          printf '%s\n' "$NIGHT" > "$RUNNER_TEMP/night/commit"
          printf 'stale=%s\n' "$([[ $NIGHT != "${last:-}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf 'The night runs `%s`. The tip of `%s` is `%s`. The last successful night covers `%s`.\n' \
            "$NIGHT" "$GITHUB_REF_NAME" "$GITHUB_SHA" "${last:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: record the night's commit
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: night-commit
          path: ${{ runner.temp }}/night/commit
          retention-days: 30

  # The sweeps restore main's enforcing test state, which Cargo's
  # fingerprints bring up to date, and run the nightly task. The plain build
  # of the whole test graph costs six minutes on its own; the sweeps run
  # enforced alone, as every pull-request lane runs their samples. The job's
  # share of the nightly's 900 s is 611 s: 504 s for the sweeps and 107 s for
  # the recovery sweep, each its time in nightly 40667395217 scaled by
  # 900/818, as every job's share is (#3013). A night's slice of a rotating
  # sweep costs what its sources cost, so one night's sweeps can run past the
  # share while the whole nightly stays within 900 s. A sweep that reaches
  # its 240 s limit ends and passes, and the job uploads its JUnit report for
  # `reports` to file (#3975).
  #
  # The recovery sweep (`mise run ledger:recovery`, #1782) runs in this job
  # after the sweeps, from the same enforcing state, so one container start
  # and one restore serve both (#6704). Each of them runs once the setup
  # passes, whatever the other gives. The rotation of the sweeps (#6704)
  # holds the two together at about 5 minutes, inside the job's 15. The
  # recovery sweep covers every literal tile of every syntax exemplar, missed
  # and deleted. Its causes and counts are the job summary, the whole backlog
  # visible whether or not it is filed; the report goes to `reports`, which
  # holds the write token. The sweep runs the driver the restored test build
  # links, resolved as that state was, so the step is the sweep: 7175
  # mutants on one thread take 20 s locally (#3289).
  sweeps:
    name: sweep the night's inputs, specifications enforced
    needs: [ci-image-ref, freshness]
    if: &main-moved ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.freshness.outputs.stale == 'true') }}
    runs-on: *linux
    permissions: *image-read-permissions
    container: &ci-image ${{ needs.ci-image-ref.outputs.ref }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 15
    env:
      CI_BUILD_STATE: cargo-test-enforcing
      CI_COMMIT: ${{ needs.freshness.outputs.enforcing }}
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - *identify-build-state
      - *restore-test-state
      - *find-build-state
      - *unpack-build-state
      - *fetch-dependencies
      - id: night-sweeps
        name: run the night's sweeps
        run: mise run ci:sweeps-nightly
      - name: upload the sweeps' test report
        if: ${{ always() }}
        continue-on-error: true
        uses: *upload-artifact
        with:
          name: junit-sweeps
          path: target/nextest/nightly/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: sweep the exemplars for recovery
        if: &swept ${{ !cancelled() && steps.night-sweeps.outcome != 'skipped' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/enforcing
          CARGO_UNSTABLE_FEATURE_UNIFICATION: "true"
          CARGO_RESOLVER_FEATURE_UNIFICATION: workspace
        shell: bash
        run: |
          mkdir -p recovery.out
          .config/mise/enforcing mise run ledger:recovery recovery.out/report.txt > recovery.out/causes.txt
          {
            echo '## Recovery sweep'
            echo
            grep -e ' mutants swept: ' recovery.out/causes.txt
            echo
            sed -n 's/^cause: /- /p' recovery.out/causes.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the recovery report
        if: *swept
        uses: *upload-artifact
        with:
          name: recovery-report
          path: recovery.out/report.txt
          retention-days: 7

  # Each crate's tests with every feature it declares on, one of those crates
  # a night (`mise run ci:all-features` says which), in the plain lane's
  # restored test state. The sweeps sample as on a landing that changed no
  # source. A feature-gated test that fails here is filed as a defect, never
  # skipped (#1785). The job's share of the nightly's 900 s is 147 s, its
  # 134 s in nightly 40667395217 scaled by 900/818 (#3013). One crate a night
  # builds about its own closure; a crate whose night stays past the share
  # gets its own saved build state (#3288).
  all-features:
    name: test every crate with every feature on
    needs: [ci-image-ref, freshness]
    if: *main-moved
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 15
    env:
      CI_BUILD_STATE: cargo-test-plain-only
      CI_COMMIT: ${{ needs.freshness.outputs.plain }}
      GANDR_SWEEP_BASE: HEAD
      NEXTEST_PROFILE: ci
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - *identify-build-state
      - *restore-test-state
      - *find-build-state
      - *unpack-build-state
      - *fetch-dependencies
      - name: run the night's crates' tests with every feature on
        run: mise run ci:all-features

  # The night's reports and filings run as one job, each its own step, so
  # one container start serves them (#3208): a start costs 20 to 25 s, and
  # the lane budget, the recovery filing and the reports did a minute or less
  # of work each once the dependency report read in one pass (#3192). The job
  # waits on the recovery sweep for the causes it files. A failing step hides
  # none after it: each runs unless the run was cancelled, and the lane
  # budget runs last.
  #
  # The recovery sweep's causes, filed (`mise run ci:recovery-file`): one
  # issue per first error and mutation kind, at most three new a night, a
  # cause already filed skipped. Only the scheduled run files; a dispatch
  # prints what it would file. The report comes from the sweeps job, so
  # filing builds nothing.
  #
  # The dependency report (`mise run report:deps`, #2902): every open epic
  # set blocked by its open sub-issues, then each dependency an open issue
  # states (an `## After` item, prose naming an open issue, an epic's open
  # sub-issue) that GitHub does not record, on one `report: dependencies`
  # issue. Then the obligations report (`mise run report:obligations`,
  # #2886): how the month's merged pull requests answered their obligations,
  # by lane and week, on one `report: obligations, <month>` issue. Only the
  # scheduled run writes; a dispatch prints the reports. They read the
  # tracker alone, so they build nothing. The obligations report's search
  # leaves out every pull request the token cannot read, and writes zeros
  # rather than failing, so the job grants `pull-requests: read` (#3576).
  # Then the dead-weight report (`mise run report:dead-weight`, #2891): each
  # crate's items with no caller outside tests and its exported items with no
  # use in another crate, on one `refactor(<crate>): dead weight` issue a
  # crate. It reads the newest landed merge group's `evidence-records`
  # artifact, so it builds nothing. It blames each item's lines, so the job
  # checks out the whole history (`CI_FETCH_DEPTH`).
  # Then the prose report (`mise run report:prose`, #3591): each open issue
  # body and each open pull request body that breaks a body rule, on one
  # `report: prose` issue. It builds the `prose` binary and parses under the
  # spaCy venv `check:prose` pins, restored from the cache the merge group's
  # prose lane saves. Then the threads outside the pool (`mise run
  # report:threads`, #3610): each site that states why it owns a thread, with
  # its reason, in the job summary. It reads the tree alone, in under a
  # second.
  # The dependency and prose reports read the open issues and pull requests
  # from one read of them (`mise run issues:open`, #5681), 8 pages, in place
  # of 8 pages each, and each runs only when that read succeeds.
  #
  # Each lane's median job time over the newest ten runs of ci.yml that hold
  # it, against its budget, as the job summary and on one issue while any
  # lane is over (`mise run ci:lane-budget`). Alerting, never a gate:
  # nothing waits on this job, and the lane budget fails no run. The nightly's
  # sum is reported past 900 s, its budget, and a night past 1200 s, its
  # ceiling, is a row of the same issue (#3013, #6704). A budget changes
  # with its lane's shape, in the same commit; the name is the job's display
  # name. Each budget is about 1.5 times the lane's median once build state
  # was pruned, the toolchain installed once and Clippy given its own state.
  # This job's share of the nightly's 900 s is 113 s, its 103 s in nightly
  # 40667395217 scaled by 900/818 (#3013). The lane budget reads the runs'
  # jobs eight at a time (#3290), and a read GitHub answers with a server
  # error is read again (#3492).
  #
  # A merge group on `landing` skips the test lanes, so only the
  # `integration` cycle holds them (#2547). The enforcing shards, their join,
  # the plain lane and the two documentation lanes are `--integration`
  # budgets, held over the cycle's dispatches. A cycle carries the changes of
  # many landings, so each shard keeps its deep budget, and each other lane
  # its one budget. A push to `main` builds every package, and no gate waits
  # on it. So the report tables the same lanes over the pushes to `main` as
  # information, with no budget.
  #
  # A lane of the landing window is held by the cone a landing touched: deep
  # when it changed a file under crates/kernel-* or crates/core-*,
  # Cargo.lock, rust-toolchain.toml or .cargo/, surface otherwise. A deep
  # landing rebuilds the whole enforcing graph and takes longer than a
  # surface one, so one budget is wrong on both sides; each class is held to
  # its own.
  # The deep budget is the surface one plus the measured cost of the extra
  # units a deep landing rebuilds. The enforcing shards' budgets scale the
  # lane's by each shard's share of the arm64 probe's deep rebuild and suite
  # (#702): checker 0.41, rest 0.26, and the surface shard's 0.51 split as
  # engine 0.37 and faces 0.32, each its setup, two thirds of the one
  # shard's build and its own tests' share (#1177); a join is setup,
  # transfer and the witness listing. The dispatcher shard took the engine
  # shard's longest chain and three quarters of its tests (#2148), so it
  # holds the engine's budgets and the engine keeps them as a bound; the
  # lowering shard took the checker shard's longest unit, the lowering's
  # library tests, so it holds the checker's in the same way. The
  # steps it repeats, about 175 s: setup, restore, the parser's tests' build
  # and the 77 s sweep, until ten hosted runs give it a median; the plain
  # lane's stands. The macOS lanes run in the daily run and on a dispatch,
  # which this job does not sample. The mutants lanes are off (#3695), so
  # their budgets went with them: the change report's 300 s and the daily
  # crate's 840 s held over `--daily`, its job's own limit. Both come back
  # with the lanes. This workflow's own all-features lane is held over its
  # scheduled runs (`--nightly`): about 1.5 times the 194 to 216 s each
  # third of the all-features crates took on a dispatch. The
  # hosted budget is this workflow's summed job time per run (`--summed`): 15
  # minutes for its median, 20 the ceiling no night passes; the table times
  # every active workflow and reads the cache's usage.
  reports:
    name: report and file the night's findings
    needs: [ci-image-ref, sweeps]
    if: ${{ !cancelled() && needs.ci-image-ref.result == 'success' }}
    runs-on: *linux
    permissions:
      contents: read
      packages: read
      actions: read
      issues: write
      pull-requests: read
    container: *ci-image # zizmor: ignore[unpinned-images]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_FETCH_DEPTH: "0"
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RECOVERY_FILE: ${{ github.event_name == 'schedule' && 'file' || '' }}
      RECOVERY_REPORT: recovery.out/report.txt
      REPORT_FILE: ${{ github.event_name == 'schedule' && 'file' || '' }}
    steps:
      - *git-checkout
      - *trust-workspace
      - *install-policy-tools
      - *setup-rust
      - name: download the recovery report
        if: &recovered ${{ !cancelled() && needs.sweeps.result != 'skipped' }}
        uses: &download-artifact actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-report
          path: recovery.out
      - name: file the recovery sweep's causes
        if: *recovered
        run: mise run ci:recovery-file
      # A sweep that reached its 240 s limit, filed on its own collector as
      # the merge queue files a slow test (`mise run ci:slow-file`, #3975):
      # a timeout obligates triage and never turns the night red. A dispatch
      # files too, so the night it measures is on the board.
      - name: download the sweeps' test report
        id: swept
        if: ${{ !cancelled() && needs.sweeps.result != 'skipped' }}
        continue-on-error: true
        uses: *download-artifact
        with:
          name: junit-sweeps
          path: target/test-timing/${{ github.run_id }}/junit-sweeps
      - name: file the sweeps that reached their limit
        if: ${{ !cancelled() && steps.swept.outcome == 'success' }}
        env:
          SLOW_BUDGET: "240"
          SLOW_FILE: "true"
          SLOW_REASON: "in the nightly sweeps, its limit. nextest ends such a sweep and passes it, so a timeout never turns the night red (#3975)."
          SLOW_RUN_ID: ${{ github.run_id }}
          SLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: mise run ci:slow-file
      # The open issues and pull requests, read once for the reports that read
      # them (#5681): 8 pages of 719 on 2026-11-06. Each such report reads
      # the file `OPEN_ISSUES` names, and it runs only when the list is read.
      - name: list the open issues for the reports
        id: open-issues
        if: &not-cancelled ${{ !cancelled() }}
        run: mise run issues:open "$RUNNER_TEMP/open-issues.json"
      - name: report the dependencies
        if: &listed ${{ !cancelled() && steps.open-issues.outcome == 'success' }}
        env: &open-issues
          OPEN_ISSUES: ${{ runner.temp }}/open-issues.json
        run: mise run report:deps
      - name: report the obligations answered
        if: *not-cancelled
        run: mise run report:obligations
      - name: report the dead weight
        if: *not-cancelled
        run: mise run report:dead-weight
      - name: locate the prose tools
        id: prose-tools
        if: *not-cancelled
        shell: bash
        run: |
          printf 'installs=%s/installs\n' "${MISE_DATA_DIR:-$HOME/.local/share/mise}" >> "$GITHUB_OUTPUT"
          printf 'pins=%s\n' "$(sed -n '/^\["check:prose"\]/,/^usage/p' .config/mise/tasks/mise-tasks-check.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: restore the prose tools
        if: *not-cancelled
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.prose-tools.outputs.installs }}/python
            ${{ steps.prose-tools.outputs.installs }}/github-astral-sh-uv
            ${{ steps.prose-tools.outputs.installs }}/pipx-spacy
          key: prose-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.prose-tools.outputs.pins }}
      - name: report the prose of the open bodies
        if: *listed
        env: *open-issues
        run: mise run report:prose
      - name: list the threads outside the pool
        if: *not-cancelled
        run: mise run --quiet report:threads >> "$GITHUB_STEP_SUMMARY"
      - name: compare each lane with its budget
        if: *not-cancelled
        run: >-
          mise run ci:lane-budget --issue "CI lane budgets"
          --integration "test enforcing targets (linux, dispatcher)=250"
          --integration "test enforcing targets (linux, engine)=250"
          --integration "test enforcing targets (linux, faces)=215"
          --integration "test enforcing targets (linux, checker)=285"
          --integration "test enforcing targets (linux, lowering)=285"
          --integration "test enforcing targets (linux, rest)=200"
          --integration "join the enforcing shards (linux)=120"
          --integration "test plain-only targets (linux)=160"
          --budget "sweep the recovery records (linux)=260"
          --integration "document the workspace (linux)=150"
          --integration "test the documentation examples (linux)=200"
          --budget "check quenchant compiler policy=180"
          --budget "check Clippy wall=150"
