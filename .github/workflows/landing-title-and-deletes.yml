# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: landing-title-and-deletes

# Pull requests land as merge commits titled from the pull request, so the
# title is the header that reaches main. landing-checks.yml lints each authored commit and
# never a merge; this workflow lints the title with the same rules, on the
# pull request and again in the merge queue. Its own workflow, because an
# edited title must re-run the check alone: an `edited` run of landing-checks.yml would
# repeat every lane or report them skipped, and a skipped check counts as
# passed.
#
# In a merge group the job is the queue's required check of each entry's
# text (#6883): the header, the authored commits, the issues the entries
# close against the features ledger, and the account of what each entry
# takes out. Each check takes seconds and reads what the entries change,
# never the whole tree.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group: {}

permissions:
  contents: read

# A newer edit or push supersedes a pull request's pending title check. A
# queue entry has its own ref, so its run is never cancelled.
concurrency:
  group: pr-title-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commitlint config's title mode: no author, no trailers, nothing
  # ignored (commitlint.config.mjs).
  COMMITLINT_TITLE: "1"
  # commitlint, and the pinned sqlite3 of the features ledger's check: aube
  # installs the npm package, node runs it.
  MISE_ENABLE_TOOLS: "node,github:aubepkg/aube,npm:@commitlint/cli,conda:sqlite"

jobs:
  # Definitions only: aliases run in each consuming job's context.
  template:
    if: false
    # landing-checks.yml's runner: arm64 wherever the architecture does not matter.
    runs-on: &linux ubuntu-24.04-arm
    permissions: {}
    steps:
      # The config comes from the checkout; the merge group also reads HEAD.
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # The shared mise pin, scoped by MISE_ENABLE_TOOLS. No cache: this
      # workflow never runs on main, and caches written by pull request and
      # queue refs are visible to no other ref.
      - &install-commitlint
        name: install commitlint
        uses: ./.github/actions/install-tools # zizmor: ignore[self-repository]
        with:
          cache: "false"
      # The signers of a `deleted` row are the factory's state and not the
      # tree's (#6962). The repository variable holds them, and the owner
      # alone sets it. The step writes them where `check:deletes` reads them
      # on a host, and prints nothing of them. With no variable it writes
      # nothing, and the check refuses by name with the path to write.
      - &write-delete-signers
        name: write the signers of a deletion
        if: ${{ github.event_name == 'merge_group' && vars.GANDR_DELETE_SIGNERS != '' }}
        shell: bash
        env:
          GANDR_DELETE_SIGNERS: ${{ vars.GANDR_DELETE_SIGNERS }}
        run: install -D -m 644 /dev/stdin "${XDG_CONFIG_HOME:-$HOME/.config}/gandr/architects.txt" <<< "$GANDR_DELETE_SIGNERS"

  title:
    name: lint the pull request title
    # A Renovate pull request never lands: its update reaches main through
    # a maintainer's pull request, so it runs no CI. A push changes no title:
    # the check skips, so it holds at once on the new head, GitHub's own
    # rebase of a stack member among them (#2070); the queue lints the
    # header that lands. An edit that changes no title, an edit of the body
    # alone, skips for the same reason (#6774). `check:workflow-hashing`
    # refuses a job on `edited` whose condition reads no field of
    # `github.event.changes`.
    if: ${{ github.actor != 'renovate[bot]' && github.event.action != 'synchronize' && (github.event.action != 'edited' || github.event.changes.title) }}
    runs-on: *linux
    timeout-minutes: 5
    # The title as it stands is read from the API: a re-run repeats its
    # event, so the event's title is the one it was edited from (#5777).
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - *git-checkout
      - *install-commitlint
      # The read of the title runs apart from commitlint, so a failed read
      # names itself and commitlint never lints an empty input (#6774).
      - name: lint the title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: .config/pr-title/lint.bash "$PR_NUMBER"
      # The queue of `landing` groups by HEADGREEN: a green group lands every
      # entry below it. So each step below reads every entry of the group,
      # never `HEAD` alone (#6839): the green group of pull request 6836
      # landed 6835, whose own account was red. The walk lists each merge on
      # the first-parent line from the group's base, and a base that the
      # fetch does not reach is refused.
      - name: list the entries of the merge group
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: .config/queue/entries.bash --fetch "$GITHUB_SHA" "$GROUP_BASE" > "$RUNNER_TEMP/entries"
      # One read of each entry's body serves the ledger's check and the
      # account of what the entry takes out (#6883).
      - name: read the body of each entry
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .config/queue/bodies.bash "$RUNNER_TEMP/entries" "$RUNNER_TEMP/bodies"
      # Each queue merge commit lands; a title edited after the pull
      # request's check is caught here. GitHub appends ` (#N)` to the title,
      # which is stripped so both checks lint the same header. Bash, for
      # pipefail: a failed git log must fail the step.
      - name: lint the merge commit header
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: |
          status=0
          while read -r merge number _; do
            echo "pull request #$number:"
            git log -1 --format=%s "$merge" | sed -E 's/ \(#[0-9]+\)$//' | mise exec -- commitlint || status=1
          done < "$RUNNER_TEMP/entries"
          exit "$status"
      # The commit rules over each entry's authored commits, as the gate of
      # `pr:open` reads them on the lane's host (#6883). The walk deepens the
      # shallow checkout until each head meets its merge's first parent.
      - name: lint the authored commits of each entry
        if: ${{ github.event_name == 'merge_group' }}
        run: .config/queue/commits.bash --fetch "$GITHUB_SHA" "$RUNNER_TEMP/entries"
      # The features ledger against the issues that the group closes
      # (#6883): pull request 6762 closed #3381 while a row still owed it,
      # and only the integration cycle read the tree it landed.
      - name: check the features ledger against the issues the group closes
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_BASE: ${{ github.event.merge_group.base_sha }}
          LEDGER_BODY: ${{ runner.temp }}/bodies
        run: mise exec -- .config/ledger/check.bash
      - *write-delete-signers
      # The account of what each pull request takes out of the tree (#6817),
      # read again where it lands: a body edited, or a head pushed past the
      # architect's sign-off, is refused. `pr:open` read the records of both
      # sides; the queue reads the rows and the sign-offs alone, each entry
      # against its own head, so the entries ahead of it move no sign-off.
      - name: read the account of what the change takes out
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .config/deletes/queue.bash "$RUNNER_TEMP/entries" "$RUNNER_TEMP/bodies"
