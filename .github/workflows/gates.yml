# The four whole gates of the trunk, on the hosted runners for Linux x86-64.
# Each gate is one job, and the name of the job is the name of its check.
#
# The queue of the maintainers lands each pull request of a branch of this
# repository after its own gates. This workflow runs the four gates on each
# push to `main` after the landing, and on each pull request of a fork, which
# that queue does not gate. A pull request of a branch of this repository runs
# no job.
#
# The gates restore the Cargo target directory of their own gate. Cargo
# compares sources by content (`.cargo/config.toml`), so a restored unit whose
# source did not change stays fresh under the new dates of the checkout. Only
# a run on `main` saves a cache: a pull request of a fork reads the cache of
# `main`.
#
# kache stands in front of rustc. It gets each unit that the target directory
# lacks from the OCI repository `ghcr.io/<this repository>/kache`, when a run
# of `main` compiled that unit before. kache writes to the repository only on
# a push to a protected branch, and only the job of a push to `main` has the
# permission to write packages. The token of a pull request of a fork can
# only read.
name: gates

on:
  # A draft runs no gate. Marking it ready starts the first run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# `main` has one run at a time. A push while a run is in progress waits, and
# a newer push replaces the push that waits, so the run after it gates the
# newest `main`. A push to a pull request ends its run that is not done.
concurrency:
  group: gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The cache holds no incremental state. A restored unit with the same
  # source content is fresh without it.
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: ${{ matrix.gate }}
    # A pull request runs only from a fork, and not as a draft.
    if: >-
      ${{ github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name != github.repository
      && !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # GitHub gives the token of a pull request of a fork read access only,
    # whatever this block asks. So only a push to `main` can write packages.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: plain suite
            slug: plain
            target: target
            nextest: true
            run: cargo nextest run --workspace --locked --no-fail-fast
            timing: cargo run --locked --package gandr-workflow-test-timing --
          # `.config/mise/enforcing` sets the flag that runs each `#[spec]`
          # clause. The suite has a target directory of its own, with an
          # absolute path: a test that starts Cargo in the directory of a crate
          # takes the same directory. The timing tool builds in it with the
          # same flags, so it reuses the units of the suite.
          - gate: enforcing suite
            slug: enforcing
            target: target/enforcing
            nextest: true
            run: >-
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/enforcing"
              CARGO_UNSTABLE_FEATURE_UNIFICATION=true
              .config/mise/enforcing cargo nextest run --workspace --locked
              --config 'resolver.feature-unification="workspace"' --no-fail-fast
            timing: >-
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/enforcing"
              CARGO_UNSTABLE_FEATURE_UNIFICATION=true
              .config/mise/enforcing cargo run --locked
              --config 'resolver.feature-unification="workspace"'
              --package gandr-workflow-test-timing --
          - gate: Clippy
            slug: clippy
            target: target
            run: cargo clippy --workspace --all-targets --locked
          # The format gate builds nothing, so it has no target cache. It saves
          # the toolchain for the other gates.
          - gate: cargo fmt
            slug: fmt
            toolchain-save: true
            run: cargo fmt --all --check
    steps:
      - name: check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A sweep test lists the corpus sources that the change touches by a
      # diff from `GANDR_SWEEP_BASE`. The base is the commit that the event
      # changes: the head of `main` before the push, or the base of the pull
      # request. The checkout holds one commit, so the step fetches the base
      # alone.
      - name: fetch the sweep base
        if: ${{ matrix.nextest }}
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          echo "GANDR_SWEEP_BASE=$BASE" >> "$GITHUB_ENV"
      # The key hashes the pin file, so a change of the pin is a new cache.
      - name: restore the toolchain
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains/*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      # With no argument, rustup reads `rust-toolchain.toml`: its channel, its
      # components and its profile.
      - name: install the toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: save the toolchain
        if: ${{ matrix.toolchain-save && github.event_name == 'push' && steps.toolchain.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains/*
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      # Each Linux build links with mold (`.cargo/config.toml`).
      - name: install mold
        if: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold
      # The version of the pin in `mise.toml`.
      - name: install cargo-nextest
        if: ${{ matrix.nextest }}
        run: curl --proto '=https' --tlsv1.2 -fsSL https://get.nexte.st/0.9.150/linux | tar -xzf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      # The release asset of kache, checked against its pinned digest. The
      # archive has the client and its engine, which work only as a pair.
      - name: install kache
        if: ${{ matrix.target }}
        env:
          KACHE_VERSION: v2.2.0
          KACHE_SHA256: eeb6e72b9f55d0e9d61cae0789ffa8f3ab8c33bef166b7af655cc0806447ebac
        run: |
          archive="$RUNNER_TEMP/kache.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/kunobi-ninja/kache/releases/download/$KACHE_VERSION/kache-x86_64-unknown-linux-musl.tar.gz"
          echo "$KACHE_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin" kache kache-engine
          config="$RUNNER_TEMP/kache.toml"
          printf '[cache.remote]\ntype = "oci"\nrepository = "ghcr.io/%s/kache"\nprefix = "gates"\n' "${GITHUB_REPOSITORY,,}" > "$config"
          {
            echo "KACHE_CONFIG=$config"
            echo "RUSTC_WRAPPER=kache"
          } >> "$GITHUB_ENV"
          kache --version
      # The newest cache of `main` for this gate, the toolchain and the lock
      # file; else the newest one for this gate and the toolchain. nextest
      # keeps its store in `target/nextest` whatever `CARGO_TARGET_DIR` says,
      # so the enforcing suite keeps that directory beside its own.
      - name: restore the target directory
        id: target
        if: ${{ matrix.target }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.target }}
            ${{ matrix.target != 'target' && 'target/nextest' || '' }}
          key: gate-${{ matrix.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            gate-${{ matrix.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            gate-${{ matrix.slug }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      # A build fetches the crates of the host alone. A test of the driver
      # resolves its tree for `wasm32-wasip3` with `--offline`, so the suites
      # fetch the crates of each target first.
      - name: fetch the crates of each target
        if: ${{ matrix.nextest }}
        run: cargo fetch --locked
      # The slowest tests start first. The store of nextest keeps the JUnit
      # report of the last run of the suite, and `test-timing` turns it into a
      # nextest tool configuration with the priority of each slow test
      # (`.config/nextest.toml`). With no report, the configuration holds no
      # priority. When the tool fails, the suite runs in the order of nextest.
      #
      # The variable `PRIORITIES` is one word. It joins the option and its value
      # with `=`.
      - name: set the priorities
        if: ${{ matrix.nextest }}
        env:
          KACHE_OCI_USERNAME: ${{ github.actor }}
          KACHE_OCI_PASSWORD: ${{ github.token }}
          REPORT: ${{ github.workspace }}/target/nextest/default/junit.xml
        run: |
          if ${{ matrix.timing }} --junit "$REPORT" --write "$RUNNER_TEMP/priorities.toml"; then
            echo "PRIORITIES=--tool-config-file=test-timing:$RUNNER_TEMP/priorities.toml" >> "$GITHUB_ENV"
          else
            echo "::notice title=priorities::test-timing failed, so the suite runs in the order of nextest"
          fi
      # A gate with no priorities gets no word for them.
      - name: run the gate
        env:
          KACHE_OCI_USERNAME: ${{ github.actor }}
          KACHE_OCI_PASSWORD: ${{ github.token }}
        run: ${{ matrix.run }} ${PRIORITIES:+"$PRIORITIES"}
      # The tree tracks no file of an output or a ratchet of the list of
      # artifacts. The run of the gate leaves the checkout clean. A file that a
      # test writes and that the list does not have shows itself here.
      #
      # - see: `.config/replay/artifacts.json`
      - name: hold the tree to the list of artifacts
        if: ${{ matrix.target }}
        run: |
          cargo run --locked --quiet --package gandr-workflow-artifacts --bin artifacts -- tracked
          cargo run --locked --quiet --package gandr-workflow-artifacts --bin artifacts -- clean
      # The JUnit report of each run of `main`, with the time of each test. A
      # reader of the times of the suites downloads it as `junit-<slug>`.
      - name: keep the times of the tests
        if: ${{ always() && matrix.nextest && github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.slug }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      # The daemon sends each queued upload before it ends, and the runner
      # then goes away. The counts show the hits of the run.
      - name: stop kache
        if: ${{ always() && matrix.target }}
        run: |
          kache stats || true
          kache daemon stop
      - name: save the target directory
        if: ${{ always() && matrix.target && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.target }}
            ${{ matrix.target != 'target' && 'target/nextest' || '' }}
          key: ${{ steps.target.outputs.cache-primary-key }}
