# One grouped pull request per ecosystem per week, for releases at least a
# week old. CI skips dependabot's pull requests; one that needs no code
# change is queued as it stands, and the merge group runs CI on it. Each
# ecosystem's prefix is a commitlint type and scope, so the merge commit's
# header passes the `PR title` check; a title over 72 characters is
# shortened before it is queued.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(repo)
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(ci)
    groups:
      actions:
        patterns: ["*"]
