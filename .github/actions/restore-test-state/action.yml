name: "restore complete test state"
description: >
  A test lane's build state, `build-state-<lane>.tar.zst`, restored from the
  cache under the one key format every workflow reads: the exact state of this
  commit's inputs, else the newest state of the toolchain generation, which
  Cargo's fingerprints bring up to date. Workflow anchors cannot cross files,
  so the key lives here. The caller sets `CI_BUILD_STATE`,
  `CI_BUILD_GENERATION` and `CI_BUILD_FINGERPRINT` first (ci.yml's `identify
  build-state inputs`); ci.yml's `ci:delete-superseded` step names the same
  prefix.
inputs:
  lookup-only:
    description: "Report a match without downloading it"
    default: "false"
outputs:
  cache-hit:
    description: "`true` on an exact key match"
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    description: "The key restored, exact or by prefix"
    value: ${{ steps.restore.outputs.cache-matched-key }}
  cache-primary-key:
    description: "The exact key, which a save of this state uses"
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - id: restore
      name: "restore complete test state"
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build-state-${{ env.CI_BUILD_STATE }}.tar.zst
        key: gandr-v3-test-state-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_BUILD_STATE }}-${{ env.CI_BUILD_GENERATION }}-${{ env.CI_BUILD_FINGERPRINT }}-${{ github.sha }}
        restore-keys: gandr-v3-test-state-${{ runner.os }}-${{ runner.arch }}-${{ env.CI_BUILD_STATE }}-${{ env.CI_BUILD_GENERATION }}-
        lookup-only: ${{ inputs.lookup-only }}
